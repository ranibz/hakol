<!DOCTYPE html>
<!-- agron/edit.html · v1.6.0 · 2026-08-02 · עורך האגרון: בחירת מושג מרשימה ועריכת ההגדרה, או הוספת מושג חדש. כותב לטבלה concepts ב-Supabase matalot, ולכן כל שינוי מופיע מיד בכל השיעורים שמושכים משם. תיקון: שמירה שנחסמה על ידי RLS הציגה "נשמר" כי Supabase מחזיר 200 עם גוף ריק — עכשיו נדרשת החזרת השורה ואימות שהערך תואם. התצוגה המקדימה משתמשת עכשיו ב-CSS האמיתי של האגרון — טבלאות, קופסאות דוגמאות וכותרות נראות בדיוק כפי שהתלמיד יראה, וגם בחלון ההדבקה יש תצוגה מקדימה חיה. נוסף ממיר מוורד: מדביקים טקסט רגיל והוא הופך ל-HTML במבנה האגרון — כותרת, רשימות עם הדגשה, קופסת דוגמאות וטבלאות. הגישה למנהל המערכת בלבד. v1.3.0: תיקון הריבועים ליד הבולטים — תווי הבולט של וורד (Private Use U+F0xx, •, o, ▪) מנוקים מכל טקסט; הטבלאות, קופסאות הדוגמאות והכותרות מקבלות עיצוב מוטמע (inline style) ולכן נראות זהה בכל שיעור שמושך את ההגדרה, גם בלי CSS בדף המארח; נוסף כפתור "ניקוי ועיצוב" לתיקון מושגים ישנים, וניקוי אוטומטי בשמירה. v1.4.0: המילה המובילה בכל פריט רשימה מודגשת וכהה יותר — גם כשהמפריד הוא מקף ולא נקודתיים, וגם כשהפריט הוא מונח בודד; פסקאות שהגיעו מוורד עם תו בולט מאוחדות אוטומטית לרשימה אחת. v1.5.0: טיפול במושגים כפולים. אותו מושג נכתב מחדש בכל זירה שבה הוא מופיע, ולכן קיימות שורות עם slug של -2/-3; מיפוי קבצי הזירות הראה שכל זירה מפנה ל-slug אחר, ולכן מחיקת שורה שוברת את הזירה שמצביעה אליה. נוסף מסך איחוד שמציג את הגרסאות זו לצד זו, מסמן איזו שונה ומעתיק את הנבחרת לכל השורות בלי למחוק אף אחת. שמירה רגילה מסנכרנת אוטומטית לכל השורות של אותו מושג, יצירת מושג בשם קיים מציגה אזהרה, מחיקה מזהירה על זירות שיישברו, וברשימה מופיע סימון 🔗/⚠ למושגים כפולים. v1.5.1: הכלל הגלובלי input{width:100%} חל גם על radio/checkbox ולכן כפתור הבחירה במסך האיחוד תפס את כל רוחב השורה והטקסט נדחס לטור ברוחב מילה — נוסף כלל ייעודי שמחזיר להם גודל טבעי, ואזור התצוגה המקדימה הורחב ל-320 תווים עם גלילה. v1.6.0: במקום לבחור אחת הגרסאות הקיימות, כל מושג כפול מקבל תיבת עריכה שאליה מדביקים את הניסוח הנכון — כולל הדבקה ישירה מוורד שמומרת אוטומטית ל-HTML — והוא מוחל על כל השורות של המושג בבת אחת. נוספה תצוגה מקדימה, וכפתור "העתק לתיבה" בכל גרסה כדי להתחיל ממנה (MINOR) -->
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>עורך האגרון · הכל בכף היד</title>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--a:#2e7d32;--b:#7c3aed;--ink:#1f2340;--soft:#6a6f8a;--bg:#f6faf6;--line:#e2ebe3;
  --ok:#12b76a;--no:#dc2626;--warn:#c98a12}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Assistant',sans-serif;font-size:16px;line-height:1.6;padding-bottom:40px}
h1,h2,h3{font-family:'Secular One',sans-serif;font-weight:400}
.top{background:linear-gradient(135deg,#1b5e20,#2e7d32);color:#fff;padding:13px 0;position:sticky;top:0;z-index:30}
.topin{max-width:1120px;margin:0 auto;padding:0 15px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.topin h1{font-size:1.28rem;margin:0}
.topin .sb{opacity:.85;font-size:.85rem}
.wrap{max-width:1120px;margin:0 auto;padding:16px 15px}
.mid{max-width:430px;margin:60px auto;padding:0 15px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:13px}
label{display:block;font-weight:800;font-size:.83rem;margin-bottom:5px}
input,select,textarea{font-family:inherit;font-size:.96rem;border:1px solid #d5e0d6;border-radius:10px;
  padding:10px 12px;width:100%;background:#fff;color:var(--ink)}
textarea{min-height:220px;line-height:1.75;resize:vertical;font-family:ui-monospace,'Assistant',monospace;font-size:.92rem}
/* הכלל הגלובלי למעלה נותן width:100% לכל input — כולל radio/checkbox,
   מה שמעך את הטקסט שלצידם לטור ברוחב מילה. כאן מחזירים להם גודל טבעי. */
input[type=radio],input[type=checkbox]{width:auto;flex:0 0 auto;padding:0;margin:0;
  border:0;border-radius:0;background:none;accent-color:#2f7d4f;
  width:17px;height:17px;cursor:pointer}
textarea:focus,input:focus,select:focus{outline:2px solid var(--a);border-color:transparent}
.btn{background:var(--a);color:#fff;border:0;border-radius:10px;padding:10px 20px;font-family:inherit;
  font-weight:800;font-size:.9rem;cursor:pointer}
.btn:hover{filter:brightness(.93)}
.btn.g{background:#eef3ee;color:var(--ink)} .btn.b{background:var(--b)} .btn.no{background:var(--no)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.mini{background:#eef3ee;color:var(--a);border:0;border-radius:8px;padding:4px 11px;font-family:inherit;
  font-weight:800;font-size:.78rem;cursor:pointer}
.err{background:#fdecea;color:#9f1239;border-radius:10px;padding:11px 14px;font-weight:700;font-size:.89rem}
.grid{display:grid;grid-template-columns:290px 1fr;gap:14px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.list{max-height:60vh;overflow:auto;margin-top:9px}
.it{display:block;width:100%;text-align:right;background:#fff;border:1px solid var(--line);
  border-radius:10px;padding:9px 12px;margin-bottom:6px;font-family:inherit;font-size:.92rem;cursor:pointer}
.it:hover{border-color:var(--a)}
.it.on{background:#eef7ee;border-color:var(--a);font-weight:800}
.it small{display:block;color:var(--soft);font-size:.75rem;font-weight:400}
.two{display:grid;grid-template-columns:1fr 1fr;gap:13px}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.prev{background:#fff;border:1px solid var(--line);border-radius:11px;padding:15px 17px;min-height:220px;
  max-height:420px;overflow:auto;font-size:.95rem;line-height:1.7;color:#333}
/* ↓ הועתק מהאגרון עצמו, כדי שהתצוגה המקדימה תהיה זהה למה שהתלמיד רואה */
.prev p{margin:0 0 10px}
.prev ul,.prev ol{margin:0 0 12px;padding-inline-start:22px}
.prev li{margin-bottom:5px}
.prev .section-title{font-weight:bold;color:#2c3e50;margin-top:15px;margin-bottom:5px;
  display:block;text-decoration:underline}
.prev .section-title:first-child{margin-top:0}
.prev .example-box{background-color:#e8f5e9;padding:15px;border-radius:8px;margin:15px 0;
  border-right:4px solid #4caf50;font-size:.95rem}
.prev .table-wrapper{overflow-x:auto;margin-top:10px;margin-bottom:15px;border:1px solid #ddd;border-radius:5px}
.prev table{width:100%;border-collapse:collapse;min-width:340px;font-size:.9rem}
.prev th{background-color:#e0e0e0;font-weight:bold;text-align:right;padding:8px;border-bottom:2px solid #ccc}
.prev td{border-bottom:1px solid #eee;padding:8px;vertical-align:top}
.prev strong{color:#2c3e50}
.pill{display:inline-block;border-radius:20px;padding:2px 11px;font-size:.76rem;font-weight:800;
  background:#eef3ee;color:var(--a)}
.pill.w{background:#fdf3e2;color:#8a5a08} .pill.r{background:#fdecea;color:#9f1239}
.msg{font-weight:700;font-size:.89rem;margin-inline-start:auto}
.sub{color:var(--soft);font-size:.85rem}
.warnbox{background:#fdf3e2;color:#8a5a08;border-radius:10px;padding:10px 13px;font-size:.86rem;
  font-weight:700;margin-top:9px}
</style>
</head>
<body>
<div id="app"><div class="mid"><div class="card">טוען…</div></div></div>

<script>
const SUP="https://eubgzfkkovxgijhrmnif.supabase.co",
      KEY="sb_publishable_vJ768fOwYWiDWeYsBBR45g_4NM4s55p";
const el=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nrm=s=>String(s||'').replace(/\s+/g,' ').trim();
async function sb(q,m,b,x){
  const r=await fetch(SUP+'/rest/v1/'+q,{method:m||'GET',
    headers:Object.assign({apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},x||{}),
    body:b?JSON.stringify(b):undefined});
  if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,170));
  const t=await r.text(); return t?JSON.parse(t):[];
}
const phone=v=>{let p=String(v||'').replace(/\D/g,'').replace(/^00+/,'');
  if(p.indexOf('972')===0)p=p.slice(3);p=p.replace(/^0+/,'');return p?('0'+p):'';};

/* כל המושגים מצביעים לאותו עמוד אגרון */
const AGRON_URL='https://ranibz.github.io/hakol/agron/index.html';
/* מנהל המערכת — הטלפון היחיד שרשאי להיכנס לעורך */
const ADMIN_PHONE='0523482792';
let ME='', ALL=[], CUR=null, DIRTY=false, q='', MODE='edit', DUPS=[];

/* ===== מושגים כפולים =====
   אותו מושג נכתב מחדש בכל זירה שבה הוא מופיע, ולכן קיימות שורות עם
   slug של -2/-3. אי אפשר למחוק אותן: כל זירה מפנה ל-slug אחר, ומחיקה
   תשבור את הזירה שמצביעה אליו. לכן האיחוד הוא סנכרון תוכן ולא מחיקה —
   השורות נשארות, ההגדרה בכולן זהה. */
const termKey = t => nrm(t);
function dupGroups(){
  const m = {};
  ALL.forEach(c => { const k = termKey(c.term); (m[k] = m[k] || []).push(c); });
  return Object.values(m).filter(g => g.length > 1)
    .sort((a,b) => String(a[0].term).localeCompare(String(b[0].term),'he'));
}
const siblingsOf = (term, slug) =>
  ALL.filter(x => termKey(x.term) === termKey(term) && x.slug !== slug);
const plain = html => String(html||'').replace(/<[^>]+>/g,' ')
  .replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();
const sameDef = (a,b) => plain(a) === plain(b);

/* ---------- כניסה ---------- */
function login(){
  el('app').innerHTML=`<div class="mid">
    <h1 style="text-align:center;font-size:1.8rem;margin:0 0 4px">📖 עורך האגרון</h1>
    <p class="sub" style="text-align:center;margin:0 0 20px">
      שינוי כאן מופיע מיד בכל השיעורים</p>
    <div style="background:#fdf3e2;color:#8a5a08;border-radius:11px;padding:11px 14px;
      font-size:.86rem;font-weight:700;margin-bottom:14px;text-align:center">
      🔒 מנהל המערכת בלבד</div>
    <div class="card">
      <div style="font-weight:800;margin-bottom:10px">כניסת מורה</div>
      <input id="ph" type="tel" dir="ltr" style="text-align:right;margin-bottom:8px" placeholder="טלפון">
      <input id="pw" type="password" style="margin-bottom:11px" placeholder="סיסמה">
      <button class="btn" onclick="doLogin()">כניסה ←</button>
      <div id="e" style="margin-top:9px"></div>
    </div></div>`;
  document.addEventListener('keydown',k=>{if(k.key==='Enter'&&el('ph'))doLogin();});
}
async function doLogin(){
  const p=phone(el('ph').value), w=el('pw').value, e=el('e');
  e.innerHTML='';
  if(!p||!w){e.innerHTML='<div class="err">נא למלא טלפון וסיסמה.</div>';return;}
  try{
    /* העורך משנה תוכן שמופיע בכל השיעורים בבת אחת, ולכן הגישה מוגבלת
       למנהל המערכת בלבד — לא לכל מורה מאושר. */
    if(p!==ADMIN_PHONE){
      e.innerHTML='<div class="err">העורך פתוח למנהל המערכת בלבד.</div>'; return;
    }
    const r=await sb('lms_teachers?select=id,name,password,status,is_admin&phone=eq.'+encodeURIComponent(p));
    const t=(r||[]).find(x=>x.password===w&&x.status==='approved');
    if(!t){e.innerHTML='<div class="err">טלפון או סיסמה שגויים.</div>';return;}
    ME=(t.name||'').trim();
    await loadAll();
  }catch(err){e.innerHTML='<div class="err">שגיאה: '+esc(err.message)+'</div>';}
}

/* ---------- טעינה ---------- */
async function loadAll(){
  el('app').innerHTML='<div class="mid"><div class="card">טוען מושגים…</div></div>';
  try{
    ALL=await sb('concepts?select=*&order=term.asc');
    render();
  }catch(e){
    el('app').innerHTML='<div class="mid"><div class="card"><div class="err">שגיאת טעינה: '+
      esc(e.message)+'</div></div></div>';
  }
}
const filtered=()=>!q?ALL:ALL.filter(c=>nrm(c.term).indexOf(q)>-1||nrm(c.slug).indexOf(q)>-1);

function render(){
  el('app').innerHTML=`
  <div class="top"><div class="topin">
    <h1>📖 עורך האגרון</h1>
    <span class="sb">${esc(ME)}</span>
    <span class="pill" style="background:rgba(255,255,255,.18);color:#fff">${ALL.length} מושגים</span>
    <span class="pill" style="background:rgba(255,255,255,.18);color:#fff">v1.6.0</span>
    <span class="sb" style="margin-inline-start:auto">שינוי מופיע מיד בכל השיעורים</span>
  </div></div>
  <div class="wrap">${dupBanner()}<div class="grid">
    <div class="card">
      <label>חיפוש מושג</label>
      <input id="q" value="${esc(q)}" oninput="setQ(this.value)" placeholder="שם המושג…">
      <button class="btn b" style="width:100%;margin-top:9px" onclick="newConcept()">＋ מושג חדש</button>
      <p class="sub" style="margin:9px 0 0">${filtered().length} מתוך ${ALL.length}</p>
      <div class="list" id="list">${filtered().map(itemHtml).join('')||'<p class="sub">אין תוצאות.</p>'}</div>
    </div>
    <div id="pane">${MODE==='merge'?mergePane():(CUR?editor():'<div class="card"><p class="sub" style="text-align:center;padding:34px 0">בחרו מושג מהרשימה, או צרו חדש.</p></div>')}</div>
  </div></div>`;
  if(CUR)bindPreview();
}
function itemHtml(c){
  const sibs = siblingsOf(c.term, c.slug);
  const synced = sibs.length && sibs.every(s => sameDef(s.definition_html, c.definition_html));
  const mark = sibs.length
    ? `<span title="${synced?'מסונכרן':'גרסאות שונות'}" style="color:${synced?'#0f7a4d':'#c2410c'};
        font-weight:800"> ${synced?'🔗':'⚠'}${sibs.length+1}</span>` : '';
  return `<button class="it ${CUR&&CUR.slug===c.slug?'on':''}" onclick="pick('${esc(c.slug)}')">
    ${esc(c.term)}${mark}<small>${esc(c.zone||'—')} · ${esc(c.slug)}</small></button>`;
}
function setQ(v){ q=nrm(v); const l=el('list');
  if(l){l.innerHTML=filtered().map(itemHtml).join('')||'<p class="sub">אין תוצאות.</p>';} }
function pick(slug){
  if(DIRTY&&!confirm('יש שינויים שלא נשמרו. לעבור למושג אחר?'))return;
  CUR=ALL.find(c=>c.slug===slug)||null; DIRTY=false; render();
}
function newConcept(){
  if(DIRTY&&!confirm('יש שינויים שלא נשמרו. להמשיך?'))return;
  CUR={__new:true,slug:'',term:'',zone:'',definition_html:'<p></p>',agron_url:AGRON_URL};
  DIRTY=false; render();
}

/* ---------- באנר כפילויות ---------- */
function dupBanner(){
  const gs = dupGroups();
  if(!gs.length) return '';
  const unsynced = gs.filter(g => !g.every(c => sameDef(c.definition_html, g[0].definition_html)));
  if(MODE === 'merge') return '';
  return `<div style="background:${unsynced.length?'#fff4ed':'#eefaf3'};
    border:2px solid ${unsynced.length?'#f4c7a8':'#a9dfc4'};border-radius:13px;
    padding:12px 15px;margin-bottom:15px;display:flex;gap:11px;align-items:center;flex-wrap:wrap">
    <span style="font-weight:800">${unsynced.length?'⚠':'🔗'}
      ${gs.length} מושגים מופיעים ביותר משורה אחת</span>
    <span class="sub">${unsynced.length
      ? unsynced.length + ' מהם עם הגדרות שונות זו מזו'
      : 'כולם מסונכרנים'}</span>
    <button class="btn b" style="width:auto;padding:6px 15px;font-size:.86rem;margin-inline-start:auto"
      onclick="openMerge()">איחוד גרסאות ←</button>
  </div>`;
}
function openMerge(){
  if(DIRTY && !confirm('יש שינויים שלא נשמרו. לעבור למסך האיחוד?')) return;
  MODE = 'merge'; CUR = null; DIRTY = false; render();
}
function closeMerge(){ MODE = 'edit'; render(); }

/* ---------- מסך האיחוד ---------- */
function mergePane(){
  const gs = dupGroups();
  if(!gs.length) return `<div class="card"><p class="sub" style="text-align:center;padding:34px 0">
    אין מושגים כפולים. 🎉</p>
    <button class="btn" onclick="closeMerge()">חזרה לעורך</button></div>`;
  return `<div class="card">
    <div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:6px">
      <h2 style="margin:0;font-size:1.2rem">🔗 איחוד גרסאות</h2>
      <span class="pill">${gs.length} מושגים</span>
      <button class="btn" style="width:auto;padding:5px 14px;font-size:.85rem;margin-inline-start:auto"
        onclick="closeMerge()">חזרה</button>
    </div>
    <p class="sub" style="margin:0 0 14px">
      בחרו את הגרסה הנכונה בכל מושג והיא תועתק לשאר השורות.
      השורות עצמן נשארות — כל זירה מפנה ל-slug אחר, ומחיקה תשבור אותה.</p>
    <div id="mergeMsg" class="msg" style="display:block;margin-bottom:10px"></div>
    ${(DUPS = gs).map(groupCard).join('')}
  </div>`;
}
function groupCard(g, gi){
  const synced = g.every(c => sameDef(c.definition_html, g[0].definition_html));
  return `<div style="border:2px solid ${synced?'#dff0e7':'#f0dcd0'};border-radius:13px;
    padding:13px 15px;margin-bottom:13px;background:${synced?'#fbfefc':'#fffdfa'}">
    <div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:9px">
      <strong style="font-size:1.05rem">${esc(g[0].term)}</strong>

function useBase(gi, ci){

/* טקסט שהודבק מוורד מומר; HTML מוכן עובר ניקוי ועיצוב בלבד */
function normDef(raw){
  const s = String(raw||'').trim();
  if(!s) return '';
  return /<(p|ul|ol|li|div|span|table|strong|h[1-6])\b/i.test(s)
    ? beautify(s) : beautify(wordToHtml(s));
}
function previewGroup(gi){
  const ta = el('mgTa-'+gi), box = el('mgPrev-'+gi);
  if(!ta || !box) return;
  const def = normDef(ta.value);
  if(!def){ box.style.display='none'; return; }
  box.style.display='block';
  box.innerHTML = def;
}
async function applyGroup(gi){
  const g = DUPS[gi]; if(!g) return;
  const ta = el('mgTa-'+gi);
  const def = normDef(ta ? ta.value : '');
  if(!def){ alert('התיבה ריקה. הדביקו את הניסוח הנכון, או לחצו "העתק לתיבה" על אחת הגרסאות.'); return; }
  if(!confirm('להחיל את הניסוח שבתיבה על כל ' + g.length + ' השורות של "' + g[0].term + '"?\n\n' +
              g.map(c=>'· '+c.slug).join('\n') + '\n\nשום שורה לא נמחקת. כל הזירות ימשיכו לעבוד.')) return;
  const msg = el('mergeMsg');
  if(msg){ msg.style.color='#6a6f8a'; msg.textContent='מחיל…'; }
  const ts = new Date().toISOString();
  let ok = 0; const bad = [];
  for(const c of g){
    try{
      const res = await sb('concepts?slug=eq.'+encodeURIComponent(c.slug),'PATCH',
        { definition_html: def, term: g[0].term, updated_at: ts },
        { Prefer:'return=representation' });
      if(res && res.length) ok++; else bad.push(c.slug);
    }catch(e){ bad.push(c.slug); }
  }
  ALL = await sb('concepts?select=*&order=term.asc');
  render();
  const m2 = el('mergeMsg');
  if(m2){
    if(bad.length){ m2.style.color='#9f1239';
      m2.textContent = '⚠ ' + ok + ' עודכנו, נכשלו: ' + bad.join(', '); }
    else { m2.style.color='#0f7a4d';
      m2.textContent = '✅ ' + ok + ' שורות מציגות עכשיו את אותה הגדרה'; }
  }
}

/* ===== עיצוב מוטמע =====
   ההגדרה נשלפת מ-Supabase לתוך עשרות דפי שיעור שונים, שלכל אחד CSS משלו.
   לכן הטבלאות/הקופסאות/הכותרות נושאות style מוטמע — כך הן נראות זהה בכל מקום
   ולא תלויות בכך שלדף המארח יש .table-wrapper או .example-box. */
const ST={
  title:'font-weight:700;color:#2c3e50;display:block;margin:15px 0 5px;text-decoration:underline',
  box:'background:#e8f5e9;padding:14px 16px;border-radius:8px;margin:14px 0;border-right:4px solid #4caf50',
  wrap:'overflow-x:auto;margin:12px 0;border:1px solid #d9e2d9;border-radius:8px',
  table:'width:100%;border-collapse:collapse;min-width:320px',
  th:'background:#e8f0e8;color:#2c3e50;font-weight:700;text-align:right;padding:9px 11px;'+
     'border-bottom:2px solid #c7d6c7',
  td:'padding:9px 11px;border-bottom:1px solid #ececec;vertical-align:top;text-align:right',
  ul:'margin:0 0 12px;padding-inline-start:22px',
  li:'margin-bottom:5px',
  lead:'color:#1b4332'   /* המילה המובילה בפריט — כהה יותר משאר השורה */
};
/* תווי בולט שוורד מדביק: Private Use של גופן Symbol/Wingdings, ועוד וריאציות */
const BULLET_CHARS='\\uF000-\\uF0FF\\u2022\\u00B7\\u25AA\\u25AB\\u25CF\\u25CB\\u25E6\\u2023\\u2043\\u2219\\u25A0\\u25A1\\u274F\\uFFFD';
const RE_BULLET=new RegExp('['+BULLET_CHARS+']','g');
const RE_LEAD  =new RegExp('^[\\s\\t]*(?:['+BULLET_CHARS+'\\-\\u2013\\u2014*]|o(?=[\\t ]))[\\s\\t]*');
/* ניקוי תו-אחר-תו: בולטים, רווח קשיח, וסימני כיווניות נסתרים */
const cleanText=s=>String(s==null?'':s)
  .replace(/\u00A0/g,' ')
  .replace(/[\u200B-\u200F\u202A-\u202E\u2060\uFEFF]/g,'')
  .replace(RE_BULLET,'');

/* מנקה ומעצב HTML קיים — עובד על ה-DOM ולא ברגקס, כדי לא לשבור תגיות */
function beautify(html){
  const d=document.createElement('div');
  d.innerHTML=String(html||'');
  /* 0 · פסקאות שהתחילו בתו בולט של וורד — מסמנים לפני הניקוי, כדי שנוכל
     להפוך אותן לרשימה אמיתית ולא להשאיר שורות בודדות עם ריבוע */
  const RE_LEADBUL=new RegExp('^[\\s\\t]*['+BULLET_CHARS+']');
  d.querySelectorAll('p').forEach(p=>{ if(RE_LEADBUL.test(p.textContent)) p.setAttribute('data-bul','1'); });
  /* 1 · ניקוי תווי הבולט מכל צומת טקסט */
  const walker=document.createTreeWalker(d,NodeFilter.SHOW_TEXT,null,false);
  const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n=>{ n.nodeValue=cleanText(n.nodeValue); });
  /* 2 · שאריות רווח/טאב בתחילת פריט */
  d.querySelectorAll('li,p,td,th').forEach(n=>{
    const f=n.firstChild;
    if(f&&f.nodeType===3) f.nodeValue=f.nodeValue.replace(/^[\s\t]+/,'');
  });
  /* 3 · איחוד פסקאות מסומנות לרשימה אחת */
  let seed=d.querySelector('p[data-bul]');
  while(seed){
    const ul=document.createElement('ul');
    seed.parentNode.insertBefore(ul,seed);
    let n=seed;
    while(n && n.tagName==='P' && n.hasAttribute('data-bul')){
      const next=n.nextElementSibling;
      const li=document.createElement('li');
      li.innerHTML=n.innerHTML;
      n.remove(); ul.appendChild(li);
      n=next;
    }
    seed=d.querySelector('p[data-bul]');
  }
  /* 4 · הדגשת המילה המובילה בפריט שאין בו הדגשה */
  d.querySelectorAll('li').forEach(li=>{
    if(li.querySelector('strong,b')) return;
    const t=li.textContent.trim(); if(!t) return;
    let m=/^([^:]{2,45}):\s*(.+)$/.exec(t);
    if(m){ li.innerHTML='<strong>'+esc(m[1])+':</strong> '+esc(m[2]); return; }
    m=/^(.{2,45}?)\s+[-–—]\s+(.+)$/.exec(t);
    if(m){ li.innerHTML='<strong>'+esc(m[1])+'</strong> – '+esc(m[2]); return; }
    if(t.split(/\s+/).length<=3) li.innerHTML='<strong>'+esc(t)+'</strong>';
  });
  /* 5 · עיצוב מוטמע */
  d.querySelectorAll('.section-title').forEach(n=>n.setAttribute('style',ST.title));
  d.querySelectorAll('.example-box').forEach(n=>n.setAttribute('style',ST.box));
  d.querySelectorAll('ul,ol').forEach(n=>n.setAttribute('style',ST.ul));
  d.querySelectorAll('li').forEach(n=>n.setAttribute('style',ST.li));
  d.querySelectorAll('li strong,li b').forEach(n=>n.setAttribute('style',ST.lead));
  d.querySelectorAll('table').forEach(t=>{
    t.setAttribute('style',ST.table);
    t.querySelectorAll('th').forEach(c=>c.setAttribute('style',ST.th));
    t.querySelectorAll('td').forEach(c=>c.setAttribute('style',ST.td));
    /* אם אין עוטף — יוצרים אחד, כדי שהטבלה תגלול במסך צר */
    const p=t.parentElement;
    if(p&&p.classList&&p.classList.contains('table-wrapper')) p.setAttribute('style',ST.wrap);
    else{
      const wr=document.createElement('div');
      wr.className='table-wrapper'; wr.setAttribute('style',ST.wrap);
      t.parentNode.insertBefore(wr,t); wr.appendChild(t);
    }
  });
  return d.innerHTML.trim();
}
function fixNow(){
  const t=el('fDef'); if(!t)return;
  t.value=beautify(t.value); onEdit();
  const m=el('msg'); if(m){ m.style.color='#0f7a4d'; m.textContent='🧹 נוקה ועוצב — לחצו שמירה'; }
}

/* ===== המרת טקסט מוורד ל-HTML של האגרון =====
   כללי הזיהוי: "הגדרה לתלמיד:" → כותרת · שורה עם "כותרת: תוכן" → פריט רשימה
   עם הדגשה · "דוגמאות:" → קופסת דוגמאות · שורות עם טאבים → טבלה. */
/* ממיר טקסט וורד ל-HTML של האגרון */
function wordToHtml(raw){
  const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  /* המילה שפותחת את הפריט מודגשת וכהה יותר — גם כשהמפריד הוא מקף ולא נקודתיים,
     וגם כשהפריט הוא מונח בודד בלי הסבר. */
  const lead=t=>'<strong style="'+ST.lead+'">'+esc(t)+'</strong>';
  const bold=t=>{
    let m=/^([^:]{2,45}):\s*(.+)$/.exec(t);
    if(m) return lead(m[1]+':')+' '+esc(m[2]);
    m=/^(.{2,45}?)\s+[-–—]\s+(.+)$/.exec(t);
    if(m) return lead(m[1])+' – '+esc(m[2]);
    if(t.split(/\s+/).length<=3) return lead(t);
    return esc(t);
  };
  /* כל שורה עוברת נרמול לפני הזיהוי: סימן הבולט של וורד (ריבוע/גליף Symbol)
     מוחלף במקף רגיל, כדי שזיהוי הרשימה ימשיך לעבוד — והטאב שאחריו נעלם,
     אחרת השורה נחשבת בטעות לשורת טבלה. שאר התווים המוזרים מנוקים. */
  const normLine=l=>{
    const m=RE_LEAD.exec(l);
    if(m) return '- '+cleanText(l.slice(m[0].length)).replace(/^[\s\t]+/,'').trimEnd();
    return cleanText(l).trimEnd();   /* טאבים נשמרים — הם מסמני הטבלה */
  };
  const lines=String(raw||'').replace(/\r/g,'').split('\n').map(normLine);
  const out=[]; let i=0;
  const isTableRow=l=>l.includes('\t');
  while(i<lines.length){
    let l=lines[i].trim();
    if(!l){ i++; continue; }
    /* כותרת פותחת */
    if(/^הגדרה לתלמיד:?$/.test(l)){
      out.push('<span class="section-title" style="'+ST.title+'">הגדרה לתלמיד:</span>'); i++; continue; }
    /* קופסת דוגמאות */
    if(/^דוגמ(ה|אות):/.test(l)){
      const label=/^דוגמאות:/.test(l)?'דוגמאות:':'דוגמה:';
      let body=l.replace(/^דוגמ(ה|אות):\s*/,'');
      i++;
      /* הקופסה נעצרת גם לפני כותרת קצרה שאחריה טבלה, כדי שלא תיבלע */
      while(i<lines.length){
        const t=lines[i].trim();
        if(!t || isTableRow(lines[i]) || /^דוגמ(ה|אות):/.test(t)) break;
        if(t.length<40 && lines[i+1] && isTableRow(lines[i+1])) break;
        body+=(body?'<br>':'')+t; i++;
      }
      out.push('<div class="example-box" style="'+ST.box+'">\n  <strong>'+label+'</strong><br>\n  '+
        esc(body).replace(/&lt;br&gt;/g,'<br>')+'\n</div>');
      continue;
    }
    /* טבלה — שורות עם טאבים */
    if(isTableRow(lines[i])){
      const rows=[];
      while(i<lines.length && isTableRow(lines[i])){ rows.push(lines[i].split('\t').map(c=>c.trim())); i++; }
      const head=rows.shift();
      out.push('<div class="table-wrapper" style="'+ST.wrap+'">\n  <table style="'+ST.table+'">\n'+
        '    <thead>\n      <tr>'+
        head.map(c=>'<th style="'+ST.th+'">'+esc(c)+'</th>').join('')+'</tr>\n    </thead>\n    <tbody>\n'+
        rows.map(r=>'      <tr>'+r.map(c=>'<td style="'+ST.td+'">'+esc(c)+'</td>').join('')+'</tr>').join('\n')+
        '\n    </tbody>\n  </table>\n</div>');
      continue;
    }
    /* רשימה — שורות שמתחילות במקף/בולט, או רצף שורות עם "כותרת:" */
    if(/^[-–—•*]\s+/.test(l) || /^[^:]{2,45}:\s*\S/.test(l)){
      const items=[];
      while(i<lines.length){
        const t=lines[i].trim();
        if(!t || isTableRow(lines[i]) || /^דוגמ(ה|אות):/.test(t)) break;
        if(!/^[-–—•*]\s+/.test(t) && !/^[^:]{2,45}:\s*\S/.test(t)) break;
        items.push(bold(t.replace(/^[-–—•*]\s+/,''))); i++;
      }
      if(items.length){ out.push('<ul style="'+ST.ul+'">\n'+
        items.map(x=>'  <li style="'+ST.li+'">'+x+'</li>').join('\n')+'\n</ul>'); continue; }
    }
    /* כותרת משנה קצרה בלי נקודתיים — פסקה מודגשת */
    if(l.length<40 && !/[.!?]$/.test(l) && lines[i+1] && isTableRow(lines[i+1])){
      out.push('<p><strong>'+esc(l)+'</strong></p>'); i++; continue;
    }
    out.push('<p>'+esc(l)+'</p>'); i++;
  }
  return out.join('\n');
}

  ov.innerHTML=`<div style="background:#fff;border-radius:17px;max-width:760px;width:100%;
      padding:21px 23px;max-height:90vh;overflow:auto">
    <h3 style="margin:0 0 3px;font-size:1.18rem">הדבקה מוורד</h3>

      placeholder="הגדרה לתלמיד:&#10;הטקסט שלכם…&#10;דוגמאות:&#10;…"></textarea>
    <div style="display:flex;gap:8px;margin-top:11px;flex-wrap:wrap">
      <button class="btn" onclick="doImport()">המרה והצבה ←</button>
      <button class="btn g" onclick="closeImport()">ביטול</button>
      <span class="sub" style="align-self:center">אפשר לערוך את ה-HTML אחרי ההמרה</span>
    </div>
    <div class="sub" style="margin-top:13px;margin-bottom:5px">תצוגה מקדימה של התוצאה</div>
    <div class="prev" id="impPrev" style="min-height:110px;max-height:260px">
      <span class="sub">הדביקו טקסט כדי לראות תצוגה מקדימה…</span></div>
  </div>`;
  ov.addEventListener('click',e=>{if(e.target===ov)closeImport();});
  document.body.appendChild(ov);
  setTimeout(()=>{const t=document.getElementById('impTxt');if(t)t.focus();},50);
}
function closeImport(){const o=document.getElementById('impOv');if(o)o.remove();}
function livePreview(){
  const t=document.getElementById('impTxt'), p=document.getElementById('impPrev');
  if(!t||!p)return;
  p.innerHTML = t.value.trim() ? beautify(wordToHtml(t.value))
    : '<span class="sub">הדביקו טקסט כדי לראות תצוגה מקדימה…</span>';
}
function doImport(){
  const raw=document.getElementById('impTxt').value;
  if(!raw.trim()){ alert('אין טקסט להמרה'); return; }
  const html=beautify(wordToHtml(raw));
  el('fDef').value=html;
  closeImport();
  onEdit();
}

function bindPreview(){ const t=el('fDef'), p=el('prev'); if(t&&p)p.innerHTML=t.value; }
function onEdit(){ DIRTY=true; bindPreview(); const m=el('msg'); if(m)m.textContent=''; }
function wrapTag(tag){
  const t=el('fDef'); const s=t.selectionStart, e=t.selectionEnd;
  const sel=t.value.slice(s,e)||'טקסט';
  t.value=t.value.slice(0,s)+'<'+tag+'>'+sel+'</'+tag+'>'+t.value.slice(e);
  onEdit(); t.focus();
}
function insTemplate(){
  if(el('fDef').value.trim() && !confirm('להחליף את התוכן הקיים בתבנית ריקה?'))return;
  el('fDef').value=
`<span class="section-title" style="${ST.title}">הגדרה לתלמיד:</span>
<p>ההגדרה כאן.</p>
<ul style="${ST.ul}">
  <li style="${ST.li}"><strong>מונח:</strong> הסבר</li>
</ul>
<div class="example-box" style="${ST.box}">
  <strong>דוגמאות:</strong><br>
  דוגמה ראשונה, דוגמה שנייה
</div>`;
  onEdit();
}
function insList(){
  const t=el('fDef');
  t.value+='\n<ul>\n  <li>פריט</li>\n  <li>פריט</li>\n</ul>';
  onEdit(); t.focus();
}
function cancel(){
  if(DIRTY&&!confirm('לבטל את השינויים?'))return;
  CUR=null; DIRTY=false; render();
}
/* יצירת slug לטיני מטקסט עברי */
const HE='אבגדהוזחטיכלמנסעפצקרשתךםןףץ', LA=['a','b','g','d','h','v','z','h','t','y','k','l','m','n','s','a','p','ts','k','r','sh','t','k','m','n','p','ts'];
function autoSlug(term){
  let out='';
  for(const ch of nrm(term)){
    const i=HE.indexOf(ch);
    if(i>-1) out+=LA[i];
    else if(/[a-zA-Z0-9]/.test(ch)) out+=ch.toLowerCase();
    else if(/[\s\-־]/.test(ch)) out+='-';
  }
  return out.replace(/-+/g,'-').replace(/^-|-$/g,'').slice(0,60);
}
async function save(){
  const m=el('msg');
  const term=nrm(el('fTerm').value), zone=nrm(el('fZone').value);
  let def=el('fDef').value.trim();
  if(term.length<2){ m.style.color='#9f1239'; m.textContent='נא להזין שם מושג.'; return; }
  if(!def){ m.style.color='#9f1239'; m.textContent='ההגדרה ריקה.'; return; }
  /* ניקוי ועיצוב אוטומטי בכל שמירה — כך שגם מושגים ישנים מתוקנים בעצם השמירה */
  def=beautify(def); el('fDef').value=def; bindPreview();
  let slug=nrm(el('fSlug').value)||autoSlug(term);
  const isNew=!!CUR.__new;
  if(isNew && ALL.some(c=>c.slug===slug)){
    m.style.color='#9f1239'; m.textContent='המזהה "'+slug+'" כבר קיים.'; return;
  }
  /* מניעת הכפילות במקור: מושג בשם קיים יוצר שורה עם slug של -2 ואז
     כל זירה מצביעה למקום אחר. עדיף לערוך את הקיים. */
  if(isNew){
    const twin = ALL.filter(c=>termKey(c.term)===termKey(term));
    if(twin.length && !confirm('המושג "'+term+'" כבר קיים ב-'+twin.length+' שורות ('+
        twin.map(t=>t.slug).join(', ')+').\n\n'+
        'יצירת שורה נוספת תיצור כפילות. עדיף לפתוח את הקיים ולערוך אותו.\n\n'+
        'ליצור בכל זאת?')){
      m.style.color='#6a6f8a'; m.textContent='בוטל — פתחו את המושג הקיים מהרשימה.';
      el('saveBtn').disabled=false; return;
    }
  }
  m.style.color='#6a6f8a'; m.textContent='שומר…';
  el('saveBtn').disabled=true;
  try{
    const row={slug,term,zone:zone||null,definition_html:def,
               agron_url:CUR.agron_url||AGRON_URL,updated_at:new Date().toISOString()};
    /* Prefer:return=representation — מחזיר את השורה שנשמרה בפועל.
       בלעדיו RLS שחוסם כתיבה מחזיר 200 עם גוף ריק, וזה נראה כמו הצלחה. */
    let saved;
    if(isNew) saved = await sb('concepts','POST',[row],{Prefer:'return=representation'});
    else      saved = await sb('concepts?slug=eq.'+encodeURIComponent(CUR.slug),'PATCH',
                       {term,zone:zone||null,definition_html:def,updated_at:row.updated_at},
                       {Prefer:'return=representation'});
    if(!saved || !saved.length){
      throw new Error('לא נשמרה אף שורה. סביר ש-RLS חוסם כתיבה לטבלה concepts — '+
        'צריך policy ל-UPDATE ול-INSERT.');
    }
    /* אימות סופי: לוודא שמה שחזר הוא באמת מה ששלחנו */
    if(String(saved[0].definition_html).trim() !== def){
      throw new Error('השמירה לא נקלטה — הערך במסד שונה ממה שנשלח.');
    }
    /* סנכרון לשורות התאומות: אותו מושג קיים בכמה שורות (slug שונה לכל זירה),
       ולכן שמירה אחת מתפשטת לכולן — כך יש פירוש אחד לכל מושג בפועל. */
    const sibs = siblingsOf(CUR.__new ? term : CUR.term, slug);
    let synced = 0;
    for(const s of sibs){
      try{
        const r2 = await sb('concepts?slug=eq.'+encodeURIComponent(s.slug),'PATCH',
          {term, definition_html:def, updated_at:row.updated_at},
          {Prefer:'return=representation'});
        if(r2 && r2.length) synced++;
      }catch(e){}
    }
    DIRTY=false;
    ALL=await sb('concepts?select=*&order=term.asc');
    CUR=ALL.find(c=>c.slug===slug)||null;
    render();
    const m2=el('msg'); if(m2){ m2.style.color='#0f7a4d';
      m2.textContent = synced
        ? '✅ נשמר וסונכרן ל-'+synced+' גרסאות נוספות של המושג'
        : '✅ נשמר — מופיע כבר בשיעורים'; }
  }catch(e){
    m.style.color='#9f1239'; m.textContent='⚠ ' + String(e.message||e).slice(0,170);
    el('saveBtn').disabled=false;
    DIRTY=true;   /* לא מאבדים את מה שנכתב */
  }
}
async function del(){
  const sibs = siblingsOf(CUR.term, CUR.slug);
  const warn = sibs.length
    ? '\n\n⚠ קיימות עוד '+sibs.length+' שורות לאותו מושג ('+sibs.map(s=>s.slug).join(', ')+'). '+
      'הזירה שמפנה דווקא ל-"'+CUR.slug+'" תישבר — היא לא תמצא את השורה.'
    : '';
  if(!confirm('למחוק את המושג "'+CUR.term+'"?\n\nשיעורים שמקושרים אליו יציגו "הפירוש זמין באגרון".\nלא ניתן לשחזר.'+warn))return;
  try{
    await sb('concepts?slug=eq.'+encodeURIComponent(CUR.slug),'DELETE',null,{Prefer:'return=minimal'});
    CUR=null; DIRTY=false;
    ALL=await sb('concepts?select=*&order=term.asc');
    render();
  }catch(e){ alert('המחיקה נכשלה: '+e.message); }
}
window.addEventListener('beforeunload',e=>{ if(DIRTY){e.preventDefault();e.returnValue='';} });
login();
</script>
