<!DOCTYPE html>
<!-- eshi/shioor/lms-admin.html · v2.1.0 · 2026-07-27 · נוספה לשונית "סטטיסטיקות": מורים מובילים, קבצים פופולריים, פילוח לפי זירה וסוג שיעור, מושגים מבוקשים, שיעורים קשים, פעילות לפי יום ולפי שעה, כיתות מובילות ומורים רדומים. בורר טווח 7/30/הכל. שאילתת ההגשות מושכת כעת גם lesson_type, zone, concept ו-page, והתקרה הועלתה ל-20000 עם התראה כשהיא נוגעת (MINOR) -->
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>קונסולת ניהול · הכל בכף היד</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&family=Secular+One&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1a3d;--soft:#6a6490;--line:#eae5f7;--bg:#f7f5fc;--v:#7040d8;--vd:#4f2ba3;--vw:#f3edfe;
  --ok:#16a34a;--okw:#eafaf1;--warn:#e08519;--warnw:#fff4e4;--bad:#dc2626;--badw:#fdf2f4;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'Heebo',sans-serif;color:var(--ink);line-height:1.65}
.wrap{max-width:1180px;margin:0 auto;padding:22px 15px 70px}
h1{font-family:'Secular One',sans-serif;font-size:1.65rem;margin:0 0 2px}
.sub{color:var(--soft);margin:0 0 16px;font-size:.92rem}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:12px}
input,select{padding:10px 12px;border:1px solid #ddd;border-radius:10px;font-family:inherit;font-size:.95rem}
input{width:100%}
.btn{background:var(--v);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-family:inherit;
  font-weight:900;cursor:pointer;font-size:.9rem}
.btn:hover{background:var(--vd)}
.btn.ok{background:var(--ok)} .btn.bad{background:var(--bad)}
.btn.sm{padding:6px 12px;font-size:.8rem;border-radius:8px}
.err{background:var(--badw);color:#9f1239;border-radius:10px;padding:10px 13px;font-size:.88rem;margin-top:8px}
.tabs{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.tab{background:#fff;border:2px solid var(--line);border-radius:20px;padding:8px 16px;font-weight:900;
  cursor:pointer;font-size:.87rem;color:var(--soft)}
.tab.on{background:var(--v);color:#fff;border-color:var(--v)}
.tab .n{font-size:.76rem;opacity:.85}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.87rem}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th{background:#faf9ff;font-weight:900;color:var(--vd);font-size:.78rem;position:sticky;top:0;z-index:2}
tr:hover td{background:#fbfaff}
.scroll{max-height:62vh;overflow:auto;border:1px solid var(--line);border-radius:12px}
.pill{display:inline-block;font-size:.71rem;font-weight:900;border-radius:20px;padding:2px 9px;white-space:nowrap}
.p-ok{background:var(--okw);color:#0f7a4d} .p-wait{background:var(--warnw);color:#a85f08}
.p-off{background:#f2f0f9;color:var(--soft)} .p-bad{background:var(--badw);color:#9f1239}
.p-v{background:var(--vw);color:var(--vd)}
.acts{display:flex;gap:5px;flex-wrap:wrap}
.empty{text-align:center;color:var(--soft);padding:26px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 8px;text-align:center}
.kpi b{display:block;font-family:'Secular One',sans-serif;font-size:1.4rem;line-height:1.2}
.kpi span{font-size:.7rem;color:var(--soft);font-weight:800}
.kpi.g b{color:var(--ok)} .kpi.r b{color:var(--bad)} .kpi.y b{color:var(--warn)}
.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:11px}
.bar input{max-width:300px}
.diag{border-inline-start:4px solid var(--bad);background:var(--badw);border-radius:0 12px 12px 0;
  padding:12px 15px;margin-bottom:10px;font-size:.9rem}
.diag.okd{border-color:var(--ok);background:var(--okw)}
.diag b{display:block;margin-bottom:3px}
.mono{font-family:ui-monospace,monospace;font-size:.8rem;direction:ltr;text-align:right;color:var(--soft)}
.seg{display:inline-flex;gap:4px;background:#fff;border:2px solid var(--line);border-radius:20px;padding:3px}
.seg button{background:none;border:0;border-radius:16px;padding:5px 14px;font-family:inherit;font-weight:900;
  font-size:.82rem;color:var(--soft);cursor:pointer}
.seg button.on{background:var(--v);color:#fff}
.h3{font-family:'Secular One',sans-serif;font-size:1.02rem;margin:2px 0 9px;color:var(--vd)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px}
.blk{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff}
.trk{background:var(--line);border-radius:6px;height:9px;overflow:hidden;min-width:60px}
.trk i{display:block;height:100%;background:var(--v);border-radius:6px}
.trk.g i{background:var(--ok)} .trk.r i{background:var(--bad)} .trk.y i{background:var(--warn)}
.spark{display:flex;align-items:flex-end;gap:3px;height:74px;margin:6px 0 4px}
.spark div{flex:1;background:var(--v);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.spark div:hover{background:var(--vd)}
.sparkx{display:flex;gap:3px;font-size:.6rem;color:var(--soft);text-align:center}
.sparkx span{flex:1;overflow:hidden;white-space:nowrap}
.note{background:var(--warnw);color:#a85f08;border-radius:10px;padding:9px 13px;font-size:.85rem;
  font-weight:700;margin-bottom:11px}
.rank{display:inline-block;width:20px;font-weight:900;color:var(--soft)}
</style>
</head>
<body>
<div class="wrap">
  <h1>קונסולת ניהול</h1>
  <p class="sub" id="who">מורים, כיתות, הגשות ואבחון תקלות</p>
  <div id="app"><div class="card" id="login">
    <b>כניסת מנהל</b>
    <p class="sub" style="margin:6px 0 12px;">טלפון וסיסמה של חשבון המסומן כמנהל.</p>
    <input id="ph" placeholder="טלפון" dir="ltr" style="text-align:right;margin-bottom:9px">
    <input id="pw" type="password" placeholder="סיסמה" style="margin-bottom:11px">
    <button class="btn" onclick="login()">כניסה ←</button>
    <div id="lerr"></div>
  </div></div>
</div>

<script>
const SUP="https://eubgzfkkovxgijhrmnif.supabase.co";
const SKEY="sb_publishable_vJ768fOwYWiDWeYsBBR45g_4NM4s55p";
const HDR={apikey:SKEY,Authorization:'Bearer '+SKEY,'Content-Type':'application/json'};
async function sb(path,method,body,extra){
  const r=await fetch(SUP+'/rest/v1/'+path,{method:method||'GET',
    headers:Object.assign({},HDR,extra||{}),body:body?JSON.stringify(body):undefined});
  if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,200));
  const t=await r.text(); return t?JSON.parse(t):[];
}
function normPhone(s){let p=String(s||'').replace(/\D/g,'');p=p.replace(/^00+/,'');
  if(p.indexOf('972')===0)p=p.slice(3);p=p.replace(/^0+/,'');return p?('0'+p):'';}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').replace(/\s+/g,' ').trim();
const dt=s=>{if(!s)return '—';const d=new Date(s);
  return d.toLocaleDateString('he-IL')+' '+d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});};

const SU_CAP=20000;
let TE=[], CL=[], AS=[], SU=[], tab='teachers', q='', per=30, me=null;
const tName=id=>{const t=TE.find(x=>x.id===id);return t?(t.name||t.phone||id):null;};

async function login(){
  const ph=normPhone(document.getElementById('ph').value);
  const pw=document.getElementById('pw').value;
  const e=document.getElementById('lerr'); e.innerHTML='';
  try{
    const rows=await sb('lms_teachers?select=*&phone=eq.'+encodeURIComponent(ph));
    const t=(rows||[]).find(x=>x.password===pw&&x.status==='approved');
    if(!t){e.innerHTML='<div class="err">טלפון או סיסמה שגויים.</div>';return;}
    if(!t.is_admin){e.innerHTML='<div class="err">החשבון הזה אינו מסומן כמנהל.</div>';return;}
    me=t; document.getElementById('who').textContent='מחובר: '+(t.name||t.phone);
    load();
  }catch(err){e.innerHTML='<div class="err">שגיאה: '+esc(err.message)+'</div>';}
}

async function load(){
  document.getElementById('app').innerHTML='<div class="card empty">טוען נתונים…</div>';
  try{
    const r=await Promise.all([
      sb('lms_teachers?select=*&order=created_at.desc'),
      sb('lms_classes?select=*&order=updated_at.desc'),
      sb('lms_assignments?select=*&order=created_at.desc'),
      sb('lms_submissions?select=id,teacher_id,student_name,student_key,class_name,topic,lesson_type,zone,concept,page,score_auto,score_max,skipped,grade,submitted_at&order=submitted_at.desc&limit='+SU_CAP)
    ]);
    TE=r[0]||[]; CL=r[1]||[]; AS=r[2]||[]; SU=r[3]||[];
  }catch(e){document.getElementById('app').innerHTML='<div class="card err">'+esc(e.message)+'</div>';return;}
  render();
}
function setTab(t){tab=t;q='';render();}
function setQ(v){q=v;render();}

function diagnostics(){
  const ids={}; TE.forEach(t=>ids[t.id]=1);
  const orphan=SU.filter(s=>!s.teacher_id||!ids[s.teacher_id]);
  const clsKeys={}; CL.forEach(c=>clsKeys[c.teacher_id+'|'+norm(c.name)]=1);
  const noClass=SU.filter(s=>s.teacher_id&&ids[s.teacher_id]&&s.class_name&&!clsKeys[s.teacher_id+'|'+norm(s.class_name)]);
  const rosters={};
  CL.forEach(c=>{const m={};(c.students||[]).forEach(x=>m[norm(x)]=1);rosters[c.teacher_id+'|'+norm(c.name)]=m;});
  const notInRoster=SU.filter(s=>{
    const r=rosters[s.teacher_id+'|'+norm(s.class_name)];
    return r&&!r[norm(s.student_name)];
  });
  return {orphan:orphan,noClass:noClass,notInRoster:notInRoster};
}

function render(){
  const pend=TE.filter(t=>t.status==='pending').length;
  const d=diagnostics();
  const issues=d.orphan.length+d.noClass.length+d.notInRoster.length;
  document.getElementById('app').innerHTML=
   '<div class="kpis">'+
    '<div class="kpi"><b>'+TE.length+'</b><span>מורים</span></div>'+
    '<div class="kpi y"><b>'+pend+'</b><span>ממתינים לאישור</span></div>'+
    '<div class="kpi"><b>'+CL.length+'</b><span>כיתות</span></div>'+
    '<div class="kpi"><b>'+AS.length+'</b><span>מטלות שהוקצו</span></div>'+
    '<div class="kpi g"><b>'+SU.length+'</b><span>הגשות</span></div>'+
    '<div class="kpi '+(issues?'r':'g')+'"><b>'+issues+'</b><span>תקלות מזוהות</span></div></div>'+
   '<div class="tabs">'+
    '<button class="tab '+(tab==='teachers'?'on':'')+'" onclick="setTab(\'teachers\')">👩‍🏫 מורים <span class="n">'+TE.length+'</span></button>'+
    '<button class="tab '+(tab==='classes'?'on':'')+'" onclick="setTab(\'classes\')">🏫 כיתות <span class="n">'+CL.length+'</span></button>'+
    '<button class="tab '+(tab==='student'?'on':'')+'" onclick="setTab(\'student\')">🔎 חיפוש תלמיד</button>'+
    '<button class="tab '+(tab==='subs'?'on':'')+'" onclick="setTab(\'subs\')">📥 הגשות <span class="n">'+SU.length+'</span></button>'+
    '<button class="tab '+(tab==='stats'?'on':'')+'" onclick="setTab(\'stats\')">📊 סטטיסטיקות</button>'+
    '<button class="tab '+(tab==='diag'?'on':'')+'" onclick="setTab(\'diag\')">🩺 אבחון <span class="n">'+issues+'</span></button></div>'+
   '<div class="card" id="pane"></div>';
  ({teachers:paneTeachers,classes:paneClasses,student:paneStudent,subs:paneSubs,stats:paneStats,diag:paneDiag}[tab])();
}

function paneTeachers(){
  const list=TE.filter(t=>!q||((t.name||'')+' '+(t.phone||'')+' '+(t.school||'')).indexOf(q)>-1);
  const rows=list.map(function(t){
    const nc=CL.filter(c=>c.teacher_id===t.id).length;
    const ns=SU.filter(s=>s.teacher_id===t.id).length;
    const pill=t.status==='approved'?'<span class="pill p-ok">מאושר</span>'
      :t.status==='pending'?'<span class="pill p-wait">ממתין</span>'
      :'<span class="pill p-off">'+esc(t.status)+'</span>';
    const acts=t.status==='approved'
      ? '<button class="btn bad sm" onclick="setStatus(\''+t.id+'\',\'suspended\')">השעיה</button>'
      : '<button class="btn ok sm" onclick="setStatus(\''+t.id+'\',\'approved\')">אישור</button>'+
        '<button class="btn bad sm" onclick="setStatus(\''+t.id+'\',\'rejected\')">דחייה</button>';
    return '<tr><td><b>'+esc(t.name||'—')+'</b>'+(t.is_admin?' <span class="pill p-v">מנהל</span>':'')+'</td>'+
      '<td>'+esc(t.school||'—')+'</td><td class="mono">'+esc(t.phone||'—')+'</td>'+
      '<td>'+nc+'</td><td>'+ns+'</td><td>'+pill+'</td><td><div class="acts">'+acts+'</div></td></tr>';
  }).join('');
  document.getElementById('pane').innerHTML=
    '<div class="bar"><input placeholder="חיפוש שם, טלפון או בית ספר" value="'+esc(q)+'" oninput="setQ(this.value)"></div>'+
    '<div class="scroll"><table><thead><tr><th>שם</th><th>בית ספר</th><th>טלפון</th><th>כיתות</th><th>הגשות</th><th>סטטוס</th><th>פעולות</th></tr></thead><tbody>'+
    rows+'</tbody></table></div><div id="msg" style="margin-top:9px;font-weight:700;font-size:.88rem;"></div>';
}
async function setStatus(id,st){
  try{ await sb('lms_teachers?id=eq.'+encodeURIComponent(id),'PATCH',{status:st});
    const t=TE.find(x=>x.id===id); if(t)t.status=st; render();
  }catch(e){ const m=document.getElementById('msg'); if(m){m.style.color='#9f1239';m.textContent='שגיאה: '+e.message;} }
}

function paneClasses(){
  const rows=CL.map(function(c){
    const asg=AS.filter(a=>a.teacher_id===c.teacher_id&&norm(a.class_name)===norm(c.name)).length;
    const subs=SU.filter(s=>s.teacher_id===c.teacher_id&&norm(s.class_name)===norm(c.name)).length;
    return {c:c,asg:asg,subs:subs,tn:tName(c.teacher_id)};
  }).filter(r=>!q||((r.tn||'')+' '+r.c.name).indexOf(q)>-1);
  const body=rows.map(r=>'<tr><td><b>'+esc(r.c.name)+'</b></td>'+
    '<td>'+(r.tn?esc(r.tn):'<span class="pill p-bad">מורה לא נמצא</span>')+'</td>'+
    '<td>'+((r.c.students||[]).length)+'</td><td>'+r.asg+'</td><td>'+r.subs+'</td>'+
    '<td class="mono">'+dt(r.c.updated_at)+'</td></tr>').join('');
  document.getElementById('pane').innerHTML=
    '<div class="bar"><input placeholder="חיפוש לפי שם כיתה או מורה" value="'+esc(q)+'" oninput="setQ(this.value)"></div>'+
    (rows.length?'<div class="scroll"><table><thead><tr><th>כיתה</th><th>מורה</th><th>תלמידים</th><th>מטלות</th><th>הגשות</th><th>עודכן</th></tr></thead><tbody>'+body+'</tbody></table></div>'
     :'<div class="empty">אין כיתות</div>');
}

function paneStudent(){
  const hits=q.length>=2?SU.filter(s=>norm(s.student_name).indexOf(q)>-1):[];
  const byName={};
  hits.forEach(s=>{const k=norm(s.student_name);(byName[k]=byName[k]||[]).push(s);});
  let out='';
  if(q.length<2) out='<div class="empty">חיפוש חוצה כל המורים והכיתות — שימושי כשמורה טוען שאינו רואה עבודה.</div>';
  else if(!hits.length) out='<div class="empty">לא נמצאו הגשות בשם הזה.</div>';
  else out=Object.keys(byName).map(function(nm){
    const arr=byName[nm];
    const cls=[]; const tch=[];
    arr.forEach(s=>{const c=s.class_name||'—'; if(cls.indexOf(c)<0)cls.push(c);
      const t=tName(s.teacher_id)||'לא נמצא'; if(tch.indexOf(t)<0)tch.push(t);});
    const body=arr.map(s=>'<tr><td>'+esc(s.topic)+'</td><td>'+esc(s.class_name||'—')+'</td>'+
      '<td>'+(tName(s.teacher_id)?esc(tName(s.teacher_id)):'<span class="pill p-bad">יתומה</span>')+'</td>'+
      '<td>'+(s.score_auto!=null?s.score_auto+'/'+s.score_max:'—')+(s.skipped?' <span class="pill p-bad">דילג</span>':'')+'</td>'+
      '<td>'+(s.grade!=null?s.grade:'<span class="pill p-wait">לא נבדק</span>')+'</td>'+
      '<td class="mono">'+dt(s.submitted_at)+'</td></tr>').join('');
    return '<div style="margin-bottom:15px;"><div style="font-weight:900;margin-bottom:5px;">'+esc(nm)+
      ' <span class="pill p-v">'+arr.length+' הגשות</span>'+
      ' <span class="pill p-off">כיתות: '+cls.map(esc).join(', ')+'</span>'+
      ' <span class="pill p-off">מורים: '+tch.map(esc).join(', ')+'</span></div>'+
      '<div class="scroll" style="max-height:none"><table><thead><tr><th>מטלה</th><th>כיתה</th><th>מורה</th><th>ציון אוטומטי</th><th>ציון מורה</th><th>הוגש</th></tr></thead><tbody>'+
      body+'</tbody></table></div></div>';
  }).join('');
  document.getElementById('pane').innerHTML=
    '<div class="bar"><input placeholder="הקלידו שם תלמיד (לפחות 2 תווים)" value="'+esc(q)+'" oninput="setQ(this.value)"></div>'+out;
}

function paneSubs(){
  const list=SU.filter(s=>!q||((s.student_name||'')+' '+(s.topic||'')+' '+(s.class_name||'')).indexOf(q)>-1).slice(0,400);
  const body=list.map(s=>'<tr><td><b>'+esc(s.student_name)+'</b></td><td>'+esc(s.class_name||'—')+'</td>'+
    '<td>'+(tName(s.teacher_id)?esc(tName(s.teacher_id)):'<span class="pill p-bad">יתומה</span>')+'</td>'+
    '<td>'+esc(s.topic)+'</td>'+
    '<td>'+(s.score_auto!=null?s.score_auto+'/'+s.score_max:'—')+(s.skipped?' <span class="pill p-bad">דילג</span>':'')+'</td>'+
    '<td class="mono">'+dt(s.submitted_at)+'</td></tr>').join('');
  document.getElementById('pane').innerHTML=
    '<div class="bar"><input placeholder="סינון לפי תלמיד, מטלה או כיתה" value="'+esc(q)+'" oninput="setQ(this.value)">'+
    '<span class="pill p-off">מוצגות '+list.length+' מתוך '+SU.length+'</span></div>'+
    '<div class="scroll"><table><thead><tr><th>תלמיד</th><th>כיתה</th><th>מורה</th><th>מטלה</th><th>ציון</th><th>הוגש</th></tr></thead><tbody>'+
    body+'</tbody></table></div>';
}

function paneDiag(){
  const d=diagnostics();
  function box(title,arr,txt){
    if(!arr.length) return '<div class="diag okd"><b>✅ '+title+' — אין</b>'+txt+'</div>';
    const body=arr.slice(0,60).map(s=>'<tr><td>'+esc(s.student_name)+'</td><td>'+esc(s.class_name||'—')+'</td>'+
      '<td>'+esc(s.topic)+'</td><td class="mono">'+esc(s.teacher_id||'—')+'</td>'+
      '<td class="mono">'+dt(s.submitted_at)+'</td></tr>').join('');
    return '<div class="diag"><b>⚠ '+title+' — '+arr.length+'</b>'+txt+
      '<div class="scroll" style="max-height:210px;margin-top:9px;background:#fff"><table><thead><tr>'+
      '<th>תלמיד</th><th>כיתה</th><th>מטלה</th><th>מזהה מורה</th><th>הוגש</th></tr></thead><tbody>'+
      body+'</tbody></table></div></div>';
  }
  document.getElementById('pane').innerHTML=
    box('הגשות יתומות', d.orphan,
        'מזהה המורה בהגשה אינו קיים בטבלת המורים. <b>המורה לא יראה אותן בשום מסך.</b> בדרך כלל קישור ישן או מורה שנמחק.')+
    box('הגשות לכיתה שאינה מוגדרת', d.noClass,
        'המורה קיים, אך שם הכיתה בהגשה אינו תואם אף כיתה שהגדיר. ההגשה תופיע ברשימה הכללית אך <b>לא בלוח הכיתה</b>.')+
    box('תלמידים שאינם ברשימת הכיתה', d.notInRoster,
        'הכיתה קיימת, אך שם התלמיד אינו ברשימה — לרוב הקלדה חופשית לפני שהוגדרה רשימה. <b>לא יופיע כשורה בלוח הכיתה</b>.');
}
/* ===================== סטטיסטיקות ===================== */
function setPer(v){per=v;render();}

/* שם ידידותי לזירה */
const ZNAME={'1':'להבין ולפרש','2':'גלובליזציה','3':'חדשות וצילום','4':'הומור וסאטירה',
 '5':'תרבות דיגיטלית','6':'ריאליטי','7':'הגדרות ותכנים','8':'תקשורת וספורט','9':'פרסום','al':'זירת העל'};
const LTNAME={mushag:'מיני-שיעור למושג',summary:'סיכום זירה',masa:'מסע מושג'};

/* פילוח topic כשהעמודות הייעודיות ריקות (הגשות ישנות) */
function subMeta(s){
  const t=String(s.topic||'');
  let zone=s.zone, type=s.lesson_type, concept=s.concept;
  if(!zone||!type){
    const m=t.match(/^zira(al|[0-9]+)_/);
    if(!zone) zone=m?m[1]:(t.indexOf('masa')===0?'':'');
    if(!type) type=t.indexOf('masa')===0?'masa':(t.indexOf('_mushag_')>-1?'mushag':(m?'summary':''));
    if(!concept&&type==='mushag'){const c=t.split('_mushag_')[1];concept=c||'';}
    if(!concept&&type==='masa') concept=t.slice(5)||'';
  }
  /* הגשות ישנות ללא עמודת page — גוזרים את שם הקובץ מה-topic כדי שלא יתפצלו לשתי שורות */
  let page=s.page||'';
  if(!page&&t){
    const mm=t.match(/^(zira(?:al|[0-9]+))_mushag_/);
    if(mm) page=mm[1]+'-mushag.html';
    else if(t.indexOf('masa')===0) page='masa-mushag.html';
    else{
      const ms=t.match(/^(zira(?:al|[0-9]+))_(.+)$/);
      if(ms) page=ms[1]+'-1-'+ms[2]+'.html';
    }
  }
  return {zone:zone||'',type:type||'',concept:concept||'',
          page:page, label:page||t||'—'};
}
/* אחוז ההצלחה האוטומטי של הגשה, או null אם אין ניקוד */
function pct(s){
  if(s.score_auto==null||!s.score_max) return null;
  return Math.round(s.score_auto/s.score_max*100);
}
function inPer(s){
  if(per==='all') return true;
  if(!s.submitted_at) return false;
  return (Date.now()-new Date(s.submitted_at).getTime())<=per*864e5;
}
/* טבלת דירוג גנרית */
function rankTable(head,rows,empty){
  if(!rows.length) return '<div class="empty">'+(empty||'אין נתונים בטווח שנבחר')+'</div>';
  return '<div class="scroll" style="max-height:none"><table><thead><tr>'+
    head.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+
    rows.map((r,i)=>'<tr><td><span class="rank">'+(i+1)+'</span>'+r[0]+'</td>'+
      r.slice(1).map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+
    '</tbody></table></div>';
}
function trk(v,max,cls){
  const w=max>0?Math.round(v/max*100):0;
  return '<div class="trk '+(cls||'')+'"><i style="width:'+w+'%"></i></div>';
}
function avgPill(list){
  const v=list.map(pct).filter(x=>x!=null);
  if(!v.length) return '<span class="pill p-off">—</span>';
  const a=Math.round(v.reduce((x,y)=>x+y,0)/v.length);
  const c=a>=75?'p-ok':(a>=55?'p-wait':'p-bad');
  return '<span class="pill '+c+'">'+a+'%</span>';
}

function paneStats(){
  const S=SU.filter(inPer);
  const capped=SU.length>=SU_CAP;

  /* ---- מדדים כלליים ---- */
  const uStud=new Set(S.map(s=>norm(s.student_name)+'|'+norm(s.class_name))).size;
  const uTeach=new Set(S.map(s=>s.teacher_id).filter(Boolean)).size;
  const uClass=new Set(S.map(s=>s.teacher_id+'|'+norm(s.class_name)).filter(k=>k.indexOf('|')>0)).size;
  const scored=S.map(pct).filter(x=>x!=null);
  const avg=scored.length?Math.round(scored.reduce((a,b)=>a+b,0)/scored.length):null;
  const skips=S.filter(s=>s.skipped).length;
  const ungraded=S.filter(s=>s.grade==null).length;

  /* ---- מורים מובילים ---- */
  const byT={};
  S.forEach(s=>{const k=s.teacher_id||'—';(byT[k]=byT[k]||[]).push(s);});
  const teachers=Object.keys(byT).map(function(id){
    const arr=byT[id];
    return {id:id,name:tName(id),n:arr.length,arr:arr,
      stud:new Set(arr.map(s=>norm(s.student_name)+'|'+norm(s.class_name))).size,
      cls:new Set(arr.map(s=>norm(s.class_name))).size,
      pages:new Set(arr.map(s=>subMeta(s).label)).size,
      ung:arr.filter(s=>s.grade==null).length,
      last:arr.reduce((m,s)=>{const d=new Date(s.submitted_at).getTime();return d>m?d:m;},0)};
  }).sort((a,b)=>b.n-a.n);
  const tMax=teachers.length?teachers[0].n:0;
  const tRows=teachers.slice(0,15).map(t=>[
    '<b>'+(t.name?esc(t.name):'<span class="pill p-bad">מורה לא נמצא</span>')+'</b>',
    '<b>'+t.n+'</b> '+trk(t.n,tMax),
    t.stud, t.cls, t.pages, avgPill(t.arr),
    t.ung?'<span class="pill p-wait">'+t.ung+'</span>':'<span class="pill p-ok">0</span>',
    '<span class="mono">'+(t.last?dt(new Date(t.last).toISOString()):'—')+'</span>']);

  /* ---- קבצים פופולריים ---- */
  const byP={};
  S.forEach(s=>{const k=subMeta(s).label;(byP[k]=byP[k]||[]).push(s);});
  const pages=Object.keys(byP).map(function(k){
    const arr=byP[k], m=subMeta(arr[0]);
    return {k:k,n:arr.length,arr:arr,meta:m,
      stud:new Set(arr.map(s=>norm(s.student_name)+'|'+norm(s.class_name))).size,
      teach:new Set(arr.map(s=>s.teacher_id)).size,
      skip:arr.filter(s=>s.skipped).length};
  }).sort((a,b)=>b.n-a.n);
  const pMax=pages.length?pages[0].n:0;
  const pRows=pages.slice(0,20).map(p=>[
    '<b class="mono">'+esc(p.k)+'</b>',
    '<span class="pill p-v">'+(LTNAME[p.meta.type]||p.meta.type||'—')+'</span>',
    p.meta.zone?esc(ZNAME[p.meta.zone]||p.meta.zone):'—',
    '<b>'+p.n+'</b> '+trk(p.n,pMax),
    p.stud, p.teach, avgPill(p.arr),
    p.skip?'<span class="pill p-bad">'+p.skip+'</span>':'0']);

  /* ---- פילוח לפי זירה ---- */
  const byZ={};
  S.forEach(s=>{const z=subMeta(s).zone||'—';byZ[z]=(byZ[z]||0)+1;});
  const zArr=Object.keys(byZ).map(z=>({z:z,n:byZ[z]})).sort((a,b)=>b.n-a.n);
  const zMax=zArr.length?zArr[0].n:0;
  const zHtml=zArr.map(x=>'<div style="display:flex;align-items:center;gap:9px;margin-bottom:6px;">'+
    '<div style="min-width:118px;font-weight:800;font-size:.85rem;">'+
      (x.z==='—'?'ללא זירה':esc(ZNAME[x.z]||('זירה '+x.z)))+'</div>'+
    '<div style="flex:1">'+trk(x.n,zMax)+'</div>'+
    '<div style="min-width:38px;text-align:left;font-weight:900;font-size:.85rem;">'+x.n+'</div></div>').join('')
    ||'<div class="empty">אין נתונים</div>';

  /* ---- פילוח לפי סוג שיעור ---- */
  const byLT={};
  S.forEach(s=>{const t=subMeta(s).type||'—';byLT[t]=(byLT[t]||0)+1;});
  const ltArr=Object.keys(byLT).map(t=>({t:t,n:byLT[t]})).sort((a,b)=>b.n-a.n);
  const ltMax=ltArr.length?ltArr[0].n:0;
  const ltHtml=ltArr.map(x=>'<div style="display:flex;align-items:center;gap:9px;margin-bottom:6px;">'+
    '<div style="min-width:118px;font-weight:800;font-size:.85rem;">'+esc(LTNAME[x.t]||x.t)+'</div>'+
    '<div style="flex:1">'+trk(x.n,ltMax,'g')+'</div>'+
    '<div style="min-width:38px;text-align:left;font-weight:900;font-size:.85rem;">'+x.n+'</div></div>').join('')
    ||'<div class="empty">אין נתונים</div>';

  /* ---- מושגים מבוקשים ---- */
  const byC={};
  S.forEach(s=>{const c=subMeta(s).concept;if(c)(byC[c]=byC[c]||[]).push(s);});
  const cArr=Object.keys(byC).map(c=>({c:c,n:byC[c].length,arr:byC[c]})).sort((a,b)=>b.n-a.n);
  const cRows=cArr.slice(0,12).map(x=>['<b class="mono">'+esc(x.c)+'</b>',x.n,avgPill(x.arr)]);

  /* ---- שיעורים קשים: ממוצע נמוך, לפחות 5 הגשות מנוקדות ---- */
  const hard=pages.map(function(p){
    const v=p.arr.map(pct).filter(x=>x!=null);
    return {k:p.k,n:v.length,avg:v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null};
  }).filter(x=>x.n>=5&&x.avg!=null).sort((a,b)=>a.avg-b.avg);
  const hRows=hard.slice(0,10).map(x=>['<b class="mono">'+esc(x.k)+'</b>',x.n,
    '<span class="pill '+(x.avg>=75?'p-ok':x.avg>=55?'p-wait':'p-bad')+'">'+x.avg+'%</span>',
    trk(x.avg,100,x.avg>=75?'g':x.avg>=55?'y':'r')]);

  /* ---- פעילות ב-14 הימים האחרונים ---- */
  const days=[],dayCnt={};
  SU.forEach(s=>{if(!s.submitted_at)return;const d=new Date(s.submitted_at);
    const k=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();dayCnt[k]=(dayCnt[k]||0)+1;});
  for(let i=13;i>=0;i--){const d=new Date(Date.now()-i*864e5);
    const k=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
    days.push({lbl:d.getDate()+'/'+(d.getMonth()+1),n:dayCnt[k]||0});}
  const dMax=Math.max(1,...days.map(x=>x.n));
  const dHtml='<div class="spark">'+days.map(x=>'<div style="height:'+Math.round(x.n/dMax*100)+
    '%" title="'+x.lbl+' — '+x.n+' הגשות"></div>').join('')+'</div>'+
    '<div class="sparkx">'+days.map(x=>'<span>'+x.lbl+'</span>').join('')+'</div>';

  /* ---- פעילות לפי שעה ---- */
  const hrs=new Array(24).fill(0);
  S.forEach(s=>{if(!s.submitted_at)return;hrs[new Date(s.submitted_at).getHours()]++;});
  const hMax=Math.max(1,...hrs);
  const hHtml='<div class="spark">'+hrs.map((n,h)=>'<div style="height:'+Math.round(n/hMax*100)+
    '%" title="'+h+':00 — '+n+' הגשות"></div>').join('')+'</div>'+
    '<div class="sparkx">'+hrs.map((n,h)=>'<span>'+(h%3===0?h:'')+'</span>').join('')+'</div>';

  /* ---- כיתות מובילות ---- */
  const byCl={};
  S.forEach(s=>{const k=(s.teacher_id||'—')+'|'+norm(s.class_name||'—');(byCl[k]=byCl[k]||[]).push(s);});
  const clArr=Object.keys(byCl).map(function(k){
    const arr=byCl[k],p=k.split('|');
    return {name:p[1],tn:tName(p[0]),n:arr.length,arr:arr,
      stud:new Set(arr.map(s=>norm(s.student_name))).size,
      pages:new Set(arr.map(s=>subMeta(s).label)).size};
  }).sort((a,b)=>b.n-a.n);
  const clMax=clArr.length?clArr[0].n:0;
  const clRows=clArr.slice(0,12).map(c=>['<b>'+esc(c.name)+'</b>',
    c.tn?esc(c.tn):'<span class="pill p-bad">לא נמצא</span>',
    '<b>'+c.n+'</b> '+trk(c.n,clMax), c.stud, c.pages, avgPill(c.arr)]);

  /* ---- מורים רדומים: מאושרים ללא הגשות מעולם ---- */
  const active=new Set(SU.map(s=>s.teacher_id));
  const dormant=TE.filter(t=>t.status==='approved'&&!active.has(t.id));

  /* ---- הרכבה ---- */
  document.getElementById('pane').innerHTML=
   (capped?'<div class="note">⚠ נטענו '+SU.length+' ההגשות האחרונות בלבד (התקרה). ייתכן שהנתונים הישנים חסרים.</div>':'')+
   '<div class="bar"><b>טווח:</b> <span class="seg">'+
     '<button class="'+(per===7?'on':'')+'" onclick="setPer(7)">7 ימים</button>'+
     '<button class="'+(per===30?'on':'')+'" onclick="setPer(30)">30 ימים</button>'+
     '<button class="'+(per==='all'?'on':'')+'" onclick="setPer(\'all\')">הכל</button></span>'+
     '<span class="pill p-off">'+S.length+' הגשות בטווח</span></div>'+
   '<div class="kpis">'+
    '<div class="kpi"><b>'+S.length+'</b><span>הגשות</span></div>'+
    '<div class="kpi"><b>'+uStud+'</b><span>תלמידים</span></div>'+
    '<div class="kpi"><b>'+uTeach+'</b><span>מורים פעילים</span></div>'+
    '<div class="kpi"><b>'+uClass+'</b><span>כיתות פעילות</span></div>'+
    '<div class="kpi '+(avg==null?'':avg>=75?'g':avg>=55?'y':'r')+'"><b>'+(avg==null?'—':avg+'%')+'</b><span>ממוצע אוטומטי</span></div>'+
    '<div class="kpi '+(skips?'r':'g')+'"><b>'+skips+'</b><span>דילגו על שלב</span></div>'+
    '<div class="kpi '+(ungraded?'y':'g')+'"><b>'+ungraded+'</b><span>ממתינות לבדיקה</span></div></div>'+

   '<div class="blk" style="margin-bottom:12px"><div class="h3">👑 מורים מובילים</div>'+
    rankTable(['מורה','הגשות','תלמידים','כיתות','קבצים','ממוצע','לא נבדקו','פעילות אחרונה'],tRows)+'</div>'+

   '<div class="blk" style="margin-bottom:12px"><div class="h3">🔥 הקבצים הפופולריים</div>'+
    rankTable(['קובץ','סוג','זירה','הגשות','תלמידים','מורים','ממוצע','דילוגים'],pRows)+'</div>'+

   '<div class="grid2" style="margin-bottom:12px">'+
    '<div class="blk"><div class="h3">🗺️ פילוח לפי זירה</div>'+zHtml+'</div>'+
    '<div class="blk"><div class="h3">🧩 פילוח לפי סוג שיעור</div>'+ltHtml+'</div></div>'+

   '<div class="grid2" style="margin-bottom:12px">'+
    '<div class="blk"><div class="h3">📅 פעילות ב-14 הימים האחרונים</div>'+dHtml+
      '<p class="sub" style="margin:8px 0 0;font-size:.8rem;">כל ההגשות, ללא תלות בבורר הטווח.</p></div>'+
    '<div class="blk"><div class="h3">🕐 פעילות לפי שעה</div>'+hHtml+
      '<p class="sub" style="margin:8px 0 0;font-size:.8rem;">שעות הלימודים מול עבודה מהבית.</p></div></div>'+

   '<div class="grid2" style="margin-bottom:12px">'+
    '<div class="blk"><div class="h3">💡 המושגים המבוקשים</div>'+
      rankTable(['מושג','הגשות','ממוצע'],cRows,'אין הגשות של מיני-שיעורים בטווח')+'</div>'+
    '<div class="blk"><div class="h3">🧗 השיעורים הקשים</div>'+
      rankTable(['קובץ','מנוקדות','ממוצע',''],hRows,'צריך לפחות 5 הגשות מנוקדות לקובץ')+'</div></div>'+

   '<div class="blk" style="margin-bottom:12px"><div class="h3">🏫 הכיתות הפעילות</div>'+
    rankTable(['כיתה','מורה','הגשות','תלמידים','קבצים','ממוצע'],clRows)+'</div>'+

   '<div class="blk"><div class="h3">😴 מורים רדומים — מאושרים ללא הגשות מעולם ('+dormant.length+')</div>'+
    (dormant.length
      ? '<div class="scroll" style="max-height:230px"><table><thead><tr><th>שם</th><th>בית ספר</th><th>טלפון</th><th>כיתות שהגדיר</th><th>נרשם</th></tr></thead><tbody>'+
        dormant.map(t=>'<tr><td><b>'+esc(t.name||'—')+'</b></td><td>'+esc(t.school||'—')+'</td>'+
          '<td class="mono">'+esc(t.phone||'—')+'</td><td>'+CL.filter(c=>c.teacher_id===t.id).length+'</td>'+
          '<td class="mono">'+dt(t.created_at)+'</td></tr>').join('')+'</tbody></table></div>'
      : '<div class="empty">כל המורים המאושרים פעילים</div>')+'</div>';
}

document.addEventListener('keydown',function(e){if(e.key==='Enter'&&document.getElementById('login'))login();});
