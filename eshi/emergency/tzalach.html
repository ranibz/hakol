const USAGE = ['את הרשימות והטפסים יש למלא מבעוד מועד בתחילת שנת הלימודים, ולעדכנם באופן שוטף בכל שינוי.',

/* ===================== מצב ===================== */
let SET = null, ENT = [], EDIT = false, TAB = 'roles', OFFLINE = null, CAN_EDIT = false;
const byKind = k => ENT.filter(e => e.kind === k).sort((a,b) => (a.sort||0)-(b.sort||0));
const entry = (k, key) => ENT.find(e => e.kind === k && e.key === key);

async function load(){
  try{
    const [s, e] = await Promise.all([api('tz_settings?select=*&id=eq.1'), api('tz_entries?select=*&order=kind,sort')]);
    SET = (s||[])[0] || {}; ENT = e || []; OFFLINE = null;
    LS.set('tz_cache', { SET, ENT, at:new Date().toISOString() });
  }catch(err){
    const c = LS.get('tz_cache');
    if(c){ SET = c.SET; ENT = c.ENT; OFFLINE = c.at; }
    else throw err;
  }
}
async function touch(){
  const now = new Date().toISOString(); SET.updated_at = now;
  try{ await api('tz_settings?id=eq.1', { method:'PATCH', body: JSON.stringify({ updated_at: now }) }); }catch(e){}
  LS.set('tz_cache', { SET, ENT, at: now });
}
async function putEntry(kind, key, data, sort){
  const row = { kind, key, data, sort: sort ?? (entry(kind,key)||{}).sort ?? 0, updated_at: new Date().toISOString() };
  await api('tz_entries?on_conflict=kind,key', { method:'POST', prefer:'resolution=merge-duplicates', body: JSON.stringify(row) });
  const i = ENT.findIndex(e => e.kind===kind && e.key===key); if(i>=0) ENT[i] = row; else ENT.push(row);
  await touch();
}
async function delEntry(kind, key){
  await api(`tz_entries?kind=eq.${kind}&key=eq.${encodeURIComponent(key)}`, { method:'DELETE' });
  ENT = ENT.filter(e => !(e.kind===kind && e.key===key)); await touch();
}

/* ===================== כניסה ===================== */
async function enter(){
  const code = $('gCode').value.trim(), m = $('gMsg');
  if(!code){ m.textContent = 'הקלידו קוד'; return; }
  m.textContent = 'בודק…';
  try{ await load(); }catch(e){ m.textContent = 'אין חיבור, ואין עותק שמור במכשיר הזה.'; return; }
  if(code === String(SET.edit_code||'') ){ CAN_EDIT = true; }
  else if(code !== String(SET.view_code||'')){ m.textContent = 'קוד שגוי'; return; }
  LS.set('tz_sess', { ok:true, edit:CAN_EDIT });
  start();
}
function start(){
  $('gate').classList.add('hidden'); $('app').classList.remove('hidden'); $('acts').classList.remove('hidden');
  $('edBtn').classList.toggle('hidden', !CAN_EDIT);
  draw();
}
function logout(){ LS.set('tz_sess', null); location.reload(); }

const TABS = [['roles','👥 בעלי תפקידים'],['contacts','🏛️ גורמי קשר ברשות'],['vol','🙋 מתנדבים'],['staff','🧑‍🏫 צוות'],['mash','🧭 מעש"ה'],['set','⚙️ הגדרות']];
function setTab(t){ TAB = t; draw(); window.scrollTo(0,0); }
function toggleEdit(){ EDIT = !EDIT; $('edBtn').classList.toggle('on', EDIT); $('edBtn').textContent = EDIT ? '✅ סיום עריכה' : '✏️ עריכה'; draw(); }
function draw(){
  $('hSub').textContent = (SET.school || 'צוות לשעת חירום') + ' · עודכן לאחרונה: ' + fmtD(SET.updated_at);
  $('offBar').innerHTML = OFFLINE ? `<div class="off">📴 אין חיבור. מוצג העותק השמור במכשיר מ-${fmtD(OFFLINE)}. אי אפשר לערוך עד שהחיבור יחזור.</div>` : '';
  const tabs = TABS.filter(([k]) => k !== 'set' || CAN_EDIT);
  $('tabs').innerHTML = tabs.map(([k,t]) => `<button class="${TAB===k?'on':''}" onclick="setTab('${k}')">${t}</button>`).join('');

  const V = { roles:rolesHTML, contacts:contactsHTML, vol:volHTML, staff:staffHTML, mash:mashHTML, set:setHTML }[TAB];

/* ===================== רכיבים ===================== */
function callBtns(p){
  let h = '';
  if(p.mobile) h += `<a class="call" href="tel:${esc(digits(p.mobile))}">📞 ${esc(p.mobile)}</a>`;
  if(p.home)   h += `<a class="call h" href="tel:${esc(digits(p.home))}">🏠 ${esc(p.home)}</a>`;
  if(p.office) h += `<a class="call h" href="tel:${esc(digits(p.office))}">🏢 ${esc(p.office)}</a>`;
  if(p.email)  h += `<a class="call m" href="mailto:${esc(p.email)}">✉️</a>`;
  return h ? `<span class="calls">${h}</span>` : '';
}
function descHTML(d, fn){
  if(!d.length) return '';
  return `<details><summary>📋 תיאור התפקיד ▾</summary><ul>${d.map(x => x.startsWith('#') ? `<li class="h">${esc(x.slice(1))}</li>` : `<li>${esc(x)}</li>`).join('')}</ul>${fn?`<div class="fn">${esc(fn)}</div>`:''}</details>`;
}
const PF = [['name','שם'],['mobile','טלפון נייד'],['home','טלפון בבית'],['email','דוא"ל'],['address','כתובת']];

function rolesHTML(ed){
  const missing = ROLES.filter(r => r.k!=='other' && !((entry('role',r.k)||{}).data||{}).p?.[0]?.name).length;
  let h = `<div class="note">${USAGE.map((u,i)=>`${i+1}. ${esc(u)}`).join('<br>')}</div>`;
  if(missing) h += `<div class="muted" style="margin:-2px 0 10px;font-weight:700;color:var(--warn)">⚠️ ${missing} תפקידים עוד בלי שם${CAN_EDIT && !ed ? ' — לחצו ✏️ עריכה' : ''}</div>`;
  h += ROLES.map(r => {
    const P = ((entry('role', r.k)||{}).data||{}).p || [];
    if(ed) return `<div class="card"><h2>${esc(r.t)} ${r.sub?`<small>(${esc(r.sub)})</small>`:''}</h2>
      ${r.L.map((lb,i) => `<div class="pl">${esc(lb)}</div><div class="ed">${PF.map(([f,t]) => `<div><label>${t}</label><input class="t" id="r-${r.k}-${i}-${f}" value="${esc((P[i]||{})[f])}" ${f==='mobile'||f==='home'?'inputmode="tel"':''}></div>`).join('')}</div>`).join('')}
      <button class="btn" onclick="saveRole('${r.k}')">שמירה</button></div>`;
    return `<div class="card"><h2>${esc(r.t)} ${r.sub?`<small>(${esc(r.sub)})</small>`:''}</h2>
      ${r.L.map((lb,i) => { const p = P[i]||{};
        return `<div class="per"><span class="lb">${esc(lb)}</span><span class="nm ${p.name?'':'empty'}">${p.name?esc(p.name):'לא הוגדר'}</span>${callBtns(p)}${p.address?`<span class="ad">📍 ${esc(p.address)}</span>`:''}</div>`; }).join('')}
      ${descHTML(r.d, r.fn)}</div>`;
  }).join('');
  return h;
}
async function saveRole(k){
  const r = ROLES.find(x => x.k === k);
  const p = r.L.map((_,i) => Object.fromEntries(PF.map(([f]) => [f, ($(`r-${k}-${i}-${f}`).value||'').trim()])));
  try{ await putEntry('role', k, { p }, ROLES.indexOf(r)); toast('✅ נשמר: ' + r.t); draw(); }catch(e){ toast('שגיאה בשמירה — האם הורץ HAKOL-tzalach.sql?'); }
}

const LISTS = {
  contact:{ f:[['label','תפקיד'],['name','שם ושם משפחה'],['email','דואר אלקטרוני'],['mobile','נייד'],['office','משרד']] },
  vol:    { f:[['name','שם ושם משפחה'],['role','תפקיד'],['address','כתובת'],['mobile','טלפון נייד'],['avail','מועדי זמינות']] },
  staff:  { f:[['name','שם איש/אשת צוות'],['role','תפקיד / מקצוע'],['mobile','טלפון נייד'],['home','טלפון בבית'],['address','כתובת מגורים'],['email','דוא"ל'],['notes','רגישויות מיוחדות והערות']] }
};
function listEdit(kind, key, d){
  return `<div class="card"><div class="ed">${LISTS[kind].f.map(([f,t]) => `<div><label>${t}</label><input class="t" id="l-${key}-${f}" value="${esc(d[f])}" ${f==='mobile'||f==='home'||f==='office'?'inputmode="tel"':''}></div>`).join('')}</div>
    <div class="row"><button class="btn sm" onclick="saveItem('${kind}','${key}')">שמירה</button><button class="btn bad sm" onclick="delItem('${kind}','${key}')">🗑️ מחיקה</button></div></div>`;
}
async function saveItem(kind, key, extra){
  const d = Object.fromEntries(LISTS[kind].f.map(([f]) => { const el = $(`l-${key}-${f}`); return [f, el ? el.value.trim() : ((entry(kind,key)||{}).data||{})[f] || '']; }));
  Object.assign(d, extra||{});
  if(!d.name && !d.label){ toast('כתבו שם'); return; }
  try{ await putEntry(kind, key, d); toast('✅ נשמר'); draw(); }catch(e){ toast('שגיאה בשמירה'); }
}
async function delItem(kind, key){
  const d = (entry(kind,key)||{}).data||{};
  if(!confirm('למחוק את ' + (d.name || d.label || 'השורה') + '?')) return;
  try{ await delEntry(kind, key); draw(); }catch(e){ toast('שגיאה'); }
}
async function addItem(kind){
  const key = 'x-' + uid(), sort = byKind(kind).reduce((m,e)=>Math.max(m,e.sort||0),0) + 1;
  const d = kind === 'contact' ? { label:'נוסף' } : {};
  try{ await putEntry(kind, key, d, sort); draw(); setTimeout(()=>{ const el = $(`l-${key}-name`); if(el){ el.scrollIntoView({block:'center'}); el.focus(); } }, 50); }catch(e){ toast('שגיאה'); }
}

function contactsHTML(ed){
  let h = `<div class="muted" style="margin-bottom:8px">טופס 3 — רשימה של גורמי קשר ודיווח פורמלי ברשות המקומית</div>`;

let STAFF_Q = '';

         ${d.notes||d.address?`<span class="ad">${d.address?'📍 '+esc(d.address):''}${d.address&&d.notes?' · ':''}${d.notes?'⚠️ '+esc(d.notes):''}</span>`:''}</div></div>`; }).join('')
    || `<div class="card muted">${q?'לא נמצא.':'עוד לא נוספו אנשי צוות.'}</div>`;
  if(ed) h += `<button class="btn sec" onclick="addItem('staff')">➕ הוספת איש/אשת צוות</button>`;

async function importStaff(){
  const lines = ($('stImp').value||'').split(/\r?\n/).map(x => x.trim()).filter(Boolean);
  if(!lines.length){ toast('הדביקו לפחות שורה אחת'); return; }
  const rows = [], have = byKind('staff');
  let sort = have.reduce((m,e)=>Math.max(m,e.sort||0),0);
  lines.forEach(l => {
    const parts = l.split(/\t|,|;/).map(x => x.replace(/\s+/g,' ').trim()).filter(Boolean);
    const phone = parts.find(p => /^[\d\-+ ()]{7,}$/.test(p)) || '';
    const rest = parts.filter(p => p !== phone);
    const name = rest[0] || ''; if(!name) return;
    const ex = have.find(e => e.data.name === name);
    const data = Object.assign({}, ex ? ex.data : {}, { name }, rest[1] ? { role: rest.slice(1).join(', ') } : {}, phone ? { mobile: phone } : {});
    rows.push({ kind:'staff', key: ex ? ex.key : 'x-' + uid(), sort: ex ? ex.sort : ++sort, data, updated_at:new Date().toISOString() });
  });
  if(!rows.length){ toast('לא נמצאו שמות'); return; }
  try{ await api('tz_entries?on_conflict=kind,key', { method:'POST', prefer:'resolution=merge-duplicates', body: JSON.stringify(rows) });
    rows.forEach(r => { const i = ENT.findIndex(e => e.kind==='staff' && e.key===r.key); if(i>=0) ENT[i]=r; else ENT.push(r); });
    await touch(); toast('✅ נשמרו ' + rows.length); draw();
  }catch(e){ toast('שגיאה בשמירה'); }
}

/* ----- מעש"ה ----- */
function mashHTML(){
  const M = [['מ','#f2b705','מקד מחויבות','מחויבות - יצירת מחויבות (נאמר לילדים: "אני כאן אתכם").'],
             ['ע','#3fb6c8','עודד לפעילות יעילה','עידוד לפעילות יעילה (הפעלת הילד באופן יעיל, בעת האיום).'],
             ['ש','#c2418f','שאל שאלות מעוררות מחשבה','שאילת שאלות שכלתניות מעוררות מחשבה (בחירה, החלטה, עובדות).'],
             ['ה','#1d5fb8','הבנה את רצף האירועים','הבנייה של רצף האירועים והסבר פשוט של ההתרחשות לפי זמנים, והדגשת סיום האירוע']];
  return `<div class="card"><h2>🧭 הגשת עזרה ראשונה- נפשית, בארבעה צעדים: מודל מעש"ה</h2>
    <p style="margin:6px 0 0;font-size:15px;line-height:1.65">לשימוש כתמיכה ראשונה בעת אירוע חירום. המודל, מאת ד"ר משה פרחי, מציע לנקוט בזמן אמת בארבע פעולות כעזרה ראשונה נפשית לאדם שמתמודד עם מצב חירום.</p>
    <div class="mash">${M.map(([l,c,t,d]) => `<div style="background:${c}"><b>${l}</b><span>${t}</span><small>${esc(d)}</small></div>`).join('')}</div></div>
    <p class="muted" style="text-align:center">כדאי לשלוח לכל מורה את הלשונית הזו — היא נפתחת גם בלי רשת אחרי כניסה אחת.</p>`;
}

/* ----- הגדרות ----- */
function setHTML(){
  if(!CAN_EDIT) return '';
  return `<div class="card"><h2>⚙️ פרטי המוסד</h2>
    <div class="ed">${[['school','שם המוסד החינוכי'],['principal','שם המנהל/ת'],['symbol','סמל המוסד']].map(([f,t]) => `<div><label>${t}</label><input class="t" id="s-${f}" value="${esc(SET[f])}"></div>`).join('')}</div>
    <div class="muted" style="margin:4px 0 8px">תאריך עדכון אחרון: <b>${fmtD(SET.updated_at)}</b> — מתעדכן לבד בכל שמירה.</div>
    <h2 style="margin-top:12px">🔑 קודים</h2>
    <div class="ed"><div><label>קוד צל"ח (צפייה)</label><input class="t" id="s-view_code" value="${esc(SET.view_code)}"></div>
      <div><label>קוד מנהל (עריכה)</label><input class="t" id="s-edit_code" value="${esc(SET.edit_code)}"></div></div>
    <p class="muted" style="margin:2px 0 10px">הקודים נבדקים בדף עצמו, ולכן הם מונעים כניסה מקרית ולא פריצה. בגלל זה אין כאן מידע רגיש על תלמידים — מיפוי מעגלי הפגיעות ייבנה בשלב 3, עם כניסה מאובטחת.</p>
    <div class="row"><button class="btn" onclick="saveSet()">שמירה</button><button class="btn sec" onclick="logout()">יציאה מהתיק במכשיר הזה</button></div></div>`;
}
async function saveSet(){
  const d = Object.fromEntries(['school','principal','symbol','view_code','edit_code'].map(f => [f, ($('s-'+f).value||'').trim()]));
  if(!d.view_code || !d.edit_code){ toast('שני הקודים חובה'); return; }
  if(d.view_code === d.edit_code){ toast('קוד הצפייה וקוד העריכה חייבים להיות שונים'); return; }
  try{ await api('tz_settings?id=eq.1', { method:'PATCH', body: JSON.stringify(d) }); Object.assign(SET, d); await touch(); toast('✅ נשמר'); draw(); }catch(e){ toast('שגיאה בשמירה'); }
}

/* ===================== הדפסה ===================== */
function tbl(head, rows){ return `<table><tr>${head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`; }
function doPrint(){
  const P = [];
  P.push(`<div class="pg"><h1>תיק צל"ח<br>צוות לשעת חירום במוסד החינוכי</h1><div class="cov">
    שם המוסד החינוכי: <b>${esc(SET.school)}</b><br>שם המנהל/ת: <b>${esc(SET.principal)}</b><br>סמל המוסד: <b>${esc(SET.symbol)}</b><br>תאריך עדכון אחרון: <b>${fmtD(SET.updated_at)}</b></div>
    <p style="margin-top:12mm">${USAGE.map((u,i)=>`${i+1}. ${esc(u)}`).join('<br>')}</p></div>`);
  const rr = [];
  ROLES.forEach(r => { const P2 = ((entry('role',r.k)||{}).data||{}).p || [];
    r.L.forEach((lb,i) => { const p = P2[i]||{}; rr.push([i===0 ? r.t : '', lb, p.name||'', p.address||'', p.email||'', [p.home,p.mobile].filter(Boolean).join(' / ')]); }); });
  P.push(`<div class="pg"><h2>1. טופס מרכז בעלי תפקידים בצל"ח</h2>${tbl(['תפקיד','','שם','כתובת','דוא"ל','טלפון בבית / נייד'], rr)}</div>`);
  const cr = CONTACTS.map(([k,t]) => { const d = (entry('contact',k)||{}).data||{}; return [t, d.name||'', d.email||'', [d.mobile&&'נייד: '+d.mobile, d.office&&'משרד: '+d.office].filter(Boolean).join(' · ')]; })
    .concat(byKind('contact').filter(e=>e.key.startsWith('x-')).map(e => { const d = e.data||{}; return [d.label||'נוסף', d.name||'', d.email||'', [d.mobile&&'נייד: '+d.mobile, d.office&&'משרד: '+d.office].filter(Boolean).join(' · ')]; }));
  P.push(`<div class="pg"><h2>3. רשימה של גורמי קשר ודיווח פורמלי ברשות המקומית</h2>${tbl(['','שם ושם משפחה','דואר אלקטרוני','פרטי התקשרות'], cr)}</div>`);
  P.push(`<div class="pg"><h2>4. רשימת מתנדבים</h2>${tbl(['מספר','שם ושם משפחה','תפקיד','כתובת','טלפון נייד','מועדי זמינות'], byKind('vol').map((e,i)=>{ const d=e.data||{}; return [i+1, d.name, d.role, d.address, d.mobile, d.avail]; }))}</div>`);
  P.push(`<div class="pg"><h2>רשימות אנשי צוות</h2>${tbl(['שם איש צוות','תפקיד','פרטי התקשרות','כתובת מגורים + דוא"ל','רגישויות מיוחדות והערות'],
    byKind('staff').sort((a,b)=>String(a.data.name||'').localeCompare(String(b.data.name||''),'he')).map(e=>{ const d=e.data||{}; return [d.name, d.role, [d.mobile,d.home].filter(Boolean).join(' / '), [d.address,d.email].filter(Boolean).join(' · '), d.notes]; }))}</div>`);
  P.push(`<div class="pg"><h2>מודל מעש"ה — עזרה ראשונה נפשית</h2><p>1. מחויבות - יצירת מחויבות (נאמר לילדים: "אני כאן אתכם").<br>2. עידוד לפעילות יעילה (הפעלת הילד באופן יעיל, בעת האיום).<br>3. שאילת שאלות שכלתניות מעוררות מחשבה (בחירה, החלטה, עובדות).<br>4. הבנייה של רצף האירועים והסבר פשוט של ההתרחשות לפי זמנים, והדגשת סיום האירוע</p></div>`);
  $('print').innerHTML = P.join('');
  window.print();
}

/* ===================== פתיחה ===================== */
(async function(){
  const s = LS.get('tz_sess');
  if(s && s.ok){
    CAN_EDIT = !!s.edit;
    try{ await load(); start(); }catch(e){ $('gate').classList.remove('hidden'); $('gMsg').textContent = 'אין חיבור, ואין עותק שמור במכשיר הזה.'; }
  } else $('gate').classList.remove('hidden');
})();
</script>
