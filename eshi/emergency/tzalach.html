/* ===================== מצב ===================== */
let SET = {}, ENT = [], SEC = null, STUDENTS = null, LEVEL = 'view', EDIT = false, TAB = 'book', SUB = {}, OFFLINE = null, SECCODE = null, EVSEL = null;
const byKind = k => ENT.filter(e => e.kind === k).sort((a,b) => (a.sort||0)-(b.sort||0));
const secKind = k => (SEC||[]).filter(e => e.kind === k).sort((a,b) => (a.sort||0)-(b.sort||0));
const entry = (k, key) => ENT.find(e => e.kind === k && e.key === key);
const canEdit = () => LEVEL === 'edit' || LEVEL === 'secure';
const events = () => byKind('event').sort((a,b) => String(b.data.opened_at||'').localeCompare(String(a.data.opened_at||'')));
const activeEvent = () => events().find(e => e.data.active);
const curEvent = () => events().find(e => e.key === EVSEL) || activeEvent() || events()[0] || null;

async function load(){
  try{
    const [s, e] = await Promise.all([api('tz_settings?select=*&id=eq.1'), api('tz_entries?select=*&order=kind,sort')]);
    SET = (s||[])[0] || {}; ENT = e || []; OFFLINE = null;
    LS.set('tz_cache', { SET, ENT, at:new Date().toISOString() });
  }catch(err){
    const c = LS.get('tz_cache');
    if(c){ SET = c.SET; ENT = c.ENT; OFFLINE = c.at; } else throw err;
  }
}
async function loadStudents(){
  if(STUDENTS) return STUDENTS;
  try{ STUDENTS = await api('students?select=id,name,class&active=eq.true&order=name') || []; }catch(e){ STUDENTS = []; }
  return STUDENTS;
}
const GR = {'ז':1,'ח':2,'ט':3,'י':4,'יא':5,'יב':6};
const classSort = (a,b) => { const [ga,na]=String(a).split(' '), [gb,nb]=String(b).split(' '); return ((GR[ga]||9)-(GR[gb]||9)) || ((parseInt(na)||0)-(parseInt(nb)||0)) || String(a).localeCompare(String(b),'he'); };
const classes = () => [...new Set((STUDENTS||[]).map(s => s.class).filter(Boolean))].sort(classSort);

async function touch(){
  const now = new Date().toISOString(); SET.updated_at = now;
  try{ await api('tz_settings?id=eq.1', { method:'PATCH', body: JSON.stringify({ updated_at: now }) }); }catch(e){}
  LS.set('tz_cache', { SET, ENT, at: now });
}
// שמירה לטבלה הרגילה או לאזור המוגן
async function put(kind, key, data, sort){
  const sec = FORMS[kind] && FORMS[kind].sec || kind === 'stu';
  const list = sec ? SEC : ENT;
  const old = list.find(e => e.kind===kind && e.key===key);
  const row = { kind, key, data, sort: sort ?? (old||{}).sort ?? 0, updated_at: new Date().toISOString() };
  if(sec) await rpc('tz_sec_put', { p_code:SECCODE, p_kind:kind, p_key:key, p_data:data, p_sort:row.sort });
  else await api('tz_entries?on_conflict=kind,key', { method:'POST', prefer:'resolution=merge-duplicates', body: JSON.stringify(row) });
  const i = list.findIndex(e => e.kind===kind && e.key===key); if(i>=0) list[i] = row; else list.push(row);
  if(!sec) await touch();
}
async function del(kind, key){
  const sec = FORMS[kind] && FORMS[kind].sec || kind === 'stu';
  if(sec){ await rpc('tz_sec_del', { p_code:SECCODE, p_kind:kind, p_key:key }); SEC = SEC.filter(e => !(e.kind===kind && e.key===key)); }
  else { await api(`tz_entries?kind=eq.${kind}&key=eq.${encodeURIComponent(key)}`, { method:'DELETE' }); ENT = ENT.filter(e => !(e.kind===kind && e.key===key)); await touch(); }
}

async function enter(){
  const code = $('gCode').value.trim(), m = $('gMsg');
  if(!code){ m.textContent = 'הקלידו קוד'; return; }
  m.textContent = 'בודק…'; $('gBtn').disabled = true;
  try{ await load(); }catch(e){ m.textContent = 'אין חיבור, ואין עותק שמור במכשיר הזה.'; $('gBtn').disabled = false; return; }
  let lvl = null;
  if(code === String(SET.view_code||'')) lvl = 'view';
  else { try{ lvl = await rpc('tz_role', { p_code: code }); }catch(e){ lvl = null; } }
  $('gBtn').disabled = false;
  if(!lvl){ m.textContent = 'קוד שגוי'; return; }
  if(lvl === 'secure'){ SECCODE = code; SS.set('tz_sec', code); }
  LEVEL = lvl; LS.set('tz_sess', { level: lvl === 'secure' ? 'edit' : lvl });   // האזור המוגן לא נזכר בין פתיחות
  if(lvl === 'secure') await loadSec();
  start();
}
async function askSecure(){
  if(SEC){ if(confirm('לנעול את האזור המוגן במכשיר הזה?')){ SEC = null; SECCODE = null; SS.set('tz_sec', null); if(LEVEL==='secure') LEVEL='edit'; draw(); } return; }
  const c = prompt('קוד האזור המוגן:'); if(!c) return;
  SECCODE = c.trim();
  if(await loadSec()){ SS.set('tz_sec', SECCODE); LEVEL = 'secure'; LS.set('tz_sess', { level:'edit' }); toast('🔓 האזור המוגן פתוח'); draw(); }
}
async function loadSec(){
  try{ SEC = await rpc('tz_sec_list', { p_code: SECCODE }) || []; return true; }
  catch(e){ SEC = null; SECCODE = null; SS.set('tz_sec', null); toast(String(e.message).includes('שגוי') ? 'קוד האזור המוגן שגוי' : 'אין חיבור לאזור המוגן — האם הורץ HAKOL-tzalach.sql v2?'); return false; }
}
function start(){
  $('gate').classList.add('hidden'); $('app').classList.remove('hidden'); $('acts').classList.remove('hidden');
  loadStudents().then(() => { if(['event','lists'].includes(TAB)) draw(); });

// טופס גנרי: רשומות + הוספה/עריכה
let EDITING = null;
function formHTML(kind, opts = {}){
  const F = FORMS[kind];
  if(F.sec && !SEC) return secGate(F.t);
  const ev = F.ev ? curEvent() : null;
  if(F.ev && !ev) return `<div class="card muted">אין עדיין אירוע. פותחים אירוע בלשונית 🚨 אירוע.</div>`;
  let rows = (F.sec ? secKind(kind) : byKind(kind)).filter(r => !F.ev || r.data.event === ev.key);
  if(opts.filter) rows = rows.filter(opts.filter);
  const closed = ev && !ev.data.active;
  const can = (F.sec ? !!SEC : canEdit()) && !OFFLINE;
  let h = `<div class="card ${F.sec?'':''}"><h2>${esc(F.t)}</h2>${F.sub?`<p class="muted">${esc(F.sub)}</p>`:''}
    ${F.sec?`<div class="secn">🔒 נשמר באזור המוגן בלבד. לא נשמר בטלפון ולא מודפס בלי האזור המוגן פתוח.</div>`:''}
    ${opts.top||''}`;
  h += rows.map(r => EDITING === r.key ? recForm(kind, r.key, r.data) : `<div class="rec">
      ${F.f.map(([f,t]) => r.data[f] ? `<div class="f"><b>${esc(t)}</b>${nl(r.data[f])}</div>` : '').join('')}
      <div class="row" style="margin-top:4px"><span class="tm">${fmtD(r.updated_at)}${r.data.by?' · '+esc(r.data.by):''}</span>
      ${can ? `<span style="margin-inline-start:auto" class="row"><button class="btn sec sm" onclick="EDITING='${r.key}';draw()">✏️</button><button class="btn bad sm" onclick="delRec('${kind}','${r.key}')">🗑️</button></span>` : ''}</div></div>`).join('')
    || `<p class="muted">עוד אין רשומות.</p>`;
  if(can && EDITING === 'new:' + kind) h += recForm(kind, null, opts.init ? opts.init() : {});
  else if(can) h += `<button class="btn" onclick="EDITING='new:${kind}';draw();setTimeout(()=>{const e=document.querySelector('.rec.edit input,.rec.edit textarea');if(e){e.focus();e.scrollIntoView({block:'center'})}},30)">➕ הוספה</button>`;
  if(!can && !F.sec && !canEdit()) h += `<p class="muted" style="margin-top:6px">למילוי הטופס צריך קוד מנהל.</p>`;
  if(closed) h += `<p class="muted" style="margin-top:6px">האירוע סגור — אפשר עדיין להשלים רשומות.</p>`;
  return h + '</div>';
}
function recForm(kind, key, d){
  const F = FORMS[kind], id = key || 'new';
  return `<div class="rec edit" style="background:#fff;border-color:var(--blue)"><div class="ed">${F.f.map(([f,t,ty]) => `<div class="${ty==='ta'?'w':''}"><label>${esc(t)}</label>${ty==='ta'
      ? `<textarea class="t" id="f-${id}-${f}">${esc(d[f])}</textarea>`
      : `<input class="t" id="f-${id}-${f}" type="${ty==='date'?'date':ty==='time'?'time':'text'}" ${ty==='tel'?'inputmode="tel"':''} value="${esc(d[f])}">`}</div>`).join('')}</div>
    <div class="row"><button class="btn sm" onclick="saveRec('${kind}',${key?`'${key}'`:'null'})">שמירה</button><button class="btn sec sm" onclick="EDITING=null;draw()">ביטול</button></div></div>`;
}
async function saveRec(kind, key){
  const F = FORMS[kind], id = key || 'new';
  const old = key ? ((F.sec ? SEC : ENT).find(e => e.kind===kind && e.key===key) || {}).data || {} : {};
  const d = Object.assign({}, old, Object.fromEntries(F.f.map(([f]) => [f, ($(`f-${id}-${f}`).value||'').trim()])));
  if(!F.f.some(([f]) => d[f])){ toast('הטופס ריק'); return; }
  if(F.ev && !key) d.event = curEvent().key;
  const list = F.sec ? secKind(kind) : byKind(kind);
  try{ await put(kind, key || 'x-' + uid(), d, key ? undefined : list.reduce((m,e)=>Math.max(m,e.sort||0),0)+1); EDITING = null; toast('✅ נשמר'); draw(); }
  catch(e){ toast('שגיאה בשמירה'); }
}
async function delRec(kind, key){
  if(!confirm('למחוק את הרשומה?')) return;
  try{ await del(kind, key); draw(); }catch(e){ toast('שגיאה'); }
}

async function importStaff(){
  const lines = ($('stImp').value||'').split(/\r?\n/).map(x => x.trim()).filter(Boolean);
  if(!lines.length){ toast('הדביקו לפחות שורה אחת'); return; }
  const rows = [], have = byKind('staff'); let sort = have.reduce((m,e)=>Math.max(m,e.sort||0),0);
  lines.forEach(l => {
    const parts = l.split(/\t|,|;/).map(x => x.replace(/\s+/g,' ').trim()).filter(Boolean);
    const phone = parts.find(p => /^[\d\-+ ()]{7,}$/.test(p)) || '', rest = parts.filter(p => p !== phone), name = rest[0] || ''; if(!name) return;
    const ex = have.find(e => e.data.name === name);
    rows.push({ kind:'staff', key: ex ? ex.key : 'x-'+uid(), sort: ex ? ex.sort : ++sort, updated_at:new Date().toISOString(),
      data: Object.assign({}, ex ? ex.data : {}, { name }, rest[1] ? { role: rest.slice(1).join(', ') } : {}, phone ? { mobile: phone } : {}) });
  });
  if(!rows.length){ toast('לא נמצאו שמות'); return; }
  try{ await api('tz_entries?on_conflict=kind,key', { method:'POST', prefer:'resolution=merge-duplicates', body: JSON.stringify(rows) });
    rows.forEach(r => { const i = ENT.findIndex(e => e.kind==='staff' && e.key===r.key); if(i>=0) ENT[i]=r; else ENT.push(r); }); await touch(); toast('✅ נשמרו ' + rows.length); draw();
  }catch(e){ toast('שגיאה בשמירה'); }
}

  P.push(`<div class="pg"><h2>פרק א – הצל"ח של המוסד החינוכי - הקדמה</h2>${CH_A.map(p=>`<p>${p}</p>`).join('')}<p><b>${CH_A_IMP}</b></p><p>${CH_A_END}</p><p><b>בתיק זה מוצגים:</b></p><ol>${CH_A_LIST.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`);
  P.push(`<div class="pg"><h2>פרק ב – בעלי תפקידים בצל"ח ותיאור תפקידם באירועי חירום</h2><table><tr><th style="width:30%">בעלי התפקיד</th><th>תיאור התפקיד</th></tr>${ROLES.filter(r=>r.d.length).map(r => { const P2 = ((entry('role',r.k)||{}).data||{}).p || [];
      return `<tr><td><b>${esc(r.t)}</b>${r.sub?` (${esc(r.sub)})`:''}<br>${r.L.map((lb,i)=>`${esc(lb)}: ${esc((P2[i]||{}).name||'________')}`).join('<br>')}</td><td>${bullets(r.d)}${r.fn?`<div>${esc(r.fn)}</div>`:''}</td></tr>`; }).join('')}</table><p>${esc(FOOT_B)}</p></div>`);
  P.push(`<div class="pg"><h2>פרק ג – היערכות לאירועי חירום וניהולם: עקרונות וכלים</h2><h3>1. עקרון הטווחים: לפני, בעת, אחרי.</h3><p>התערבות באירועי משבר וחירום מתנהלת בשלושה טווחי הזמן:</p>${RANGES.map(([t,d])=>`<h3>${t}</h3><p>${esc(d)}</p>`).join('')}
    <h3>שלבי ההיערכות והטיפול באירוע חירום: לפני. במהלך. אחרי.</h3>${FLOW.map(([t,,i])=>`<p><b>${t}:</b> ${i.map(esc).join(' ← ')}</p>`).join('')}
    <h3>מטלות ההתערבות של הצל"ח בטיפול באירוע, על פי טווחי הזמן</h3><table><tr><th>פעולות</th><th>לוח זמנים</th></tr>${TASKS.map(([t,a])=>`<tr><td><ol>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></td><td>${esc(t)}</td></tr>`).join('')}</table></div>`);
  P.push(`<div class="pg">${chG2().replace(/<div class="card">/g,'<div>').replace(/<h2>/g,'<h3>').replace(/<\/h2>/g,'</h3>')}</div>`);
  P.push(`<div class="pg">${[chG3(),chG4(),chG5()].join('').replace(/<div class="card">/g,'<div>')}</div>`);
  const rr = []; ROLES.forEach(r => { const P2 = ((entry('role',r.k)||{}).data||{}).p || []; r.L.forEach((lb,i) => { const p = P2[i]||{}; rr.push([i===0 ? r.t : '', lb, p.name||'', p.address||'', p.email||'', [p.home,p.mobile].filter(Boolean).join(' / ')]); }); });
  P.push(`<div class="pg"><h2>פרק ד – טפסים, רשימות והנחיות, שימוש בתיק הצל"ח</h2><ol>${USAGE.map(u=>`<li>${u}</li>`).join('')}</ol><h2>1. טופס מרכז בעלי תפקידים בצל"ח</h2>${tbl(['תפקיד','','שם','כתובת','דוא"ל','טלפון בבית / טלפון נייד'], rr)}</div>`);
  if(SEC){ const L = secKind('vuln'); P.push(`<div class="pg"><h2>2. טבלה למיפוי מעגלי פְּגִיעוּת ותמיכה</h2>${tbl(['כיתה','מספר','שם התלמיד/ה','תיאור הבעיה','לאיזה סיוע, טיפול או תרופה זקוק/ה'], L.map((r,i)=>[r.data.class,i+1,r.data.student,r.data.problem,r.data.need]))}</div>`); }
  const cr = CONTACTS.map(([k,t]) => { const d = (entry('contact',k)||{}).data||{}; return [t,d.name||'',d.email||'',[d.mobile&&'נייד: '+d.mobile,d.office&&'משרד: '+d.office].filter(Boolean).join(' · ')]; })
    .concat(byKind('contact').filter(e=>e.key.startsWith('x-')).map(e => { const d = e.data||{}; return [d.label||'נוסף',d.name||'',d.email||'',[d.mobile&&'נייד: '+d.mobile,d.office&&'משרד: '+d.office].filter(Boolean).join(' · ')]; }));
  P.push(`<div class="pg"><h2>3. רשימה של גורמי קשר ודיווח פורמלי ברשות המקומית</h2>${tbl(['','שם ושם משפחה','דואר אלקטרוני','פרטי התקשרות'], cr)}<h2>4. רשימת מתנדבים</h2>${tbl(['מספר','שם ושם משפחה','תפקיד','כתובת','טלפון נייד','מועדי זמינות'], byKind('vol').map((e,i)=>{ const d=e.data||{}; return [i+1,d.name,d.role,d.address,d.mobile,d.avail]; }))}</div>`);
  P.push(`<div class="pg"><h2>5. רשימות אנשי צוות</h2>${tbl(['שם איש צוות','תפקיד','פרטי התקשרות','כתובת מגורים + כתובת דואר אלקטרוני','רגישויות מיוחדות והערות'], byKind('staff').sort((a,b)=>String(a.data.name||'').localeCompare(String(b.data.name||''),'he')).map(e=>{ const d=e.data||{}; return [d.name,d.role,[d.mobile,d.home].filter(Boolean).join(' / '),[d.address,d.email].filter(Boolean).join(' · '),d.notes]; }))}</div>`);
  if(SEC && STUDENTS){ const S = secKind('stu'); if(S.length) P.push(`<div class="pg"><h2>רשימות תלמידים לפי כיתות</h2>${tbl(['כיתה','שם התלמיד/ה','שמות ההורים ופרטי התקשרות','כתובת מגורים + כתובת דואר אלקטרוני','רגישויות מיוחדות והערות'], S.sort((a,b)=>classSort(a.data.class,b.data.class)).map(r=>[r.data.class,r.data.name,r.data.parents,r.data.address,r.data.notes]))}</div>`); }
  if(ev){
    const R = k => byKind(k).filter(r => r.data.event === ev.key), RS = k => secKind(k).filter(r => r.data.event === ev.key);
    P.push(`<div class="pg"><h2>6. טבלת ניהול אירוע ומעקב לעבודת הצל"ח</h2><p><b>${esc(ev.data.name)}</b> · ${fmtD(ev.data.opened_at)}<br>תיאור האירוע - מידע – עובדות, מקור דיווח, מקבל הדיווח, תאריך, שעה: ${nl(ev.data.desc)}</p>${tbl(['','פעולות','תמונת מצב','צעדים נדרשים להמשך'], R('evlog').map((r,i)=>[i+1,r.data.action,r.data.status,r.data.next]))}</div>`);
    if(SEC) P.push(`<div class="pg"><h2>7. מיפוי מעגלי הפְּגִיעוּת בזמן אמת</h2>${tbl(FORMS.rt.f.map(x=>x[1]), RS('rt').map(r=>FORMS.rt.f.map(([f])=>r.data[f]||'')))}<h2>8. מענים פרטניים בזמן אמת</h2>${tbl(FORMS.indiv.f.map(x=>x[1]), RS('indiv').map(r=>FORMS.indiv.f.map(([f])=>r.data[f]||'')))}</div>`);
    P.push(`<div class="pg"><h2>פרוטוקולים ורישום נוכחות/ היעדרות/ יציאה מבית הספר</h2><ol>${PROTO.map(p=>`<li>${esc(p)}</li>`).join('')}</ol>${R('meet').map(r=>`<h2>9. פרוטוקול ישיבת צל"ח</h2><p>שם בית ספר: ${esc(SET.school)} · תאריך: ${esc(r.data.date)}</p><h3>נוכחים (שם +תפקיד):</h3><p>${nl(r.data.present)}</p><h3>תכנים ונושאים שנדונו בישיבה</h3><p>${nl(r.data.topics)}</p><h3>חלוקת תפקידים והחלטות</h3><p>${nl(r.data.decisions)}</p>`).join('')}</div>`);
    const sm = (entry('summary', ev.key)||{}).data || {};
    P.push(`<div class="pg"><h2>10. סיכום ניהול אירוע חירום</h2><p>שם בית ספר: ${esc(SET.school)} · תאריך: ${fmtDay(sm.date)}</p><h3>פרטי האירוע</h3><p>${nl(sm.details)}</p><h3>פעולות שבוצעו</h3><p>${nl(sm.actions)}</p><h3>תובנות – ש.ש.ש (שיפור, שימור, שינוי)</h3><p>${nl(sm.insights)}</p></div>`);
    if(STUDENTS){ const att = byKind('att_stu').filter(r => r.key.startsWith(ev.key+'|'));
      if(att.length) P.push(`<div class="pg"><h2>11. טופס נוכחות ומעקב תלמידים</h2>${att.map(r => { const c = r.key.split('|')[1], rows = r.data.rows||{};
        return `<h3>כיתה: ${esc(c)} · תאריך: ${fmtDay(r.data.date)} · מורה: ${esc(r.data.teacher)}</h3>${tbl(['שם התלמיד/ה','נוכח/ת או נעדר/ת','מקום הימצאו','סיבת היעדרות מבית הספר'], STUDENTS.filter(s=>s.class===c).map(s=>{ const x=rows[s.id]||{}; return [s.name, x.st==='p'?'נוכח/ת':x.st==='a'?'נעדר/ת':'', x.where||'', x.why||'']; }))}`; }).join('')}</div>`); }
    const sa = ((entry('att_staff', ev.key)||{}).data||{}).rows || {};
    P.push(`<div class="pg"><h2>12. טופס נוכחות ומעקב צוות</h2>${tbl(['שם איש/אשת הצוות','נוכח/ת או נעדר/ת','מקום הימצאו','סיבת היעדרות מבית הספר'], byKind('staff').map(s=>{ const x=sa[s.key]||{}; return [s.data.name, x.st==='p'?'נוכח/ת':x.st==='a'?'נעדר/ת':'', x.where||'', x.why||'']; }))}</div>`);
    P.push(`<div class="pg"><h2>13. רישום ואיכון תלמידים שיצאו משטח בית הספר במהלך האירוע</h2>${tbl(['כיתה','מורה','שם התלמיד/ה','נאסף על ידי...','שעת יציאה','חתימה'], R('exit_stu').map(r=>[r.data.class,r.data.teacher,r.data.student,r.data.by,r.data.time,r.data.sig]))}
      <h2>14. רישום ואיכון חברי צוות שיצאו משטח בית הספר במהלך האירוע</h2>${tbl(['שם איש/אשת הצוות','סיבת היציאה','שעת יציאה','חתימה'], R('exit_staff').map(r=>[r.data.name,r.data.reason,r.data.time,r.data.sig]))}</div>`);
  }
  P.push(`<div class="pg"><h2>פרק ה – תדריכי שפ"י לשעת חירום</h2><ul>${BRIEFS.map((t,i)=>{ const u=((entry('brief',String(i))||{}).data||{}).url; return `<li>${esc(t)}${u?`<br><small>${esc(u)}</small>`:''}</li>`; }).join('')}</ul>
    <h2>פרק ו – נהלים לשעת חירום</h2><ol>${RULES.map((t,i)=>{ const u=((entry('rule',String(i))||{}).data||{}).url; return `<li>${esc(t)}${u?`<br><small>${esc(u)}</small>`:''}</li>`; }).join('')}</ol>
    <h1 style="margin-top:20mm">בהצל"חה<br>מתכוננים בשגרה<br>מוכנים בחירום</h1></div>`);
  $('print').innerHTML = P.join('');
  if(!SEC) toast('הדפסה בלי האזור המוגן: טפסים 2, 7, 8 ופרטי תלמידים לא יודפסו');
  setTimeout(() => window.print(), 150);
}

/* ===================== פתיחה ===================== */
(async function(){
  const s = LS.get('tz_sess');
  if(s && s.level){
    LEVEL = s.level;
    try{ await load(); }catch(e){ $('gate').classList.remove('hidden'); $('gMsg').textContent = 'אין חיבור, ואין עותק שמור במכשיר הזה.'; return; }
    const sc = SS.get('tz_sec'); if(sc && !OFFLINE){ SECCODE = sc; if(await loadSec()) LEVEL = 'secure'; }
    start();
  } else $('gate').classList.remove('hidden');
})();
</script>
