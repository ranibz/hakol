<!-- eshi/emergency/mivchanim-bakasha.html · v1.1.0 · 2026-09-04 · בית חינוך גליל מערבי

     v1.1.0 · השם אינו נשמר עוד. ב-v1.0.0 הוא נשמר ב-localStorage,
     ובמחשב של חדר מורים כל מורה היה נפתח על שם קודמו
     וצריך ללחוץ "לא אני".

     ⚠ והנזק האמיתי לא היה הטירדה אלא הטעות: מורה שלא
     שם לב היה שולח בקשה על שם מי שנכנס לפניו, והרכז היה
     רואה בקשה שאותו אדם מעולם לא שלח. בלי סיסמה אין דרך
     לוודא שהשם השמור עדיין נכון, ולכן עדיף לא לזכור.

     ⚠ המחיר: מורה שנכנס פעמיים ביום מקליד פעמיים. עשר
     שניות, מול בקשה שנרשמת על השם הלא נכון.
     © רני בן זאב. יוזמה עצמאית, מימון עצמי.

     בקשות מבחן מן המורים המקצועיים. רכז השכבה מפיץ קישור אחד —
     ?grade=י — וכל מורה מבקש מכאן.

     ⬛ הבקשה נכתבת ל-exam_board עם status='draft', ולא לטבלה נפרדת.
     היא מופיעה מיד על לוח הרכז בצהוב, והאישור שם הוא שינוי סטטוס.

     ⬛ שתי דרכי בקשה:
     · תאריך מדויק — לוחצים על יום, ובוחרים שעה מתוך שעות המקצוע
       של המורה באותו יום. השעות נגזרות מ-exam_timetable, ולכן
       המורה רואה "שעה 3 — כל 7 הכיתות" ולא רשימה יבשה של 1–10.
     · טווח — "בין ה-23 ל-30", והרכז קובע את היום.

     ⚠ המורה אינו רואה את שיבוצי הרכז ואינו רואה בקשות של אחרים.
     הרכז בונה את הלוח ומפרסם אותו כשסיים; עד אז אין מה להראות,
     ולוח חצי בנוי היה מזמין בקשות סביב שיבוצים שעוד ישתנו.

     ⚠ מה שכן מוצג ברקע: הגאנט — חופשות, טיולים ובגרויות. זה מה
     שמונע בקשה בחנוכה, וזו הסיבה שהמורה אינו כותב תאריך באוויר.

     ⚠ שעה שאינה שעת המקצוע אינה חסומה, רק מסומנת. מורה שסיכם
     החלפה עם עמית יודע משהו שהמערכת אינה יודעת, וחסימה כאן
     הייתה מייצרת פניות לרכז במקום למנוע אותן.

     ⚠ אין סיסמה. השם נכתב חופשי בכל כניסה. כל מי שיש לו את
     הקישור יכול לבקש בשם כל אחד — החלטה מודעת לשלב הראשון.
     ההגנה היחידה: מחיקה רצה עם status=eq.draft, כך שבקשה שאושרה
     אינה ניתנת למחיקה מכאן גם אם המסך מיושן.

     ⚠ הרשימה למטה מציגה בקשות לפי השם שהוקלד. מורה שיקליד את שמו
     אחרת — "דוד" מול "דוד כהן" — לא יראה את בקשותיו הקודמות.
     זה המחיר של זיהוי בלי רשימת מורים (MINOR). -->

<style>
:root{--ink:#1f2340;--soft:#6a6f8a;--bg:#f5f4f9;--line:#e3e0ee;--a:#4c1d95;--b:#0f766e;
  --ok:#12b76a;--no:#dc2626;--warn:#e08600;--vac:#a33a3a;--draft:#eab308}

body{margin:0;background:var(--bg);color:var(--ink);font-family:'Assistant',sans-serif;
  font-size:16px;line-height:1.6;padding-bottom:50px}
h1,h2,h3{font-family:'Secular One',sans-serif;font-weight:400;margin:0}
.top{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;padding:13px 0;
  position:sticky;top:0;z-index:30}
.topin{max-width:1180px;margin:0 auto;padding:0 15px;display:flex;gap:12px;

.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px 19px;margin-bottom:13px}
label{display:block;font-weight:800;font-size:.83rem;margin-bottom:4px}
select,input,textarea{font-family:inherit;font-size:.95rem;border:1px solid #d5d2e4;
  border-radius:10px;padding:9px 12px;background:#fff;color:var(--ink);width:100%}
.row{display:flex;gap:11px;flex-wrap:wrap;align-items:flex-end}
.row>div{flex:1;min-width:130px}

  font-family:inherit;font-weight:800;font-size:.92rem;cursor:pointer}
.btn:hover{filter:brightness(.92)} .btn:disabled{opacity:.45;cursor:not-allowed}
.btn.g{background:#efedf7;color:var(--ink)} .btn.no{background:var(--no)}
.btn.sm{padding:6px 13px;font-size:.83rem;border-radius:9px}

<div class="top"><div class="topin">
  <h1>בקשת מבחן</h1>
  <span class="sb" id="sub"></span>
  <span class="spacer"></span>
  <span class="sb" id="who"></span>
</div></div>

<div class="wrap" id="app"><div class="card"><div class="empty">טוען…</div></div></div>

<script>
/* ============================================================
   חיבור — אותו מסד של לוח המבחנים והגאנט
   ============================================================ */
const SURL='https://skfriefqnoxfzmamcokd.supabase.co';
const SKEY='sb_publishable_Qx7EDPbdyYE9iv7uMQBKhQ_Aeojd_Q0';
async function api(path,opts={}){
  const r=await fetch(SURL+'/rest/v1/'+path,{...opts,
    headers:{apikey:SKEY,Authorization:'Bearer '+SKEY,
             'Content-Type':'application/json',Prefer:opts.prefer||''}});
  if(!r.ok) throw new Error((await r.text()).slice(0,200));
  const t=await r.text(); return t?JSON.parse(t):null;
}
const el=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const GRADES=['ז','ח','ט','י','יא','יב'];
const JUNIOR=['ז','ח','ט'];
const WD=['ראשון','שני','שלישי','רביעי','חמישי','שישי'];
const DAYS=['','ראשון','שני','שלישי','רביעי','חמישי','שישי'];

const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromIso=s=>{ const [y,m,d]=String(s).split('-').map(Number); return new Date(y,m-1,d); };
const addD=(d,n)=>{ const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const dayIdx=d=>d.getDay()===6?0:d.getDay()+1;
const dmy=s=>{ if(!s) return '—'; const d=fromIso(s);
  return d.getDate()+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear(); };
function planYear(){ const d=new Date(); return d.getMonth()>=7?d.getFullYear():d.getFullYear()-1; }
function yearLabel(y){ return 'תשפ״'+['ו','ז','ח','ט','י'][y-2025]+' · '+y+'/'+(y+1); }
const hebDay=d=>{ try{ return new Intl.DateTimeFormat('he-u-ca-hebrew',
  {day:'numeric',month:'short'}).format(d); }catch(e){ return ''; } };

/* ⚠ אין מפתח אחסון. ראה הערת הגרסה v1.1.0 — השם אינו נשמר
   בכוונה, כדי שבמחשב משותף לא תירשם בקשה על שם הקודם. */

let YEAR=planYear(), GRADE='', NAME='', MONTH=null,
    TT=[], SUBJ={}, GANTT=[], CLASSES=[], MINE=[],
    MODE='date',                 /* date | window */
    FORM={}, PICKDATE=null, EDIT=null;

/* ============================================================
   טעינה
   ============================================================ */
async function loadAll(){
  TT=await api('exam_timetable?select=class_name,day,hour,subject_raw'+
    '&year_start=eq.'+YEAR+'&grade=eq.'+encodeURIComponent(GRADE))||[];
  CLASSES=[...new Set(TT.map(r=>r.class_name))].sort((a,b)=>{
    const n=s=>parseInt(String(s).replace(/\D+/g,''),10)||0;
    return n(a)-n(b)||String(a).localeCompare(b,'he');
  });

  SUBJ={};
  ((await api('exam_subjects?select=*'))||[]).forEach(s=>{ SUBJ[s.subject_raw]=s; });

  /* ⚠ אותה נפילה לאחור כמו בלוח הרכז: no_exams אינה קיימת בכל מסד. */
  try{
    GANTT=await api('gantt_events?select=track,title,start_date,end_date,no_exams'+
      '&year_start=eq.'+YEAR)||[];
  }catch(e){
    GANTT=await api('gantt_events?select=track,title,start_date,end_date'+
      '&year_start=eq.'+YEAR)||[];
  }
  await loadMine();
}

/* רק הבקשות של המורה הזה. שיבוצי הרכז ובקשות של אחרים אינם נשלפים
   כלל — לא מוסתרים בתצוגה, פשוט לא מגיעים לדפדפן. */
async function loadMine(){
  if(!NAME){ MINE=[]; return; }
  MINE=await api('exam_board?select=*&year_start=eq.'+YEAR+
    '&grade=eq.'+encodeURIComponent(GRADE)+
    '&requested_by=eq.'+encodeURIComponent(NAME)+'&order=exam_date')||[];
}

/* ---- מערכת ומקצועות ---- */
function slotAt(day,hour,cls){
  return TT.filter(r=>r.day===day&&r.hour===hour&&r.class_name===cls).map(r=>r.subject_raw);
}
const norm=raw=>SUBJ[raw]||{subject_base:raw,level:null,examable:true};

function subjectList(){
  const m={};
  TT.forEach(r=>{
    const s=norm(r.subject_raw);
    if(s.examable===false) return;
    if(!m[s.subject_base]) m[s.subject_base]={base:s.subject_base,levels:{},n:0};
    m[s.subject_base].n++;
    if(s.level) m[s.subject_base].levels[s.level]=1;
  });
  return Object.values(m).sort((a,b)=>b.n-a.n||a.base.localeCompare(b.base,'he'));
}
function matches(raw,base,level){
  const s=norm(raw);
  if(s.subject_base!==base) return false;
  if(level && String(s.level||'')!==String(level)) return false;
  return true;
}
function scopeClasses(){ return FORM.scope==='class' ? [FORM.cls] : CLASSES; }

/* ---- גאנט ---- */
function eventsOn(dt){
  const s=iso(dt);
  return GANTT.filter(e=>e.start_date<=s && s<=e.end_date)
    .filter(e=>{
      if(e.track==='vacation'||e.track==='holidays') return true;
      if(e.track==='junior') return JUNIOR.indexOf(GRADE)>-1;
      if(e.track==='senior') return JUNIOR.indexOf(GRADE)<0;
      return false;
    });
}
const isVacation=dt=>eventsOn(dt).some(e=>e.track==='vacation');
const isBlocked=dt=>eventsOn(dt).some(e=>e.track==='vacation'||e.no_exams===true);

/* ============================================================
   שעות המקצוע ביום נתון
   ------------------------------------------------------------
   לכל שעה 1–10: כמה מכיתות ההיקף יושבות במקצוע שנבחר. זה מה
   שהופך "שעה 3" ל"שעה 3 — כל 7 הכיתות", והמורה בוחר לפי כיסוי
   ולא לפי ניחוש.
   ============================================================ */
function hoursOn(dateIso){
  const d=fromIso(dateIso), di=dayIdx(d);
  const cls=scopeClasses(), out=[];
  if(!di) return out;
  for(let h=1;h<=10;h++){
    let has=0, any=0;
    cls.forEach(c=>{
      const raws=slotAt(di,h,c);
      if(!raws.length) return;
      any++;
      if(raws.some(r=>matches(r,FORM.base,FORM.level))) has++;
    });
    if(any) out.push({hour:h, has:has, of:cls.length});
  }
  return out;
}

/* ============================================================
   מסכים
   ============================================================ */
function monthCells(){
  const first=new Date(MONTH.y,MONTH.m,1);
  const start=addD(first,-((first.getDay()+1)%7));
  const cells=[];
  for(let i=0;i<42;i++){
    const d=addD(start,i);
    if(d.getDay()!==6) cells.push(d);            /* שבת אינה בלוח */
  }
  return cells.slice(0,36);
}
function monthLabel(){
  return new Intl.DateTimeFormat('he',{month:'long',year:'numeric'})
    .format(new Date(MONTH.y,MONTH.m,1));
}
function shiftMonth(n){
  const d=new Date(MONTH.y,MONTH.m+n,1);
  MONTH={y:d.getFullYear(),m:d.getMonth()}; render();
}

function calendar(){
  const byDate={};
  MINE.filter(e=>e.exam_date).forEach(e=>{
    (byDate[e.exam_date]=byDate[e.exam_date]||[]).push(e); });

  return '<div class="card"><div class="mhead">'+
    '<button class="btn g sm" onclick="shiftMonth(-1)">→ הקודם</button>'+
    '<h2>'+esc(monthLabel())+'</h2>'+
    '<button class="btn g sm" onclick="shiftMonth(1)">הבא ←</button>'+
    '<span class="hint" style="margin:0 0 0 auto">'+
      (MODE==='date' ? 'לחצו על היום שבו תרצו את המבחן'
                     : 'הלוח כאן להתמצאות — הטווח נבחר בשדות שלמעלה')+
    '</span></div><div class="cal">'+
    WD.map(w=>'<div class="wd">'+w+'</div>').join('')+
    monthCells().map(d=>{
      const s=iso(d), out=d.getMonth()!==MONTH.m;
      const vac=isVacation(d), blocked=isBlocked(d);
      const pick=(MODE==='date') && !blocked && !!FORM.base;
      return '<div class="cell'+(out?' out':'')+(vac?' vac':'')+
        (pick?' pick':'')+(PICKDATE===s?' sel':'')+'"'+
        (pick?' onclick="chooseDate(\''+s+'\')"':'')+'>'+
        '<div class="dn">'+d.getDate()+' <span class="heb">'+esc(hebDay(d))+'</span></div>'+
        eventsOn(d).slice(0,2).map(e=>'<span class="ev'+(e.track==='vacation'?' v':'')+'">'+
          esc(e.title)+'</span>').join('')+
        (byDate[s]||[]).map(e=>'<span class="mine'+(e.status!=='draft'?' ok':'')+'">'+
          esc(e.subject_base)+(e.hour?' · ש׳'+e.hour:'')+'</span>').join('')+
        '</div>';
    }).join('')+'</div></div>';
}

function formCard(){
  const subs=subjectList();
  if(!subs.length) return '';
  if(!FORM.base) FORM.base=subs[0].base;
  const cur=subs.find(x=>x.base===FORM.base)||subs[0];
  const levels=Object.keys(cur.levels||{});

  return '<div class="card">'+
    '<div class="tabs">'+
      '<button class="tab'+(MODE==='date'?' on':'')+'" onclick="setMode(\'date\')">'+
        'תאריך ושעה מדויקים</button>'+
      '<button class="tab'+(MODE==='window'?' on':'')+'" onclick="setMode(\'window\')">'+
        'טווח תאריכים</button>'+
    '</div>'+
    '<div class="row">'+
      '<div><label>מקצוע</label><select onchange="setBase(this.value)">'+
        subs.map(x=>'<option'+(x.base===FORM.base?' selected':'')+'>'+esc(x.base)+
          '</option>').join('')+'</select></div>'+
      (levels.length?'<div><label>רמה</label><select onchange="FORM.level=this.value;refresh()">'+
        '<option value="">הכול</option>'+
        levels.map(l=>'<option'+(FORM.level===l?' selected':'')+'>'+esc(l)+
          '</option>').join('')+'</select></div>':'')+
      '<div><label>היקף</label><select onchange="FORM.scope=this.value;refresh()">'+
        '<option value="grade"'+(FORM.scope==='grade'?' selected':'')+'>כל השכבה</option>'+
        '<option value="class"'+(FORM.scope==='class'?' selected':'')+'>כיתה אחת</option>'+
        '</select></div>'+
      (FORM.scope==='class'?'<div><label>כיתה</label>'+
        '<select onchange="FORM.cls=this.value;refresh()">'+
        CLASSES.map(c=>'<option'+(FORM.cls===c?' selected':'')+'>'+esc(c)+
          '</option>').join('')+'</select></div>':'')+
    '</div>'+

    (MODE==='window'
      ? '<div class="row" style="margin-top:11px">'+
          '<div><label>מתאריך</label><input type="date" id="wFrom" value="'+
            esc(FORM.from||'')+'"></div>'+
          '<div><label>עד תאריך</label><input type="date" id="wTo" value="'+
            esc(FORM.to||'')+'"></div>'+
        '</div>'
      : '')+

    '<div class="row" style="margin-top:11px">'+
      '<div><label>כותרת המבחן</label><input id="fTitle" value="'+esc(FORM.title||'')+
        '" placeholder="למשל: מבחן על יחידה 2"></div>'+
      '<div><label>הערה לרכז</label><input id="fNote" value="'+esc(FORM.notes||'')+
        '" placeholder="לא חובה"></div>'+
    '</div>'+

    (MODE==='window'
      ? '<div style="margin-top:13px"><button class="btn" onclick="saveWindow()">'+
        (EDIT?'עדכון הבקשה':'שליחת הבקשה')+' ←</button>'+
        (EDIT?' <button class="btn g" onclick="cancelEdit()">ביטול</button>':'')+
        '</div>'
      : '')+
    '<div class="msg" id="msg"></div>'+
  '</div>';
}

/* בחירת יום → שעות המקצוע באותו יום */
function hoursCard(){
  if(MODE!=='date'||!PICKDATE) return '';
  const d=fromIso(PICKDATE), rows=hoursOn(PICKDATE);
  let html='<div class="card"><h3 style="font-size:1.05rem">'+
    'יום '+DAYS[dayIdx(d)]+' · '+dmy(PICKDATE)+'</h3>';

  const mine=rows.filter(r=>r.has>0), other=rows.filter(r=>r.has===0);
  if(!rows.length){
    html+='<div class="empty">אין שיעורים ביום הזה במערכת.</div></div>';
    return html;
  }
  if(mine.length){
    html+='<p class="hint">השעות שבהן '+esc(FORM.base)+' מתקיים ביום הזה. '+
      'המספר הוא כמה כיתות יושבות במקצוע באותה שעה.</p>'+
      mine.map(r=>'<div class="hr '+(r.has===r.of?'full':'part')+'" '+
        'onclick="pickHour('+r.hour+')"><b>שעה '+r.hour+'</b>'+
        '<span class="meta">'+(r.has===r.of?'כל '+r.of+' הכיתות':
          r.has+' מתוך '+r.of+' הכיתות')+'</span></div>').join('');
  }else{
    html+='<p class="hint">'+esc(FORM.base)+' אינו מתקיים ביום הזה באף שעה.</p>';
  }
  if(other.length){
    html+='<p class="hint" style="margin-top:13px">שעות אחרות ביום הזה — '+
      'אפשר לבקש, והרכז יראה שאלה אינן שעות המקצוע שלכם.</p>'+
      other.map(r=>'<div class="hr none" onclick="pickHour('+r.hour+')">'+
        '<b>שעה '+r.hour+'</b><span class="meta">לא שעת '+esc(FORM.base)+
        '</span></div>').join('');
  }
  return html+'</div>';
}

function mineCard(){
  if(!MINE.length) return '<div class="card"><h3 style="font-size:1.05rem">הבקשות שלי</h3>'+
    '<div class="empty">עדיין לא שלחתם בקשות.</div></div>';
  return '<div class="card"><h3 style="font-size:1.05rem">הבקשות שלי ('+MINE.length+')</h3>'+
    '<p class="hint">בקשה צהובה טרם אושרה ואפשר לשנות או למחוק אותה. '+
    'בקשה שאושרה נעולה — פנו לרכז השכבה.</p>'+
    '<table><thead><tr><th>מקצוע</th><th>היקף</th><th>מתי</th><th>מצב</th>'+
    '<th style="width:150px"></th></tr></thead><tbody>'+
    MINE.map(e=>'<tr><td><b>'+esc(e.subject_base)+'</b>'+
        (e.level?' '+esc(e.level):'')+
        (e.title?'<div style="font-size:.8rem;color:var(--soft)">'+esc(e.title)+'</div>':'')+
      '</td>'+
      '<td>'+(e.scope==='grade'?'כל השכבה':esc(e.class_name||''))+'</td>'+
      '<td>'+(e.exam_date
        ? dmy(e.exam_date)+(e.hour?' · שעה '+e.hour:'')
        : dmy(e.window_start)+' – '+dmy(e.window_end))+'</td>'+
      '<td>'+(e.status==='draft'
        ? '<span class="pill d">ממתינה</span>'
        : '<span class="pill a">אושרה</span>')+'</td>'+
      '<td>'+(e.status==='draft'
        ? '<button class="btn g sm" onclick="editReq('+e.id+')">שינוי</button> '+
          '<button class="btn no sm" onclick="delReq('+e.id+')">מחיקה</button>'
        : '<span class="hint" style="margin:0">לשינוי — לרכז</span>')+
      '</td></tr>').join('')+
    '</tbody></table></div>';
}

/* ============================================================
   פעולות
   ============================================================ */
function setMode(m){ MODE=m; PICKDATE=null; render(); }
function setBase(v){
  FORM.base=v; FORM.level='';
  PICKDATE=null; render();
}
function refresh(){ PICKDATE=null; render(); }
function chooseDate(s){ PICKDATE=s; render();
  const c=el('app'); if(c) window.scrollTo({top:c.scrollHeight,behavior:'smooth'}); }
function cancelEdit(){ EDIT=null; PICKDATE=null; FORM.title=''; FORM.notes=''; render(); }

function grabForm(){
  if(el('fTitle')) FORM.title=el('fTitle').value.trim();
  if(el('fNote'))  FORM.notes=el('fNote').value.trim();
  if(el('wFrom'))  FORM.from=el('wFrom').value;
  if(el('wTo'))    FORM.to=el('wTo').value;
}
function baseRow(){
  return {year_start:YEAR, grade:GRADE, scope:FORM.scope,
    class_name:FORM.scope==='class'?FORM.cls:null,
    subject_base:FORM.base, level:FORM.level||null,
    title:FORM.title||FORM.base, notes:FORM.notes||null,
    status:'draft', requested_by:NAME,
    updated_at:new Date().toISOString()};
}
async function send(row){
  try{
    if(EDIT) await api('exam_board?id=eq.'+encodeURIComponent(EDIT)+'&status=eq.draft',
      {method:'PATCH',body:JSON.stringify(row)});
    else     await api('exam_board',{method:'POST',body:JSON.stringify([row])});
    EDIT=null; PICKDATE=null; FORM.title=''; FORM.notes='';
    await loadMine(); render();
    const m=el('msg'); if(m){ m.className='msg ok'; m.textContent='הבקשה נשלחה לרכז.'; }
  }catch(e){
    const m=el('msg'); if(m){ m.className='msg no'; m.textContent='שגיאה: '+e.message; }
  }
}
async function pickHour(h){
  grabForm();
  const row=baseRow();
  row.exam_date=PICKDATE; row.hour=h; row.hour_end=h;
  row.window_start=null; row.window_end=null;
  await send(row);
}
async function saveWindow(){
  grabForm();
  const m=el('msg');
  if(!FORM.from||!FORM.to){ m.className='msg no'; m.textContent='מלאו את שני התאריכים.'; return; }
  if(FORM.from>FORM.to){ m.className='msg no'; m.textContent='תאריך הסיום מוקדם מתאריך ההתחלה.'; return; }
  const row=baseRow();
  row.exam_date=null; row.hour=null; row.hour_end=null;
  row.window_start=FORM.from; row.window_end=FORM.to;
  await send(row);
}
function editReq(id){
  const e=MINE.find(x=>String(x.id)===String(id)); if(!e) return;
  EDIT=e.id;
  MODE=e.exam_date?'date':'window';
  FORM={base:e.subject_base, level:e.level||'', scope:e.scope,
        cls:e.class_name||CLASSES[0], title:e.title||'', notes:e.notes||'',
        from:e.window_start||'', to:e.window_end||''};
  PICKDATE=e.exam_date||null;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
async function delReq(id){
  const e=MINE.find(x=>String(x.id)===String(id));
  if(!confirm('למחוק את הבקשה "'+((e&&e.title)||'')+'"?')) return;
  try{
    /* ⚠ status=eq.draft — בקשה שאושרה בין הצגת המסך ללחיצה לא תימחק. */
    await api('exam_board?id=eq.'+encodeURIComponent(id)+'&status=eq.draft',
      {method:'DELETE'});
    await loadMine(); render();
  }catch(err){ alert('שגיאה: '+err.message); }
}

/* ============================================================
   זהות ואתחול
   ============================================================ */
function askName(){
  el('app').innerHTML='<div class="card" style="max-width:430px;margin:30px auto">'+
    '<h2 style="font-size:1.15rem;margin-bottom:6px">מי אתם?</h2>'+
    '<p class="hint">השם יופיע לרכז השכבה לצד הבקשה, וישמש כדי להראות '+
    'לכם את הבקשות שכבר שלחתם. כתבו אותו בדיוק כמו בפעם הקודמת.</p>'+
    '<p class="hint">השם אינו נשמר במכשיר — במחשב משותף הוא היה גורם '+
    'לבקשה שלכם להירשם על שם מי שנכנס קודם.</p>'+
    '<label>שם מלא</label><input id="nm" placeholder="שם ושם משפחה" '+
    'onkeydown="if(event.key===\'Enter\')setName()">'+
    '<div style="margin-top:12px"><button class="btn" onclick="setName()">כניסה ←</button></div>'+
    '<div class="msg" id="nmErr"></div></div>';
  setTimeout(()=>{ const n=el('nm'); if(n) n.focus(); },50);
}
async function setName(){
  const v=(el('nm').value||'').replace(/\s+/g,' ').trim();
  if(v.length<2){ el('nmErr').className='msg no';
    el('nmErr').textContent='כתבו שם מלא.'; return; }
  NAME=v;
  await loadMine(); render();
}
function changeName(){ NAME=''; MINE=[]; render(); }

function render(){
  el('sub').textContent='שכבה '+GRADE+' · '+yearLabel(YEAR);
  el('who').innerHTML=NAME
    ? esc(NAME)+' · <a href="#" onclick="changeName();return false" '+
      'style="color:#fff;text-decoration:underline">לא אני</a>'
    : '';
  if(!NAME){ askName(); return; }
  if(!CLASSES.length){
    el('app').innerHTML='<div class="card"><div class="empty">'+
      'אין מערכת לשכבה '+esc(GRADE)+' בשנת '+yearLabel(YEAR)+'.<br>'+
      'פנו לרכז השכבה.</div></div>';
    return;
  }
  el('app').innerHTML=formCard()+calendar()+hoursCard()+mineCard();
}

(async function boot(){
  const p=new URLSearchParams(location.search);
  GRADE=p.get('grade')||'';
  if(p.get('year')) YEAR=parseInt(p.get('year'),10)||YEAR;
  if(GRADES.indexOf(GRADE)<0){
    el('app').innerHTML='<div class="card"><div class="empty">'+
      'הקישור חסר שכבה.<br>בקשו מרכז השכבה את הקישור המלא, '+
      'למשל <code dir="ltr">?grade=י</code>.</div></div>';
    return;
  }
  const now=new Date(); MONTH={y:now.getFullYear(),m:now.getMonth()};
  FORM={base:'', level:'', scope:'grade', cls:'', title:'', notes:'', from:'', to:''};
  try{
    await loadAll();
    if(!FORM.cls) FORM.cls=CLASSES[0]||'';
    render();
  }catch(e){
    el('app').innerHTML='<div class="card"><div class="empty">'+
      'שגיאה בטעינה: '+esc(e.message)+'</div></div>';
  }
})();
</script>
</body>
</html>
