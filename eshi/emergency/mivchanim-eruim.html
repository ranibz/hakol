<!DOCTYPE html>
<!-- eshi/emergency/mivchanim-eruim.html · v1.0.0 · 2026-09-05 · בית חינוך גליל מערבי
     © רני בן זאב. יוזמה עצמאית, מימון עצמי.

     אירועים ונוכחות. רכז השכבה מצרף כיתות לאירוע — הרצאה, סדנה,
     הצגה — ומחנך הכיתה סופר נוכחות במסך נפרד.

     ⬛ אירוע הוא שורת gantt_events שיש לה כיתות ב-event_classes.
     אין טבלת אירועים נפרדת בכוונה: רוב האירועים כבר רשומים בגאנט,
     וטבלה שנייה הייתה מייצרת אותה הרצאה פעמיים על אותו יום.

     ⬛ קובץ נפרד מ-mivchanim.html בכוונה. אירוע אינו מבחן, וקובץ
     שנקרא "מבחנים" שמנהל הרצאות ונוכחות הוא שם שמטעה את מי שיפתח
     אותו בעוד חצי שנה.

     ⚠ התנגשות עם מבחן מוצגת כאזהרה ולא כחסימה. הגאנט קודם למבחנים
     — רכז שרוצה הרצאה ביום שיש בו מבחן יזיז את המבחן, ולא הפוך.

     ⚠ מחיקת אירוע נעשית בגאנט בלבד. מכאן מסירים כיתות — אחרת רכז
     שכבה אחת היה מוחק אירוע ששייך גם לשכבה אחרת.

     ⚠ הסרת כיתה מוחקת גם את הנוכחות שנספרה לה. אין טעם ברשומות
     נוכחות לכיתה שאינה משתתפת. -->
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אירועים ונוכחות · גליל מערבי</title>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2340;--soft:#6a6f8a;--bg:#f5f4f9;--line:#e3e0ee;--a:#4c1d95;--b:#0f766e;
  --ok:#12b76a;--no:#dc2626;--warn:#e08600}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Assistant',sans-serif;
  font-size:16px;line-height:1.6;padding-bottom:50px}
h1,h2,h3,h4{font-family:'Secular One',sans-serif;font-weight:400;margin:0}
a{color:var(--a)}
.top{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;padding:13px 0;
  position:sticky;top:0;z-index:20}
.topin{max-width:900px;margin:0 auto;padding:0 15px;display:flex;gap:12px;
  align-items:center;flex-wrap:wrap}
.topin h1{font-size:1.25rem}
.topin .sb{opacity:.85;font-size:.85rem}
.spacer{margin-inline-start:auto}
select,input{font-family:inherit;font-size:.93rem;border:1px solid #d5d2e4;
  border-radius:10px;padding:8px 11px;background:#fff;color:var(--ink)}
.wrap{max-width:900px;margin:0 auto;padding:16px 15px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px 19px;
  margin-bottom:13px}
.hint{color:var(--soft);font-size:.88rem;margin:0 0 13px}
.btn{background:var(--a);color:#fff;border:0;border-radius:11px;padding:10px 20px;
  font-family:inherit;font-weight:800;font-size:.92rem;cursor:pointer}
.btn:hover{filter:brightness(.92)}
.btn.g{background:#efedf7;color:var(--ink)}
.btn.no{background:var(--no)}
.btn.sm{padding:6px 13px;font-size:.83rem;border-radius:9px}
.evrow{border:1px solid var(--line);border-radius:14px;padding:13px 16px;margin-bottom:10px}
.evrow.on{border-color:var(--a);box-shadow:0 0 0 2px rgba(76,29,149,.13)}
.evhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.evrow h4{font-size:1.07rem}
.evmeta{color:var(--soft);font-size:.86rem}
.cbox{display:flex;gap:8px;flex-wrap:wrap;margin:11px 0}
.cbox label{display:flex;gap:6px;align-items:center;background:#faf9fd;
  border:1px solid var(--line);border-radius:9px;padding:6px 12px;font-size:.88rem;
  font-weight:700;cursor:pointer}
.cbox label.has{background:#efedf7;border-color:#c4bce4}
.hrow{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end}
.hrow label{display:block;font-size:.79rem;font-weight:800;margin-bottom:3px}
.warnbox{background:#fff6e8;border:1px solid #f0dfa0;border-radius:11px;
  padding:10px 13px;font-size:.87rem;margin:9px 0}
table{width:100%;border-collapse:collapse;font-size:.91rem;margin-top:10px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right}
th{font-size:.78rem;color:var(--soft);font-weight:800}
.pill{display:inline-block;font-size:.76rem;font-weight:800;border-radius:20px;padding:2px 11px}
.pill.ok{background:#e7f7ee;color:#0f7a4d}
.pill.off{background:#f3f1f8;color:var(--soft)}
.empty{text-align:center;color:var(--soft);padding:28px 12px}
.msg{font-weight:800;font-size:.86rem;margin-top:8px}
.msg.ok{color:#0f7a4d} .msg.no{color:var(--no)}
</style>
</head>
<body>

<div class="top"><div class="topin">
  <h1>אירועים ונוכחות</h1>
  <span class="sb" id="yl"></span>
  <span class="spacer"></span>
  <select id="gradeSel" onchange="setGrade(this.value)"></select>
  <a class="btn g sm" href="gantt.html">לוח הגאנט</a>
</div></div>

<div class="wrap" id="app"><div class="card"><div class="empty">טוען…</div></div></div>

<script>
const SURL='https://skfriefqnoxfzmamcokd.supabase.co';
const SKEY='sb_publishable_Qx7EDPbdyYE9iv7uMQBKhQ_Aeojd_Q0';
async function api(path,opts={}){
  const r=await fetch(SURL+'/rest/v1/'+path,{...opts,
    headers:{apikey:SKEY,Authorization:'Bearer '+SKEY,
             'Content-Type':'application/json',Prefer:opts.prefer||''}});
  if(!r.ok) throw new Error((await r.text()).slice(0,200));
  const t=await r.text(); return t?JSON.parse(t):null;
}
const el=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dmy=s=>{ if(!s) return ''; const p=String(s).split('-');
  return (+p[2])+'.'+pad(+p[1])+'.'+p[0]; };
const GRADES=['ז','ח','ט','י','יא','יב'];
function planYear(){ const d=new Date(); return d.getMonth()>=7?d.getFullYear():d.getFullYear()-1; }
function yearLabel(y){ return 'תשפ״'+['ו','ז','ח','ט','י'][y-2025]+' · '+y+'/'+(y+1); }

let YEAR=planYear(), GRADE='י', PICK=null,
    CLASSES=[], GANTT=[], EVCLS=[], EVATT=[], EXAMS=[];

async function loadAll(){
  const tt=await api('exam_timetable?select=class_name&year_start=eq.'+YEAR+
    '&grade=eq.'+encodeURIComponent(GRADE))||[];
  CLASSES=[...new Set(tt.map(r=>r.class_name))].sort((a,b)=>{
    const n=s=>parseInt(String(s).replace(/\D+/g,''),10)||0;
    return n(a)-n(b)||String(a).localeCompare(b,'he');
  });

  /* ⚠ חופשות וחגים אינם אירועים שמצרפים אליהם כיתות, והצגתם הייתה
     מטביעה את הרשימה בעשרות שורות שאיש לא ילחץ עליהן. */
  GANTT=(await api('gantt_events?select=*&year_start=eq.'+YEAR+
    '&order=start_date.asc')||[])
    .filter(e=>e.track!=='vacation'&&e.track!=='holidays');

  EVCLS=await api('event_classes?select=*')||[];
  EVATT=await api('event_attendance?select=event_id,class_name,status')||[];

  /* מבחנים מאושרים בלבד — טיוטה אינה מבחן ואינה מצדיקה אזהרה. */
  EXAMS=await api('exam_board?select=exam_date,hour,scope,class_name,subject_base,level'+
    '&year_start=eq.'+YEAR+'&grade=eq.'+encodeURIComponent(GRADE)+
    '&status=eq.approved&exam_date=not.is.null')||[];
}

const clsOf = id => EVCLS.filter(x=>String(x.event_id)===String(id));
const myCls = id => clsOf(id).filter(x=>CLASSES.indexOf(x.class_name)>-1);
function attOf(id,cls){
  const rows=EVATT.filter(x=>String(x.event_id)===String(id)&&x.class_name===cls);
  return {n:rows.length, present:rows.filter(x=>x.status==='present').length};
}
function clashes(ev, classes){
  return EXAMS.filter(x=>
    x.exam_date>=ev.start_date && x.exam_date<=ev.end_date &&
    (x.scope==='grade' || classes.indexOf(x.class_name)>-1));
}

function render(){
  el('yl').textContent='שכבה '+GRADE+' · '+yearLabel(YEAR);
  if(!CLASSES.length){
    el('app').innerHTML='<div class="card"><div class="empty">'+
      'אין מערכת לשכבה '+esc(GRADE)+' בשנת '+yearLabel(YEAR)+'.<br>'+
      '<a href="mivchanim-import.html">למסך הייבוא ←</a></div></div>';
    return;
  }
  const withCls=GANTT.filter(e=>myCls(e.id).length>0);
  let html='<div class="card">'+
    '<h3 style="font-size:1.15rem">אירועים של שכבה '+esc(GRADE)+'</h3>'+
    '<p class="hint">האירועים נלקחים מלוח הגאנט. צרפו כיתות לאירוע כדי '+
    'שמחנכיהן יוכלו לספור נוכחות. אירוע חדש נפתח '+
    '<a href="gantt.html">בלוח הגאנט</a>.</p>';

  if(!GANTT.length)
    return void(el('app').innerHTML=html+'<div class="empty">'+
      'אין אירועים בשנה הזו.</div></div>');

  html+=(withCls.length?'':'<p class="hint">עדיין לא צירפתם כיתות לאף אירוע.</p>')+
    GANTT.map(e=>{
      const mine=myCls(e.id), open=String(PICK)===String(e.id);
      let r='<div class="evrow'+(open?' on':'')+'"><div class="evhead">'+
        '<div><h4>'+esc(e.title)+'</h4><div class="evmeta">'+esc(dmy(e.start_date))+
          (e.end_date!==e.start_date?' – '+esc(dmy(e.end_date)):'')+' · '+
          (mine.length? mine.length+' כיתות מהשכבה'
                      : '<span style="color:var(--warn)">אין כיתות</span>')+
        '</div></div>'+
        '<button class="btn '+(open?'':'g')+' sm" style="margin:0 auto 0 0" '+
          'onclick="pick(\''+e.id+'\')">'+(open?'סגירה':'כיתות ונוכחות')+'</button>'+
      '</div>';
      if(mine.length && !open){
        r+='<div class="evmeta" style="margin-top:7px">'+mine.map(c=>{
          const a=attOf(e.id,c.class_name);
          return esc(c.class_name)+(a.n?' · '+a.present+'/'+a.n:' · טרם נספרה');
        }).join(' &nbsp;·&nbsp; ')+'</div>';
      }
      if(open) r+=editor(e, mine);
      return r+'</div>';
    }).join('');
  el('app').innerHTML=html+'</div>';
}

function editor(e, mine){
  const picked=mine.map(x=>x.class_name);
  const cl=clashes(e, picked);
  let r='<div class="cbox">'+CLASSES.map(c=>
    '<label class="'+(picked.indexOf(c)>-1?'has':'')+'">'+
    '<input type="checkbox" class="evc" value="'+esc(c)+'"'+
      (picked.indexOf(c)>-1?' checked':'')+'>'+esc(c)+'</label>').join('')+'</div>'+
    '<div class="hrow">'+
      '<div><label>משעה</label><input type="number" min="1" max="10" id="h1" '+
        'style="width:82px" value="'+((mine[0]&&mine[0].hour_start)||'')+'"></div>'+
      '<div><label>עד שעה</label><input type="number" min="1" max="10" id="h2" '+
        'style="width:82px" value="'+((mine[0]&&mine[0].hour_end)||'')+'"></div>'+
      '<button class="btn sm" onclick="saveClasses(\''+e.id+'\')">שמירה</button>'+
    '</div><div class="msg" id="msg"></div>';

  if(cl.length) r+='<div class="warnbox">⚠ <b>יש מבחנים בטווח האירוע:</b> '+
    cl.map(x=>esc(x.subject_base)+(x.level?' '+esc(x.level):'')+' · '+
      (x.scope==='grade'?'כל השכבה':esc(x.class_name||''))+' · '+
      esc(dmy(x.exam_date))+(x.hour?' שעה '+x.hour:'')).join(' &nbsp;·&nbsp; ')+
    '<br>האירוע אינו נחסם — החליטו אם להזיז את המבחן בלוח המבחנים.</div>';

  if(mine.length){
    r+='<table><thead><tr><th>כיתה</th><th>נוכחות</th>'+
      '<th style="width:180px"></th></tr></thead><tbody>'+
      mine.map(c=>{ const a=attOf(e.id,c.class_name);
        return '<tr><td><b>'+esc(c.class_name)+'</b></td>'+
        '<td>'+(a.n? '<span class="pill ok">'+a.present+' מתוך '+a.n+'</span>'
                   : '<span class="pill off">טרם נספרה</span>')+'</td>'+
        '<td><button class="btn g sm" onclick="copyLink(\''+e.id+'\',\''+
          esc(c.class_name)+'\')">העתקת קישור למחנך</button></td></tr>';
      }).join('')+'</tbody></table>';
  }
  return r;
}

function pick(id){ PICK=(String(PICK)===String(id)?null:id); render(); }
function setGrade(g){ GRADE=g; PICK=null; boot(); }

function teacherLink(id,cls){
  return location.href.replace(/[^/]*$/,'') +
    'mivchanim-nochehut.html?event='+encodeURIComponent(id)+
    '&class='+encodeURIComponent(cls);
}
async function copyLink(id,cls){
  const u=teacherLink(id,cls), m=el('msg');
  try{ await navigator.clipboard.writeText(u);
    if(m){ m.className='msg ok'; m.textContent='הקישור של '+cls+' הועתק.'; }
  }catch(e){
    /* ⚠ clipboard נחסם בהקשר לא מאובטח. עדיף להראות את הכתובת
       מאשר להשאיר את המחנך בלי כלום. */
    prompt('העתיקו את הקישור:', u);
  }
}

async function saveClasses(id){
  const want=[...document.querySelectorAll('.evc')].filter(b=>b.checked).map(b=>b.value);
  const h1=parseInt(el('h1').value,10)||null, h2=parseInt(el('h2').value,10)||null;
  const have=myCls(id).map(x=>x.class_name);
  const del=have.filter(c=>want.indexOf(c)<0);
  const m=el('msg');
  try{
    for(const c of del){
      await api('event_classes?event_id=eq.'+encodeURIComponent(id)+
        '&class_name=eq.'+encodeURIComponent(c),{method:'DELETE'});
      await api('event_attendance?event_id=eq.'+encodeURIComponent(id)+
        '&class_name=eq.'+encodeURIComponent(c),{method:'DELETE'});
    }
    if(want.length){
      await api('event_classes?on_conflict=event_id,class_name',
        {method:'POST', prefer:'resolution=merge-duplicates',
         body:JSON.stringify(want.map(c=>({event_id:id, class_name:c,
           hour_start:h1, hour_end:h2})))});
    }
    await loadAll(); render();
    const mm=el('msg'); if(mm){ mm.className='msg ok'; mm.textContent='נשמר.'; }
  }catch(err){ if(m){ m.className='msg no'; m.textContent='שגיאה: '+err.message; } }
}

async function boot(){
  el('app').innerHTML='<div class="card"><div class="empty">טוען…</div></div>';
  try{ await loadAll(); render(); }
  catch(e){ el('app').innerHTML='<div class="card"><div class="empty">שגיאה: '+
    esc(e.message)+'</div></div>'; }
}

(function init(){
  const q=new URLSearchParams(location.search);
  if(q.get('grade')) GRADE=q.get('grade');
  if(q.get('year')) YEAR=parseInt(q.get('year'),10)||YEAR;
  el('gradeSel').innerHTML=GRADES.map(g=>'<option'+(g===GRADE?' selected':'')+'>'+g+
    '</option>').join('');
  boot();
})();
</script>
</body>
</html>
