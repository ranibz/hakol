<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-version" content="1.0.0">
<meta name="robots" content="noindex">
<title>עדכון תיק ביטחון וחירום מוסדי</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="bitachon-schema.js"></script>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14202e;--muted:#5d6b7c;--line:#d5dce5;--navy:#1b2d45;--ok:#15803d;--bad:#b42318}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,system-ui,sans-serif}
button,input,textarea,select{font-family:inherit;font-size:15px}
.bar{background:var(--navy);color:#fff;position:sticky;top:0;z-index:5}
.bar .in{max-width:980px;margin:0 auto;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar h1{font-size:17px;margin:0;font-weight:800}
.bar .sp{margin-inline-start:auto}
.bar a,.bar button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:9px;padding:8px 12px;font-weight:700;cursor:pointer;text-decoration:none}
#save{background:#22c55e;color:#06290f}
#save.dirty{background:#facc15;color:#3b2a00}
.st{font-size:13px;opacity:.9}
.wrap{max-width:980px;margin:0 auto;padding:14px}
.gate{max-width:420px;margin:60px auto;background:#fff;border-radius:16px;padding:22px;text-align:center}
.gate input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font-size:17px;margin-top:10px;text-align:center}
.gate button{width:100%;padding:13px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-size:17px;font-weight:800;margin-top:10px;cursor:pointer}
.err{color:var(--bad);font-weight:700;min-height:20px;margin-top:8px}
details.ch{background:#fff;border-radius:14px;margin-bottom:10px;border:1px solid var(--line)}
details.ch>summary{padding:14px 16px;font-weight:900;font-size:17px;cursor:pointer;color:var(--navy)}
.ch .body{padding:0 16px 16px}
.part{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px}
.part h3{margin:0 0 8px;font-size:15.5px}
.part h3 .n{color:#8a1c1c;margin-inline-end:6px}
label.f{display:block;margin:6px 0}
label.f span{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:2px}
input.i,textarea.i{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:#fff}
textarea.i{min-height:70px;resize:vertical;line-height:1.5}
.ltr{direction:ltr;text-align:right}
.tw{overflow-x:auto}
table.ed{border-collapse:collapse;width:100%;min-width:560px}
table.ed th{font-size:12.5px;background:#eef2f7;padding:5px;border:1px solid var(--line);text-align:right}
table.ed td{border:1px solid var(--line);padding:2px;vertical-align:top}
table.ed td input,table.ed td textarea{width:100%;border:0;padding:6px;background:transparent;min-width:70px}
table.ed td textarea{min-height:46px;resize:vertical}
table.ed td.ops{white-space:nowrap;width:1%;text-align:center}
table.ed th input{width:100%;border:1px solid #c8d0db;border-radius:5px;padding:4px;font-weight:700;font-size:12.5px;min-width:60px}
.mini{border:0;background:#eef2f7;border-radius:6px;padding:4px 7px;cursor:pointer;margin:1px}
.mini.del{color:var(--bad)}
.add{margin-top:6px;border:1px dashed #94a3b8;background:#f8fafc;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:700}
.hint{font-size:12.5px;color:var(--muted);margin:2px 0 6px}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.imc{border:1px solid var(--line);border-radius:10px;padding:8px;background:#fafbfc}
.imc .th{height:120px;background:#eef1f4;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-size:13px}
.imc .th img{width:100%;height:100%;object-fit:cover}
.imc input,.imc select{width:100%;margin-top:5px;padding:6px;border:1px solid var(--line);border-radius:6px}
.imc .row{display:flex;gap:5px;margin-top:5px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#14202e;color:#fff;padding:10px 18px;border-radius:99px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
footer{text-align:center;color:var(--muted);font-size:12px;margin:20px 0}
</style>
</head>
<body>
<div class="bar"><div class="in">
  <h1>✏️ עדכון תיק ביטחון וחירום</h1><span class="st" id="st"></span>
  <span class="sp"></span><span id="acts"></span>
</div></div>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<footer>פיתוח: רני בן זאב · v1.0.0</footer>

<script>
const $ = id => document.getElementById(id);
const esc = btEsc;
const CODE_KEY = 'bt_code';
let CODE = '', DATA = {}, IMGS = [], DIRTY = false;
const ss = {get(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } },
            set(k,v){ try{ sessionStorage.setItem(k,v); }catch(e){} }, del(k){ try{ sessionStorage.removeItem(k); }catch(e){} }};
function toast(t){ const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('on'), 2200); }
function dirty(on = true){ DIRTY = on; const b = $('save'); if(b){ b.classList.toggle('dirty', on); b.textContent = on ? '💾 שמירה (יש שינויים)' : '✓ נשמר'; } }
window.addEventListener('beforeunload', e => { if(DIRTY){ e.preventDefault(); e.returnValue = ''; } });

function gate(msg){
  $('acts').innerHTML = '';
  $('app').innerHTML = `<div class="gate"><div style="font-size:42px">✏️</div>
    <h2 style="margin:6px 0">עדכון תיק ביטחון וחירום</h2>
    <p style="color:var(--muted);margin:0">נדרש קוד עריכה.</p>
    <input id="code" type="password" autocomplete="off" placeholder="קוד עריכה">
    <button id="go">כניסה</button><div class="err" id="err">${msg ? esc(msg) : ''}</div>
    <p><a href="bitachon.html">← לתיק</a></p></div>`;
  const go = () => { const c = $('code').value.trim(); if(c) load(c); };
  $('go').onclick = go; $('code').onkeydown = e => { if(e.key === 'Enter') go(); };
}
async function load(code){
  if($('err')) $('err').textContent = 'טוען…';
  try{
    const r = await btRpc('bt_get', {p_code: code});
    if(r.role !== 'edit'){ gate('זה קוד צפייה. לעדכון נדרש קוד עריכה.'); return; }
    CODE = code; DATA = r.data || {}; IMGS = r.images || [];
    ss.set(CODE_KEY, code);
    $('st').textContent = r.updated_at ? 'נשמר לאחרונה: ' + new Date(r.updated_at).toLocaleString('he-IL') : '';
    render(); dirty(false);
  }catch(e){ ss.del(CODE_KEY); gate(/קוד/.test(e.message) ? 'קוד שגוי' : 'אין חיבור לשרת'); }
}

/* ---------- עורכים לפי סוג ---------- */
const val = x => x == null ? '' : String(x);
function inp(path, value, {ltr, multi, ph} = {}){
  return multi ? `<textarea class="i${ltr ? ' ltr' : ''}" data-p="${path}" placeholder="${esc(ph || '')}">${esc(val(value))}</textarea>`
               : `<input class="i${ltr ? ' ltr' : ''}" data-p="${path}" value="${esc(val(value))}" placeholder="${esc(ph || '')}">`;
}
function eFields(p){
  const o = DATA[p.k] ||= {};
  return p.fields.map(([k, l, ltr, multi]) => `<label class="f"><span>${esc(l)}</span>${inp(`${p.k}.${k}`, o[k], {ltr, multi})}</label>`).join('');
}
function rowOps(k, i, n){
  return `<td class="ops"><button class="mini" data-mv="${k}|${i}|-1" ${i === 0 ? 'disabled' : ''}>▲</button><button class="mini" data-mv="${k}|${i}|1" ${i === n - 1 ? 'disabled' : ''}>▼</button><button class="mini del" data-rm="${k}|${i}">✕</button></td>`;
}
function eTable(p){
  const rows = DATA[p.k] ||= [];
  const multi = c => /desc|need|supports|task|notes|what|stage/.test(c.k);
  return `${p.yearKey ? `<label class="f" style="max-width:240px"><span>שנת הלימודים</span>${inp(p.yearKey, DATA[p.yearKey])}</label>` : ''}
    <div class="tw"><table class="ed"><thead><tr>${p.cols.map(c => `<th>${esc(c.l)}</th>`).join('')}<th></th></tr></thead><tbody>
    ${rows.map((r, i) => `<tr>${p.cols.map(c => `<td>${multi(c) ? `<textarea data-p="${p.k}.${i}.${c.k}" placeholder="${esc(c.ph || '')}">${esc(val(r[c.k]))}</textarea>`
        : `<input class="${c.ltr ? 'ltr' : ''}" data-p="${p.k}.${i}.${c.k}" value="${esc(val(r[c.k]))}" placeholder="${esc(c.ph || '')}">`}</td>`).join('')}${rowOps(p.k, i, rows.length)}</tr>`).join('')}
    </tbody></table></div><button class="add" data-add="${p.k}">＋ הוספת שורה</button>`;
}
function eText(p){ return `<textarea class="i" style="min-height:110px" data-p="${p.k}">${esc(val(DATA[p.k]))}</textarea><div class="hint">שורה ריקה = פסקה חדשה.</div>`; }
function eList(p){ return `<textarea class="i" style="min-height:140px" data-list="${p.k}">${esc((DATA[p.k] || []).join('\n'))}</textarea><div class="hint">כל שורה — סעיף נפרד.</div>`; }
function eMatrix(p){
  const m = DATA[p.k] ||= {cols: [], rows: []};
  return `<div class="tw"><table class="ed"><thead><tr><th>מיקום</th>${m.cols.map((c, j) =>
      `<th><input data-mc="${p.k}|${j}" value="${esc(c)}"><button class="mini del" data-mcrm="${p.k}|${j}" title="מחיקת עמודה">✕</button></th>`).join('')}
      <th><button class="mini" data-mcadd="${p.k}">＋ עמודה</button></th></tr></thead><tbody>
    ${m.rows.map((r, i) => `<tr><td><input data-p="${p.k}.rows.${i}.place" value="${esc(val(r.place))}"></td>${m.cols.map((_, j) =>
      `<td><input style="text-align:center;min-width:44px" data-p="${p.k}.rows.${i}.vals.${j}" value="${esc(val(r.vals?.[j]))}"></td>`).join('')}${rowOps(p.k + '.rows', i, m.rows.length)}</tr>`).join('')}
    </tbody></table></div><button class="add" data-madd="${p.k}">＋ הוספת מיקום</button><div class="hint">שורת הסה"כ מחושבת לבד בתיק.</div>`;
}
function eActs(p){
  const cols = DATA[p.colsKey] ||= [], rows = DATA[p.k] ||= [];
  return `<div class="tw"><table class="ed"><thead><tr>${p.stage ? '<th>שלב</th>' : ''}${cols.map((c, j) =>
      `<th><input data-ac="${p.colsKey}|${j}" value="${esc(c)}"><button class="mini del" data-acrm="${p.colsKey}|${p.k}|${j}">✕</button></th>`).join('')}
      <th><button class="mini" data-acadd="${p.colsKey}|${p.k}">＋ עמודה</button></th></tr></thead><tbody>
    ${rows.map((r, i) => `<tr>${p.stage ? `<td><textarea data-p="${p.k}.${i}.stage">${esc(val(r.stage))}</textarea></td>` : ''}${cols.map((_, j) =>
      `<td><textarea data-p="${p.k}.${i}.vals.${j}">${esc(val(r.vals?.[j]))}</textarea></td>`).join('')}${rowOps(p.k, i, rows.length)}</tr>`).join('')}
    </tbody></table></div><button class="add" data-aadd="${p.k}">＋ הוספת שורה</button>`;
}
function ePart(p){
  let h = `<div class="part">${p.t ? `<h3>${p.n ? `<span class="n">${esc(p.n)}</span>` : ''}${esc(p.t)}</h3>` : ''}`;
  if(p.type === 'fields') h += eFields(p);
  else if(p.type === 'table') h += eTable(p);
  else if(p.type === 'text') h += eText(p);
  else if(p.type === 'list') h += eList(p);
  else if(p.type === 'matrix') h += eMatrix(p);
  else if(p.type === 'acts') h += eActs(p);
  if(p.images) h += `<div class="hint">📷 התמונות של המקטע הזה — בפרק "תמונות" למטה (מקטע: ${esc(BT_IMG_SECTIONS[p.images])}).</div>`;
  return h + '</div>';
}

let OPEN = new Set();
function render(){
  document.querySelectorAll('details.ch').forEach(d => { if(d.open) OPEN.add(d.dataset.c); else OPEN.delete(d.dataset.c); });
  $('acts').innerHTML = `<button id="save">✓ נשמר</button><a href="bitachon.html">📖 לתיק</a><button id="out">יציאה</button>`;
  $('app').innerHTML = BT_SCHEMA.map(c => `<details class="ch" data-c="${c.n}"${OPEN.has(c.n) ? ' open' : ''}><summary>${esc(c.n)}. ${esc(c.t)}</summary><div class="body">
      ${c.parts.map(ePart).join('')}</div></details>`).join('') +
    `<details class="ch" data-c="img"${OPEN.has('img') ? ' open' : ''}><summary>📷 תמונות</summary><div class="body" id="imgBody"></div></details>
     <details class="ch" data-c="codes"><summary>⚙️ קודים</summary><div class="body">
       <p class="hint">קוד צפייה — פותח את התיק לקריאה ולהדפסה. קוד עריכה — פותח גם את הטופס הזה. השארת שדה ריק = הקוד לא משתנה.</p>
       <label class="f"><span>קוד צפייה חדש</span><input class="i" id="cView" autocomplete="off"></label>
       <label class="f"><span>קוד עריכה חדש</span><input class="i" id="cEdit" autocomplete="off"></label>
       <button class="add" id="cSave">שמירת קודים</button></div></details>`;
  dirty(DIRTY);
  $('save').onclick = save;
  $('out').onclick = () => { if(DIRTY && !confirm('יש שינויים שלא נשמרו. לצאת בכל זאת?')) return; DIRTY = false; ss.del(CODE_KEY); location.reload(); };
  $('cSave').onclick = setCodes;
  renderImgs();
}

/* ---------- עדכון הנתונים מהשדות ---------- */
function setPath(path, value){
  const ks = path.split('.'); let o = DATA;
  for(let i = 0; i < ks.length - 1; i++){ const k = /^\d+$/.test(ks[i]) ? +ks[i] : ks[i];
    if(o[k] == null) o[k] = /^\d+$/.test(ks[i + 1]) ? [] : {}; o = o[k]; }
  const last = ks[ks.length - 1]; o[/^\d+$/.test(last) ? +last : last] = value;
}
const getPath = path => path.split('.').reduce((o, k) => o == null ? o : o[/^\d+$/.test(k) ? +k : k], DATA);
$('app').addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.p){ setPath(t.dataset.p, t.value); dirty(); }
  else if(t.dataset.list){ DATA[t.dataset.list] = t.value.split('\n').map(x => x.trim()).filter(Boolean); dirty(); }
  else if(t.dataset.mc){ const [k, j] = t.dataset.mc.split('|'); DATA[k].cols[+j] = t.value; dirty(); }
  else if(t.dataset.ac){ const [k, j] = t.dataset.ac.split('|'); DATA[k][+j] = t.value; dirty(); }
});
$('app').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  const d = b.dataset; let changed = true;
  if(d.add){ (DATA[d.add] ||= []).push({}); }
  else if(d.rm){ const [k, i] = d.rm.split('|'); if(!confirm('למחוק את השורה?')) return; getPath(k).splice(+i, 1); }
  else if(d.mv){ const [k, i, s] = d.mv.split('|'); const a = getPath(k), x = +i, y = x + (+s); [a[x], a[y]] = [a[y], a[x]]; }
  else if(d.madd){ const m = DATA[d.madd]; m.rows.push({place: '', vals: m.cols.map(() => '')}); }
  else if(d.mcadd){ const m = DATA[d.mcadd]; m.cols.push('פריט חדש'); m.rows.forEach(r => (r.vals ||= []).push('')); }
  else if(d.mcrm){ const [k, j] = d.mcrm.split('|'); const m = DATA[k]; if(!confirm(`למחוק את העמודה "${m.cols[+j]}"?`)) return;
    m.cols.splice(+j, 1); m.rows.forEach(r => r.vals?.splice(+j, 1)); }
  else if(d.aadd){ const k = d.aadd; const p = BT_SCHEMA.flatMap(c => c.parts).find(x => x.k === k);
    (DATA[k] ||= []).push({stage: '', vals: (DATA[p.colsKey] || []).map(() => '')}); }
  else if(d.acadd){ const [ck, k] = d.acadd.split('|'); (DATA[ck] ||= []).push('תפקיד'); (DATA[k] || []).forEach(r => (r.vals ||= []).push('')); }
  else if(d.acrm){ const [ck, k, j] = d.acrm.split('|'); if(!confirm(`למחוק את העמודה "${DATA[ck][+j]}"?`)) return;
    DATA[ck].splice(+j, 1); (DATA[k] || []).forEach(r => r.vals?.splice(+j, 1)); }
  else changed = false;
  if(changed){ e.preventDefault(); dirty(); render(); }
});

async function save(){
  const b = $('save'); b.textContent = '⏳ שומר…';
  try{
    const at = await btRpc('bt_put', {p_code: CODE, p_data: DATA, p_by: 'טופס עדכון'});
    dirty(false); toast('✓ התיק נשמר');
    $('st').textContent = 'נשמר לאחרונה: ' + new Date(at).toLocaleString('he-IL');
  }catch(e){ dirty(true); alert('השמירה נכשלה: ' + e.message); }
}
async function setCodes(){
  const vv = $('cView').value.trim(), ee = $('cEdit').value.trim();
  if(!vv && !ee) return;
  if(ee && !confirm(`קוד העריכה יוחלף ל: ${ee}\nלרשום אותו במקום שמור. להמשיך?`)) return;
  try{
    await btRpc('bt_set_codes', {p_code: CODE, p_view: vv, p_edit: ee});
    if(ee){ CODE = ee; ss.set(CODE_KEY, ee); }
    $('cView').value = $('cEdit').value = ''; toast('✓ הקודים עודכנו');
  }catch(e){ alert('לא עודכן: ' + e.message); }
}

/* ---------- תמונות ---------- */
const THUMB = {};
function renderImgs(){
  const el = $('imgBody'); if(!el) return;
  const secOpts = s => Object.entries(BT_IMG_SECTIONS).map(([k, l]) => `<option value="${k}"${k === s ? ' selected' : ''}>${esc(l)}</option>`).join('');
  const list = IMGS.slice().sort((a, b) => a.section.localeCompare(b.section) || a.sort - b.sort);
  el.innerHTML = `<p class="hint">אפשר לבחור כמה תמונות יחד. הן מוקטנות בדפדפן לפני ההעלאה. התמונות רגישות ונשמרות בשרת בגישה עם קוד בלבד.</p>
    <label class="f"><span>מקטע לתמונות החדשות</span><select id="upSec" class="i">${secOpts('access')}</select></label>
    <input type="file" id="upFiles" accept="image/*" multiple>
    <div class="imgs" style="margin-top:10px">${list.map(i => `<div class="imc" data-id="${esc(i.id)}">
      <div class="th" data-th="${esc(i.id)}">${THUMB[i.id] ? `<img src="${THUMB[i.id]}">` : 'טוען…'}</div>
      <input data-cap value="${esc(i.caption || '')}" placeholder="כיתוב">
      <select data-sec>${secOpts(i.section)}</select>
      <div class="row"><input data-sort type="number" value="${i.sort}" style="width:70px" title="סדר">
        <button class="mini" data-imsave>שמירה</button><button class="mini del" data-imdel>מחיקה</button></div></div>`).join('')}</div>`;
  $('upFiles').onchange = upload;
  el.querySelectorAll('[data-imsave]').forEach(b => b.onclick = () => saveImg(b.closest('.imc')));
  el.querySelectorAll('[data-imdel]').forEach(b => b.onclick = () => delImg(b.closest('.imc')));
  (async () => { for(const th of el.querySelectorAll('[data-th]')){ const id = th.dataset.th; if(THUMB[id]) continue;
    try{ THUMB[id] = await btRpc('bt_img', {p_code: CODE, p_id: id}); th.innerHTML = THUMB[id] ? `<img src="${THUMB[id]}">` : 'אין'; }catch(e){ th.textContent = 'שגיאה'; } } })();
}
function shrink(file){
  return new Promise((res, rej) => {
    const im = new Image(), url = URL.createObjectURL(file);
    im.onload = () => { const s = Math.min(1, 1600 / Math.max(im.width, im.height));
      const c = document.createElement('canvas'); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.72)); };
    im.onerror = rej; im.src = url;
  });
}
async function upload(e){
  const files = [...e.target.files]; if(!files.length) return;
  const sec = $('upSec').value;
  let n = 0, sort = Math.max(0, ...IMGS.filter(i => i.section === sec).map(i => i.sort));
  for(const f of files){
    toast(`מעלה ${++n}/${files.length}…`);
    try{
      const data = await shrink(f), id = 'u' + Date.now().toString(36) + n;
      const cap = f.name.replace(/\.[^.]+$/, '').replace(/^\d+\s*/, '');
      await btRpc('bt_img_put', {p_code: CODE, p_id: id, p_section: sec, p_caption: cap, p_sort: ++sort, p_data: data});
      IMGS.push({id, section: sec, caption: cap, sort}); THUMB[id] = data;
    }catch(err){ alert(`"${f.name}" לא הועלתה: ${err.message}`); }
  }
  toast('✓ התמונות הועלו'); renderImgs();
}
async function saveImg(card){
  const id = card.dataset.id, cap = card.querySelector('[data-cap]').value, sec = card.querySelector('[data-sec]').value,
        sort = +card.querySelector('[data-sort]').value || 0;
  try{ await btRpc('bt_img_put', {p_code: CODE, p_id: id, p_section: sec, p_caption: cap, p_sort: sort, p_data: ''});
    Object.assign(IMGS.find(i => i.id === id), {caption: cap, section: sec, sort}); toast('✓ נשמר'); renderImgs(); }
  catch(e){ alert('לא נשמר: ' + e.message); }
}
async function delImg(card){
  const id = card.dataset.id; if(!confirm('למחוק את התמונה? אי אפשר לשחזר.')) return;
  try{ await btRpc('bt_img_del', {p_code: CODE, p_id: id}); IMGS = IMGS.filter(i => i.id !== id); delete THUMB[id]; renderImgs(); toast('נמחקה'); }
  catch(e){ alert('לא נמחקה: ' + e.message); }
}

const saved = ss.get(CODE_KEY);
if(saved) load(saved); else gate();
</script>
