function awayLabel(s){
  const st = String(s.st || '').toLowerCase();
  if(s.a || /absent|נעדר|חסר|לא הגיע/.test(st)) return 'לא הגיע הבוקר';
  if(/releas|left|exit|out|יצא|שוחרר|שחרור/.test(st)) return 'יצא מבית הספר';
  if(/excus|מוצדק|מאושר/.test(st)) return 'היעדרות מאושרת';
  return '';
}
const levelOf = c => { c = String(c || '').trim();
  return /^(יא|יב|י)(?![א-ת])/.test(c) ? 'upper' : /^(ז|ח|ט)(?![א-ת])/.test(c) ? 'middle' : null; };
const CHUNK = 60;   // תלמידים בכל QR סיכום

async function rpc(fn, body, ms = 8000){
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  try{
    const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {method:'POST', signal:ctl.signal,
      headers:{apikey:SB_KEY, Authorization:'Bearer '+SB_KEY, 'Content-Type':'application/json'}, body:JSON.stringify(body)});
    if(!r.ok) throw new Error(await r.text());
    const txt = await r.text(); return txt ? JSON.parse(txt) : null;
  } finally { clearTimeout(t); }
}

function indexRoster(){
  byTok = {}; byTok8 = {}; byId = {};
  (ROSTER?.rows || []).forEach(s => { byId[s.id] = s; if(s.t){ byTok[s.t] = s; byTok8[s.t.slice(0,8)] = s; } });

async function refreshRoster(pin){
  const rows = await rpc('shelter_roster', {p_pin: pin}, 15000);
  if(!rows || !rows.length) throw new Error('empty');
  ROSTER = {at: new Date().toISOString(), rows: rows.map(r => ({id:r.student_id, t:r.token, n:r.name, c:r.class, a:!!r.absent, st:r.status || ''}))};
  ls.set('sh_roster', ROSTER); indexRoster();
  return ROSTER.rows.length;
}

let scanner = null, lastText = '', lastAt = 0;
async function startScanner(onText){
  if(typeof Html5Qrcode === 'undefined'){ alert('רכיב הסריקה לא נטען. פתחו את הדף פעם אחת עם אינטרנט.'); return; }
  if(scanner){ try{ await scanner.stop(); }catch(e){} }
  scanner = new Html5Qrcode('reader');
  try{
    await scanner.start({facingMode:'environment'}, {fps:10, qrbox:{width:240, height:240}}, text => {
      const now = Date.now();
      if(text === lastText && now - lastAt < 3000) return;
      lastText = text; lastAt = now; onText(text);
    });
    const b = $('camBtn'); if(b){ b.dataset.label = b.dataset.label || b.textContent; b.textContent = '⏹️ עצירת מצלמה'; b.onclick = stopScanner; }
  }catch(e){ alert('לא ניתן להפעיל מצלמה: ' + e); }
}
async function stopScanner(){
  if(scanner){ try{ await scanner.stop(); }catch(e){} scanner = null; }
  const b = $('camBtn'); if(b){ b.textContent = b.dataset.label || '📷 הפעלת מצלמה'; b.onclick = window._camStart; }
}
function beep(ok){
  try{ navigator.vibrate && navigator.vibrate(ok ? 80 : [60,60,60]); }catch(e){}
}

function eventStale(){
  const t0 = Date.parse(session() || '') || 0;
  const last = SCANS.filter(x => x.session === session()).reduce((m, x) => Math.max(m, Date.parse(x.at) || 0), t0);

}

function chooseEvent(t){
  if(!EVENTS[t]) return renderType();
  const same = evType() === t && !eventStale();
  if(same && shelter()) return shelterRoute();
  if(!same) ls.set('sh_session', new Date().toISOString());
  ls.set('sh_type', t); ls.del('sh_shelter'); shelterRoute();
}

/* v1.4.0 — הקראת שמות לפי כיתה */
function rollHere(){
  const here = {};
  SCANS.filter(x => x.session === session()).forEach(x => { if(!here[x.sid] || here[x.sid].at > x.at) here[x.sid] = x; });
  return here;
}
function renderRoll(c){
  stopScanner(); closeQR();
  const classes = [...new Set(ROSTER.rows.map(r => r.c))].sort((a,b) => a.localeCompare(b, 'he', {numeric:true}));
  if(c && !classes.includes(c)) c = '';
  const here = rollHere();
  const all = c ? ROSTER.rows.filter(r => r.c === c).sort((a,b) => a.n.localeCompare(b.n, 'he')) : [];
  const nYes = all.filter(r => here[r.id]).length, nAway = all.filter(r => !here[r.id] && awayLabel(r)).length;
  app.innerHTML = `
    <button class="btn sec" id="rollBack" style="margin-top:4px">← חזרה לסריקה · ${esc(shelter())}</button>
    <div class="pickTitle" style="margin-top:12px">📋 הקראת שמות</div>
    <select id="rollCls" style="font-size:18px;font-weight:700"><option value="">בחרו כיתה…</option>${classes.map(x => `<option ${x === c ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>
    ${c ? `<div class="stat" style="margin-top:10px">
        <div><b style="color:var(--ok)">${nYes}</b>כאן</div>
        <div><b style="color:var(--bad)">${all.length - nYes - nAway}</b>חסרים</div>
        <div><b style="color:#b07d00">${nAway}</b>לא הגיעו / יצאו</div></div>
      <p class="muted" style="margin:8px 2px">לחיצה על שם = "נמצא כאן". ✅ ירוק — כאן · 🟡 צהוב — לא הגיע הבוקר או יצא · לבן — עוד לא נמצא.</p>
      <div id="rollList">${all.map(r => {
        const h = here[r.id], away = awayLabel(r);
        const cls = h ? 'yes' : away ? 'away' : 'no';
        const sub = h ? `${hhmm(h.at)}${h.shelter !== shelter() ? ' · ' + esc(h.shelter) : ''}${h.synced ? '' : ' ⏳'}` : away;
        return `<button class="rollRow ${cls}" data-id="${esc(r.id)}"><span>${h ? '✅ ' : away ? '🟡 ' : ''}${esc(r.n)}</span><span class="sub">${sub}</span></button>`;
      }).join('')}</div>
      <p class="muted" style="font-size:12px;margin-top:8px">רק סריקות וסימונים מהטלפון הזה. התמונה המלאה מכל הטלפונים — במסך המנהלת.</p>` : ''}`;
  $('rollBack').onclick = renderScan;
  $('rollCls').onchange = e => { ls.set('sh_roll_class', e.target.value); renderRoll(e.target.value); };
  if($('rollList')) $('rollList').onclick = e => {
    const b = e.target.closest('[data-id]'); if(!b) return;
    const st = byId[b.dataset.id]; const h = rollHere()[st.id];
    if(h){
      if(h.synced || h.session !== session()){ alert(`${st.n} כבר נרשם/ה ב-${hhmm(h.at)} ונשלח לשרת.`); return; }
      if(!confirm(`לבטל את הרישום של ${st.n}?`)) return;
      SCANS = SCANS.filter(x => x.id !== h.id); saveScans(); renderRoll(c); return;
    }
    const away = awayLabel(st);
    if(away && !confirm(`${st.n} מסומן/ת "${away}".\nלסמן שנמצא/ת כאן?`)) return;
    SCANS.push({id: uid(), sid: st.id, shelter: shelter(), at: new Date().toISOString(), session: session(), src: 'rollcall', synced: false});
    saveScans(); beep(true); renderSub(); sync(); renderRoll(c);
  };
}

/* v1.2.0 — מי מהכיתה נסרק בטלפון הזה באירוע הנוכחי (בכל מקום) */
function renderClassCheck(c){
  const el = $('clsOut'); if(!el) return;
  if(!c){ el.innerHTML = ''; return; }
  const here = {};
  SCANS.filter(x => x.session === session()).forEach(x => { if(!here[x.sid] || here[x.sid].at > x.at) here[x.sid] = x; });
  const all = ROSTER.rows.filter(r => r.c === c);
  const yes = all.filter(r => here[r.id]), no = all.filter(r => !here[r.id]);
  el.innerHTML = `<p class="muted" style="margin-top:8px"><b style="color:var(--ok)">${yes.length}</b> נסרקו · <b style="color:var(--bad)">${no.length}</b> לא נסרקו בטלפון הזה</p>
    <div class="list">${no.map(r => `<div class="r"><span class="miss">${esc(r.n)}</span><span class="grey">${r.a ? 'לא סומן בבוקר' : ''}</span></div>`).join('')}
    ${yes.map(r => `<div class="r"><span>✅ ${esc(r.n)}</span><span class="grey">${hhmm(here[r.id].at)}</span></div>`).join('')}</div>
    <p class="muted" style="font-size:12px">רק סריקות מהטלפון הזה. תלמיד שנסרק בטלפון אחר יופיע כאן כ"לא נסרק" — התמונה המלאה במסך המנהלת.</p>`;
}

function renderHits(q){
  q = q.trim(); const el = $('hits');
  if(q.length < 2){ el.innerHTML = ''; return; }
  const hits = ROSTER.rows.filter(s => s.n.includes(q)).slice(0, 12);
  el.innerHTML = hits.map(s => `<div class="hit" data-id="${esc(s.id)}"><span>${esc(s.n)}</span><span class="grey">${esc(s.c)}</span></div>`).join('')
    || '<p class="muted">לא נמצא</p>';
  el.querySelectorAll('[data-id]').forEach(h => h.onclick = () => { addScan(byId[h.dataset.id], 'manual'); $('q').value = ''; el.innerHTML = ''; });
}

function showResult(cls, html){
  const r = $('res'); r.className = 'result ' + cls; r.innerHTML = html; r.style.display = 'block';
  clearTimeout(showResult.t); showResult.t = setTimeout(() => r.style.display = 'none', 4000);
}

function onShelterScan(text){
  const tok = tokenFromText(text);
  const st = tok && byTok[tok];
  if(!st){ beep(false); showResult('bad', `<div class="big">לא מזוהה</div><div>כרטיס לא ברשימה. חפשו את התלמיד לפי שם.</div>`); return; }
  addScan(st, 'scan');
}

function addScan(st, src){
  const dup = current().find(s => s.sid === st.id);
  if(dup){ beep(false); showResult('dup', `<div class="big">${esc(st.n)}</div><div>${esc(st.c)} · כבר נסרק ב-${hhmm(dup.at)}</div>`); return; }
  SCANS.push({id: uid(), sid: st.id, shelter: shelter(), at: new Date().toISOString(), session: session(), src, synced: false});
  saveScans(); beep(true);
  /* v1.2.0 — רעידת אדמה: תלמיד בנקודה של החטיבה השנייה נרשם, עם התראה */
  const right = evType() === 'quake' ? QUAKE_POINTS[levelOf(st.c)] : null;
  if(right && right !== shelter())
    showResult('warn', `<div style="font-size:26px">✅ נרשם</div><div class="big">${esc(st.n)}</div><div>${esc(st.c)}</div>
      <div style="margin-top:6px;font-weight:700">⚠️ נקודת הכינוס של החטיבה שלו/ה: ${esc(right)}</div>`);
  else showResult('ok', `<div style="font-size:26px">✅</div><div class="big">${esc(st.n)}</div><div>${esc(st.c)}</div>`);

  renderList(); renderSub(); sync();
}

// --- סנכרון התור לשרת ---
let syncing = false;
async function sync(){
  if(syncing) return;
  const p = pending(); const pin = ls.get('sh_pin');
  if(!pin){ return; }
  syncing = true;
  try{
    if(p.length){
      const rows = p.slice(0, 300).map(s => ({id:s.id, student_id:s.sid, shelter:s.shelter, scanned_at:s.at,
        session_started:s.session, device:deviceId(), source:s.src}));
      const res = await rpc('shelter_sync', {p_pin: pin, p_rows: rows});
      if(res === -1) throw new Error('pin');
      const done = new Set(rows.map(r => r.id));
      SCANS.forEach(s => { if(done.has(s.id)) s.synced = true; });
      // לא שומרים לנצח: סריקות שנשלחו ובנות יותר מ-3 ימים נמחקות מהטלפון
      const old = Date.now() - 3*864e5;
      SCANS = SCANS.filter(s => !s.synced || new Date(s.at).getTime() > old);
      saveScans();
    } else {
      await rpc('check_shelter_pin', {p_pin: pin}, 5000);
    }
    setOnline(true);
    if($('list')) renderList();
  }catch(e){ setOnline(false); }
  finally{ syncing = false; }
}

// --- QR סיכום / SMS ---
function summaryLines(){
  const codes = current().map(s => byId[s.sid]).filter(Boolean).map(codeOf);
  const n = Math.max(1, Math.ceil(codes.length / CHUNK));
  const stamp = Math.floor(Date.now() / 60000);
  const lines = [];
  for(let i = 0; i < n; i++){
    lines.push(`GMSH1|${encodeURIComponent(shelter())}|${stamp}|${i+1}/${n}|${codes.slice(i*CHUNK, (i+1)*CHUNK).join(',')}`);
  }
  return lines;
}
function closeQR(){ const f = $('qrFull'); if(f){ f.classList.remove('on'); f.innerHTML = ''; } }
function showSummaryQR(){
  if(typeof QRCode === 'undefined'){ alert('רכיב ה-QR לא נטען. פתחו את הדף פעם אחת עם אינטרנט.'); return; }
  stopScanner();
  const lines = summaryLines(); let i = 0;
  const f = $('qrFull');
  const size = Math.min(window.innerWidth - 48, 380);
  const draw = () => {
    f.innerHTML = `<h2>🔳 ${esc(shelter())}</h2>
      <p class="muted" style="margin:4px 0 0">${current().length} תלמידים · ${hhmm(new Date())}</p>
      <p class="muted" style="margin:6px 0 0">המנהלת סורקת ב"מסך מנהלת" ← "סריקת QR סיכום"</p>
      ${lines.length > 1 ? `<p style="font-size:18px;font-weight:800;margin:8px 0 0">חלק ${i+1} מתוך ${lines.length} — סרקו את כל החלקים</p>` : ''}
      <div class="qrwrap"><div id="sumQr"></div></div>
      ${lines.length > 1 ? `<button class="btn" id="nextQr">${i < lines.length-1 ? 'החלק הבא ←' : 'חזרה לחלק 1'}</button>` : ''}
      <button class="btn sec" id="closeQr">סגירה</button>`;
    new QRCode($('sumQr'), {text: lines[i], width: size, height: size, correctLevel: QRCode.CorrectLevel.L});
    if($('nextQr')) $('nextQr').onclick = () => { i = (i + 1) % lines.length; draw(); };
    $('closeQr').onclick = closeQR;
  };
  f.classList.add('on'); draw();
}
function sendSMS(){
  let num = ls.get('sh_sms');
  if(!num){ num = (prompt('מספר הטלפון של המנהלת / רכז החירום (נשמר לפעם הבאה):') || '').trim(); if(!num) return; ls.set('sh_sms', num); }
  const head = `${shelter()} · ${current().length} תלמידים · ${hhmm(new Date())}`;
  const body = head + '\n' + summaryLines().join('\n');
  const sep = /iPhone|iPad|iPod/.test(navigator.userAgent) ? '&' : '?';
  location.href = `sms:${num}${sep}body=${encodeURIComponent(body)}`;
}

async function loadServer(force = false){

/* v1.6.0 — מה התקבל מכל מקום: מספר תלמידים, מתי, ודרך מה */
function placeInfo(){
  const pl = mgPlaces(), t0 = since(), info = {};
  const ok = sh => !pl || pl.includes(sh);
  const add = (sh, sid, at, via) => { const x = info[sh] ||= {ids: new Set(), last: '', vias: new Set()};
    if(sid) x.ids.add(sid); if(at > x.last) x.last = at; x.vias.add(via); };
  SERVER.forEach(r => { if(r.scanned_at >= t0 && ok(r.shelter)) add(r.shelter, r.student_id, r.scanned_at, 'אינטרנט'); });
  Object.values(MERGED).forEach(m => { if(m.at >= t0 && ok(m.shelter)){
    add(m.shelter, null, m.at, m.via);
    m.codes.forEach(c => { const s = fromCode(c); if(s) info[m.shelter].ids.add(s.id); }); } });
  return info;
}
function placesPanel(){
  const info = placeInfo();
  const list = [...new Set([...(mgPlaces() || EVENTS.other.places), ...Object.keys(info)])];
  const got = list.filter(p => info[p]).length;
  return `<div class="box">
    <h2>📍 מצב המקומות · התקבלו ${got} מתוך ${list.length}</h2>
    ${list.map(p => info[p]
      ? `<div class="prow got"><span>✅ ${esc(p)}</span><span class="sub">${info[p].ids.size} תלמידים · ${hhmm(info[p].last)} · ${esc([...info[p].vias].join(' + '))}</span></div>`
      : `<div class="prow wait"><span>⏳ ${esc(p)}</span><span class="sub">עדיין לא התקבל</span></div>`).join('')}
    <button class="btn" id="camBtn" style="background:#2f4f8f">📷 סריקת QR ממקלט / נקודת כינוס</button>
    <p class="muted" style="margin:6px 2px 0">בלי אינטרנט: ניגשים לאחראי, והוא מציג את ה-QR של המקום.</p>
    <div id="reader"></div>
    <div class="result" id="res"></div>
  </div>`;
}

function locations(){
  // מיקום אחרון של כל תלמיד: שרת + סיכומים שנסרקו/הודבקו
  const loc = {};
  const pl = mgPlaces();
  const put = (sid, sh, at, via) => { if(pl && !pl.includes(sh)) return;   // v1.5.0 — רק מקומות של סוג האירוע
    if(!loc[sid] || loc[sid].at < at) loc[sid] = {shelter: sh, at, via}; };
  const t0 = since();
  SERVER.forEach(r => { if(r.scanned_at >= t0) put(r.student_id, r.shelter, r.scanned_at, 'שרת'); });
  Object.values(MERGED).forEach(m => { if(m.at >= t0) m.codes.forEach(c => { const s = fromCode(c); if(s) put(s.id, m.shelter, m.at, m.via); }); });
  return loc;
}

function renderManage(){
  stopScanner();
  const loc = locations();
  const rows = ROSTER.rows;
  const inPlace = rows.filter(s => loc[s.id]);
  const missing = rows.filter(s => !loc[s.id] && !awayLabel(s));
  const away = rows.filter(s => !loc[s.id] && awayLabel(s));
  const byPlace = {};
  inPlace.forEach(s => (byPlace[loc[s.id].shelter] ||= []).push(s));
  const classes = [...new Set(rows.map(s => s.c))].sort((a,b) => a.localeCompare(b, 'he', {numeric:true}));
  const stOf = s => loc[s.id] ? 'yes' : awayLabel(s) ? 'away' : 'no';
  const row = s => {
    const k = stOf(s);
    const sub = k === 'yes' ? `${esc(loc[s.id].shelter)} · ${hhmm(loc[s.id].at)}` : k === 'away' ? esc(awayLabel(s)) : 'חסר/ה';
    return `<div class="mrow ${k}"><span>${k === 'yes' ? '✅ ' : k === 'away' ? '🟡 ' : '❗ '}${esc(s.n)} <span class="grey">· ${esc(s.c)}</span></span><span class="sub">${sub}</span></div>`;
  };

  let body = '';
  if(MG_VIEW === 'student'){
    const list = missing.slice().sort((a,b) => a.c.localeCompare(b.c, 'he', {numeric:true}) || a.n.localeCompare(b.n, 'he'));
    body = `<input id="mgq" placeholder="חיפוש תלמיד (כל התלמידים)…" style="margin-top:0">
      <div id="mgHits"></div>
      <h2 style="margin-top:12px">❗ חסרים (${list.length})</h2>
      ${list.length ? list.map(row).join('') : '<p class="muted">אין חסרים 🎉</p>'}
      ${away.length ? `<details style="margin-top:10px"><summary><span>🟡 לא הגיעו / יצאו</span><span>${away.length}</span></summary>${away.map(row).join('')}</details>` : ''}`;
  } else if(MG_VIEW === 'class'){
    const cl = classes.map(c => {
      const all = rows.filter(s => s.c === c);
      return {c, all, miss: all.filter(s => stOf(s) === 'no').length, yes: all.filter(s => stOf(s) === 'yes').length, aw: all.filter(s => stOf(s) === 'away').length};
    }).sort((a,b) => b.miss - a.miss || a.c.localeCompare(b.c, 'he', {numeric:true}));
    body = cl.map(x => `<details${x.miss ? '' : ''}><summary><span>${esc(x.c)}</span><span>${x.miss ? `<span class="miss">${x.miss} חסרים</span>` : '<span style="color:var(--ok)">✓ כולם</span>'} <span class="tag">· כאן ${x.yes}/${x.all.length}${x.aw ? ` · 🟡 ${x.aw}` : ''}</span></span></summary>
        ${x.all.slice().sort((a,b) => ({no:0,away:2,yes:1}[stOf(a)] - {no:0,away:2,yes:1}[stOf(b)]) || a.n.localeCompare(b.n, 'he')).map(row).join('')}</details>`).join('');
  } else {
    body = Object.keys(byPlace).length ? Object.entries(byPlace).sort((a,b) => b[1].length - a[1].length).map(([sh, list]) => {
      const last = list.map(s => loc[s.id].at).sort().pop();
      const vias = [...new Set(list.map(s => loc[s.id].via))].join(', ');
      return `<details><summary><span>${esc(sh)}</span><span>${list.length} <span class="tag">· ${hhmm(last)} · ${esc(vias)}</span></span></summary>
        ${list.sort((a,b) => a.c.localeCompare(b.c, 'he', {numeric:true}) || a.n.localeCompare(b.n, 'he')).map(row).join('')}</details>`;
    }).join('') : '<p class="muted">עדיין אין נתונים מהשטח</p>';
  }

  app.innerHTML = `
    <div class="stat" id="stat">
      <div><b style="color:var(--ok)">${inPlace.length}</b>נמצאו</div>
      <div><b style="color:var(--bad)">${missing.length}</b>חסרים</div>
      <div><b style="color:#b07d00">${away.length}</b>לא הגיעו / יצאו</div>
    </div>
    ${placesPanel()}
    <p class="muted" style="margin:8px 2px">מ-${dayTime(since())}${mgPlaces() ? ' · ' + esc(mgPlaces().join(' / ')) : ''}. "חסרים" = היו בבית הספר הבוקר ולא נמצאו באף מקום.</p>
    <div class="mtabs">
      <button data-v="student" class="${MG_VIEW === 'student' ? 'on' : ''}">👤 לפי תלמיד</button>
      <button data-v="class" class="${MG_VIEW === 'class' ? 'on' : ''}">🏫 לפי כיתה</button>
      <button data-v="place" class="${MG_VIEW === 'place' ? 'on' : ''}">📍 לפי מקום</button>
    </div>
    <div class="box" style="margin-top:8px">${body}</div>
    <details class="more"><summary>הדבקת SMS ופעולות נוספות…</summary>
      <button class="btn sec small" id="paste">✉️ הדבקת SMS ממקלט</button>
      <div id="pasteArea"></div>
      <div class="row2">
        <button class="btn sec small" id="newEv">אירוע חדש</button>
        <button class="btn sec small" id="upd">עדכון רשימת תלמידים</button>
      </div>
    </details>
    <div class="row2">
      <button class="btn sec small" id="ref">🔄 רענון</button>
      <button class="btn sec small" id="mgHome">← דף ראשי</button>
    </div>`;

  app.querySelectorAll('.mtabs [data-v]').forEach(b => b.onclick = () => { MG_VIEW = b.dataset.v; ls.set('mg_view', MG_VIEW); renderManage(); });
  if($('mgq')) $('mgq').oninput = e => {
    const q = e.target.value.trim();
    $('mgHits').innerHTML = q.length < 2 ? '' : (rows.filter(s => s.n.includes(q)).slice(0, 15).map(row).join('') || '<p class="muted">לא נמצא</p>');
  };
  window._camStart = () => startScanner(onSummaryScan);
  $('camBtn').onclick = window._camStart;
  $('paste').onclick = () => {
    $('pasteArea').innerHTML = `<div class="box"><p class="muted">העתיקו את כל הודעת ה-SMS מהשטח והדביקו כאן. אפשר כמה הודעות יחד.</p>
      <textarea id="pt"></textarea><button class="btn small" id="ptGo">איחוד</button></div>`;
    $('ptGo').onclick = () => { const n = mergeText($('pt').value, 'SMS'); alert(n ? `אוחדו ${n} חלקים` : 'לא נמצא קוד בהודעה'); if(n) renderManage(); };
  };
  $('ref').onclick = () => loadServer(true);
  $('mgHome').onclick = () => location.href = location.pathname;
  $('newEv').onclick = () => {
    if(!confirm('להתחיל מעקב אירוע חדש מעכשיו? סריקות קודמות לא ייספרו.')) return;
    ls.set('mg_since', new Date(Date.now() - 5*60000).toISOString()); MERGED = {}; ls.set('mg_merged', MERGED); loadServer(true);
  };
  $('upd').onclick = async () => {
    try{ await refreshRoster(mgPass()); setOnline(true); loadServer(true); }
    catch(e){ setOnline(false); alert('אין חיבור. הרשימה הקודמת נשארת.'); }
  };
  renderSub();
}

function mergeText(text, via){
  const found = String(text).match(/GMSH1\|[^\s|]+\|\d+\|\d+\/\d+\|[^\s]*/g) || [];
  found.forEach(line => {
    const [, shEnc, stamp, part, codes] = line.split('|');
    let sh; try{ sh = decodeURIComponent(shEnc); }catch(e){ sh = shEnc; }
    MERGED[`${sh}|${stamp}|${part}`] = {shelter: sh, at: new Date(Number(stamp) * 60000).toISOString(), via,
      codes: codes ? codes.split(',').filter(Boolean) : []};
  });
  if(found.length) ls.set('mg_merged', MERGED);
  return found.length;
}

function onSummaryScan(text){
  if(!text.startsWith('GMSH1|')){ beep(false); showResult('bad', '<div class="big">זה לא QR סיכום</div><div>בטלפון המקלט: "QR סיכום"</div>'); return; }
  mergeText(text, 'QR'); beep(true);
  const [, shEnc, , part, codes] = text.split('|');
  let sh; try{ sh = decodeURIComponent(shEnc); }catch(e){ sh = shEnc; }
  const n = codes ? codes.split(',').filter(Boolean).length : 0;
  stopScanner().then(() => { renderManage();
    showResult('ok', `<div class="big">${esc(sh)}</div><div>חלק ${esc(part)} · ${n} תלמידים אוחדו</div>`); });
}

// ===== הפעלה =====
/* v1.3.0 — פתיחה: תמיד הדף הראשי "בחרו סוג אירוע", או ישר לסוג מ-?event= */
if(MANAGE) manageRoute();
else if(!ls.get('sh_pin') || !ROSTER) shelterRoute();
else{
