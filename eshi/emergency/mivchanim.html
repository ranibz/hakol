<!-- eshi/emergency/mivchanim.html · v1.3.0 · 2026-09-04 · בית חינוך גליל מערבי

     v1.3.0 · בקשות מורים ופרסום. עד כה הרכז אסף בקשות בוואטסאפ
     והקליד אותן בעצמו. עכשיו הן נוחתות ישר על הלוח.

     ⬛ בקשה היא שורה ב-exam_board עם status='draft', ולא טבלה נפרדת.
     לכן אישור הוא שינוי סטטוס ולא העתקה בין טבלאות, והעברה
     לתאריך אחר עובדת על בקשה בדיוק כמו על מבחן — המנוע לא נגע.

     ⚠ טיוטה אינה נספרת בעומס השבועי ואינה מוסיפה גלישות.
     היא מוצגת ואינה חוסמת: אחרת הרכז היה רואה אזהרות על מבחנים
     שטרם החליט עליהם, ובקשות היו חוסמות זו את זו.

     ⬛ בקשת חלון — exam_date ריק ו-window_start/end מלאים. היא אינה
     יושבת על תא בלוח — שבעה מלבנים צהובים לאותה בקשה היו רעש —
     אלא ברשימה מתחת ללוח, עם כפתור שפותח את מנוע המשבצות בטווח.

     ⚠ exam_date אינו NOT NULL עוד. כל מקום שקורא אותו מסנן עכשיו
     שורות בלי תאריך.

     ⬛ פרסום — exam_publish, לפי שנה ושכבה. mivchanim-luach.html חסום עד

     © רני בן זאב. יוזמה עצמאית, מימון עצמי.

     v1.2.0 · נוספה העברת מבחן לתאריך אחר, לצד המחיקה. אותו מנוע
     משבצות בדיוק, ובסוף עדכון במקום יצירה — כך שהמבחן שומר על
     זהותו ואינו נמחק ונוצר מחדש.

     ⚠ מבחן בהעברה אינו נספר נגד עצמו: לא בעומס השבועי, לא באזהרת
     "יש מבחן באותו יום" ולא בגלישות. אחרת הוא היה מסמן באדום את
     המשבצת שהוא עצמו יושב בה, ומונע מעצמו לזוז (MINOR).

     v1.1.0 · לחיצה על יום בלוח פותחת מבחן חדש באותו תאריך, והחיפוש

     · תוקן: הכלל הגורף select{width:100%} מתח את בורר השכבה
       בכותרת לכל רוחב הסרגל (MINOR).

     לוח מבחנים לרכז שכבה. הרכז אינו מחפש בלוח ואינו זוכר בעל פה

     ⚠ הרעיון שעליו הכל עומד: ההקבצות כבר מסונכרנות במערכת. כשכל
     כיתות השכבה יושבות במתמטיקה באותה שעה, זו משבצת המבחן —
     היא כבר קיימת ואין צורך לבנות אותה. הכלי רק מוצא אותה.

     גלישה ומה שנזכר ממנה
     --------------------

     כללי העומס
     ----------
     מקסימום שני מבחנים בשבוע לכיתה. חריגה היא אזהרה ולא חסימה —
     רכז שכבה חורג לפעמים ביודעין, וכלי שחוסם אותו הופך לכלי

     ⚠ הגאנט: חופשה חוסמת. אירוע חט״ן חל על ז–ט ואירוע חט״ע על

<style>

@media(max-width:700px){.cal{gap:3px}.cell{min-height:64px;padding:4px 5px}.topin h1{font-size:1.05rem}}

<script>
/* ============================================================
   חיבור — skfriefqnoxfzmamcokd, אותו מסד של gantt_events
   ============================================================ */
const SURL='https://skfriefqnoxfzmamcokd.supabase.co';
const SKEY='sb_publishable_Qx7EDPbdyYE9iv7uMQBKhQ_Aeojd_Q0';
async function api(path,opts={}){
  const r=await fetch(SURL+'/rest/v1/'+path,{...opts,
    headers:{apikey:SKEY,Authorization:'Bearer '+SKEY,
             'Content-Type':'application/json',Prefer:opts.prefer||''}});
  if(!r.ok) throw new Error((await r.text()).slice(0,200));
  const t=await r.text(); return t?JSON.parse(t):null;
}
const el=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const GRADES=['ז','ח','ט','י','יא','יב'];
const JUNIOR=['ז','ח','ט'];
const DAYS=['','ראשון','שני','שלישי','רביעי','חמישי','שישי'];
const WD=['ראשון','שני','שלישי','רביעי','חמישי','שישי'];
const MAX_WEEK=2;            /* מקסימום מבחנים בשבוע לכיתה */

/* ---- תאריכים ---- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromIso=s=>{ const [y,m,d]=String(s).split('-').map(Number); return new Date(y,m-1,d); };
const addD=(d,n)=>{ const x=new Date(d); x.setDate(x.getDate()+n); return x; };
/* שבת אינה יום לימודים ואינה מקבלת אינדקס */
const dayIdx=d=>d.getDay()===6?0:d.getDay()+1;
/* השבוע מתחיל בראשון — זו יחידת "שני מבחנים בשבוע" */
const weekKey=d=>iso(addD(d,-(d.getDay()===6?6:d.getDay())));
function planYear(){ const d=new Date(); return d.getMonth()>=7?d.getFullYear():d.getFullYear()-1; }
function yearLabel(y){ return 'תשפ״'+['ו','ז','ח','ט','י'][y-2025]+' · '+y+'/'+(y+1); }
const hebDay=d=>{ try{ return new Intl.DateTimeFormat('he-u-ca-hebrew',
  {day:'numeric',month:'short'}).format(d); }catch(e){ return ''; } };

let YEAR=planYear(), GRADE='י', VIEW=false, MONTH=null,
    TT=[], SUBJ={}, BOARD=[], GANTT=[], CLASSES=[], NOEXAM_COL=false,
    CAND=[], PICK=null, FORM={}, MOVE=null,   /* MOVE — המבחן שנמצא בהעברה */
    PUB=null;                                 /* שורת exam_publish לשנה+שכבה */

/* ============================================================
   טעינה
   ============================================================ */
async function loadAll(){
  TT=await api('exam_timetable?select=class_name,day,hour,subject_raw'+
    '&year_start=eq.'+YEAR+'&grade=eq.'+encodeURIComponent(GRADE))||[];
  CLASSES=[...new Set(TT.map(r=>r.class_name))].sort((a,b)=>{
    const n=s=>parseInt(String(s).replace(/\D+/g,''),10)||0;
    return n(a)-n(b)||String(a).localeCompare(b,'he');
  });

  SUBJ={};
  ((await api('exam_subjects?select=*'))||[]).forEach(s=>{ SUBJ[s.subject_raw]=s; });

  BOARD=await api('exam_board?select=*&year_start=eq.'+YEAR+
    '&grade=eq.'+encodeURIComponent(GRADE)+'&order=exam_date')||[];

  /* מצב הפרסום. אין שורה = טרם פורסם. */
  try{
    const pr=await api('exam_publish?select=*&year_start=eq.'+YEAR+
      '&grade=eq.'+encodeURIComponent(GRADE)+'&limit=1');
    PUB=(pr&&pr.length)?pr[0]:null;
  }catch(e){ PUB=null; }

  /* no_exams אינה קיימת בכל מסד. במקום להניח — מנסים, ואם היא
     חסרה חוזרים לשליפה הרגילה. כך הכלי עובד לפני התוספת ואחריה. */
  try{
    GANTT=await api('gantt_events?select=track,title,start_date,end_date,no_exams'+
      '&year_start=eq.'+YEAR)||[];
    NOEXAM_COL=true;
  }catch(e){
    GANTT=await api('gantt_events?select=track,title,start_date,end_date'+
      '&year_start=eq.'+YEAR)||[];
    NOEXAM_COL=false;
  }
}

/* הבחנות הבסיסיות בלוח. ראה הערת הגרסה v1.3.0. */
const isDraft  = e => e.status === 'draft';
const isWindow = e => !e.exam_date;                    /* בקשת חלון */
/* מה שנספר כמבחן לכל דבר: מאושר ועם תאריך. */
const REAL = () => BOARD.filter(e => !isDraft(e) && !isWindow(e));

/* מפת המערכת: יום → שעה → כיתה → מקצועות */
function slotAt(day,hour,cls){
  return TT.filter(r=>r.day===day&&r.hour===hour&&r.class_name===cls).map(r=>r.subject_raw);
}
const norm=raw=>SUBJ[raw]||{subject_base:raw,level:null,examable:true};

/* המקצועות הנבחנים שקיימים בפועל בשכבה הזאת */
function subjectList(){
  const m={};
  TT.forEach(r=>{
    const s=norm(r.subject_raw);
    if(s.examable===false) return;
    if(!m[s.subject_base]) m[s.subject_base]={base:s.subject_base,levels:{},n:0};
    m[s.subject_base].n++;
    if(s.level) m[s.subject_base].levels[s.level]=1;
  });
  return Object.values(m).sort((a,b)=>b.n-a.n||a.base.localeCompare(b.base,'he'));
}

/* ---- הגאנט ליום נתון ---- */
function eventsOn(dt){
  const s=iso(dt);
  return GANTT.filter(e=>e.start_date<=s && s<=e.end_date)
    .filter(e=>{
      if(e.track==='vacation'||e.track==='holidays') return true;
      if(e.track==='junior') return JUNIOR.indexOf(GRADE)>-1;
      if(e.track==='senior') return JUNIOR.indexOf(GRADE)<0;
      return false;
    });
}
const isVacation=dt=>eventsOn(dt).some(e=>e.track==='vacation');
const isBlocked=dt=>eventsOn(dt).some(e=>e.track==='vacation'||e.no_exams===true);

/* ============================================================
   חישוב המועמדות — הלב
   ------------------------------------------------------------
   לכל יום בטווח ולכל שעה: כמה מכיתות ההיקף יושבות במקצוע.
   כיסוי מלא הוא המשבצת הטובה; כיסוי חלקי אפשרי; אפס כיסוי
   פירושו גלישה, והיא מותרת ונרשמת.
   ============================================================ */
function scopeClasses(){
  return FORM.scope==='class' ? [FORM.cls] : CLASSES;
}
function matches(raw,base,level){
  const s=norm(raw);
  if(s.subject_base!==base) return false;
  if(level && String(s.level||'')!==String(level)) return false;
  return true;
}
/* מקצועות שכבר נגזלו השנה — בסיס לדירוג ולסימון.
   מבחן שנמצא בהעברה אינו נספר נגד עצמו: הגלישה שלו תיעלם
   ברגע שיזוז, ואחרת הוא היה מסמן באדום את המשבצת שהוא כבר יושב בה. */
function displacedSoFar(){
  const m={};
  REAL().filter(e=>!MOVE||String(e.id)!==String(MOVE.id))
    .forEach(e=>String(e.displaced||'').split(',').map(x=>x.trim())
    .filter(Boolean).forEach(x=>{ m[x]=(m[x]||0)+1; }));
  return m;
}
/* כמה מבחנים כבר יש לכיתה באותו שבוע */
function weekLoad(dt,cls){
  const wk=weekKey(dt);
  return REAL().filter(e=>!MOVE||String(e.id)!==String(MOVE.id))
    .filter(e=>weekKey(fromIso(e.exam_date))===wk)
    .filter(e=>e.scope==='grade'||e.class_name===cls).length;
}

function buildCandidates(){
  const {base,level,from,to}=FORM;
  const cls=scopeClasses(), prev=displacedSoFar(), out=[];
  let d=fromIso(from), end=fromIso(to);
  while(d<=end){
    const di=dayIdx(d);
    if(di && !isBlocked(d)){
      const evs=eventsOn(d).filter(e=>e.track!=='holidays');
      for(let h=1;h<=10;h++){
        const has=[], miss=[], disp={};
        cls.forEach(c=>{
          const raws=slotAt(di,h,c);
          if(!raws.length) return;                  /* אין שיעור — לא נוגעים */
          if(raws.some(r=>matches(r,base,level))) has.push(c);
          else{
            miss.push(c);
            raws.forEach(r=>{ const s=norm(r); if(s.examable!==false) disp[s.subject_base]=1; });
          }
        });
        if(!has.length && !miss.length) continue;   /* שעה ריקה לגמרי */
        const dl=Object.keys(disp);
        const repeat=dl.filter(x=>prev[x]);
        const load=Math.max.apply(null,cls.map(c=>weekLoad(d,c)));
        const sameDay=BOARD.some(e=>e.exam_date===iso(d) &&
          (!MOVE||String(e.id)!==String(MOVE.id)));
        out.push({date:iso(d),day:di,hour:h,has:has.length,miss:miss.length,
                  total:has.length+miss.length,disp:dl,repeat:repeat,
                  load:load,sameDay:sameDay,evs:evs.map(e=>e.title)});
      }
    }
    d=addD(d,1);
  }
  /* דירוג: כיסוי מלא קודם, אחריו מעט גלישות, ובתוך שווים —
     מוקדם יותר. גלישה חוזרת על אותו מקצוע נדחקת לסוף. */
  out.sort((a,b)=>
    (b.has/b.total)-(a.has/a.total) ||
    a.repeat.length-b.repeat.length ||
    a.disp.length-b.disp.length ||
    (a.load>=MAX_WEEK?1:0)-(b.load>=MAX_WEEK?1:0) ||
    a.date.localeCompare(b.date) || a.hour-b.hour);
  CAND=out.slice(0,40);
}

/* ============================================================

   ============================================================ */
function monthGrid(){
  const first=new Date(MONTH.y,MONTH.m,1);
  const start=addD(first,-(first.getDay()===6?6:first.getDay()));
  const cells=[];
  for(let i=0;i<42;i++){
    const d=addD(start,i);
    if(d.getDay()===6) continue;                    /* שבת אינה בלוח */
    cells.push(d);
    if(cells.length>=36) break;
  }
  return cells;
}
function monthLabel(){
  return new Intl.DateTimeFormat('he',{month:'long',year:'numeric'})
    .format(new Date(MONTH.y,MONTH.m,1));
}
function shiftMonth(n){
  const d=new Date(MONTH.y,MONTH.m+n,1);
  MONTH={y:d.getFullYear(),m:d.getMonth()}; render();
}

    '<button class="btn g sm" onclick="shiftMonth(1)">הבא ←</button>'+
    '<span class="hint" style="margin:0 0 0 auto">שכבה '+esc(GRADE)+' · '+
      CLASSES.length+' כיתות · '+REAL().length+' מבחנים'+
      (BOARD.filter(isDraft).length
        ? ' · '+BOARD.filter(isDraft).length+' בקשות ממתינות':'')+'</span>'+
    (VIEW?'':'<button class="btn '+(PUB&&PUB.published?'g':'')+' sm" '+
      'onclick="togglePublish()">'+
      (PUB&&PUB.published?'✓ מפורסם':'פרסום הלוח')+'</button>')+
    '</div><div class="cal">'+
    WD.map(w=>'<div class="wd">'+w+'</div>').join('')+
    cells.map(d=>{
      const s=iso(d), out=d.getMonth()!==MONTH.m;
      const evs=eventsOn(d), vac=isVacation(d);
      const pick=!VIEW && !isBlocked(d);
      return '<div class="cell'+(out?' out':'')+(vac?' vac':'')+(pick?' pick':'')+'"'+
        (pick?' onclick="openNew(\''+s+'\')" title="מבחן חדש ב-'+s+'"':'')+'>'+
        '<div class="dn">'+d.getDate()+' <span class="heb">'+esc(hebDay(d))+'</span></div>'+
        evs.slice(0,2).map(e=>'<span class="ev'+(e.track==='vacation'?' v':'')+'">'+
          esc(e.title)+'</span>').join('')+
        (byDate[s]||[]).map(e=>'<span class="ex'+
          (isDraft(e)?' draft':(e.scope==='class'?' cls':''))+'" '+
          'onclick="event.stopPropagation();openExam('+e.id+')">'+esc(e.subject_base)+
          (e.level?' '+esc(e.level):'')+(e.hour?' · ש׳'+e.hour:'')+
          (e.scope==='class'?' · '+esc(e.class_name):'')+'</span>').join('')+
        '</div>';
    }).join('')+'</div></div>';

  /* בקשות חלון — אין להן תא בלוח, ולכן רשימה מתחתיו. */
  const wins=BOARD.filter(e=>isWindow(e)&&isDraft(e));
  if(wins.length) html+='<div class="card"><h3 style="font-size:1.05rem">'+
    'בקשות בטווח תאריכים ('+wins.length+')</h3>'+
    '<p class="hint">מורים שביקשו חלון ולא תאריך. בחירת משבצת משלימה '+
    'את הבקשה והופכת אותה למבחן.</p>'+
    '<table><thead><tr><th>מקצוע</th><th>היקף</th><th>טווח</th>'+
    '<th>מבקש</th><th style="width:160px"></th></tr></thead><tbody>'+
    wins.map(e=>'<tr><td>'+esc(e.subject_base)+(e.level?' '+esc(e.level):'')+'</td>'+
      '<td>'+(e.scope==='grade'?'כל השכבה':esc(e.class_name||''))+'</td>'+
      '<td>'+esc(dmy(e.window_start))+' – '+esc(dmy(e.window_end))+'</td>'+
      '<td>'+esc(e.requested_by||'—')+'</td>'+
      '<td><button class="btn sm" onclick="placeWindow('+e.id+')">שיבוץ</button> '+
      '<button class="btn no sm" onclick="rejectExam('+e.id+')">דחייה</button></td></tr>').join('')+
    '</tbody></table></div>';

  /* גלישות — מה כבר נלקח השנה */
  const dsp=displacedSoFar(), keys=Object.keys(dsp).sort((a,b)=>dsp[b]-dsp[a]);
  if(keys.length) html+='<div class="card"><h3 style="font-size:1.05rem">גלישות השנה</h3>'+
    '<p class="hint">מקצועות שמבחן כבר ישב על שעתם. הכלי ידחוק משבצת '+
    'שתגזול אותם שוב.</p>'+
    '<table><thead><tr><th>מקצוע</th><th style="width:90px">פעמים</th></tr></thead><tbody>'+
    keys.map(k=>'<tr><td>'+esc(k)+'</td><td>'+dsp[k]+'</td></tr>').join('')+
    '</tbody></table></div>';
  return html;
}

/* יום נבחר מן הלוח: הטווח מצטמצם אליו והחיפוש רץ מיד — הרכז
   שלחץ על תאריך כבר אמר מה הוא רוצה, ואין טעם לבקש ממנו טווח. */
function openNew(date){
  if(VIEW) return;
  const subs=subjectList();
  if(!subs.length) return alert('אין מקצועות נבחנים בשכבה זו. '+
    'ודאו שהמערכת יובאה ושהמקצועות נורמלו במסך הייבוא.');
  const t=new Date(), plus=addD(t,21);
  MOVE=null;
  FORM={base:subs[0].base, level:'', scope:'grade', cls:CLASSES[0],
        from:date||iso(t), to:date||iso(plus), oneDay:!!date};
  CAND=[]; PICK=null;
  if(date) buildCandidates();
  drawModal(subs);
}

/* ============================================================
   העברת מבחן קיים
   ------------------------------------------------------------
   אותו מנוע בדיוק, ובסוף PATCH במקום POST. הגלישה מחושבת מחדש
   לפי המשבצת החדשה, אחרת "גלישות השנה" היה ממשיך לספור מקצוע
   שכבר אינו נגזל.
   ============================================================ */
function startMove(id){
  const e=BOARD.find(x=>String(x.id)===String(id));
  if(!e||VIEW) return;
  MOVE=e;
  const t=new Date(), plus=addD(t,28);
  FORM={base:e.subject_base, level:e.level||'', scope:e.scope,
        cls:e.class_name||CLASSES[0], from:iso(t), to:iso(plus), oneDay:false};
  CAND=[]; PICK=null;
  drawModal();
}
function drawModal(subs){
  subs=subs||subjectList();
  if(FORM.oneDay && !CAND.length) buildCandidates();
  const lv=(subs.find(s=>s.base===FORM.base)||{levels:{}}).levels;

  const body=
    '<h3>'+(MOVE?'העברת מבחן':'מבחן חדש')+' · שכבה '+esc(GRADE)+

    '<div class="row">'+
      '<div><label>מקצוע</label><select onchange="FORM.base=this.value;FORM.level=\'\';CAND=[];drawModal()">'+
        subs.map(s=>'<option'+(s.base===FORM.base?' selected':'')+'>'+esc(s.base)+
          '</option>').join('')+'</select></div>'+
      '<div><label>רמה</label><select onchange="FORM.level=this.value;CAND=[];drawModal()">'+
        '<option value="">כל הרמות</option>'+
        Object.keys(lv).map(l=>'<option'+(l===FORM.level?' selected':'')+'>'+esc(l)+
          '</option>').join('')+'</select></div>'+
      '<div><label>היקף</label><select onchange="FORM.scope=this.value;CAND=[];drawModal()">'+
        '<option value="grade"'+(FORM.scope==='grade'?' selected':'')+'>כל השכבה</option>'+
        '<option value="class"'+(FORM.scope==='class'?' selected':'')+'>כיתה אחת</option>'+
        '</select></div>'+
      (FORM.scope==='class'?'<div><label>כיתה</label>'+
        '<select onchange="FORM.cls=this.value;CAND=[];drawModal()">'+
        CLASSES.map(c=>'<option'+(c===FORM.cls?' selected':'')+'>'+esc(c)+'</option>').join('')+
        '</select></div>':'')+
    '</div>'+
    '<div class="row" style="margin-top:10px">'+
      '<div><label>מתאריך</label><input type="date" value="'+FORM.from+
        '" onchange="FORM.from=this.value;CAND=[];drawModal()"></div>'+
      '<div><label>עד תאריך</label><input type="date" value="'+FORM.to+
        '" onchange="FORM.to=this.value;CAND=[];drawModal()"></div>'+
      '<button class="btn" style="flex:0" onclick="findSlots()">חיפוש משבצות</button>'+
    '</div>'+
    '<div id="cands" style="margin-top:14px">'+candList()+'</div>'+
    '<div class="acts"><button class="btn g" onclick="closeModal()">סגירה</button></div>';
  let m=el('mdl');
  if(!m){
    m=document.createElement('div'); m.className='modal'; m.id='mdl';
    m.innerHTML='<div class="sheet" id="sheet"></div>';
    m.onclick=e=>{ if(e.target===m) closeModal(); };
    document.body.appendChild(m);
  }

function closeModal(){ MOVE=null; const m=el('mdl'); if(m) m.remove(); }

function findSlots(){ buildCandidates(); el('cands').innerHTML=candList(); }

  if(!CAND.length) return '<p class="hint">לחצו "חיפוש משבצות".</p>';
  return '<p class="hint">'+CAND.length+' משבצות, הטובה למעלה. לחיצה בוחרת.</p>'+
    CAND.map((c,i)=>{
      const full=c.miss===0, none=c.has===0;
      const d=fromIso(c.date);

        '<b>יום '+DAYS[c.day]+' '+d.getDate()+'.'+pad(d.getMonth()+1)+' · שעה '+c.hour+'</b>'+
        '<div class="meta">'+(full?'כל '+c.total+' הכיתות במקצוע':
           none?'אף כיתה אינה במקצוע — גלישה מלאה':
           c.has+' מתוך '+c.total+' הכיתות במקצוע')+'</div>'+
        (c.disp.length?'<span class="flag '+(c.repeat.length?'r':'y')+'">גולש על: '+
          esc(c.disp.join(' · '))+(c.repeat.length?' ⟳ כבר נגזל':'')+'</span>':'')+
        (c.load>=MAX_WEEK?'<span class="flag y">'+c.load+' מבחנים כבר בשבוע זה</span>':'')+
        (c.sameDay?'<span class="flag y">יש מבחן באותו יום</span>':'')+
        (c.evs.length?'<span class="flag y">'+esc(c.evs.join(' · '))+'</span>':'')+
        '</div>';
    }).join('');
}

async function saveExam(){
  if(!PICK) return;
  const row={year_start:YEAR, grade:GRADE, scope:FORM.scope,
    class_name:FORM.scope==='class'?FORM.cls:null,
    subject_base:FORM.base, level:FORM.level||null,
    exam_date:PICK.date, hour:PICK.hour,
    hour_end:parseInt(el('fH2').value,10)||PICK.hour,
    title:(el('fTitle').value||'').trim()||FORM.base,
    notes:(el('fNote').value||'').trim()||null,
    displaced:PICK.disp.length?PICK.disp.join(', '):null,
    /* כל שמירה מצד הרכז היא אישור: יצירה, העברה, וגם שיבוץ
       של בקשת חלון — שבה הטווח מתנקה כי כבר יש תאריך. */
    status:'approved', window_start:null, window_end:null,
    updated_at:new Date().toISOString()};
  const b=el('svBtn'); b.disabled=true; b.textContent='שומר…';
  try{
    if(MOVE) await api('exam_board?id=eq.'+encodeURIComponent(MOVE.id),
      {method:'PATCH',body:JSON.stringify(row)});
    else     await api('exam_board',{method:'POST',body:JSON.stringify([row])});
    MOVE=null; closeModal(); await loadAll(); render();
  }catch(e){
    el('mErr').textContent='שגיאה: '+e.message;
    b.disabled=false; b.textContent=MOVE?'העברה ←':'שמירה ←';
  }
}

/* ---- מבחן קיים ---- */

  if(!e) return;
  const d=fromIso(e.exam_date);

    document.body.appendChild(m);
  }
  el('sheet').innerHTML='<h3>'+esc(e.title||e.subject_base)+'</h3>'+
    '<p class="hint">'+esc(e.subject_base)+(e.level?' · '+esc(e.level):'')+' · '+
      (e.scope==='grade'?'כל השכבה':esc(e.class_name))+'<br>'+
      'יום '+DAYS[dayIdx(d)]+' '+d.getDate()+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()+
      ' · שעות '+e.hour+(e.hour_end&&e.hour_end!==e.hour?'–'+e.hour_end:'')+'</p>'+

    (isDraft(e)?'<div class="flag y" style="display:block;padding:9px 12px;'+
      'border-radius:10px;margin-top:9px">בקשה של '+
      esc(e.requested_by||'מורה')+' — טרם אושרה</div>':'')+
    '<div class="acts">'+
      (!VIEW&&isDraft(e)?'<button class="btn" onclick="approveExam('+e.id+')">✓ אישור</button>':'')+
      (!VIEW&&isDraft(e)?'<button class="btn no" onclick="rejectExam('+e.id+')">דחייה</button>':'')+
      (VIEW||isDraft(e)?'':'<button class="btn no" onclick="delExam('+e.id+')">מחיקה</button>')+
      (VIEW?'':'<button class="btn" onclick="startMove('+e.id+')">העברה לתאריך אחר</button>')+

const dmy=s=>{ if(!s) return '—'; const d=fromIso(s);
  return d.getDate()+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear(); };

/* ============================================================
   בקשות ופרסום
   ------------------------------------------------------------
   אישור הוא PATCH על status בלבד. השורה אינה נוצרת מחדש ואינה
   משנה מזהה, כך שהמורה רואה את אותה בקשה משנתה צבע.
   ============================================================ */
async function approveExam(id){
  try{
    await api('exam_board?id=eq.'+encodeURIComponent(id),
      {method:'PATCH', body:JSON.stringify({status:'approved',
        updated_at:new Date().toISOString()})});
    closeModal(); await loadAll(); render();
  }catch(err){ alert('שגיאה: '+err.message); }
}
async function rejectExam(id){
  const e=BOARD.find(x=>String(x.id)===String(id));
  if(!confirm('לדחות את הבקשה של '+((e&&e.requested_by)||'המורה')+'?\n\n'+
    'הבקשה תימחק והמורה לא יקבל הודעה — כדאי לומר לו.')) return;
  try{
    /* מחיקה עם תנאי סטטוס: מסך מיושן לא ימחק מבחן שאושר בינתיים. */
    await api('exam_board?id=eq.'+encodeURIComponent(id)+'&status=eq.draft',
      {method:'DELETE'});
    closeModal(); await loadAll(); render();
  }catch(err){ alert('שגיאה: '+err.message); }
}

/* שיבוץ בקשת חלון — מנוע ההעברה הקיים, מוגבל לטווח שביקש המורה. */
function placeWindow(id){
  const e=BOARD.find(x=>String(x.id)===String(id)); if(!e) return;
  MOVE=e;
  FORM={base:e.subject_base, level:e.level||'', scope:e.scope,
        cls:e.class_name||CLASSES[0], title:e.title||'', notes:e.notes||'',
        from:e.window_start, to:e.window_end};
  CAND=[]; PICK=null; drawModal();
}

async function togglePublish(){
  const on=!(PUB&&PUB.published);
  if(on && !confirm('לפרסם את לוח שכבה '+GRADE+'?\n\n'+
      'מרגע זה מורים ותלמידים יראו אותו בקישור הלוח.')) return;
  if(!on && !confirm('להסתיר את הלוח שוב?\n\n'+
      'מי שיפתח את הקישור יראה "הלוח בבנייה".')) return;
  const row={year_start:YEAR, grade:GRADE, published:on,
             published_at:on?new Date().toISOString():null};
  try{
    /* api() בונה את הכותרות בעצמו ומקבל Prefer דרך opts.prefer בלבד. */
    await api('exam_publish?on_conflict=year_start,grade',
      {method:'POST', body:JSON.stringify([row]),
       prefer:'resolution=merge-duplicates'});
    await loadAll(); render();
  }catch(err){ alert('שגיאה: '+err.message); }
}

async function delExam(id){
  const e=BOARD.find(x=>String(x.id)===String(id));
  if(!confirm('למחוק את "'+(e&&e.title||'המבחן')+'"?')) return;
  try{
    await api('exam_board?id=eq.'+encodeURIComponent(id),{method:'DELETE'});
    closeModal(); await loadAll(); render();
  }catch(err){ alert('שגיאה: '+err.message); }
}

/* ============================================================
   אתחול
   ============================================================ */
function render(){
  if(!CLASSES.length){
    el('app').innerHTML='<div class="card"><div class="empty-state">'+
      'אין מערכת לשכבה '+esc(GRADE)+' בשנת '+yearLabel(YEAR)+'.<br>'+
      '<a href="mivchanim-import.html" style="color:var(--a)">למסך הייבוא ←</a>'+
      '</div></div>';
    return;
  }
  el('app').innerHTML=calScreen();
}

async function boot(){
  el('app').innerHTML='<div class="empty-state">טוען…</div>';
  el('yearLbl').textContent=yearLabel(YEAR);
  try{
    await loadAll();
    if(!MONTH){ const t=new Date(); MONTH={y:t.getFullYear(),m:t.getMonth()}; }
    render();
  }catch(e){
    el('app').innerHTML='<div class="card"><div class="empty-state">שגיאה: '+
      esc(e.message)+'</div></div>';
  }
}

(function init(){
  const q=new URLSearchParams(location.search);
  if(q.get('grade')) GRADE=q.get('grade');
  if(q.get('year')) YEAR=parseInt(q.get('year'),10);
  VIEW=q.get('view')==='1';
  if(VIEW) document.body.classList.add('viewonly');
  el('gradeSel').innerHTML=GRADES.map(g=>'<option'+(g===GRADE?' selected':'')+'>'+g+
    '</option>').join('');
  boot();
})();
</script>
