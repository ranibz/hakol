     שעות, שם והערה. ברוב המקרים הרכז לא שינה שם דבר במסך השני —
     הוא רק לחץ שמירה. זו לחיצה מיותרת בכל מבחן.

     ⬛ לכל משבצת יש עכשיו "שמירה ←" שמבצע מיד: השעות המוצעות, שם
     ברירת מחדל, בלי הערה.
     ⬛ "פרטים" נשאר לצדו ופותח את מסך האישור לשינוי שעות, שם והערה.
     לחיצה על גוף הכרטיס עושה אותו דבר.

     ⚠⚠ H2() החזירה את שעת ההתחלה כשמסך האישור לא היה על המסך, ולכן
     שמירה מהירה של משבצת 3–4 הייתה נשמרת כ-3–3. הנפילה לאחור היא
     עכשיו hourEnd. באותה הזדמנות saveExam אינה מניחה עוד שהשדות
     קיימים — היא נקראת משני מסכים.


     v1.11.1 · המשבצת לא נראתה כמו כפתור, ו"סגירה" נראה כמו שמירה.

     ⚠ במסך החיפוש הכפתור היחיד היה "סגירה", והמשבצת עצמה הייתה
     כרטיס בלי שום סימן שלוחצים עליו. מי שמצא משבצת אחת נכונה לחץ
     "סגירה" וציפה שתישמר — ויצא בלי מבחן.

     ⬛ לכל משבצת נוסף "בחירה ←" מודגש, והכרטיס מקבל סימן מעבר עכבר.
     ⬛ "סגירה" הפך ל"ביטול" בכל מסך שיש בו המשך: שם הכפתור אומר
     מה קורה בלחיצה, לא איך נראית התיבה.
     ⬛ שורת ההסבר מעל הרשימה אומרת מפורשות שהלחיצה מובילה לאישור
     ושמירה, ומתחת לרשימה יש תזכורת שדבר עדיין לא נשמר.


     v1.11.0 · הגשת עבודה, ומקצוע בחירה.

     1 · הגשת עבודה — פריט שאינו יושב על שעה. העבודה ניתנה מזמן,
     והתאריך הוא מועד אחרון להגשה. הטופס נפתח בבורר "מבחן / הגשת
     עבודה": בהגשה אין שעות, אין חיפוש משבצות ואין גלישה, רק
     תאריך. בלוח הפריט מסומן "📄 הגשה" במקום שעה.

     ⚠ אין עמודת kind במסד, ולכן הסימן הוא hour ריק. השמירה מנסה
     null, ואם העמודה NOT NULL היא חוזרת ושומרת 0 — שתי הצורות
     נקראות כהגשה (!e.hour). כך הכלי עובד בשני המצבים בלי שינוי
     סכמה ובלי לדעת מראש מה מוגדר במסד.
     ⬛ הגשה נספרת בעומס השבועי ובאזהרת "יש מבחן באותו יום":

     2 · מקצוע בחירה — היקף שלישי לצד "כל השכבה" ו"כיתה אחת".

     ייראה עוד כ"3 מתוך 6" אלא כ"3 מתוך 3".
     ⚠ מקצוע שאינו במערכת כלל — הכיסוי אינו נמדד, והמשבצות
     מוצגות עם הערה. גם אז המבחן נספר בעומס של כל הכיתות.


     v1.10.0 · יחידות הלימוד נגזרות משם המקצוע, ונבחרות בריבועים.

     ⚠⚠ הרקע: במערכת השעות היחידות הן חלק מן השם — "מתמטיקה 3 י״ל",
     "מתמטיקה 4 י״ל", "מתמטיקה 5 י״ל" הם שלושה מקצועות נפרדים,

     ⬛ עכשיו השם מפוצל: "מתמטיקה 4 י״ל" → מקצוע "מתמטיקה", יחידות
     "4". ברשימה מופיעה מתמטיקה פעם אחת, ומתחתיה ריבועי היחידות

     ⬛ בלי סימון = כל היחידות, כמו קודם.
     ⬛ מקצוע בלי יחידות (אזרחות) אינו מציג ריבועים כלל.

     ⚠ הפיצול מזהה 3 י״ל / 3 יח״ל / 3 יחל / 3 יח / 3 יחידות, עם כל

     אינו יחידות לימוד ואינו מפוצל.
     ⚠ אם עמודת level כן מלאה בטבלת הנרמול, היחידה נלקחת ממנה. שני

     ⬛ במסד: subject_base נשמר כשם המשפחה ("מתמטיקה") ו-level כרשימת

     ⚠ מבחנים ישנים נשמרו עם השם המלא ב-subject_base; הם מוצגים כפי

     ⚠ רישום הגלישה (displaced) ממשיך לרשום את השם המלא מן המערכת,
     ולכן "כבר נגזל השנה" נשאר מדויק לפי רמה ותואם רשומות קיימות.


     v1.9.0 · מבחן אחד לכמה רמות. בורר "רמה" הפך לסימון מרובה.

     ⚠ הרקע: מתמטיקה 4 יח״ל ו-5 יח״ל נבחנות יחד. בורר יחיד אילץ

     ⬛ בלי סימון = כל הרמות, כמו קודם. עם סימון = בדיוק הרמות
     שסומנו: השעות נלקחות מכולן, והכיסוי נמדד מול כולן.
     ⬛ במסד נשמר level כמחרוזת מופרדת בפסיקים ("4 יח״ל, 5 יח״ל").

     ⬛ ✕ ליד מקצוע שהוקלד מוחק אותו מן הרשימה — טעות הקלדה אינה

     ⬛ "כל השעות — לדירוג" — ההתנהגות הישנה של סימון ריק.

     גלישה ומה שנזכר ממנה
     --------------------
     מבחן אינו חייב לשבת על שעת המקצוע: לפעמים אין ברירה והוא

     ----------

<script>

const SURL='https://skfriefqnoxfzmamcokd.supabase.co';

async function api(path,opts={}){
  const r=await fetch(SURL+'/rest/v1/'+path,{...opts,
    headers:{apikey:SKEY,Authorization:'Bearer '+SKEY,
             'Content-Type':'application/json',Prefer:opts.prefer||''}});

const el=id=>document.getElementById(id);

/* v1.19.0 — צבע מירקור לכל שכבה. גוונים בהירים עם טקסט כהה,

const divOf = g => JUNIOR.indexOf(g)>-1 ? 'חטיבת ביניים' : 'חטיבה עליונה';

/* ============================================================
   טעינה
   ============================================================ */
async function loadAll(){
  TT=await api('exam_timetable?select=class_name,day,hour,subject_raw'+
    '&year_start=eq.'+YEAR+'&grade=eq.'+encodeURIComponent(GRADE))||[];
  CLASSES=[...new Set(TT.map(r=>r.class_name))].sort((a,b)=>{
    const n=s=>parseInt(String(s).replace(/\D+/g,''),10)||0;
    return n(a)-n(b)||String(a).localeCompare(b,'he');
  });

  SUBJ={};
  ((await api('exam_subjects?select=*'))||[]).forEach(s=>{ SUBJ[s.subject_raw]=s; });

  CL_CACHE=null;                      /* v1.14.0 — האשכולות נגזרים מ-TT */
  BOARD=await api('exam_board?select=*&year_start=eq.'+YEAR+
    '&grade=eq.'+encodeURIComponent(GRADE)+'&order=exam_date')||[];

  /* מצב הפרסום. אין שורה = טרם פורסם. */
  try{
    const pr=await api('exam_publish?select=*&year_start=eq.'+YEAR+
      '&grade=eq.'+encodeURIComponent(GRADE)+'&limit=1');
    PUB=(pr&&pr.length)?pr[0]:null;
  }catch(e){ PUB=null; }

  /* v1.19.0 — אירועי השכבה. הטבלה עשויה לא להיות קיימת עדיין,
     ואז הכלי ממשיך בלעדיה במקום ליפול. */
  try{
    EVENTS=await api('exam_events?select=*&year_start=eq.'+YEAR+
      '&grade=eq.'+encodeURIComponent(GRADE)+'&order=start_date')||[];
  }catch(e){ EVENTS=[]; console.warn('exam_events', e.message); }

  /* no_exams אינה קיימת בכל מסד. במקום להניח — מנסים, ואם היא
     חסרה חוזרים לשליפה הרגילה. כך הכלי עובד לפני התוספת ואחריה. */
  try{
    GANTT=await api('gantt_events?select=track,title,start_date,end_date,no_exams'+
      '&year_start=eq.'+YEAR)||[];
    NOEXAM_COL=true;
  }catch(e){
    GANTT=await api('gantt_events?select=track,title,start_date,end_date'+
      '&year_start=eq.'+YEAR)||[];
    NOEXAM_COL=false;
  }
}

/* הבחנות הבסיסיות בלוח. ראה הערת הגרסה v1.3.0. */
const isDraft  = e => e.status === 'draft';
/* v1.11.0 — הגשת עבודה: פריט בלי שעה. ראה הערת הגרסה. */
const isTask   = e => !e.hour;
const KIND     = () => FORM.kind || 'exam';
const scopeLabel = e => e.scope==='class' ? (e.class_name||'')
                      : e.scope==='elective' ? 'מקצוע בחירה' : 'כל השכבה';
const isWindow = e => !e.exam_date;                    /* בקשת חלון */
/* מה שנספר כמבחן לכל דבר: מאושר ועם תאריך. */
const REAL = () => BOARD.filter(e => !isDraft(e) && !isWindow(e));

/* מפת המערכת: יום → שעה → כיתה → מקצועות */
function slotAt(day,hour,cls){
  return TT.filter(r=>r.day===day&&r.hour===hour&&r.class_name===cls).map(r=>r.subject_raw);
}
const norm=raw=>SUBJ[raw]||{subject_base:raw,level:null,examable:true};

/* ============================================================
   v1.8.0 · רשימת המקצועות
   ------------------------------------------------------------
   שלושה מקורות: מערכת השעות, מבחנים שכבר נקבעו, ומקצועות
   שהרכז הקליד. inTT אומר אם המקצוע קיים במערכת השעות — רק לו
   יש משמעות ל"לפי שעות המקצוע".
   ⚠ ההקלדה נשמרת ב-localStorage לפי שנה ושכבה, ולכן היא לפי
   מכשיר עד שנקבע מבחן במקצוע. ראה הערת הגרסה.
   ============================================================ */
const tidy = s => String(s==null?'':s).trim().replace(/\s+/g,' ');
const same = (a,b) => tidy(a)===tidy(b) && tidy(a)!=='';
const XKEY = () => 'mivchanim:subjects:'+YEAR+':'+GRADE;
/* ============================================================
   v1.15.0 · אשכולות הבחירה
   ------------------------------------------------------------
   הרשימות נתונות, ולא מנוחשות. לעדכון אשכול — עורכים כאן שורה.
   ⚠ השמות כאן הם שמות הרכז; ההתאמה לשמות המערכת סלחנית (ראה
   sameSubj), ולכן אין צורך להעתיק בדיוק את הכתיב של המערכת.
   ============================================================ */
const CLUSTERS = [
  {name:'בחירה חובה', subs:['כימיה','תורת החשמל','תקשורת','מינהל',
                            'מידע ונתונים','הנדסת תכנה']},
  {name:'בחירה',      subs:['ביולוגיה','פיזיקה','מדעי החברה','דיפלומטיה']}
];

/* ⚠ השוואת שמות מקצועות: המערכת כותבת "הנדסת תוכנה" והרכז "הנדסת
   תכנה", וגם "תקשורת" מול "תקשורת וחברה". מסירים רווחים, גרשיים
   ואותיות אם קריאה, ומשווים גם בהכלה. */
const subjKey = v => String(v||'')
  .replace(/["'׳״’‘`.,\-–]/g,'')
  .replace(/\s+/g,'')
  .replace(/[ו]/g,'')
  .replace(/[ס]/g,'ז');            /* פיסיקה = פיזיקה */
function sameSubj(a,b){
  const x=subjKey(a), y=subjKey(b);
  if(!x||!y) return false;
  return x===y || x.indexOf(y)===0 || y.indexOf(x)===0;
}

/* האשכולות, אחרי התאמה למה שקיים במערכת השעות */
let CL_CACHE=null;
function clusters(){
  if(CL_CACHE) return CL_CACHE;
  const famAll={};
  TT.forEach(r=>{
    const s=norm(r.subject_raw); if(s.examable===false) return;
    const f=famUnit(r.subject_raw).fam; if(!f) return;
    const o=famAll[f]=famAll[f]||{slots:{},cls:{}};
    o.slots[r.day+'|'+r.hour]=1; o.cls[r.class_name]=1;
  });
  CL_CACHE=CLUSTERS.map(d=>{
    /* המשפחות שבמערכת ששייכות לאשכול — מהן באות השעות */
    const fams=Object.keys(famAll).filter(f=>d.subs.some(x=>sameSubj(x,f)));
    const slots={}, cls={};
    fams.forEach(f=>{
      Object.keys(famAll[f].slots).forEach(k=>{ slots[k]=1; });
      Object.keys(famAll[f].cls).forEach(c=>{ cls[c]=1; });
    });
    return {key:d.name, name:d.name, subs:d.subs, fams:fams,
      slots:Object.keys(slots).map(k=>({day:+k.split('|')[0],hour:+k.split('|')[1]}))
        .sort((a,b)=>a.day-b.day||a.hour-b.hour),
      classes:Object.keys(cls).length};
  });
  return CL_CACHE;
}
/* לאיזה אשכול שייך מקצוע. ⚠ גם מקצוע שאינו במערכת — זו כל הנקודה. */
const clusterOf = base => clusters().find(c=>c.subs.some(x=>sameSubj(x,base)));
const clusterByKey = k => clusters().find(c=>c.key===k);
const slotsLabel = c => {
  const byDay={};
  (c.slots||[]).forEach(s=>{ (byDay[s.day]=byDay[s.day]||[]).push(s.hour); });
  return Object.keys(byDay).map(d=>DAYS[d]+' '+hrLabel(byDay[d].sort((a,b)=>a-b))
    .replace('שעות ','').replace('שעה ','')).join(' · ');
};
/* כמה כיתות לומדות את המקצוע עצמו — כדי לא להפוך מקצוע של כל
   השכבה לקבוצת בחירה */
const famClasses = base => CLASSES.filter(c=>TT.some(r=>r.class_name===c &&
  same(famUnit(r.subject_raw).fam, base))).length;

/* v1.13.1 — זיכרון המקצוע המקביל: מקצוע → מקצוע שממנו נלקחות השעות */
const RKEY = () => 'mivchanim:ref:'+YEAR+':'+GRADE;
function refMap(){
  try{ const v=JSON.parse(localStorage.getItem(RKEY())||'{}');
       return (v&&typeof v==='object')?v:{}; }catch(e){ return {}; }
}
function rememberRef(base, ref){
  const b=tidy(base), r=tidy(ref);
  if(!b) return;
  const m=refMap();
  if(r) m[b]=r; else delete m[b];
  try{ localStorage.setItem(RKEY(), JSON.stringify(m)); }catch(e){}
}
const recalledRef = base => tidy(refMap()[tidy(base)]||'');
function extraSubjects(){
  try{ const v=JSON.parse(localStorage.getItem(XKEY())||'[]');
       return Array.isArray(v)?v.filter(Boolean):[]; }catch(e){ return []; }
}
function addExtraSubject(name){
  const t=tidy(name); if(!t) return;
  const x=extraSubjects();
  if(x.some(s=>same(s,t))) return;
  x.push(t);
  try{ localStorage.setItem(XKEY(), JSON.stringify(x)); }catch(e){}
}

/* המקצועות הנבחנים שקיימים בפועל בשכבה הזאת, מקובצים לפי משפחה.
   ⬛ v1.10.0 — "מתמטיקה 3/4/5 י״ל" הן שורה אחת, ויחידותיה באות
   מן המערכת בלבד: ריבוע ליחידה שאיש אינו לומד היה מבטיח מבחן
   שאין לו על מה לשבת. */
function subjectList(){
  const m={};
  const slot=(fam,src,inTT)=>{
    if(!m[fam]) m[fam]={base:fam,units:{},n:0,inTT:false,src:src};
    if(inTT){ m[fam].inTT=true; m[fam].src='tt'; }
    return m[fam];
  };
  TT.forEach(r=>{
    const s=norm(r.subject_raw);
    if(s.examable===false) return;
    const x=famUnit(r.subject_raw);
    if(!x.fam) return;
    const o=slot(x.fam,'tt',true);
    o.n++;
    if(x.unit) o.units[x.unit]=1;
  });
  /* מבחנים שכבר נקבעו — כך מקצוע שנוסף בהקלדה ונשמר בו מבחן
     חוזר לכולם ובכל מכשיר, בלי טבלה נוספת. */
  BOARD.forEach(e=>{ const f=splitUnit(e.subject_base).fam;
    if(f && !m[f]) slot(f,'board',false); });
  /* v1.15.0 — מקצועות האשכולות מופיעים ברשימה גם אם אינם במערכת
     השעות, כדי שלא יידרש להקליד אותם. */
  CLUSTERS.forEach(d=>d.subs.forEach(b=>{ const f=tidy(b);
    if(f && !m[f] && !Object.keys(m).some(k=>sameSubj(k,f))) slot(f,'cluster',false); }));
  extraSubjects().forEach(b=>{ const f=splitUnit(b).fam;
    if(f && !m[f]) slot(f,'extra',false); });
  return Object.values(m).sort((a,b)=>b.n-a.n||a.base.localeCompare(b.base,'he'));
}
const unitsOf = base => Object.keys((subjectList().find(s=>same(s.base,base))||{units:{}}).units)
  .sort((a,b)=>a-b);
const inTimetable = base => (subjectList().find(s=>same(s.base,base))||{}).inTT===true;

/* ---- הגאנט ליום נתון ---- */
/* v1.19.0 — אירועי השכבה מצטרפים לאירועי הגאנט, ומסומנים grade */
function gradeEventsOn(dt){
  const s=iso(dt);
  return EVENTS.filter(e=>e.start_date<=s && s<=e.end_date)
    .map(e=>({track:'grade', title:e.title, no_exams:e.no_exams===true,
              id:e.id, notes:e.notes}));
}
function eventsOn(dt){
  const s=iso(dt);
  return gradeEventsOn(dt).concat(GANTT.filter(e=>e.start_date<=s && s<=e.end_date)
    .filter(e=>{
      if(e.track==='vacation'||e.track==='holidays') return true;
      if(e.track==='junior') return JUNIOR.indexOf(GRADE)>-1;
      if(e.track==='senior') return JUNIOR.indexOf(GRADE)<0;
      return false;
    }));
}
const isVacation=dt=>eventsOn(dt).some(e=>e.track==='vacation');
const isBlocked=dt=>eventsOn(dt).some(e=>e.track==='vacation'||e.no_exams===true);
/* v1.5.0 — למה יש חסימה שאפשר לעקוף: חופשה או יום שיא חוסמים
   כברירת מחדל, אבל יש מבחנים שמתקיימים בהם ביודעין — מועד ב׳
   בחופשה, בגרות בשבוע שיא. חסימה שאין דרך לעקוף הופכת לכלי
   שעוקפים בוואטסאפ. לכן: חסום כברירת מחדל, נפתח בסימון מפורש,
   ומסומן באדום בכל מקום שבו הוא מופיע. */
const blockReason=dt=>eventsOn(dt)
  .filter(e=>e.track==='vacation'||e.no_exams===true)
  .map(e=>e.title).filter(Boolean).join(' · ');

/* ============================================================
   חישוב המועמדות — הלב
   ------------------------------------------------------------
   לכל יום בטווח ולכל שעה: כמה מכיתות ההיקף יושבות במקצוע.
   כיסוי מלא הוא המשבצת הטובה; כיסוי חלקי אפשרי; אפס כיסוי
   פירושו גלישה, והיא מותרת ונרשמת.
   ============================================================ */
function scopeClasses(){
  if(FORM.scope==='class') return [FORM.cls];
  /* v1.16.0 — היקף חופשי: הכיתות שסומנו, ואם לא סומנו — כל השכבה */
  if(FORM.scope==='other')
    return (FORM.groupCls&&FORM.groupCls.length)?FORM.groupCls.slice():CLASSES;
  /* v1.11.0 — מקצוע בחירה: רק הכיתות שבהן הקבוצה יושבת בפועל.
     ⚠ אם המקצוע אינו במערכת כלל אין מה לסנן לפיו, ואז נבדקת כל
     השכבה — הכיסוי שיתקבל אינו אמיתי, וההערה בטופס אומרת זאת. */
  if(FORM.scope==='elective'){
    const u=matchUnits(), b=matchBase();
    const on=CLASSES.filter(c=>TT.some(r=>r.class_name===c &&
      targetHit(r.subject_raw)));
    return on.length?on:CLASSES;
  }
  return CLASSES;
}
const electiveKnown = () => FORM.scope!=='elective' ||
  CLASSES.some(c=>TT.some(r=>r.class_name===c && targetHit(r.subject_raw)));
/* ============================================================
   v1.10.0 · יחידות לימוד
   ------------------------------------------------------------
   "מתמטיקה 4 י״ל" → {fam:'מתמטיקה', unit:'4'}.
   ⚠ התבנית דורשת י/יח/יחידות אחרי הספרה, ולכן "אנגלית 5 ש׳" או
   "ספרות 2" אינם מפוצלים — ספרה לבדה אינה יחידות לימוד.
   ============================================================ */
const UNIT_RE = /^(.+?)[\s·,\-–]*([1-9])\s*(?:יח(?:ידות)?|י)\s*["'״׳’`]*\s*ל?\s*$/;
function splitUnit(name){
  const t=tidy(name), m=UNIT_RE.exec(t);
  return m ? {fam:tidy(m[1]), unit:m[2]} : {fam:t, unit:''};
}
/* שני מקורות ליחידה: השם עצמו, ועמודת level אם המקצוע נורמל. */
function famUnit(raw){
  const s=norm(raw), by=splitUnit(s.subject_base);
  const d=String(s.level||'').match(/[1-9]/);
  return {fam:by.fam, unit: by.unit || (d?d[0]:'')};
}
const unitOf = v => { const d=String(v||'').match(/[1-9]/); return d?d[0]:''; };

/* units הוא מערך ספרות. ריק = כל היחידות. */
function matches(raw,fam,units){
  const x=famUnit(raw);
  if(x.fam!==fam) return false;
  if(units && units.length && units.indexOf(x.unit)<0) return false;
  return true;
}
const UNITS = () => (FORM.units||[]);
/* מבחן קיים: היחידות באות מעמודת level (הפורמט החדש) או מן השם
   המלא שנשמר לפני v1.10.0. */
function unitsOfExam(e){
  const set={};
  splitLevels(e&&e.level).forEach(l=>{ const u=unitOf(l); if(u) set[u]=1; });
  const u2=splitUnit(e&&e.subject_base).unit; if(u2) set[u2]=1;
  return Object.keys(set).sort();
}
const splitLevels = v => String(v||'').split(',').map(tidy).filter(Boolean);
const unitsLabel = a => (a||[]).join(' + ')+' יח״ל';
function setUnits(a){
  FORM.units=(a||[]).slice().sort();
  CAND=[];SEARCHED=false; PICK=null; drawModal();
}
function togUnit(i){
  const n=UOPTS[i]; if(n==null) return;
  const a=UNITS().slice(), k=a.indexOf(n);
  if(k>-1) a.splice(k,1); else a.push(n);
  setUnits(a);
}
function unitsHint(){
  const a=UNITS();
  if(!a.length) return 'לא סומן — המבחן לכל היחידות של '+esc(FORM.base)+'.';
  return 'מבחן אחד ל'+esc(unitsLabel(a))+
    (a.length>1?' יחד. השעות והכיסוי נלקחים משתי הרמות.':'.');
}
/* מקצועות שכבר נגזלו השנה — בסיס לדירוג ולסימון.
   מבחן שנמצא בהעברה אינו נספר נגד עצמו: הגלישה שלו תיעלם
   ברגע שיזוז, ואחרת הוא היה מסמן באדום את המשבצת שהוא כבר יושב בה. */
function displacedSoFar(){
  const m={};
  REAL().filter(e=>!MOVE||String(e.id)!==String(MOVE.id))
    .forEach(e=>String(e.displaced||'').split(',').map(x=>x.trim())
    .filter(Boolean).forEach(x=>{ m[x]=(m[x]||0)+1; }));
  return m;
}
/* כמה מבחנים כבר יש לכיתה באותו שבוע */
function weekLoad(dt,cls){
  const wk=weekKey(dt);
  return REAL().filter(e=>!MOVE||String(e.id)!==String(MOVE.id))
    .filter(e=>weekKey(fromIso(e.exam_date))===wk)
    /* v1.11.0 — מקצוע בחירה נספר לכל כיתה: הקבוצה מורכבת מכולן. */
    .filter(e=>e.scope!=='class'||e.class_name===cls).length;
}

/* v1.5.0 — גלישה על כל טווח השעות ולא על השעה הראשונה בלבד.
   ⚠ עד כה מבחן משעה 3 עד 5 רשם גלישה רק של שעה 3, ולכן "גלישות
   השנה" החטיא שתי שעות מתוך שלוש. */
/* v1.18.1 — מפת הגלישה: מקצוע → הכיתות שנלקחות ממנו, וכמה כיתות
   בסך הכול אינן במקצוע המבחן. */
function dispMap(di,h1,h2){
  const cls=scopeClasses(), by={}, off={};
  if(noDisp()) return {by:by, off:0, total:cls.length};
  for(let h=Math.min(h1,h2); h<=Math.max(h1,h2); h++){
    cls.forEach(c=>{
      const raws=slotAt(di,h,c);
      if(!raws.length) return;
      if(raws.some(r=>targetHit(r))) return;
      off[c]=1;
      raws.forEach(r=>{ const sb=norm(r);
        if(sb.examable!==false) (by[sb.subject_base]=by[sb.subject_base]||{})[c]=1; });
    });
  }
  return {by:by, off:Object.keys(off).length, total:cls.length};
}
function dispForSpan(dateIso,di,h1,h2){ return Object.keys(dispMap(di,h1,h2).by); }
/* הניסוח המלא, לשימוש בכל מקום שמציג גלישה */
function dispText(m, repeat){
  const subs=Object.keys(m.by);
  if(!subs.length) return '';
  const list=subs.map(x=>esc(x)+' ('+esc(Object.keys(m.by[x]).join(' · '))+')').join(' · ');
  return m.off+' מתוך '+m.total+' הכיתות אינן ב'+esc(matchBase())+
    ' בשעה הזאת: '+list+
    ((repeat&&repeat.length)?' ⟳ '+esc(repeat.join(' · '))+' כבר נגזל השנה':'');
}

/* ============================================================
   v1.7.0 · שעות המבחן
   ------------------------------------------------------------
   FORM.hours הוא מערך השעות שהרכז סימן. ריק = שהמנוע יחפש לבד.
   ⚠ סימון לא רצוף (3 ו-5) מותר בממשק אבל נשמר כטווח 3–5, כי
   exam_board מחזיק hour ו-hour_end ולא רשימה. ההערה בממשק אומרת
   זאת במקום להסתיר.
   ============================================================ */
const HRS=()=>(FORM.hours||[]).slice().sort((a,b)=>a-b);

/* ============================================================
   v1.8.0 · שלושה מצבים לשעות המבחן
   ------------------------------------------------------------
   auto — לפי שעות המקצוע במערכת (ברירת המחדל)
   pick — השעות שסומנו בריבועים
   all  — כל השעות, והכלי מדרג (ההתנהגות של סימון ריק ב-v1.7.0)
   ============================================================ */
const HMODE = () => FORM.hmode || 'auto';
/* v1.13.0 — במצב "לפי מקצוע אחר" כל החישוב (שעות, ימים, כיסוי)
   נעשה מול המקצוע המקביל, כי הוא זה שיושב במערכת. */
const REFON  = () => HMODE()==='ref' && !!(FORM.refBase || FORM.refCluster);
const refCl  = () => FORM.refCluster ? clusterByKey(FORM.refCluster) : null;
/* v1.14.0 — מה נחשב "המקצוע" לצורך שעות וכיסוי: אשכול שלם,
   מקצוע מקביל, או המקצוע עצמו. */
const targetHit = raw => {
  const c = HMODE()==='ref' ? refCl() : null;
  if(c) return c.subs.some(f=>same(f, famUnit(raw).fam));
  return matches(raw, matchBase(), matchUnits());
};
const matchBase  = () => REFON() ? FORM.refBase : FORM.base;
const matchUnits = () => REFON() ? [] : UNITS();
/* בקבוצת בחירה אין גלישה: היושבים באותה שעה במקצוע אחר של האשכול
   פשוט אינם נבחנים. */
const noDisp = () => FORM.scope==='elective';
/* v1.13.1 — בחירה בבורר נשמרת מיד, ולא רק בשמירת המבחן: רכז
   שסגר את החלון באמצע לא צריך לבחור שוב. */
/* v1.16.0 — סימון כיתה בקבוצה החופשית */
function togGroupCls(i){
  const c=CLASSES[i]; if(c==null) return;
  const a=(FORM.groupCls||[]).slice(), k=a.indexOf(c);
  if(k>-1) a.splice(k,1); else a.push(c);
  FORM.groupCls=a.sort((x,y)=>CLASSES.indexOf(x)-CLASSES.indexOf(y));
  CAND=[];SEARCHED=false; PICK=null; drawModal();
}
function setGroupName(v){ FORM.groupName=v; }

function setRef(v){
  FORM.refBase=v; FORM.refCluster='';
  rememberRef(FORM.base, v);
  CAND=[];SEARCHED=false; PICK=null; drawModal();
}
/* v1.14.0 — בחירת אשכול. נשמרת עם תחילית, כדי שזיכרון אחד
   ישמש גם למקצוע מקביל וגם לאשכול. */
const CPFX='⟦אשכול⟧';
function setCluster(key){
  FORM.refCluster=key; FORM.refBase='';
  rememberRef(FORM.base, key?CPFX+key:'');
  CAND=[];SEARCHED=false; PICK=null; drawModal();
}

function setHMode(m){
  FORM.hmode=m;
  if(m!=='pick') FORM.hours=[];
  if(m!=='ref'){ FORM.refBase=''; FORM.refCluster=''; }
  CAND=[];SEARCHED=false; PICK=null; drawModal();
}
/* השעות שבהן המקצוע יושב במערכת ביום נתון, מקובצות לרצפים.
   ⚠ שעות 2 ו-6 הן שתי מועמדות נפרדות ולא טווח 2–6: טווח כזה היה
   גורר את המבחן על ארבע שעות שאיש אינו לומד בהן את המקצוע. */
function subjectBlocks(di){
  const cls=scopeClasses(), base=matchBase(), units=matchUnits(), on={};
  for(let h=1;h<=10;h++)
    if(cls.some(c=>slotAt(di,h,c).some(r=>targetHit(r)))) on[h]=1;
  const out=[]; let cur=[];
  for(let h=1;h<=10;h++){
    if(on[h]) cur.push(h);
    else if(cur.length){ out.push(cur); cur=[]; }
  }
  if(cur.length) out.push(cur);
  return out;
}
function togHour(n){
  const h=HRS(), i=h.indexOf(n);
  if(i>-1) h.splice(i,1); else h.push(n);
  FORM.hours=h.sort((a,b)=>a-b);
  FORM.hmode='pick';          /* v1.8.0 — לחיצה על ריבוע היא בחירה ידנית */
  CAND=[];SEARCHED=false; drawModal();
}
const hrLabel=list=>{
  if(!list||!list.length) return '';
  const a=list[0], b=list[list.length-1];
  const contig = list.length===(b-a+1);
  return list.length===1 ? 'שעה '+a
       : contig ? 'שעות '+a+'–'+b
       : 'שעות '+list.join(', ');
};
function hoursHint(){
  const m=HMODE();
  if(m==='ref'){
    const c=refCl();
    if(c) return esc(FORM.base)+' באשכול '+esc(c.name)+'. השעות נלקחות מן האשכול — '+
      esc(slotsLabel(c))+' ('+esc(c.fams.join(' · '))+').';
    if(!FORM.refBase)
      return 'בחרו את האשכול שבו יושבת הקבוצה, או מקצוע מקביל מסוים. '+
             'השעות, הימים והכיסוי ייגזרו ממנו.';
    return 'השעות נלקחות מ'+esc(FORM.refBase)+'. יוצעו רק ימים שבהם '+
           esc(FORM.refBase)+' יושב במערכת, ובשעותיו.'+
           (same(recalledRef(FORM.base),FORM.refBase)
             ? ' נשמר ל'+esc(FORM.base)+' — בפעם הבאה ייבחר מעצמו.' : '');
  }
  if(m==='auto'){
    if(!FORM.base) return 'בחרו מקצוע.';
    if(!inTimetable(FORM.base))
      return '⚠ «'+esc(FORM.base)+'» אינו מופיע במערכת השעות של השכבה. אם זו קבוצת '+
             'בחירה, בחרו «לפי מקצוע אחר» וקחו את השעות ממקצוע מקביל מאותו אשכול.';
    return 'המבחן ייפול על השעות שבהן '+esc(FORM.base)+
           (UNITS().length?' ('+esc(unitsLabel(UNITS()))+')':'')+
           ' מופיע במערכת. יוצעו רק ימים שבהם המקצוע נלמד, ורצף שעות יוצע כמקשה אחת.';
  }
  if(m==='all') return 'הכלי יחפש בכל השעות וידרג אותן לבד.';
  const h=HRS();
  if(!h.length) return 'סמנו שעות בריבועים. בלי סימון יחופשו כל השעות.';
  const contig = h.length===(h[h.length-1]-h[0]+1);
  return hrLabel(h)+' · '+h.length+' '+(h.length===1?'שעה':'שעות')+
    (contig?'' : ' ⚠ השעות אינן רצופות — יישמר טווח '+h[0]+'–'+h[h.length-1]);
}

function buildCandidates(){
  const base=matchBase(), units=matchUnits(), from=FORM.from, to=FORM.to;
  const cls=scopeClasses(), prev=displacedSoFar(), out=[];
  let d=fromIso(from), end=fromIso(to);
  while(d<=end){
    const di=dayIdx(d);
    const blk=isBlocked(d);
    if(di && (!blk || FORM.allowBlocked)){
      /* ⚠ ביום חסום שם החופשה חייב להופיע במשבצת — אחרת הרכז בוחר
         ואינו יודע שזה אמצע חופשת פסח. */
      const evs=eventsOn(d).filter(e=>e.track!=='holidays'||blk);
      /* v1.7.0 — אם הרכז סימן שעות, יש מועמדת אחת ליום והיא בדיוק
         השעות שסימן. אם לא סימן, המנוע סורק את כל השעות ומדרג.
         ⚠ כיתה נחשבת מכוסה רק אם היא במקצוע בכל השעות שנבדקות;
         אחרת המבחן גולש עליה בחלק מהזמן, וזה נרשם. */
      /* v1.8.0 — מאיפה באות השעות הנבדקות, לפי מצב הבחירה. */
      const marked=HRS(), hm=HMODE();
      const blocks = (hm==='pick' && marked.length) ? [marked]
        : (hm==='auto' || REFON()) ? subjectBlocks(di)
        : (function(){ const o=[]; for(let h=1;h<=10;h++) o.push([h]); return o; })();
      for(const blk2 of blocks){
        const h=blk2[0], hEnd=blk2[blk2.length-1];
        const has=[], miss=[], disp={};
        cls.forEach(c=>{
          let any=false, all=true;
          for(const k of blk2){
            const raws=slotAt(di,k,c);
            if(!raws.length) continue;              /* אין שיעור — לא נוגעים */
            any=true;
            if(raws.some(r=>targetHit(r))) continue;
            all=false;
            if(!noDisp())
              raws.forEach(r=>{ const sb=norm(r);
                if(sb.examable!==false)
                  (disp[sb.subject_base]=disp[sb.subject_base]||{})[c]=1; });
          }
          if(!any) return;
          if(all) has.push(c); else miss.push(c);
        });
        if(!has.length && !miss.length) continue;   /* אין שיעור בכלל בשעות האלה */
        const dl=Object.keys(disp);
        const repeat=dl.filter(x=>prev[x]);
        /* v1.18.1 — כמה כיתות אינן במקצוע המבחן בשעות האלה */
        const offN=miss.length;
        const load=Math.max.apply(null,cls.map(c=>weekLoad(d,c)));
        const sameDay=BOARD.some(e=>e.exam_date===iso(d) &&
          (!MOVE||String(e.id)!==String(MOVE.id)));
        out.push({date:iso(d),day:di,hour:h,hourEnd:hEnd,hours:blk2.slice(),
                  auto:hm==='auto'||REFON(),
                  refName:REFON()?(refCl()?refCl().name:FORM.refBase):'',
                  has:has.length,miss:miss.length,
                  total:has.length+miss.length,disp:dl,dispBy:disp,off:offN,
                  repeat:repeat,
                  load:load,sameDay:sameDay,evs:evs.map(e=>e.title),
                  blocked:blk, blockWhy:blk?blockReason(d):''});
      }
    }
    d=addD(d,1);
  }
  /* דירוג: כיסוי מלא קודם, אחריו מעט גלישות, ובתוך שווים —
     מוקדם יותר. גלישה חוזרת על אותו מקצוע נדחקת לסוף. */
  /* יום חסום נדחק לסוף גם כשהכיסוי בו מלא: הוא אפשרי, לא מועדף. */
  out.sort((a,b)=>
    (a.blocked?1:0)-(b.blocked?1:0) ||
    (b.has/b.total)-(a.has/a.total) ||
    a.repeat.length-b.repeat.length ||
    a.disp.length-b.disp.length ||
    (a.load>=MAX_WEEK?1:0)-(b.load>=MAX_WEEK?1:0) ||
    a.date.localeCompare(b.date) || a.hour-b.hour);
  CAND=out.slice(0,40);
  SEARCHED=true;
}

/* ============================================================
   לוח החודש
   ============================================================ */
function monthGrid(){
  const first=new Date(MONTH.y,MONTH.m,1);
  const start=addD(first,-(first.getDay()===6?6:first.getDay()));
  const cells=[];
  for(let i=0;i<42;i++){
    const d=addD(start,i);
    cells.push(d);                                  /* v1.18.0 — כולל שבת */
    if(cells.length>=42) break;
  }
  return cells;
}
function monthLabel(){
  return new Intl.DateTimeFormat('he',{month:'long',year:'numeric'})
    .format(new Date(MONTH.y,MONTH.m,1));
}
function shiftMonth(n){
  const d=new Date(MONTH.y,MONTH.m+n,1);
  MONTH={y:d.getFullYear(),m:d.getMonth()}; render();
}

function calScreen(){
  const cells=monthGrid();
  const byDate={};
  /* בקשת חלון אינה יושבת על תא — היא ברשימה מתחת ללוח. */
  BOARD.filter(e=>!isWindow(e))
       .forEach(e=>{ (byDate[e.exam_date]=byDate[e.exam_date]||[]).push(e); });

  let html='<div class="card"><div class="mhead">'+
    '<button class="btn g sm" onclick="shiftMonth(-1)">→ הקודם</button>'+
    '<h2>'+esc(monthLabel())+'</h2>'+
    '<button class="btn g sm" onclick="shiftMonth(1)">הבא ←</button>'+
    /* v1.11.0 — הגשות נספרות בנפרד: "7 מבחנים" שכולל שתי הגשות
       הוא מספר שאי אפשר לסמוך עליו. */
    '<span class="hint" style="margin:0 0 0 auto">שכבה '+esc(GRADE)+' · '+
      CLASSES.length+' כיתות · '+REAL().filter(e=>!isTask(e)).length+' מבחנים'+
      (REAL().filter(isTask).length?' · '+REAL().filter(isTask).length+' הגשות':'')+
      (BOARD.filter(isDraft).length
        ? ' · '+BOARD.filter(isDraft).length+' בקשות ממתינות':'')+'</span>'+
    (VIEW?'':'<button class="btn '+(PUB&&PUB.published?'g':'')+' sm" '+
      'onclick="togglePublish()">'+
      (PUB&&PUB.published?'✓ מפורסם':'פרסום הלוח')+'</button>')+
    '</div><div class="calwrap"><div class="cal">'+
    WD.map(w=>'<div class="wd">'+w+'</div>').join('')+
    cells.map(d=>{
      const s=iso(d), out=d.getMonth()!==MONTH.m;
      const evs=eventsOn(d), vac=isVacation(d);
      const blk=isBlocked(d);
      /* v1.5.0 — יום חסום נלחץ גם הוא, ובלחיצה נדלק הדגל מעצמו.
         ⚠ קודם התא לא היה נלחץ בכלל, ולרכז לא הייתה שום דרך
         לשבץ מועד ב׳ בחופשה חוץ מלערוך את המסד ידנית. */
      const pick=!VIEW;
      /* הטווח של הבקשה שנלחצה — רק אחת בכל רגע. */
      const inWin = HLWIN && HLWIN.window_start<=s && s<=HLWIN.window_end;
      const sat=d.getDay()===6;
      return '<div class="cell'+(out?' out':'')+(vac?' vac':'')+(sat?' sat':'')+
        (inWin?' win':'')+(pick?' pick':'')+'"'+
        (pick?' onclick="openNew(\''+s+'\','+(blk?'true':'false')+
            ','+(sat?'true':'false')+')" title="'+
          (sat?'שבת — לחיצה תפתח הגשת עבודה'
            :blk?'יום חסום — '+esc(blockReason(d))+'. לחיצה תפתח שיבוץ בכל זאת'
            :'מבחן חדש ב-'+s)+'"':'')+'>'+
        '<div class="dn">'+d.getDate()+' <span class="heb">'+esc(hebDay(d))+'</span></div>'+
        (inWin?'<span class="wl">'+esc(HLWIN.subject_base)+'</span>':'')+
        /* v1.19.0 — אירוע שכבה נלחץ לעריכה ונצבע בצבע השכבה */
        evs.slice(0,3).map(e=>e.track==='grade'
          ? '<span class="ev ge'+(e.no_exams?' blk':'')+'" '+
            'style="background:'+gcol(GRADE).bg+';color:'+gcol(GRADE).ink+'" '+
            'title="'+esc(e.title+(e.notes?' · '+e.notes:'')+
              (e.no_exams?' · חוסם מבחנים':''))+'" '+
            (VIEW?'':'onclick="event.stopPropagation();openEvent('+e.id+')"')+'>'+
            (e.no_exams?'⛔ ':'')+esc(e.title)+'</span>'
          : '<span class="ev'+(e.track==='vacation'?' v':'')+'">'+
            esc(e.title)+'</span>').join('')+
        /* v1.16.2 — שם המבחן קודם לשם המקצוע, והערה מסומנת ב-📝 */
        (byDate[s]||[]).map(e=>{
          const subj=esc(e.subject_base)+(e.level?' '+esc(e.level):'');
          const head=tidy(e.title)&&!same(e.title,e.subject_base)?esc(e.title):subj;
          const when=isTask(e)?'📄 הגשה'
            :'ש׳'+e.hour+(e.hour_end&&e.hour_end!==e.hour?'–'+e.hour_end:'');
          const who=e.scope==='class'?esc(e.class_name)
            :e.scope==='elective'?'בחירה':'';
          /* ⚠ ה-tip נבנה מן הערכים הגולמיים ומוברח פעם אחת. subj כבר
             מוברח, ולכן שימוש בו כאן היה נותן &quot; בתוך החלונית. */
          const tip=[tidy(e.title)||'', e.subject_base+(e.level?' '+e.level:''),
                     scopeLabel(e), when.replace(/<[^>]+>/g,''),
                     tidy(e.notes)?'הערה: '+e.notes:''].filter(Boolean).join(' · ');
          return '<span class="ex'+
            (isDraft(e)?' draft':isTask(e)?' task':(e.scope==='class'?' cls':''))+'" '+
            'title="'+esc(tip)+'" '+
            'onclick="event.stopPropagation();openExam('+e.id+')">'+
            '<span class="exh">'+head+' · '+when+(who?' · '+who:'')+'</span>'+
            (tidy(e.notes)?'<span class="exn">📝 '+esc(e.notes)+'</span>':'')+
            '</span>';
        }).join('')+
        '</div>';
    }).join('')+'</div></div></div>';

  /* בקשות חלון — אין להן תא בלוח, ולכן רשימה מתחתיו. */
  const wins=BOARD.filter(e=>isWindow(e)&&isDraft(e));

    'את הבקשה והופכת אותה למבחן.</p>'+
    '<div class="tblwrap"><table><thead><tr><th>מקצוע</th><th>היקף</th><th>טווח</th>'+

    wins.map(e=>'<tr class="winrow'+(HLWIN&&String(HLWIN.id)===String(e.id)?' on':'')+'" '+
      'onclick="hlWindow('+e.id+')" title="לחיצה מסמנת את הטווח בלוח">'+
      '<td>'+esc(e.subject_base)+(e.level?' '+esc(e.level):'')+'</td>'+
      '<td>'+esc(scopeLabel(e))+'</td>'+
      '<td>'+esc(dmy(e.window_start))+' – '+esc(dmy(e.window_end))+'</td>'+
      '<td>'+esc(e.requested_by||'—')+'</td>'+
      '<td><button class="btn sm" onclick="event.stopPropagation();placeWindow('+e.id+')">'+
      'שיבוץ</button> '+
      '<button class="btn no sm" onclick="event.stopPropagation();rejectExam('+e.id+')">'+
      'דחייה</button></td></tr>').join('')+
    '</tbody></table></div></div>';

  /* גלישות — מה כבר נלקח השנה */
  const dsp=displacedSoFar(), keys=Object.keys(dsp).sort((a,b)=>dsp[b]-dsp[a]);
  if(keys.length) html+='<div class="card"><h3 style="font-size:1.05rem">גלישות השנה</h3>'+
    '<p class="hint">מקצועות שמבחן כבר ישב על שעתם. הכלי ידחוק משבצת '+
    'שתגזול אותם שוב.</p>'+
    '<div class="tblwrap"><table><thead><tr><th>מקצוע</th>'+
    '<th style="width:90px">פעמים</th></tr></thead><tbody>'+
    keys.map(k=>'<tr><td>'+esc(k)+'</td><td>'+dsp[k]+'</td></tr>').join('')+
    '</tbody></table></div></div>';
  return html;
}

/* ============================================================
   מבחן חדש
   ============================================================ */
/* יום נבחר מן הלוח: הטווח מצטמצם אליו והחיפוש רץ מיד — הרכז
   שלחץ על תאריך כבר אמר מה הוא רוצה, ואין טעם לבקש ממנו טווח. */
function openNew(date,allowBlocked,asTask){
  if(VIEW) return;
  /* v1.8.0 — רשימה ריקה אינה חוסמת יותר: אפשר להקליד שם מקצוע.
     ⚠ בלי מערכת שעות אין כיסוי ואין דירוג, וההערה בטופס אומרת זאת. */
  const subs=subjectList();
  const t=new Date(), plus=addD(t,21);
  MOVE=null;
  /* לחיצה על יום חסום מדליקה את הדגל מעצמה: מי שלחץ על אמצע
     חופשת פסח כבר אמר מה הוא רוצה. */
  FORM={base:subs.length?subs[0].base:'', level:'', scope:'grade', cls:CLASSES[0],
        from:date||iso(t), to:date||iso(plus), oneDay:!!date,
        allowBlocked:!!allowBlocked, hours:[], units:[],
        /* v1.18.0 — בשבת אין מבחן, ולכן היא נפתחת כהגשה */
        kind: asTask?'task':'exam', refBase:'', refCluster:'', groupName:'', groupCls:[],
        title:'', notes:'',
        /* v1.8.0 — ברירת המחדל: שעות המקצוע במערכת */
        hmode:'auto'};
  CAND=[];SEARCHED=false; PICK=null;
  if(date) buildCandidates();

}

/* ============================================================
   העברת מבחן קיים
   ------------------------------------------------------------
   אותו מנוע בדיוק, ובסוף PATCH במקום POST. הגלישה מחושבת מחדש
   לפי המשבצת החדשה, אחרת "גלישות השנה" היה ממשיך לספור מקצוע
   שכבר אינו נגזל.
   ============================================================ */
function startMove(id){
  const e=BOARD.find(x=>String(x.id)===String(id));
  if(!e||VIEW) return;
  MOVE=e;
  /* v1.17.0 — נפתח לעריכה; החיפוש הוא קישור בתוך הטופס.
     ⚠ היקף חופשי נשמר כ-class עם שם שאינו כיתה אמיתית; בפתיחה הוא
     חוזר להיות "היקף אחר", אחרת בורר הכיתות היה מציג את הכיתה
     הראשונה ולחיצה אחת הייתה מוחקת את "גוש 2". */
  const t=new Date(), plus=addD(t,28);
  const realCls = CLASSES.indexOf(e.class_name)>-1;
  const freeScope = e.scope==='class' && e.class_name && !realCls;
  FORM={base:splitUnit(e.subject_base).fam, units:unitsOfExam(e),
        scope: freeScope?'other':e.scope,
        groupName: freeScope?e.class_name:'', groupCls:[],
        /* v1.11.0 — הגשה נשארת הגשה גם בהעברה לתאריך אחר */
        kind:isTask(e)?'task':'exam',
        title:e.title||'', notes:e.notes||'',
        cls:e.class_name||CLASSES[0], from:e.exam_date, to:e.exam_date,
        oneDay:false, searching:false,
        allowBlocked:false,
        /* מבחן בהעברה שומר על שעותיו — הן מסומנות מראש בריבועים,
           ולכן הוא נפתח במצב "שעות שאבחר" ולא לפי המערכת. */
        hmode:'pick',
        hours:(function(){ const a=[],s1=e.hour||1,s2=e.hour_end||s1;
          for(let k=s1;k<=s2;k++) if(k<=8) a.push(k); return a; })()};
  CAND=[];SEARCHED=false; PICK=null;
  drawModal();
}
/* ============================================================
   v1.8.0 · בורר המקצוע בהקלדה
   ------------------------------------------------------------
   ⚠ הרשימה נסגרת ב-onblur, ולכן הבחירה תלויה ב-mousedown ולא
   ב-click: click רץ אחרי blur, והשורה כבר נעלמה עד שהוא מגיע.
   ⚠ הטופס אינו מצויר מחדש בכל הקלדה — רק תוכן הרשימה מתעדכן.
   ציור מחדש היה מוציא את המיקוד מן השדה באמצע ההקלדה.
   ============================================================ */
function subFilter(q, all){
  const box=el('subList'); if(!box) return;
  const t=tidy(q), list=subjectList();
  /* ⚠ לחיצה על השדה פותחת את הרשימה כולה, גם כשיש בו ערך:
     בורר שמראה רק את מה שכבר נבחר אינו בורר. ההקלדה מסננת. */
  const hit = (all || !t) ? list : list.filter(x=>x.base.indexOf(t)>-1);
  const exact=list.some(x=>same(x.base,t));
  SUBOPTS=hit.slice(0,60).map(x=>x.base);
  let h=SUBOPTS.map((b,i)=>{
    const o=hit[i];
    return '<div class="opt" onmousedown="subPick('+i+')">'+esc(b)+
      (o&&!o.inTT?'<span class="sub">'+(o.src==='extra'?'נוסף בהקלדה'
        :o.src==='cluster'?((clusterOf(b)||{}).name||'בחירה'):'לא במערכת השעות')+
        '</span>':'')+
      /* v1.9.0 — מחיקת מקצוע שהוקלד. רק הוקלד: מקצוע מן המערכת או
         מלוח המבחנים אינו ניתן למחיקה מכאן. */
      (o&&o.src==='extra'?'<span class="rm" title="הסרה מהרשימה" '+
        'onmousedown="event.stopPropagation();subDrop('+i+')">✕</span>':'')+
      '</div>';
  }).join('');
  if(!SUBOPTS.length) h+='<div class="none">אין מקצוע בשם הזה ברשימה.</div>';
  if(t && !exact) h+='<div class="opt new" onmousedown="subPick(-1)">➕ הוספת «'+
    esc(t)+'» כמקצוע חדש</div>';
  box.innerHTML=h; box.hidden=false; SUBSEL=-1;
}
function subClose(){ const b=el('subList'); if(b) b.hidden=true; SUBSEL=-1; }
function subDrop(i){
  const name=SUBOPTS[i]; if(!name) return;
  try{ localStorage.setItem(XKEY(),
    JSON.stringify(extraSubjects().filter(x=>!same(x,name)))); }catch(e){}
  const inp=el('subIn');
  subFilter(inp?inp.value:'', true);
  if(inp) inp.focus();
}
function subPick(i){
  const inp=el('subIn'); if(!inp) return;
  const v = i>=0 ? SUBOPTS[i] : inp.value;
  subClose(); commitSubject(v);
}
/* ⚠ השהיה קצרה לפני הסגירה: בלעדיה הרשימה נעלמת לפני שהלחיצה
   על שורה נרשמת בטלפון. */
function subBlur(){ setTimeout(()=>{ const i=el('subIn'); subClose();
  if(i) commitSubject(i.value); }, 140); }
function subKey(ev){
  const box=el('subList'); const rows=box?box.querySelectorAll('.opt'):[];
  if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){
    ev.preventDefault();
    if(!rows.length) return;
    SUBSEL=Math.max(0,Math.min(rows.length-1,SUBSEL+(ev.key==='ArrowDown'?1:-1)));
    rows.forEach((r,i)=>r.classList.toggle('sel',i===SUBSEL));
    rows[SUBSEL].scrollIntoView({block:'nearest'});
  }else if(ev.key==='Enter'){
    ev.preventDefault();
    if(SUBSEL>-1 && rows[SUBSEL]) rows[SUBSEL].dispatchEvent(new MouseEvent('mousedown'));
    else { subClose(); commitSubject(el('subIn').value); }
  }else if(ev.key==='Escape'){ subClose(); }
}
/* מקצוע שאינו ברשימה נוסף אליה ונבחר. ⚠ שם ריק מחזיר את הקודם —
   שדה שהתרוקן בטעות לא ימחק את הבחירה. */
function commitSubject(name){
  const t=tidy(name), inp=el('subIn');
  if(!t){ if(inp) inp.value=FORM.base; return; }
  if(same(t,FORM.base)){ if(inp) inp.value=FORM.base; return; }
  const m=subjectList().find(x=>same(x.base,t));
  const base=m?m.base:t;
  if(!m) addExtraSubject(base);
  FORM.base=base; FORM.units=[];
  /* v1.13.0 — מקצוע שאין לו שעות במערכת: "לפי מקצוע אחר" עדיף על
     "כל השעות", שהוא ניחוש. אם אין מערכת בכלל — נשארים בכל השעות. */
  /* v1.15.0 — מקצוע מן הרשימות מזוהה מיד: אשכול, היקף ושעות.
     ⚠ מקצוע שכל כיתות השכבה לומדות אינו קבוצת בחירה גם אם הוא
     ברשימה — "תקשורת" במגמת תקשורת הוא של כולם. */
  const c=clusterOf(base), mine=famClasses(base);
  FORM.refBase=''; FORM.refCluster='';
  if(c && c.fams.length && (mine===0 || mine<CLASSES.length)){
    FORM.refCluster=c.key;
    if(FORM.hmode!=='pick') FORM.hmode='ref';
    /* ⚠ מסומן כאוטומטי, כדי שהחלפה למקצוע רגיל תחזיר את ההיקף.
       בחירה ידנית של הרכז אינה נדרסת. */
    if(FORM.scope!=='class'){ FORM.scope='elective'; FORM.scopeAuto=true; }
  }else{
    if(FORM.scopeAuto && FORM.scope==='elective'){ FORM.scope='grade'; FORM.scopeAuto=false; }
    const rec=recalledRef(base);
    FORM.refBase = rec.indexOf(CPFX)===0 ? '' : rec;
    if(HMODE()!=='pick' && !inTimetable(base))
      FORM.hmode = (FORM.refBase || subjectList().some(x=>x.inTT)) ? 'ref' : 'all';
    else if(HMODE()==='ref' && inTimetable(base) && !FORM.refBase) FORM.hmode='auto';
  }
  CAND=[];SEARCHED=false; PICK=null; drawModal();
}

/* v1.19.1 — תרגום שגיאת מסד לאירועים, לפי קוד ולא לפי שם הטבלה */
function evHint(msg){
  const m=String(msg||'');
  /* ⚠ סדר הבדיקות חשוב: "does not exist" מופיע גם בשגיאת עמודה,
     ולכן עמודה נבדקת ראשונה. */
  if(/42703|column .* does not exist/i.test(m))
    return 'עמודה חסרה בטבלה. הריצו שוב את exam_events-v1.19.0.sql.';
  if(/PGRST205|42P01|schema cache|relation .* does not exist/i.test(m))
    return 'הטבלה exam_events אינה מוכרת ל-API. הריצו: '+
           "notify pgrst, 'reload schema';  — ואם לא עזר, הריצו שוב את "+
           'exam_events-v1.19.0.sql.';
  if(/42501|row-level security|permission denied/i.test(m))
    return 'המסד חוסם כתיבה לטבלה (RLS או הרשאות). ראו את ה-SQL של v1.19.1.';
  return 'שגיאה מן המסד: '+m.slice(0,200);
}

async function saveEvent(){
  const err=el('evErr');
  const title=tidy(el('evTitle').value);
  let from=el('evFrom').value, to=el('evTo').value;
  if(!title){ err.textContent='כתבו שם לאירוע.'; return; }
  if(!from){ err.textContent='בחרו תאריך התחלה.'; return; }
  if(!to) to=from;
  /* ⚠ סיום לפני התחלה מיושר בשקט, כמו בטווח השעות */
  if(to<from) to=from;
  const row={year_start:YEAR, grade:GRADE, title:title,
    start_date:from, end_date:to, no_exams:el('evBlk').checked,
    notes:tidy(el('evNote').value)||null, updated_at:new Date().toISOString()};
  const b=el('evBtn'); b.disabled=true; b.textContent='שומר…';
  try{
    if(EV_ID) await api('exam_events?id=eq.'+encodeURIComponent(EV_ID),
      {method:'PATCH',body:JSON.stringify(row)});
    else      await api('exam_events',{method:'POST',body:JSON.stringify([row])});
    EV_ID=null; closeModal(); await loadAll(); if(ALLMODE) await loadAllGrades(); render();
  }catch(e){
    err.textContent=evHint(e.message);

    console.error('exam_events', e.message);

  }
}
async function delEvent(id){
  const e=EVENTS.find(x=>String(x.id)===String(id));
  if(!confirm('למחוק את האירוע "'+(e?e.title:'')+'"?')) return;
  try{
    await api('exam_events?id=eq.'+encodeURIComponent(id),{method:'DELETE'});
    EV_ID=null; closeModal(); await loadAll(); if(ALLMODE) await loadAllGrades(); render();
  }catch(err){ console.error('exam_events', err.message); alert(evHint(err.message)); }
}

    '</div><div id="mErr" class="msg no"></div>';
  spanChanged();

/* v1.5.0 — הטווח מחשב מחדש את הגלישה בזמן אמת. הרכז שמאריך מבחן
   משעה אחת לשלוש רואה מיד על מה הוא גולש עכשיו, ולא אחרי השמירה. */
function spanChanged(){
  if(!PICK) return;
  const inf=el('spanInfo'); if(!inf) return;
  let h1=parseInt(el('fH1').value,10)||PICK.hour;
  let h2=parseInt(el('fH2').value,10)||h1;
  h1=Math.max(1,Math.min(10,h1)); h2=Math.max(1,Math.min(10,h2));
  /* ⚠ סיום לפני התחלה הוא טעות הקלדה נפוצה. מיישרים בשקט במקום
     לחסום, ומודיעים — חסימה כאן רק מעצבנת. */
  if(h2<h1){ h2=h1; el('fH2').value=h2; }
  el('fH1').value=h1;
  const n=h2-h1+1;
  const m=dispMap(PICK.day,h1,h2), dl=Object.keys(m.by);
  const prev=displacedSoFar(), rep2=dl.filter(x=>prev[x]);
  inf.innerHTML='<b>'+n+' '+(n===1?'שעה':'שעות')+'</b> — '+
    (dl.length
      ? '<span style="color:'+(rep2.length?'var(--no)':'var(--warn)')+'">'+
        dispText(m, rep2)+'</span>'
      : 'כל הכיתות במקצוע לאורך כל הטווח — אין גלישה.');
}

const H1=()=>{ const v=parseInt(el('fH1')?el('fH1').value:PICK.hour,10);
  return Math.max(1,Math.min(10,v||PICK.hour)); };
/* ⚠ הנפילה לאחור היא hourEnd ולא hour: בשמירה מהירה אין שדות על
   המסך, ומשבצת 3–4 הייתה נשמרת כ-3–3. */
const H2=()=>{ const d=PICK.hourEnd||PICK.hour;
  const v=parseInt(el('fH2')?el('fH2').value:d,10);
  return Math.max(H1(),Math.min(10,v||d)); };

/* btn — הכפתור שנלחץ. במסך האישור זה svBtn, ובשמירה מהירה זה
   הכפתור שבתוך המשבצת. */
/* שם ברירת המחדל של מבחן, כשלא נכתב אחר */
const defTitle = () => (FORM.base||'')+
  (UNITS().length?' '+UNITS().join('-')+' יח״ל':'');
/* ⚠ מסך האישור גובר על הטופס: אם הוא פתוח, מה שנכתב בו הוא האחרון. */
const fieldVal = (id, fallback) => {
  const e=el(id);
  return tidy(e ? e.value : (fallback||''));
};

/* v1.16.0 — היקף חופשי נשמר כ-class עם שם חופשי; ראה הערת הגרסה. */
const groupLabel = () => tidy((el('grpName')&&el('grpName').value) || FORM.groupName ||
  ((FORM.groupCls||[]).join(' · ')) || 'קבוצה');
const saveScope = () => FORM.scope==='other' ? 'class' : FORM.scope;
const saveClass = () => FORM.scope==='other' ? groupLabel()
                      : FORM.scope==='class' ? FORM.cls : null;

async function saveExam(btn){
  if(!PICK) return;

  const row={year_start:YEAR, grade:GRADE, scope:saveScope(), class_name:saveClass(),
    subject_base:FORM.base,
    level:UNITS().length?UNITS().map(u=>u+' יח״ל').join(', '):null,
    exam_date:PICK.date, hour:H1(), hour_end:H2(),
    title:fieldVal('fTitle', FORM.title) || fieldVal('mTitle', FORM.title) ||
          defTitle() || FORM.base,
    notes:(fieldVal('fNote', FORM.notes) || fieldVal('mNote', FORM.notes)) || null,
    /* הגלישה נרשמת לכל טווח השעות, לא לשעה הראשונה בלבד. */
    displaced:(function(){ const dl=dispForSpan(PICK.date,PICK.day,H1(),H2());
      return dl.length?dl.join(', '):null; })(),
    /* כל שמירה מצד הרכז היא אישור: יצירה, העברה, וגם שיבוץ
       של בקשת חלון — שבה הטווח מתנקה כי כבר יש תאריך. */
    status:'approved', window_start:null, window_end:null,
    updated_at:new Date().toISOString()};
  const b=btn||el('svBtn'), was=b?b.textContent:'';
  if(b){ b.disabled=true; b.textContent='שומר…'; }
  try{
    if(MOVE) await api('exam_board?id=eq.'+encodeURIComponent(MOVE.id),
      {method:'PATCH',body:JSON.stringify(row)});
    else     await api('exam_board',{method:'POST',body:JSON.stringify([row])});
    MOVE=null; closeModal(); await loadAll(); render();
  }catch(e){
    /* ⚠ mErr קיים במסך האישור בלבד; בשמירה מהירה אין לאן לכתוב. */
    const m=el('mErr'), t=dbHint(e.message);
    if(m) m.textContent=t; else alert(t);
    if(b){ b.disabled=false; b.textContent=was; }
  }
}

/* v1.12.1 — שגיאת מסד בשפה של הרכז, עם מה שצריך לעשות.
   ⚠ הרכז אינו קורא JSON של PostgREST, והשגיאה הגולמית נראית
   כמו תקלה בכלי ולא כמו הגדרה חסרה. */
function dbHint(msg){
  const m=String(msg||'');
  if(/exam_board_scope_check|exam_board_check/.test(m))
    return 'המסד עדיין אינו מאפשר את ההיקף "מקצוע בחירה". '+
           'צריך להריץ את פקודת ה-SQL של v1.12.1 (רשומה בראש הקובץ), '+
           'או לבחור בינתיים "כל השכבה".';
  if(/23502|not-null|not null|null value/i.test(m))
    return 'עמודת "שעה" במסד מוגדרת חובה, ולכן אי אפשר לשמור הגשה בלי שעה. '+
           'צריך להריץ: alter table exam_board alter column hour drop not null;';
  if(/exam_board_hour_check/.test(m))
    return 'שעת המבחן חייבת להיות בין 1 ל-10.';
  return 'שגיאה: '+m.slice(0,140);
}

async function approveExam(id){

    await api('exam_board?id=eq.'+encodeURIComponent(id),
      {method:'PATCH', body:JSON.stringify({status:'approved',
        updated_at:new Date().toISOString()})});
    closeModal(); await loadAll(); render();
  }catch(err){ alert('שגיאה: '+err.message); }
}
async function rejectExam(id){
  const e=BOARD.find(x=>String(x.id)===String(id));
  if(!confirm('לדחות את הבקשה של '+((e&&e.requested_by)||'המורה')+'?\n\n'+
    'הבקשה תימחק והמורה לא יקבל הודעה — כדאי לומר לו.')) return;
  try{
    /* מחיקה עם תנאי סטטוס: מסך מיושן לא ימחק מבחן שאושר בינתיים. */
    await api('exam_board?id=eq.'+encodeURIComponent(id)+'&status=eq.draft',
      {method:'DELETE'});
    closeModal(); await loadAll(); render();
  }catch(err){ alert('שגיאה: '+err.message); }
}

/* שיבוץ בקשת חלון — מנוע ההעברה הקיים, מוגבל לטווח שביקש המורה. */

  FORM={base:splitUnit(e.subject_base).fam, units:unitsOfExam(e), scope:e.scope,
        cls:e.class_name||CLASSES[0], title:e.title||'', notes:e.notes||'',

/* לחיצה על שורת בקשת חלון — מדליקה ומכבה את הטווח בלוח. */
function hlWindow(id){
  const e=BOARD.find(x=>String(x.id)===String(id)); if(!e) return;
  if(HLWIN && String(HLWIN.id)===String(id)){ HLWIN=null; render(); return; }
  HLWIN=e;
  /* אם הטווח מתחיל בחודש אחר, קופצים אליו — אחרת הלחיצה
     נראית כאילו לא עשתה כלום. */
  const st=fromIso(e.window_start);
  if(!MONTH || MONTH.y!==st.getFullYear() || MONTH.m!==st.getMonth())
    MONTH={y:st.getFullYear(), m:st.getMonth()};

  const c=document.querySelector('.cell.win');
  if(c && c.scrollIntoView) c.scrollIntoView({behavior:'smooth', block:'center'});
}

      'מי שיפתח את הקישור יראה "הלוח בבנייה".')) return;
  const row={year_start:YEAR, grade:GRADE, published:on,
             published_at:on?new Date().toISOString():null};

async function loadAllGrades(){

function togGrade(g){ GOFF[g]=!GOFF[g]; render(); }
const gradeOn = g => !GOFF[g];

/* כל הפריטים של יום אחד, מכל השכבות */
function allItemsOn(sIso){
  const out=[];
  ALLB.filter(e=>e.exam_date===sIso && e.status!=='draft' && e.exam_date)
      .forEach(e=>out.push({g:e.grade, kind:isTask(e)?'task':'exam', row:e,
        label:(tidy(e.title)||e.subject_base)}));
  ALLE.filter(e=>e.start_date<=sIso && sIso<=e.end_date)
      .forEach(e=>out.push({g:e.grade, kind:'event', row:e, label:e.title}));
  return out.filter(x=>gradeOn(x.g))
            .sort((a,b)=>GRADES.indexOf(a.g)-GRADES.indexOf(b.g));
}

            (tidy(x.row.notes)?' · '+x.row.notes:''))+'">'+

          (x.kind==='task'?'📄 ':x.kind==='event'?'★ ':'')+esc(x.label)+'</span>').join('')+

/* סיכום חטיבתי לחודש המוצג */
function divSummary(){
  const first=new Date(MONTH.y,MONTH.m,1), last=new Date(MONTH.y,MONTH.m+1,0);
  const a=iso(first), b=iso(last);
  const row={};
  GRADES.forEach(g=>{ row[g]={exam:0,task:0,ev:0,days:{}}; });
  ALLB.filter(e=>e.status!=='draft' && e.exam_date && a<=e.exam_date && e.exam_date<=b)
    .forEach(e=>{ const r=row[e.grade]; if(!r) return;
      if(isTask(e)) r.task++; else r.exam++;
      r.days[e.exam_date]=(r.days[e.exam_date]||0)+1; });
  ALLE.forEach(e=>{
    const r=row[e.grade]; if(!r) return;
    let d=fromIso(e.start_date>a?e.start_date:a), end=fromIso(e.end_date<b?e.end_date:b);
    if(end<d) return;
    r.ev++;
    while(d<=end){ r.days[iso(d)]=(r.days[iso(d)]||0)+1; d=addD(d,1); }
  });
  const busy=g=>Object.keys(row[g].days).filter(k=>row[g].days[k]>1).length;

  const block=(name,list)=>{
    const tot=list.reduce((o,g)=>({exam:o.exam+row[g].exam,task:o.task+row[g].task,
      ev:o.ev+row[g].ev}),{exam:0,task:0,ev:0});
    return '<h3 style="font-size:1rem;margin:14px 0 6px">'+esc(name)+'</h3>'+
      '<div class="tblwrap"><table><thead><tr><th>שכבה</th><th>מבחנים</th>'+
      '<th>הגשות</th><th>אירועים</th><th>ימים עמוסים</th></tr></thead><tbody>'+
      list.map(g=>'<tr><td><span class="gchip sm" style="background:'+gcol(g).bg+
        ';color:'+gcol(g).ink+'">'+esc(g)+'</span></td>'+
        '<td>'+row[g].exam+'</td><td>'+row[g].task+'</td><td>'+row[g].ev+'</td>'+
        '<td>'+busy(g)+'</td></tr>').join('')+
      '<tr style="font-weight:800;background:#faf9fd"><td>סה״כ</td><td>'+tot.exam+
      '</td><td>'+tot.task+'</td><td>'+tot.ev+'</td><td></td></tr>'+
      '</tbody></table></div>';
  };
  return '<div class="card"><h3 style="font-size:1.05rem">סיכום חטיבתי · '+
    esc(monthLabel())+'</h3>'+
    '<p class="hint">"ימים עמוסים" — ימים שיש בהם יותר מפריט אחד באותה שכבה.</p>'+
    block('חטיבת ביניים', GRADES.filter(g=>JUNIOR.indexOf(g)>-1))+
    block('חטיבה עליונה', GRADES.filter(g=>JUNIOR.indexOf(g)<0))+
    '</div>';
}

function render(){
  if(ALLMODE){ el('app').innerHTML=allScreen(); return; }
  if(!CLASSES.length){
    el('app').innerHTML='<div class="card"><div class="empty-state">'+
      'אין מערכת לשכבה '+esc(GRADE)+' בשנת '+yearLabel(YEAR)+'.<br>'+
      '<a href="mivchanim-import.html" style="color:var(--a)">למסך הייבוא ←</a>'+
      '</div></div>';
    return;
  }
  el('app').innerHTML=calScreen();
}

async function boot(){
  el('app').innerHTML='<div class="empty-state">טוען…</div>';
  el('yearLbl').textContent=yearLabel(YEAR);
  try{
    await loadAll();
    if(!MONTH){ const t=new Date(); MONTH={y:t.getFullYear(),m:t.getMonth()}; }
    render();
  }catch(e){
    el('app').innerHTML='<div class="card"><div class="empty-state">שגיאה: '+
      esc(e.message)+'</div></div>';
  }
}

(function init(){
  const q=new URLSearchParams(location.search);
  if(q.get('grade')) GRADE=q.get('grade');
  if(q.get('year')) YEAR=parseInt(q.get('year'),10);
  VIEW=q.get('view')==='1';
  if(VIEW) document.body.classList.add('viewonly');
  el('gradeSel').innerHTML=GRADES.map(g=>'<option'+(g===GRADE?' selected':'')+'>'+g+
    '</option>').join('');
  boot();
})();
</script>
</body>
</html>
