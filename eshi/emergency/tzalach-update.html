<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>עדכון תיק צל"ח · v1.0.0</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f8;--card:#fff;--ink:#0f1f3d;--muted:#5d6b85;--line:#dbe2ee;--navy:#0b2560;--blue:#1d5fb8;--ok:#15803d;--okbg:#e7f6ec;--bad:#c62828;--badbg:#fdecec;--sec:#6d28d9;--secbg:#f3edff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,system-ui,sans-serif}
button,input,textarea,select{font-family:inherit}
.hdr{background:linear-gradient(135deg,#0b2560,#1d4f9a);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
.hdr .in{max-width:860px;margin:0 auto}
.hdr h1{margin:0;font-size:20px;font-weight:900}
.hdr small{font-size:13px;opacity:.85}
.prog{display:flex;gap:4px;margin-top:10px}
.prog i{flex:1;height:7px;border-radius:9px;background:rgba(255,255,255,.22);cursor:pointer}
.prog i.d{background:#7dd3a0}.prog i.c{background:#ffd36b}
.wrap{max-width:860px;margin:0 auto;padding:12px 12px 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 2px 6px rgba(10,30,70,.04)}
.card h2{margin:0 0 6px;font-size:19px;font-weight:900;color:var(--navy)}
.card h3{margin:0 0 6px;font-size:16px;font-weight:900;color:var(--navy)}
.card h3 small{font-weight:600;color:var(--muted);font-size:13px}
.muted{color:var(--muted);font-size:13.5px;line-height:1.55}
.ed{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin:4px 0 8px}
.ed .w{grid-column:1/-1}
.ed label{font-size:12px;font-weight:700;color:var(--muted)}
input.t,textarea.t,select.t{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-size:15px;background:#fff}
input.t:focus,textarea.t:focus{border-color:var(--blue);outline:0}
textarea.t{min-height:70px;line-height:1.55}
.pl{display:inline-block;font-size:12px;color:var(--blue);background:#e8f0fc;border-radius:99px;padding:2px 9px;font-weight:800;margin-top:4px}
.btn{border:0;border-radius:11px;padding:10px 16px;font-size:15.5px;font-weight:800;cursor:pointer;background:var(--blue);color:#fff}
.btn.sec{background:#e9eef6;color:var(--ink)}.btn.bad{background:var(--badbg);color:var(--bad)}.btn.ok{background:var(--ok)}.btn.pur{background:var(--sec)}.btn.sm{padding:6px 10px;font-size:13.5px}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.it{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:#fbfcfe}
.it .x{float:left}
.done{border-color:#9ad6ae;background:#f6fcf8}
.chk{font-size:13px;color:var(--ok);font-weight:800}
.secn{background:var(--secbg);border:1px solid #d9c8fb;color:#4c1d95;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:10px;line-height:1.6}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px;z-index:6}

.toast.show{opacity:1}

footer{text-align:center;color:var(--muted);font-size:12px;padding:8px 0}

  <div class="prog hidden" id="prog"></div>
</div></div>

</div></div>
<div class="toast" id="toast"></div>

<script>
/* ===================== חיבור ===================== */
const SB_URL = 'https://skfriefqnoxfzmamcokd.supabase.co';
const SB_KEY = 'sb_publishable_Qx7EDPbdyYE9iv7uMQBKhQ_Aeojd_Q0';
async function api(path, opts = {}){
  const headers = { apikey: SB_KEY, 'Content-Type': 'application/json', Prefer: opts.prefer || '' };
  if(SB_KEY.startsWith('eyJ')) headers.Authorization = 'Bearer ' + SB_KEY;
  const r = await fetch(SB_URL + '/rest/v1/' + path, { ...opts, headers });
  if(!r.ok) throw new Error(await r.text());
  const t = await r.text(); return t ? JSON.parse(t) : null;
}
const rpc = (fn, args) => api('rpc/' + fn, { method:'POST', body: JSON.stringify(args) });
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }
const uid = () => 'x-' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const LS = { get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }, set(k,v){ try{ v==null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };

/* ===================== מבנה התיק — זהה ל-tzalach.html ===================== */
const PAIR = ['ראשי/ת','ממלא/ת מקום בעת הצורך'];
const ROLES = [
 ['head','ראש הצל"ח','מנהל המוסד החינוכי',PAIR],['deputy','סגן ראש הצל"ח','סגן המנהל',PAIR],['counsel_head','מרכז צוות הייעוץ','',PAIR],
 ['parents','איש קשר להורי המוסד החינוכי','רכז + צוות',PAIR],['secretary','מזכיר הצוות','מזכיר הצל"ח – מזכירת בית הספר',PAIR],['secretary2','מזכירת הצל"ח','',PAIR],
 ['external','איש קשר עם גורמי חוץ','',PAIR],['counselor','יועץ חינוכי','יועצ/ת',PAIR],['psych','פסיכולוג המוסד החינוכי מטעם השפ"ח','פסיכולוג/ית',PAIR],
 ['social','רכז/ת חברתי','',PAIR],['security','רכז בטחון','',PAIR],['firstaid','מגישי עזרה ראשונה','',['מגיש/ה','מגיש/ה','מגיש/ה']],
 ['media','איש קשר עם התקשורת','',PAIR],['supervisor','מפקח','',['מפקח/ת']],['other','אחר','',PAIR]];
const PF = [['name','שם'],['mobile','טלפון נייד','tel'],['home','טלפון בבית','tel'],['email','דוא"ל'],['address','כתובת']];
const CONTACTS = [['city_ceo','מנכ"ל העירייה'],['ops','ראש מטה חירום'],['shefach','מנהל שפ"ח'],['edu','מנהל מחלקת חינוך'],['kabat','אחראי בטחון (קב"ט הרשות)'],['transport','אגף הסעות'],['welfare','אגף הרווחה']];
const CF = [['name','שם ושם משפחה'],['email','דואר אלקטרוני'],['mobile','נייד','tel'],['office','משרד','tel']];
const VF = [['name','שם ושם משפחה'],['role','תפקיד'],['address','כתובת'],['mobile','טלפון נייד','tel'],['avail','מועדי זמינות']];
const SF = [['name','שם איש צוות'],['role','תפקיד / מקצוע'],['mobile','טלפון נייד','tel'],['home','טלפון בבית','tel'],['address','כתובת מגורים'],['email','כתובת דואר אלקטרוני'],['notes','רגישויות מיוחדות והערות']];
const BRIEFS = ['בעת אירוע חירום - ניהול סדר היום ומפגשי הצל"ח','תדריך מקוצר למורים לקראת כניסה לכיתה בעקבות אסון','תדריך מפורט למורים לקראת כניסה לכיתה בעקבות אסון','תדריך מפורט למורים לקראת כניסה לכיתה בתקופת מתיחות ביטחונית','תדריך לעבודה עם הצוות החינוכי לפני כניסה לכיתה ולקראת חזרה לשגרה','מסרים בוני חוסן להתמודדות עם משבר','מיפוי מעגלי פְּגִיעוּת','ייעוץ טלפוני בזמן משבר','הנחיות לכתיבת מכתב בית ספרי להורים זמן משבר','איך לדבר על משבר? סיוע הורים לילדיהם בתקופות של חירום בטחוני','איך לדבר על משבר? סיוע הורים לילדיהם בעקבות אסון אישי במשפחה','איך מתווכים לתלמידים את טקס ההלוויה ואת מנהג ניחום האבלים ?','תדריך לאיש חינוך המלווה תלמיד אשר חווה אובדן','ליווי מתמשך ולאורך זמן של תלמיד שמתמודד עם אובדן'];
const RULES = ['חוזר מנכ"ל - נוהלי שעת חירום במערכת החינוך','אוגדן מקצועי לרכז ביטחון, בטיחות ושעת חירום במוסד החינוכי , אגף בכיר לביטחון, שעת חירום ובטיחות סביבתית, אגף הביטחון, משה"ח.','נהלי עבודת המאבטח ריכוז נהלי אבטחה למאבטח מוסדות חינוך','ביטחון ובטיחות בטיולים ובפעילויות חוץ בית-ספריות','נוהל טיפול באירוע חירום עם תלמידים בטיולים ובפעילות חוץ'];

const STEPS = [
  ['school','🏫 פרטי המוסד'],['roles','👥 בעלי תפקידים'],['contacts','🏛️ גורמי קשר ברשות'],['vol','🙋 מתנדבים'],
  ['staff','🧑‍🏫 צוות'],['links','🔗 קישורים'],['secure','🔒 מיפוי ותלמידים'],['save','✅ סיכום ושמירה']];

/* ===================== מצב ===================== */
let CODE = null, LEVEL = null, STEP = 0, D = null, ORIG = null, SEC = null, SECORIG = null, STUDENTS = [];
// D = טיוטה: { school:{}, roles:{k:[p..]}, contacts:{k:{}}, extra:[{key,...}], vol:[{key,...}], staff:[...], links:{brief:[], rule:[]} }

function fromDB(set, ent){
  const k = kind => ent.filter(e => e.kind === kind).sort((a,b)=>(a.sort||0)-(b.sort||0));
  const d = { school:{ school:set.school||'', principal:set.principal||'', symbol:set.symbol||'' }, roles:{}, contacts:{}, extra:[], vol:[], staff:[], links:{ brief:[], rule:[] } };
  ROLES.forEach(([key,,,L]) => { const p = ((k('role').find(e=>e.key===key)||{}).data||{}).p || []; d.roles[key] = L.map((_,i) => Object.assign({}, p[i]||{})); });
  CONTACTS.forEach(([key]) => d.contacts[key] = Object.assign({}, (k('contact').find(e=>e.key===key)||{}).data||{}));
  d.extra = k('contact').filter(e => e.key.startsWith('x-')).map(e => Object.assign({ key:e.key }, e.data));
  d.vol = k('vol').map(e => Object.assign({ key:e.key }, e.data));
  d.staff = k('staff').map(e => Object.assign({ key:e.key }, e.data)).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'he'));
  BRIEFS.forEach((_,i) => d.links.brief[i] = ((k('brief').find(e=>e.key===String(i))||{}).data||{}).url || '');
  RULES.forEach((_,i) => d.links.rule[i]  = ((k('rule').find(e=>e.key===String(i))||{}).data||{}).url || '');
  return d;
}
const saveDraft = () => LS.set('tzu_draft', { at:new Date().toISOString(), D });

/* ===================== כניסה ===================== */
function gate(){
  $('view').innerHTML = `<div class="card" style="max-width:420px;margin:30px auto"><h2>כניסה לעדכון התיק</h2>
    <p class="muted">הקלידו קוד מנהל. מי שמקליד את קוד האזור המוגן יוכל לעדכן גם את מיפוי הפגיעות ואת פרטי התלמידים.</p>
    <input class="t" id="gCode" style="-webkit-text-security:disc;font-size:18px" onkeydown="if(event.key==='Enter')enter()">
    <button class="btn" style="width:100%;margin-top:10px" id="gBtn" onclick="enter()">כניסה</button><div class="muted" id="gMsg" style="margin-top:8px;font-weight:700"></div></div>`;
}
async function enter(){
  const c = $('gCode').value.trim(), m = $('gMsg'); if(!c){ m.textContent='הקלידו קוד'; return; }
  m.textContent = 'בודק…'; $('gBtn').disabled = true;
  try{ LEVEL = await rpc('tz_role', { p_code:c }); }catch(e){ m.textContent = 'אין חיבור, או שקובץ ה-SQL v2 עוד לא הורץ.'; $('gBtn').disabled = false; return; }
  $('gBtn').disabled = false;
  if(!LEVEL){ m.textContent = 'קוד שגוי'; return; }
  CODE = c; m.textContent = 'טוען את התיק…';
  try{
    const [s, e] = await Promise.all([api('tz_settings?select=*&id=eq.1'), api('tz_entries?select=*')]);
    ORIG = { set:(s||[])[0]||{}, ent:e||[] };
    const fresh = fromDB(ORIG.set, ORIG.ent), dr = LS.get('tzu_draft');
    D = fresh;
    if(dr && dr.D && confirm('נמצאה טיוטה שלא נשמרה מ-' + new Date(dr.at).toLocaleString('he-IL') + '.\nלהמשיך ממנה?')) D = dr.D;
    if(LEVEL === 'secure'){
      try{ STUDENTS = await api('students?select=id,name,class&active=eq.true&order=name') || []; }catch(_){ STUDENTS = []; }
      SECORIG = await rpc('tz_sec_list', { p_code:CODE }) || [];
      SEC = { vuln: SECORIG.filter(r=>r.kind==='vuln').map(r => Object.assign({ key:r.key }, r.data)),
              stu: Object.fromEntries(SECORIG.filter(r=>r.kind==='stu').map(r => [r.key, Object.assign({}, r.data)])) };
    }
  }catch(err){ m.textContent = 'שגיאה בטעינה: ' + String(err.message).slice(0,100); return; }
  $('prog').classList.remove('hidden'); $('nav').classList.remove('hidden');
  draw();
}

/* ===================== ניווט ===================== */
function go(d){ collect(); STEP = Math.max(0, Math.min(STEPS.length-1, STEP + d)); draw(); window.scrollTo(0,0); }
function jump(i){ collect(); STEP = i; draw(); window.scrollTo(0,0); }
function draw(){
  $('prog').innerHTML = STEPS.map((s,i) => `<i class="${i<STEP?'d':i===STEP?'c':''}" title="${esc(s[1])}" onclick="jump(${i})"></i>`).join('');
  $('hSub').textContent = `צעד ${STEP+1} מתוך ${STEPS.length} · ${STEPS[STEP][1]}`;
  $('bBack').disabled = STEP === 0; $('bNext').classList.toggle('hidden', STEP === STEPS.length-1);
  $('nInfo').textContent = STEPS[STEP+1] ? 'הבא: ' + STEPS[STEP+1][1] : '';
  $('view').innerHTML = ({ school:schoolHTML, roles:rolesHTML, contacts:contactsHTML, vol:volHTML, staff:staffHTML, links:linksHTML, secure:secureHTML, save:saveHTML })[STEPS[STEP][0]]();
}
// קורא את כל השדות שעל המסך אל הטיוטה
function collect(){
  document.querySelectorAll('[data-p]').forEach(el => {
    const path = el.dataset.p.split('.'); let o = (path[0] === 'SEC' ? SEC : D); if(!o) return;
    const parts = path[0] === 'SEC' ? path.slice(1) : path;
    for(let i=0;i<parts.length-1;i++){ const k = parts[i]; if(o[k] === undefined) o[k] = /^\d+$/.test(parts[i+1]) ? [] : {}; o = o[k]; }
    o[parts[parts.length-1]] = el.value.trim();
  });
  saveDraft();
}
const inp = (path, val, ty, ph) => ty === 'ta'
  ? `<textarea class="t" data-p="${path}" placeholder="${esc(ph||'')}">${esc(val)}</textarea>`
  : `<input class="t" data-p="${path}" value="${esc(val)}" ${ty==='tel'?'inputmode="tel" dir="ltr" style="text-align:right"':''} ${ty==='url'?'dir="ltr" placeholder="https://…"':''} placeholder="${esc(ph||'')}">`;
const grid = (base, F, obj) => `<div class="ed">${F.map(([f,t,ty]) => `<div class="${ty==='ta'?'w':''}"><label>${esc(t)}</label>${inp(base+'.'+f, (obj||{})[f], ty)}</div>`).join('')}</div>`;

/* ===================== צעדים ===================== */
function schoolHTML(){
  return `<div class="card"><h2>🏫 פרטי המוסד</h2><p class="muted">מופיעים בשער התיק ובכל הטפסים המודפסים.</p>
    ${grid('school', [['school','שם המוסד החינוכי'],['principal','שם המנהל/ת'],['symbol','סמל המוסד']], D.school)}</div>
    <div class="card"><p class="muted" style="margin:0">💡 כל מה שממלאים נשמר כטיוטה במכשיר הזה תוך כדי, כך שאפשר להפסיק ולהמשיך אחר כך. שום דבר לא נכנס לתיק עד הלחיצה על <b>שמירה לתיק הצל"ח</b> בצעד האחרון.</p></div>`;
}
function rolesHTML(){
  const filled = ROLES.filter(([k]) => (D.roles[k]||[])[0] && D.roles[k][0].name).length;
  return `<div class="card"><h2>👥 בעלי תפקידים · טופס 1</h2><p class="muted">לכל תפקיד: ראשי/ת וממלא/ת מקום בעת הצורך. ${filled} מתוך ${ROLES.length} מולאו.</p></div>` +
    ROLES.map(([k,t,sub,L]) => { const P = D.roles[k] || [];
      return `<div class="card ${P[0]&&P[0].name?'done':''}"><h3>${esc(t)} ${sub?`<small>(${esc(sub)})</small>`:''} ${P[0]&&P[0].name?'<span class="chk">✓</span>':''}</h3>
        ${L.map((lb,i) => `<span class="pl">${esc(lb)}</span>${grid(`roles.${k}.${i}`, PF, P[i])}`).join('')}</div>`; }).join('');
}
function contactsHTML(){
  return `<div class="card"><h2>🏛️ גורמי קשר ודיווח פורמלי ברשות המקומית · טופס 3</h2></div>` +
    CONTACTS.map(([k,t]) => `<div class="card ${D.contacts[k]&&D.contacts[k].name?'done':''}"><h3>${esc(t)}</h3>${grid('contacts.'+k, CF, D.contacts[k])}</div>`).join('') +
    D.extra.map((x,i) => `<div class="card"><div class="row"><input class="t" style="max-width:260px;font-weight:800" data-p="extra.${i}.label" value="${esc(x.label||'נוסף')}"><button class="btn bad sm" style="margin-inline-start:auto" onclick="rm('extra',${i})">🗑️ הסרה</button></div>${grid('extra.'+i, CF, x)}</div>`).join('') +
    `<button class="btn sec" onclick="add('extra',{label:'נוסף'})">➕ גורם קשר נוסף</button>`;
}
function listStep(kind, F, title, sub, pasteHint){
  const L = D[kind];
  return `<div class="card"><h2>${title} <span class="muted">· ${L.length}</span></h2><p class="muted">${sub}</p></div>
    <div class="card"><h3>📥 הדבקה מאקסל או מרשימה</h3><p class="muted">${pasteHint}</p>
      <textarea class="t" id="paste" placeholder="${kind==='staff'?'ישראלה ישראלי, מחנכת יא 2, 050-1234567':'דנה כהן, אמא של תלמיד, 052-1234567, בוקר'}"></textarea>
      <button class="btn" style="margin-top:6px" onclick="doPaste('${kind}')">הוספה לרשימה</button></div>` +
    L.map((x,i) => `<div class="it"><div class="row"><b>${i+1}.</b><span style="flex:1"></span><button class="btn bad sm" onclick="rm('${kind}',${i})">🗑️</button></div>${grid(kind+'.'+i, F, x)}</div>`).join('') +
    `<button class="btn sec" onclick="add('${kind}',{})">➕ הוספה ידנית</button>`;
}
const volHTML = () => listStep('vol', VF, '🙋 רשימת מתנדבים · טופס 4', 'רשימת מתנדבים – לוח איכון.', 'שורה לכל מתנדב/ת: <b>שם, תפקיד, טלפון, מועדי זמינות</b>. אפשר להעתיק עמודות מאקסל.');
const staffHTML = () => listStep('staff', SF, '🧑‍🏫 רשימת אנשי צוות · טופס 5', 'מורים ואנשי מנהלה – כלל צוות המוסד החינוכי כולל פרטי מייל וטלפון בבית כולל רגישויות מיוחדות. בכוונה בלי ת"ז ובלי תאריך לידה.',
  'שורה לכל איש צוות: <b>שם, תפקיד, טלפון</b>. אפשר להדביק ישר מאקסל של המזכירות. שם שכבר ברשימה — יתעדכן ולא יוכפל.');
function doPaste(kind){
  collect();
  const lines = ($('paste').value||'').split(/\r?\n/).map(x => x.trim()).filter(Boolean); if(!lines.length){ toast('אין מה להדביק'); return; }
  let added = 0, upd = 0;
  lines.forEach(l => {
    const parts = l.split(/\t|,|;/).map(x => x.replace(/\s+/g,' ').trim()).filter(Boolean);
    const phone = parts.find(p => /^[\d\-+ ()]{7,}$/.test(p)) || '', rest = parts.filter(p => p !== phone); const name = rest[0]; if(!name) return;
    let x = D[kind].find(r => r.name === name); if(x) upd++; else { x = { key:uid(), name }; D[kind].push(x); added++; }
    if(rest[1]) x.role = rest[1]; if(phone) x.mobile = phone; if(kind === 'vol' && rest[2]) x.avail = rest.slice(2).join(', ');
  });
  if(kind === 'staff') D.staff.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'he'));
  saveDraft(); draw(); toast(`נוספו ${added}${upd?' · עודכנו '+upd:''}`);
}
function add(kind, init){ collect(); D[kind].push(Object.assign({ key:uid() }, init)); saveDraft(); draw(); setTimeout(()=>{ const a = document.querySelectorAll('.it,.card'); a[a.length-1].scrollIntoView({block:'center'}); }, 30); }
function rm(kind, i){ collect(); const x = D[kind][i]; if(!confirm('להסיר את ' + (x.name || x.label || 'השורה') + '?')) return; D[kind].splice(i,1); saveDraft(); draw(); }
function linksHTML(){
  const one = (kind, list, title) => `<div class="card"><h3>${title}</h3>${list.map((t,i) => `<div style="margin-bottom:8px"><label class="muted" style="font-weight:700">${i+1}. ${esc(t)}</label>${inp(`links.${kind}.${i}`, D.links[kind][i], 'url')}</div>`).join('')}</div>`;
  return `<div class="card"><h2>🔗 קישורים לתדריכים ולנהלים</h2><p class="muted">הקישורים מהמסמך המקורי לא נשמרו ב-PDF. מדביקים כאן את הכתובת של כל מסמך מאתר שפ"י או מאתר משרד החינוך. אפשר להשאיר ריק ולהשלים אחר כך.</p></div>`
    + one('brief', BRIEFS, 'פרק ה – תדריכי שפ"י לשעת חירום') + one('rule', RULES, 'פרק ו – נהלים לשעת חירום');
}
let SCLS = '';
function secureHTML(){
  if(LEVEL !== 'secure') return `<div class="card"><h2>🔒 מיפוי פגיעות ופרטי תלמידים</h2><div class="secn">הצעד הזה פתוח רק למי שנכנס עם קוד האזור המוגן (ראש הצל"ח, מרכז צוות הייעוץ, היועצ/ת, הפסיכולוג/ית). אפשר לדלג עליו — לחצו "הבא".</div></div>`;
  const C = [...new Set(STUDENTS.map(s => s.class).filter(Boolean))].sort((a,b) => String(a).localeCompare(String(b),'he',{numeric:true}));
  if(!SCLS || !C.includes(SCLS)) SCLS = C[0] || '';
  const opts = STUDENTS.filter(s => s.class === SCLS);
  return `<div class="card"><h2>🔒 מיפוי פגיעות ופרטי תלמידים</h2><div class="secn">נשמר באזור המוגן בלבד, ולא נשמר כטיוטה במכשיר. לא לסגור את הדף לפני השמירה בצעד האחרון.</div>
      <div class="row"><label class="muted">כיתה:</label><select class="t" style="max-width:160px" onchange="collect();SCLS=this.value;draw()">${C.map(c=>`<option ${c===SCLS?'selected':''}>${esc(c)}</option>`).join('')}</select></div></div>
    <div class="card"><h3>2. טבלה למיפוי מעגלי פְּגִיעוּת ותמיכה · כיתה ${esc(SCLS)}</h3>
      <p class="muted">בתחילת שנת הלימודים או בימי ההיערכות לקראתה מחנכי הכיתות, בשיתוף היועצת, ימפו את רגשויות התלמידים וימלאו טבלת פְּגִיעוּת ורגישות כיתתית. יש לעדכן את הטבלה בכל שינוי שנוגע לתלמידים.</p>
      ${SEC.vuln.map((x,i) => x.class !== SCLS ? '' : `<div class="it"><div class="row"><b>${esc(x.student)}</b><span style="flex:1"></span><button class="btn bad sm" onclick="rmV(${i})">🗑️</button></div>
        <div class="ed"><div class="w"><label>תיאור הבעיה</label>${inp(`SEC.vuln.${i}.problem`, x.problem, 'ta')}</div><div class="w"><label>לאיזה סיוע, טיפול או תרופה זקוק/ה</label>${inp(`SEC.vuln.${i}.need`, x.need, 'ta')}</div></div></div>`).join('')}
      <div class="row"><select class="t" id="vPick" style="max-width:240px"><option value="">בחרו תלמיד/ה להוספה…</option>${opts.map(s=>`<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('')}</select><button class="btn pur sm" onclick="addV()">➕ הוספה למיפוי</button></div></div>
    <div class="card"><h3>רשימות תלמידים · כיתה ${esc(SCLS)}</h3><p class="muted">שמות ההורים ופרטי התקשרות, כתובת, רגישויות. בכוונה בלי ת"ז ובלי תאריך לידה.</p>
      ${opts.map(s => { const d = SEC.stu[s.id] || {}; return `<div class="it"><b>${esc(s.name)}</b><div class="ed">
        <div><label>שמות ההורים ופרטי התקשרות</label>${inp(`SEC.stu.${s.id}.parents`, d.parents)}</div><div><label>כתובת מגורים + כתובת דואר אלקטרוני</label>${inp(`SEC.stu.${s.id}.address`, d.address)}</div>
        <div><label>רגישויות מיוחדות והערות</label>${inp(`SEC.stu.${s.id}.notes`, d.notes)}</div></div></div>`; }).join('') || '<p class="muted">לא נמצאו תלמידים בכיתה.</p>'}</div>`;
}
function addV(){ collect(); const n = $('vPick').value; if(!n){ toast('בחרו תלמיד/ה'); return; } SEC.vuln.push({ key:uid(), class:SCLS, student:n }); draw(); }
function rmV(i){ collect(); if(!confirm('להסיר את ' + SEC.vuln[i].student + ' מהמיפוי?')) return; SEC.vuln.splice(i,1); draw(); }

/* ===================== סיכום ושמירה ===================== */
function counts(){
  const roles = ROLES.reduce((n,[k]) => n + (D.roles[k]||[]).filter(p => p && p.name).length, 0);
  const contacts = CONTACTS.filter(([k]) => D.contacts[k] && D.contacts[k].name).length + D.extra.filter(x => x.name).length;
  const links = D.links.brief.filter(Boolean).length + D.links.rule.filter(Boolean).length;
  return { roles, contacts, vol:D.vol.filter(x=>x.name).length, staff:D.staff.filter(x=>x.name).length, links,
           vuln: SEC ? SEC.vuln.length : null, stu: SEC ? Object.values(SEC.stu).filter(d => d.parents||d.address||d.notes).length : null };
}
function saveHTML(){
  const c = counts();
  return `<div class="card"><h2>✅ סיכום</h2><p class="muted">זה מה שייכנס לתיק הצל"ח. לחיצה על פס ההתקדמות למעלה מחזירה לכל צעד.</p>
    <div class="sum"><span>🏫 ${esc(D.school.school||'—')}${D.school.principal?' · מנהל/ת: '+esc(D.school.principal):''}</span><b></b>
      <span>👥 שמות בבעלי התפקידים</span><b>${c.roles}</b><span>🏛️ גורמי קשר ברשות</span><b>${c.contacts}</b><span>🙋 מתנדבים</span><b>${c.vol}</b>
      <span>🧑‍🏫 אנשי צוות</span><b>${c.staff}</b><span>🔗 קישורים</span><b>${c.links} מתוך ${BRIEFS.length+RULES.length}</b>
      ${c.vuln!==null?`<span>🔒 תלמידים במיפוי הפגיעות</span><b>${c.vuln}</b><span>🔒 תלמידים עם פרטים</span><b>${c.stu}</b>`:''}</div>
    <button class="btn ok" style="width:100%;margin-top:14px;font-size:17px;padding:14px" id="bSave" onclick="saveAll()">💾 שמירה לתיק הצל"ח</button>
    <div class="muted" id="sMsg" style="margin-top:8px;font-weight:700"></div></div>`;
}
async function saveAll(){
  collect();
  if(!confirm('לשמור את כל העדכונים לתיק הצל"ח?')) return;
  const b = $('bSave'), m = $('sMsg'); b.disabled = true; m.textContent = 'שומר…';
  const now = new Date().toISOString(), rows = [], keep = new Set();
  const push = (kind, key, data, sort) => { rows.push({ kind, key, data, sort, updated_at:now }); keep.add(kind+'|'+key); };
  ROLES.forEach(([k,,,L], i) => push('role', k, { p: L.map((_,j) => Object.assign({ name:'', mobile:'', home:'', email:'', address:'' }, (D.roles[k]||[])[j]||{})) }, i));
  CONTACTS.forEach(([k,t], i) => push('contact', k, Object.assign({}, D.contacts[k]||{}, { label:t }), i));
  D.extra.forEach((x,i) => { if(x.name || (x.label && x.label !== 'נוסף')) { const { key, ...d } = x; push('contact', key, d, 100+i); } });
  D.vol.forEach((x,i) => { if(x.name){ const { key, ...d } = x; push('vol', key, d, i+1); } });
  D.staff.forEach((x,i) => { if(x.name){ const { key, ...d } = x; push('staff', key, d, i+1); } });
  BRIEFS.forEach((_,i) => push('brief', String(i), { url:D.links.brief[i]||'' }, i));
  RULES.forEach((_,i) => push('rule', String(i), { url:D.links.rule[i]||'' }, i));
  // שורות שהוסרו בטופס — נמחקות מהתיק
  const gone = ORIG.ent.filter(e => ['vol','staff'].includes(e.kind) || (e.kind==='contact' && e.key.startsWith('x-'))).filter(e => !keep.has(e.kind+'|'+e.key));
  try{
    await api('tz_settings?id=eq.1', { method:'PATCH', body: JSON.stringify(Object.assign({}, D.school, { updated_at:now })) });
    for(let i=0; i<rows.length; i+=200) await api('tz_entries?on_conflict=kind,key', { method:'POST', prefer:'resolution=merge-duplicates', body: JSON.stringify(rows.slice(i,i+200)) });
    for(const g of gone) await api(`tz_entries?kind=eq.${g.kind}&key=eq.${encodeURIComponent(g.key)}`, { method:'DELETE' });
    let secN = 0;
    if(SEC){
      const sk = new Set();
      for(const x of SEC.vuln){ const { key, ...d } = x; await rpc('tz_sec_put', { p_code:CODE, p_kind:'vuln', p_key:key, p_data:d, p_sort:0 }); sk.add('vuln|'+key); secN++; }
      for(const [id, d] of Object.entries(SEC.stu)){ if(!(d.parents||d.address||d.notes)) continue; const s = STUDENTS.find(x => String(x.id) === String(id)) || {};
        await rpc('tz_sec_put', { p_code:CODE, p_kind:'stu', p_key:String(id), p_data:Object.assign({}, d, { name:s.name||d.name||'', class:s.class||d.class||'' }), p_sort:0 }); sk.add('stu|'+id); secN++; }
      for(const r of SECORIG.filter(r => (r.kind==='vuln'||r.kind==='stu') && !sk.has(r.kind+'|'+r.key))) await rpc('tz_sec_del', { p_code:CODE, p_kind:r.kind, p_key:r.key });
    }
    LS.set('tzu_draft', null);
    ORIG.ent = ORIG.ent.filter(e => !gone.includes(e)).filter(e => !keep.has(e.kind+'|'+e.key)).concat(rows);
    m.innerHTML = `<span style="color:var(--ok)">✅ נשמר: ${rows.length} פריטים בתיק${secN?' · '+secN+' באזור המוגן':''}.</span><br><a href="tzalach.html" style="font-size:16px">← פתיחת תיק הצל"ח</a>`;
    toast('✅ התיק עודכן');
  }catch(e){ m.innerHTML = `<span style="color:var(--bad)">שגיאה בשמירה — הטיוטה נשמרה במכשיר, אפשר לנסות שוב.<br><small>${esc(String(e.message).slice(0,140))}</small></span>`; }
  b.disabled = false;
}
window.addEventListener('beforeunload', () => { if(D) collect(); });
gate();
</script>
