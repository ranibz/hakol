<!DOCTYPE html>
<!-- eshi/emergency/bitachon.html · v1.0.0 · 07/11/2026 · ranibz/hakol (מערכת החירום של גליל מערבי)
     תיק נתונים ושטח, ביטחון וחירום מוסדי — לפי המנחה והפורמט של משטרת ישראל ומשרד החינוך.
     v1.0.0 · התיק המלא כקוד, לצפייה ולהדפסה:
       · עמוד שער, תוכן עניינים, פרק "כללי" (הקדמה, ייעוד, הגדרות, השיטה), פרקים 1–7 לפי bitachon-schema.js,
         ותמונות (דרכי גישה, נקודות תורפה, פינוי ברעידת אדמה, דרכי מילוט).
       · שתי הדפסות: עותק 1 — מלא (לבית הספר); עותקים 2–3 — בלי רשימות התלמידים ועובדי ההוראה (פרק 2),
         לקב"ט הרשות ולקצין האבטחה במשטרה, כמו שהמנחה דורש.
       · הנתונים של בית הספר לא נמצאים בקובץ: הם בשרת בטבלה סגורה (bt_data, bt_images), ונטענים רק עם קוד
         צפייה או עריכה שנבדק בשרת (bt_get). הקוד נשמר עד סגירת הדפדפן בלבד.
       · עדכון התיק: bitachon-update.html (קוד עריכה).
     · Supabase: skfriefqnoxfzmamcokd — דורש HAKOL-bitachon.sql (+ HAKOL-bitachon-images.sql לתמונות).
     פיתוח: רני בן זאב -->
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-version" content="1.0.0">
<meta name="robots" content="noindex">
<title>תיק נתונים ושטח, ביטחון וחירום מוסדי</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800;900&family=Frank+Ruhl+Libre:wght@700;900&display=swap" rel="stylesheet">
<script src="bitachon-schema.js"></script>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14202e;--muted:#5d6b7c;--line:#d5dce5;--navy:#1b2d45;--accent:#8a1c1c;--soft:#f6f8fa}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,system-ui,sans-serif}
button,input{font-family:inherit}
.bar{background:var(--navy);color:#fff;position:sticky;top:0;z-index:5}
.bar .in{max-width:900px;margin:0 auto;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar h1{font-size:17px;margin:0;font-weight:800}
.bar .sp{margin-inline-start:auto}
.bar button,.bar a{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:9px;padding:8px 12px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none}
.bar button.pr{background:#fff;color:var(--navy)}
.wrap{max-width:900px;margin:0 auto;padding:14px}
.gate{max-width:420px;margin:60px auto;background:#fff;border-radius:16px;padding:22px;box-shadow:0 2px 10px rgba(0,0,0,.06);text-align:center}
.gate input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font-size:17px;margin-top:10px;text-align:center}
.gate button{width:100%;padding:13px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-size:17px;font-weight:800;margin-top:10px;cursor:pointer}
.err{color:#b42318;font-weight:700;min-height:20px;margin-top:8px}
.doc{background:#fff;border-radius:14px;padding:28px 32px;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.cover{text-align:center;padding:30px 0 10px}
.cover .gov{font-size:14px;color:var(--muted);line-height:1.6}
.cover h1{font-family:'Frank Ruhl Libre',serif;font-size:34px;line-height:1.25;margin:40px 0 6px;color:var(--navy)}
.cover h2{font-size:20px;margin:0 0 40px;color:var(--accent)}
.cover .school{font-size:22px;font-weight:800}
.cover .meta{color:var(--muted);margin-top:8px}
.cover .ext{display:none;margin-top:24px;border:2px solid var(--accent);color:var(--accent);border-radius:10px;padding:8px;font-weight:800}
body.ext .cover .ext{display:block}
.toc ol{line-height:2;padding-inline-start:22px}
h2.ch{font-family:'Frank Ruhl Libre',serif;font-size:24px;color:var(--navy);border-bottom:3px solid var(--navy);padding-bottom:6px;margin:34px 0 12px}
h3.pt{font-size:17px;margin:22px 0 8px;color:var(--navy)}
h3.pt .n{color:var(--accent);margin-inline-end:6px}
.note{background:#fff4e5;border-right:4px solid #d97706;padding:10px 12px;border-radius:6px;margin:8px 0;line-height:1.6}
p{line-height:1.75;margin:6px 0}
ol.intro li,ul.lst li{line-height:1.75;margin-bottom:4px}
table{width:100%;border-collapse:collapse;margin:8px 0;font-size:13.5px}
th,td{border:1px solid #9aa6b5;padding:5px 7px;text-align:right;vertical-align:top}
th{background:#e7ecf2;font-weight:800}
thead{display:table-header-group}
tr{page-break-inside:avoid}
td.ltr{direction:ltr;text-align:right;white-space:nowrap}
td.n{width:38px;text-align:center}
tr.tot td{font-weight:800;background:#f3f5f8}
table.kv td:first-child{width:42%;background:#f6f8fa;font-weight:700}
.blank{color:#9aa6b5}
.imgs{display:grid;grid-template-columns:1fr;gap:14px;margin:10px 0}
figure{margin:0;break-inside:avoid;page-break-inside:avoid}
figure .ph{background:#f1f3f6;border:1px dashed #c3ccd7;border-radius:8px;min-height:160px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
figure img{width:100%;border:1px solid #c3ccd7;border-radius:6px;display:block}
figcaption{text-align:center;font-weight:700;margin-top:4px;text-decoration:underline}
.lnk{font-size:14px;margin-top:4px}
.lnk a{color:#1d5fb8;font-weight:700}
.upd{color:var(--muted);font-size:13px;text-align:center;margin-top:20px}
footer{text-align:center;color:var(--muted);font-size:12px;margin:20px 0}
body.ext [data-lists]{display:none}
.sig{margin-top:30px;display:grid;grid-template-columns:1fr 1fr;gap:30px}
.sig div{border-top:1px solid #333;padding-top:4px;text-align:center;font-size:13px}
@media (max-width:640px){.doc{padding:16px 12px}.cover h1{font-size:26px}table{font-size:12px}}
@media print{
  @page{size:A4;margin:14mm 12mm}
  body{background:#fff}
  .bar,.noprint,footer{display:none!important}
  .wrap{max-width:none;padding:0}
  .doc{box-shadow:none;padding:0;border-radius:0}
  .cover{min-height:250mm;display:flex;flex-direction:column;justify-content:center}
  .cover,.toc{page-break-after:always}
  h2.ch{page-break-before:always;margin-top:0}
  h3.pt{page-break-after:avoid}
  a{color:inherit;text-decoration:none}
  figure .ph{display:none}
}
</style>
</head>
<body>
<div class="bar noprint"><div class="in">
  <h1>🛡️ תיק נתונים ושטח, ביטחון וחירום מוסדי</h1>
  <span class="sp"></span>
  <span id="acts"></span>
</div></div>
<div class="wrap" id="app"></div>
<footer>פיתוח: רני בן זאב · v1.0.0</footer>

<script>
const $ = id => document.getElementById(id);
const esc = btEsc;
const CODE_KEY = 'bt_code';
let CODE = '', ROLE = '', DATA = {}, IMGS = [], UPD = null;
const ss = {get(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } },
            set(k,v){ try{ sessionStorage.setItem(k,v); }catch(e){} }, del(k){ try{ sessionStorage.removeItem(k); }catch(e){} }};

function gate(msg){
  $('acts').innerHTML = '';
  $('app').innerHTML = `<div class="gate">
    <div style="font-size:42px">🛡️</div>
    <h2 style="margin:6px 0">תיק ביטחון וחירום מוסדי</h2>
    <p style="color:var(--muted);margin:0">התיק מכיל מידע רגיש. הקלידו קוד צפייה או קוד עריכה.</p>
    <input id="code" type="password" autocomplete="off" placeholder="קוד">
    <button id="go">כניסה</button>
    <div class="err" id="err">${msg ? esc(msg) : ''}</div>
    <p style="margin-top:14px"><a href="tikim.html">← תיקי חירום וביטחון</a></p></div>`;
  const go = () => { const c = $('code').value.trim(); if(c) load(c); };
  $('go').onclick = go; $('code').onkeydown = e => { if(e.key === 'Enter') go(); };
  $('code').focus();
}

async function load(code){
  if($('err')) $('err').textContent = 'טוען…';
  try{
    const r = await btRpc('bt_get', {p_code: code});
    CODE = code; ROLE = r.role; DATA = r.data || {}; IMGS = r.images || []; UPD = r.updated_at;
    ss.set(CODE_KEY, code);
    render();
  }catch(e){
    ss.del(CODE_KEY);
    gate(/קוד/.test(e.message) ? 'קוד שגוי' : 'אין חיבור לשרת — נסו שוב');
  }
}

/* ---------- רינדור ---------- */
const v = x => (x === undefined || x === null || String(x).trim() === '') ? '' : String(x);
const blank = '<span class="blank">______________</span>';
const txt = s => esc(s).replace(/\n/g, '<br>');
const paras = s => v(s) ? String(s).split(/\n\s*\n/).map(p => `<p>${txt(p.trim())}</p>`).join('') : `<p>${blank}</p>`;

function rFields(p){
  const o = DATA[p.k] || {};
  return `<table class="kv"><tbody>${p.fields.map(([k, l, ltr]) =>
    `<tr><td>${esc(l)}</td><td${ltr ? ' class="ltr"' : ''}>${v(o[k]) ? txt(o[k]) : blank}</td></tr>`).join('')}</tbody></table>`;
}
function rTable(p){
  const rows = DATA[p.k] || [];
  const head = `<tr>${p.num ? '<th>מס"ד</th>' : ''}${p.cols.map(c => `<th>${esc(c.l)}</th>`).join('')}</tr>`;
  const body = rows.length ? rows.map((r, i) => `<tr>${p.num ? `<td class="n">${i + 1}</td>` : ''}${p.cols.map(c =>
      `<td${c.ltr ? ' class="ltr"' : ''}>${txt(v(r[c.k]))}</td>`).join('')}</tr>`).join('')
    : [1,2].map(i => `<tr>${p.num ? `<td class="n">${i}</td>` : ''}${p.cols.map(() => '<td>&nbsp;</td>').join('')}</tr>`).join('');
  return `<table><thead>${head}</thead><tbody>${body}</tbody></table>`;
}
function rMatrix(p){
  const m = DATA[p.k] || {cols: [], rows: []};
  const tot = m.cols.map((_, j) => m.rows.reduce((s, r) => s + (parseFloat(r.vals?.[j]) || 0), 0));
  return `<table><thead><tr><th>מיקום</th>${m.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>
    ${m.rows.map(r => `<tr><td><b>${esc(r.place)}</b></td>${m.cols.map((_, j) => `<td class="n">${esc(v(r.vals?.[j]))}</td>`).join('')}</tr>`).join('')}
    <tr class="tot"><td>סה"כ</td>${tot.map(t => `<td class="n">${t || ''}</td>`).join('')}</tr></tbody></table>`;
}
function rActs(p){
  const cols = DATA[p.colsKey] || [], rows = DATA[p.k] || [];
  return `<table><thead><tr>${p.stage ? '<th></th>' : ''}${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(r => `<tr>${p.stage ? `<td><b>${txt(r.stage)}</b></td>` : ''}${cols.map((_, j) => `<td>${txt(v(r.vals?.[j]))}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
function rList(p){
  const a = (DATA[p.k] || []).filter(x => v(x));
  if(!a.length) return `<p>${blank}</p>`;
  return p.bullet ? `<ul class="lst" style="list-style:none;padding-inline-start:4px">${a.map(x => `<li>${esc(p.bullet)} ${txt(x)}</li>`).join('')}</ul>`
                  : `<ul class="lst">${a.map(x => `<li>${txt(x)}</li>`).join('')}</ul>`;
}
function rImages(sec){
  const a = IMGS.filter(i => i.section === sec).sort((x, y) => x.sort - y.sort);
  if(!a.length) return '';
  return `<div class="imgs">${a.map(i => `<figure><div class="ph" data-img="${esc(i.id)}">טוען תמונה…</div>
    <figcaption>${esc(i.caption || '')}</figcaption></figure>`).join('')}</div>`;
}
function rPart(p){
  let h = '';
  if(p.t) h += `<h3 class="pt">${p.n ? `<span class="n">${esc(p.n)}</span>` : ''}${esc(p.t)}${p.yearKey && v(DATA[p.yearKey]) ? ' לשנת ' + esc(DATA[p.yearKey]) : ''}</h3>`;
  if(p.intro) h += `<p>${esc(p.intro)}</p>`;
  if(p.type === 'fields') h += rFields(p);
  else if(p.type === 'table') h += rTable(p);
  else if(p.type === 'text') h += paras(DATA[p.k]);
  else if(p.type === 'list') h += rList(p);
  else if(p.type === 'matrix') h += rMatrix(p);
  else if(p.type === 'acts') h += rActs(p);
  if(p.images) h += rImages(p.images);
  if(p.link === 'tzalach') h += `<p class="lnk">פירוט התפקידים והמטלות — ב<a href="tzalach.html">תיק הצל"ח</a>.</p>`;
  return h;
}

function render(){
  const inst = DATA.inst || {};
  const date = v(inst.fileDate) || (UPD ? new Date(UPD).toLocaleDateString('he-IL') : '');
  $('acts').innerHTML = `
    <button class="pr" id="pFull">🖨️ הדפסה — עותק 1 (מלא)</button>
    <button id="pExt">🖨️ עותקים 2–3 (בלי רשימות)</button>
    ${ROLE === 'edit' ? '<a href="bitachon-update.html">✏️ עדכון התיק</a>' : ''}
    <button id="out">יציאה</button>`;
  const otherImgs = rImages('other');
  $('app').innerHTML = `<div class="doc">
    <section class="cover">
      <div class="gov">מדינת ישראל · משרד החינוך<br>אגף בכיר לביטחון, שעת חירום ובטיחות סביבתית</div>
      <h1>תיק נתונים ושטח<br>ביטחון וחירום מוסדי</h1>
      <h2>מנחה ופורמט לכתיבה ועריכת התיק</h2>
      <div class="school">${esc(v(inst.name) || 'בית חינוך גליל מערבי')}</div>
      <div class="meta">${esc(v(inst.rashut))}${v(inst.symbol) ? ' · סמל מוסד ' + esc(inst.symbol) : ''}</div>
      <div class="meta">תאריך: ${esc(date) || blank}</div>
      <div class="ext">עותק לגורמי חוץ — ללא רשימות התלמידים ועובדי ההוראה</div>
    </section>
    <section class="toc"><h2 class="ch" style="page-break-before:auto">תוכן העניינים</h2><ol>
      <li>כללי</li>
      ${BT_SCHEMA.map(c => `<li${c.lists ? ' data-lists' : ''}>${esc(c.t)}</li>`).join('')}
      <li data-lists>נספחים</li></ol></section>

    <h2 class="ch">כללי</h2>
    ${BT_STATIC_INTRO.map((s, i) => `<h3 class="pt"><span class="n">${i + 1}.</span>${esc(s.h)}</h3>
      ${s.p ? `<p>${s.p}</p>` : ''}${s.items ? `<ol class="intro">${s.items.map(x => `<li>${x}</li>`).join('')}</ol>` : ''}
      ${s.after ? `<p class="note">${s.after}</p>` : ''}`).join('')}

    <h2 class="ch" style="page-break-before:avoid;border:0;font-size:20px;margin-top:30px">פורמט תיק נתונים ושטח, ביטחון וחירום מוסדי</h2>
    ${BT_SCHEMA.map(c => `<div${c.lists ? ' data-lists' : ''}>
      <h2 class="ch">${esc(c.n)}. ${esc(c.t)}</h2>
      ${c.note ? `<p class="note">${c.note}</p>` : ''}
      ${c.parts.map(rPart).join('')}
      ${c.n === '7' ? '<div class="sig"><div>רכז הביטחון — שם וחתימה</div><div>מנהל/ת המוסד — שם וחתימה</div></div>' : ''}</div>`).join('')}

    <div data-lists><h2 class="ch">נספחים</h2>
      <ul class="lst">${BT_APPENDICES.map(a => `<li>${esc(a)}</li>`).join('')}</ul>
      ${otherImgs}</div>
    <p class="upd noprint">עודכן לאחרונה: ${UPD ? new Date(UPD).toLocaleString('he-IL') : '—'}</p>
  </div>`;
  $('pFull').onclick = () => doPrint(false);
  $('pExt').onclick = () => doPrint(true);
  $('out').onclick = () => { ss.del(CODE_KEY); location.reload(); };
  loadImages();
}

/* תמונות נטענות אחת-אחת מהשרת (עם הקוד) */
const IMG_CACHE = {};
let imgJob = null;
function loadImages(){
  imgJob = (async () => {
    for(const ph of document.querySelectorAll('[data-img]')){
      const id = ph.dataset.img;
      try{
        if(!IMG_CACHE[id]) IMG_CACHE[id] = await btRpc('bt_img', {p_code: CODE, p_id: id});
        if(IMG_CACHE[id]){ const im = new Image(); im.src = IMG_CACHE[id]; im.alt = ''; ph.replaceWith(im); }
        else ph.textContent = 'התמונה לא נמצאה';
      }catch(e){ ph.textContent = 'התמונה לא נטענה'; }
    }
  })();
  return imgJob;
}
async function doPrint(ext){
  document.body.classList.toggle('ext', ext);
  const b = ext ? $('pExt') : $('pFull'), t = b.textContent;
  b.textContent = '⏳ מכין להדפסה…';
  try{ await imgJob; }catch(e){}
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  b.textContent = t;
  window.print();
}
window.addEventListener('afterprint', () => document.body.classList.remove('ext'));

const saved = ss.get(CODE_KEY);
if(saved) load(saved); else gate();
</script>
</body>
</html>
