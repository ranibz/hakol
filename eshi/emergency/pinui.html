     v1.1.0 · מתחת לתרשים: קישור למערכת הסריקה של הפיזור (pizur-scan.html).
     נוהל פינוי בית הספר בחירום — תיק לצפייה ולהדפסה, באותו מבנה כמו תיק הצל"ח ותיק הביטחון.
     v1.0.0 · עמוד שער, תוכן עניינים לחיץ, פס פרקים קבוע, כפתור ⬆, קישור ישיר לפרק (#ch-3):

       2. דרכי פעולה — מחנכים, במקביל (צל"ח), מלווי הסעות, שומר, תלמידים שמתפנים עם הורים
       3. מלווי הסעות בזמן חירום — טבלת קווים לכל אזור (נהריה, שלומי, מטה אשר, מעלה יוסף...)
       4. אישור/עדכון התיק

       · הנתונים לא נמצאים בקובץ: הם בשרת בטבלה סגורה (pn_data), ונטענים רק עם קוד צפייה או עריכה (pn_get).
       · עדכון: pinui-update.html (קוד עריכה). עדכון אוטומטי לגרסה חדשה (קישור מוואטסאפ).

(function(){
  var V = '1.2.0', u = location.pathname;
  if(navigator.onLine === false || !window.fetch) return;
  fetch(u + '?vcheck=' + Date.now(), {cache: 'no-store'})
    .then(function(r){ return r.ok ? r.text() : ''; })
    .then(function(t){
      var m = t.match(/<meta name="app-version" content="([^"]+)"/);
      if(!m || m[1] === V) return;
      var k = 'vreload:' + u + ':' + m[1];
      try{ if(sessionStorage.getItem(k)) return; sessionStorage.setItem(k, '1'); }catch(e){ return; }
      var q = new URLSearchParams(location.search); q.set('v', m[1]);
      location.replace(u + '?' + q.toString() + location.hash);
    }).catch(function(){});
})();

<div class="bar noprint"><div class="in">
  <h1>🚌 נוהל פינוי בית הספר בחירום</h1>
  <span class="sp"></span>
  <span id="acts"></span>
</div><nav class="chips" id="chips" aria-label="פרקי התיק"></nav></div>
<button id="topBtn" class="noprint" title="לראש התיק" aria-label="לראש התיק">⬆</button>
<div class="wrap" id="app"></div>
<footer>פיתוח: רני בן זאב · v1.2.0</footer>

<script>
const $ = id => document.getElementById(id);
const esc = pnEsc;
const CODE_KEY = 'pn_code';
let CODE = '', ROLE = '', DATA = {}, UPD = null;
const ss = {get(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } },
            set(k,v){ try{ sessionStorage.setItem(k,v); }catch(e){} }, del(k){ try{ sessionStorage.removeItem(k); }catch(e){} }};

function gate(msg){
  $('acts').innerHTML = ''; $('chips').classList.remove('on');
  $('app').innerHTML = `<div class="gate">
    <div style="font-size:42px">🚌</div>
    <h2 style="margin:6px 0">נוהל פינוי בית הספר בחירום</h2>
    <p style="color:var(--muted);margin:0">הקלידו קוד צפייה או קוד עריכה.</p>
    <input id="code" type="password" autocomplete="off" placeholder="קוד">
    <button id="go">כניסה</button>
    <div class="err" id="err">${msg ? esc(msg) : ''}</div>
    <p style="margin-top:14px"><a href="tikim.html">← תיקי חירום וביטחון</a></p></div>`;
  const go = () => { const c = $('code').value.trim(); if(c) load(c); };
  $('go').onclick = go; $('code').onkeydown = e => { if(e.key === 'Enter') go(); };
  $('code').focus();
}

async function load(code){
  if($('err')) $('err').textContent = 'טוען…';
  try{
    const r = await pnRpc('pn_get', {p_code: code});
    CODE = code; ROLE = r.role; DATA = r.data || {}; UPD = r.updated_at;
    ss.set(CODE_KEY, code);
    render();
  }catch(e){
    ss.del(CODE_KEY);
    gate(/קוד/.test(e.message) ? 'קוד שגוי' : 'אין חיבור לשרת — נסו שוב');
  }
}

/* ---------- רינדור ---------- */
const v = x => (x === undefined || x === null || String(x).trim() === '') ? '' : String(x);
const blank = '<span class="blank">______________</span>';
const txt = s => esc(s).replace(/\n/g, '<br>');
const paras = s => v(s) ? String(s).split(/\n\s*\n/).map(p => `<p>${txt(p.trim())}</p>`).join('') : `<p>${blank}</p>`;

function rFields(p){
  const o = DATA[p.k] || {};
  return `<table class="kv"><tbody>${p.fields.map(([k, l, ltr]) =>
    `<tr><td>${esc(l)}</td><td${ltr ? ' class="ltr"' : ''}>${v(o[k]) ? txt(o[k]) : blank}</td></tr>`).join('')}</tbody></table>`;
}
function rTable(p){
  const rows = DATA[p.k] || [];
  const head = `<tr>${p.num ? '<th>מס"ד</th>' : ''}${p.cols.map(c => `<th>${esc(c.l)}</th>`).join('')}</tr>`;
  const body = rows.length ? rows.map((r, i) => `<tr>${p.num ? `<td class="n">${i + 1}</td>` : ''}${p.cols.map(c =>
      `<td${c.ltr ? ' class="ltr"' : ''}>${txt(v(r[c.k]))}</td>`).join('')}</tr>`).join('')
    : [1,2].map(i => `<tr>${p.num ? `<td class="n">${i}</td>` : ''}${p.cols.map(() => '<td>&nbsp;</td>').join('')}</tr>`).join('');
  return `<table><thead>${head}</thead><tbody>${body}</tbody></table>`;
}
function rList(p){
  const a = (DATA[p.k] || []).filter(x => v(x));
  if(!a.length) return `<p>${blank}</p>`;
  const tag = p.ol ? 'ol' : 'ul';
  return `<${tag} class="lst">${a.map(x => `<li>${txt(x)}</li>`).join('')}</${tag}>`;
}
function rAreas(){
  const areas = DATA.areas || [];
  if(!areas.length) return `<p>${blank}</p>`;
  const lines = areas.reduce((s, a) => s + (a.rows || []).length, 0);
  return `<p>${lines} קווים ב-${areas.length} אזורים.</p>` + areas.map((a, ai) => `<div class="area" id="area-${ai}">
    <h3 class="pt"><span class="n">3.${ai + 1}</span>${esc(v(a.name) || 'אזור')}</h3>
    <table><thead><tr><th>מס'</th>${PN_LINE_COLS.map(c => `<th>${esc(c.l)}</th>`).join('')}</tr></thead><tbody>
    ${(a.rows || []).map((r, i) => `<tr><td class="n">${i + 1}</td>${PN_LINE_COLS.map(c => `<td>${txt(v(r[c.k]))}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div>`).join('');
}
function rFlow(){
  const hq = DATA.hq || {};
  const room = esc(v(hq.room) || 'חדר 101');
  const at = (r, c) => ` style="grid-row:${r};grid-column:${c}"`;
  return `<div class="flow">
    <div class="b"${at(1,1)}><b>מחנכים</b>כינוס בכיתות האם, סריקה חוזרת</div>
    <div class="b"${at(1,2)}><b>רכזי שכבות</b>מחנכים שאינם בבית הספר</div>
    <div class="b"${at(1,3)}><b>שומר</b>רשימת התלמידים שעזבו</div>
    <div class="ar"${at(2,1)}>↙</div><div class="ar"${at(2,2)}>⬇</div><div class="ar"${at(2,3)}>↘</div>
    <div class="b hq"${at(3,2)}><b>צוות צל"ח · ${room}</b>רשימה מעודכנת לפי ישובים · עדיפויות לפיזור</div>
    <div class="ar"${at(4,2)}>⬇</div>
    <div class="b"${at(5,2)}><b>אחראי הסעות${v(hq.transport) ? ' · ' + esc(hq.transport) : ''}</b>מקבל את ההחלטה</div>
    <div class="ar"${at(6,2)}>⬇</div>
    <div class="b"${at(7,2)}><b>כריזה</b>ירידה לרחבת ההסעים לפי ישובים</div>
    <div class="b side"${at('5 / 8',3)}><b>תלמידים עם הורים</b>במקביל: שער היציאה הקטן, או רחבת האשכול כשיש חפיפה עם האוטובוסים · רישום מלא — כיתה, ישוב ומי לקח</div>
    <div class="ar"${at(8,2)}>⬇</div>
    <div class="b"${at(9,2)}><b>מלווי הסעות</b>נוכחות, צילום לקבוצה, דיווח כשאחרון התלמידים ירד</div>
  </div><p class="flowcap">כל המידע זורם ל${room}, וממנו יוצאת ההחלטה לפיזור.</p>
  <p class="lnk noprint" style="text-align:center">📷 סריקת התלמידים בפיזור — אוטובוסים, שער ומסך מנהלת, עם הסברים וקישורים לשליחה: <a href="pizur-start.html">דף הסריקות</a></p>`;
}
function rPart(p){
  let h = '';
  if(p.t) h += `<h3 class="pt">${p.n ? `<span class="n">${esc(p.n)}</span>` : ''}${esc(p.t)}</h3>`;
  if(p.type === 'fields') h += rFields(p);
  else if(p.type === 'table') h += rTable(p);
  else if(p.type === 'text') h += paras(DATA[p.k]);
  else if(p.type === 'list') h += rList(p);
  else if(p.type === 'areas') h += rAreas();
  else if(p.type === 'flow') h += rFlow();
  return h;
}

function render(){
  const date = v(DATA.fileDate) || (UPD ? new Date(UPD).toLocaleDateString('he-IL') : '');
  $('acts').innerHTML = `
    <a href="pizur-start.html">📷 סריקות הפיזור</a>
    <button class="pr" id="pFull">🖨️ הדפסת התיק</button>
    <button id="pLines">🖨️ רק טבלאות המלווים</button>
    ${ROLE === 'edit' ? '<a href="pinui-update.html">✏️ עדכון התיק</a>' : ''}
    <button id="out">יציאה</button>`;
  $('app').innerHTML = `<div class="doc">
    <section class="cover">
      <div class="gov">בית חינוך גליל מערבי · סמל 260489</div>
      <h1>נוהל פינוי<br>בית הספר בחירום</h1>
      <h2>דרכי פעולה ומלווי הסעות</h2>
      <div class="school">צוות צל"ח · ${esc(v((DATA.hq || {}).room) || 'חדר 101')}</div>
      <div class="meta">תאריך: ${esc(date) || blank}</div>
    </section>
    <section class="toc"><h2 class="ch" style="page-break-before:auto">תוכן העניינים</h2><ol>
      ${PN_SCHEMA.map(c => `<li><a href="#ch-${esc(c.n)}">${esc(c.t)}</a></li>`).join('')}</ol></section>
    ${PN_SCHEMA.map(c => `<div data-ch="${esc(c.n)}">
      <h2 class="ch" id="ch-${esc(c.n)}">${esc(c.n)}. ${esc(c.t)}</h2>
      ${c.parts.map(rPart).join('')}
      ${c.n === '4' ? '<div class="sig"><div>רכז/ת הביטחון — שם וחתימה</div><div>מנהל/ת בית הספר — שם וחתימה</div></div>' : ''}</div>`).join('')}
    <p class="upd noprint">עודכן לאחרונה: ${UPD ? new Date(UPD).toLocaleString('he-IL') : '—'}</p>
  </div>`;
  $('pFull').onclick = () => doPrint(false);
  $('pLines').onclick = () => doPrint(true);
  $('out').onclick = () => { ss.del(CODE_KEY); location.reload(); };
  document.querySelectorAll('.doc table').forEach(t => { const w = document.createElement('div'); w.className = 'tw'; t.before(w); w.appendChild(t); });
  buildNav();
}

/* ---------- ניווט בין הפרקים ---------- */
let navObs = null;
function setBarH(){ document.documentElement.style.setProperty('--barH', (document.querySelector('.bar').offsetHeight + 8) + 'px'); }
function goCh(id, smooth){
  const el = document.getElementById(id); if(!el) return;
  el.scrollIntoView({behavior: smooth ? 'smooth' : 'auto', block: 'start'});
  history.replaceState(null, '', '#' + id);
}
function buildNav(){
  const items = PN_SCHEMA.map(c => ['ch-' + c.n, c.n + '. ' + c.t]);
  const nav = $('chips');
  nav.innerHTML = items.map(([id, t]) => `<a href="#${id}" data-ch="${id}">${esc(t)}</a>`).join('');
  nav.classList.add('on');
  setBarH();
  document.querySelectorAll('a[href^="#ch-"]').forEach(a => a.onclick = e => { e.preventDefault(); goCh(a.getAttribute('href').slice(1), true); });
  if(navObs) navObs.disconnect();
  if('IntersectionObserver' in window){
    navObs = new IntersectionObserver(() => markCur(), {rootMargin: '0px 0px -60% 0px'});
    document.querySelectorAll('h2.ch[id]').forEach(h => navObs.observe(h));
  }
  if(/^#ch-/.test(location.hash)) setTimeout(() => goCh(location.hash.slice(1), false), 50);
}
function markCur(){
  const lim = (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--barH')) || 120) + 20;
  let cur = null;
  document.querySelectorAll('h2.ch[id]').forEach(h => { if(h.getBoundingClientRect().top <= lim) cur = h.id; });
  document.querySelectorAll('#chips a').forEach(a => {
    const on = a.dataset.ch === cur;
    if(on && !a.classList.contains('cur')){
      const nav = $('chips'), r = a.getBoundingClientRect(), n = nav.getBoundingClientRect();
      nav.scrollBy({left: (r.left + r.width / 2) - (n.left + n.width / 2)});
    }
    a.classList.toggle('cur', on);
  });
}
window.addEventListener('scroll', () => { $('topBtn').classList.toggle('on', scrollY > 600); markCur(); }, {passive: true});
window.addEventListener('resize', setBarH);
$('topBtn').onclick = () => { scrollTo({top: 0, behavior: 'smooth'}); history.replaceState(null, '', location.pathname + location.search); };

/* הדפסה: התיק המלא, או רק פרק 3 (טבלאות המלווים) */
function doPrint(linesOnly){
  document.body.classList.toggle('lines', linesOnly);
  window.print();
}
window.addEventListener('afterprint', () => document.body.classList.remove('lines'));

const saved = ss.get(CODE_KEY);
if(saved) load(saved); else gate();
</script>
