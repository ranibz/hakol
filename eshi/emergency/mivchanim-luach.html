<!DOCTYPE html>
<!-- eshi/emergency/mivchanim-luach.html · v1.0.0 · 2026-09-02 · בית חינוך גליל מערבי
     © רני בן זאב. יוזמה עצמאית, מימון עצמי.

     לוח המבחנים כפי שמורה ותלמיד רואים אותו. קובץ נפרד מ-
     mivchanim.html ולא מצב תצוגה בתוכו: מי שנכנס בטלפון לדעת מתי
     המבחן אינו צריך לסחוב את מנוע השיבוץ, ועדיף שהעריכה לא תהיה
     כאן כלל — לא מוסתרת, לא קיימת.

     שלוש תצוגות של אותם נתונים:
     · רשימה — ברירת המחדל. "בעוד שלושה ימים" קריא בטלפון יותר
       מריבוע בלוח חודשי, וזה מה שתלמיד פותח.
     · חודש — לתמונה הכוללת.
     · הדפסה — לתלייה בכיתה ובחדר מורים. הכפתורים נעלמים.

     ⚠ סינון לפי כיתה מציג מבחן שכבתי ומבחן של אותה כיתה. במערכת
     שיובאה אין מורים — ה-PDF הכיל מקצועות וכיתות בלבד — ולכן אין
     "המבחנים שלי" למורה, אלא "המבחנים של הכיתה". זו מגבלת נתונים
     ולא החלטה.

     ⚠ שורת הגלישה מוצגת כאן בכוונה: המורה שהשיעור שלו נגזל הוא
     בדיוק מי שצריך לדעת על כך, והוא לא נמצא בחדר כשהרכז שיבץ. -->
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>לוח מבחנים · בית חינוך גליל מערבי</title>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2340;--soft:#6a6f8a;--bg:#f5f4f9;--line:#e3e0ee;--a:#4c1d95;--b:#0f766e;
  --ok:#12b76a;--warn:#e08600;--no:#dc2626}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Assistant',sans-serif;
  font-size:16px;line-height:1.6;padding-bottom:40px}
h1,h2,h3{font-family:'Secular One',sans-serif;font-weight:400;margin:0}
.top{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;padding:14px 0}
.topin{max-width:900px;margin:0 auto;padding:0 15px;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.topin h1{font-size:1.25rem}
.topin .sb{opacity:.85;font-size:.84rem}
.wrap{max-width:900px;margin:0 auto;padding:15px}
.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.bar > div{flex:1;min-width:118px}
label{display:block;font-weight:800;font-size:.78rem;margin-bottom:3px;color:var(--soft)}
select{font-family:inherit;font-size:.95rem;border:1px solid #d5d2e4;border-radius:10px;
  padding:9px 12px;background:#fff;color:var(--ink);width:100%}
.tg{display:flex;border:1px solid #d5d2e4;border-radius:10px;overflow:hidden;background:#fff}
.tg button{flex:1;border:0;background:#fff;font-family:inherit;font-weight:800;
  font-size:.87rem;padding:9px 13px;cursor:pointer;color:var(--soft)}
.tg button.on{background:var(--a);color:#fff}
.btn{background:#efedf7;color:var(--ink);border:0;border-radius:10px;padding:9px 17px;
  font-family:inherit;font-weight:800;font-size:.87rem;cursor:pointer}

/* ---- רשימה ---- */
.wk{font-family:'Secular One',sans-serif;font-size:1.02rem;margin:17px 0 8px;
  color:var(--a);display:flex;align-items:center;gap:9px}
.wk::after{content:'';flex:1;height:1px;background:var(--line)}
.x{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 15px;
  margin-bottom:8px;display:flex;gap:13px;align-items:flex-start}
.x .dt{text-align:center;flex-shrink:0;min-width:52px}
.x .dt b{display:block;font-family:'Secular One',sans-serif;font-size:1.5rem;line-height:1.1}
.x .dt span{display:block;font-size:.73rem;color:var(--soft);font-weight:800}
.x .bd{flex:1;min-width:0}
.x h3{font-size:1.06rem}
.x .meta{font-size:.85rem;color:var(--soft)}
.x .tag{display:inline-block;font-size:.73rem;font-weight:800;border-radius:20px;
  padding:1px 9px;margin:5px 5px 0 0;background:#f1effb;color:var(--a)}
.x .tag.b{background:#e6f4f1;color:var(--b)}
.x .tag.y{background:#fff6e8;color:#8a5a00}
.x .cd{font-size:.8rem;font-weight:800;color:var(--warn);white-space:nowrap}
.x.soon{border-color:#f0d9b4;background:#fffdf8}
.x.today{border-color:var(--no);background:#fff8f8}

/* ---- חודש ---- */
.mhead{display:flex;gap:9px;align-items:center;margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.cal .wd{font-weight:800;font-size:.76rem;color:var(--soft);text-align:center}
.cell{background:#fff;border:1px solid var(--line);border-radius:10px;min-height:74px;
  padding:5px 6px;font-size:.78rem}
.cell.out{background:#faf9fd;opacity:.5}
.cell.vac{background:#fbeeee;border-color:#eccfcf}
.cell .dn{font-family:'Secular One',sans-serif;font-size:.86rem;color:var(--soft)}
.cell .heb{font-size:.66rem;color:#a7a3b8}
.ev{display:block;font-size:.68rem;font-weight:800;color:#9f1239;background:#fdecea;
  border-radius:5px;padding:1px 5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex{display:block;font-size:.72rem;font-weight:800;color:#fff;background:var(--a);
  border-radius:6px;padding:2px 5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex.cls{background:var(--b)}
.empty{color:var(--soft);text-align:center;padding:30px;font-size:.94rem}
.foot{max-width:900px;margin:0 auto;padding:8px 15px;color:var(--soft);font-size:.8rem}

@media print{
  body{background:#fff;padding:0}
  .top{background:none;color:var(--ink);padding:0 0 8px;border-bottom:2px solid var(--ink)}
  .bar,.noprint{display:none!important}
  .x{break-inside:avoid;border-color:#bbb}
  .cell{min-height:60px}
  .wrap{max-width:none;padding:8px 0}
  @page{margin:12mm}
}
@media(max-width:600px){.topin h1{font-size:1.08rem}.x .dt b{font-size:1.3rem}}
</style>
</head>
<body>
<div class="top"><div class="topin">
  <h1>📝 לוח מבחנים</h1>
  <span class="sb" id="sub"></span>
</div></div>

<div class="wrap">
  <div class="bar noprint">
    <div><label>שכבה</label><select id="gSel" onchange="setG(this.value)"></select></div>
    <div><label>כיתה</label><select id="cSel" onchange="CLS=this.value;render()"></select></div>
    <div style="flex:1.2"><label>תצוגה</label>
      <div class="tg">
        <button id="tgL" onclick="MODE='list';render()">רשימה</button>
        <button id="tgM" onclick="MODE='cal';render()">חודש</button>
      </div></div>
    <button class="btn" onclick="window.print()">🖨️ הדפסה</button>
  </div>
  <div id="app"><div class="empty">טוען…</div></div>
</div>
<div class="foot noprint" id="foot"></div>

<script>
const SURL='https://skfriefqnoxfzmamcokd.supabase.co';
const SKEY='sb_publishable_Qx7EDPbdyYE9iv7uMQBKhQ_Aeojd_Q0';
async function api(p){
  const r=await fetch(SURL+'/rest/v1/'+p,{headers:{apikey:SKEY,Authorization:'Bearer '+SKEY}});
  if(!r.ok) throw new Error((await r.text()).slice(0,180));
  const t=await r.text(); return t?JSON.parse(t):[];
}
const el=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const GRADES=['ז','ח','ט','י','יא','יב'];
const JUNIOR=['ז','ח','ט'];
const DAYS=['','ראשון','שני','שלישי','רביעי','חמישי','שישי'];
const WD=['ראשון','שני','שלישי','רביעי','חמישי','שישי'];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromIso=s=>{ const [y,m,d]=String(s).split('-').map(Number); return new Date(y,m-1,d); };
const addD=(d,n)=>{ const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const dayIdx=d=>d.getDay()===6?0:d.getDay()+1;
const weekStart=d=>addD(d,-(d.getDay()===6?6:d.getDay()));
function planYear(){ const d=new Date(); return d.getMonth()>=7?d.getFullYear():d.getFullYear()-1; }
function yearLabel(y){ return 'תשפ״'+['ו','ז','ח','ט','י'][y-2025]+' · '+y+'/'+(y+1); }
const hebDay=d=>{ try{ return new Intl.DateTimeFormat('he-u-ca-hebrew',
  {day:'numeric',month:'short'}).format(d); }catch(e){ return ''; } };
const today=()=>{ const t=new Date(); return new Date(t.getFullYear(),t.getMonth(),t.getDate()); };
const daysTo=d=>Math.round((d-today())/86400000);

let YEAR=planYear(), GRADE='י', CLS='', MODE='list', MONTH=null,
    BOARD=[], GANTT=[], CLASSES=[];

async function load(){
  BOARD=await api('exam_board?select=*&year_start=eq.'+YEAR+
    '&grade=eq.'+encodeURIComponent(GRADE)+'&order=exam_date,hour');
  GANTT=await api('gantt_events?select=track,title,start_date,end_date&year_start=eq.'+YEAR);
  /* רשימת הכיתות מגיעה מן המערכת ולא מן המבחנים: כיתה שאין לה
     עדיין מבחן חייבת להופיע בבורר, אחרת נראה כאילו היא לא קיימת. */
  const tt=await api('exam_timetable?select=class_name&year_start=eq.'+YEAR+
    '&grade=eq.'+encodeURIComponent(GRADE));
  CLASSES=[...new Set(tt.map(r=>r.class_name))].sort((a,b)=>{
    const n=s=>parseInt(String(s).replace(/\D+/g,''),10)||0;
    return n(a)-n(b)||String(a).localeCompare(b,'he');
  });
}

/* מבחן נוגע לכיתה אם הוא שכבתי או שלה */
const mine=e=>!CLS || e.scope==='grade' || e.class_name===CLS;

function eventsOn(dt){
  const s=iso(dt);
  return GANTT.filter(e=>e.start_date<=s&&s<=e.end_date).filter(e=>{
    if(e.track==='vacation') return true;
    if(e.track==='junior') return JUNIOR.indexOf(GRADE)>-1;
    if(e.track==='senior') return JUNIOR.indexOf(GRADE)<0;
    return false;
  });
}

/* ============================================================
   רשימה — ברירת המחדל
   ------------------------------------------------------------
   מקובץ לשבועות ולא לחודשים: תלמיד שואל "מה יש לי השבוע",
   ולא "מה יש באוקטובר".
   ============================================================ */
function weekLabel(ws){
  const now=weekStart(today());
  const diff=Math.round((ws-now)/604800000);
  if(diff===0) return 'השבוע';
  if(diff===1) return 'שבוע הבא';
  const e=addD(ws,5);
  return ws.getDate()+'.'+pad(ws.getMonth()+1)+' – '+e.getDate()+'.'+pad(e.getMonth()+1);
}
function countdown(d){
  const n=daysTo(d);
  if(n<0) return '';
  if(n===0) return 'היום';
  if(n===1) return 'מחר';
  if(n<=14) return 'בעוד '+n+' ימים';
  return '';
}
function listScreen(){
  const up=BOARD.filter(mine).filter(e=>daysTo(fromIso(e.exam_date))>=0);
  if(!up.length) return '<div class="empty">אין מבחנים קרובים'+
    (CLS?' ל'+esc(CLS):' בשכבה '+esc(GRADE))+'.</div>';
  const wks={};
  up.forEach(e=>{ const k=iso(weekStart(fromIso(e.exam_date))); (wks[k]=wks[k]||[]).push(e); });
  return Object.keys(wks).sort().map(k=>{
    const ws=fromIso(k);
    return '<div class="wk">'+esc(weekLabel(ws))+
      ' <span style="font-size:.78rem;color:var(--soft);font-weight:400">'+
      wks[k].length+' מבחנים</span></div>'+
      wks[k].map(e=>{
        const d=fromIso(e.exam_date), n=daysTo(d), cd=countdown(d);
        return '<div class="x'+(n===0?' today':n<=3?' soon':'')+'">'+
          '<div class="dt"><b>'+d.getDate()+'</b><span>'+
            new Intl.DateTimeFormat('he',{month:'short'}).format(d)+'</span>'+
            '<span>'+esc(hebDay(d))+'</span></div>'+
          '<div class="bd"><h3>'+esc(e.title||e.subject_base)+'</h3>'+
            '<div class="meta">יום '+DAYS[dayIdx(d)]+' · שעה '+e.hour+
              (e.hour_end&&e.hour_end!==e.hour?'–'+e.hour_end:'')+'</div>'+
            '<span class="tag">'+esc(e.subject_base)+
              (e.level?' · '+esc(e.level):'')+'</span>'+
            '<span class="tag b">'+(e.scope==='grade'?'כל שכבה '+esc(GRADE):
              esc(e.class_name))+'</span>'+
            (e.displaced?'<span class="tag y">על חשבון '+esc(e.displaced)+'</span>':'')+
            (e.notes?'<div class="meta" style="margin-top:5px">'+esc(e.notes)+'</div>':'')+
          '</div>'+
          (cd?'<div class="cd">'+cd+'</div>':'')+
        '</div>';
      }).join('');
  }).join('');
}

/* ============================================================
   חודש
   ============================================================ */
function monthCells(){
  const first=new Date(MONTH.y,MONTH.m,1);
  const start=weekStart(first);
  const out=[];
  for(let i=0;i<42&&out.length<36;i++){
    const d=addD(start,i);
    if(d.getDay()!==6) out.push(d);
  }
  return out;
}
function shiftMonth(n){
  const d=new Date(MONTH.y,MONTH.m+n,1);
  MONTH={y:d.getFullYear(),m:d.getMonth()}; render();
}
function calScreen(){
  const byDate={};
  BOARD.filter(mine).forEach(e=>{ (byDate[e.exam_date]=byDate[e.exam_date]||[]).push(e); });
  return '<div class="mhead noprint">'+
    '<button class="btn" onclick="shiftMonth(-1)">→ הקודם</button>'+
    '<h2>'+esc(new Intl.DateTimeFormat('he',{month:'long',year:'numeric'})
      .format(new Date(MONTH.y,MONTH.m,1)))+'</h2>'+
    '<button class="btn" onclick="shiftMonth(1)">הבא ←</button></div>'+
    '<div class="cal">'+WD.map(w=>'<div class="wd">'+w+'</div>').join('')+
    monthCells().map(d=>{
      const s=iso(d), out=d.getMonth()!==MONTH.m;
      const evs=eventsOn(d), vac=evs.some(e=>e.track==='vacation');
      return '<div class="cell'+(out?' out':'')+(vac?' vac':'')+'">'+
        '<div class="dn">'+d.getDate()+' <span class="heb">'+esc(hebDay(d))+'</span></div>'+
        evs.slice(0,1).map(e=>'<span class="ev">'+esc(e.title)+'</span>').join('')+
        (byDate[s]||[]).map(e=>'<span class="ex'+(e.scope==='class'?' cls':'')+'">'+
          esc(e.subject_base)+' ש׳'+e.hour+'</span>').join('')+
      '</div>';
    }).join('')+'</div>';
}

/* ============================================================
   מסך
   ============================================================ */
function render(){
  el('tgL').classList.toggle('on',MODE==='list');
  el('tgM').classList.toggle('on',MODE==='cal');
  el('cSel').innerHTML='<option value="">כל השכבה</option>'+
    CLASSES.map(c=>'<option'+(c===CLS?' selected':'')+'>'+esc(c)+'</option>').join('');
  el('sub').textContent='שכבה '+GRADE+(CLS?' · '+CLS:'')+' · '+yearLabel(YEAR);
  const past=BOARD.filter(mine).filter(e=>daysTo(fromIso(e.exam_date))<0).length;
  el('foot').textContent=BOARD.filter(mine).length+' מבחנים בשנה'+
    (past?' · '+past+' כבר נערכו':'');
  el('app').innerHTML = MODE==='list' ? listScreen() : calScreen();
}

async function boot(){
  el('app').innerHTML='<div class="empty">טוען…</div>';
  try{
    await load();
    if(!MONTH){ const t=new Date(); MONTH={y:t.getFullYear(),m:t.getMonth()}; }
    render();
  }catch(e){
    el('app').innerHTML='<div class="empty">שגיאה בטעינה: '+esc(e.message)+'</div>';
  }
}
function setG(g){ GRADE=g; CLS=''; boot(); }

(function init(){
  const q=new URLSearchParams(location.search);
  if(q.get('grade')) GRADE=q.get('grade');
  if(q.get('class')) CLS=q.get('class');
  if(q.get('year')) YEAR=parseInt(q.get('year'),10);
  if(q.get('mode')==='cal') MODE='cal';
  el('gSel').innerHTML=GRADES.map(g=>'<option'+(g===GRADE?' selected':'')+'>'+g+
    '</option>').join('');
  boot();
})();
</script>
</body>
</html>
