<!DOCTYPE html>
<!--
  כרטיס תלמיד דיגיטלי + סורק שומר — גרסת בדיקה
  v0.2.0 | 22.10.2026 | פיתוח: רני בן זאב
  שינויים:
  - v0.2.0: ה-QR בכרטיס הוא עכשיו קישור (?scan=TOKEN), כך שגם המצלמה הרגילה של הטלפון פותחת אותו.
    רק טלפון שהוגדר כ"טלפון שומר" (קוד שומר, בבדיקה: 1234) רושם איחור; טלפון אחר מקבל "מכשיר לא מורשה".
    הסורק שבתוך מסך השומר ממשיך לעבוד וקורא גם את הפורמט החדש.
  - v0.1.0: גרסה ראשונה לבדיקה. נתוני דמה מובנים, ללא Supabase.
    מסכים: רשימת תלמידי דמה (?), כרטיס תלמיד (?card=TOKEN), סורק שומר (?mode=guard).
    השומר סורק QR מהכרטיס ← מוצג אישור גדול ← נרשם "הגיע באיחור" (נשמר מקומית בטלפון השומר בלבד).
-->
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כרטיס תלמיד — בדיקה v0.2.0</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{--bg:#f2f4f8;--card:#fff;--ink:#1c2333;--muted:#6b7385;--brand:#1f4fa3;--ok:#14975a;--warn:#d98a00;--bad:#c62f2f;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:480px;margin:0 auto;padding:16px}
  h1{font-size:20px;margin:8px 0 4px}
  .muted{color:var(--muted);font-size:14px}
  .badge{display:inline-block;font-size:11px;background:#e3e8f2;color:var(--muted);padding:2px 8px;border-radius:99px}
  .btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--brand);color:#fff;font-size:17px;font-weight:600;text-align:center;text-decoration:none;margin:10px 0;cursor:pointer}
  .btn.sec{background:#e3e8f2;color:var(--ink)}
  .list a{display:flex;justify-content:space-between;padding:12px 14px;background:var(--card);border-radius:10px;margin:6px 0;text-decoration:none;color:var(--ink)}
  /* כרטיס */
  .idcard{background:linear-gradient(160deg,#1f4fa3,#163a7a);color:#fff;border-radius:20px;padding:20px;margin-top:12px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
  .idcard .school{font-size:13px;opacity:.85}
  .idcard .name{font-size:28px;font-weight:700;margin:14px 0 2px}
  .idcard .cls{font-size:18px;opacity:.9}
  .qrbox{background:#fff;border-radius:14px;padding:16px;margin-top:18px;display:flex;justify-content:center}
  .clock{text-align:center;font-size:15px;margin-top:12px;opacity:.9}
  /* שומר */
  #reader{width:100%;border-radius:14px;overflow:hidden;background:#000;margin-top:10px}
  .result{display:none;border-radius:16px;padding:22px;margin-top:12px;color:#fff;text-align:center}
  .result.ok{background:var(--ok)} .result.dup{background:var(--warn)} .result.bad{background:var(--bad)}
  .result .big{font-size:28px;font-weight:700;margin:6px 0}
  .result .mid{font-size:18px}
  .log{background:var(--card);border-radius:12px;padding:6px 12px;margin-top:14px}
  .log .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eef0f4;font-size:15px}
  .log .row:last-child{border-bottom:0}
  input{width:100%;padding:12px;border:1px solid #d5dae4;border-radius:10px;font-size:16px;margin-top:8px}
  footer{text-align:center;color:var(--muted);font-size:12px;margin:24px 0 8px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<footer>פיתוח: רני בן זאב · גרסת בדיקה v0.2.0</footer>

<script>
// ===== נתוני דמה (בשלב הבא יגיעו מ-Supabase) =====
const SCHOOL = 'בית חינוך גליל מערבי';
const STUDENTS = [
  {token:'k7Qp2xVm9TfL', name:'נועה כהן',   cls:'י-3'},
  {token:'R4nWz8bHs2Yd', name:'איתי לוי',   cls:'יא-2'},
  {token:'Hc9Lm3Pq7XwE', name:'מאיה אברהם', cls:'ז-5'},
  {token:'t2VbN6jKr8Ua', name:'עומר מזרחי', cls:'יב-6'},
];
const PREFIX = 'GMCARD:';            // פורמט ישן (v0.1.0) — עדיין נתמך בסורק
const GUARD_PIN = '1234';            // קוד שומר לבדיקה בלבד
const GUARD_KEY = 'gm_guard_device';
const scanUrl = t => location.origin + location.pathname + '?scan=' + t;
function isGuard(){ try{ return localStorage.getItem(GUARD_KEY) === '1'; }catch(e){ return false; } }
function setGuard(){ try{ localStorage.setItem(GUARD_KEY,'1'); }catch(e){} }
function tokenFromText(text){
  if(text.startsWith(PREFIX)) return text.slice(PREFIX.length);
  try{ return new URL(text).searchParams.get('scan'); }catch(e){ return null; }
}
const LOG_KEY = 'gm_late_demo_' + new Date().toISOString().slice(0,10);

const app = document.getElementById('app');
const params = new URLSearchParams(location.search);
const byToken = t => STUDENTS.find(s => s.token === t);
const hhmm = d => d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function loadLog(){ try{ return JSON.parse(localStorage.getItem(LOG_KEY)) || []; }catch(e){ return []; } }
function saveLog(l){ try{ localStorage.setItem(LOG_KEY, JSON.stringify(l)); }catch(e){} }

// ===== ניתוב =====
if (params.get('card')) renderCard(params.get('card'));
else if (params.get('scan')) handleScanLink(params.get('scan'));
else if (params.get('mode') === 'guard') isGuard() ? renderGuard() : renderPin(()=>renderGuard());
else renderHome();

// ===== נפתח מסריקה במצלמה הרגילה =====
function handleScanLink(token){
  history.replaceState(null,'',location.pathname); // שרענון לא ירשום שוב
  if(isGuard()){ renderGuard(); register(token,'סריקה'); return; }
  app.innerHTML = `
    <h1>❌ מכשיר לא מורשה</h1>
    <p class="muted">רק טלפון השומר יכול לרשום כניסה באיחור. התלמיד צריך להציג את הכרטיס לשומר.</p>
    <button class="btn sec" id="iamGuard">אני השומר — הגדרת הטלפון</button>`;
  document.getElementById('iamGuard').onclick = () => renderPin(()=>{ renderGuard(); register(token,'סריקה'); });
}

// ===== הגדרת טלפון שומר =====
function renderPin(next){
  app.innerHTML = `
    <h1>🛡️ הגדרת טלפון שומר</h1>
    <p class="muted">פעולה חד-פעמית. לאחריה הטלפון הזה יוכל לרשום איחורים.</p>
    <input id="pin" type="password" inputmode="numeric" placeholder="קוד שומר">
    <button class="btn" id="pinOk">אישור</button>
    <p class="muted" id="pinErr" style="color:var(--bad)"></p>`;
  document.getElementById('pinOk').onclick = () => {
    if(document.getElementById('pin').value.trim() === GUARD_PIN){ setGuard(); next(); }
    else document.getElementById('pinErr').textContent = 'קוד שגוי';
  };
}

// ===== מסך פתיחה (לבדיקה בלבד) =====
function renderHome(){
  const base = location.pathname;
  app.innerHTML = `
    <h1>כרטיס תלמיד — בדיקה <span class="badge">v0.2.0</span></h1>
    <p class="muted">פתחו כרטיס של תלמיד בטלפון אחד, ואת מסך השומר בטלפון אחר.</p>
    <a class="btn" href="${base}?mode=guard">🛡️ מסך שומר — סריקה</a>
    <h1 style="margin-top:20px">כרטיסי דמה</h1>
    <div class="list">
      ${STUDENTS.map(s=>`<a href="${base}?card=${s.token}"><span>${esc(s.name)}</span><span class="muted">${esc(s.cls)}</span></a>`).join('')}
    </div>`;
}

// ===== כרטיס תלמיד =====
function renderCard(token){
  const s = byToken(token);
  if(!s){ app.innerHTML = `<h1>הכרטיס לא נמצא</h1><p class="muted">בקשו מהמחנך קישור חדש.</p>`; return; }
  app.innerHTML = `
    <div class="idcard">
      <div class="school">🎓 ${SCHOOL} · כרטיס תלמיד</div>
      <div class="name">${esc(s.name)}</div>
      <div class="cls">כיתה ${esc(s.cls)}</div>
      <div class="qrbox"><div id="qr"></div></div>
      <div class="clock" id="clock"></div>
    </div>
    <p class="muted" style="text-align:center;margin-top:14px">הציגו את הכרטיס לשומר בכניסה</p>`;
  new QRCode(document.getElementById('qr'), {text: scanUrl(s.token), width:230, height:230, correctLevel: QRCode.CorrectLevel.M});
  // שעון חי — מקשה על הצגת צילום מסך ישן
  const tick = () => document.getElementById('clock').textContent =
    new Date().toLocaleString('he-IL',{weekday:'long',day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  tick(); setInterval(tick, 1000);
}

// ===== מסך שומר =====
let scanner = null, busy = false;
function renderGuard(){
  app.innerHTML = `
    <h1>🛡️ קליטת מאחרים <span class="badge">v0.2.0</span></h1>
    <p class="muted">כוונו את המצלמה לכרטיס התלמיד</p>
    <button class="btn" id="startBtn">הפעלת מצלמה</button>
    <div id="reader"></div>
    <div class="result" id="result"></div>
    <input id="search" placeholder="תלמיד בלי טלפון? חיפוש ידני לפי שם…">
    <div class="list" id="searchRes"></div>
    <div class="log" id="log"></div>`;
  document.getElementById('startBtn').onclick = startScanner;
  document.getElementById('search').oninput = e => {
    const q = e.target.value.trim();
    document.getElementById('searchRes').innerHTML = !q ? '' :
      STUDENTS.filter(s=>s.name.includes(q)).map(s=>`<a href="#" data-t="${s.token}"><span>${esc(s.name)}</span><span class="muted">${esc(s.cls)}</span></a>`).join('');
  };
  document.getElementById('searchRes').onclick = e => {
    const a = e.target.closest('a'); if(!a) return; e.preventDefault();
    register(a.dataset.t, 'ידני');
    document.getElementById('search').value=''; document.getElementById('searchRes').innerHTML='';
  };
  drawLog();
}

function startScanner(){
  document.getElementById('startBtn').style.display='none';
  scanner = new Html5Qrcode('reader');
  scanner.start({facingMode:'environment'}, {fps:10, qrbox:{width:240,height:240}}, onScan)
    .catch(err => { showResult('bad','אין גישה למצלמה','יש לאשר הרשאת מצלמה בדפדפן'); document.getElementById('startBtn').style.display='block'; });
}

function onScan(text){
  if(busy) return;
  busy = true;
  try{ scanner.pause(true); }catch(e){}
  const token = tokenFromText(text);
  if(!token) showResult('bad','קוד לא מוכר','זה לא כרטיס תלמיד');
  else register(token, 'סריקה');
  setTimeout(()=>{ busy=false; try{ scanner.resume(); }catch(e){} }, 2500);
}

function register(token, source){
  const s = byToken(token);
  if(!s){ showResult('bad','כרטיס לא תקף','הפנו את התלמיד למזכירות'); return; }
  const log = loadLog();
  const prev = log.find(r => r.token === token);
  if(prev){ showResult('dup', s.name, `כבר נרשם היום ב-${prev.time}`); return; }
  const time = hhmm(new Date());
  log.unshift({token, name:s.name, cls:s.cls, time, source});
  saveLog(log);
  if(navigator.vibrate) navigator.vibrate(150);
  showResult('ok', s.name, `כיתה ${s.cls} · נרשם/ה באיחור ${time}`);
  drawLog();
}

function showResult(kind, big, mid){
  const r = document.getElementById('result');
  r.className = 'result ' + kind;
  r.innerHTML = `<div>${kind==='ok'?'✅':kind==='dup'?'⚠️':'❌'}</div><div class="big">${esc(big)}</div><div class="mid">${esc(mid)}</div>`;
  r.style.display = 'block';
  clearTimeout(r._t); r._t = setTimeout(()=> r.style.display='none', 4000);
}

function drawLog(){
  const log = loadLog();
  document.getElementById('log').innerHTML = `<div class="row"><b>מאחרים היום</b><b>${log.length}</b></div>` +
    log.map(r=>`<div class="row"><span>${esc(r.name)} · ${esc(r.cls)}</span><span class="muted">${r.time}${r.source==='ידני'?' ✍️':''}</span></div>`).join('');
}
</script>
</body>
</html>
