     v1.2.0 · נוספה לשונית צפייה: מפת כיסוי של כל השכבות והימים,
     ומתחתיה המערכת השמורה לפי בחירת שכבה ויום. הייבוא נעשה
     בעשרות הדבקות, והשאלה "מה כבר נכנס ומה נפל" הייתה מחייבת
     שאילתת SQL. תא שמספר הכיתות בו אינו כמצופה מסומן בצהוב —
     זה הסימן לעמודה שנפלה בהדבקה (MINOR).

     v1.1.0 · נוספו שכבות חטיבת הביניים — ז, ח, ט. הכלי נבנה על

     הכיתות בהן הוא ברירת מחדל ומתוקן בשדה הכיתות (MINOR).

     ייבוא המערכת ונירמול המקצועות — הבסיס של לוח המבחנים.
     המערכת אינה יושבת בשום מסד בבית הספר, ולכן היא נכנסת כאן

     ההדבקה ולא ההעלאה: ה-PDF שיוצא מ"Print To PDF" שומר כל תא

     העתקה מאקסל, לעומת זאת, מגיעה לדפדפן כ-TSV מדויק. אין OCR,
     ואין ניחוש.

     יום אחד בכל הדבקה, ולא הגיליון כולו: בגיליון יש תאים ממוזגים,
     עמודת ימים מסובבת ושורות ריקות, וכל אלה שוברים ניתוח גורף.
     בלוק מלבני של שעות על כיתות נקרא נכון תמיד, ורואים אותו
     בתצוגה מקדימה לפני שהוא נכנס.

     ⚠ הכיתות מסודרות מימין לשמאל בגיליון עברי, ולכן העמודה
     הראשונה ב-TSV היא י-1. אם יצא הפוך — כפתור היפוך, ולא
     תיקון ידני של שבע עמודות.

     הנירמול נשמר בטבלה נפרדת מהמערכת. ייבוא חוזר בשנה הבאה

<script>
/* ============================================================
   חיבור — skfriefqnoxfzmamcokd, אותו מסד של gantt_events
   ============================================================ */
const SURL='https://skfriefqnoxfzmamcokd.supabase.co';
const SKEY='sb_publishable_Qx7EDPbdyYE9iv7uMQBKhQ_Aeojd_Q0';
async function api(path,opts={}){
  const r=await fetch(SURL+'/rest/v1/'+path,{...opts,
    headers:{apikey:SKEY,Authorization:'Bearer '+SKEY,
             'Content-Type':'application/json',Prefer:opts.prefer||''}});
  if(!r.ok) throw new Error((await r.text()).slice(0,200));
  const t=await r.text(); return t?JSON.parse(t):null;
}

const el=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const DAYS=['','ראשון','שני','שלישי','רביעי','חמישי','שישי'];
/* ברירת מחדל מן המערכות של תשפ״ז. ניתנת לעריכה — שכבה שתגדל
   לשמונה כיתות לא צריכה גרסה חדשה של הקובץ. */
/* שש שכבות: חט״ן ז–ט וחט״ע י–יב. המספר הוא ברירת מחדל בלבד —
   שדה הכיתות ניתן לעריכה, ושכבה שתגדל אינה דורשת גרסה חדשה.
   ההפרדה חשובה גם לגאנט: מסלול junior הוא ז–ט, senior הוא י–יב. */
const CLASSES={'ז':6,'ח':6,'ט':6,'י':7,'יא':6,'יב':7};
const JUNIOR=['ז','ח','ט'];
/* שנת התכנון עוברת באוגוסט: את הלוח בונים לפני שהשנה נפתחת.
   אותו כלל בדיוק כמו בגאנט, אחרת שני הכלים יציגו שנים שונות. */
function planYear(){ const d=new Date(); return d.getMonth()>=7 ? d.getFullYear() : d.getFullYear()-1; }
function yearLabel(y){ return 'תשפ״' + ['ו','ז','ח','ט','י'][y-2025] + ' · ' + y + '/' + (y+1); }

let TAB='tt', YEAR=planYear(), GRADE='י', DAY=1,
    CLS=[], PARSED=null, FLIP=false, COUNTS={}, SUBS=[], MAP={};

function classNames(g){ const n=CLASSES[g]||6, a=[]; for(let i=1;i<=n;i++) a.push(g+'-'+i); return a; }

/* ============================================================
   ניתוח ההדבקה
   ------------------------------------------------------------
   אקסל מדביק TSV. תא שיש בו כמה שורות (הקבצה) מגיע עטוף
   במרכאות ועם שורות חדשות בתוכו, ולכן לא ניתן לפצל בפשטות
   על \n — צריך מפענח שמכיר מרכאות.
   ============================================================ */
function parseTSV(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; }
      else cell+=c;
    }else{
      if(c==='"' && cell===''){ q=true; }
      else if(c==='\t'){ row.push(cell); cell=''; }
      else if(c==='\r'){ /* מתעלם */ }
      else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
      else cell+=c;
    }
  }
  if(cell!=='' || row.length){ row.push(cell); rows.push(row); }
  return rows;
}

/* עמודה ריקה לגמרי היא שריד של תא ממוזג — עמודת הימים המסובבת,
   או מפריד. היא יורדת, אחרת היא מזיזה את כל הכיתות בשדה אחד. */
function cleanGrid(rows){
  let g=rows.map(r=>r.map(c=>String(c==null?'':c).trim()));
  g=g.filter(r=>r.some(c=>c!==''));
  if(!g.length) return {grid:[],hours:null};
  const w=Math.max(...g.map(r=>r.length));
  g=g.map(r=>{ const x=r.slice(); while(x.length<w) x.push(''); return x; });

  /* עמודת מספרי שעה — אם קיימת, היא קובעת את השעה ואינה כיתה.
     באקסל תא השעה ממוזג על פני כמה שורות, ולכן המספר מופיע פעם
     אחת והשורות שאחריו ריקות. המספר נמשך קדימה, והשורות שחולקות
     שעה מאוחדות לתא אחד — אחרת הקבצה שנכתבה בשורות נפרדות הייתה
     נספרת כשעות שונות. */
  let hours=null;
  const first=g.map(r=>r[0]);
  const nums=first.filter(v=>v!=='');
  if(nums.length>=3 && nums.every(v=>/^\d{1,2}$/.test(v) && +v>=1 && +v<=12)){
    hours=[]; let cur=null;
    first.forEach(v=>{ if(v!=='') cur=parseInt(v,10); hours.push(cur); });
    g=g.map(r=>r.slice(1));
  }
  /* עמודות ריקות */
  const keep=[];
  for(let c=0;c<g[0].length;c++) if(g.some(r=>r[c]!=='')) keep.push(c);
  g=g.map(r=>keep.map(c=>r[c]));

  if(hours){
    const m=new Map();
    g.forEach((r,i)=>{
      const h=hours[i]; if(h==null) return;
      if(!m.has(h)) m.set(h,r.slice());
      else{ const t=m.get(h); r.forEach((c,ci)=>{ if(c) t[ci]=t[ci]?t[ci]+'\n'+c:c; }); }
    });
    hours=[...m.keys()]; g=[...m.values()];
  }
  return {grid:g,hours:hours};
}

function cellSubjects(v){
  const out=[], seen={};
  String(v||'').split(/\n+/).forEach(x=>{
    const s=x.replace(/\s+/g,' ').trim();
    if(s && !seen[s]){ seen[s]=1; out.push(s); }
  });
  return out;
}

function doParse(){
  const raw=el('paste').value;
  if(!raw.trim()) return setMsg('הדביקו את הבלוק מהאקסל.','no');
  const {grid,hours}=cleanGrid(parseTSV(raw));
  if(!grid.length) return setMsg('לא זוהו נתונים בהדבקה.','no');
  PARSED={grid:grid,hours:hours};
  render();
}

function gridClasses(){
  const n=PARSED?PARSED.grid[0].length:0;
  let names=CLS.slice(0,n);
  while(names.length<n) names.push('?'+(names.length+1));
  return FLIP ? names.slice().reverse() : names;
}

/* ============================================================
   שמירה — היום כולו נמחק ונכתב מחדש
   ------------------------------------------------------------
   ייבוא חוזר של יום הוא תיקון, לא תוספת. מחיקה מראש מונעת
   שכבות של מערכות ישנות שאיש לא יבחין בהן.
   ============================================================ */
async function saveDay(){
  if(!PARSED) return;
  const names=gridClasses(), rows=[];
  PARSED.grid.forEach((r,ri)=>{
    const hour=PARSED.hours?PARSED.hours[ri]:ri+1;
    if(!(hour>=1&&hour<=10)) return;
    r.forEach((cell,ci)=>{
      const cn=names[ci];
      if(!cn || cn[0]==='?') return;
      cellSubjects(cell).forEach(s=>{
        rows.push({year_start:YEAR,grade:GRADE,class_name:cn,day:DAY,hour:hour,subject_raw:s});
      });
    });
  });
  if(!rows.length) return setMsg('אין שורות לשמירה.','no');
  const b=el('goBtn'); b.disabled=true; setMsg('שומר…');
  try{
    await api('exam_timetable?year_start=eq.'+YEAR+'&grade=eq.'+encodeURIComponent(GRADE)+
      '&day=eq.'+DAY,{method:'DELETE'});
    for(let i=0;i<rows.length;i+=200)
      await api('exam_timetable',{method:'POST',body:JSON.stringify(rows.slice(i,i+200))});
    PARSED=null; el('paste') && (el('paste').value='');
    await loadCounts();
    render();
    setMsg('✓ נשמרו '+rows.length+' שיבוצים ליום '+DAYS[DAY]+'.','ok');
  }catch(e){ setMsg('שגיאה: '+e.message,'no'); }
  b && (b.disabled=false);
}

async function clearDay(){
  if(!confirm('למחוק את יום '+DAYS[DAY]+' בשכבה '+GRADE+'?')) return;
  try{
    await api('exam_timetable?year_start=eq.'+YEAR+'&grade=eq.'+encodeURIComponent(GRADE)+
      '&day=eq.'+DAY,{method:'DELETE'});
    await loadCounts(); PARSED=null; render(); setMsg('היום נמחק.','ok');
  }catch(e){ setMsg('שגיאה: '+e.message,'no'); }
}

async function loadCounts(){
  COUNTS={};
  const r=await api('exam_timetable?select=day&year_start=eq.'+YEAR+
    '&grade=eq.'+encodeURIComponent(GRADE))||[];
  r.forEach(x=>{ COUNTS[x.day]=(COUNTS[x.day]||0)+1; });
}

function setMsg(t,k){ const m=el('msg'); if(!m)return; m.textContent=t; m.className='msg '+(k||''); }

/* ============================================================
   מסך המערכת
   ============================================================ */
function ttScreen(){
  const names=PARSED?gridClasses():CLS;
  let prev='';
  if(PARSED){
    prev='<div class="card"><h3 style="font-size:1.05rem;margin-bottom:3px">תצוגה מקדימה</h3>'+
      '<p class="hint">'+PARSED.grid.length+' שעות · '+PARSED.grid[0].length+' עמודות. '+
      'ודאו ששמות הכיתות יושבים על העמודות הנכונות לפני השמירה.</p>'+
      (PARSED.grid[0].length!==CLS.length?'<div class="warn">מספר העמודות ('+
        PARSED.grid[0].length+') אינו תואם את מספר הכיתות בשכבה ('+CLS.length+'). '+
        'עמודה שאין לה שם לא תישמר.</div>':'')+
      '<div class="scroll"><table><thead><tr><th style="width:34px">ש׳</th>'+
      names.map(n=>'<th>'+esc(n)+'</th>').join('')+'</tr></thead><tbody>'+
      PARSED.grid.map((r,ri)=>{
        const h=PARSED.hours?PARSED.hours[ri]:ri+1;
        return '<tr><td class="h">'+h+'</td>'+r.map(c=>{
          const s=cellSubjects(c);
          return '<td'+(s.length?'':' class="empty"')+'>'+
            s.map(x=>'<span class="s">'+esc(x)+'</span>').join('')+'</td>';
        }).join('')+'</tr>';
      }).join('')+'</tbody></table></div>'+
      '<div class="row" style="margin-top:12px">'+
        '<button class="btn g" style="flex:0" onclick="FLIP=!FLIP;render()">⇄ היפוך סדר הכיתות</button>'+
        '<button class="btn ok" style="flex:0" id="goBtn" onclick="saveDay()">שמירת יום '+
          DAYS[DAY]+' ←</button>'+
        '<button class="btn g" style="flex:0" onclick="PARSED=null;render()">ביטול</button>'+
      '</div><div id="msg" class="msg"></div></div>';
  }

  return '<div class="card">'+
    '<div class="row">'+
      '<div><label>שנה</label><select onchange="YEAR=+this.value;refresh()">'+
        [YEAR-1,YEAR,YEAR+1].map(y=>'<option value="'+y+'"'+(y===YEAR?' selected':'')+'>'+
          yearLabel(y)+'</option>').join('')+'</select></div>'+
      '<div><label>שכבה</label><select onchange="GRADE=this.value;refresh()">'+
        Object.keys(CLASSES).map(g=>'<option'+(g===GRADE?' selected':'')+'>'+g+'</option>').join('')+
        '</select></div>'+
      '<div><label>כיתות בשכבה</label><input id="clsIn" value="'+esc(CLS.join(', '))+'" '+
        'onchange="CLS=this.value.split(\',\').map(s=>s.trim()).filter(Boolean);render()"></div>'+
    '</div>'+
    '<div class="days">'+[1,2,3,4,5,6].map(d=>
      '<button class="day'+(d===DAY?' on':'')+(COUNTS[d]?' has':'')+'" onclick="DAY='+d+';render()">'+
      DAYS[d]+'<b>'+(COUNTS[d]?COUNTS[d]+' שיבוצים':'ריק')+'</b></button>').join('')+'</div>'+
    '</div>'+

    (PARSED?'':'<div class="card">'+
      '<h3 style="font-size:1.05rem;margin-bottom:3px">הדבקת יום '+DAYS[DAY]+'</h3>'+
      '<p class="hint">באקסל: סמנו את הבלוק של '+DAYS[DAY]+' בלבד — עשר שורות השעות '+
      'על עמודות הכיתות, בלי כותרות — והעתיקו. אפשר לכלול את עמודת מספרי השעה, '+
      'היא תזוהה. תא עם כמה מקצועות (הקבצה) נשמר כמה שורות.</p>'+
      '<textarea id="paste" placeholder="הדביקו כאן (Ctrl+V)"></textarea>'+
      '<div class="row" style="margin-top:11px">'+
        '<button class="btn" style="flex:0" onclick="doParse()">ניתוח ותצוגה מקדימה ←</button>'+
        (COUNTS[DAY]?'<button class="btn no" style="flex:0" onclick="clearDay()">מחיקת היום</button>':'')+
      '</div><div id="msg" class="msg"></div></div>')+
    prev;
}

/* ============================================================
   נירמול המקצועות
   ------------------------------------------------------------
   "הסטוריה" ו"היסטוריה" הם מקצוע אחד, ובלי איחוד הם יפצלו את
   הפס השכבתי לשניים. המפתח הרפוי מסיר י׳ ו-ו׳ ולכן כתיב מלא
   וחסר נופלים יחד — זו הווריאציה הנפוצה בפועל.
   ============================================================ */
const NOEXAM=['חינוך','חנוך','מוטל','מעורבות','השכלה כללית','תעבורה','דיבייט',
  'עבודת גמר','פרויקט','פ.ג','חינוך פיננסי','ייעוץ','שעת מחנך'];
function looseKey(s){ return String(s||'').replace(/[יו״"׳'\s\-]/g,''); }

function guess(raw){
  let s=String(raw).replace(/\s+/g,' ').trim();
  let level=null;
  /* "5 יל" · "5 י״ל" · "3-4 יל" · "יח״ל" — הרמה יורדת מן השם */
  const m=s.match(/(\d\s*-\s*\d|\d)\s*(?:יח)?\s*י\s*[״"']?\s*ל/);
  if(m){ level=m[1].replace(/\s/g,''); s=s.replace(m[0],' '); }
  s=s.replace(/\s+/g,' ').trim().replace(/[-–]$/,'').trim();
  const examable=!NOEXAM.some(k=>s.indexOf(k)===0 || s.indexOf(k)>-1 && k.length>3);
  return {base:s, level:level, examable:examable};
}

async function loadSubs(){
  const tt=await api('exam_timetable?select=subject_raw&year_start=eq.'+YEAR)||[];
  const n={};
  tt.forEach(r=>{ n[r.subject_raw]=(n[r.subject_raw]||0)+1; });
  const saved=await api('exam_subjects?select=*')||[];
  MAP={}; saved.forEach(s=>{ MAP[s.subject_raw]=s; });
  SUBS=Object.keys(n).map(raw=>{
    const s=MAP[raw]||guess(raw);
    return {raw:raw, n:n[raw], base:s.subject_base||s.base,
            level:s.level||null, examable:s.examable!==false, saved:!!MAP[raw]};
  }).sort((a,b)=>a.base.localeCompare(b.base,'he')||a.raw.localeCompare(b.raw,'he'));
}

/* וריאציות שנראות כמו אותו מקצוע — הצעה בלבד, האיחוד ידני */
function variantGroups(){
  const g={};
  SUBS.forEach(s=>{ const k=looseKey(s.base); (g[k]=g[k]||[]).push(s.base); });
  const out=[];
  Object.values(g).forEach(list=>{
    const uniq=[...new Set(list)];
    if(uniq.length>1) out.push(uniq);
  });
  return out;
}

function subScreen(){
  if(!SUBS.length) return '<div class="card"><div class="empty-state">'+
    'אין עדיין מערכת לשנה זו. ייבאו יום אחד לפחות בלשונית "מערכת".</div></div>';
  const vg=variantGroups();
  return (vg.length?'<div class="warn"><b>וריאציות כתיב שכדאי לאחד:</b><br>'+
    vg.map(g=>g.map(esc).join(' · ')).join('<br>')+
    '<br><span style="font-size:.83rem">שינוי השם בעמודת "מקצוע" בשתי השורות לאותו ערך '+
    'מאחד אותן.</span></div>':'')+
    '<div class="card">'+
    '<h3 style="font-size:1.05rem;margin-bottom:3px">'+SUBS.length+' מקצועות · '+yearLabel(YEAR)+'</h3>'+
    '<p class="hint">המקצוע והרמה נגזרו מן השם אוטומטית — בדקו ותקנו. '+
    'מה שאינו נבחן לא יופיע ברשימת המקצועות של לוח המבחנים.</p>'+
    '<div class="scroll"><table><thead><tr><th>כפי שבמערכת</th><th>מקצוע</th>'+
    '<th style="width:80px">רמה</th><th style="width:70px">נבחן</th><th style="width:60px">שיבוצים</th>'+
    '</tr></thead><tbody>'+
    SUBS.map((s,i)=>'<tr class="sub-row"><td>'+esc(s.raw)+
      (s.saved?'':' <span class="pill ok">חדש</span>')+'</td>'+
      '<td><input type="text" value="'+esc(s.base)+'" oninput="SUBS['+i+'].base=this.value"></td>'+
      '<td><input type="text" class="lv" value="'+esc(s.level||'')+'" '+
        'oninput="SUBS['+i+'].level=this.value.trim()||null"></td>'+
      '<td style="text-align:center"><input type="checkbox" class="chk"'+
        (s.examable?' checked':'')+' onchange="SUBS['+i+'].examable=this.checked"></td>'+
      '<td style="text-align:center;color:var(--soft)">'+s.n+'</td></tr>').join('')+
    '</tbody></table></div>'+
    '<div class="row" style="margin-top:12px">'+
      '<button class="btn ok" style="flex:0" onclick="saveSubs()">שמירת הנירמול ←</button>'+
      '<button class="btn g" style="flex:0" onclick="refresh()">טעינה מחדש</button>'+
    '</div><div id="msg" class="msg"></div></div>';
}

async function saveSubs(){
  const rows=SUBS.map(s=>({subject_raw:s.raw, subject_base:(s.base||'').trim()||s.raw,
    level:s.level||null, examable:!!s.examable, updated_at:new Date().toISOString()}));
  setMsg('שומר…');
  try{
    for(let i=0;i<rows.length;i+=200)
      await api('exam_subjects',{method:'POST',body:JSON.stringify(rows.slice(i,i+200)),
        prefer:'resolution=merge-duplicates'});
    setMsg('✓ נשמרו '+rows.length+' מקצועות.','ok');
    await loadSubs(); render();
  }catch(e){ setMsg('שגיאה: '+e.message,'no'); }
}

/* ============================================================
   צפייה — מה באמת יושב במסד
   ------------------------------------------------------------
   הייבוא נעשה בהדבקות רבות, ולכן השאלה "מה כבר נכנס ומה נפל"
   היא השאלה החוזרת. מפת הכיסוי עונה עליה במבט אחד, ולחיצה על
   תא פותחת את היום עצמו — לא צריך SQL כדי לבדוק ייבוא.
   ============================================================ */
let VROWS=[], MATRIX={};

async function loadView(){
  const all=await api('exam_timetable?select=grade,day,class_name&year_start=eq.'+YEAR)||[];
  MATRIX={};
  all.forEach(r=>{
    const k=r.grade+'|'+r.day;
    if(!MATRIX[k]) MATRIX[k]={n:0,cls:{}};
    MATRIX[k].n++; MATRIX[k].cls[r.class_name]=1;
  });
  VROWS=await api('exam_timetable?select=class_name,hour,subject_raw&year_start=eq.'+YEAR+
    '&grade=eq.'+encodeURIComponent(GRADE)+'&day=eq.'+DAY+'&order=hour')||[];
}

/* י-10 אחרי י-9 ולא אחרי י-1: מיון לפי המספר ולא לפי המחרוזת */
function sortCls(a,b){
  const n=s=>parseInt(String(s).replace(/\D+/g,''),10)||0;
  return n(a)-n(b) || String(a).localeCompare(b,'he');
}

function viewScreen(){
  const grades=Object.keys(CLASSES);
  let mtx='<div class="card"><h3 style="font-size:1.05rem;margin-bottom:3px">מפת הכיסוי · '+
    yearLabel(YEAR)+'</h3>'+
    '<p class="hint">כמה שיבוצים נכנסו בכל שכבה ויום, ובסוגריים מספר הכיתות. '+
    'מספר כיתות קטן מהצפוי הוא כמעט תמיד עמודה שנפלה בהדבקה. לחיצה פותחת את היום.</p>'+
    '<div class="scroll"><table><thead><tr><th>שכבה</th>'+
    [1,2,3,4,5,6].map(d=>'<th>'+DAYS[d]+'</th>').join('')+'</tr></thead><tbody>'+
    grades.map(g=>'<tr><td class="h" style="width:auto">'+esc(g)+'</td>'+
      [1,2,3,4,5,6].map(d=>{
        const m=MATRIX[g+'|'+d];
        if(!m) return '<td class="empty" style="text-align:center;color:#b9b6c9">—</td>';
        const c=Object.keys(m.cls).length, exp=CLASSES[g];
        const bad=c!==exp;
        return '<td style="text-align:center;cursor:pointer'+
          (bad?';background:#fff6e8':'')+'" onclick="GRADE=\''+g+'\';DAY='+d+';refresh()">'+
          m.n+' <span style="color:'+(bad?'#8a5a00':'var(--soft)')+'">('+c+')</span></td>';
      }).join('')+'</tr>').join('')+
    '</tbody></table></div></div>';

  const names=[...new Set(VROWS.map(r=>r.class_name))].sort(sortCls);
  const hours=[...new Set(VROWS.map(r=>r.hour))].sort((a,b)=>a-b);
  const at={};
  VROWS.forEach(r=>{ (at[r.class_name+'|'+r.hour]=at[r.class_name+'|'+r.hour]||[]).push(r.subject_raw); });

  let day='<div class="card"><div class="row">'+
    '<div><label>שכבה</label><select onchange="GRADE=this.value;refresh()">'+
      grades.map(g=>'<option'+(g===GRADE?' selected':'')+'>'+g+'</option>').join('')+'</select></div>'+
    '<div><label>יום</label><select onchange="DAY=+this.value;refresh()">'+
      [1,2,3,4,5,6].map(d=>'<option value="'+d+'"'+(d===DAY?' selected':'')+'>'+
        DAYS[d]+'</option>').join('')+'</select></div>'+
    '</div>';

  if(!VROWS.length){
    day+='<div class="empty-state">אין שיבוצים בשכבה '+esc(GRADE)+' ביום '+DAYS[DAY]+'.</div></div>';
    return mtx+day;
  }
  day+='<p class="hint" style="margin:13px 0 0">'+VROWS.length+' שיבוצים · '+names.length+
    ' כיתות · שעות '+hours[0]+'–'+hours[hours.length-1]+'</p>'+
    '<div class="scroll" style="margin-top:9px"><table><thead><tr><th style="width:34px">ש׳</th>'+
    names.map(n=>'<th>'+esc(n)+'</th>').join('')+'</tr></thead><tbody>'+
    hours.map(h=>'<tr><td class="h">'+h+'</td>'+
      names.map(n=>{
        const s=at[n+'|'+h]||[];
        return '<td'+(s.length?'':' class="empty"')+'>'+
          s.map(x=>'<span class="s">'+esc(x)+'</span>').join('')+'</td>';
      }).join('')+'</tr>').join('')+
    '</tbody></table></div></div>';
  return mtx+day;
}

/* ============================================================
   מסך
   ============================================================ */
function go(t){
  TAB=t;
  el('tabT').classList.toggle('on',t==='tt');
  el('tabV').classList.toggle('on',t==='view');
  el('tabS').classList.toggle('on',t==='sub');
  refresh();
}
function render(){
  el('app').innerHTML = TAB==='tt' ? ttScreen() : TAB==='view' ? viewScreen() : subScreen();
}

async function refresh(){
  CLS=classNames(GRADE);
  el('app').innerHTML='<div class="empty-state">טוען…</div>';
  try{
    if(TAB==='tt') await loadCounts();
    else if(TAB==='view') await loadView();
    else await loadSubs();
    render();
  }catch(e){
    el('app').innerHTML='<div class="card"><div class="empty-state">שגיאה: '+esc(e.message)+
      '<br><br>אם הטבלאות טרם נוצרו — יש להריץ את ה-SQL תחילה.</div></div>';
  }
}
refresh();
</script>
