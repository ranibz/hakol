<style>

  *{box-sizing:border-box}

  .wrap{max-width:560px;margin:0 auto;padding:14px 16px 30px}

<div class="wrap" id="app"></div>
<footer>פיתוח: רני בן זאב · v1.5.0</footer>
<div id="qrFull" class="qrfull"></div>

<script>
// ===== חיבור — אותו פרויקט ואותו קוד מקלטים כמו shelter-scan.html =====
const SB_URL = 'https://skfriefqnoxfzmamcokd.supabase.co';
const SB_KEY = 'sb_publishable_Qx7EDPbdyYE9iv7uMQBKhQ_Aeojd_Q0';
/* הצעות לשם הישוב (אפשר גם להקליד ישוב אחר) — לפי קווי ההסעות בנוהל הפינוי */
const TOWNS = ['נהריה','עכו','שלומי','בן עמי','שבי ציון','בוסתן הגליל','אחיהוד','נתיב השיירה','עמקא','אשרת','גורן','אבן מנחם',
  'נטועה','שתולה','יערה','גרנות הגליל','שומרה','זרעית','מנות','עבדון','צוריאל','אלקוש','פקיעין חדשה','חוסן','מעונה','עין יעקב',
  'לפידות','הילה','גיתה','נווה זיו','כפר ורדים','כברי','געתון','איילון','טל-אל','מעלות-תרשיחא'];
const KIND = {bus: {ic: '🚌', l: 'עלה לאוטובוס'}, self: {ic: '🚪', l: 'יצא מהשער'}, parent: {ic: '🚪', l: 'יצא מהשער'}, class: {ic: '📋', l: 'נמצא בכיתת האם'}};
const EVENT_TTL = 3 * 3600 * 1000;   // אירוע "פעיל" עד 3 שעות מהפעולה האחרונה
const CHUNK = 60;

function awayLabel(s){
  const st = String(s.st || '').toLowerCase();
  if(s.a || /absent|נעדר|חסר|לא הגיע/.test(st)) return 'לא הגיע הבוקר';
  if(/releas|left|exit|out|יצא|שוחרר|שחרור/.test(st)) return 'יצא מבית הספר';
  if(/excus|מוצדק|מאושר/.test(st)) return 'היעדרות מאושרת';
  return '';
}
const levelOf = c => { c = String(c || '').trim();
  return /^(יא|יב|י)(?![א-ת])/.test(c) ? 'upper' : /^(ז|ח|ט)(?![א-ת])/.test(c) ? 'middle' : 'other'; };
const LEVELS = {middle: 'חטיבת ביניים · ז–ט', upper: 'חטיבה עליונה · י–יב', other: 'כיתות אחרות'};

async function rpc(fn, body, ms = 8000){
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  try{
    const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {method:'POST', signal:ctl.signal,
      headers:{apikey:SB_KEY, Authorization:'Bearer '+SB_KEY, 'Content-Type':'application/json'}, body:JSON.stringify(body)});
    if(!r.ok) throw new Error(await r.text());
    const txt = await r.text(); return txt ? JSON.parse(txt) : null;
  } finally { clearTimeout(t); }
}

// ===== עזרים =====
const app = document.getElementById('app');
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hhmm = d => new Date(d).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Jerusalem'});
const dayTime = d => new Date(d).toLocaleString('he-IL',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Jerusalem'});
const byHe = (a, b) => String(a).localeCompare(String(b), 'he', {numeric:true});
const ls = {
  get(k, d = null){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
function deviceId(){ let d = ls.get('pz_device'); if(!d){ d = 'pizur-' + Math.random().toString(36).slice(2,8); ls.set('pz_device', d); } return d; }
function tokenFromText(text){
  text = String(text || '').trim();
  if(text.startsWith('GMCARD:')) return text.slice(7);
  try{ return new URL(text).searchParams.get('scan'); }catch(e){ return null; }
}
function toast(html, cls = 'ok', ms = 3500){
  const r = $('res'); if(!r) return;
  r.className = 'result ' + cls; r.innerHTML = html; r.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => r.style.display = 'none', ms);
}
function beep(ok){ try{ navigator.vibrate && navigator.vibrate(ok ? 80 : [60,60,60]); }catch(e){} }

if('serviceWorker' in navigator) navigator.serviceWorker.register('pizur-sw.js', {scope: './pizur-scan.html'}).catch(() => {});
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

// ===== רשימת תלמידים — משותפת עם סריקת המקלטים (אותו טלפון לא צריך הגדרה פעמיים) =====
let ROSTER = ls.get('sh_roster');
let byTok = {}, byTok8 = {}, byId = {};
function indexRoster(){
  byTok = {}; byTok8 = {}; byId = {};
  (ROSTER?.rows || []).forEach(s => { byId[s.id] = s; if(s.t){ byTok[s.t] = s; byTok8[s.t.slice(0,8)] = s; } });
}
indexRoster();
const codeOf = s => s.t ? s.t.slice(0,8) : '#' + s.id;
const fromCode = c => c.startsWith('#') ? byId[c.slice(1)] : byTok8[c];
async function refreshRoster(pin){
  const rows = await rpc('shelter_roster', {p_pin: pin}, 15000);
  if(!rows || !rows.length) throw new Error('empty');
  ROSTER = {at: new Date().toISOString(), rows: rows.map(r => ({id:r.student_id, t:r.token, n:r.name, c:r.class, a:!!r.absent, st:r.status || ''}))};
  ls.set('sh_roster', ROSTER); indexRoster();
  loadStaff(pin);
  return ROSTER.rows.length;
}
/* v1.5.0 — רשימת המורים (שם + יישוב מגורים, מהמידעון) לטופס האוטובוס. נשמרת בטלפון, עובדת גם בלי אינטרנט. */
const staff = () => ls.get('pz_staff', []);
async function loadStaff(pin){
  try{ const r = await rpc('pizur_staff_list', {p_pin: pin}, 10000); if(r && r.length) ls.set('pz_staff', r.map(x => ({n: x.name, t: x.town || ''}))); }catch(e){}
}
const realTown = t => t && !/^ד\.?נ[ .]/.test(t) && t !== '—' ? t : '';

let online = navigator.onLine !== false;
function setOnline(v){ online = v; renderSub(); }

// ===== מצלמה =====
let scanner = null, lastText = '', lastAt = 0;
async function startScanner(onText){
  if(typeof Html5Qrcode === 'undefined'){ alert('רכיב הסריקה לא נטען. פתחו את הדף פעם אחת עם אינטרנט.'); return; }
  if(scanner){ try{ await scanner.stop(); }catch(e){} }
  scanner = new Html5Qrcode('reader');
  try{
    await scanner.start({facingMode:'environment'}, {fps:10, qrbox:{width:240, height:240}}, text => {
      const now = Date.now();
      if(text === lastText && now - lastAt < 3000) return;
      lastText = text; lastAt = now; onText(text);
    });
    const b = $('camBtn'); if(b){ b.dataset.label = b.dataset.label || b.textContent; b.textContent = '⏹️ עצירת מצלמה'; b.onclick = stopScanner; }
  }catch(e){ alert('לא ניתן להפעיל מצלמה: ' + e); }
}
async function stopScanner(){
  if(scanner){ try{ await scanner.stop(); }catch(e){} scanner = null; }
  const b = $('camBtn'); if(b){ b.textContent = b.dataset.label || '📷 סריקה'; b.onclick = window._camStart; }
}

/* =====================================================================
   נתונים בטלפון
   ===================================================================== */
let SCANS = ls.get('pz_scans', []);     // [{id, sid, kind, bus, town, taker, at, session, src, synced}]
let BUSES = ls.get('pz_buses', []);     // [{id, no, town, escort, opened, departed, session, synced}]
const saveScans = () => ls.set('pz_scans', SCANS);
const saveBuses = () => ls.set('pz_buses', BUSES);
const session = () => ls.get('pz_session');
const role = () => ls.get('pz_role');           // 'bus' | 'guard' | 'class'
const isGate = k => k === 'self' || k === 'parent';
const curBus = () => BUSES.find(b => b.id === ls.get('pz_bus'));
const pending = () => SCANS.filter(s => !s.synced);
const pendingBuses = () => BUSES.filter(b => !b.synced);
const inSession = () => SCANS.filter(s => s.session === session());
function eventStale(){
  const t0 = Date.parse(session() || '') || 0;
  const last = inSession().reduce((m, x) => Math.max(m, Date.parse(x.at) || 0), t0);
  return !last || Date.now() - last > EVENT_TTL;
}
function ensureSession(){ if(!session() || eventStale()) ls.set('pz_session', new Date().toISOString()); }

function renderSub(){
  const el = $('sub'); if(!el) return;
  const net = online ? '<span class="pill on">מחובר</span>' : '<span class="pill off">📴 אין חיבור</span>';
  const p = pending().length + pendingBuses().length;
  el.innerHTML = `${net}${!MANAGE && p ? `<span class="pill off">${p} ממתינות לשליחה</span>` : ''}${MANAGE && ROSTER ? `<span>רשימה מ-${dayTime(ROSTER.at)}</span>` : ''}`;
  const b = $('netBanner'); if(!b) return;
  if(!online){
    b.className = 'net off';
    b.innerHTML = `<b>📴 אין אינטרנט</b><br>הסריקות נשמרות בטלפון ויישלחו לבד כשהרשת תחזור.
      כדי שההנהלה תראה אותן עכשיו — הציגו לה את ה-QR לסריקה.
      <button class="btn" id="netQr" style="background:#1c2230;margin-top:8px">🔳 QR להנהלה</button>`;
    $('netQr').onclick = showSummaryQR;
  } else if(p){ b.className = 'net wait'; b.innerHTML = `⏳ מחובר · שולח ${p} רשומות להנהלה…`; }
  else { b.className = 'net on'; b.innerHTML = '✓ מחובר — ההנהלה רואה בזמן אמת'; }
}

/* =====================================================================
   מסך ראשי · הגדרה
   ===================================================================== */
function renderSetup(next){
  app.innerHTML = `
    <div class="box">
      <h2>הגדרת הטלפון</h2>
      <p class="muted">פעם אחת, <b>כשיש אינטרנט</b>. מקלידים את <b>קוד המקלטים</b> (אותו קוד של סריקת המקלטים). הטלפון שומר את רשימת התלמידים, ומאז הסריקה עובדת גם בלי אינטרנט.</p>
      <input id="pin" type="password" placeholder="קוד מקלטים">
      <button class="btn" id="go">שמירה והורדת רשימת התלמידים</button>
      <div class="err" id="err"></div>
    </div>
    <button class="linkBtn" id="back">← חזרה</button>`;
  $('back').onclick = renderHome;
  $('go').onclick = async () => {
    const pin = $('pin').value.trim(); if(!pin) return;
    $('go').disabled = true; $('err').textContent = 'מוריד רשימה…';
    try{ const n = await refreshRoster(pin); ls.set('sh_pin', pin); setOnline(true); alert(`נשמרו ${n} תלמידים בטלפון.`); next ? next() : renderHome(); }
    catch(e){ $('go').disabled = false; $('err').textContent = String(e.message).includes('empty') ? 'קוד שגוי' : 'אין חיבור לשרת. נסו שוב כשיש אינטרנט.'; }
  };
}

function renderHome(){
  stopScanner(); closeQR();
  $('title').textContent = '🚌 פיזור בחירום';
  const b = curBus(), active = !eventStale();
  const busLive = active && role() === 'bus' && b ? `<span class="go">▶ ממשיכים: אוטובוס ${esc(b.no)} · ${esc(b.town)} · ${inSession().filter(s => s.kind === 'bus' && s.bus === b.id).length} עלו</span>` : '';
  const clsLive = active && role() === 'class' && ls.get('pz_class') ? `<span class="go">▶ ממשיכים: ${esc(ls.get('pz_class'))}</span>` : '';
  const grdLive = active && role() === 'guard' ? `<span class="go">▶ ממשיכים: ${inSession().filter(s => isGate(s.kind)).length} יצאו</span>` : '';
  app.innerHTML = `
    <div class="pickTitle">מה התפקיד שלך?</div>
    <div class="bigList">
      <button class="bus" data-r="bus">🚌 אחראי אוטובוס<small>סריקת העולים לאוטובוס</small>${busLive}</button>
      <button class="grd" data-r="guard">🚪 שומר — יציאה מהשער<small>עצמאית או עם הורים — אותה סריקה</small>${grdLive}</button>
      <button class="cls" data-r="class">📋 מחנך — קריאת שמות<small>בכיתת האם, עד הקריאה בכריזה</small>${clsLive}</button>
      <button class="mg" data-r="manage">📊 מסך מנהלת<small>אוטובוסים, יציאות, ומי עוד לא יצא</small></button>
    </div>
    <p class="muted" style="text-align:center;margin-top:14px"><a href="pizur-start.html">📖 הסברים וקישורים</a> · לפי <a href="pinui.html">נוהל פינוי בית הספר בחירום</a> · <a href="shelter-scan.html">סריקת מקלטים</a></p>
    ${session() || curBus() || ls.get('pz_escort') ? '<button class="linkBtn" id="reset">🔄 איפוס — התחלה מחדש בטלפון הזה</button>' : ''}`;
  if($('reset')) $('reset').onclick = resetPhone;
  app.querySelectorAll('[data-r]').forEach(x => x.onclick = () => {
    const r = x.dataset.r;
    if(r === 'manage') return location.href = location.pathname + '?mode=manage';
    if(!ls.get('sh_pin') || !ROSTER) return renderSetup(() => go(r));
    go(r);
  });
  renderSub();
}
/* v1.3.0 — איפוס: שוכחים את האוטובוס, שם המורה והאירוע הנוכחי. רשימת התלמידים והקוד נשארים,
   ורישומים שעוד לא נשלחו — יישלחו (לא נמחקים). */
function resetPhone(){
  const p = pending().length + pendingBuses().length;
  if(!confirm('לאפס את הטלפון?\nהאוטובוס, שם המורה והספירה במסך יתאפסו.' + (p ? `\n${p} רישומים שעוד לא נשלחו יישלחו כשיהיה חיבור.` : ''))) return;
  ['pz_bus', 'pz_session', 'pz_role', 'pz_escort', 'pz_class'].forEach(k => ls.del(k));
  renderHome();
}
function go(r){
  ensureSession(); ls.set('pz_role', r);
  if(r === 'bus') return curBus() && curBus().session === session() ? renderBus() : renderBusForm();
  if(r === 'class') return ls.get('pz_class') ? renderRoll() : renderClassPick();
  renderGuard();
}

/* =====================================================================
   🚌 אחראי אוטובוס
   ===================================================================== */
function renderBusForm(){
  stopScanner();
  $('title').textContent = '🚌 אחראי אוטובוס';
  const last = curBus();
  app.innerHTML = `
    <div class="box form">
      <h2>לפני הסריקה — פרטי האוטובוס</h2>
      <label>שם המורה<input id="bEsc" list="staffL" value="${esc(ls.get('pz_escort') || '')}" placeholder="התחילו להקליד את שמכם" autocomplete="off"></label>
      <datalist id="staffL">${staff().map(x => `<option value="${esc(x.n)}">${x.t ? esc(x.t) : ''}</option>`).join('')}</datalist>
      <label>מספר אוטובוס<input id="bNo" inputmode="numeric" placeholder="למשל 3" value=""></label>
      <label>לאיזה ישוב<input id="bTown" list="towns" placeholder="שם הישוב"></label>
      <div class="muted" id="townHint" style="font-size:13px;margin-top:4px"></div>
      <datalist id="towns">${[...new Set([...TOWNS, ...staff().map(x => realTown(x.t)).filter(Boolean)])].map(t => `<option value="${esc(t)}">`).join('')}</datalist>
      <button class="btn huge" id="open" style="background:var(--bus)">📷 פתיחת סריקה</button>
      <div class="err" id="err"></div>
    </div>
    ${last && last.session === session() ? `<button class="btn sec" id="backBus">← חזרה לאוטובוס ${esc(last.no)} · ${esc(last.town)}</button>` : ''}
    <button class="linkBtn" id="home">← החלפת תפקיד</button>`;
  $('home').onclick = renderHome;
  if($('backBus')) $('backBus').onclick = renderBus;
  /* בחירת שם מהרשימה ממלאת את יישוב המגורים של המורה — אפשר לשנות */
  let autoTown = '';
  const fillTown = () => {
    const m = staff().find(x => x.n === $('bEsc').value.trim()), t = m ? realTown(m.t) : '';
    const mine = !$('bTown').value.trim() || $('bTown').value.trim() === autoTown;
    if(t && mine){ $('bTown').value = t; autoTown = t; $('townHint').textContent = 'מולא לפי יישוב המגורים של ' + m.n + ' — אפשר לשנות'; }
    else if(!t && mine && autoTown){ $('bTown').value = ''; autoTown = ''; $('townHint').textContent = ''; }
  };
  $('bEsc').oninput = fillTown; $('bEsc').onchange = fillTown;
  if($('bEsc').value) fillTown();
  ($('bEsc').value ? $('bNo') : $('bEsc')).focus();
  if(!staff().length && ls.get('sh_pin')) loadStaff(ls.get('sh_pin')).then(() => { if($('staffL') && staff().length) renderBusForm(); });
  $('open').onclick = () => {
    const no = $('bNo').value.trim(), town = $('bTown').value.trim(), escort = $('bEsc').value.trim();
    if(!no){ $('err').textContent = 'חסר מספר אוטובוס'; return; }
    if(!town){ $('err').textContent = 'חסר ישוב'; return; }
    if(!escort){ $('err').textContent = 'חסר שם המורה'; return; }
    ls.set('pz_escort', escort);
    const b = {id: uid(), no, town, escort, opened: new Date().toISOString(), departed: null, session: session(), synced: false};
    BUSES.push(b); saveBuses(); ls.set('pz_bus', b.id);
    renderBus(); sync();
    setTimeout(() => window._camStart && window._camStart(), 50);
  };
}
const onBus = b => inSession().filter(s => s.kind === 'bus' && s.bus === b.id);
function renderBus(){
  stopScanner();
  const b = curBus(); if(!b) return renderBusForm();
  $('title').textContent = `🚌 אוטובוס ${b.no} · ${b.town}`;
  app.innerHTML = `
    <div id="netBanner"></div>
    <button class="busHead${b.departed ? ' gone' : ''}" id="chgBus" style="width:100%;border:0;font-family:inherit;text-align:right;cursor:pointer">
      <span><span class="nm">🚌 ${esc(b.no)} · ${esc(b.town)}</span><br><span class="ch">${b.departed ? 'יצא ב-' + hhmm(b.departed) : 'פתוח מ-' + hhmm(b.opened)}${b.escort ? ' · ' + esc(b.escort) : ''} · <u>לחצו להחלפת אוטובוס</u></span></span>
      <span class="num"><span id="cnt">0</span><small>עלו</small></span>
    </button>
    <button class="btn huge" id="camBtn" style="background:var(--bus)">📷 סריקה</button>
    <div id="reader"></div>
    <div class="result" id="res"></div>
    <button class="btn" id="depart" style="background:${b.departed ? '#6b7385' : '#1e8e3e'};font-size:19px;padding:16px">${b.departed ? '↩️ ביטול "האוטובוס יצא"' : '🚍 האוטובוס יצא — דיווח להנהלה'}</button>
    <button class="btn qrbig" id="qrSum">🔳 QR נתוני האוטובוס</button>
    <details class="more"><summary>עוד…</summary>
      <div class="box"><h2>תלמיד בלי טלפון</h2><input id="q" placeholder="חיפוש לפי שם…"><div id="hits"></div></div>
      <div class="box"><h2>עלו לאוטובוס</h2><div class="list" id="list"></div></div>
      <button class="btn sec" id="newBus">🚌 אוטובוס אחר</button>
      <button class="btn sec small" id="upd">עדכון רשימת תלמידים</button>
      <p class="muted" style="margin-top:10px">רשימת התלמידים מ-${dayTime(ROSTER.at)} · ${ROSTER.rows.length} תלמידים</p>
    </details>
    <button class="linkBtn" id="home">← החלפת תפקיד</button>`;
  window._camStart = () => startScanner(t => onCard(t, 'bus'));
  $('camBtn').onclick = window._camStart;
  $('depart').onclick = () => {
    if(!b.departed && !confirm(`לדווח שאוטובוס ${b.no} (${b.town}) יצא עם ${onBus(b).length} תלמידים?`)) return;
    b.departed = b.departed ? null : new Date().toISOString(); b.synced = false; saveBuses(); renderBus(); sync();
  };

function onCard(text, kind){
  const tok = tokenFromText(text), st = tok && byTok[tok];
  if(!st){ beep(false); toast('<div class="big">לא מזוהה</div><div>כרטיס לא ברשימה. חפשו את התלמיד לפי שם (תחת "עוד…").</div>', 'bad'); return; }
  pick(st, kind, 'scan');
}
function pick(st, kind, src){
  const prev = inSession().filter(s => s.sid === st.id && s.kind !== 'class').sort((a, b) => b.at.localeCompare(a.at))[0];
  const b = kind === 'bus' ? curBus() : null;
  const same = (x, y) => x === y || (x !== 'bus' && y !== 'bus');
  if(prev && same(prev.kind, kind) && (kind !== 'bus' || prev.bus === b.id)){
    beep(false); toast(`<div class="big">${esc(st.n)}</div><div>${esc(st.c)} · כבר נרשם ב-${hhmm(prev.at)}</div>`, 'dup'); return;
  }
  if(prev && !confirm(`${st.n} כבר נרשם/ה בטלפון הזה: ${KIND[prev.kind].l}${prev.kind === 'bus' ? ' ' + busName(prev.bus) : ''} (${hhmm(prev.at)}).\nלרשום מחדש?`)) return;
  if(kind === 'parent') return parentForm(st);
  addScan(st, kind, {}, src);
}
const busName = id => { const b = BUSES.find(x => x.id === id); return b ? `${b.no} · ${b.town}` : ''; };
function addScan(st, kind, extra = {}, src = 'scan'){
  const b = kind === 'bus' ? curBus() : null;
  SCANS.push({id: uid(), sid: st.id, kind, bus: b ? b.id : null, town: b ? b.town : (extra.town || ''), taker: extra.taker || '',
    at: new Date().toISOString(), session: session(), src, synced: false});
  saveScans(); beep(true);
  const away = awayLabel(st);
  const cls = kind === 'bus' ? 'ok' : kind === 'self' ? 'self' : 'par';
  toast(`<div style="font-size:26px">${KIND[kind].ic} ✅</div><div class="big">${esc(st.n)}</div><div>${esc(st.c)}${b ? ' · אוטובוס ' + esc(b.no) : extra.taker ? ' · ' + esc(extra.taker) : ''}</div>
    ${away ? `<div style="margin-top:6px;font-weight:700">⚠️ בבוקר סומן/ה: ${esc(away)}</div>` : ''}`, cls);
  renderList(); renderSub(); sync();
}
function renderList(){

async function undo(id){
  const s = SCANS.find(x => x.id === id); if(!s) return;
  const st = byId[s.sid] || {n: ''};
  if(!confirm(`לבטל את הרישום של ${st.n}?`)) return;

}

// --- סנכרון לשרת ---
let syncing = false;
async function sync(){
  if(syncing || MANAGE) return;
  const pin = ls.get('sh_pin'); if(!pin) return;
  syncing = true;
  try{
    const p = pending().slice(0, 300), pb = pendingBuses();
    if(p.length || pb.length){
      const rows = p.map(s => {
        const b = s.bus ? BUSES.find(x => x.id === s.bus) : null;
        return {id: s.id, student_id: s.sid, kind: s.kind, bus_id: s.bus, bus_no: b ? b.no : null, settlement: s.town || null,
          taker: s.taker || null, scanned_at: s.at, session_started: s.session, device: deviceId(), source: s.src};
      });
      const buses = pb.map(b => ({id: b.id, bus_no: b.no, settlement: b.town, escort: b.escort || null, opened_at: b.opened,
        departed_at: b.departed, session_started: b.session, device: deviceId()}));
      const res = await rpc('pizur_sync', {p_pin: pin, p_rows: rows, p_buses: buses});
      if(res === -1) throw new Error('pin');
      const done = new Set(rows.map(r => r.id)), bdone = new Set(buses.map(b => b.id + '|' + b.departed_at));
      SCANS.forEach(s => { if(done.has(s.id)) s.synced = true; });
      BUSES.forEach(b => { if(bdone.has(b.id + '|' + b.departed)) b.synced = true; });
      const old = Date.now() - 3*864e5;
      SCANS = SCANS.filter(s => !s.synced || Date.parse(s.at) > old);
      BUSES = BUSES.filter(b => !b.synced || Date.parse(b.opened) > old || b.id === ls.get('pz_bus'));
      saveScans(); saveBuses();
    } else await rpc('check_shelter_pin', {p_pin: pin}, 5000);
    setOnline(true);
    if($('list')) renderList();
  }catch(e){ setOnline(false); }
  finally{ syncing = false; }
}

// --- QR סיכום (בלי אינטרנט) — GMPZ1|kind|bus_no|town|stamp|k/n|codes ---
function summaryLines(){
  const groups = {};
  if(role() === 'bus'){ const b = curBus(); if(b) groups['bus|' + b.no + '|' + b.town] = onBus(b); }
  else if(role() === 'class'){ const c = ls.get('pz_class'); groups['class||' + c] = inSession().filter(s => s.kind === 'class' && s.town === c); }
  else inSession().filter(s => isGate(s.kind)).forEach(s => (groups[s.kind + '||' + (s.town || '')] ||= []).push(s));
  const stamp = Math.floor(Date.now() / 60000), lines = [];
  Object.entries(groups).forEach(([k, list]) => {
    const [kind, no, town] = k.split('|');
    const codes = list.map(s => byId[s.sid]).filter(Boolean).map(codeOf);
    const n = Math.max(1, Math.ceil(codes.length / CHUNK));
    for(let i = 0; i < n; i++) lines.push(`GMPZ1|${kind}|${encodeURIComponent(no)}|${encodeURIComponent(town)}|${stamp}|${i+1}/${n}|${codes.slice(i*CHUNK, (i+1)*CHUNK).join(',')}`);
  });
  return lines;
}
function closeQR(){ const f = $('qrFull'); if(f){ f.classList.remove('on'); f.innerHTML = ''; } }
function showSummaryQR(){
  if(typeof QRCode === 'undefined'){ alert('רכיב ה-QR לא נטען. פתחו את הדף פעם אחת עם אינטרנט.'); return; }
  const lines = summaryLines(); if(!lines.length){ alert('עדיין אין רישומים'); return; }
  stopScanner();
  let i = 0; const f = $('qrFull'), size = Math.min(window.innerWidth - 48, 380);
  const b = curBus();
  const head = role() === 'bus' && b ? `🚌 אוטובוס ${esc(b.no)} · ${esc(b.town)} · ${onBus(b).length} עלו` : role() === 'class' ? `📋 ${esc(ls.get('pz_class'))} · ${inSession().filter(s => s.kind === 'class' && s.town === ls.get('pz_class')).length} נמצאו בכיתה` : `🚪 יציאה מהשער · ${inSession().filter(s => isGate(s.kind)).length} יצאו`;
  const draw = () => {
    f.innerHTML = `<h2>${head}</h2>
      <p class="muted" style="margin:6px 0 0">המנהלת סורקת ב"מסך מנהלת" ← "📷 סריקת QR מהשטח" · ${hhmm(new Date())}</p>
      ${lines.length > 1 ? `<p style="font-size:18px;font-weight:800;margin:8px 0 0">חלק ${i+1} מתוך ${lines.length} — סרקו את כל החלקים</p>` : ''}
      <div class="qrwrap"><div id="sumQr"></div></div>
      ${lines.length > 1 ? `<button class="btn" id="nextQr">${i < lines.length-1 ? 'החלק הבא ←' : 'חזרה לחלק 1'}</button>` : ''}
      <button class="btn sec" id="closeQr">סגירה</button>`;
    new QRCode($('sumQr'), {text: lines[i], width: size, height: size, correctLevel: QRCode.CorrectLevel.L});
    if($('nextQr')) $('nextQr').onclick = () => { i = (i + 1) % lines.length; draw(); };

/* המצב האחרון של כל תלמיד — מהשרת ומ-QR שנסרקו */
function model(){
  const t0 = since(), last = {}, buses = {};
  const iso = x => x ? new Date(x).toISOString() : '';   // השרת מחזיר זמן עם +00:00 — מיישרים להשוואה
  const bkey = (no, town) => `${no}|${town}`;
  const bus = (no, town) => buses[bkey(no, town)] ||= {no, town, ids: new Set(), opened: '', departed: '', escorts: new Set(), last: '', vias: new Set()};
  const roll = {};
  const put = (sid, rec) => { if(rec.kind === 'class'){ if(!roll[sid] || roll[sid] < rec.at) roll[sid] = rec.at; return; }
    if(!last[sid] || last[sid].at < rec.at) last[sid] = rec; };
  SERVER.buses.forEach(b0 => { const b = {...b0, opened_at: iso(b0.opened_at), departed_at: iso(b0.departed_at)};
    if(b.opened_at >= t0){ const x = bus(b.bus_no, b.settlement);
    if(!x.opened || b.opened_at < x.opened) x.opened = b.opened_at;
    if(b.departed_at && b.departed_at > x.departed) x.departed = b.departed_at;
    if(b.escort) x.escorts.add(b.escort); } });
  SERVER.scans.forEach(s => { const at = iso(s.scanned_at); if(at < t0) return;
    put(s.student_id, {kind: s.kind, no: s.bus_no, town: s.settlement || '', taker: s.taker || '', at, via: 'אינטרנט'}); });
  Object.values(MERGED).forEach(m => { if(m.at < t0) return;
    m.codes.forEach(c => { const st = fromCode(c); if(st) put(st.id, {kind: m.kind, no: m.no, town: m.town, taker: '', at: m.at, via: 'QR'}); }); });
  Object.entries(last).forEach(([sid, r]) => { if(r.kind === 'bus'){ const x = bus(r.no, r.town); x.ids.add(sid); x.vias.add(r.via); if(r.at > x.last) x.last = r.at; } });
  return {last, roll, buses: Object.values(buses).sort((a, b) => byHe(a.no, b.no) || byHe(a.town, b.town))};
}
function renderManage(){
  stopScanner();
  const {last, roll, buses} = model();
  const rows = ROSTER.rows;
  const present = rows.filter(s => !awayLabel(s) || last[s.id]);
  const busL = rows.filter(s => last[s.id] && last[s.id].kind === 'bus');
  const gateL = rows.filter(s => last[s.id] && isGate(last[s.id].kind));
  const waiting = rows.filter(s => !last[s.id] && !awayLabel(s));

  const names = list => `<div class="names">${list.sort((a, b) => byHe(a.c, b.c) || byHe(a.n, b.n)).map(s => `<span>${esc(s.n)} <small>${esc(s.c)}</small></span>`).join('')}</div>`;
  const busRows = buses.length ? buses.map(x => { const k = 'bus:' + x.no + '|' + x.town, open = OPENK === k;
    return `<button class="brow${x.departed ? ' gone' : ''}${open ? ' sel' : ''}" data-k="${esc(k)}"${x.ids.size ? '' : ' disabled'}>
      <span class="bn">🚌 ${esc(x.no)} · ${esc(x.town)}${x.escorts.size ? `<small> · ${esc([...x.escorts].join(', '))}</small>` : ''}</span>
      <span class="bs">${x.departed ? '🚍 יצא ' + hhmm(x.departed) : '⏳ בטעינה'}</span>
      <b class="bc">${x.ids.size}</b></button>${open ? names([...x.ids].map(id => byId[id]).filter(Boolean)) : ''}`; }).join('')
    : '<p class="muted" style="margin:0">עדיין אין אוטובוסים</p>';

  const lvl = Object.keys(LEVELS).map(L => {
    const all = rows.filter(s => levelOf(s.c) === L); if(!all.length) return '';
    const w = waiting.filter(s => levelOf(s.c) === L);
    const classes = [...new Set(all.map(s => s.c))].sort(byHe);
    return `<div class="lvl"><h3><span>${esc(LEVELS[L])}</span><b class="${w.length ? 'miss' : 'okc'}">${w.length}</b></h3>
      <div class="cgrid">${classes.map(c => { const cw = w.filter(s => s.c === c), k = cw.length, rc = cw.filter(s => roll[s.id]).length;
        return `<button class="cbox${k ? '' : ' done'}${SEL === c ? ' sel' : ''}" data-c="${esc(c)}"${k ? '' : ' disabled'}><span>${esc(c)}</span><b>${k || '✓'}</b>${k && rc ? `<i>📋 ${rc} בכיתה</i>` : ''}</button>`; }).join('')}</div>
      ${SEL && levelOf(SEL) === L ? `<div class="names">${w.filter(s => s.c === SEL).sort((a, b) => (roll[a.id] ? 1 : 0) - (roll[b.id] ? 1 : 0) || byHe(a.n, b.n)).map(s => `<span class="${roll[s.id] ? 'inc' : ''}">${roll[s.id] ? '✅ ' : '❓ '}${esc(s.n)}</span>`).join('')}</div>` : ''}</div>`;
  }).join('');

  app.innerHTML = `
    <div class="stat5" id="stat" style="grid-template-columns:repeat(4,1fr)">
      <div><b>${present.length}</b>🏫 בבית הספר</div>
      <div><b style="color:var(--bus)">${busL.length}</b>🚌 באוטובוסים</div>
      <div><b style="color:var(--self)">${gateL.length}</b>🚪 יצאו מהשער</div>
      <div><b style="color:var(--bad)">${waiting.length}</b>⏳ עוד לא יצאו</div>
    </div>
    <div class="box"><h2><span class="live"></span>🚌 אוטובוסים</h2>${busRows}
      <button class="brow gate${OPENK === 'gate' ? ' sel' : ''}" data-k="gate"${gateL.length ? '' : ' disabled'} style="margin-top:12px">
        <span class="bn">🚪 יצאו מהשער</span><span class="bs">עצמאית / עם הורים</span><b class="bc">${gateL.length}</b></button>
      ${OPENK === 'gate' ? names(gateL) : ''}</div>
    <div class="box"><h2>⏳ עוד לא יצאו — לפי כיתות</h2><p class="muted" style="margin:-4px 0 6px">✅ = נמצא בקריאת השמות בכיתה · ❓ = לא נמצא</p>${lvl}</div>
    <button class="btn sec" id="resetMg" style="margin-top:6px">🔄 איפוס — ספירה חדשה מעכשיו</button>
    <details class="more"><summary>עוד…</summary>
      <div class="box"><p class="muted" style="margin-top:0">בלי אינטרנט בשטח: סורקים את ה-QR שאחראי האוטובוס / השומר מציג.</p>
        <button class="btn" id="camBtn" style="background:#2f4f8f">📷 סריקת QR מהשטח</button>
        <div id="reader"></div><div class="result" id="res"></div></div>
      <div class="row2">
        <button class="btn sec small" id="newEv">אירוע חדש</button>
        <button class="btn sec small" id="upd">עדכון רשימת תלמידים</button>
        <button class="btn sec small" id="ref">🔄 רענון</button>
        <button class="btn sec small" id="home">← דף ראשי</button>
      </div>
    </details>`;
  app.querySelectorAll('.brow[data-k]').forEach(b => b.onclick = () => { OPENK = OPENK === b.dataset.k ? '' : b.dataset.k; renderManage(); });
  app.querySelectorAll('.cbox[data-c]').forEach(b => b.onclick = () => { SEL = SEL === b.dataset.c ? '' : b.dataset.c; renderManage(); });
  const more = app.querySelector('details.more'); more.open = MORE; more.ontoggle = () => { MORE = more.open; };
  window._camStart = () => startScanner(onSummaryScan);
  $('camBtn').onclick = window._camStart;
  $('ref').onclick = () => loadServer(true);
  $('home').onclick = () => location.href = location.pathname;
  $('resetMg').onclick = () => $('newEv').onclick();
  $('newEv').onclick = () => {
    if(!confirm('לאפס את מסך המנהלת?\nהספירה תתחיל מעכשיו. רישומים קודמים לא יוצגו (הם לא נמחקים מהשרת).')) return;
    ls.set('pzm_since', new Date(Date.now() - 5*60000).toISOString()); MERGED = {}; ls.set('pzm_merged', MERGED); loadServer(true);
  };
  $('upd').onclick = async () => {
    try{ await refreshRoster(mgPass()); setOnline(true); loadServer(true); }
    catch(e){ setOnline(false); alert('אין חיבור. הרשימה הקודמת נשארת.'); }
  };
  renderSub();
}
let SEL = '', MORE = false, OPENK = '';
function onSummaryScan(text){
  const m = /^GMPZ1\|(bus|self|parent|class)\|([^|]*)\|([^|]*)\|(\d+)\|(\d+\/\d+)\|(.*)$/.exec(String(text).trim());
  if(!m){ beep(false); toast('<div class="big">זה לא QR של הפיזור</div><div>בטלפון בשטח: "🔳 QR נתוני…"</div>', 'bad'); return; }
  const [, kind, noE, townE, stamp, part, codes] = m;
  const dec = x => { try{ return decodeURIComponent(x); }catch(e){ return x; } };
  const no = dec(noE), town = dec(townE), list = codes ? codes.split(',').filter(Boolean) : [];
  MERGED[`${kind}|${no}|${town}|${stamp}|${part}`] = {kind, no, town, at: new Date(Number(stamp) * 60000).toISOString(), codes: list};
  ls.set('pzm_merged', MERGED); beep(true);
  stopScanner().then(() => { renderManage();
    toast(`<div class="big">${KIND[kind].ic} ${kind === 'bus' ? 'אוטובוס ' + esc(no) + ' · ' + esc(town) : KIND[kind].l}</div><div>חלק ${esc(part)} · ${list.length} תלמידים אוחדו</div>`); });
}

// ===== הפעלה =====
if(MANAGE) manageRoute();
else{
  if(params.has('v')){ history.replaceState(null, '', location.pathname); }
  const r = params.get('role');
  if((r === 'bus' || r === 'guard' || r === 'class') && ls.get('sh_pin') && ROSTER) go(r); else renderHome();
}
window.addEventListener('online', () => MANAGE ? (mgPass() && loadServer()) : sync());
window.addEventListener('offline', () => setOnline(false));
setInterval(() => { if(MANAGE){ if(mgPass() && ROSTER && !scanner) loadServer(); } else sync(); }, MANAGE ? 10000 : 15000);
setInterval(() => {
  const k = MANAGE ? mgPass() : ls.get('sh_pin');
  if(k && ROSTER && Date.now() - new Date(ROSTER.at).getTime() > 10*60000) refreshRoster(k).then(() => setOnline(true)).catch(() => {});
}, 60000);
if(!MANAGE) sync();
</script>
<script>
/* ⌂ חזרה לאפליקציית הסורק (scan-app.html) — רק כשהדף נפתח ממנה (?app=1). באייפון אין כפתור "חזור". */
(function(){
  try{ if(new URLSearchParams(location.search).get('app') === '1') sessionStorage.setItem('gm_from_app', '1'); }catch(e){}
  var on = false; try{ on = sessionStorage.getItem('gm_from_app') === '1'; }catch(e){}
  if(!on) return;
  var a = document.createElement('a');
  a.href = 'scan-app.html'; a.textContent = '⌂ סורק'; a.setAttribute('aria-label', 'חזרה לאפליקציית הסורק');
  a.style.cssText = 'position:fixed;z-index:2147483000;left:calc(10px + env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));' +
    'background:#10213f;color:#fff;font:700 14px system-ui,Arial,sans-serif;padding:9px 14px;border-radius:99px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.3);opacity:.92';
  document.body.appendChild(a);
})();
</script>
