const SURL = 'https://skfriefqnoxfzmamcokd.supabase.co';
const SKEY = 'sb_publishable_Qx7EDPbdyYE9iv7uMQBKhQ_Aeojd_Q0';
async function api(path, opts={}){
  const r = await fetch(SURL+'/rest/v1/'+path, {...opts,
    headers:{apikey:SKEY, Authorization:'Bearer '+SKEY,
             'Content-Type':'application/json', Prefer: opts.prefer||''}});
  if(!r.ok) throw new Error((await r.text()).slice(0,200));

/* צבע הטקסט נגזר מבהירות הרקע ולא נקבע מראש: הפלטה ניתנת לעריכה,
   וטקסט כהה על רקע כהה הוא הדרך הקצרה לפס בלתי קריא. */
function lum(hex){
  const h=String(hex||'').replace('#','');
  if(h.length!==6) return 1;
  const v=[0,2,4].map(i=>{
    let c=parseInt(h.substr(i,2),16)/255;
    return c<=.03928 ? c/12.92 : Math.pow((c+.055)/1.055,2.4);
  });
  return .2126*v[0] + .7152*v[1] + .0722*v[2];
}
const inkOn = bg => lum(bg) > .45 ? '#243447' : '#fff';

const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================= תאריכים =================
   כל החישובים על שעה 12:00 UTC. חצות מקומי עלול ליפול ליום הקודם
   באזור זמן שלילי, ואז התאריך העברי יזוז ביום שלם. */
const MONTHS = ['ספטמבר','אוקטובר','נובמבר','דצמבר','ינואר','פברואר',
                'מרץ','אפריל','מאי','יוני','יולי','אוגוסט'];
const DOW = ['א','ב','ג','ד','ה','ו','ש'];
function mk(y,m,d){ return new Date(Date.UTC(y,m,d,12,0,0)); }
function iso(dt){ return dt.toISOString().split('T')[0]; }
function fromIso(s){ const p=String(s).split('-'); return mk(+p[0],+p[1]-1,+p[2]); }
function daysIn(y,m){ return new Date(Date.UTC(y,m+1,0)).getUTCDate(); }

/* התאריך העברי — מספרי לחישוב, ובגימטריה לתצוגה */
/* השמות כאן חייבים להתאים בדיוק למה ש-Intl פולט, ולא לתעתיק המקובל:
   הוא כותב Tamuz בם' אחת ו-Heshvan בלי Mar. מפתח שאינו תואם נופל
   לברירת המחדל ומציג את השם באנגלית באמצע לוח עברי. */
const HEB_MONTHS = {Tishri:'תשרי', Heshvan:'חשוון', Kislev:'כסלו',
  Tevet:'טבת', Shevat:'שבט', Adar:'אדר', 'Adar I':"אדר א'", 'Adar II':"אדר ב'",
  Nisan:'ניסן', Iyar:'אייר', Sivan:'סיוון', Tamuz:'תמוז', Av:'אב', Elul:'אלול'};
const HFMT = new Intl.DateTimeFormat('en-u-ca-hebrew',{day:'numeric',month:'long',year:'numeric'});
function hebOf(dt){
  const o={}; HFMT.formatToParts(dt).forEach(p=>o[p.type]=p.value);
  return {d:parseInt(o.day,10), m:o.month, mHe:HEB_MONTHS[o.month]||o.month, y:parseInt(o.year,10)};
}
/* גימטריה — כ"ג ולא 23 */
const ONES=['','א','ב','ג','ד','ה','ו','ז','ח','ט'], TENS=['','י','כ','ל'];
function gim(n){
  if(n===15) return 'ט"ו';
  if(n===16) return 'ט"ז';
  const t=Math.floor(n/10), o=n%10;
  const s=TENS[t]+ONES[o];
  return s.length>1 ? s.slice(0,-1)+'"'+s.slice(-1) : s+"'";
}

/* ================= חגים =================
   מזוהים מן התאריך העברי. שכבת הצעה בלבד — ראו האזהרה בראש הקובץ. */
/* חנוכה נמשכת שמונה ימים מכ"ה בכסלו, אך כסלו הוא חודש שאורכו משתנה:
   בשנה שבה יש בו כ"ט ימים החג נגמר בג' בטבת, ובשנה שבה יש בו שלושים
   הוא נגמר בב'. תנאי קבוע על טבת נותן תשעה ימים באחת מן השנתיים,
   ולכן נספרים כאן הימים אחורה עד כ"ה בכסלו במקום לנחש את אורך החודש. */
function isHanukkah(dt){
  const h=hebOf(dt);
  if(h.m==='Kislev' && h.d>=25) return true;
  if(h.m!=='Tevet' || h.d>3) return false;
  for(let k=1;k<8;k++){
    const p=hebOf(new Date(dt.getTime()-k*86400000));
    if(p.m==='Kislev' && p.d===25) return true;
  }
  return false;
}

function autoHolidays(dt){
  const h=hebOf(dt), out=[];
  const adar = (h.m==='Adar'||h.m==='Adar II');
  const add = t=>out.push(t);
  if(h.m==='Elul' && h.d===29) add('ערב ראש השנה');
  if(h.m==='Tishri'){
    if(h.d===1||h.d===2) add('ראש השנה');
    if(h.d===3) add('צום גדליה');
    if(h.d===9) add('ערב יום כיפור');
    if(h.d===10) add('יום כיפור');
    if(h.d===14) add('ערב סוכות');
    if(h.d===15) add('סוכות');
    if(h.d>=16 && h.d<=20) add('חול המועד סוכות');
    if(h.d===21) add('הושענא רבה');
    if(h.d===22) add('שמחת תורה');
    if(h.d===23) add('איסרו חג');
  }
  if(h.m==='Kislev' && h.d===24) add('ערב חנוכה');
  if(isHanukkah(dt)) add('חנוכה');
  if(h.m==='Tevet' && h.d===10) add('צום עשרה בטבת');
  if(h.m==='Shevat' && h.d===15) add('ט״ו בשבט');
  if(adar && h.d===13) add('תענית אסתר');
  if(adar && h.d===14) add('פורים');
  if(adar && h.d===15) add('שושן פורים');
  if(h.m==='Nisan'){
    if(h.d===14) add('ערב פסח');
    if(h.d===15) add('פסח');
    if(h.d>=16 && h.d<=20) add('חול המועד פסח');
    if(h.d===21) add('שביעי של פסח');
    if(h.d===22) add('איסרו חג');
    if(h.d===27) add('יום הזיכרון לשואה ולגבורה');
  }
  if(h.m==='Iyar'){
    if(h.d===4) add('יום הזיכרון');
    if(h.d===5) add('יום העצמאות');
    if(h.d===28) add('יום ירושלים');
  }
  if(h.m==='Sivan'){
    if(h.d===5) add('ערב שבועות');
    if(h.d===6) add('שבועות');
  }
  if(h.m==='Tamuz' && h.d===17) add('צום י״ז בתמוז');
  if(h.m==='Av' && h.d===9) add('תשעה באב');
  return out;
}

/* ================= מצב ================= */
/* ⚠ החופשות במסלול נפרד ולא בתוך "חגים ומועדים". זו ההבחנה שקובעת
   אם אפשר לתכנן משהו ביום מסוים — בית הספר סגור, או שזה יום לימודים
   שמצוין בטקס — והיא נבלעה כשהיא סומנה בצבע בלבד. מסלול החופשות
   ראשון מלמעלה מפני שהוא הדבר שמסתכלים עליו קודם. */
/* ⚠ החופשות והחגים חייבים להיבדל בבהירות ולא בגוון בלבד. פס צר
   במסך טלפון נקרא לפי כמה הוא כהה, לא לפי אם הוא אדמדם או צהבהב,
   ושני הגוונים הקודמים היו כמעט זהים בבהירותם והתמזגו. החופשות הן
   עתה הכהות ביותר בלוח, והחגים הבהירים ביותר. */
const TRACKS = [
  {k:'vacation', t:'🏖️ חופשות',    c:'#a33a3a'},
  {k:'holidays', t:'חגים ומועדים', c:'#ffe08a'},
  {k:'junior',   t:'חט״ן',         c:'#8fd3a8'},
  {k:'senior',   t:'חט״ע',         c:'#9dbdf0'},
  /* ⚠ שני האחרונים אינם מסלולי גאנט אלא השתקפות exam_board.
     ro:true מסמן לקריאה בלבד — אין יצירה ואין עריכה. */
  {k:'ex_senior', t:'📝 מבחנים · חט״ע', c:'#4c1d95', ro:true},
  {k:'ex_junior', t:'📝 מבחנים · חט״ן', c:'#0f766e', ro:true}
];
const JUNIOR_G=['ז','ח','ט'], SENIOR_G=['י','יא','יב'];
const COLORS = ['#a33a3a','#ffe08a','#8fd3a8','#9dbdf0','#c9b3e8','#ffd0a1'];
let YEAR = null, EVENTS = [], EDIT = null, PICKCOL = COLORS[0];
let EXAMS = {};   /* תאריך → רשימת מבחנים מפורסמים */

/* ============================================================
   מצב צפייה — ?view=1
   ------------------------------------------------------------
   מורה שרוצה לדעת מתי חופשת פסח אינו צריך הרשאת עריכה, ובלוח
   משותף הסיכון האמיתי אינו זדון אלא לחיצה לא מכוונת שגוררת פס
   או פותחת חלון מחיקה.

   ⚠ זו אינה אבטחה. מי שיסיר את הפרמטר מן הכתובת יוכל לערוך,
   ובדיוק כך מקבלת ההנהלה את הגישה המלאה. ההגנה כאן היא מפני
   טעות, לא מפני כוונה.
   ============================================================ */
let VIEW = false;

/* רמות רוחב. הצעד גדול בכוונה — הפרש קטן אינו הופך פס בלתי קריא
   לקריא, ורק מוסיף לחיצות. */
const WIDTHS = [1080, 1500, 2000, 2700, 3600];
const WKEY = 'gm_gantt_width';
let ZI = 0;
function applyZoom(){
  document.getElementById('sheet').style.setProperty('--sheetw', WIDTHS[ZI]+'px');
  const l=document.getElementById('zLab');
  if(l) l.textContent = ZI===0 ? 'רוחב רגיל' : '×'+(WIDTHS[ZI]/WIDTHS[0]).toFixed(1);
  try{ localStorage.setItem(WKEY, String(ZI)); }catch(e){}
}
function zoom(d){
  ZI = Math.min(WIDTHS.length-1, Math.max(0, ZI+d));
  applyZoom();
}
function loadZoom(){
  try{ const v=parseInt(localStorage.getItem(WKEY),10);
       if(!isNaN(v)) ZI=Math.min(WIDTHS.length-1,Math.max(0,v)); }catch(e){}
  applyZoom();
}

function yearLabel(y){
  /* שנת הלימודים נפתחת בספטמבר; שם השנה העברית נלקח מן ה-1 בינואר שאחריו */
  const h = hebOf(mk(y+1,0,1));
  return 'תשפ' + gim(h.y-5780).replace(/['"]/g,'') + ' · ' + y + '/' + (y+1);
}
/* שנת הלימודים שמתכננים אותה כעת. המעבר בחודש 7 (אוגוסט) ולא ב-8
   (ספטמבר): את הגאנט בונים לפני שהשנה נפתחת, ולכן מי שנכנס באוגוסט
   מתכוון כמעט תמיד לשנה הבאה. */
function planYear(){
  const n=new Date();
  return n.getUTCMonth()>=7 ? n.getUTCFullYear() : n.getUTCFullYear()-1;
}
function buildYearSel(){
  const base=planYear();
  const sel=document.getElementById('yearSel');
  sel.innerHTML='';
  for(let y=base-1; y<=base+2; y++){
    const o=document.createElement('option');
    o.value=y; o.textContent=yearLabel(y);
    sel.appendChild(o);
  }
  sel.value = YEAR;
}

async function load(){
  const from = iso(mk(YEAR,8,1)), to = iso(mk(YEAR+1,7,31));
  EVENTS = await api('gantt_events?year_start=eq.'+YEAR+
    '&order=start_date.asc') || [];
  EVENTS.forEach(e=>{ e._a=fromIso(e.start_date); e._b=fromIso(e.end_date); });
  await loadExams();
}

/* מבחנים מפורסמים בלבד. נכשל? הגאנט ממשיך בלעדיהם — הוא
   לא אמור להישבר בגלל תוספת. */
async function loadExams(){
  EXAMS={};
  try{
    const pub=await api('exam_publish?select=grade,published&year_start=eq.'+YEAR)||[];
    const open=pub.filter(p=>p.published).map(p=>p.grade);
    if(!open.length) return;
    const rows=await api('exam_board?select=grade,scope,class_name,subject_base,level,'+
      'exam_date,hour,hour_end,title&year_start=eq.'+YEAR+
      '&status=eq.approved&exam_date=not.is.null&order=exam_date,hour')||[];
    rows.filter(r=>open.indexOf(r.grade)>-1).forEach(r=>{
      (EXAMS[r.exam_date]=EXAMS[r.exam_date]||[]).push(r);
    });
  }catch(e){ EXAMS={}; }
}
function examsOn(dateIso, kind){
  const list=EXAMS[dateIso]||[];
  const g = kind==='ex_junior' ? JUNIOR_G : SENIOR_G;
  return list.filter(r=>g.indexOf(r.grade)>-1);
}

/* ================= פריסה =================
   אירוע נחתך לפי חודש: פס אחד לכל חודש שהוא נוגע בו. אירוע שנמשך
   מסוף אוקטובר לתחילת נובמבר אינו יכול להיות מלבן אחד ברשת שבה כל
   חודש הוא שורה נפרדת. */
/* טווח קריא לחלונית הריחוף: יום בודד מוצג פעם אחת ולא פעמיים */
function fmtRange(a, b){
  const f = d => {
    const dt = fromIso(d);
    return dt.getUTCDate() + '.' + (dt.getUTCMonth()+1) + ' · ' + gim(hebOf(dt).d) + ' ' + hebOf(dt).mHe;
  };
  return a === b ? f(a) : f(a) + '  ←  ' + f(b);
}

function segmentsFor(y, m){
  const first = mk(y,m,1), last = mk(y,m,daysIn(y,m));
  const segs = [];
  EVENTS.forEach(e=>{
    if(e._b < first || e._a > last) return;
    const a = e._a < first ? first : e._a;
    const b = e._b > last  ? last  : e._b;
    segs.push({ev:e, from:a.getUTCDate(), to:b.getUTCDate(),
               cut: e._a<first || e._b>last});
  });
  return segs;
}
/* אריזה למסלולים: שני אירועים חופפים באותו מסלול יורדים זה מתחת לזה
   במקום להסתיר זה את זה */
function lanes(segs){
  const out=[];
  segs.sort((x,y)=>x.from-y.from || (y.to-y.from)-(x.to-x.from));
  segs.forEach(s=>{
    let i=0;
    while(out[i] && out[i].some(o=>!(s.to<o.from || s.from>o.to))) i++;
    (out[i]=out[i]||[]).push(s);
  });
  return out;
}

function render(){
  const box=document.getElementById('sheet');
  const todayIso = iso(new Date(Date.now()));
  let html='';
  for(let i=0;i<12;i++){
    const m=(8+i)%12, y=YEAR+(m<8?1:0);
    const n=daysIn(y,m), off=mk(y,m,1).getUTCDay();   /* 0=ראשון=א */
    const hFirst=hebOf(mk(y,m,1)).mHe, hLast=hebOf(mk(y,m,n)).mHe;

    let wds='', days='', hebs='';
    for(let c=0;c<37;c++){
      const dnum=c-off+1, has=dnum>=1&&dnum<=n;
      const sat=(c%7)===6;
      /* שורת ימי השבוע חוזרת בכל חודש ולא פעם אחת בראש הגיליון כמו
         באקסל: כאן גוללים, וכותרת יחידה למעלה נעלמת מן המסך. */
      wds+=`<div class="wd${sat?' sat':''}">${DOW[c%7]}</div>`;
      if(!has){ days+=`<div class="d${sat?' sat':''}"></div>`;
                hebs+=`<div class="hd${sat?' sat':''}"></div>`; continue; }
      const dt=mk(y,m,dnum);
      const isToday = iso(dt)===todayIso;
      days+=`<div class="d${sat?' sat':''}${isToday?' today':''}">${dnum}</div>`;
      hebs+=`<div class="hd${sat?' sat':''}">${gim(hebOf(dt).d)}</div>`;
    }

    let tracks='';
    TRACKS.forEach(tr=>{
      let segs=segmentsFor(y,m).filter(s=>s.ev.track===tr.k);

      /* מסלולי המבחנים — פס לכל יום בנפרד, בלי מתיחה על רצף.
         יום בלי מבחן נשאר ריק. */
      if(tr.ro){
        segs=[];
        for(let d=1;d<=n;d++){
          const ds=iso(mk(y,m,d));
          const list=examsOn(ds,tr.k);
          if(list.length) segs.push({exam:true, date:ds, list:list, from:d, to:d, ev:null});
        }
      }
      /* שכבת החגים האוטומטית — רק במסלול החגים, ורק היכן שאין אירוע ידני */
      if(tr.k==='holidays'){
        for(let d=1;d<=n;d++){
          const dt=mk(y,m,d);
          const taken=segs.some(s=>d>=s.from&&d<=s.to);
          if(taken) continue;
          autoHolidays(dt).forEach(t=>{
            const prev=segs.find(s=>s.auto && s.title===t && s.to===d-1);
            if(prev) prev.to=d;
            else segs.push({auto:true, title:t, from:d, to:d, ev:null});
          });
        }
      }
      const L=lanes(segs);
      const rows = Math.max(1, L.length);
      tracks += `<div class="tname">${tr.t}</div>`;
      for(let r=0;r<rows;r++){
        for(let c=0;c<37;c++){
          const dnum=c-off+1, sat=(c%7)===6;
          const ok=dnum>=1&&dnum<=n;
          tracks += `<div class="trk${sat?' sat':''}"${(ok && !tr.ro)
            ? ` onclick="openNew('${tr.k}','${iso(mk(y,m,dnum))}')"` : ''}></div>`;
        }
        (L[r]||[]).forEach(s=>{
          /* פס מבחנים — תווית אחת, והפירוט בלחיצה. */
          if(s.exam){
            const start0=s.from+off;
            const tip=s.list.map(x=>'· '+x.subject_base+(x.level?' '+x.level:'')+
              ' — '+(x.scope==='grade'?'כל שכבה '+x.grade:x.class_name)+
              (x.hour?' · שעה '+x.hour:'')).join('\n');
            tracks += `<div class="bar" style="grid-column:${start0}/span 1;
                 margin-top:-19px;background-color:${tr.c};color:#fff;cursor:pointer"
                 title="${esc(s.list.length+' מבחנים\n'+tip)}"
                 onclick="openExams('${s.date}','${tr.k}')"
               >מבחנים${s.list.length>1?' ('+s.list.length+')':''}</div>`;
            return;
          }
          const col = s.auto ? '#f6c445' : (s.ev.color||tr.c);
          const start = s.from+off, span = s.to-s.from+1;
          const label = s.auto ? s.title : s.ev.title;
          /* חלונית הריחוף נושאת גם את התאריכים וגם את ההערה. הפס עצמו
             נחתך ב-ellipsis, ולכן הריחוף הוא המקום היחיד שבו נראה מה
             שנכתב — ובלי ההערה הוא חזר על מה שכבר מופיע על הפס. */
          let tip = label;
          if(!s.auto){
            const e=s.ev;
            tip += '\n' + fmtRange(e.start_date, e.end_date);
            if(e.notes) tip += '\n\n' + e.notes;
          }
          tracks += `<div class="bar${s.auto?' auto':''}${tr.k==='vacation'?' vac':''}"
            style="grid-column:${start}/span ${span};margin-top:-19px;
                   background-color:${col};color:${inkOn(col)}"
            title="${esc(tip)}"
            ${s.auto?'':`onclick="openEdit('${s.ev.id}')"`}
            >${s.cut?'… ':''}${esc(label)}${
              (!s.auto && s.ev.notes) ? ' <span class="hasnote">•</span>' : ''}</div>`;
        });
      }
    });

    html += `<div class="month">
      <div class="mlab"><b>${MONTHS[i]}</b><small>${hFirst}${hFirst!==hLast?'–'+hLast:''}
        · ${y}</small></div>
      <div class="mgrid">${wds}${days}${hebs}${tracks}</div>
    </div>`;
  }
  box.innerHTML=html;
}

/* ================= עריכה ================= */
function drawColors(){
  document.getElementById('fColors').innerHTML = COLORS.map(c=>
    `<div class="sw${c===PICKCOL?' on':''}" style="background:${c}"
      onclick="pickColor('${c}')"></div>`).join('');
}
function pickColor(c){ PICKCOL=c; drawColors(); }

function openNew(track, day){
  if(VIEW) return;
  EDIT=null;
  document.getElementById('mTitle').textContent='אירוע חדש';
  document.getElementById('mDel').style.display='none';
  document.getElementById('fTitle').value='';
  document.getElementById('fNotes').value='';
  document.getElementById('fTrack').value = track || 'senior';
  const d = day || iso(new Date(Date.now()));
  document.getElementById('fFrom').value=d;
  document.getElementById('fTo').value=d;
  PICKCOL = (TRACKS.find(t=>t.k===(track||'senior'))||{}).c || COLORS[0];
  drawColors();
  document.getElementById('mErr').classList.remove('on');
  document.getElementById('ov').classList.add('on');
  document.getElementById('fTitle').focus();
}
function openEdit(id){
  if(VIEW) return;
  const e=EVENTS.find(x=>String(x.id)===String(id)); if(!e) return;
  EDIT=e;
  document.getElementById('mTitle').textContent='עריכת אירוע';
  document.getElementById('mDel').style.display='';
  document.getElementById('fTitle').value=e.title||'';
  document.getElementById('fNotes').value=e.notes||'';
  document.getElementById('fTrack').value=e.track;
  document.getElementById('fFrom').value=e.start_date;
  document.getElementById('fTo').value=e.end_date;
  PICKCOL=e.color||COLORS[0]; drawColors();
  document.getElementById('mErr').classList.remove('on');
  document.getElementById('ov').classList.add('on');
}
/* ============================================================
   פירוט מבחני היום — קריאה בלבד
   ------------------------------------------------------------
   חלון נפרד ולא טופס העריכה: אין כאן מה לערוך, וטופס
   שנראה כמו טופס היה מזמין לנסות.
   ============================================================ */
function openExams(dateIso, kind){
  const list=examsOn(dateIso,kind);
  if(!list.length) return;
  const d=fromIso(dateIso);
  const ttl=new Intl.DateTimeFormat('he',{weekday:'long',day:'numeric',month:'long'})
    .format(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));
  let box=document.getElementById('exOv');
  if(!box){
    box=document.createElement('div');
    box.id='exOv';
    box.setAttribute('style','position:fixed;inset:0;background:rgba(20,18,30,.45);'+
      'display:flex;align-items:center;justify-content:center;z-index:80;padding:18px');
    box.onclick=ev=>{ if(ev.target===box) box.remove(); };
    document.body.appendChild(box);
  }
  box.innerHTML='<div style="background:#fff;border-radius:16px;padding:20px 22px;'+
    'max-width:440px;width:100%;font-family:inherit;max-height:80vh;overflow:auto">'+
    '<h3 style="margin:0 0 3px">מבחנים · '+esc(ttl)+'</h3>'+
    '<p style="margin:0 0 13px;color:#6a6f8a;font-size:.85rem">'+
      (kind==='ex_junior'?'חטיבת הביניים':'חטיבה עליונה')+
      ' · לשינוי — בלוח המבחנים</p>'+
    list.map(x=>'<div style="border-top:1px solid #e3e0ee;padding:9px 0">'+
      '<b>'+esc(x.subject_base)+(x.level?' '+esc(x.level):'')+'</b>'+
      '<div style="font-size:.86rem;color:#6a6f8a">'+
        (x.scope==='grade'?'כל שכבה '+esc(x.grade):esc(x.class_name||''))+
        (x.hour?' · שעה '+x.hour+(x.hour_end&&x.hour_end!==x.hour?'–'+x.hour_end:''):'')+
      '</div>'+
      (x.title&&x.title!==x.subject_base
        ?'<div style="font-size:.84rem">'+esc(x.title)+'</div>':'')+
      '</div>').join('')+
    '<div style="margin-top:15px;display:flex;gap:8px">'+
      '<a href="mivchanim-luach.html?grade='+encodeURIComponent(list[0].grade)+
        '" style="text-decoration:none;background:#4c1d95;color:#fff;border-radius:10px;'+
        'padding:8px 16px;font-weight:800;font-size:.86rem">ללוח המבחנים</a>'+
      '<button onclick="document.getElementById(\'exOv\').remove()" '+
        'style="background:#efedf7;border:0;border-radius:10px;padding:8px 16px;'+
        'font-family:inherit;font-weight:800;font-size:.86rem;cursor:pointer">סגירה</button>'+
    '</div></div>';
}

function closeModal(){ document.getElementById('ov').classList.remove('on'); EDIT=null; }
function toast(t,err){
  const n=document.getElementById('toast');
  n.textContent=t; n.className='toast on'+(err?' err':'');
  setTimeout(()=>n.className='toast',2600);
}
function showErr(t){
  const e=document.getElementById('mErr'); e.textContent=t; e.classList.add('on');
}

async function saveEvent(){
  const title=(document.getElementById('fTitle').value||'').trim();
  let a=document.getElementById('fFrom').value, b=document.getElementById('fTo').value;
  if(!title) return showErr('חובה לתת שם לאירוע.');
  if(!a||!b)  return showErr('חובה למלא תאריך התחלה וסיום.');
  if(b<a){ const t=a; a=b; b=t; }   /* תאריכים הפוכים מתוקנים בשקט */
  const row={year_start:YEAR, track:document.getElementById('fTrack').value,
             title:title, start_date:a, end_date:b, color:PICKCOL,
             notes:(document.getElementById('fNotes').value||'').trim()||null};
  const btn=document.getElementById('mGo'); btn.disabled=true; btn.textContent='שומר…';
  try{
    if(EDIT) await api('gantt_events?id=eq.'+encodeURIComponent(EDIT.id),
      {method:'PATCH', body:JSON.stringify(row)});
    else     await api('gantt_events', {method:'POST', body:JSON.stringify(row)});
    closeModal(); await load(); render(); toast('✓ נשמר');
  }catch(e){ showErr('שגיאה: '+String(e.message||e).slice(0,120)); }
  btn.disabled=false; btn.textContent='שמירה';
}
async function removeEvent(){
  if(!EDIT) return;
  if(!confirm('למחוק את "'+EDIT.title+'"?')) return;
  try{
    await api('gantt_events?id=eq.'+encodeURIComponent(EDIT.id), {method:'DELETE'});
    closeModal(); await load(); render(); toast('נמחק');
  }catch(e){ showErr('שגיאה: '+String(e.message||e).slice(0,120)); }
}

async function switchYear(){
  YEAR = parseInt(document.getElementById('yearSel').value,10);
  try{ await load(); render(); }
  catch(e){ document.getElementById('sheet').innerHTML=
    '<div class="msg">שגיאה: '+esc(String(e.message||e)).slice(0,160)+'</div>'; }
}

(async function boot(){
  YEAR = planYear();
  const q=new URLSearchParams(location.search);
  const p=q.get('year');
  if(p) YEAR=parseInt(p,10);
  VIEW = q.get('view')==='1';
  if(VIEW) document.body.classList.add('viewonly');
  buildYearSel(); drawColors(); loadZoom();
  try{ await load(); render(); }
  catch(e){
    document.getElementById('sheet').innerHTML=
      '<div class="msg">שגיאה בטעינה: '+esc(String(e.message||e)).slice(0,180)+
      '<br><br>אם הטבלה gantt_events טרם נוצרה — יש להריץ את ה-SQL תחילה.</div>';
  }
})();
</script>
