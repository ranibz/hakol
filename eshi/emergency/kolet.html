     תיק מתקן קולט (תיק מתקן פס"ח — מתקן קליטה מקומי) — תיק לצפייה ולהדפסה, באותו מבנה כמו נוהל הפינוי,
     תיק הצל"ח ותיק הביטחון.
     v1.0.0 · עמוד שער, תוכן עניינים לחיץ, פס פרקים קבוע, כפתור ⬆, קישור ישיר לפרק (#ch-8).
       · 26 הפרקים של התיק המקורי + ריכוז עדכונים: תיאור המתקן ואישור תברואה, ייעוד, תפקידי הצוות,
         סדר פעולות ראשוני, בעלי תפקידים ברשות, תקן כ"א, הגדרת תפקידים, טבלת איוש, ציוד, מזון, רישום ודיווח,
         טפסים (קבלת/החזרת מבנים, נזקים, דו"ח אירוע, רישום, מצב יומי, כרטיס אישי, מידע לציבור, תורנות,
         צרכים מיוחדים), טבלת מעקב אמצעים, דף מידע למפונה, תרשים, תדריך קליטה, כללי התנהגות.
       · הנוסח המקורי מופיע כברירת מחדל ואפשר לשנות אותו בטופס העדכון; פרטי בית הספר משתלבים בנוסח ובטפסים.
       · הדפסה: התיק המלא, רק הטפסים הריקים (לשכפול), או רק דף המידע למפונה.
       · הנתונים לא נמצאים בקובץ: הם בשרת בטבלה סגורה (kl_data), ונטענים רק עם קוד (kl_get).
       · עדכון: kolet-update.html (קוד עריכה). עדכון אוטומטי לגרסה חדשה (קישור מוואטסאפ).

<body>
<div class="bar noprint"><div class="in">
  <h1>🏫 תיק מתקן קולט</h1>
  <span class="sp"></span>
  <span id="acts"></span>
</div><nav class="chips" id="chips" aria-label="פרקי התיק"></nav></div>
<button id="topBtn" class="noprint" title="לראש התיק" aria-label="לראש התיק">⬆</button>
<div class="wrap" id="app"></div>
<footer>פיתוח: רני בן זאב · v1.0.0</footer>

<script>
const $ = id => document.getElementById(id);
const esc = klEsc;
const CODE_KEY = 'kl_code';
let CODE = '', ROLE = '', DATA = {}, UPD = null;
const ss = {get(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } },
            set(k,v){ try{ sessionStorage.setItem(k,v); }catch(e){} }, del(k){ try{ sessionStorage.removeItem(k); }catch(e){} }};

function gate(msg){
  $('acts').innerHTML = ''; $('chips').classList.remove('on');
  $('app').innerHTML = `<div class="gate">
    <div style="font-size:42px">🏫</div>
    <h2 style="margin:6px 0">תיק מתקן קולט</h2>
    <p style="color:var(--muted);margin:0">הקלידו קוד צפייה או קוד עריכה.</p>
    <input id="code" type="password" autocomplete="off" placeholder="קוד">
    <button id="go">כניסה</button>
    <div class="err" id="err">${msg ? esc(msg) : ''}</div>
    <p style="margin-top:14px"><a href="tikim.html">← תיקי חירום וביטחון</a></p></div>`;
  const go = () => { const c = $('code').value.trim(); if(c) load(c); };
  $('go').onclick = go; $('code').onkeydown = e => { if(e.key === 'Enter') go(); };
  $('code').focus();
}

async function load(code){
  if($('err')) $('err').textContent = 'טוען…';
  try{
    const r = await klRpc('kl_get', {p_code: code});
    CODE = code; ROLE = r.role; DATA = r.data || {}; UPD = r.updated_at;
    ss.set(CODE_KEY, code);
    render();
  }catch(e){
    ss.del(CODE_KEY);
    gate(/קוד/.test(e.message) ? 'קוד שגוי' : 'אין חיבור לשרת — נסו שוב');
  }
}

/* ---------- רינדור ---------- */
const v = x => (x === undefined || x === null || String(x).trim() === '') ? '' : String(x);
const blank = '<span class="blank">______________</span>';
const get = path => path.split('.').reduce((o, k) => o == null ? o : o[k], DATA);
/* ערך משדה, או קו ריק להשלמה ביד */
const fv = path => v(get(path)) ? esc(get(path)) : '<span class="ln"></span>';
/* טקסט עם {fac.name} וכו' */
const tpl = s => esc(s).replace(/\{([a-zA-Z]+\.[a-zA-Z]+)\}/g, (m, p) => fv(p)).replace(/\n/g, '<br>');
const valOf = p => DATA[p.k] !== undefined ? DATA[p.k] : p.def;

function rFields(p){
  const o = DATA[p.k] || {};
  return `<div class="kvwrap"><table class="kv"><tbody>${p.fields.map(([k, l, ltr]) =>
    `<tr><td>${esc(l)}</td><td${ltr ? ' class="ltr"' : ''}>${v(o[k]) ? esc(o[k]).replace(/\n/g, '<br>') : blank}</td></tr>`).join('')}</tbody></table>
    ${p.sign ? `<div class="sigline"><div>${esc(p.sign)}</div><div></div></div>` : ''}</div>`;
}
function rTable(p){
  const rows = (DATA[p.k] && DATA[p.k].length) ? DATA[p.k] : (p.def || []);
  const head = `<tr>${p.num ? '<th>מס"ד</th>' : ''}${p.cols.map(c => `<th>${esc(c.l)}</th>`).join('')}</tr>`;
  const body = (rows.length ? rows : [{}, {}]).map((r, i) => `<tr>${p.num ? `<td class="n">${i + 1}</td>` : ''}${p.cols.map(c =>
      `<td${c.ltr ? ' class="ltr"' : ''}>${esc(v(r[c.k])).replace(/\n/g, '<br>') || '&nbsp;'}</td>`).join('')}</tr>`).join('');
  return `<table${p.wide ? ' style="font-size:12px"' : ''}><thead>${head}</thead><tbody>${body}</tbody></table>`;
}
function rList(p){
  const a = (valOf(p) || []).filter(x => v(x));
  if(!a.length) return `<p>${blank}</p>`;
  /* "- " = תת-סעיף של הסעיף שלפניו */
  const items = [];
  a.forEach(x => { const s = String(x);
    if(/^\s*-\s+/.test(s) && items.length) items[items.length - 1].sub.push(s.replace(/^\s*-\s+/, ''));
    else items.push({t: s.replace(/^\s*-\s+/, ''), sub: []}); });
  const tag = p.ol ? 'ol' : 'ul';
  return `<${tag} class="lst">${items.map(it => `<li>${tpl(it.t)}${it.sub.length ? `<ul class="sub">${it.sub.map(s => `<li>${tpl(s)}</li>`).join('')}</ul>` : ''}</li>`).join('')}</${tag}>`;
}
function rText(p){
  const s = valOf(p);
  if(!v(s)) return p.ph ? '' : `<p>${blank}</p>`;
  return String(s).split(/\n\s*\n/).map(x => `<p>${tpl(x.trim())}</p>`).join('');
}
function rStatic(p){
  const nc = p.head.length;
  return `<table class="st"><thead>${p.cap ? `<tr><th colspan="2"></th><th class="c" colspan="3">${esc(p.cap)}</th><th></th></tr>` : ''}
    <tr>${p.head.map((h, i) => `<th${i > 1 && i < nc - 1 && p.cap ? ' class="c"' : ''}>${esc(h)}</th>`).join('')}</tr></thead>
    <tbody>${p.rows.map((r, ri) => `<tr${p.tot && ri === p.rows.length - 1 ? ' class="tot"' : ''}>${r.map((c, i) =>
      `<td${p.cap && i > 1 && i < nc - 1 ? ' class="c"' : ''}>${p.html ? c : esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
function rRoles(p){
  return `<div class="roles">${p.items.map(it => `<h4>${esc(it.h)}</h4><ul>${it.li.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`).join('')}</div>`;
}
function rPart(p){
  let h = '';
  if(p.t && p.type !== 'frame') h += `<h3 class="pt">${esc(p.t)}</h3>`;
  if(p.type === 'fields') h += rFields(p);
  else if(p.type === 'table') h += rTable(p);
  else if(p.type === 'text') h += rText(p);
  else if(p.type === 'list') h += rList(p);
  else if(p.type === 'static') h += rStatic(p);
  else if(p.type === 'roles') h += rRoles(p);
  else if(p.type === 'note') h += `<div class="note${p.plain ? ' plain' : ''}">${p.html}</div>`;
  else if(p.type === 'form') h += KL_FORMS[p.f](fv);
  else if(p.type === 'frame') h += `<div class="frame">${esc(p.t)} — מקום לשרטוט או להדבקת תרשים</div>`;
  return h;
}
const chTitle = c => c.n === '0' ? c.t : `${c.n}. ${c.t}`;

function render(){
  const date = v(DATA.fileDate) || (UPD ? new Date(UPD).toLocaleDateString('he-IL') : '');
  const facName = v((DATA.fac || {}).name) || KL_SCHOOL;
  $('acts').innerHTML = `
    <button class="pr" id="pFull">🖨️ הדפסת התיק</button>
    <button id="pForms">🖨️ רק הטפסים</button>
    <button id="pSheet">🖨️ דף מידע למפונה</button>
    ${ROLE === 'edit' ? '<a href="kolet-update.html">✏️ עדכון התיק</a>' : ''}
    <button id="out">יציאה</button>`;
  $('app').innerHTML = `<div class="doc">
    <section class="cover">
      <div class="gov">${esc(KL_SCHOOL)} · סמל 260489</div>
      <h1>תיק מתקן פס"ח<br>מתקן קולט</h1>
      <h2>מתקן קליטה מקומי</h2>
      <div class="school">${esc(facName)}</div>
      ${v((DATA.fac || {}).address) ? `<div class="meta">${esc(DATA.fac.address)}</div>` : ''}
      <div class="meta">תאריך: ${esc(date) || blank}</div>
    </section>
    <section class="toc"><h2 class="ch" style="page-break-before:auto">תוכן התיק</h2><ol start="0">
      ${KL_SCHEMA.map(c => `<li><a href="#ch-${esc(c.n)}">${esc(c.t)}</a>${c.form ? ' <span class="fmk">· טופס</span>' : ''}</li>`).join('')}</ol></section>
    ${KL_SCHEMA.map(c => `<div data-ch="${esc(c.n)}"${c.form ? ' data-form="1"' : ''}>
      <h2 class="ch" id="ch-${esc(c.n)}">${esc(chTitle(c))}</h2>
      ${c.parts.map(rPart).join('')}</div>`).join('')}
    <p class="upd noprint">עודכן לאחרונה: ${UPD ? new Date(UPD).toLocaleString('he-IL') : '—'}</p>
  </div>`;
  $('pFull').onclick = () => doPrint('');
  $('pForms').onclick = () => doPrint('forms');
  $('pSheet').onclick = () => doPrint('sheet');
  $('out').onclick = () => { ss.del(CODE_KEY); location.reload(); };
  document.querySelectorAll('.doc table').forEach(t => { const w = document.createElement('div'); w.className = 'tw'; t.before(w); w.appendChild(t); });
  buildNav();
}

/* ---------- ניווט בין הפרקים ---------- */
let navObs = null;
function setBarH(){ document.documentElement.style.setProperty('--barH', (document.querySelector('.bar').offsetHeight + 8) + 'px'); }
function goCh(id, smooth){
  const el = document.getElementById(id); if(!el) return;
  el.scrollIntoView({behavior: smooth ? 'smooth' : 'auto', block: 'start'});
  history.replaceState(null, '', '#' + id);
}
function buildNav(){
  const items = KL_SCHEMA.map(c => ['ch-' + c.n, chTitle(c)]);
  const nav = $('chips');
  nav.innerHTML = items.map(([id, t]) => `<a href="#${id}" data-ch="${id}">${esc(t)}</a>`).join('');
  nav.classList.add('on');
  setBarH();
  document.querySelectorAll('a[href^="#ch-"]').forEach(a => a.onclick = e => { e.preventDefault(); goCh(a.getAttribute('href').slice(1), true); });
  if(navObs) navObs.disconnect();
  if('IntersectionObserver' in window){
    navObs = new IntersectionObserver(() => markCur(), {rootMargin: '0px 0px -60% 0px'});
    document.querySelectorAll('h2.ch[id]').forEach(h => navObs.observe(h));
  }
  if(/^#ch-/.test(location.hash)) setTimeout(() => goCh(location.hash.slice(1), false), 50);
}
function markCur(){
  const lim = (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--barH')) || 120) + 20;
  let cur = null;
  document.querySelectorAll('h2.ch[id]').forEach(h => { if(h.getBoundingClientRect().top <= lim) cur = h.id; });
  document.querySelectorAll('#chips a').forEach(a => {
    const on = a.dataset.ch === cur;
    if(on && !a.classList.contains('cur')){
      const nav = $('chips'), r = a.getBoundingClientRect(), n = nav.getBoundingClientRect();
      nav.scrollBy({left: (r.left + r.width / 2) - (n.left + n.width / 2)});
    }
    a.classList.toggle('cur', on);
  });
}
window.addEventListener('scroll', () => { $('topBtn').classList.toggle('on', scrollY > 600); markCur(); }, {passive: true});
window.addEventListener('resize', setBarH);
$('topBtn').onclick = () => { scrollTo({top: 0, behavior: 'smooth'}); history.replaceState(null, '', location.pathname + location.search); };

/* הדפסה: התיק המלא / רק הטפסים הריקים / רק דף המידע למפונה */
function doPrint(mode){
  document.body.classList.remove('forms', 'sheet');
  if(mode) document.body.classList.add(mode);
  window.print();
}
window.addEventListener('afterprint', () => document.body.classList.remove('forms', 'sheet'));

const saved = ss.get(CODE_KEY);
if(saved) load(saved); else gate();
</script>
