     התפקידים שלי בחירום — ריכוז כל בעלי התפקידים מכל תיקי החירום, לפי מורה ולפי תפקיד.
     v1.0.0 · שלוש לשוניות:
       👤 התפקידים שלי — מקלידים שם, ורואים את כל התפקידים בכל תרחיש (ירי טילים, פינוי ופיזור, צל"ח, ביטחון),
          עם המשימות של כל תפקיד, השותף לתפקיד, ומה כל מורה עושה בירי טילים (מדרכי הפעולה בתיק הביטחון).
          "אני מחנך/ת" מוסיף את דרכי הפעולה של המחנכים בפינוי. ?name=... פותח ישר על שם.
       📋 לפי תפקידים — כל התפקידים בכל התיקים, עם השמות; תפקיד בלי שם מסומן ⚠️.
       👥 כל המורים — כמה תפקידים יש לכל מורה (לאיזון עומסים), ושמות בתיקים שלא נמצאו ברשימת המורים.
     · מקורות (נקראים מהשרת, לא נשמרים בקובץ): נוהל הפינוי (pn_data), תיק הביטחון (bt_data), תיק הצל"ח (tz_entries),
       רשימת המורים (pizur_staff). רק שמות ותפקידים — בלי טלפונים, כתובות ומקום מגורים. דורש HAKOL-roles.sql (em_roles).
     · התאמת שמות: בתיקים כתוב לפעמים רק שם פרטי ("אמיל") או שם ואות ("דורית ס"). התאמה כזו מסומנת "לוודא".
     · כניסה פעם אחת בקוד מקלטים / קוד נוהל הפינוי. הנתונים נשמרים בטלפון ועובדים גם בלי אינטרנט.

<style>
:root{--bg:#eef1f4;--ink:#14202e;--muted:#5d6b7c;--line:#d5dce5;--card:#fff;--warn:#b45309;--bad:#b91c1c;--ok:#15803d;

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,system-ui,sans-serif}
header{background:linear-gradient(160deg,#1b2d45,#0f1b2b);color:#fff;padding:18px 16px 0}
header .in{max-width:820px;margin:0 auto}
header .sc{font-size:13px;opacity:.85}

header p{margin:0 0 12px;opacity:.88;font-size:14px}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap;border:0;background:rgba(255,255,255,.12);color:#fff;font:inherit;font-weight:700;font-size:14px;padding:11px 6px;border-radius:12px 12px 0 0;cursor:pointer}
.tabs button.on{background:var(--bg);color:var(--ink)}
main{max-width:820px;margin:0 auto;padding:14px 16px 30px}
.box{background:var(--card);border-radius:16px;border:1px solid var(--line);padding:16px;margin-bottom:12px}
label.big{display:block;font-weight:800;font-size:16px;margin-bottom:6px}
input[type=text],input[type=password],input[type=search]{width:100%;font:inherit;font-size:18px;padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:#fff}
input:focus{outline:none;border-color:#1d4ed8}
.btn{display:inline-block;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:800;font-size:16px;background:#1b2d45;color:#fff;cursor:pointer;text-decoration:none}
.btn.w{width:100%;margin-top:10px}
.btn.sec{background:#e5e9f0;color:var(--ink)}
.chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:700;font-size:15px}
.chk input{width:20px;height:20px}
.muted{color:var(--muted)} .err{color:var(--bad);font-weight:700;min-height:20px;margin-top:8px}
.sum{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.sum span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:700}
.sc{border-inline-start:6px solid var(--c);}
.sch{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:19px}
.sch .n{margin-inline-start:auto;font-size:13px;color:var(--muted);font-weight:700}
.role{border-top:1px solid var(--line);padding:11px 0 4px}
.role:first-of-type{border-top:0;padding-top:2px}
.role b.t{font-size:17px;display:block}
.role .d{font-size:14.5px;color:var(--muted);margin-top:2px;line-height:1.5}
.role .src{font-size:12.5px;margin-top:4px} .role .src a{color:#1d4ed8;font-weight:700;text-decoration:none}
.tag{display:inline-block;font-size:12px;font-weight:800;border-radius:6px;padding:1px 7px;margin-inline-start:6px;vertical-align:2px}
.tag.weak{background:#fff3d6;color:var(--warn)} .tag.gen{background:#e9edf3;color:var(--all)}
details.du{margin-top:6px} details.du summary{cursor:pointer;font-weight:700;color:var(--c);font-size:14px}
details.du ol,details.du ul{margin:6px 0 2px;padding-inline-start:20px;font-size:14.5px;line-height:1.6}
details.du .h{font-weight:800;margin-top:6px;list-style:none;margin-inline-start:-20px}
.acts{margin:6px 0 0;padding:0;list-style:none;font-size:14.5px;line-height:1.55}
.acts li{padding:6px 10px;background:#f6f7fa;border-radius:9px;margin-top:5px}
.acts li b{color:var(--c)}
.empty{text-align:center;padding:22px 10px;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .who{font-size:14.5px;text-align:left;font-weight:700}
.row .who .miss{color:var(--bad)}
.tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.tlist button{display:flex;justify-content:space-between;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font:inherit;font-size:14.5px;cursor:pointer;text-align:right;color:var(--ink)}
.tlist button b{background:#e9edf3;border-radius:8px;min-width:28px;text-align:center;padding:1px 6px}
.tlist button.z b{background:#fde8e8;color:var(--bad)} .tlist button.h b{background:#dbeafe;color:#1d4ed8}
.filt{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.filt button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.filt button.on{background:#1b2d45;color:#fff;border-color:#1b2d45}
footer{text-align:center;color:var(--muted);font-size:12px;margin:10px 0 24px}
@media print{header .tabs,.noprint{display:none} body{background:#fff}}
</style>

<script>
/* תיאורי התפקידים בצל"ח — מתוך tzalach.html (תיק הצל"ח של שפ"י) */
const PAIR = ['ראשי/ת','ממלא/ת מקום בעת הצורך'];
const ROLES = [
 {k:'head', t:'ראש הצל"ח', sub:'מנהל המוסד החינוכי', L:PAIR, d:[
  'הגדרת האירוע כאירוע חירום והחלטה על דרך ניהולו ומיקום המטה המנהל.','כינוס וניהול ישיבות הצל"ח.','קבלת תמונת מצב והפיכתה למידע זמין.','ריכוז מידע מעודכן באופן שוטף והצגתו, תוך כדי הפרכת שמועות.','פיקוח ומעקב אחר ביצוע החלטות והנחיות הצל"ח.','כינוס מורי המוסד החינוכי, מתן מידע, הנחיות וסדר יום מעודכן.','עבודה רציפה תוך שיתוף פעולה עם כל הגורמים המעורבים.','דיווח למשרד החינוך – למפקח הכולל של המוסד החינוכי ולמפקחת על הייעוץ.','דיווח לרשויות המקומיות – ראש מחלקת חינוך.','השגת עזרה מקצועית נוספת בהתאם לצורך וקבלת החלטות באשר לכניסת גורמי סיוע חיצוניים למוסד החינוכי.','קביעת ישיבות עדכון, סיכום והפקת לקחים.','אישור כל דפי המידע טרם הפצתם לתלמידים, למורים ולהורים.','הכרזה על סיום האירוע וחזרה לשגרה.','הגדרת משימות מתמשכות במקביל לחזרה לשגרה.','ישיבת בקרה והפקת לקחים ומעקב אחר מימושם בהתאם ללו"ז.','וידוא עבודת המוסד החינוכי בהתאם להנחיות הדוברות במשרד החינוך וברשות המקומית, ותכנון הפעולות בהתאם.']},
 {k:'deputy', t:'סגן ראש הצל"ח', sub:'סגן המנהל', L:PAIR, d:[

 {k:'counsel_head', t:'מרכז צוות הייעוץ', L:PAIR, d:[
  'עבודה רצופה עם ראש הצל"ח וסגנו וקיום היוועצויות לפי הצורך.','ריכוז צוות הייעוץ.','הכוונת צוות הייעוץ לטיפול נכון באוכלוסייה הזקוקה לייעוץ: תלמידים, הורים ומורים.','הכוונה והדרכת מורים בהתערבות חינוכית ברמת הכיתה וברמת הפרט.','הכוונה מערכתית להתערבויות חינוכיות וטיפוליות בהתאם לזיהוי מעגלי הפְּגִיעוּת.','מעקב אחר התמודדות הצוות ואחר ההתערבות בכיתות, תוך מתן תמיכה וסיוע.','דיווח לממונים מקצועיים.','ריכוז הצוות הטיפולי בסוף היום לקבלת תמונת מצב ולתכנון התערבויות להמשך.','מעקב אחרי תלמידים ואנשי צוות שנפגעו ואיתור תלמידים מוכרים שמגלים קושי בעקבות האירוע.','בניית ערוצי תקשורת עם ההורים והקהילה.','מתן תמיכה מתמשכת לצוות החינוכי והמנהלי.','בחינת צרכים ייחודיים של הורים/ ותלמידים עם זכאות לשרותי חינוך מיוחדים וגיבוש מענים מותאמים לצרכים אלו.']},
 {k:'parents', t:'איש קשר להורי המוסד החינוכי', sub:'רכז + צוות', L:PAIR, d:[
  'ריכוז המידע הרלוונטי להורי התלמידים והעברתו ע"פ הנחיות הצל"ח.','סיוע באיתור וגיוס מתנדבים מקרב ההורים והבוגרים.']},
 {k:'secretary', t:'מזכיר הצוות', sub:'מזכיר הצל"ח – מזכירת בית הספר', L:PAIR, d:[

 {k:'secretary2', t:'מזכירת הצל"ח', L:PAIR, d:[]},

 {k:'counselor', t:'יועץ חינוכי', sub:'יועצ/ת', L:PAIR, d:[

 {k:'psych', t:'פסיכולוג המוסד החינוכי מטעם השפ"ח*', sub:'פסיכולוג/ית', L:PAIR,
  fn:'* רמת השירות (הפסיכולוגי והחינוכי) שתינתן ע"י הפסיכולוג המוסד החינוכי נתונה לשיקול דעתו של מנהל השפ"ח, בהתאם למדיניות אגף פסיכולוגיה בשפ"י ובכפוף למשאבי השפ"ח.', d:[
  'שותף לצוות הצל"ח בשגרה ובחרום.','משמש גורם היוועצות לראש הצל"ח במצבי שגרה וחירום.','משמש גורם מנחה ומייעץ בכל הנוגע לבריאות נפש של ילדים ורווחה נפשית של הורים וצוותי חינוך במצבי טראומה ומשבר.',
  '#בשגרה:','שותף בצוות החינוכי-טיפולי של בית הספר.','מסייע לראש הצל"ח, בשיתוף גורמים רלוונטיים, בגיבוש. תכנית ההכשרה השנתית לצוות הצל"ח ושותף להנחיה.',
  '#בחירום:','סיוע במיפוי מעגלי הפְּגִיעוּת, בדגש על בריאות נפשית ורגישויות וצרכים רגשיים של הורים וצוות חינוכי.','ביצוע הערכות פסיכולוגיות של צרכים נפשיים, כולל מצבי טראומה, בהתאם לשיקול הדעת של הפסיכולוג.','גיבוש מענים טיפוליים והתערבויות מערכתיות ופרטניות בהתאם למעגלי הפגיעות באוכלוסיות השונות.','שותף ביישום התכנית החינוכית טיפולית שגובשה בהתאם למיפוי שבוצע ובהתאם לצרכי האוכלוסייה הזקוקה להתערבות (תלמידים, הורים ומורים):','סיוע בהכוונה והדרכת מורים בהתערבות חינוכית ברמת הכיתה וברמת הפרט.','השתתפות בצוות החינוכי -טיפולי בסוף היום לקבלת תמונת מצב בעקבות ההתערבויות שבוצעו במהלך היום ולצורך תכנון התערבויות להמשך.',

 {k:'social', t:'רכז/ת חברתי', L:PAIR, d:[

/* ===== התאמת שמות =====
   שם בתיק: "לירון כצנלסון", "דורית ס", "אמיל", "אחראי יעקב או ממונה מטעמו", "רגב + סיגל".
   שם המורה: "כצנלסון לירון". כל מילה בחלק מהשם בתיק צריכה לפתוח מילה בשם המורה. */
const nTok = x => String(x || '').replace(/[.'"׳״()\-]/g, ' ').split(/\s+/).filter(Boolean);
const STOP = new Set(['או','ממונה','מטעמו','מטעמה','מ"מ','ממ','ו','גם','צוות','כל','המורים','מורה','מורים','התורן','תורן','אחר','עם','של']);
function parts(raw){
  return String(raw || '').split(/[,+/;|\n]|\s+או\s+|\s+ו(?=[א-ת]{2,}\s|$)/).map(s => s.trim()).filter(Boolean);
}
/* 0 = לא, 1 = התאמה חלקית (רק שם פרטי / אות), 2 = שם מלא */
function matchLevel(name, raw){
  const a = nTok(name); if(!a.length) return 0;
  let best = 0;
  for(const p of parts(raw)){
    const b = nTok(p).filter(t => !STOP.has(t)); if(!b.length) continue;
    if(!b.every(t => a.some(w => w.startsWith(t)))) continue;
    const full = b.filter(t => t.length > 1 && a.includes(t)).length >= Math.min(2, a.length);
    best = Math.max(best, full ? 2 : 1);
    if(best === 2) break;
  }
  return best;
}

/* ---- 👥 כל המורים ---- */
function drawAll(){
  const st = staff(), cnt = st.map(n => ({n, c:mine(n).filter(x => x.lvl === 2).length, w:mine(n).filter(x => x.lvl === 1).length}));
  const named = ITEMS.filter(x => x.who.trim());
  const orphan = [...new Set(named.flatMap(x => parts(x.who)).filter(p => nTok(p).filter(t => !STOP.has(t)).length && !st.some(n => matchLevel(n, p))))].sort(byHe);
  const sorted = cnt.sort((a, b) => (b.c + b.w) - (a.c + a.w) || byHe(a.n, b.n));
  const zero = sorted.filter(x => !x.c && !x.w).length;
  $('app').innerHTML = `<div class="box"><h2 style="margin:0 0 4px;font-size:19px">👥 ${st.length} מורים · ${st.length - zero} עם תפקיד · ${zero} בלי</h2>
      <p class="muted" style="margin:0 0 10px;font-size:13.5px">המספר = כמה תפקידים לכל מורה בכל התיקים (בכחול — כולל התאמה לפי שם פרטי בלבד). לחיצה = כל התפקידים שלו.</p>
      <div class="tlist">${sorted.map(x => `<button data-n="${esc(x.n)}" class="${!x.c && !x.w ? 'z' : x.w ? 'h' : ''}"><span>${esc(x.n)}</span><b>${x.c + x.w}</b></button>`).join('')}</div></div>
    ${orphan.length ? `<div class="box"><h2 style="margin:0 0 4px;font-size:18px">❓ שמות בתיקים שלא נמצאו ברשימת המורים (${orphan.length})</h2>
      <p class="muted" style="margin:0 0 8px;font-size:13.5px">כדאי לכתוב בתיק שם מלא כמו ברשימת המורים, כדי שהמורה ימצא את התפקיד שלו.</p>
      <div class="tlist">${orphan.map(p => `<button data-n="${esc(p)}"><span>${esc(p)}</span><b>${named.filter(x => parts(x.who).includes(p)).length}</b></button>`).join('')}</div></div>` : ''}`;
  $('app').querySelectorAll('[data-n]').forEach(b => b.onclick = () => { NAME = b.dataset.n; ls.set('em_name', NAME); TAB = 'me'; draw(); scrollTo(0, 0); });
}

build(); draw();
if(DATA) refresh();
</script>
</body>
</html>
