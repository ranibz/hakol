    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --primary: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --purple: #8b5cf6;
            --cyan: #06b6d4;
        }
        * { box-sizing: border-box; font-family: 'Rubik', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: #f1f5f9; min-height: 100vh; }
        
        .header {
            background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #047857;
        }
        .header h1 { font-size: 1.5rem; font-weight: 900; margin-bottom: 3px; }
        .header p { opacity: 0.85; font-size: 0.9rem; }
        .version { position: absolute; top: 15px; left: 15px; font-size: 0.75rem; opacity: 0.4; }
        
        .container { padding: 20px 15px; max-width: 800px; margin: 0 auto; }
        
        /* סטטיסטיקות */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }
        .stat-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px 12px;
            text-align: center;
        }
        .stat-box .num { font-size: 2rem; font-weight: 900; }
        .stat-box .label { font-size: 0.75rem; opacity: 0.6; margin-top: 5px; }
        
        /* טאבים */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 14px;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 12px;
            color: #f1f5f9;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .tab-btn.active { border-color: var(--success); background: rgba(16, 185, 129, 0.15); }
        .tab-btn .badge {
            background: var(--danger);
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.8rem;
        }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* כרטיס שחרור */
        .release-card {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 16px;
            margin-bottom: 15px;
            overflow: hidden;
            transition: 0.2s;
        }
        .release-card.urgent { border-color: var(--warning); }
        
        .release-top {
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .release-info h3 { font-size: 1.2rem; margin-bottom: 6px; }
        .release-info .class { 
            display: inline-block;
            background: rgba(255,255,255,0.1);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }
        .release-info .reason {
            font-size: 0.9rem;
            opacity: 0.7;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .release-time {
            text-align: left;
            font-size: 0.85rem;
            opacity: 0.6;
        }
        .release-time .time { font-size: 1.1rem; font-weight: 700; opacity: 1; }
        
        .release-action {
            padding: 0 18px 18px;
        }
        .btn-release {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
        }
        .btn-release:hover { transform: scale(1.02); }
        .btn-release:active { transform: scale(0.98); }
        
        /* כרטיס אורח */
        .guest-card {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 16px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        .guest-card.pending { border-color: var(--warning); }
        .guest-card.inside { border-color: var(--cyan); }
        
        .guest-top {
            padding: 18px;
        }
        .guest-info h3 { font-size: 1.1rem; margin-bottom: 8px; }
        .guest-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.85rem;
            opacity: 0.7;
        }
        .guest-detail { display: flex; align-items: center; gap: 6px; }
        
        .guest-actions {
            padding: 0 18px 18px;
            display: flex;
            gap: 10px;
        }
        .btn-guest {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-enter { background: var(--success); color: white; }
        .btn-exit { background: var(--danger); color: white; }
        
        /* ריק */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            opacity: 0.5;
        }
        .empty-state .icon { font-size: 70px; margin-bottom: 15px; }
        .empty-state p { font-size: 1.1rem; }
        
        /* טוסט */
        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            padding: 14px 28px; border-radius: 12px;
            color: white; font-weight: 700;
            z-index: 999; opacity: 0; transition: 0.3s;
        }
        .toast.show { opacity: 1; }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        
        /* רענון */
        .refresh-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            background: var(--primary);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .refresh-btn:active { transform: scale(0.95); }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        .refresh-btn.loading .material-icons-round { animation: spin 1s linear infinite; }
        
        /* מסך מפוצל */
        .split-view {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        @media (max-width: 768px) {
            .split-view { grid-template-columns: 1fr; }
        }
        .split-panel {
            background: var(--card);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .panel-header {
            padding: 14px 18px;
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .panel-header .badge {
            background: rgba(255,255,255,0.25);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
        }
        .panel-body {
            padding: 15px;
            max-height: 60vh;
            overflow-y: auto;
        }
        
        /* שם אורח בודד */
        .guest-name-item {
            background: var(--bg);
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }
        .guest-name-item:hover { background: #334155; }
        .guest-name-item.pending { border-right: 4px solid var(--warning); }
        .guest-name-item.inside { border-right: 4px solid var(--cyan); }
        .guest-name-item h4 { font-size: 1rem; margin: 0; }
        .guest-name-item .status { font-size: 0.75rem; opacity: 0.7; }
        .guest-name-item .arrow { transition: 0.2s; }
        .guest-name-item.open .arrow { transform: rotate(180deg); }
        
        /* פרטי אורח מורחבים */
        .guest-details-expanded {
            background: var(--bg);
            border-radius: 10px;
            padding: 15px;
            margin-top: -3px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            display: none;
        }
        .guest-details-expanded.show { display: block; }
        .guest-detail-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 0.85rem;
            opacity: 0.8;
        }
        .guest-actions-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
        .guest-actions-row button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-enter { background: var(--success); color: white; }
        .btn-exit { background: var(--danger); color: white; }
    </style>

<script>
const SURL = 'https://skfriefqnoxfzmamcokd.supabase.co';
const SKEY = 'sb_publishable_Qx7EDPbdyYE9iv7uMQBKhQ_Aeojd_Q0';

let allStudents = {};

async function api(path, opts = {}) {
    const r = await fetch(`${SURL}/rest/v1/${path}`, {
        method: opts.method || 'GET',
        body: opts.body,
        headers: { 
            'apikey': SKEY, 
            'Authorization': 'Bearer ' + SKEY, 
            'Content-Type': 'application/json',
            'Prefer': opts.prefer || ''
        }
    });
    if (!r.ok) throw new Error(await r.text());
    const t = await r.text();
    return t ? JSON.parse(t) : null;
}

function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelector(`[onclick="switchTab('${tab}')"]`).classList.add('active');
    document.getElementById('tab-' + tab).classList.add('active');
}

async function loadData() {
    try {
        // טעינת תלמידים
        if (Object.keys(allStudents).length === 0) {
            const students = await api('students?order=name');
            (students || []).forEach(s => { allStudents[s.id] = s; });
        }
        
        const today = new Date().toISOString().split('T')[0];
        
        // שחרורים
        const releases = await api(`student_releases?released_at=gte.${today}T00:00:00&order=released_at.desc`);
        const pending = (releases || []).filter(r => r.status === 'pending');
        const released = (releases || []).filter(r => r.status === 'released');
        
        document.getElementById('statPending').textContent = pending.length;
        document.getElementById('statReleased').textContent = released.length;
        document.getElementById('badgeReleases').textContent = pending.length;
        
        renderReleases(pending);
        
        // אורחים
        const guests = await api(`guests?order=id.desc`);
        const guestsPending = (guests || []).filter(g => g.status === 'pending');
        const guestsInside = (guests || []).filter(g => g.status === 'inside');
        
        document.getElementById('statGuests').textContent = guestsInside.length;
        document.getElementById('badgeGuests').textContent = guestsPending.length + guestsInside.length;
        
        renderGuests(guestsPending, guestsInside);
        
    } catch (e) { 
        console.error(e);
        toast('שגיאה בטעינה', 'error');
    }
}

function renderReleases(pending) {
    const list = document.getElementById('releasesList');
    
    if (pending.length === 0) {
        list.innerHTML = '<div class="empty-state"><div class="icon">✅</div><p>אין בקשות שחרור ממתינות</p></div>';
        return;
    }
    
    list.innerHTML = pending.map(r => {
        const student = allStudents[r.student_id] || { name: 'לא ידוע', class: '' };
        const time = new Date(r.released_at).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
        const reasonIcon = r.release_reason === 'רפואי' ? '🏥' : r.release_reason === 'אישי' ? '👤' : '👨‍👩‍👧';
        // v8 - escape של גרשיים בשם התלמיד כדי שלא ישבור את ה-onclick
        const safeName = (student.name || '').replace(/'/g, "\\'");
        
        return `
            <div class="release-card">
                <div class="release-top">
                    <div class="release-info">
                        <h3>${student.name}</h3>
                        <span class="class">${student.class || ''}</span>
                        <div class="reason">${reasonIcon} ${r.release_reason}</div>
                    </div>
                    <div class="release-time">
                        <div class="time">${time}</div>
                        <div>בקשה נשלחה</div>
                    </div>
                </div>
                <div class="release-action">
                    <button class="btn-release" onclick="completeRelease('${r.id}', '${safeName}')">
                        <span class="material-icons-round">check_circle</span>
                        אשר יציאה
                    </button>
                </div>
            </div>
        `;
    }).join('');
}

function renderGuests(pending, inside) {
    const list = document.getElementById('guestsList');
    
    if (pending.length === 0 && inside.length === 0) {
        list.innerHTML = '<div class="empty-state" style="padding:30px;"><div class="icon" style="font-size:40px;">🛂</div><p style="font-size:0.9rem;">אין אורחים</p></div>';
        return;
    }
    
    let html = '';
    
    // אורחים ממתינים
    pending.forEach((g, i) => {
        const guestName = g.guest_name || g.name || 'לא ידוע';
        html += `
            <div class="guest-name-item pending" onclick="toggleGuest('pending-${i}')">
                <div>
                    <h4>⏳ ${guestName}</h4>
                    <span class="status">ממתין לכניסה</span>
                </div>
                <span class="material-icons-round arrow">expand_more</span>
            </div>
            <div class="guest-details-expanded" id="pending-${i}">
                <div class="guest-detail-row"><span>📞 טלפון:</span><span>${g.phone || '-'}</span></div>
                <div class="guest-detail-row"><span>🎯 מטרה:</span><span>${g.purpose || '-'}</span></div>
                <div class="guest-detail-row"><span>👤 מארח:</span><span>${g.host_name || '-'}</span></div>
                ${g.is_armed ? `<div class="guest-detail-row"><span>🔫 נשק:</span><span>רשיון ${g.weapon_license || '-'}</span></div>` : ''}
                <div class="guest-actions-row">
                    <button class="btn-enter" onclick="guestEnter('${g.id}', '${guestName.replace(/'/g, "\\'")}')">
                        <span class="material-icons-round">login</span> כניסה
                    </button>
                </div>
            </div>
        `;
    });
    
    // אורחים בפנים
    inside.forEach((g, i) => {
        const guestName = g.guest_name || g.name || 'לא ידוע';
        const enterTime = new Date(g.entered_at).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
        html += `
            <div class="guest-name-item inside" onclick="toggleGuest('inside-${i}')">
                <div>
                    <h4>🏢 ${guestName}</h4>
                    <span class="status">בפנים מ-${enterTime}</span>
                </div>
                <span class="material-icons-round arrow">expand_more</span>
            </div>
            <div class="guest-details-expanded" id="inside-${i}">
                <div class="guest-detail-row"><span>⏰ נכנס:</span><span>${enterTime}</span></div>
                <div class="guest-detail-row"><span>🎯 מטרה:</span><span>${g.purpose || '-'}</span></div>
                <div class="guest-detail-row"><span>👤 מארח:</span><span>${g.host_name || '-'}</span></div>
                ${g.is_armed ? `<div class="guest-detail-row"><span>🔫 נשק:</span><span>רשיון ${g.weapon_license || '-'}</span></div>` : ''}
                <div class="guest-actions-row">
                    <button class="btn-exit" onclick="guestExit('${g.id}', '${guestName.replace(/'/g, "\\'")}')">
                        <span class="material-icons-round">logout</span> יציאה
                    </button>
                </div>
            </div>
        `;
    });
    
    list.innerHTML = html;
}

function toggleGuest(id) {
    const details = document.getElementById(id);
    const item = details.previousElementSibling;
    details.classList.toggle('show');
    item.classList.toggle('open');
}

/* ========== v13 — סריקת כרטיס תלמיד בשער ========== */
let gsScanner = null, gsLast = '', gsLastAt = 0, gsTimer = null, gsBusy = false;
function gsToken(text){
    text = String(text || '').trim();
    if (text.startsWith('GMCARD:')) return text.slice(7);
    try { return new URL(text).searchParams.get('scan'); } catch (e) { return null; }
}
async function gsRpc(fn, body) {
    const r = await fetch(SURL + '/rest/v1/rpc/' + fn, { method: 'POST',
        headers: { 'apikey': SKEY, 'Authorization': 'Bearer ' + SKEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const t = await r.text();
    if (!r.ok) throw new Error(t);
    return t ? JSON.parse(t) : null;
}
const gsEsc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gsHM = d => new Date(d).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
function gsShow(cls, html, ms) {
    const el = document.getElementById('gsResult');
    el.className = 'gs-res ' + cls; el.innerHTML = html;
    clearTimeout(gsTimer);
    if (ms) gsTimer = setTimeout(() => gsShow('idle', '<div class="gs-big">מכוונים את המצלמה ל-QR שבכרטיס</div>'), ms);
}
function gsBuzz(ok) {
    try { navigator.vibrate && navigator.vibrate(ok ? 120 : [90, 70, 90, 70, 90]); } catch (e) {}
    try { const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain();
        o.frequency.value = ok ? 880 : 220; o.type = ok ? 'sine' : 'square'; g.gain.value = .15;
        o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + (ok ? .18 : .5)); } catch (e) {}
}
async function gsOpen() {
    document.getElementById('gsOverlay').hidden = false;
    gsShow('idle', '<div class="gs-big">מכוונים את המצלמה ל-QR שבכרטיס</div>');
    if (typeof Html5Qrcode === 'undefined') { gsShow('no', '<div class="gs-big">רכיב הסריקה לא נטען</div><div class="gs-sub">בדקו אינטרנט ורעננו את הדף.</div>'); return; }
    try {
        gsScanner = new Html5Qrcode('gsReader');
        await gsScanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 230, height: 230 } }, text => {
            const now = Date.now();
            if (gsBusy || (text === gsLast && now - gsLastAt < 4000)) return;
            gsLast = text; gsLastAt = now; gsCheck(text);
        });
    } catch (e) { gsShow('no', '<div class="gs-big">אין גישה למצלמה</div><div class="gs-sub">' + gsEsc(e) + '</div>'); }
}
async function gsClose() {
    if (gsScanner) { try { await gsScanner.stop(); } catch (e) {} gsScanner = null; }
    document.getElementById('gsReader').innerHTML = '';
    document.getElementById('gsOverlay').hidden = true;
    if (typeof loadGateScreen === 'function') loadGateScreen(); else if (typeof loadData === 'function') loadData();
}
async function gsCheck(text) {
    /* v14 / v10 — סורק אחד לשער: יציאה וכניסה באיחור.
       1. יש היום בקשת שחרור ממתינה  → 🟢 יציאה (status='released', כמו "אשר יציאה").
       2. כבר יצא היום                → 🟠 "האישור כבר נוצל" + כפתור "↩ חזר לבית הספר".
       3. לא סומן נוכח היום (חסר / אין רישום) → 🔵 כניסה: register_late — כמו קליטת המאחרים
          (late_arrivals + daily_attendance=present), והמחנך רואה "נכנס בשער" עם השעה.
       4. נוכח בבית הספר, בלי אישור   → 🔴 "אין אישור יציאה". */
    const tok = gsToken(text);
    if (!tok) { gsBuzz(false); gsShow('no', '<div class="gs-big">⛔ זה לא כרטיס תלמיד</div>', 4000); return; }
    gsBusy = true;
    gsShow('wait', '<div class="gs-big">בודק…</div>');
    try {
        const rows = await gsRpc('gate_card', { p_token: tok });
        const st = (rows || [])[0];
        if (!st) { gsBuzz(false); gsShow('no', '<div class="gs-big">⛔ כרטיס לא מזוהה</div><div class="gs-sub">ייתכן שהכרטיס הוחלף. לבדוק עם המזכירות.</div>', 6000); return; }
        const today = gsToday();
        const sid = encodeURIComponent(st.student_id);
        const [rel, att, late] = await Promise.all([
            api(`student_releases?student_id=eq.${sid}&released_at=gte.${today}T00:00:00&order=released_at.desc`),
            api(`daily_attendance?select=status&student_id=eq.${sid}`).catch(() => []),
            api(`late_arrivals?select=arrived_at&student_id=eq.${sid}&arrival_date=eq.${today}&order=arrived_at.desc`).catch(() => [])
        ]);
        const pend = (rel || []).find(r => r.status === 'pending'), done = (rel || []).find(r => r.status === 'released');
        const a = ((att || [])[0] || {}).status || '', lateAt = ((late || [])[0] || {}).arrived_at;
        const who = `<div class="gs-name">${gsEsc(st.name)}</div><div class="gs-sub">כיתה ${gsEsc(st.class || '')}</div>`;
        if (pend) {
            await api(`student_releases?id=eq.${pend.id}`, { method: 'PATCH',
                body: JSON.stringify({ status: 'released', ...(typeof currentDeviceName !== 'undefined' ? { released_by_device: currentDeviceName } : {}) }) });
            if (typeof logActivity === 'function') logActivity('release_complete', `שוחרר (סריקת כרטיס): ${st.name}`).catch(() => {});
            gsBuzz(true);
            gsShow('ok', `<div class="gs-big">🚪 מאושר לצאת</div>${who}
                <div class="gs-sub">סיבה: ${gsEsc(pend.release_reason || '—')} · אושר ב-${gsHM(pend.released_at)}${pend.released_by ? ' · ' + gsEsc(pend.released_by) : ''}</div>
                <div class="gs-sub">סומן "שוחרר" ✓</div>
                <button onclick="gsUndo('${pend.id}', this)">↶ ביטול — התלמיד לא יצא</button>`, 9000);
        } else if (done && !(lateAt && Date.parse(lateAt) > Date.parse(done.updated_at || done.released_at))) {
            gsBuzz(false);
            gsShow('used', `<div class="gs-big">⚠️ האישור כבר נוצל</div>${who}
                <div class="gs-sub">יצא היום ב-${gsHM(done.updated_at || done.released_at)} · סיבה: ${gsEsc(done.release_reason || '—')}</div>
                <div class="gs-sub">יוצא שוב? רק באישור חדש מהמחנך או מהמזכירות.</div>
                <button onclick="gsEnter('${gsEsc(tok)}', this)">↩ חזר לבית הספר — רישום כניסה</button>`, 12000);
        } else if (a === 'present' || lateAt) {
            gsBuzz(false);
            gsShow('no', `<div class="gs-big">⛔ אין אישור יציאה</div>${who}
                <div class="gs-sub">התלמיד בבית הספר${lateAt ? ' (נכנס היום ב-' + gsHM(lateAt) + ')' : ''}, ואין לו היום בקשת שחרור.</div>`, 7000);
        } else {
            await gsEnter(tok, null, st);
        }
    } catch (e) {
        gsBuzz(false);
        gsShow('no', '<div class="gs-big">שגיאת חיבור</div><div class="gs-sub">' + gsEsc(String(e.message || e).slice(0, 120)) + '</div>', 6000);
    } finally { gsBusy = false; }
}
const gsToday = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Jerusalem' }).format(new Date());
/* כניסה באיחור — אותה פונקציה של קליטת המאחרים (register_late), עם קוד השומר */
const GS_PIN = 'gm_guard_pin';
async function gsEnter(tok, btn, st) {
    let pin = ''; try { pin = localStorage.getItem(GS_PIN) || ''; } catch (e) {}
    try { pin = JSON.parse(pin); } catch (e) {}
    if (!pin) {
        gsShow('wait', `<div class="gs-big">🔑 קוד שומר</div><div class="gs-sub">פעם אחת במחשב הזה — לרישום מאחרים.</div>
            <input id="gsPin" type="password" inputmode="numeric" style="font:inherit;font-size:1.3rem;padding:8px;border-radius:10px;border:0;margin-top:8px;width:180px;text-align:center">
            <button onclick="gsSavePin('${gsEsc(tok)}')">שמירה והמשך</button>`);
        clearTimeout(gsTimer);
        setTimeout(() => { const i = document.getElementById('gsPin'); if (i) i.focus(); }, 50);
        return;
    }
    if (btn) btn.disabled = true;
    let r;
    try { r = await gsRpc('register_late', { p_pin: pin, p_device: (typeof currentDeviceName !== 'undefined' ? currentDeviceName : 'gate-guard'), p_token: tok }); }
    catch (e) { gsBuzz(false); gsShow('no', '<div class="gs-big">אין חיבור</div><div class="gs-sub">הכניסה לא נרשמה — נסו שוב</div>', 6000); return; }
    if (r && r.error === 'bad_pin') { try { localStorage.removeItem(GS_PIN); } catch (e) {} gsBuzz(false);
        gsShow('no', '<div class="gs-big">קוד השומר שגוי או הוחלף</div><div class="gs-sub">סרקו שוב והקלידו את הקוד.</div>', 6000); return; }
    if (!r || !r.ok) { gsBuzz(false); gsShow('no', '<div class="gs-big">⛔ כרטיס לא תקף</div><div class="gs-sub">הפנו את התלמיד למזכירות</div>', 6000); return; }
    gsBuzz(true);
    gsShow('in', `<div class="gs-big">🏫 נכנס — נרשם${r.duplicate ? '' : ' באיחור'}</div>
        <div class="gs-name">${gsEsc(r.name || (st && st.name) || '')}</div><div class="gs-sub">כיתה ${gsEsc(r.class || (st && st.class) || '')}</div>
        <div class="gs-sub">${r.duplicate ? 'כבר נרשם היום ב-' : 'שעת כניסה '}${gsHM(r.arrived_at)} · המחנך רואה "נכנס בשער"</div>`, 7000);
}
async function gsSavePin(tok) {
    const v = (document.getElementById('gsPin') || {}).value || '';
    if (!v.trim()) return;
    try { if (!(await gsRpc('check_guard_pin', { p_pin: v.trim() }))) { gsShow('no', '<div class="gs-big">קוד שגוי</div>', 4000); return; } }
    catch (e) { gsShow('no', '<div class="gs-big">אין חיבור</div>', 4000); return; }
    try { localStorage.setItem(GS_PIN, JSON.stringify(v.trim())); } catch (e) {}
    gsEnter(tok);
}
async function gsUndo(id, btn) {
    try {
        btn.disabled = true;
        await api(`student_releases?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify({ status: 'pending' }) });
        gsShow('wait', '<div class="gs-big">↶ בוטל</div><div class="gs-sub">הבקשה חזרה לממתינה.</div>', 3000);
    } catch (e) { btn.disabled = false; toast('שגיאה בביטול', 'error'); }
}

async function completeRelease(id, name) {
    try {
        await api(`student_releases?id=eq.${id}`, {
            method: 'PATCH',
            body: JSON.stringify({ status: 'released' })
        });
        toast(`${name} שוחרר/ה!`, 'success');
        loadData();
    } catch (e) { toast('שגיאה', 'error'); }
}

async function guestEnter(id, name) {
    try {
        await api(`guests?id=eq.${id}`, {
            method: 'PATCH',
            body: JSON.stringify({ status: 'inside', entered_at: new Date().toISOString() })
        });
        toast(`${name} נכנס/ה!`, 'success');
        loadData();
    } catch (e) { toast('שגיאה', 'error'); }
}

async function guestExit(id, name) {
    try {
        await api(`guests?id=eq.${id}`, {
            method: 'PATCH',
            body: JSON.stringify({ status: 'exited', exited_at: new Date().toISOString() })
        });
        toast(`${name} יצא/ה!`, 'success');
        loadData();
    } catch (e) { toast('שגיאה', 'error'); }
}

function refresh() {
    const btn = document.querySelector('.refresh-btn');
    btn.classList.add('loading');
    loadData().finally(() => {
        setTimeout(() => btn.classList.remove('loading'), 500);
    });
}

function toast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + (type || '');
    setTimeout(() => t.className = 'toast', 3000);
}

// Realtime subscription לעדכונים מיידיים
function setupRealtime() {
    // שחרורים
    const releasesChannel = new WebSocket(`wss://skfriefqnoxfzmamcokd.supabase.co/realtime/v1/websocket?apikey=${SKEY}&vsn=1.0.0`);
    
    releasesChannel.onopen = () => {
        releasesChannel.send(JSON.stringify({
            topic: 'realtime:public:student_releases',
            event: 'phx_join',
            payload: { config: { broadcast: { self: true }, presence: { key: '' } } },
            ref: '1'
        }));
        
        releasesChannel.send(JSON.stringify({
            topic: 'realtime:public:guests',
            event: 'phx_join',
            payload: { config: { broadcast: { self: true }, presence: { key: '' } } },
            ref: '2'
        }));
    };
    
    releasesChannel.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.event === 'INSERT' || data.event === 'UPDATE' || data.event === 'DELETE' ||
            data.event === 'postgres_changes') {
            console.log('Realtime update:', data);
            loadData();
        }
    };
    
    releasesChannel.onerror = (e) => console.error('Realtime error:', e);
    releasesChannel.onclose = () => {
        console.log('Realtime closed, reconnecting...');
        setTimeout(setupRealtime, 3000);
    };
}

// רענון אוטומטי כל 5 שניות
setInterval(loadData, 5000);

// טעינה ראשונית
loadData();
