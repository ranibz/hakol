     נפתח מתחת לתיבה עם שתי אפשרויות — "מערכת הזירות · שליחת מטלה" (כמו קודם) ו"בדיקת נוכחות"

     v2.0.0 · 2026-08-09 · המבנה שונה מרשת כרטיסים שטוחה לתפריט אקורדיון.

     כל לוגיקת ההתחברות (lms_teachers / lms_classes בפרויקט matalot) לא נגעה — אותן

<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מגמת תקשורת - תפריט ראשי</title>

    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --text-main: #2c3e50;
            --card-bg: rgba(255, 255, 255, 0.95);
            --c1: #0984e3; /* כחול - תיק דיגיטלי */
            --c2: #6c5ce7; /* סגול - עבודת גמר / פרוייקט למ"ד */
            --c4: #00b894; /* ירוק - בדיקת נוכחות */
            --c5: #e84393; /* ורוד פוקסיה - אגרון מושגים */
            --c6: #d35400; /* כתום כהה - זירות הלימוד / תקשורת וחברה */
            --c7: #e74c3c; /* אדום - וידאוקאסט */
            --c8: #00cec9; /* טורקיז - הפקות */
            --c9: #2d3436; /* אפור כהה - כניסת מורה */
            --c10: #0abde3; /* תכלת - כניסת תלמידים (לא בשימוש מאז v3.0.0) */
            --c11: #7040d8; /* סגול RanLMS - מערכת הלמידה */
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 45px 0 70px;
            min-height: 100vh;
            font-family: 'Rubik', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-main);
        }

        /* ===== כותרת ===== */
        .header {
            text-align: center;
            margin-bottom: 38px;
            animation: fadeInDown 0.8s ease-out;
        }
        .header h1 {
            font-size: 3.5rem;
            font-weight: 900;
            margin: 0;
            background: linear-gradient(to right, #2c3e50, #0984e3);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }
        .header p {
            font-size: 1.3rem;
            color: #555;
            margin-top: 5px;
            font-weight: 500;
        }

        /* ===== מעטפת ראשית ===== */
        .wrap {
            width: 90%;
            max-width: 900px;
            animation: fadeInUp 0.8s ease-out;
        }

        /* ===== תיבת הכניסה למערכת הלמידה =====
           תיבה אחת ברוחב מלא במקום שתיים. הצבע הסגול הוא זהות RanLMS,
           ולא אחד מצבעי הפורטל, כדי שיהיה ברור שהקישור יוצא מהעמוד. */
        .lms-card {
            display: flex;
            align-items: center;
            gap: 18px;
            background: var(--card-bg);
            border-radius: 18px;
            border-top: 6px solid var(--c11);
            padding: 28px 26px;
            margin-bottom: 30px;
            text-decoration: none;
            color: var(--text-main);
            box-shadow: 0 10px 22px rgba(0,0,0,0.07);
            transition: transform .25s cubic-bezier(.25,.8,.25,1), box-shadow .25s ease;
        }
        .lms-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 34px rgba(112,64,216,0.20);
        }
        .lms-card > i {
            font-size: 2.8rem;
            color: var(--c11);
            flex-shrink: 0;
            transition: transform .3s ease;
        }
        .lms-card:hover > i { transform: scale(1.1) rotate(-5deg); }
        .lms-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .lms-title { font-size: 1.45rem; font-weight: 700; line-height: 1.25; }
        .lms-sub   { font-size: .97rem; color: #6b7a88; font-weight: 500; }
        .lms-badge {
            display: inline-block; width: fit-content; margin-top: 8px;
            font-size: .74rem; font-weight: 500; color: #fff;
            background: var(--c11);
            border-radius: 20px; padding: 4px 12px; letter-spacing: .2px;
        }
        .lms-go { margin-inline-start: auto; flex-shrink: 0; color: var(--c11);
                  font-size: 1.5rem; }
        @media (max-width: 560px) {
            .lms-card { padding: 22px 18px; gap: 13px; }
            .lms-title { font-size: 1.2rem; }
            .lms-go { display: none; }
        }

        /* ===== אקורדיון ===== */
        .acc-item {
            background: var(--card-bg);
            border-radius: 18px;
            margin-bottom: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            overflow: hidden;
            border-right: 6px solid var(--acc, #ccc);
        }
        .acc-head {
            width: 100%;
            background: none;
            border: none;
            font-family: 'Rubik', sans-serif;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 24px 26px;
            cursor: pointer;
            text-align: right;
            transition: background .2s ease;
        }
        .acc-head:hover { background: rgba(0,0,0,.025); }
        .acc-head:focus-visible { outline: 3px solid var(--acc); outline-offset: -3px; }
        .acc-head > i.acc-ico {
            font-size: 1.9rem;
            color: var(--acc);
            flex-shrink: 0;
            width: 38px;
            text-align: center;
        }
        .acc-title { font-size: 1.5rem; font-weight: 700; flex: 1; }
        .acc-count {
            font-size: .8rem; font-weight: 500; color: #fff; background: var(--acc);
            border-radius: 20px; padding: 3px 11px; opacity: .85;
        }
        .acc-chev {
            font-size: 1.05rem; color: #9aa7b3;
            transition: transform .3s ease;
            flex-shrink: 0;
        }
        .acc-item.open .acc-chev { transform: rotate(180deg); }

        .acc-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height .38s cubic-bezier(.4,0,.2,1);
        }
        .acc-inner {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 14px;
            padding: 4px 26px 26px;
        }

        /* כרטיס בתוך אקורדיון */
        .sub-card {
            background: #fff;
            border: 2px solid #eef1f5;
            border-radius: 14px;
            padding: 18px 16px;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 14px;
            transition: border-color .22s ease, transform .22s ease, box-shadow .22s ease;
        }
        .sub-card:hover {
            border-color: var(--sc);
            transform: translateY(-4px);
            box-shadow: 0 10px 22px rgba(0,0,0,.09);
        }
        .sub-card > i {
            font-size: 1.85rem;
            color: var(--sc);
            flex-shrink: 0;
            width: 34px;
            text-align: center;
        }
        .sub-card span { font-size: 1.05rem; font-weight: 500; line-height: 1.35; }

        /* ===== חלונות הכניסה ===== */

        /* ===== תג גרסה ===== */
        .ver {
            position: fixed; bottom: 12px; left: 14px; z-index: 50;
            font-size: .72rem; font-weight: 500; color: #7c8b99;
            background: rgba(255,255,255,.8); border: 1px solid rgba(0,0,0,.06);
            border-radius: 20px; padding: 4px 12px; letter-spacing: .3px;
        }

        /* ===== אנימציות ===== */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }

        /* ===== מובייל ===== */
        @media (max-width: 768px) {
            body { padding: 30px 0 60px; }
            .header h1 { font-size: 2.4rem; }
            .header p  { font-size: 1.1rem; }
            .wrap { width: 92%; max-width: 460px; }
            .quick-row { grid-template-columns: 1fr; }
            .acc-head { padding: 20px 18px; gap: 12px; }
            .acc-title { font-size: 1.25rem; }
            .acc-count { display: none; }
            .acc-inner { padding: 4px 18px 20px; grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>מגמת תקשורת</h1>
        <p>פורטל יישומים ולמידה</p>
    </div>

    <div class="wrap">

        <!-- ===== מערכת הלמידה — תיבה אחת ברוחב מלא ===== -->
        <a href="https://lms.ranibz.co.il/" class="lms-card" target="_blank" rel="noopener">
            <i class="fa-solid fa-graduation-cap"></i>
            <div class="lms-text">
                <span class="lms-title">מערכת למידה · תקשורת וחברה</span>
                <span class="lms-sub">RanLMS · מטלות, ציונים ונוכחות</span>
                <span class="lms-badge">כניסה למורים ולתלמידים</span>
            </div>
            <i class="fa-solid fa-arrow-left lms-go"></i>
        </a>

        <!-- ===== אקורדיון ===== -->
        <div class="accordion" id="acc">

            <!-- 1 · תקשורת וחברה -->
            <div class="acc-item" style="--acc: var(--c6)">
                <button class="acc-head" onclick="toggleAcc(this)" aria-expanded="false">
                    <i class="fa-solid fa-tower-broadcast acc-ico"></i>
                    <span class="acc-title">תקשורת וחברה</span>
                    <span class="acc-count">2</span>
                    <i class="fa-solid fa-chevron-down acc-chev"></i>
                </button>
                <div class="acc-body">
                    <div class="acc-inner">
                        <a href="https://hakolbakaf.co.il/zirot/index.html" class="sub-card" style="--sc: var(--c6)">
                            <i class="fa-solid fa-cubes"></i>
                            <span>זירות הלימוד</span>
                        </a>
                        <a href="https://hakolbakaf.co.il/agron/index.html" class="sub-card" style="--sc: var(--c5)">
                            <i class="fa-solid fa-book-open"></i>
                            <span>אגרון המושגים</span>
                        </a>
                    </div>
                </div>
            </div>

            <!-- 2 · פרוייקט למ"ד -->
            <div class="acc-item" style="--acc: var(--c2)">
                <button class="acc-head" onclick="toggleAcc(this)" aria-expanded="false">
                    <i class="fa-solid fa-folder-open acc-ico"></i>
                    <span class="acc-title">פרוייקט למ"ד</span>
                    <span class="acc-count">2</span>
                    <i class="fa-solid fa-chevron-down acc-chev"></i>
                </button>
                <div class="acc-body">
                    <div class="acc-inner">
                        <a href="https://lamedproject.netlify.app/eshi/tik/superlamed/tiklamed-supabase.html" class="sub-card" style="--sc: var(--c1)">
                            <i class="fa-solid fa-laptop-file"></i>
                            <span>תיק דיגיטלי<br>פרוייקט למ"ד</span>
                        </a>
                        <a href="https://lamedproject.netlify.app/eshi/tik/superlamed/gmarlamed-supabase.html" class="sub-card" style="--sc: var(--c2)">
                            <i class="fa-solid fa-graduation-cap"></i>
                            <span>תיק עבודת גמר<br>פרוייקט למ"ד</span>
                        </a>
                    </div>
                </div>
            </div>

            <!-- 3 · הפקות -->
            <div class="acc-item" style="--acc: var(--c8)">
                <button class="acc-head" onclick="toggleAcc(this)" aria-expanded="false">
                    <i class="fa-solid fa-clapperboard acc-ico"></i>
                    <span class="acc-title">הפקות</span>
                    <span class="acc-count">2</span>
                    <i class="fa-solid fa-chevron-down acc-chev"></i>
                </button>
                <div class="acc-body">
                    <div class="acc-inner">
                        <a href="https://hakolbakaf.netlify.app/kolnoa/hafakot/" class="sub-card" style="--sc: var(--c8)">
                            <i class="fa-solid fa-camera"></i>
                            <span>הפקות</span>
                        </a>
                        <!-- VIDEOCAST · אם הווידאוקאסט אינו שייך לקטגוריה הזו — מוחקים את בלוק ה-<a> הבא
                             ומעדכנים את acc-count מ-2 ל-1 בכותרת שמעל -->
                        <a href="https://lamedproject.netlify.app/eshi/tik/superlamed/videocast-index.html" class="sub-card" style="--sc: var(--c7)">
                            <i class="fa-solid fa-video"></i>
                            <span>תיק הפקה<br>וידאוקאסט</span>
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="ver">megama v3.0.0</div>

<script>
/* ===== אקורדיון =====
   פתיחה אחת בכל רגע. הגובה נקבע מ-scrollHeight ולא מ-max-height קבוע,
   כך שאפשר להוסיף כרטיסים לקטגוריה בלי לגעת ב-CSS. */
function toggleAcc(btn){
  const item = btn.closest('.acc-item');
  const wasOpen = item.classList.contains('open');
  document.querySelectorAll('.acc-item').forEach(it => {
    it.classList.remove('open');
    it.querySelector('.acc-head').setAttribute('aria-expanded','false');
    it.querySelector('.acc-body').style.maxHeight = null;
  });
  if(!wasOpen){
    item.classList.add('open');
    btn.setAttribute('aria-expanded','true');
    const body = item.querySelector('.acc-body');
    body.style.maxHeight = body.scrollHeight + 'px';
  }
}
/* ברירת המחדל — כל הקטגוריות סגורות */
/* שינוי רוחב משנה את גובה הרשת — מרעננים את הגובה של הפתוח */
window.addEventListener('resize', () => {
  const open = document.querySelector('.acc-item.open .acc-body');
  if(open){ open.style.maxHeight = 'none'; const h = open.scrollHeight; open.style.maxHeight = h + 'px'; }
});

/* מאז v3.0.0 אין בעמוד הזה גישה למסד ואין הזדהות. הכניסה למערכת
   הלמידה נעשית ב-lms.ranibz.co.il, וכל מה שנשאר כאן הוא ניווט. */
</script>

</body>
</html>
