<!DOCTYPE html>
<!-- zirot/tirgool/bagrut-run.html · v1.1.0 · 2026-07-27 · נוסף paste-guard.js — חסימת הדבקת טקסט מבחוץ לשדות הכתיבה, עם היתר לציטוט מהקטע שבדף ולעריכה בתוך התשובה (MINOR) · נגן גנרי למבחנים שנוצרו ב-bagrut-builder. טוען את מפרט המבחן מ-bagrut_exams לפי ?exam=, ומריץ אותו באותו מנוע של סימולציית הבגרות: אכיפת כללי בחירה, טיימר ששורד רענון, שמירה מקומית והגשה ל-lms_submissions (MAJOR) -->
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מבחן בתקשורת וחברה</title>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--a:#1e40af;--b:#b45309;--ink:#1f2340;--soft:#666e8a;--bg:#f5f6fb;--line:#e4e5f0;
  --ok:#12b76a;--no:#e11d48;--warn:#c98a12;--paper:#fff;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Assistant',sans-serif;font-size:17px;line-height:1.7;padding:0 0 96px}
h1,h2,h3,.disp{font-family:'Secular One',sans-serif;font-weight:400}
.wrap{max-width:900px;margin:0 auto;padding:0 15px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px 24px;margin-bottom:16px}
.btn{background:var(--a);color:#fff;border:0;border-radius:11px;padding:11px 22px;font-family:inherit;
  font-weight:800;font-size:.95rem;cursor:pointer}
.btn:hover{background:#16327f}
.btn.g{background:#f1f2f8;color:var(--ink)}
.btn.ok{background:var(--ok)} .btn.no{background:var(--no)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font-family:inherit;font-size:1rem;border:1px solid #d5d7e4;border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:150px;line-height:1.8;resize:vertical}
textarea:focus{outline:2px solid var(--a);border-color:transparent}
/* סרגל עליון */
.top{position:sticky;top:0;z-index:40;background:#fff;border-bottom:2px solid var(--line);padding:9px 0}
.topin{max-width:900px;margin:0 auto;padding:0 15px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.clock{font-family:'Secular One',sans-serif;font-size:1.3rem;background:#eef1fb;color:var(--a);
  border-radius:11px;padding:4px 15px;letter-spacing:1px}
.clock.warn{background:#fdf3e2;color:#8a5a08} .clock.crit{background:#fdecea;color:#9f1239}
.who{font-weight:800;font-size:.9rem} .who span{color:var(--soft);font-weight:600}
.saved{font-size:.78rem;color:var(--soft);font-weight:700;margin-inline-start:auto}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}
.tab{background:#fff;border:2px solid var(--line);border-radius:20px;padding:7px 15px;font-weight:800;
  font-size:.86rem;cursor:pointer;color:var(--soft)}
.tab.on{background:var(--a);color:#fff;border-color:var(--a)}
.tab .c{font-size:.76rem;opacity:.9}
.tab.full{border-color:var(--ok);color:var(--ok)} .tab.full.on{background:var(--ok);border-color:var(--ok);color:#fff}
/* שאלות */
.qc{background:#fff;border:2px solid var(--line);border-radius:16px;margin-bottom:13px;overflow:hidden}
.qc.sel{border-color:var(--a);box-shadow:0 4px 16px rgba(30,64,175,.09)}
.qc.dim{opacity:.55}
.qh{display:flex;gap:11px;align-items:center;padding:14px 18px;cursor:pointer}
.qn{background:var(--a);color:#fff;border-radius:9px;min-width:34px;height:34px;display:flex;
  align-items:center;justify-content:center;font-family:'Secular One',sans-serif;font-size:1rem}
.qc.sel .qn{background:var(--ok)}
.qt{font-weight:800;flex:1;font-size:1rem}
.qp{font-size:.8rem;color:var(--soft);font-weight:700;white-space:nowrap}
.qb{padding:0 18px 18px;border-top:1px solid var(--line)}
.src{background:#fafbff;border-inline-start:4px solid var(--b);border-radius:0 12px 12px 0;
  padding:13px 16px;margin:14px 0;font-size:.95rem}
.src .cite{display:block;margin-top:8px;font-size:.78rem;color:var(--soft)}
.src img{max-width:100%;height:auto;border-radius:10px;margin-top:10px;display:block}
.part{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
.part:first-of-type{border-top:0}
.pk{display:inline-block;background:#eef1fb;color:var(--a);border-radius:8px;padding:2px 11px;
  font-weight:800;font-size:.85rem;margin-inline-end:8px}
.pp{font-size:.8rem;color:var(--soft);font-weight:700}
.con{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0}
.con b{background:#fdf6e8;color:#8a5a08;border-radius:20px;padding:3px 12px;font-size:.83rem;font-weight:800}
.sub{margin:8px 0 0;padding-inline-start:20px} .sub li{margin-bottom:4px;font-size:.95rem}
.wc{font-size:.76rem;color:var(--soft);font-weight:700;text-align:left;margin-top:4px}
.pick{display:flex;gap:9px;align-items:center;padding:11px 18px;background:#fafbff;border-top:1px solid var(--line)}
.note{background:#fdf6e8;border-radius:11px;padding:11px 15px;font-size:.9rem;color:#8a5a08;font-weight:700}
.err{background:#fdecea;color:#9f1239;border-radius:11px;padding:11px 15px;font-weight:700;font-size:.92rem}
/* סרגל תחתון */
.bot{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--line);
  padding:10px 0;z-index:45;box-shadow:0 -3px 14px rgba(0,0,0,.05)}
.botin{max-width:900px;margin:0 auto;padding:0 15px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.prog{flex:1;min-width:130px}
.trk{background:var(--line);border-radius:6px;height:9px;overflow:hidden}
.trk i{display:block;height:100%;background:var(--a);border-radius:6px;transition:width .3s}
.trk i.ok{background:var(--ok)}
.pl{font-size:.79rem;color:var(--soft);font-weight:700;margin-top:3px}
/* מסכים */
.mid{max-width:640px;margin:40px auto;padding:0 15px}
.big{font-family:'Secular One',sans-serif;font-size:2rem;text-align:center;margin:0 0 6px}
.lead{text-align:center;color:var(--soft);margin:0 0 22px}
.rules{list-style:none;padding:0;margin:0 0 20px}
.rules li{background:#fafbff;border-radius:11px;padding:11px 15px;margin-bottom:8px;font-size:.95rem}
.rules li b{color:var(--a)}
@media(max-width:600px){body{font-size:16px}.card{padding:17px 15px}.qh{padding:12px 13px}.qb{padding:0 13px 15px}}
@media print{.top,.bot,.tabs,.pick{display:none}.qc{break-inside:avoid}}
</style>
</head>
<body>
<div id="app"><div class="mid"><div class="card"><p style="text-align:center;margin:0">טוען…</p></div></div></div>
<script>
let QS={},SECTIONS=[],SHARED={},EXSPEC=null;

/* ================= תשתית ================= */
const P=new URLSearchParams(location.search);
const CODE=P.get('code')||'', CLS=P.get('class')||'', PREVIEW=P.get('preview')==='1';
const SUP="https://eubgzfkkovxgijhrmnif.supabase.co",
      SKEY="sb_publishable_vJ768fOwYWiDWeYsBBR45g_4NM4s55p";
const HDR={apikey:SKEY,Authorization:'Bearer '+SKEY};
let TOPIC='bagrut', MINUTES=210;

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').replace(/\s+/g,' ').trim();
const el=id=>document.getElementById(id);
async function sb(q,m,body,extra){
  const r=await fetch(SUP+'/rest/v1/'+q,{method:m||'GET',
    headers:Object.assign({},HDR,{'Content-Type':'application/json'},extra||{}),
    body:body?JSON.stringify(body):undefined});
  if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,160));
  const t=await r.text(); return t?JSON.parse(t):[];
}
function tPhoneNorm(s){let p=String(s||'').replace(/\D/g,'');p=p.replace(/^00+/,'');
  if(p.indexOf('972')===0)p=p.slice(3);p=p.replace(/^0+/,'');return p?('0'+p):'';}

/* ================= מצב ================= */
let ME='', ROSTER=[], VIEW='A', SEL={}, ANS={}, T0=0, TICK=null, DONE=false;
const EXID=P.get('exam')||'';
const LSK='bagx_'+EXID+'_'+CODE+'_'+CLS;
const meKey=()=>LSK+'_'+norm(ME);

function store(){
  if(PREVIEW||DONE)return;
  try{localStorage.setItem(meKey(),JSON.stringify({sel:SEL,ans:ANS,t0:T0,v:1}));
      const s=el('saved'); if(s){s.textContent='✓ נשמר במכשיר';setTimeout(()=>{if(s)s.textContent='';},1600);}
  }catch(e){}
}
function restore(){
  try{const j=JSON.parse(localStorage.getItem(meKey())||'null');
    if(j&&j.v===1){SEL=j.sel||{};ANS=j.ans||{};T0=j.t0||0;return true;}
  }catch(e){}
  return false;
}

/* ================= כללי בחירה ================= */
function groupOf(qk){
  for(const s of SECTIONS)for(let i=0;i<s.groups.length;i++)
    if(s.groups[i].from.indexOf(qk)>-1)return {sec:s,gi:i,g:s.groups[i]};
  return null;
}
const gid=(sec,gi)=>sec.id+gi;
function chosen(sec,gi){return (sec.groups[gi].from).filter(k=>SEL[k]);}
function secDone(s){return s.groups.every((g,i)=>chosen(s,i).length===g.pick);}
function allDone(){return SECTIONS.every(secDone);}
function toggle(qk){
  const info=groupOf(qk); if(!info)return;
  if(SEL[qk]){ delete SEL[qk]; }
  else{
    const cur=chosen(info.sec,info.gi);
    if(cur.length>=info.g.pick){
      alert('בפרק הזה כבר נבחרו '+info.g.pick+' שאלות ('+info.g.label+').\nכדי לבחור אחרת — בטלו קודם את הבחירה הקיימת.\nהתשובות שכתבתם יישמרו.');
      return;
    }
    SEL[qk]=1;
  }
  store(); render();
}

/* ================= טיימר ================= */
function fmt(ms){
  if(ms<0)ms=0;
  const t=Math.floor(ms/1000), h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60;
  const p=n=>String(n).padStart(2,'0');
  return p(h)+':'+p(m)+':'+p(s);
}
function left(){ return T0? (T0+MINUTES*60000)-Date.now() : MINUTES*60000; }
function startTimer(){
  if(TICK)clearInterval(TICK);
  TICK=setInterval(function(){
    const c=el('clock'); if(!c)return;
    const l=left(); c.textContent=fmt(l);
    c.className='clock'+(l<10*60000?' crit':(l<30*60000?' warn':''));
    if(l<=0){clearInterval(TICK);
      if(!DONE){alert('הזמן נגמר. הבחינה תישלח עכשיו.');submit(true);}}
  },1000);
}

/* ================= רינדור ================= */
function qCard(qk){
  const q=QS[qk], on=!!SEL[qk], info=groupOf(qk);
  const full=chosen(info.sec,info.gi).length>=info.g.pick && !on;
  const body=on?`<div class="qb">
    ${q.shared&&SHARED[q.shared]?srcHtml(SHARED[q.shared]):''}
    ${q.src?srcHtml(q.src):''}
    ${q.parts.map((p,i)=>partHtml(qk,p,i)).join('')}
  </div>`:'';
  return `<div class="qc ${on?'sel':''} ${full?'dim':''}">
    <div class="qh" onclick="toggle('${qk}')">
      <div class="qn">${q.n}</div>
      <div class="qt">${esc(q.title)}</div>
      <div class="qp">${q.pts} נק׳</div>
    </div>
    ${body}
    <div class="pick">
      <button class="btn ${on?'no':''} ${full?'g':''}" onclick="toggle('${qk}')" ${full?'disabled':''}>
        ${on?'✕ ביטול הבחירה':(full?'הפרק מלא':'＋ בחרו שאלה זו')}</button>
      ${on?'<span class="pl">'+answered(qk)+' מתוך '+q.parts.length+' סעיפים נענו</span>':''}
    </div></div>`;
}
function srcHtml(s){
  return `<div class="src">${s.fake?'<div style="font-size:.8rem;color:var(--soft);font-weight:800;margin-bottom:6px">קטע לצורך תרגול — אינו ציטוט ממקור אמיתי</div>':''}${s.t||''}
    ${s.img?`<img src="${esc(s.img)}" alt="נספח לשאלה" loading="lazy">`:''}
    ${s.cap?`<span class="cite">${esc(s.cap)}</span>`:''}
    ${s.s?`<span class="cite">(${esc(s.s)})</span>`:''}</div>`;
}
/* רשימת המושגים לשילוב — תומכת בשתי הסכימות: {use:'טקסט',con:[]} ו-{use:<מספר>,pool:[]} */
function conBlock(p){
  const list=p.con||p.pool||[];
  if(!p.use||!list.length)return '';
  const n=typeof p.use==='number'?p.use:0;
  const txt=typeof p.use==='string'?p.use
    :('בתשובתכם השתמשו ב<b>'+(n===1?'אחד':n===2?'שניים':n)+'</b> מבין המושגים האלה:');
  return `<div style="margin-top:9px;font-size:.9rem">${txt}</div>
    <div class="con">${list.map(c=>'<b>'+esc(c)+'</b>').join('')}</div>`;
}
function partHtml(qk,p,i){
  const key=qk+'_'+i, v=ANS[key]||'';
  return `<div class="part">
    <div>${p.k?`<span class="pk">${p.k}</span>`:''}<span class="pp">${p.pts} נקודות</span></div>
    ${p.src?srcHtml(p.src):''}
    <div style="margin:9px 0 6px">${p.q}</div>
    ${p.sub?`<ol class="sub">${p.sub.map(x=>'<li>'+x+'</li>').join('')}</ol>`:''}
    ${conBlock(p)}
    <textarea id="ta_${key}" placeholder="כתבו כאן את תשובתכם…"
      oninput="onType('${key}',this)">${esc(v)}</textarea>
    <div class="wc" id="wc_${key}">${words(v)} מילים</div></div>`;
}
const words=t=>String(t||'').trim()?String(t).trim().split(/\s+/).length:0;
function answered(qk){return QS[qk].parts.filter((p,i)=>words(ANS[qk+'_'+i])>0).length;}
let typeT=null;
function onType(key,ta){
  ANS[key]=ta.value;
  const w=el('wc_'+key); if(w)w.textContent=words(ta.value)+' מילים';
  clearTimeout(typeT); typeT=setTimeout(()=>{store();bar();},700);
}

function bar(){
  let tot=0,got=0;
  SECTIONS.forEach(s=>s.groups.forEach((g,i)=>{
    tot+=g.pick;
    chosen(s,i).forEach(k=>{ if(answered(k)===QS[k].parts.length)got++; });
  }));
  const pc=tot?Math.round(got/tot*100):0;
  const t=el('trk'), l=el('plabel'), b=el('sendBtn');
  if(t)t.innerHTML='<i class="'+(pc===100?'ok':'')+'" style="width:'+pc+'%"></i>';
  if(l)l.textContent=got+' מתוך '+tot+' שאלות הושלמו במלואן';
  if(b)b.disabled=!allDone();
  document.querySelectorAll('.tab').forEach(x=>{
    const s=SECTIONS.find(y=>y.id===x.dataset.s); if(!s)return;
    x.classList.toggle('full',secDone(s));
    const c=x.querySelector('.c');
    if(c){let n=0,d=0;s.groups.forEach((g,i)=>{n+=g.pick;d+=chosen(s,i).length;});c.textContent=d+'/'+n;}
  });
}

function render(){
  const s=SECTIONS.find(x=>x.id===VIEW)||SECTIONS[0];
  el('app').innerHTML=`
  <div class="top"><div class="topin">
    <div class="clock" id="clock">${fmt(left())}</div>
    <div class="who">${esc(ME)} <span>· כיתה ${esc(CLS)}</span></div>
    <div class="saved" id="saved"></div>
  </div></div>
  <div class="wrap">
    <div class="tabs">${SECTIONS.map(x=>`<button class="tab ${x.id===VIEW?'on':''}" data-s="${x.id}"
      onclick="VIEW='${x.id}';render();">${esc(x.title)} <span class="c"></span></button>`).join('')}</div>
    <div class="note">${s.note}</div>
    <div style="margin-top:14px">${s.groups.map(g=>
      `<div style="margin-bottom:6px;font-weight:800;font-size:.87rem;color:var(--soft)">${esc(g.label)}</div>`+
      g.from.map(qCard).join('')).join('')}</div>
  </div>
  <div class="bot"><div class="botin">
    <div class="prog"><div class="trk" id="trk"></div><div class="pl" id="plabel"></div></div>
    <button class="btn ok" id="sendBtn" onclick="submit(false)">שליחת הבחינה ←</button>
  </div></div>`;
  bar();
  window.scrollTo(0,0);
}

/* ================= הגשה ================= */
function payload(auto){
  const answers={}, items=[];
  SECTIONS.forEach(s=>s.groups.forEach((g,i)=>chosen(s,i).forEach(qk=>{
    QS[qk].parts.forEach((p,pi)=>{
      const lbl=QS[qk].n+(p.k?p.k:'');
      answers[lbl]=ANS[qk+'_'+pi]||'';
      items.push({q:lbl,pts:p.pts,words:words(ANS[qk+'_'+pi])});
    });
  })));
  const picked={};
  SECTIONS.forEach(s=>{picked[s.id]=s.groups.flatMap((g,i)=>chosen(s,i)).map(k=>QS[k].n);});
  const used=Math.round((MINUTES*60000-left())/60000);
  return {teacher_id:CODE||null,student_name:ME,student_key:norm(ME),class_name:CLS||null,
    topic:TOPIC,lesson_type:'bagrut',zone:null,concept:null,page:location.pathname.split('/').pop(),
    score_auto:null,score_max:100,skipped:!!auto,
    stages:[{k:'התחלה',at:new Date(T0).toISOString()},
            {k:'הגשה',at:new Date().toISOString(),auto:!!auto,minutes:used}],
    items:items,
    answers:Object.assign({_selected:picked,_minutes:used,_auto:!!auto},answers),
    submitted_at:new Date().toISOString()};
}
async function submit(auto){
  if(DONE)return;
  if(!auto){
    if(!allDone()){alert('עדיין לא נבחרו כל השאלות הנדרשות בכל הפרקים.');return;}
    const miss=[];
    SECTIONS.forEach(s=>s.groups.forEach((g,i)=>chosen(s,i).forEach(k=>{
      if(answered(k)<QS[k].parts.length)miss.push(QS[k].n);})));
    const warn=miss.length?'\n\nשימו לב: בשאלות '+miss.join(', ')+' יש סעיפים ריקים.':'';
    if(!confirm('לשלוח את הבחינה?'+warn+'\n\nלאחר השליחה לא ניתן לערוך.'))return;
  }
  DONE=true; if(TICK)clearInterval(TICK);
  const b=el('sendBtn'); if(b){b.disabled=true;b.textContent='שולח…';}
  if(PREVIEW){ finish('תצוגה מקדימה — הבחינה לא נשלחה.'); return; }
  try{
    await sb('lms_submissions','POST',[payload(auto)]);
    try{localStorage.removeItem(meKey());}catch(e){}
    finish('הבחינה נשלחה בהצלחה למורה.');
  }catch(e){
    DONE=false; if(TICK)startTimer();
    if(b){b.disabled=false;b.textContent='שליחת הבחינה ←';}
    alert('השליחה נכשלה: '+e.message+'\n\nהתשובות שמורות במכשיר. נסו שוב בעוד רגע.');
  }
}
function finish(msg){
  const p=payload(false);
  el('app').innerHTML=`<div class="mid"><div class="card" style="text-align:center">
    <div style="font-size:3rem">✅</div>
    <h1 class="big">${esc(msg)}</h1>
    <p class="lead">${esc(ME)} · כיתה ${esc(CLS)} · זמן שנוצל: ${p.answers._minutes} דקות</p>
    <div class="note" style="text-align:right">הבדיקה תיעשה על ידי המורה. הציון יופיע באזור האישי שלכם.</div>
  </div></div>`;
}

/* ================= מסכי פתיחה ================= */
function screenStart(){
  el('app').innerHTML=`<div class="mid">
    <h1 class="big">${esc(EXSPEC&&EXSPEC.title||"מבחן בתקשורת וחברה")}</h1>
    <p class="lead">מבנה בגרות · שלושה פרקים · 100 נקודות</p>
    <div class="card">
      <ul class="rules">
        <li>⏱ משך הבחינה: <b>${MINUTES} דקות</b>. השעון מתחיל ברגע הכניסה וממשיך גם אם תסגרו את הדף.</li>
        ${SECTIONS.map(x=>'<li>📄 <b>'+esc(x.title)+'</b> ('+x.pts+' נק׳): '+x.note.replace(/<[^>]+>/g,'')+'</li>').join('')}
        <li>💾 התשובות נשמרות במכשיר אוטומטית. אם הדף נסגר — תוכלו לחזור ולהמשיך.</li>
        <li>📚 חומר עזר: <b>אין</b>. בתשובותיכם התבססו על החומר שנלמד בכיתה.</li>
      </ul>
      ${PREVIEW?'<div class="note" style="margin-bottom:12px">תצוגה מקדימה למורה — לא תישלח הגשה.</div>':''}
      <div id="pickWrap"></div>
    </div></div>`;
  const w=el('pickWrap');
  if(PREVIEW){ ME='תצוגה מקדימה'; w.innerHTML='<button class="btn" onclick="begin()">כניסה לבחינה ←</button>'; return; }
  if(!ROSTER.length){ w.innerHTML='<div class="err">רשימת התלמידים של הכיתה ריקה. פנו למורה.</div>'; return; }
  w.innerHTML=`<div style="font-weight:800;margin-bottom:7px">בחרו את שמכם מרשימת הכיתה</div>
    <select id="who"><option value="">— בחרו שם —</option>
      ${ROSTER.map(s=>'<option>'+esc(s)+'</option>').join('')}</select>
    <button class="btn" style="margin-top:12px" onclick="begin()">התחלת הבחינה ←</button>
    <div id="serr" style="margin-top:9px"></div>`;
}
function begin(){
  if(!PREVIEW){
    const v=el('who').value;
    if(!v){el('serr').innerHTML='<div class="err">יש לבחור שם.</div>';return;}
    ME=v;
    const had=restore();
    if(had&&T0){ if(!confirm('נמצאה בחינה שהתחלתם. להמשיך מהמקום שבו הפסקתם?')){SEL={};ANS={};T0=0;} }
  }
  if(!T0)T0=Date.now();
  store(); startTimer(); render();
}

/* ================= כניסת מורה ================= */
function teacherPanel(){
  el('app').innerHTML=`<div class="mid">
    <h1 class="big">${esc(EXSPEC&&EXSPEC.title||"מבחן")}</h1>
    <p class="lead">מבנה בגרות · שליחה לכיתה</p>
    <div class="card">
      <div style="font-weight:800;margin-bottom:4px">כניסת מורה</div>
      <p style="color:var(--soft);font-size:.92rem;margin:0 0 13px">התחברו כדי לקבל קישור לשליחה לתלמידים.</p>
      <input id="lgPhone" type="tel" dir="ltr" style="text-align:right;margin-bottom:9px" placeholder="טלפון">
      <input id="lgPass" type="password" style="margin-bottom:9px" placeholder="סיסמה">
      <div id="clsWrap"></div>
      <button class="btn" style="margin-top:11px" onclick="tLogin()">כניסה ויצירת קישור ←</button>
      <div id="lerr" style="margin-top:9px"></div>
      <div id="tban" style="display:none;margin-top:14px">
        <div class="note" style="margin-bottom:9px">הקישור לתלמידים:</div>
        <input id="tbUrl" readonly onclick="this.select()">
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:9px">
          <button class="btn g" onclick="cp()">📋 העתקה</button>
          <button class="btn g" onclick="window.open(el('tbUrl').value+'&preview=1','_blank')">👁 תצוגה מקדימה</button>
          <button class="btn ok" onclick="assign()">📥 העברה לכיתה</button>
        </div>
        <div id="amsg" style="margin-top:8px;font-weight:700;font-size:.9rem"></div>
      </div>
      <p style="color:var(--soft);font-size:.86rem;margin:14px 0 0">תלמידים נכנסים דרך הקישור — בלי הרשמה.</p>
    </div></div>`;
  const ph=el('lgPhone'); let last='';
  ph.addEventListener('blur',async function(){
    const p=tPhoneNorm(ph.value); if(!p||p===last)return; last=p;
    try{
      const t=await sb('lms_teachers?select=id&phone=eq.'+encodeURIComponent(p));
      if(!t||!t[0])return;
      const c=await sb('lms_classes?select=name&teacher_id=eq.'+encodeURIComponent(t[0].id)+'&order=name.asc');
      const list=(c||[]).map(x=>x.name).filter(Boolean);
      if(!list.length)return;
      el('clsWrap').innerHTML='<select id="lgClass"><option value="">— בחרו כיתה —</option>'+
        list.map(n=>'<option>'+esc(n)+'</option>').join('')+'</select>';
    }catch(e){}
  });
}
let TID='',TNAME='';
async function tLogin(){
  const ph=tPhoneNorm(el('lgPhone').value), pw=el('lgPass').value.trim();
  const cs=el('lgClass'), cls=cs?cs.value:'';
  const e=el('lerr'); e.innerHTML='';
  if(!ph||!pw){e.innerHTML='<div class="err">נא למלא טלפון וסיסמה.</div>';return;}
  if(!cls){e.innerHTML='<div class="err">נא לבחור כיתה.</div>';return;}
  try{
    const rows=await sb('lms_teachers?select=id,name,password,status&phone=eq.'+encodeURIComponent(ph));
    const t=(rows||[]).find(x=>x.password===pw&&x.status==='approved');
    if(!t){e.innerHTML='<div class="err">טלפון/סיסמה שגויים או שאינך מאושר.</div>';return;}
    TID=t.id; TNAME=(t.name||'').trim();
    el('tbUrl').value=location.href.split('?')[0]+'?exam='+encodeURIComponent(EXID)+'&code='+encodeURIComponent(TID)+'&class='+encodeURIComponent(cls);
    el('tban').style.display='block';
  }catch(err){e.innerHTML='<div class="err">שגיאה: '+esc(err.message)+'</div>';}
}
function cp(){const i=el('tbUrl');i.select();
  navigator.clipboard.writeText(i.value).then(()=>el('amsg').textContent='✅ הועתק').catch(()=>{});}
async function assign(){
  const m=el('amsg'); const url=el('tbUrl').value;
  const cls=decodeURIComponent((url.split('&class=')[1]||''));
  m.style.color='#666';m.textContent='מעביר…';
  try{
    await sb('lms_assignments?on_conflict=teacher_id,class_name,topic','POST',
      [{teacher_id:TID,class_name:cls,topic:TOPIC,page:location.pathname.split('/').pop(),
        concept:null,title:(EXSPEC&&EXSPEC.title)||'מבחן בתקשורת וחברה',link:url,active:true}],
      {Prefer:'resolution=merge-duplicates'});
    m.style.color='#0f7a4d';m.textContent='✅ הועברה לכיתה '+cls;
  }catch(e){m.style.color='#9f1239';m.textContent='שגיאה: '+e.message.slice(0,110);}
}

/* ================= הפעלה ================= */
window.addEventListener('beforeunload',function(e){
  if(T0&&!DONE&&!PREVIEW){store();e.preventDefault();e.returnValue='';}
});
(async function boot(){
  if(!EXID){ el('app').innerHTML='<div class="mid"><div class="card"><div class="err">הקישור חסר מזהה מבחן (exam=). בקשו מהמורה קישור מעודכן.</div></div></div>'; return; }
  try{
    const rows=await sb('bagrut_exams?select=*&id=eq.'+encodeURIComponent(EXID));
    const r=(rows||[])[0];
    if(!r||!r.spec)throw new Error('המבחן לא נמצא');
    EXSPEC=r.spec; QS=EXSPEC.questions||{}; SECTIONS=EXSPEC.sections||[];
    TOPIC='bagrut_'+EXID; MINUTES=EXSPEC.minutes||210;
    document.title=(EXSPEC.title||'מבחן')+' · תקשורת וחברה';
  }catch(e){
    el('app').innerHTML='<div class="mid"><div class="card"><div class="err">טעינת המבחן נכשלה: '+esc(e.message)+'</div></div></div>'; return;
  }
  if(!CODE||!CLS){ teacherPanel(); return; }
  if(PREVIEW){ screenStart(); return; }
  try{
    const c=await sb('lms_classes?select=students&teacher_id=eq.'+encodeURIComponent(CODE)+
                     '&name=eq.'+encodeURIComponent(CLS));
    ROSTER=(((c||[])[0]||{}).students||[]).map(norm).filter(Boolean);
  }catch(e){ ROSTER=[]; }
  screenStart();
})();
</script>
<script src="paste-guard.js"></script>
</body>
</html>
