q1:{n:1,pts:23,t:'חוק השידורים החדש',parts:[
 {k:'א',pts:7,split:[['50%','כל יתרון נכון הכולל שימוש במושג']],
  ans:['<b>יעודד כניסה של גופי תקשורת חדשים</b> — יאפשר למספר רב יותר של כלי תקשורת לפעול, ובכך ירחיב את מגוון הדעות (<b>רב־תרבותיות</b>) ואת <b>חופש הביטוי</b>. <b>תיאוריית מרכז ופריפריה</b> טוענת שהתקשורת מציגה את המציאות מנקודת מבט המרכז — כניסת גופים חדשים תאפשר חשיפה גם לפריפריה, ועשויה לערער על <b>ההגמוניה האידיאולוגית</b>.',
       '<b>יעודד גיוון של תכנים</b> — חשיפה למגוון רחב יותר של קבוצות ועמדות, השמעת קולות שלא נשמעו עד כה, וחולל שינוי בתפיסת ההגמוניה.',
       '<b>יוזיל עלויות</b> — יאפשר ליותר צופים להיחשף למגוון תכנים, יקרב בין המרכז לפריפריה ויעודד רב־תרבותיות.'],
  tag:'זירת העל — רב־תרבותיות, חופש הביטוי, הגמוניה אידיאולוגית; זירה 3 — מרכז ופריפריה'},
 {k:'ב',pts:5,split:[['100%','הסבר מלא']],
  ans:['בדמוקרטיה השאיפה היא שהתקשורת תפעל באופן עצמאי ומקצועי כדי לתפקד כ<b>רשות רביעית</b> — לבקר את השלטון ולחשוף מחדלים. מינוי רוב חברי הגוף המפקח על ידי השר עלול להגביר מעורבות פוליטית ולפגוע בתפקוד הזה. בנוסף, המעורבות עלולה לגרור תלות בפוליטיקאים וליצור יחסי <b>הון־שלטון־עיתון</b>: התקשורת תלויה בפוליטיקאים לתקציבים ולמינויים, מה שמקשה עליה לבקר את השלטון.'],
  tag:'זירת העל — הון־שלטון־עיתון, רשות רביעית'},
 {k:'ג',pts:11,split:[['70%','דיון בדילמה ושימוש בשני מושגים'],['30%','הכרעה ונימוק']],
  ans:['<b>תקנון אתיקה אחיד — יתרון:</b> יוצר סטנדרטים מקצועיים אחידים, מבטיח שמירה על אמינות ועל <b>אתיקה עיתונאית</b>, מונע פרסומים פוגעניים ומחזק את <b>אמון הציבור</b>. <b>חיסרון:</b> עלול להיתפס כמגבלה על <b>חופש הביטוי</b> ו<b>חופש העיתונות</b>, לצמצם את עצמאות כלי התקשורת ולא לתת מענה לכל המצבים.',
       '<b>כללים ייחודיים לכל כלי — יתרון:</b> לכל גוף יש קהל יעד, סגנון ואופי עבודה שונים, ולכן יש לאפשר לו לפעול לפי שיקוליו המקצועיים. <b>חיסרון:</b> ייווצרו פערים גדולים בין הדיווחים, ייתכנו דיווחים לא מדויקים ופוגעניים, אמון הציבור ייפגע ואיכות המידע תרד עד כדי דיווח שקרי.',
       '<b>הכרעה א׳:</b> עדיף תקנון אחיד — מבטיח אחריות מקצועית, דיווח מהימן והגנה על הציבור. <b>הכרעה ב׳:</b> עדיף שכל כלי ינסח לעצמו — כך יתאפשר חופש ביטוי מקסימלי בלי שגוף אחד כופה את השקפתו.'],
  tag:'זירת העל — אמון הציבור, אתיקה עיתונאית, חופש העיתונות'}]},

q2:{n:2,pts:23,t:'סגירת גלי צה"ל',parts:[
 {k:'א',pts:5,split:[['50%','הסבר "תקשורת ציבורית"'],['50%','חשיבות במדינה דמוקרטית']],
  ans:['<b>תקשורת ציבורית:</b> תקשורת המופעלת מטעם המדינה (ממומנת מתקציב ציבורי), אך מתפקדת באופן עצמאי וללא מטרות רווח כדי לשרת את הציבור. מחויבת לערכים כמו פלורליזם וקידום שיח דמוקרטי.',
       '<b>חשיבות:</b> נועדה לספק מידע אמין ומגוון לכלל האזרחים ללא תלות בשיקולים מסחריים, מאפשרת ביקורת על השלטון, מייצגת קבוצות שונות ותורמת לשיח הציבורי.'],
  tag:'זירת העל — תקשורת ציבורית'},
 {k:'ב',pts:7,split:[['50%','הסבר "רשות רביעית"'],['50%','הדגמה מהקטע']],
  ans:['<b>רשות רביעית:</b> התקשורת אחראית לפקח, לבקר ולדווח לציבור על פעולות השלטון.',
       '<b>הדגמה:</b> על פי הקטע, גלי צה"ל ממלאת את התפקיד משום שהיא מסקרת באופן ביקורתי סוגיות פוליטיות, ביטחוניות וחברתיות.'],
  tag:'זירת העל — רשות רביעית'},
 {k:'ג',pts:11,split:[['70%','דיון ושני מושגים'],['50%','דיון ומושג אחד'],['30%','דיון ללא מושגים'],['30%','הכרעה ונימוק']],
  ans:['<b>סגירה — יתרון:</b> תחסוך כסף שינוצל לשימושים אחרים, ותפנה מקום לתחנות רדיו אחרות — מה שיגביר את <b>חופש הביטוי</b> של קבוצות נוספות. <b>חיסרון:</b> <b>תקשורת ציבורית</b> מוגנת משיקולי רייטינג ומהשפעות כלכליות ופוליטיות; סגירתה תפגע בה וכתוצאה מכך גם בחופש הביטוי.',
       '<b>המשך הפעלה — יתרון:</b> תקשורת ציבורית חזקה חשובה למדינה דמוקרטית, והתחנה מחזקת את חופש הביטוי. <b>חיסרון:</b> התחנה אינה מתפקדת באמת כתקשורת ציבורית כיוון שהיא חלק מהצבא ואין בה חופש ביטוי מלא.',
       '<b>הכרעה א׳:</b> לסגור — יאפשר ליותר תחנות לפעול ויגביר את חופש הביטוי. <span class="hint">תתקבל גם תשובה שאין מקום לתחנת שידור צבאית.</span> <b>הכרעה ב׳:</b> להמשיך — שידור ציבורי חשוב לחיזוק הדמוקרטיה, חופשי מלחצים ושומר על האינטרס הציבורי.'],
  tag:'זירת העל — חופש הביטוי, תקשורת ציבורית, רב־תרבותיות'}]},

q3:{n:3,pts:23,t:'שובם של החטופים',parts:[
 {k:'א',pts:6,split:[['40%','הסבר "אירוע מדיה"'],['10%','קביעה'],['50%','נימוק']],
  ans:['<b>אירוע מדיה:</b> שידור חי של אירוע גדול ובעל משמעות לקהל צופים נרחב. התקשורת והקהל נערכים אליו מראש, הוא מתרחש במקום מוגדר מראש, והצופים מרגישים כאילו הם עצמם שותפים ונוכחים בו.',
       '<b>קביעה:</b> שידור חזרת החטופים הוא אירוע מדיה.',
       '<b>נימוק:</b> השידור לווה בשידורים חיים ומתמשכים שעות רבות וזכה להיקף צפייה חריג; גופי התקשורת נערכו מראש והציבו מתחמי שידור באולפנים, בבתי המשפחות ובמוקדי ההתרחשות; הציבור צפה בזמן אמת, והאירוע הפך למוקד צפייה משותף ולחוויה לאומית.'],
  tag:'זירה 8 — אירוע מדיה'},
 {k:'ב',pts:6,split:[['33%','כל קריטריון והסבר נכון']],
  ans:['<b>רלוונטיות</b> — החטופים הם אזרחים ישראלים.',
       '<b>עניין אנושי</b> — סוגיה מעוררת רגשית: שובם הביתה של חטופים שהוחזקו זמן רב.',
       '<b>חשיבות</b> — מדובר בהצלת חיי אדם.',
       '<b>ייחודיות</b> — חזרה של אנשים שנחטפו באכזריות והיו בסכנת חיים.',
       '<b>עדכניות</b> — אירוע שלווה בהתפתחויות שהתעדכנו כל הזמן.',
       '<b>אישיות מפורסמת</b> — החטופים הפכו לדמויות מוכרות שסיפוריהן מעוררים התעניינות.'],
  tag:'זירה 3 — קריטריונים לקביעת ערך חדשותי'},
 {k:'ג',pts:11,split:[['70%','דיון ושני מושגים'],['50%','דיון ומושג אחד'],['30%','דיון ללא מושגים'],['30%','הכרעה ונימוק']],
  ans:['<b>הדילמה:</b> האם לפרסם מידע ותמונות של החטופים הנפגשים לראשונה עם בני משפחותיהם, או לשמור על פרטיותם וכבודם ולהימנע מחדירה לפרטיות.',
       '<b>בעד פרסום:</b> לפי <b>זכות הציבור לדעת</b> לאזרחים יש זכות לקבל מידע על אירועים בעלי חשיבות לאומית. התקשורת מבקשת לשדר בזמן אמת ולאפשר לציבור להיות שותף לרגעים ההיסטוריים. כמו כן שידור כזה מעלה את <b>הרייטינג</b>.',
       '<b>בעד שמירה על פרטיות:</b> <b>האתיקה העיתונאית</b> ו<b>האחריות החברתית</b> מחייבות לפעול ברגישות ולהימנע מפגיעה. מדובר ברגעים אישיים ואינטימיים, וחשיפה מוגזמת ללא הסכמה פוגעת בזכות לפרטיות.',
       '<b>הכרעה א׳:</b> לאפשר סיקור בשל חשיבותו הציבורית, אך בזהירות ותוך שמירה מרבית על פרטיות. <b>הכרעה ב׳:</b> להימנע מסיקור חשוף — פגיעה בפרטיות של אנשים פרטיים שלא בחרו להיחשף, וערך זה גובר על זכות הציבור לדעת.'],
  tag:'זירת העל — זכות הציבור לדעת, אתיקה עיתונאית, אחריות חברתית; זירה 9 — רייטינג'}]},

q4:{n:4,pts:23,t:'בינה מלאכותית ובחירות',parts:[
 {k:'א',pts:7,split:[['50%','הסבר "פוסט אמת"'],['50%','הסבר הסכנה']],
  ans:['<b>פוסט אמת:</b> מצב שבו האמת אינה אמת מידה מחייבת, ולכן מופץ מידע שקרי רב היוצר חוסר הסכמה בנוגע לאמת. הציבור מוצף ב"פייק ניוז" ואינו יכול לדעת מה אמת ומה שקר. השיקולים בדיון הציבורי מתבססים פחות על עובדות ויותר על שייכות קבוצתית.',
       '<b>1. דיפ פייק והודעות מזויפות</b> — לא נוכל לדעת מה אמת, האמון בכלל כלי התקשורת ירד ולא יהיה בסיס משותף לדיון.',
       '<b>2. קידום תכנים לפי העדפה</b> — כל אחד ייחשף ל"פיד" אחר, לא יהיה סדר יום משותף ולא תהיה הסכמה על הנושאים שעל הפרק.',
       '<b>3. ידיעות כוזבות</b> — ירידה באמון בממסד ובתקשורת תעודד "פוסט אמת", ואי אפשר יהיה להכריע על פי עובדות כי לא תהיה הסכמה עליהן.'],
  tag:'זירת העל — פוסט אמת'},
 {k:'ב',pts:5,split:[['50%','הסבר שני מאפיינים'],['50%','כיצד הם מגבירים את הסכנות']],
  ans:['<b>היעדר מנגנוני פיקוח</b> — כל אדם יכול להעלות תוכן, ואין פיקוח ממשלתי או רגולטורי. <i>מגביר:</i> מאפשר הפצת "פייק ניוז" ומאפשר עיצוב אלגוריתם לטובת רווח כלכלי על חשבון הדמוקרטיה.',
       '<b>אנונימיות</b> — פעילות ברשת בצורה אנונימית. <i>מגביר:</i> מגבירה הפצה של "פייק ניוז" ומצב של "פוסט אמת".',
       '<b>הרשתות כפלטפורמה ולא ככלי תקשורת</b> — <i>מגביר:</i> נותן במה ל"פייק ניוז" ול"דיפ פייק", ומאפשר בוטים ופרופילים מזויפים בלי לקיחת אחריות.',
       '<b>הפצת מסרים בקלות</b> — העברת מידע לרבים במהירות ובעלות אפסית. <i>מגביר:</i> העברה קלה ומהירה של מסרים שקריים בלי יכולת להשתלט עליהם.',
       '<b>הפצת מידע באופן רוחבי</b> — המוענים הם גם הנמענים. <i>מגביר:</i> מגבירה אמון גם במסרים שקריים, כי הם מופצים על ידי אנשים דומים לנו.'],
  tag:'זירה 5 — רשתות חברתיות'},
 {k:'ג',pts:11,split:[['70%','דיון ושני מושגים'],['50%','דיון ומושג אחד'],['30%','דיון ללא מושגים'],['30%','הכרעה ונימוק']],
  ans:['<b>פיקוח המדינה — יתרון:</b> יאפשר בדיקה מה אמת ומה שקר וחסימת "פייק ניוז", יחזק את <b>אמון הציבור</b> ויאפשר <b>הבניה חברתית של המציאות</b> באופן אמין יותר. <b>חיסרון:</b> יפגע ב<b>חופש הביטוי</b>, יאפשר מחיקת תכנים שאינם "פייק ניוז", ויאפשר למדינה להבנות מציאות באופן המתאים לה.',
       '<b>הימנעות — יתרון:</b> הרשתות מאופיינות בחופש ביטוי וכל אזרח יכול לבטא בהן את דעתו; הימנעות תגביר את אמון הציבור כי נדע שהתוכן אינו מצונזר. <b>חיסרון:</b> מאפשר הפצת "פייק ניוז" ללא הגבלה, ולכן אמון הציבור ייפגע.',
       '<b>הכרעה א׳:</b> לפקח — חשוב יותר לשמור על אמון הציבור ועל הליך דמוקרטי תקין, גם במחיר פגיעה זמנית בחופש הביטוי. <b>הכרעה ב׳:</b> להימנע — חופש הביטוי ערך עליון, ויש חשש שהמדינה תתערב יתר על המידה ויהיה קשה לרסן אותה.'],
  tag:'זירת העל — חופש הביטוי, הבניה חברתית של המציאות, אמון הציבור, פייק ניוז'}]},

q5:{n:5,pts:12,t:'הסדרה "ווארט"',parts:[
 {k:'א',pts:5,split:[['50%','הסבר "רב־תרבותיות"'],['50%','תרומה לחיזוקה']],
  ans:['<b>רב־תרבותיות:</b> גישה המעודדת דיאלוג, כבוד הדדי, קבלה של השונה, סובלנות ומציאת מכנה משותף בין תרבויות שונות החיות בחברה אחת.',
       '<b>תרומה:</b> סדרות כמו "ווארט" מאפשרות לציבור להכיר מקרוב את חיי היום־יום ואת הדילמות בחברה החרדית — דבר המגביר הבנה וסובלנות, מפחית דעות קדומות ומשקף את המגוון התרבותי בחברה הישראלית.'],
  tag:'זירת העל — רב־תרבותיות'},
 {k:'ב',pts:7,split:[['50%','הסבר הגישה'],['50%','שני צרכים']],
  ans:['<b>גישת השימושים והסיפוקים:</b> צרכני התקשורת משתמשים במדיה כדי לספק לעצמם צרכים שונים — חברתיים, רגשיים, קוגניטיביים ואסקפיסטיים.',
       '<b>קוגניטיבי</b> — הסדרה חושפת את הצופים למנהגים, לכללים ולשיקולים בעולם השידוכים החרדי.',
       '<b>חברתי</b> — הצפייה מאפשרת להרגיש חלק משיח רחב שמתקיים על הסדרה.',
       '<b>אסקפיסטי</b> — בריחה משגרת החיים אל תוכן בידורי, משעשע וקליל.',
       '<b>רגשי</b> — הזדהות עם תוכני הסדרה, שמחה, אכזבה והתרגשות.'],
  tag:'זירה 6 — גישת השימושים והסיפוקים'}]},

q6:{n:6,pts:12,t:'גוף התקשורת "שקוף"',parts:[
 {k:'א',pts:6,split:[['50%','הסבר "עיתונות עצמאית"'],['50%','קביעה ונימוק']],
  ans:['<b>עיתונות עצמאית:</b> עיתונות שאינה תלויה בגורמים פוליטיים או כלכליים, ופועלת מתוך שיקולים מקצועיים וציבוריים.',
       '<b>קביעה:</b> "שקוף" הוא עיתונות עצמאית — אין בו פרסומות, אין תמיכה של בעלי הון או של הממשלה, כל המימון מגיע מאנשים פרטיים בסכומים קטנים, ומטרתו "לעבוד עבור הציבור".'],
  tag:'זירה 3 — עיתונות עצמאית'},
 {k:'ב',pts:6,split:[['50%','הסבר "עיתונות חוקרת"'],['50%','חשיבות במדינה דמוקרטית']],
  ans:['<b>עיתונות חוקרת:</b> ז׳אנר שמטרתו לגלות מידע שמישהו מעוניין להסתיר מהציבור, ולהוביל לשינויים במציאות — להשפיע על סדר היום ולעצב את הגבולות הנורמטיביים והמוסריים של החברה.',
       '<b>חשיבות:</b> מאפשרת תחקירים מקצועיים ללא השפעת אינטרסים מסחריים או פוליטיים, ולא רק לדווח אלא גם לנסות לשנות מציאות — כפי שעולה מהקטע.'],
  tag:'זירת העל — עיתונות חוקרת'}]},

q7:{n:7,pts:12,t:'הקמפיין "אל תהיה מוזר"',parts:[
 {k:'א',pts:7,split:[['40%','שני הבדלים'],['60%','קביעה ונימוק']],
  ans:['<b>הבדל 1:</b> קמפיין חברתי נועד לקדם ערך חברתי, לעומת קמפיין מסחרי שנועד לקדם מוצר או שירות.',
       '<b>הבדל 2:</b> יוזם הקמפיין המסחרי הוא גוף מסחרי; יוזם הקמפיין החברתי הוא גוף ציבורי ללא מטרת רווח.',
       '<b>קביעה:</b> "אל תהיה מוזר" הוא קמפיין חברתי — מטרתו לעודד יחס מכבד ולא לעודד רכישה, ויוזמו הוא משרד הרווחה, גוף ציבורי.'],
  tag:'זירה 9 — קמפיין פרסום חברתי ומסחרי'},
 {k:'ב',pts:5,split:[['50%','הסבר "הכחדה סימבולית"'],['50%','תרומה לצמצום התופעה']],
  ans:['<b>הכחדה סימבולית:</b> היעדר או תת־ייצוג של קבוצה מסוימת במדיה, באופן העלול ליצור תחושה שהקבוצה אינה חלק לגיטימי וחשוב בחברה.',
       '<b>תרומה:</b> הקמפיין מציג אדם בעל מוגבלות המשתלב באופן טבעי במרחב היום־יומי, ובכך מגדיל נראות, נאבק בהדרה, מעודד יחס מכבד ושוויוני ומנרמל מפגשים.'],
  tag:'זירה 7 — הכחדה סימבולית'}]},

q8:{n:8,pts:12,t:'שערי עיתונים בעולם',parts:[
 {k:'א',pts:5,split:[['30%','הסבר "גלובליזציה"'],['30%','הסבר "לוקליזציה"'],['40%','ציון המושג ונימוק']],
  ans:['<b>גלובליזציה:</b> תהליך שבו הטכנולוגיה מאפשרת מעבר חופשי של מידע, סחורות, שירותים, רעיונות ואנשים בין מדינות בקלות, בלי להתחשב בגבולות. לתקשורת ההמונים, ולדיגיטלית בפרט, תפקיד מרכזי בתהליך.',
       '<b>לוקליזציה:</b> תהליך היווצרות של תכנים תקשורתיים המדגישים את ההיבטים המקומיים הייחודיים. המטרה לשמר את התרבות המקומית ולצמצם את השפעת התרבות הגלובלית.',
       '<b>בעמודי השער בא לידי ביטוי המושג גלובליזציה</b> — עיתונים מכל רחבי העולם עוסקים כולם בנושא שיבת החטופים. <span class="hint">תתקבל גם תשובה המתייחסת לכך שהתוכן הלוקלי הופך לגלובלי.</span>'],
  tag:'זירה 2 — גלובליזציה, לוקליזציה'},
 {k:'ב',pts:7,split:[['60%','הסבר התיאוריה'],['40%','שתי דוגמאות']],
  ans:['<b>תיאוריית סדר היום:</b> הבולטות שהתקשורת נותנת לסוגיה מסוימת בהשוואה לאחרות משפיעה על קהל הצופים — סוגיה מובלטת תיתפס כחשובה יותר.',
       '<b>דוגמה 1:</b> הידיעה על שובם של החטופים הופיעה בכותרת הראשית ובמיקום המרכזי ביותר בעיתון.',
       '<b>דוגמה 2:</b> בשערים שובצו תמונות גדולות של החטופים ושל רגעי החזרה, מה שמעצים את בולטות האירוע ומפנה אליו את תשומת לב הקוראים.'],
  tag:'זירת העל — תיאוריית סדר היום'}]},

q9:{n:9,pts:12,t:'התוכנית "מה שתגידו"',parts:[
 {k:'א',pts:5,split:[['60%','הסבר המודל'],['40%','הסבר השוני בין התגובות']],
  ans:['<b>המודל התרבותי־סמיוטי (פיסק):</b> מתמקד בפענוח המסרים התקשורתיים. נמענים שונים יפרשו את אותם טקסטים באופן אחר, בהתאם למאפיינים תרבותיים וחברתיים — גיל, מוצא, מין, מעמד, ידע, מקום מגורים.',
       '<b>הסבר:</b> אותה תוכנית מובילה לפרשנויות שונות מפני שלכל עיתונאי ציפיות אחרות מסאטירה, טעם אישי שונה ותפיסת עולם שונה בנוגע לתפקידה של ביקורת הומוריסטית.'],
  tag:'זירה 1 — מודל תרבותי־סמיוטי'},
 {k:'ב',pts:7,split:[['50%','הסבר חמשת התפקידים'],['50%','שני תפקידים ודוגמה לכל אחד (25% לכל תפקיד ודוגמה)']],
  ans:['<b>1. סיקור ודיווח</b> — מסירת מידע על אירועים המתרחשים בחברה.',
       '<b>2. תיאום וקישור</b> — פרשנות, ארגון המציאות ויצירת משמעות לאירועים.',
       '<b>3. המשכיות</b> — שימור והעברת ערכים ונורמות חברתיות.',
       '<b>4. בידור</b> — סיפוק הנאה והפוגה.',
       '<b>5. גיוס</b> — עידוד הציבור לפעול למען מטרות חברתיות או לאומיות.',
       '<b>בידור</b> — התוכנית מצחיקה את הצופים ומספקת נחמה ואפשרות להתאושש מהעצב ומההלם.',
       '<b>תיאום וקישור</b> — מסכמת את אירועי השבוע ומגיבה בביקורתיות ובהומור, מעניקה פרשנות למציאות ומסייעת להבין את האירועים.'],
  tag:'זירה 1 — תפקידי התקשורת'}]},

q10:{n:10,pts:6,t:'נתוני רייטינג',parts:[
 {k:'',pts:6,split:[['70%','הסבר "רייטינג"'],['30%','מסקנה מהנתונים']],
  ans:['<b>רייטינג:</b> מדד שיעורי צפייה המבטא את אחוז הצופים שצפו בתוכנית מסוימת ברצועת זמן מסוימת.',
       '<b>מסקנות אפשריות:</b> תוכניות ריאליטי זוכות לרייטינג הגבוה ביותר · תוכניות ראיונות אישיים זוכות לרייטינג נמוך · ערוץ 12 מוביל וערוץ 11 אחרון · ערוץ 14 זוכה ליותר רייטינג מהשידור הציבורי · התוכנית הנמוכה ביותר זוכה לשלושה אחוזים.'],
  tag:'זירה 9 — רייטינג'}]},

q11:{n:11,pts:6,t:'נאום טראמפ בכנסת',parts:[
 {k:'',pts:6,split:[['30%','הסבר "דנוטציה"'],['30%','הסבר "קונוטציה"'],['40%','תיאור הקונוטציה']],
  ans:['<b>דנוטציה:</b> תיאור האובייקטים שבתצלום — המסר הגלוי והישיר.',
       '<b>קונוטציה:</b> פרשנות סובייקטיבית ומשמעויות תרבותיות־חברתיות העולות מהתצלום.',
       '<b>קונוטציות אפשריות:</b> מכבדים את נשיא ארה"ב — כולם עומדים ומוחאים כפיים · מעמד חריג וחגיגי · מעמד רשמי — דגל וסמל המדינה ברקע · דירוג בחשיבות — החשובים עומדים גבוה יותר · ישראל וארה"ב ביחסים טובים. <span class="hint">תתקבל כל פרשנות קונוטטיבית הגיונית ומבוססת.</span>'],
  tag:'זירה 3 — דנוטציה, קונוטציה'}]},

q12:{n:12,pts:6,t:'משפיענית ותוכן ממומן',parts:[
 {k:'',pts:6,split:[['30%','הסבר "אושיית רשת"'],['30%','הסבר "תוכן ממומן"'],['40%','הקשר בין המושגים']],
  ans:['<b>אושיית רשת:</b> אדם שצבר מספר רב של עוקבים ברשתות החברתיות, ויש לו מעמד והשפעה על עיצוב דעת הקהל.',
       '<b>תוכן ממומן:</b> שילוב מכוון של מסרים מסחריים בתוכני מדיה, באופן שאינו מצהיר על עצמו בגלוי כ"פרסומת".',
       '<b>הקשר:</b> דניאל עמית היא אושיית רשת עם מאות אלפי עוקבים ובעלת סמכות בנושא אוכל. בתצלום היא מחזיקה פיצה של רשת מסוימת, מאחוריה שם הרשת והיא אומרת "זו הפיצה שלי" — למעשה פרסומת, בלי להיות מוגדרת ככזו.'],
  tag:'זירה 5 — אושיות רשת; זירה 9 — תוכן ממומן'}]},

q13:{n:13,pts:6,t:'ילידים ומהגרים דיגיטליים',parts:[
 {k:'',pts:6,split:[['60%','הסבר ושימוש במושג אחד']],
  ans:['<b>ילידים דיגיטליים:</b> אנשים שנולדו בעידן הדיגיטלי, בקיאים בתפעול מכשירים דיגיטליים ומעדיפים להשתמש באמצעים דיגיטליים.',
       '<b>מהגרים דיגיטליים:</b> אנשים מבוגרים יותר שלא נולדו בעידן הדיגיטלי; ההון הדיגיטלי שלהם מצומצם והם מתקשים יותר לתפעל כלי תקשורת דיגיטליים.',
       '<b>הכותרת מציגה תמונה שונה:</b> היא טוענת שגם למבוגרים, שהם מהגרים דיגיטליים, יש בעיית מסכים — כלומר גם המהגרים מפתחים תלות בסמארטפונים.'],
  tag:'זירה 5 — ילידים ומהגרים דיגיטליים'}]},

q14:{n:14,pts:6,t:'שבוע הנערה הישראלית',parts:[
 {k:'',pts:6,split:[['60%','הסבר "תהליך החברות"'],['40%','השפעה אפשרית של הקמפיין']],
  ans:['<b>תהליך החִברות (סוציאליזציה):</b> תהליך מתמשך של למידת נורמות חברתיות.',
       '<b>השפעה 1:</b> הקמפיין יכול להבהיר לבני הנוער שנערות צעירות יכולות להגיע למשרות, לעמדות ולתפקידים בכירים שאליהם הן שואפות.',
       '<b>השפעה 2:</b> החיבור בין דמות ציבורית בעלת מעמד לבין נערה "רגילה" שחולמת להגיע לתפקיד כזה מעביר מסר ש"העולם מחכה להם", ומעודד נערות לחלום בגדול ולשאוף להגשים.'],
  tag:'זירה 5 — תהליך החברות ותפקידה של התקשורת'}]}

async function sb(q){const r=await fetch(SUP+'/rest/v1/'+q,{headers:{apikey:SKEY,Authorization:'Bearer '+SKEY}});
  if(!r.ok)throw new Error(r.status);return r.json();}
function tPhoneNorm(s){let p=String(s||'').replace(/\D/g,'');p=p.replace(/^00+/,'');
  if(p.indexOf('972')===0)p=p.slice(3);p=p.replace(/^0+/,'');return p?('0'+p):'';}

function gate(){
  el('app').innerHTML=`<div class="mid">
    <h1 class="big">מחוון</h1>
    <p class="lead">תקשורת וחברה · שאלון 788381 · קיץ תשפ"ו</p>
    <div class="card">
      <div class="warn">מסמך למורים. הכניסה מוגבלת כדי שהתשובות לא ייחשפו לתלמידים.</div>
      <input id="ph" type="tel" dir="ltr" style="text-align:right;margin-bottom:9px" placeholder="טלפון">
      <input id="pw" type="password" style="margin-bottom:11px" placeholder="סיסמה">
      <button class="btn" onclick="go()">כניסה ←</button>
      <div id="e"></div>
    </div></div>`;
  document.addEventListener('keydown',k=>{if(k.key==='Enter'&&el('ph'))go();});
}
async function go(){
  const ph=tPhoneNorm(el('ph').value), pw=el('pw').value, e=el('e');
  e.innerHTML='';
  if(!ph||!pw){e.innerHTML='<div class="err">נא למלא טלפון וסיסמה.</div>';return;}
  try{
    const rows=await sb('lms_teachers?select=id,name,password,status&phone='+encodeURIComponent('eq.'+ph));
    const t=(rows||[]).find(x=>x.password===pw&&x.status==='approved');
    if(!t){e.innerHTML='<div class="err">טלפון/סיסמה שגויים או שאינך מאושר.</div>';return;}
    show(t.name||'');
  }catch(err){e.innerHTML='<div class="err">שגיאה: '+esc(err.message)+'</div>';}
}
function show(name){
  el('app').innerHTML=`
  <div class="top noprint"><div class="topin">
    <b>📗 מחוון · 788381</b>
    <span class="hint">${esc(name)}</span>
    <span style="margin-inline-start:auto;display:flex;gap:8px">
      <button class="btn" onclick="openAll(1)">פתיחת הכול</button>
      <button class="btn" style="background:#efe9e0;color:var(--ink)" onclick="openAll(0)">סגירה</button>
      <button class="btn" style="background:#efe9e0;color:var(--ink)" onclick="window.print()">🖨 הדפסה</button>
    </span></div></div>
  <div class="wrap">
    <div class="warn noprint">אחוזי הניקוד הם מתוך ניקוד הסעיף. לדוגמה: סעיף של 11 נקודות עם רכיב של 70% שווה 7.7 נקודות.</div>
    ${SECMAP.map(secHtml).join('')}
  </div>`;
}
function secHtml(s){
  return `<div class="sec"><h2>${esc(s.t)}</h2><p>${esc(s.note)}</p></div>`+
    s.q.map(qHtml).join('');
}
function qHtml(k){
  const q=MAHVAN[k];
  return `<div class="q" id="q_${k}">
    <div class="qh" onclick="tg('${k}')">
      <span class="qn">${q.n}</span>
      <span class="qt">${esc(q.t)}</span>
      <span class="qp">${q.pts} נק׳ · ${q.parts.length} סעיפים</span>
      <span class="arr">▾</span></div>
    <div class="qb">${q.parts.map(ptHtml).join('')}</div></div>`;
}
function ptHtml(p){
  return `<div class="pt">
    <div class="ph">${p.k?`<span class="pk">${p.k}</span>`:''}<span class="pp">${p.pts} נקודות</span></div>
    <div class="split">${p.split.map(x=>`<b>${x[0]} — ${esc(x[1])}</b>`).join('')}</div>
    ${p.ans.map(a=>`<div class="ans">${a}</div>`).join('')}
    <div class="tag">${esc(p.tag)}</div></div>`;
}
function tg(k){const e=el('q_'+k);e.classList.toggle('open');}
function openAll(v){document.querySelectorAll('.q').forEach(x=>v?x.classList.add('open'):x.classList.remove('open'));}
gate();

</script>
</body>
</html>
