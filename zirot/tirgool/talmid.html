<!DOCTYPE html>
<!-- zirot/tirgool/talmid.html · v1.0.0 · 2026-07-25 · אזור אישי לתלמיד: המטלות שהוקצו לכיתה, מה הוגש, ציון ומשוב. כניסה בקישור כיתה + בחירת שם מהרשימה. ?code=&class= -->
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>המטלות שלי · הכל בכף היד</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&family=Secular+One&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1a3d;--soft:#6a6490;--line:#eae5f7;--bg:#f7f5fc;--paper:#fff;
  --v:#7040d8;--vw:#f3edfe;--vd:#4f2ba3;--ok:#16a34a;--okw:#eafaf1;--warn:#e08519;--warnw:#fff4e4;--bad:#dc2626;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'Heebo',sans-serif;color:var(--ink);line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 70px}

/* רצועת קרדיט */
.rbz{background:#fff;border-bottom:1px solid var(--line)}
.rbz .in{max-width:760px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:12px}
.rbz a.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink)}
.rbz .nm{font-weight:900;font-size:.86rem;line-height:1.15}
.rbz .sg{font-size:.72rem;font-weight:700;color:var(--v);line-height:1.15}
.rbz .by{margin-inline-start:auto;font-size:.74rem;font-weight:700;color:var(--soft);white-space:nowrap}
.rbz .by b{color:var(--ink);font-weight:900}
@media(max-width:560px){.rbz .sg{display:none}}

.hero{padding:26px 0 16px}
.hero .kick{font-size:.74rem;font-weight:900;letter-spacing:.12em;color:var(--soft)}
h1{font-family:'Secular One',sans-serif;font-size:1.9rem;margin:8px 0 4px}
.hero p{margin:0;color:#454069}

.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px 22px;margin-bottom:14px}
.pick{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pick select{flex:1;min-width:190px;padding:12px;border:1px solid #ddd;border-radius:12px;font-family:inherit;font-size:1rem}
.btn{background:var(--v);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-family:inherit;
  font-weight:900;font-size:.97rem;cursor:pointer}
.btn:hover{background:var(--vd)}
.btn.ghost{background:#fff;color:var(--vd);border:2px solid var(--line);padding:9px 16px;font-size:.86rem}

.me{display:flex;align-items:center;gap:11px;background:var(--vw);border-radius:16px;padding:12px 16px;margin-bottom:14px}
.me .av{width:40px;height:40px;border-radius:50%;background:var(--v);color:#fff;display:flex;align-items:center;
  justify-content:center;font-weight:900;font-size:1.1rem;flex:0 0 auto}
.me b{font-size:1.02rem}
.me .cl{font-size:.82rem;color:var(--soft);font-weight:700}
.me .sw{margin-inline-start:auto}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:13px 10px;text-align:center}
.kpi b{display:block;font-family:'Secular One',sans-serif;font-size:1.5rem;line-height:1.2}
.kpi span{font-size:.72rem;color:var(--soft);font-weight:800}
.kpi.g b{color:var(--ok)} .kpi.w b{color:var(--warn)}

.task{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:11px;
  display:flex;gap:14px;align-items:flex-start;transition:.16s}
.task:hover{border-color:var(--v)}
.task.done{border-color:#cdebd9;background:#fbfefc}
.task .ic{font-size:1.7rem;line-height:1;flex:0 0 auto}
.task .body{flex:1;min-width:0}
.task h3{font-family:'Secular One',sans-serif;font-size:1.06rem;margin:0 0 3px}
.task .sub{font-size:.8rem;color:var(--soft);font-weight:700;margin-bottom:8px}
.task .go{flex:0 0 auto;align-self:center}
.pill{display:inline-block;font-size:.74rem;font-weight:900;border-radius:20px;padding:3px 11px;margin-inline-end:6px}
.p-wait{background:#f2f0f9;color:var(--soft)}
.p-sent{background:var(--vw);color:var(--vd)}
.p-ok{background:var(--okw);color:#0f7a4d}
.p-warn{background:var(--warnw);color:#a85f08}
.fb{margin-top:9px;background:#fbfaff;border-inline-start:3px solid var(--v);border-radius:0 10px 10px 0;
  padding:9px 12px;font-size:.9rem;color:#3d3860}
.fb b{color:var(--vd)}
.empty{text-align:center;color:var(--soft);padding:26px 10px}
.empty .e{font-size:2.4rem;display:block;margin-bottom:8px}
.err{background:#fdf2f4;border:1px solid #f5c2c7;color:#9f1239;border-radius:14px;padding:14px 16px;font-size:.93rem}
.load{text-align:center;color:var(--soft);padding:30px}
</style>
</head>
<body>
<div class="rbz"><div class="in">
  <a class="brand" href="start.html">
    <svg width="30" height="30" viewBox="0 0 32 32" role="img" aria-label="לוגו">
      <circle cx="6" cy="6" r="2.7" fill="#dcd6ef"/><circle cx="16" cy="6" r="2.7" fill="#7040d8"/>
      <circle cx="26" cy="6" r="2.7" fill="#dcd6ef"/><circle cx="6" cy="16" r="2.7" fill="#e08519"/>
      <circle cx="26" cy="16" r="2.7" fill="#e08519"/><circle cx="6" cy="26" r="2.7" fill="#dcd6ef"/>
      <circle cx="16" cy="26" r="2.7" fill="#7040d8"/><circle cx="26" cy="26" r="2.7" fill="#dcd6ef"/>
      <circle cx="16" cy="16" r="4.3" fill="#1d1a3d"/></svg>
    <span><span class="nm">הכל בכף היד · שיעורים אינטראקטיביים</span><br>
    <span class="sg">ללמוד לרוחב, לחשוב לעומק</span></span>
  </a>
  <span class="by">פותח ע״י <b>רני בן זאב</b></span>
</div></div>

<div class="wrap">
  <header class="hero">
    <div class="kick">אזור אישי</div>
    <h1>המטלות שלי</h1>
    <p id="sub">טוען…</p>
  </header>
  <div id="app"><div class="load">טוען…</div></div>
</div>

<script>
const SUP="https://eubgzfkkovxgijhrmnif.supabase.co";
const SKEY="sb_publishable_vJ768fOwYWiDWeYsBBR45g_4NM4s55p";
const HDR={apikey:SKEY,Authorization:'Bearer '+SKEY};
async function sb(q){
  const r=await fetch(SUP+'/rest/v1/'+q,{headers:HDR});
  if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,160));
  return r.json();
}
const P=new URLSearchParams(location.search);
const CODE=P.get('code')||'', CLS=P.get('class')||'';
const norm=s=>String(s||'').replace(/\s+/g,' ').trim();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LSK='talmid_'+CODE+'_'+CLS;

let roster=[], asg=[], subs=[], me=localStorage.getItem(LSK)||'';

function fail(msg){
  document.getElementById('sub').textContent='';
  document.getElementById('app').innerHTML='<div class="err">'+msg+'</div>';
}

async function boot(){
  if(!CODE||!CLS){
    fail('הקישור חסר פרטי כיתה. בקשו מהמורה את קישור הכיתה המעודכן.');return;
  }
  document.getElementById('sub').textContent='כיתה '+CLS;
  try{
    const cls=await sb('lms_classes?select=students&teacher_id=eq.'+encodeURIComponent(CODE)+
                       '&name=eq.'+encodeURIComponent(CLS));
    roster=((cls[0]||{}).students||[]).map(norm).filter(Boolean);
    asg=await sb('lms_assignments?select=*&teacher_id=eq.'+encodeURIComponent(CODE)+
                 '&class_name=eq.'+encodeURIComponent(CLS)+'&active=eq.true&order=created_at.asc');
  }catch(e){ fail('שגיאה בטעינת נתוני הכיתה: '+esc(e.message)); return; }

  if(!roster.length){
    fail('רשימת התלמידים של הכיתה עדיין ריקה. בקשו מהמורה להוסיף את השמות.');return;
  }
  if(me&&!roster.some(r=>norm(r)===norm(me)))me='';
  me?showTasks():showPicker();
}

function showPicker(){
  document.getElementById('app').innerHTML=`
    <div class="card">
      <h3 style="margin:0 0 4px;font-family:'Secular One',sans-serif;">מי אתם?</h3>
      <p style="margin:0 0 14px;color:var(--soft);font-size:.92rem;">בחרו את שמכם מרשימת הכיתה. תזכרו במכשיר הזה.</p>
      <div class="pick">
        <select id="who"><option value="">— בחרו שם —</option>
          ${roster.map(s=>`<option>${esc(s)}</option>`).join('')}</select>
        <button class="btn" onclick="pick()">כניסה ←</button>
      </div>
    </div>`;
}
function pick(){
  const v=document.getElementById('who').value;
  if(!v)return;
  me=v; localStorage.setItem(LSK,v); showTasks();
}
function switchMe(){ localStorage.removeItem(LSK); me=''; showPicker(); }

async function showTasks(){
  document.getElementById('app').innerHTML='<div class="load">טוען את המטלות…</div>';
  try{
    subs=await sb('lms_submissions?select=*&teacher_id=eq.'+encodeURIComponent(CODE)+
                  '&class_name=eq.'+encodeURIComponent(CLS)+
                  '&student_key=eq.'+encodeURIComponent(norm(me))+'&order=submitted_at.desc');
  }catch(e){ subs=[]; }

  const last={};
  subs.forEach(s=>{ if(!last[s.topic])last[s.topic]=s; });

  const done=asg.filter(a=>last[a.topic]).length;
  const graded=asg.filter(a=>last[a.topic]&&last[a.topic].grade!=null).length;
  const initials=me.split(' ').map(w=>w[0]).slice(0,2).join('');

  const rows=asg.map(a=>{
    const s=last[a.topic];
    const url=a.page+'?code='+encodeURIComponent(CODE)+'&class='+encodeURIComponent(CLS)+
              (a.concept?('&c='+encodeURIComponent(a.concept)):'');
    let pills='', fb='', ic='📝', cls='';
    if(!s){ pills='<span class="pill p-wait">טרם הוגש</span>'; }
    else{
      cls='done'; ic='✅';
      const d=new Date(s.submitted_at);
      const dt=d.toLocaleDateString('he-IL')+' '+d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
      pills='<span class="pill p-sent">הוגש · '+dt+'</span>';
      if(s.score_auto!=null&&s.score_max)
        pills+='<span class="pill p-ok">מבדק '+s.score_auto+'/'+s.score_max+'</span>';
      if(s.grade!=null) pills+='<span class="pill p-ok">ציון '+s.grade+'</span>';
      else pills+='<span class="pill p-warn">ממתין לבדיקת המורה</span>';
      if(s.feedback) fb='<div class="fb"><b>משוב המורה:</b> '+esc(s.feedback)+'</div>';
    }
    return `<div class="task ${cls}">
      <span class="ic">${ic}</span>
      <div class="body">
        <h3>${esc(a.title||a.topic)}</h3>
        <div class="sub">${esc(a.page.replace('.html',''))}</div>
        <div>${pills}</div>${fb}
      </div>
      <a class="go btn ${s?'ghost':''}" href="${esc(url)}">${s?'פתחו שוב':'התחלה ←'}</a>
    </div>`;
  }).join('');

  document.getElementById('sub').textContent='כיתה '+CLS;
  document.getElementById('app').innerHTML=`
    <div class="me"><span class="av">${esc(initials)}</span>
      <span><b>${esc(me)}</b><div class="cl">כיתה ${esc(CLS)}</div></span>
      <button class="btn ghost sw" onclick="switchMe()">לא אני</button></div>
    <div class="kpis">
      <div class="kpi"><b>${asg.length}</b><span>מטלות</span></div>
      <div class="kpi g"><b>${done}</b><span>הוגשו</span></div>
      <div class="kpi w"><b>${asg.length-done}</b><span>ממתינות לכם</span></div>
    </div>
    ${asg.length?rows:'<div class="card empty"><span class="e">🎈</span>המורה עדיין לא הקצה מטלות לכיתה.</div>'}`;
}
boot();
</script>
</body>
</html>
