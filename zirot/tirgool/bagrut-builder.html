<style>
:root{--a:#6d28d9;--b:#b45309;--ink:#1f2340;--soft:#6a6f8a;--bg:#f7f6fc;--line:#e7e4f3;--ok:#12b76a;--no:#dc2626;--warn:#c98a12}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Assistant',sans-serif;font-size:16px;line-height:1.65;padding-bottom:60px}

.qt{flex:1;font-weight:800}

 {z:"7",n:"הגדרות ותכנים",c:["קליפ מוזיקלי", "סרטוני רשת קצרים", "הבנייה חברתית של המציאות", "חִברות (סוציאליזציה)", "גישת השימושים והסיפוקים", "דנוטציה", "קונוטציה", "מין ומגדר", "ייצוג מגדרי", "סטריאוטיפ", "הכחדה סימבולית"]},
 {z:"8",n:"תקשורת וספורט",c:["גישת השימושים והסיפוקים", "אירוע מדיה", "לאומיות וזהות לאומית", "מין ומגדר", "ייצוג מגדרי", "הכחדה סימבולית"]},
 {z:"9",n:"פרסום",c:["פרסום", "קמפיין פרסום מסחרי", "קמפיין פרסום חברתי", "פניית מסר רגשית", "פניית מסר שכלית", "סטריאוטיפ", "ייצוג מגדרי", "פרסום סמוי", "תוכן ממומן", "שיווק דיגיטלי", "תרבות הצריכה", "רייטינג", "אתיקה בפרסום", "אקטיביזם חברתי"]},
 {z:"al",n:"זירת העל",c:["חופש ביטוי", "הבנייה חברתית של המציאות", "גלובליזציה", "שימושים וסיפוקים", "ייצוג, מיעוטים ופלורליזם", "אתיקה", "דטרמיניזם טכנולוגי", "תפקידי התקשורת", "סדר היום", "דנוטציה וקונוטציה", "הגמוניה", "אלימות והסתה בתקשורת", "היברידיות וטשטוש גבולות", "בינה מלאכותית", "שידור ציבורי", "תקשורת ואחריות חברתית"]},
];
/* ===== מנוע שלד הבחינה — ארכיטיפים, חשבון ניקוד וסכימת מחוון =====
   סכימת המחוון (משותפת לגנרטור ולבודק האוטומטי):
   part.rubric = [{k:'שם הרכיב', pct:50, need:'מה נדרש כדי לקבל את הרכיב'}, ...]  סכום pct = 100
   part.fallback = [{pct:50,when:'...'},...]   סולמות נפילה (בדילמה: מושג אחד / ללא מושגים)
   part.concepts = ['מושג','מושג']   רשימת המושגים שהתלמיד נדרש לשלב
   part.need = 2                      כמה מהם חובה
*/

/* ---------- בנק הארכיטיפים ---------- */
const ARCH=[
{id:'def_demo',name:'הגדרה + חשיבות במדינה דמוקרטית',pts:[5,6,7],needC:1,stim:false,
 q:c=>`הסבירו מהו <b>${c[0]}</b> ומה חשיבותו במדינה דמוקרטית.`,
 rubric:c=>[{k:`הסבר המושג "${c[0]}"`,pct:50},{k:'חשיבות במדינה דמוקרטית',pct:50}]},

{id:'def_example',name:'הגדרה + הדגמה מהקטע',pts:[6,7],needC:1,stim:true,
 q:c=>`הסבירו מהו <b>${c[0]}</b>.<br>הדגימו על פי הקטע כיצד הוא בא לידי ביטוי.`,
 rubric:c=>[{k:`הסבר המושג "${c[0]}"`,pct:50},{k:'הדגמה מהקטע',pct:50}]},

{id:'def_conclude',name:'הגדרה + מסקנה מהנתונים',pts:[6],needC:1,stim:true,
 q:c=>`הסבירו מהו <b>${c[0]}</b>, והציגו מסקנה אפשרית <b>אחת</b> העולה מן הנתונים שלפניכם.`,
 rubric:c=>[{k:`הסבר המושג "${c[0]}"`,pct:70},{k:'מסקנה מנומקת מן הנתונים',pct:30}]},

{id:'two_link',name:'שני מושגים + הקשר ביניהם',pts:[6],needC:2,stim:true,
 q:c=>`כתבו מהו <b>${c[0]}</b> ומהו <b>${c[1]}</b>.<br>הסבירו את הקשר בין שני המושגים כפי שהוא בא לידי ביטוי בנספח.`,
 rubric:c=>[{k:`הסבר "${c[0]}"`,pct:30},{k:`הסבר "${c[1]}"`,pct:30},{k:'הקשר בין המושגים בנספח',pct:40}]},

{id:'def_determine',name:'הגדרה + קביעה + נימוק',pts:[6],needC:1,stim:true,
 q:c=>`הסבירו מהו <b>${c[0]}</b>. בהתבסס על הקטע, כתבו האם המקרה המתואר הוא ${c[0]}, ונמקו את תשובתכם.`,
 rubric:c=>[{k:`הסבר המושג "${c[0]}"`,pct:40},{k:'קביעה',pct:10},{k:'נימוק מבוסס על הקטע',pct:50}]},

{id:'two_features',name:'שני מאפיינים + השפעתם',pts:[5,6],needC:1,stim:true,
 q:c=>`הסבירו <b>שני</b> מאפיינים של <b>${c[0]}</b>. כתבו כיצד כל אחד מהמאפיינים האלה בא לידי ביטוי בקטע.`,
 rubric:c=>[{k:'הסבר שני מאפיינים',pct:50},{k:'כיצד כל מאפיין בא לידי ביטוי',pct:50}]},

{id:'choose_three',name:'בחרו שלושה והסבירו',pts:[6],needC:1,stim:true,
 q:c=>`בחרו <b>שלושה</b> מבין המרכיבים של <b>${c[0]}</b>, והסבירו על פיהם את המקרה המתואר בקטע.`,
 rubric:c=>[{k:'מרכיב ראשון והסבר',pct:33},{k:'מרכיב שני והסבר',pct:33},{k:'מרכיב שלישי והסבר',pct:34}]},

{id:'two_diffs',name:'שני הבדלים + שיוך ונימוק',pts:[7],needC:2,stim:true,
 q:c=>`כתבו <b>שני</b> הבדלים בין <b>${c[0]}</b> ל<b>${c[1]}</b>.<br>לאיזה מבין השניים משתייך המקרה שבקטע? נמקו את תשובתכם על פי הקטע.`,
 rubric:c=>[{k:'שני הבדלים נכונים',pct:40},{k:'קביעה ונימוק על פי הקטע',pct:60}]},

{id:'explain_apply',name:'הסבר מושג + יישום על הקטע',pts:[5,6,7],needC:1,stim:true,
 q:c=>`הסבירו את המושג <b>${c[0]}</b>, וכתבו כיצד הוא מסביר את התופעה המתוארת בקטע.`,
 rubric:c=>[{k:`הסבר המושג "${c[0]}"`,pct:50},{k:'יישום על הקטע',pct:50}]},

{id:'two_advantages',name:'שני יתרונות עם מושגים',pts:[7],needC:2,stim:true,use:2,
 q:c=>`הסבירו <b>שני</b> יתרונות העולים מן הקטע.`,
 rubric:c=>[{k:'יתרון ראשון הכולל שימוש במושג',pct:50},{k:'יתרון שני הכולל שימוש במושג',pct:50}]},

{id:'danger',name:'הסבר סכנה/בעיה עם מושג',pts:[5],needC:1,stim:true,use:1,
 q:c=>`הסבירו את הסכנה העולה מן הקטע.`,
 rubric:c=>[{k:'הסבר הסכנה תוך שימוש במושג',pct:100}]},

{id:'dilemma',name:'דילמה (סעיף ג׳)',pts:[11],needC:3,stim:false,use:2,dilemma:true,
 q:c=>`דונו בדילמה העולה מן הנושא: האם ראוי לנקוט בעמדה האחת, <b>או</b> בעמדה שכנגד.`,
 sub:['הציגו את <b>שתי</b> האפשרויות של הדילמה, וכתבו <b>יתרון</b> ו<b>חיסרון</b> לכל אחת מהן.','כתבו מהי הכרעתכם, ונמקו אותה.'],
 rubric:c=>[{k:'דיון בדילמה ושימוש בשני מושגים',pct:70},{k:'הכרעה ונימוק',pct:30}],
 fallback:[{pct:50,when:'דיון בדילמה ושימוש במושג אחד'},{pct:30,when:'דיון בדילמה ללא שימוש במושגים'}]}
];
const byId=id=>ARCH.find(a=>a.id===id);

/* ---------- פריסות ניקוד חוקיות ---------- */
const SPLITS={A:[[7,5,11],[5,7,11],[6,6,11]], B:[[5,7],[6,6],[7,5]], C:[[6]]};

/* ---------- בורר ארכיטיפים ---------- */
function fitFor(pts,isLast,secId){
  if(secId==='A'&&isLast)return [byId('dilemma')];
  return ARCH.filter(a=>!a.dilemma&&a.pts.indexOf(pts)>-1);
}

/* מחולל דטרמיניסטי עם זרע — אותו זרע מחזיר אותו מבחן */
function rng(seed){let s=seed>>>0||1;return function(){s^=s<<13;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
function pickFrom(arr,r){return arr[Math.floor(r()*arr.length)%arr.length];}

/* ---------- בניית שלד ---------- */
function buildBlueprint(opts){
  const concepts=(opts.concepts||[]).slice();
  if(concepts.length<4)throw new Error('צריך לפחות 4 מושגים כדי לבנות מבחן');
  const r=rng(opts.seed||Date.now());
  const pool=concepts.slice();
  let ci=0;
  const nextC=n=>{const out=[];for(let i=0;i<n;i++){out.push(pool[ci%pool.length]);ci++;}return out;};

  const layout=[{sec:'A',count:4,pts:23},{sec:'B',count:5,pts:12},{sec:'C',count:5,pts:6}];
  const questions={}, sections=[];
  let qn=0;

  layout.forEach(function(L){
    const keys=[];
    for(let i=0;i<L.count;i++){
      qn++;
      const split=pickFrom(SPLITS[L.sec],r);
      const parts=split.map(function(p,pi){
        const isLast=pi===split.length-1;
        const cands=fitFor(p,isLast,L.sec);
        const a=pickFrom(cands,r);
        const cs=nextC(a.needC);
        const part={arch:a.id,archName:a.name,k:split.length>1?['א','ב','ג'][pi]:'',pts:p,
          q:a.q(cs),concepts:cs,stim:!!a.stim,
          rubric:a.rubric(cs).map(x=>Object.assign({},x))};
        if(a.sub)part.sub=a.sub.slice();
        if(a.use){part.use=a.use;part.pool=uniq(cs.concat(nextC(Math.max(0,4-cs.length))));}
        if(a.fallback)part.fallback=a.fallback.map(x=>Object.assign({},x));
        return part;
      });
      const key='g'+qn;
      questions[key]={n:qn,pts:L.pts,title:'',src:null,parts:parts};
      keys.push(key);
    }
    if(L.sec==='A'){
      sections.push({id:'A',title:'פרק ראשון',pts:46,
        note:'ענו על <b>שתי</b> שאלות: אחת מבין 1–2, ואחת מבין 3–4 (לכל שאלה — 23 נקודות).',
        groups:[{pick:1,from:keys.slice(0,2),label:'אחת מבין שאלות 1–2'},
                {pick:1,from:keys.slice(2,4),label:'אחת מבין שאלות 3–4'}]});
    }else if(L.sec==='B'){
      sections.push({id:'B',title:'פרק שני',pts:36,
        note:'ענו על <b>שלוש</b> מבין השאלות 5–9 (לכל שאלה — 12 נקודות).',
        groups:[{pick:3,from:keys,label:'שלוש מבין שאלות 5–9'}]});
    }else{
      sections.push({id:'C',title:'פרק שלישי',pts:18,
        note:'ענו על <b>שלוש</b> מבין השאלות 10–14 (לכל שאלה — 6 נקודות).',
        groups:[{pick:3,from:keys,label:'שלוש מבין שאלות 10–14'}]});
    }
  });
  return {title:opts.title||'מבחן בתקשורת וחברה',seed:opts.seed||0,
          arenas:opts.arenas||[],concepts:concepts,sections:sections,questions:questions};
}
function uniq(a){const s=[],m={};a.forEach(x=>{if(!m[x]){m[x]=1;s.push(x);}});return s;}

/* ---------- אימות ---------- */
function validate(ex){
  const errs=[];
  let tot=0;
  ex.sections.forEach(function(s){
    tot+=s.pts;
    let need=0; s.groups.forEach(g=>need+=g.pick);
    const per=s.groups.flatMap(g=>g.from).map(k=>ex.questions[k].pts);
    per.forEach(p=>{ if(p*need!==s.pts&&s.groups.length===1)errs.push(s.id+': ניקוד שאלה '+p+' × '+need+' ≠ '+s.pts); });
    s.groups.flatMap(g=>g.from).forEach(function(k){
      const q=ex.questions[k];
      const sum=q.parts.reduce((a,p)=>a+p.pts,0);
      if(sum!==q.pts)errs.push('שאלה '+q.n+': סכום סעיפים '+sum+' ≠ '+q.pts);
      q.parts.forEach(function(p){
        const rs=p.rubric.reduce((a,x)=>a+x.pct,0);
        if(rs!==100)errs.push('שאלה '+q.n+p.k+': סכום המחוון '+rs+'% ≠ 100%');
        if(!p.q||!p.q.trim())errs.push('שאלה '+q.n+p.k+': אין ניסוח');
      });
    });
  });
  if(tot!==100)errs.push('סך הפרקים '+tot+' ≠ 100');
  const secA=ex.sections.find(s=>s.id==='A');
  if(secA)secA.groups.flatMap(g=>g.from).forEach(function(k){
    const last=ex.questions[k].parts.slice(-1)[0];
    if(!last||last.pts!==11)errs.push('שאלה '+ex.questions[k].n+': סעיף אחרון בפרק א׳ חייב להיות דילמה של 11 נק׳');
  });
  return errs;
}

/* ---------- AI ---------- */
async function ai(payload,mk){
  const m=el(mk); if(m){m.style.color='#666';m.textContent='מפיק…';}
  try{
    const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const j=await r.json();
    if(!r.ok||j.error)throw new Error(j.error||('שגיאה '+r.status));
    if(m){m.style.color='#0f7a4d';m.textContent='✓ הופק';}
    return j;
  }catch(e){ if(m){m.style.color='#b4453f';m.textContent='שגיאה: '+e.message.slice(0,90);} return null; }
}
async function aiSrc(k){
  const q=EX.questions[k];
  const cs=[...new Set(q.parts.flatMap(p=>p.concepts))];
  const j=await ai({action:'stimulus',concepts:cs,title:q.title,arenas:EX.arenas},'m_'+k);
  if(!j||!j.text)return;
  q.src={t:j.text,fake:true};
  if(j.title)q.title=j.title;
  step2();
}
async function aiPolish(k){
  const q=EX.questions[k];
  if(!q.src||!q.src.t){const m=el('m_'+k);m.style.color='#b4453f';m.textContent='קודם קטע גירוי';return;}
  const j=await ai({action:'phrase',stimulus:q.src.t,
    parts:q.parts.map(p=>({arch:p.arch,pts:p.pts,concepts:p.concepts,q:p.q}))},'m_'+k);
  if(!j||!Array.isArray(j.parts))return;
  j.parts.forEach((x,i)=>{ if(q.parts[i]&&x&&x.q)q.parts[i].q=x.q; });
  step2();
}

  m.style.color='#666';m.textContent='שומר…';
