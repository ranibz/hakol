<!DOCTYPE html>
<!-- galil/nochehut.html · v2.1.0 · 2026-08-09 · נוספה תצוגת סטטיסטיקה: טבלת מטריצה
     שבה התלמידים בשורות וההקראות בעמודות (תאריך ושעה), עם סיכום נוכח/חסר/איחור ואחוז
     נוכחות לכל תלמיד, שורת סיכום לכל הקראה, וייצוא CSV לאקסל (עם BOM לעברית תקינה).
     אחוז הנוכחות סופר איחור כנוכחות, בהתאם לטריגר במסד (MINOR).
     v2.0.0 · הקראת נוכחות למגמת תקשורת.
     שינויים מ-v1.0.0:
     · סימון במחזור לחיצות על השורה כולה: טרם סומן ← נוכח (ירוק) ← חסר (אדום) ←
       איחור (כתום) ← טרם סומן. לחיצה רביעית מבטלת, כדי שאפשר יהיה לתקן טעות.
     · כל הקראה היא אירוע נפרד ב-tiksh_att_sessions עם חותמת תאריך ושעה, ולא
       שורה יומית שנדרסת. שיעור ראשון ושיעור שלישי באותו יום חיים במקביל.
     · אחרי שעתיים ההקראה עוברת לארכיון אוטומטית — נעלמת מהתצוגה הפעילה ונצפית
       בלשונית "הקראות קודמות", ועדיין ניתנת לעריכה משם.
     · המורה מזוהה אוטומטית מ-?code= (מזהה מ-lms_teachers מול tiksh_groups.teacher_id),
       עם אפשרות להחליף מורה ידנית. מי שנכנס ישירות לכתובת בוחר מרשימה כמו קודם.
     · העמודה present נשארת ומתעדכנת בטריגר (איחור נחשב נוכחות) — עמודים אחרים
       שקוראים אותה לא נשברים.
     דורש: tiksh_att_sessions + העמודות session_id/status/taken_at ב-tiksh_attendance.
     MAJOR: מודל הנתונים של ההקראה השתנה. -->
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הקראת נוכחות · מגמת תקשורת</title>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--iyuni:#7c3aed;--maasi:#0d9488;--ink:#1f2340;--soft:#6a6f8a;--bg:#f7f6fc;--line:#e7e4f3;
  --ok:#12b76a;--no:#dc2626;--late:#e08600}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Assistant',sans-serif;
  font-size:17px;line-height:1.6;padding-bottom:104px}
h1,h2,h3{font-family:'Secular One',sans-serif;font-weight:400}
.top{background:linear-gradient(135deg,#4c1d95,#0f766e);color:#fff;padding:14px 0;position:sticky;top:0;z-index:30}
.topin{max-width:820px;margin:0 auto;padding:0 15px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.topin a{color:#fff;text-decoration:none;font-size:1.2rem;opacity:.85}
.topin h1{font-size:1.3rem;margin:0}
.topin .sb{opacity:.85;font-size:.85rem}
.wrap{max-width:820px;margin:0 auto;padding:16px 15px}
.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:19px 21px;margin-bottom:14px}
label{display:block;font-weight:800;font-size:.85rem;margin-bottom:5px}
select,input{font-family:inherit;font-size:1rem;border:1px solid #d8d5e8;border-radius:11px;
  padding:11px 13px;width:100%;background:#fff;color:var(--ink)}
.btn{background:var(--iyuni);color:#fff;border:0;border-radius:12px;padding:12px 24px;
  font-family:inherit;font-weight:800;font-size:.95rem;cursor:pointer}
.btn:hover{filter:brightness(.93)}
.btn.g{background:#f0eefa;color:var(--ink)} .btn.ok{background:var(--ok)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grp{background:#fff;border:2px solid var(--line);border-radius:15px;padding:14px 16px;margin-bottom:10px;
  cursor:pointer;display:flex;gap:12px;align-items:center;text-align:right;width:100%;font-family:inherit}
.grp:hover{border-color:var(--iyuni)}
.grp.iy{border-inline-start:6px solid var(--iyuni)} .grp.ma{border-inline-start:6px solid var(--maasi)}
.grp .x{flex:1}
.grp b{display:block;font-family:'Secular One',sans-serif;font-weight:400;font-size:1.1rem}
.grp span{color:var(--soft);font-size:.85rem}
.live{background:#e7f7ee;color:#0f7a4d;border-radius:20px;padding:2px 11px;font-size:.75rem;font-weight:800}
.past{background:#f1effb;color:var(--soft);border-radius:20px;padding:2px 11px;font-size:.75rem;font-weight:800}

/* ===== שורת תלמיד — לחיצה על השורה מחליפה מצב ===== */
.s{display:flex;gap:11px;align-items:center;background:#fff;border:2px solid var(--line);
  border-radius:14px;padding:13px 15px;margin-bottom:8px;width:100%;text-align:right;
  font-family:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.s:hover{border-color:#cfc9e8}
.s .num{width:30px;height:30px;flex-shrink:0;border-radius:50%;background:#f2f0fb;color:var(--soft);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.82rem}
.s .nm{flex:1;font-size:1.12rem;font-weight:700;color:var(--ink)}
.s .tag{border-radius:11px;padding:7px 15px;font-weight:800;font-size:.86rem;
  background:#f1f1f6;color:var(--soft);min-width:86px;text-align:center}
.s.present{border-color:#bfe8d2;background:#f7fdfa}
.s.present .tag{background:var(--ok);color:#fff}
.s.absent{border-color:#f6cfcb;background:#fdf6f5}
.s.absent .tag{background:var(--no);color:#fff}
.s.late{border-color:#f5ddb0;background:#fffbf3}
.s.late .tag{background:var(--late);color:#fff}

.stamp{background:#f4f2fd;border:1px solid var(--line);border-radius:12px;padding:9px 14px;
  font-size:.87rem;color:var(--soft);margin-bottom:11px;display:flex;gap:10px;
  align-items:center;flex-wrap:wrap}
.stamp b{color:var(--ink);font-weight:800}
.arch{background:#fff6e8;border-color:#f3dfbe;color:#8a5a00}
.hint{color:var(--soft);font-size:.83rem;margin:0 0 12px}

.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--line);
  padding:11px 0;box-shadow:0 -3px 14px rgba(0,0,0,.06);z-index:40}
.barin{max-width:820px;margin:0 auto;padding:0 15px;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.cnt{font-family:'Secular One',sans-serif;font-size:1.05rem}
.cnt i{font-style:normal;font-weight:800}
.cnt .p{color:var(--ok)} .cnt .a{color:var(--no)} .cnt .l{color:var(--late)}
.msg{font-weight:700;font-size:.88rem;margin-inline-start:auto}
.err{background:#fdecea;color:#9f1239;border-radius:11px;padding:12px 15px;font-weight:700;font-size:.9rem}
.empty{color:var(--soft);text-align:center;padding:26px;font-size:.94rem}
.sess{display:flex;gap:11px;align-items:center;background:#fff;border:1px solid var(--line);
  border-radius:13px;padding:12px 15px;margin-bottom:8px;width:100%;text-align:right;
  font-family:inherit;cursor:pointer}
.sess:hover{border-color:var(--iyuni)}
.sess .x{flex:1}
.sess b{display:block;font-weight:800;font-size:.98rem}
.sess span{color:var(--soft);font-size:.83rem}
/* ===== טבלת סטטיסטיקה ===== */
.mwrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:15px}
table.mx{border-collapse:separate;border-spacing:0;font-size:.9rem;width:100%}
table.mx th,table.mx td{padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:center}
table.mx thead th{background:#f4f2fd;font-weight:800;font-size:.78rem;line-height:1.25;
  position:sticky;top:0;z-index:2}
table.mx thead th small{display:block;font-weight:600;color:var(--soft);font-size:.72rem}
table.mx .nmc{position:sticky;inset-inline-start:0;background:#fff;z-index:3;text-align:right;
  font-weight:700;min-width:132px;box-shadow:1px 0 0 var(--line)}
table.mx thead .nmc{background:#f4f2fd;z-index:4}
table.mx tbody tr:hover .nmc{background:#faf9ff}
table.mx tbody tr:hover td{background:#faf9ff}
.cel{display:inline-block;width:25px;height:25px;line-height:25px;border-radius:7px;
  font-weight:800;font-size:.82rem}
.cel.present{background:#e2f7ec;color:#0f7a4d}
.cel.absent{background:#fde9e7;color:#b42318}
.cel.late{background:#fdf1dc;color:#8a5a00}
.cel.none{background:#f4f4f8;color:#b9bcd0}
table.mx .tot{font-weight:800}
table.mx .pct{font-weight:800}
.pct.hi{color:var(--ok)} .pct.mid{color:var(--late)} .pct.lo{color:var(--no)}
table.mx tfoot td{background:#faf9ff;font-weight:800;font-size:.8rem;color:var(--soft)}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:.83rem;color:var(--soft);margin:11px 2px 0}
.lgd span{display:flex;gap:5px;align-items:center}
@media(max-width:600px){.s .nm{font-size:1rem}.wrap{padding:12px 11px}
  .s .tag{min-width:74px;padding:7px 10px;font-size:.8rem}}
@media print{.top,.bar,.s .tag{display:none}.s{break-inside:avoid}}
</style>
</head>
<body>
<div class="top"><div class="topin">
  <a href="index.html" title="חזרה">→</a>
  <h1>📋 הקראת נוכחות</h1>
  <span class="sb">מגמת תקשורת · גליל מערבי</span>
  <span class="sb" id="today" style="margin-inline-start:auto"></span>
</div></div>

<div class="wrap"><div id="app"><div class="empty">טוען…</div></div></div>
<div class="bar" id="bar" style="display:none"><div class="barin">
  <span class="cnt">נוכחים <i class="p" id="cP">0</i> · חסרים <i class="a" id="cA">0</i>
    · איחורים <i class="l" id="cL">0</i>
    <span style="color:var(--soft);font-size:.85rem" id="cT"></span></span>
  <span class="msg" id="msg"></span>
  <button class="btn g" onclick="allPresent()">סמן הכל נוכח</button>
  <button class="btn ok" id="saveBtn" onclick="save()">שמירה</button>
</div></div>

<script>
const SUP="https://eubgzfkkovxgijhrmnif.supabase.co",
      KEY="sb_publishable_vJ768fOwYWiDWeYsBBR45g_4NM4s55p";
/* חלון הזמן שבו הקראה נחשבת פעילה. אחריו היא עוברת לארכיון — עדיין ניתנת לעריכה */
const ACTIVE_MS = 2*60*60*1000;

const el=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function sb(q,m,b,x){
  const r=await fetch(SUP+'/rest/v1/'+q,{method:m||'GET',
    headers:Object.assign({apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},x||{}),
    body:b?JSON.stringify(b):undefined});
  if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,160));
  const t=await r.text(); return t?JSON.parse(t):[];
}
const heDate=d=>new Date(d).toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'});
const heTime=d=>new Date(d).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
const dateOnly=d=>{const x=new Date(d);return new Date(x.getTime()-x.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const isActive=s=>(Date.now()-new Date(s.taken_at).getTime())<ACTIVE_MS;
const gName=g=>[g.track||'קבוצה', g.level?g.level+' יח״ל':''].filter(Boolean).join(' · ');
const sName=s=>s.full_name||'';

/* מחזור הלחיצות. undefined = טרם סומן */
const CYCLE=[undefined,'present','absent','late'];
const LABEL={present:'נוכח',absent:'חסר',late:'איחור'};
const next=v=>CYCLE[(CYCLE.indexOf(v)+1)%CYCLE.length];

let TEACHER='', TEACHER_ID='', GROUPS=[], GROUP=null,
    ROSTER=[], MARK={}, SESSION=null, SESSIONS=[], TICK=null;

async function boot(){
  try{
    GROUPS=(await sb('tiksh_groups?select=*&order=grade,subject,track'))||[];
    if(!GROUPS.length){ el('app').innerHTML='<div class="err">לא נמצאו קבוצות לימוד.</div>'; return; }
    el('today').textContent=heDate(Date.now());
    /* זיהוי אוטומטי — המזהה מגיע מדף הכניסה ב-?code= */
    const code=new URLSearchParams(location.search).get('code');
    const mine=code?GROUPS.filter(g=>String(g.teacher_id||'')===String(code)):[];
    if(mine.length){
      TEACHER_ID=code; TEACHER=(mine[0].teacher_name||'').trim();
      showGroups();
    } else pickTeacher();
  }catch(e){
    el('app').innerHTML='<div class="err">שגיאת טעינה: '+esc(e.message)+
      '<br><span style="font-weight:400">ייתכן ש-RLS חוסם קריאה לטבלאות tiksh_.</span></div>';
  }
}
function pickTeacher(){
  /* שמות המורים בדיוק כפי שהם בקבוצות — "אוריין א" ו"אוריין ב" נשארים נפרדים */
  const names=[...new Set(GROUPS.map(g=>(g.teacher_name||'').trim()).filter(Boolean))]
    .sort((a,b)=>a.localeCompare(b,'he'));
  stopTick(); el('bar').style.display='none';
  el('app').innerHTML=`<div class="card">
    <h2 style="margin:0 0 3px;font-size:1.25rem">מי מקריא?</h2>
    <p class="hint">בחרו את שמכם כדי לראות את קבוצותיכם.</p>
    <label>שם המורה</label>
    <select id="tSel"><option value="">— בחרו —</option>
      ${names.map(n=>`<option${n===TEACHER?' selected':''}>${esc(n)}</option>`).join('')}</select>
    <button class="btn" style="margin-top:13px" onclick="chooseTeacher()">המשך ←</button>
  </div>`;
}
function chooseTeacher(){
  const v=el('tSel').value.trim();
  if(!v){ alert('בחרו שם'); return; }
  TEACHER=v; TEACHER_ID=''; showGroups();
}
async function showGroups(){
  stopTick(); el('bar').style.display='none';
  const mine=GROUPS.filter(g=>(g.teacher_name||'').trim()===TEACHER);
  el('app').innerHTML='<div class="empty">טוען קבוצות…</div>';
  /* איזו קבוצה כבר בהקראה פעילה, ומתי נלקחה לאחרונה */
  let last={};
  try{
    const ids=mine.map(g=>g.id).join(',');
    if(ids){
      const ss=await sb('tiksh_att_sessions?select=group_id,taken_at&group_id=in.('+ids+
                        ')&order=taken_at.desc');
      (ss||[]).forEach(r=>{ if(!last[r.group_id]) last[r.group_id]=r.taken_at; });
    }
  }catch(e){}
  el('app').innerHTML=`<div class="card">
    <h2 style="margin:0 0 3px;font-size:1.25rem">שלום ${esc(TEACHER)}</h2>
    <p class="hint">${mine.length} קבוצות · בחרו קבוצה להקראה</p>
    ${mine.map(g=>{
      const t=last[g.id];
      const live=t&&isActive({taken_at:t});
      return `<button class="grp ${g.subject==='עיוני'?'iy':'ma'}" onclick="openGroup('${g.id}')">
        <span class="x"><b>${esc(gName(g))}</b>
          <span>שכבה ${esc(g.grade)} · ${esc(g.subject)}</span></span>
        ${live?'<span class="live">● הקראה פעילה</span>'
             :t?'<span class="past">אחרונה '+esc(heTime(t))+'</span>':''}
      </button>`;
    }).join('')}
    <button class="btn g" style="margin-top:8px" onclick="pickTeacher()">← החלפת מורה</button>
  </div>`;
}

/* פתיחת קבוצה: ממשיכים הקראה פעילה אם יש, אחרת מתחילים חדשה */
async function openGroup(gid){
  GROUP=GROUPS.find(g=>String(g.id)===String(gid));
  el('app').innerHTML='<div class="empty">טוען רשימה…</div>';
  try{
    const enr=await sb('tiksh_enrollments?select=student_id&group_id=eq.'+encodeURIComponent(gid));
    const ids=(enr||[]).map(e=>e.student_id);
    if(!ids.length){ el('app').innerHTML='<div class="empty">אין תלמידים בקבוצה זו.</div>'; return; }
    const st=await sb('tiksh_students?select=*&id=in.('+ids.join(',')+')');
    ROSTER=(st||[]).sort((a,b)=>sName(a).localeCompare(sName(b),'he'));
    SESSIONS=(await sb('tiksh_att_sessions?select=*&group_id=eq.'+encodeURIComponent(gid)+
                       '&order=taken_at.desc'))||[];
    const live=SESSIONS.find(isActive);
    if(live) await loadSession(live); else { SESSION=null; MARK={}; render(); }
  }catch(e){ el('app').innerHTML='<div class="err">שגיאה: '+esc(e.message)+'</div>'; }
}
async function loadSession(s){
  SESSION=s; MARK={};
  try{
    const rows=await sb('tiksh_attendance?select=student_id,status&session_id=eq.'+s.id);
    (rows||[]).forEach(r=>MARK[r.student_id]=r.status);
  }catch(e){}
  render();
}
function render(){
  el('bar').style.display='block';
  const archived=SESSION&&!isActive(SESSION);
  const when=SESSION?SESSION.taken_at:Date.now();
  el('app').innerHTML=`<div class="card" style="padding:14px 17px;margin-bottom:11px">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <div style="flex:1">
          <b style="font-family:'Secular One',sans-serif;font-weight:400;font-size:1.2rem">${esc(gName(GROUP))}</b>
          <div style="color:var(--soft);font-size:.86rem">שכבה ${esc(GROUP.grade)} · ${esc(GROUP.subject)} ·
            ${esc(TEACHER)} · ${ROSTER.length} תלמידים</div>
        </div>
        <button class="btn g" onclick="showStats()">📊 סטטיסטיקה</button>
        <button class="btn g" onclick="showGroups()">← לקבוצות</button>
      </div></div>
    <div class="stamp${archived?' arch':''}">
      <span>${archived?'🗄️ הקראה בארכיון':SESSION?'● הקראה פעילה':'הקראה חדשה'}</span>
      <b>${esc(heDate(when))} · ${esc(heTime(when))}</b>
      ${archived?'<span>· עברו שעתיים, עדיין ניתנת לעריכה</span>':''}
    </div>
    <p class="hint">לחיצה על שורה: נוכח ← חסר ← איחור ← ביטול הסימון.</p>
    ${ROSTER.map((s,i)=>`<button class="s ${MARK[s.id]||''}" id="row_${s.id}" onclick="cycle('${s.id}')">
        <span class="num">${i+1}</span>
        <span class="nm">${esc(sName(s))}</span>
        <span class="tag">${MARK[s.id]?LABEL[MARK[s.id]]:'טרם סומן'}</span>
      </button>`).join('')}
    ${SESSIONS.filter(x=>!SESSION||String(x.id)!==String(SESSION.id)).length?
      `<div class="card" style="margin-top:16px">
        <h3 style="margin:0 0 9px;font-size:1.05rem">הקראות קודמות</h3>
        ${SESSIONS.filter(x=>!SESSION||String(x.id)!==String(SESSION.id)).map(x=>
          `<button class="sess" onclick="loadSessionById('${x.id}')">
            <span class="x"><b>${esc(heDate(x.taken_at))} · ${esc(heTime(x.taken_at))}</b>
              <span>${esc(x.teacher_name||TEACHER)}${isActive(x)?' · פעילה':''}</span></span>
            <span class="past">פתיחה</span>
          </button>`).join('')}
      </div>`:''}`;
  count(); startTick();
}
function loadSessionById(id){ const s=SESSIONS.find(x=>String(x.id)===String(id)); if(s) loadSession(s); }
function cycle(id){
  MARK[id]=next(MARK[id]);
  if(MARK[id]===undefined) delete MARK[id];
  const row=el('row_'+id); if(!row)return;
  row.className='s '+(MARK[id]||'');
  row.querySelector('.tag').textContent=MARK[id]?LABEL[MARK[id]]:'טרם סומן';
  count();
}
function allPresent(){ ROSTER.forEach(s=>MARK[s.id]='present'); render(); }
function count(){
  const n=v=>ROSTER.filter(s=>MARK[s.id]===v).length;
  el('cP').textContent=n('present'); el('cA').textContent=n('absent'); el('cL').textContent=n('late');
  el('cT').textContent='· טרם סומנו '+(ROSTER.length-n('present')-n('absent')-n('late'));
}
/* בדיקה כל דקה — הקראה שחוצה את גבול השעתיים מסומנת כארכיון בלי רענון */
function startTick(){ stopTick(); TICK=setInterval(()=>{
  if(SESSION&&!isActive(SESSION)&&!document.querySelector('.stamp.arch')) render();
},60000); }
function stopTick(){ if(TICK){clearInterval(TICK);TICK=null;} }

/* ===== סטטיסטיקה — תלמידים בשורות, הקראות בעמודות =====
   נטען מחדש בכל פתיחה כדי לשקף גם הקראות שנשמרו הרגע. */
let STATS={};
async function showStats(){
  stopTick(); el('bar').style.display='none';
  el('app').innerHTML='<div class="empty">מחשב…</div>';
  try{
    const ss=(await sb('tiksh_att_sessions?select=*&group_id=eq.'+encodeURIComponent(GROUP.id)+
                       '&order=taken_at.asc'))||[];
    if(!ss.length){
      el('app').innerHTML='<div class="card"><div class="empty">עדיין לא נשמרה הקראה לקבוצה זו.</div>'+
        '<button class="btn g" onclick="openGroup(\''+GROUP.id+'\')">← חזרה להקראה</button></div>';
      return;
    }
    const ids=ss.map(x=>x.id).join(',');
    const rows=(await sb('tiksh_attendance?select=student_id,session_id,status&session_id=in.('+ids+')'))||[];
    STATS={}; rows.forEach(r=>{ (STATS[r.student_id]=STATS[r.student_id]||{})[r.session_id]=r.status; });
    renderStats(ss);
  }catch(e){ el('app').innerHTML='<div class="err">שגיאה: '+esc(e.message)+'</div>'; }
}
function renderStats(ss){
  const sym={present:'✓',absent:'✗',late:'א'};
  const cell=v=>'<span class="cel '+(v||'none')+'">'+(v?sym[v]:'–')+'</span>';
  const body=ROSTER.map(st=>{
    const m=STATS[st.id]||{};
    const c=v=>ss.filter(x=>m[x.id]===v).length;
    const p=c('present'), a=c('absent'), l=c('late');
    const done=p+a+l;
    const pct=done?Math.round((p+l)/done*100):null;
    const cls=pct===null?'':pct>=90?'hi':pct>=75?'mid':'lo';
    return '<tr><td class="nmc">'+esc(sName(st))+'</td>'+
      ss.map(x=>'<td>'+cell(m[x.id])+'</td>').join('')+
      '<td class="tot" style="color:var(--ok)">'+p+'</td>'+
      '<td class="tot" style="color:var(--no)">'+a+'</td>'+
      '<td class="tot" style="color:var(--late)">'+l+'</td>'+
      '<td class="pct '+cls+'">'+(pct===null?'–':pct+'%')+'</td></tr>';
  }).join('');
  const foot=ss.map(x=>{
    const n=ROSTER.filter(st=>{const v=(STATS[st.id]||{})[x.id];return v==='present'||v==='late';}).length;
    return '<td>'+n+'</td>';
  }).join('');
  el('app').innerHTML='<div class="card" style="padding:14px 17px;margin-bottom:11px">'+
    '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+
      '<div style="flex:1"><b style="font-family:\'Secular One\',sans-serif;font-weight:400;font-size:1.2rem">'+
        esc(gName(GROUP))+'</b>'+
        '<div style="color:var(--soft);font-size:.86rem">'+ss.length+' הקראות · '+
          ROSTER.length+' תלמידים</div></div>'+
      '<button class="btn g" onclick="exportCsv()">⬇ הורדה לאקסל</button>'+
      '<button class="btn g" onclick="openGroup(\''+GROUP.id+'\')">← להקראה</button>'+
    '</div></div>'+
    '<div class="mwrap"><table class="mx"><thead><tr><th class="nmc">תלמיד</th>'+
      ss.map(x=>'<th>'+esc(new Date(x.taken_at).toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit'}))+
                '<small>'+esc(heTime(x.taken_at))+'</small></th>').join('')+
      '<th>נוכח<small>סה״כ</small></th><th>חסר<small>סה״כ</small></th>'+
      '<th>איחור<small>סה״כ</small></th><th>אחוז<small>נוכחות</small></th></tr></thead>'+
    '<tbody>'+body+'</tbody>'+
    '<tfoot><tr><td class="nmc">נכחו בהקראה</td>'+foot+'<td colspan="4"></td></tr></tfoot>'+
    '</table></div>'+
    '<div class="lgd"><span><span class="cel present">✓</span> נוכח</span>'+
      '<span><span class="cel absent">✗</span> חסר</span>'+
      '<span><span class="cel late">א</span> איחור</span>'+
      '<span><span class="cel none">–</span> לא סומן</span>'+
      '<span>· אחוז הנוכחות סופר איחור כנוכחות</span></div>';
  window.__SS=ss;
}
/* ייצוא ל-CSV. ה-BOM בתחילת הקובץ נחוץ כדי שאקסל יזהה עברית ולא יציג ג'יבריש */
function exportCsv(){
  const ss=window.__SS||[]; const L={present:'נוכח',absent:'חסר',late:'איחור'};
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const head=['תלמיד'].concat(ss.map(x=>
    new Date(x.taken_at).toLocaleDateString('he-IL')+' '+heTime(x.taken_at)))
    .concat(['נוכח','חסר','איחור','אחוז נוכחות']);
  const lines=[head.map(q).join(',')];
  ROSTER.forEach(st=>{
    const m=STATS[st.id]||{};
    const c=v=>ss.filter(x=>m[x.id]===v).length;
    const p=c('present'),a=c('absent'),l=c('late'),done=p+a+l;
    lines.push([sName(st)].concat(ss.map(x=>m[x.id]?L[m[x.id]]:''))
      .concat([p,a,l,done?Math.round((p+l)/done*100)+'%':'']).map(q).join(','));
  });
  const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});
  const u=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=u; a.download='נוכחות_'+gName(GROUP).replace(/[^\w\u0590-\u05FF]+/g,'_')+'.csv';
  a.click(); URL.revokeObjectURL(u);
}

async function save(){
  const marked=ROSTER.filter(s=>MARK[s.id]);
  const m=el('msg');
  if(!marked.length){ m.style.color='#9f1239'; m.textContent='לא סומן אף תלמיד.'; return; }
  const left=ROSTER.length-marked.length;
  if(left && !confirm(left+' תלמידים טרם סומנו.\nלשמור בכל זאת?')) return;
  m.style.color='#6a6f8a'; m.textContent='שומר…';
  el('saveBtn').disabled=true;
  try{
    /* הקראה חדשה נוצרת רק בשמירה הראשונה — כך שפתיחת קבוצה בטעות
       לא משאירה אירוע ריק בארכיון */
    if(!SESSION){
      const made=await sb('tiksh_att_sessions','POST',[{
        group_id:GROUP.id, teacher_id:TEACHER_ID||null, teacher_name:TEACHER,
        school_id:GROUP.school_id||null
      }],{Prefer:'return=representation'});
      SESSION=made[0]; SESSIONS.unshift(SESSION);
    }
    const rows=marked.map(s=>({
      session_id:SESSION.id, group_id:GROUP.id, student_id:s.id,
      status:MARK[s.id], taken_at:SESSION.taken_at, taken_on:dateOnly(SESSION.taken_at)
    }));
    await sb('tiksh_attendance?on_conflict=session_id,student_id','POST',rows,
      {Prefer:'resolution=merge-duplicates'});
    const p=marked.filter(s=>MARK[s.id]==='present').length;
    const l=marked.filter(s=>MARK[s.id]==='late').length;
    m.style.color='#0f7a4d';
    m.textContent='✅ נשמר · '+p+' נוכחים'+(l?' · '+l+' איחורים':'');
  }catch(e){
    m.style.color='#9f1239';
    m.textContent='השמירה נכשלה: '+e.message.slice(0,90);
  }
  el('saveBtn').disabled=false;
}
boot();
</script>

</html>
