<!DOCTYPE html>
<!-- galil/kvutzot-view.html · v1.0.0 · 2026-08-20 · בית חינוך גליל מערבי
     גרסת צפייה של ניהול הקבוצות, למורי המגמה.

     ⚠ אין כאן שום מסלול כתיבה. לא הוסתרו כפתורים — נמחקו גם הפונקציות
     שמאחוריהם: move, drop, addTo, newGroup, renameGroup וכל הנגזרות.
     הסתרת כפתור משאירה פונקציה שאפשר להפעיל מן הקונסולה, וזו אינה
     גרסת צפייה אלא גרסה שנראית כך.

     מה שנשאר: בורר שכבה, חיפוש תלמיד, תצוגת הקבוצות וייצוא CSV.
     שלוש קריאות select, אפס insert/update/delete.

     ⚠ העריכה נעשית ב-kvutzot.html שבאותה תיקייה — הוא נשאר לרכזות.
     שני הקבצים קוראים מאותן טבלאות tiksh_* ב-matalot, ולכן שינוי שם
     נראה כאן מיד.

     נגזר מ-kvutzot.html v2.5.0 · 2026-08-09 -->
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ניהול קבוצות · מגמת תקשורת גליל מערבי</title>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--iyuni:#7c3aed;--maasi:#0d9488;--ink:#1f2340;--soft:#6a6f8a;--bg:#f7f6fc;--line:#e7e4f3;
  --ok:#12b76a;--no:#dc2626;--warn:#c98a12;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Assistant',sans-serif;font-size:16px;line-height:1.6;padding-bottom:40px}
h1,h2,h3,.disp{font-family:'Secular One',sans-serif;font-weight:400}
.wrap{max-width:1240px;margin:0 auto;padding:0 15px}
.top{background:linear-gradient(135deg,#4c1d95,#0f766e);color:#fff;padding:20px 0 22px;margin-bottom:18px}
.topin{max-width:1240px;margin:0 auto;padding:0 15px;display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.topin h1{font-size:1.5rem;margin:0}
.topin .sb{opacity:.85;font-size:.86rem}
select,input{font-family:inherit;font-size:.94rem;border:1px solid #d8d5e8;border-radius:10px;padding:8px 11px;background:#fff;color:var(--ink)}
.grade-sel{font-weight:800;border:0;padding:9px 15px;border-radius:22px}
.srch{flex:1;min-width:150px;max-width:260px;border:0}
.kpi{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}
.kpi div{background:#fff;border:1px solid var(--line);border-radius:13px;padding:9px 17px;text-align:center;min-width:96px}
.kpi b{display:block;font-family:'Secular One',sans-serif;font-size:1.4rem}
.kpi span{font-size:.75rem;color:var(--soft);font-weight:700}
.subj{margin-bottom:22px}
.subj h2{font-size:1.2rem;margin:0 0 3px;display:flex;gap:9px;align-items:center}
.subj h2 i{width:13px;height:13px;border-radius:50%;display:block;font-style:normal}
.subj .lead{color:var(--soft);font-size:.86rem;margin:0 0 11px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:13px}
.g{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden;
  border-top:4px solid var(--iyuni)}
.g.m{border-top-color:var(--maasi)}
.gh{padding:11px 14px 9px;border-bottom:1px solid var(--line)}
.gh h3{margin:0;font-size:1.03rem}
.gh .t{color:var(--soft);font-size:.83rem}
.gh .n{float:left;background:#f1effb;color:var(--iyuni);border-radius:20px;padding:1px 11px;
  font-size:.78rem;font-weight:800}
.g.m .gh .n{background:#e6f6f4;color:var(--maasi)}
.gb{padding:6px 8px;max-height:330px;overflow:auto}
.s{display:flex;gap:7px;align-items:center;padding:6px 8px;border-radius:9px;font-size:.9rem}
.s:hover{background:#faf9ff}
.s span{flex:1}
.s .id{color:var(--soft);font-size:.74rem;font-family:ui-monospace,monospace}
.s.hit{background:#fdf3e2}
.mini{background:#f0eefa;color:var(--iyuni);border:0;border-radius:7px;padding:3px 9px;
  font-family:inherit;font-weight:800;font-size:.74rem;cursor:pointer;white-space:nowrap}
.mini:hover{filter:brightness(.94)} .mini.r{background:#fdecea;color:var(--no)}
.g.m .mini{background:#e6f6f4;color:var(--maasi)}
.gf{padding:8px 12px;border-top:1px solid var(--line);background:#fbfaff}
.tag{display:inline-block;background:#fdf3e2;color:#8a5a08;border-radius:20px;padding:1px 9px;
  font-size:.72rem;font-weight:800;margin-inline-start:5px}
.btn{background:var(--iyuni);color:#fff;border:0;border-radius:10px;padding:9px 18px;font-family:inherit;
  font-weight:800;font-size:.88rem;cursor:pointer}
.btn.w{background:#fff;color:var(--ink)} .btn.ok{background:var(--ok)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ov{position:fixed;inset:0;background:rgba(20,18,45,.55);display:flex;align-items:center;
  justify-content:center;padding:16px;z-index:50}
.md{background:#fff;border-radius:17px;max-width:460px;width:100%;padding:21px 23px;max-height:88vh;overflow:auto}
.md h3{margin:0 0 4px;font-size:1.15rem}
.md .lead{color:var(--soft);font-size:.87rem;margin:0 0 13px}
.md label{display:block;font-weight:800;font-size:.8rem;margin:9px 0 4px}
.md select,.md input{width:100%}
.md .acts{display:flex;gap:8px;margin-top:15px}
.md .acts button{flex:1}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1f2340;color:#fff;
  border-radius:12px;padding:10px 20px;font-weight:700;font-size:.88rem;z-index:60;display:none}
.toast.on{display:block} .toast.ok{background:#0f7a4d} .toast.no{background:#9f1239}
.err{background:#fdecea;color:#9f1239;border-radius:11px;padding:13px 16px;font-weight:700}
.empty{color:var(--soft);text-align:center;padding:26px;font-size:.93rem}
@media(max-width:600px){.topin h1{font-size:1.2rem}}
</style>
</head>
<body>
<div class="top"><div class="topin">
  <a href="index.html" style="color:#fff;text-decoration:none;font-size:1.2rem;opacity:.85" title="חזרה לדף המגמה">→</a>
  <h1>🎬 קבוצות המגמה</h1>
  <span class="sb">מגמת תקשורת · גליל מערבי · צפייה בלבד</span>
  <select class="grade-sel" id="gradeSel">
    <option value="י">שכבה י</option><option value="יא">שכבה יא</option><option value="יב">שכבה יב</option>
  </select>
  <input class="srch" id="srch" placeholder="חיפוש תלמיד…">
  <span style="margin-inline-start:auto;display:flex;gap:8px">
    <button class="btn w" onclick="csv()">⬇ CSV</button>
  </span>
</div></div>

<div class="wrap"><div id="app"><div class="empty">טוען…</div></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://eubgzfkkovxgijhrmnif.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_vJ768fOwYWiDWeYsBBR45g_4NM4s55p';
const SUBJECTS=[
  {k:'עיוני',name:'תקשורת וחברה',color:'var(--iyuni)',cls:''},
  {k:'מעשי', name:'הפקות',        color:'var(--maasi)',cls:'m'}
];
let sb, currentGrade='יא', GROUPS=[], STUDENTS=[], ENROLL=[], q='';

const el=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastT;
function toast(msg,type){
  const t=el('toast'); t.textContent=msg; t.className='toast on '+(type||'');
  clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast',2600);
}
const byId=(arr,id)=>arr.find(x=>String(x.id)===String(id));
/* המבנה בפועל: track (מסלול), level (יח״ל), teacher_name. שם התצוגה נגזר מהם. */
const gName=g=>[g.track||'קבוצה', g.level?g.level+' יח״ל':''].filter(Boolean).join(' · ');
const gTeacher=g=>g.teacher_name||'—';
/* tiksh_students: full_name / id_number */
const sName=s=>s.full_name||'';
const sTz=s=>s.id_number||'';
const nrm=s=>String(s||'').replace(/\s+/g,' ').trim();

/* ---------- טעינה ---------- */
/* רשימת המורים נאספת מכל השכבות — כדי שהבורר יציג את כולם
   גם כשמסתכלים על שכבה אחת. מונע וריאציות שם כמו "רני" מול "רני בן זאב". */

async function loadAll(){
  el('app').innerHTML='<div class="empty">טוען…</div>';
  const [g,s]=await Promise.all([
    sb.from('tiksh_groups').select('*').eq('grade',currentGrade).order('subject').order('track'),
    sb.from('tiksh_students').select('*').eq('grade',currentGrade).order('full_name')
  ]);
  if(g.error)throw g.error;
  if(s.error)throw s.error;
  GROUPS=g.data||[]; STUDENTS=s.data||[];
  const ids=GROUPS.map(x=>x.id);
  if(ids.length){
    const e=await sb.from('tiksh_enrollments').select('*').in('group_id',ids);
    if(e.error)throw e.error;
    ENROLL=e.data||[];
  }else ENROLL=[];
  render();
}
const inGroup=gid=>ENROLL.filter(e=>String(e.group_id)===String(gid))
  .map(e=>byId(STUDENTS,e.student_id)).filter(Boolean)
  .sort((a,b)=>sName(a).localeCompare(sName(b),'he'));
const enrollOf=(sid,subj)=>ENROLL.find(e=>{
  if(String(e.student_id)!==String(sid))return false;
  const g=byId(GROUPS,e.group_id); return g&&g.subject===subj;
});

/* ---------- תצוגה ---------- */
function render(){
  if(!GROUPS.length){
    el('app').innerHTML='<div class="empty">אין קבוצות בשכבה '+esc(currentGrade)+
      '.</div>';
    return;
  }
  const noMaasi=STUDENTS.filter(s=>!enrollOf(s.id,'מעשי')).length;
  const noIyuni=STUDENTS.filter(s=>!enrollOf(s.id,'עיוני')).length;
  let h=`<div class="kpi">
    <div><b>${STUDENTS.length}</b><span>תלמידים</span></div>
    <div><b>${GROUPS.length}</b><span>קבוצות</span></div>
    <div><b>${ENROLL.length}</b><span>שיוכים</span></div>
    ${noIyuni?`<div><b style="color:var(--warn)">${noIyuni}</b><span>ללא עיוני</span></div>`:''}
    ${noMaasi?`<div><b style="color:var(--warn)">${noMaasi}</b><span>ללא מעשי</span></div>`:''}
  </div>`;
  SUBJECTS.forEach(sub=>{
    const gs=GROUPS.filter(g=>g.subject===sub.k);
    h+=`<div class="subj">
      <h2><i style="background:${sub.color}"></i>${esc(sub.name)}
        <span style="font-size:.8rem;color:var(--soft);font-weight:400">· ${sub.k} · ${gs.length} קבוצות</span></h2>
      <p class="lead">כל תלמיד משויך לקבוצה אחת בלבד במקצוע זה.</p>
      <div class="grid">${gs.map(g=>card(g,sub)).join('')||'<div class="empty">אין קבוצות במקצוע זה.</div>'}</div>
    </div>`;
  });
  el('app').innerHTML=h;
}
function card(g,sub){
  const list=inGroup(g.id);
  const hit=s=>q&&nrm(sName(s)).indexOf(q)>-1;
  return `<div class="g ${sub.cls}">
    <div class="gh">
      <span class="n">${list.length}</span>
      <h3>${esc(gName(g))}</h3>
      <div class="t">מורה: ${esc(gTeacher(g))}</div>
    </div>
    <div class="gb">
      ${list.map(s=>{
        const other=sub.k==='עיוני'?'מעשי':'עיוני';
        const miss=!enrollOf(s.id,other);
        return `<div class="s ${hit(s)?'hit':''}">
          <span>${esc(sName(s))}${miss?`<span class="tag">אין ${other}</span>`:''}
            ${sTz(s)?`<span class="id"> ${esc(sTz(s))}</span>`:''}</span>

        </div>`;
      }).join('')||'<div class="empty" style="padding:14px">אין תלמידים בקבוצה</div>'}
    </div>

  </div>`;
}

/* ---------- חלונות ---------- */
function modal(html){
  const ov=document.createElement('div'); ov.className='ov'; ov.id='ov';
  ov.innerHTML='<div class="md">'+html+'</div>';
  ov.addEventListener('click',e=>{ if(e.target===ov)close(); });
  document.body.appendChild(ov);
}
function close(){ const o=el('ov'); if(o)o.remove(); }

/* מעבר בין קבוצות — רק באותו מקצוע */

/* הוספה — תלמיד קיים או חדש */



function csv(){
  const rows=[['שכבה','מקצוע','מסלול','יח״ל','מורה','תלמיד','ת״ז']];
  GROUPS.forEach(g=>inGroup(g.id).forEach(s=>
    rows.push([currentGrade,g.subject,g.track||'',g.level||'',gTeacher(g),sName(s),sTz(s)])));
  const csvTxt='\uFEFF'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csvTxt],{type:'text/csv'}));
  a.download='מגמת-תקשורת-'+currentGrade+'.csv'; a.click();
}

/* ---------- אתחול ---------- */
function showErr(e){
  el('app').innerHTML='<div class="err">שגיאת טעינה: '+esc(e.message||e)+
    '<br><span style="font-weight:400;font-size:.88rem">אם חוזרות אפס שורות — ייתכן ש-RLS חוסם. '+
    'ודאו שיש policy לקריאה בטבלאות tiksh_.</span></div>';
}
el('gradeSel').addEventListener('change',e=>{ currentGrade=e.target.value; loadAll().catch(showErr); });
el('srch').addEventListener('input',e=>{ q=nrm(e.target.value); render(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape')close(); });
(function init(){
  el('gradeSel').value=currentGrade;
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  loadAll().catch(showErr);
})();
</script>
</body>
</html>
