<!DOCTYPE html>
<!-- galil/kitot-shiuv.html · v1.1.0 · 2026-08-09 · שני תיקונים.
     (1) ב-lms_classes קיים UNIQUE(teacher_id,name). שתי קבוצות של אותו מורה שמייצרות
     אותו שם — למשל עיוני ומעשי באותו מסלול ושכבה — נכשלו בשאיבה השנייה. מעכשיו מזוהה
     ההתנגשות מראש ונוספת סיומת מקצוע ("· תקשורת" / "· הפקות") לשתיהן. הסיומת נוספת
     רק בהתנגשות, כדי ששמות של כיתות שכבר נוצרו לא ישתנו.
     (2) בורר מורים: האדמין מעביר עבור כל צוות המגמה ולא רק עבור עצמו. הרשימה מסוננת
     לפי school_id=260489 ומציגה רק מורים בעלי teacher_id. (MINOR)
     v1.0.0 · שאיבת כיתות מהשיבוץ — גליל מערבי בלבד.
     המורה אינו בונה כיתות ידנית: הקבוצות שלו כבר קיימות ב-tiksh_groups, והכלי יוצר
     מהן רשומות מקבילות ב-lms_classes כדי שהמערכת הארצית תראה אותן ותעבוד כרגיל.
     כללי ההמרה נגזרו מהכיתה הקיימת "הפקות ב י ליאור דואק" (group_id=15) שנוצרה קודם:
       name    = track + grade + teacher_name   (בלי יח״ל)
       subject = עיוני → tikshoret · מעשי → tech
       students= מערך full_name מ-tiksh_enrollments + tiksh_students
       group_id= tiksh_groups.id — הקישור הקבוע
     הקובץ אינו נוגע ב-teacher-central.html ואינו משנה דבר עבור מורים מבתי ספר אחרים:
     הוא כותב רק רשומות של המורה המחובר, ורק כאלה שמקורן בקבוצה.
     הרצה חוזרת מעדכנת לפי group_id ואינה מכפילה.
     מזהה המורה מגיע ב-?code= משער הכניסה; מי שנכנס ישירות בוחר מרשימה. -->
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שאיבת כיתות מהשיבוץ · מגמת תקשורת</title>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--iyuni:#7c3aed;--maasi:#0d9488;--ink:#1f2340;--soft:#6a6f8a;--bg:#f7f6fc;--line:#e7e4f3;
  --ok:#12b76a;--no:#dc2626;--warn:#e08600}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Assistant',sans-serif;
  font-size:17px;line-height:1.6;padding-bottom:96px}
h1,h2,h3{font-family:'Secular One',sans-serif;font-weight:400}
.top{background:linear-gradient(135deg,#4c1d95,#0f766e);color:#fff;padding:14px 0;position:sticky;top:0;z-index:30}
.topin{max-width:820px;margin:0 auto;padding:0 15px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.topin a{color:#fff;text-decoration:none;font-size:1.2rem;opacity:.85}
.topin h1{font-size:1.3rem;margin:0}
.topin .sb{opacity:.85;font-size:.85rem}
.wrap{max-width:820px;margin:0 auto;padding:16px 15px}
.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:19px 21px;margin-bottom:14px}
label{display:block;font-weight:800;font-size:.85rem;margin-bottom:5px}
select{font-family:inherit;font-size:1rem;border:1px solid #d8d5e8;border-radius:11px;
  padding:11px 13px;width:100%;background:#fff;color:var(--ink)}
.btn{background:var(--iyuni);color:#fff;border:0;border-radius:12px;padding:12px 24px;
  font-family:inherit;font-weight:800;font-size:.95rem;cursor:pointer}
.btn:hover{filter:brightness(.93)}
.btn.g{background:#f0eefa;color:var(--ink)} .btn.ok{background:var(--ok)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{color:var(--soft);font-size:.87rem;margin:0 0 13px}
.row{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--line);
  border-radius:14px;padding:13px 15px;margin-bottom:8px;cursor:pointer;width:100%;
  text-align:right;font-family:inherit}
.row:hover{border-color:#cfc9e8}
.row.on{border-color:var(--iyuni);background:#faf8ff}
.row.iy{border-inline-start:6px solid var(--iyuni)} .row.ma{border-inline-start:6px solid var(--maasi)}
.row .bx{width:22px;height:22px;flex-shrink:0;border:2px solid #cfc9e8;border-radius:6px;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;color:#fff}
.row.on .bx{background:var(--iyuni);border-color:var(--iyuni)}
.row .x{flex:1;min-width:0}
.row b{display:block;font-family:'Secular One',sans-serif;font-weight:400;font-size:1.06rem}
.row span{color:var(--soft);font-size:.84rem}
.pill{border-radius:20px;padding:2px 11px;font-size:.75rem;font-weight:800;flex-shrink:0}
.pill.new{background:#e7f7ee;color:#0f7a4d}
.pill.upd{background:#f1effb;color:var(--iyuni)}
.pill.bad{background:#fdecea;color:#9f1239}
.warn{background:#fff6e8;border:1px solid #f3dfbe;color:#8a5a00;border-radius:12px;
  padding:12px 15px;font-size:.88rem;margin-bottom:13px}
.err{background:#fdecea;color:#9f1239;border-radius:11px;padding:12px 15px;font-weight:700;font-size:.9rem}
.empty{color:var(--soft);text-align:center;padding:26px;font-size:.94rem}
.res{font-size:.92rem;border-bottom:1px solid var(--line);padding:9px 2px}
.res:last-child{border:0}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--line);
  padding:11px 0;box-shadow:0 -3px 14px rgba(0,0,0,.06);z-index:40}
.barin{max-width:820px;margin:0 auto;padding:0 15px;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.cnt{font-family:'Secular One',sans-serif;font-size:1.02rem}
.msg{font-weight:700;font-size:.88rem;margin-inline-start:auto}
@media(max-width:600px){.wrap{padding:12px 11px}.row b{font-size:.98rem}}
</style>
</head>
<body>
<div class="top"><div class="topin">
  <a href="index.html" title="חזרה">→</a>
  <h1>🏫 שאיבת כיתות מהשיבוץ</h1>
  <span class="sb">מגמת תקשורת · גליל מערבי</span>
</div></div>

<div class="wrap"><div id="app"><div class="empty">טוען…</div></div></div>
<div class="bar" id="bar" style="display:none"><div class="barin">
  <span class="cnt" id="cnt">נבחרו 0</span>
  <span class="msg" id="msg"></span>
  <button class="btn g" onclick="toggleAll()">בחירת הכל</button>
  <button class="btn ok" id="goBtn" onclick="run()">שאיבה ←</button>
</div></div>

<script>
const SUP="https://eubgzfkkovxgijhrmnif.supabase.co",
      KEY="sb_publishable_vJ768fOwYWiDWeYsBBR45g_4NM4s55p";
/* המרת מקצוע — נגזר מהכיתה הקיימת של ליאור, לא מהנחה */
const SUBJ={'עיוני':'tikshoret','מעשי':'tech'};

const el=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function sb(q,m,b,x){
  const r=await fetch(SUP+'/rest/v1/'+q,{method:m||'GET',
    headers:Object.assign({apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},x||{}),
    body:b?JSON.stringify(b):undefined});
  if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,160));
  const t=await r.text(); return t?JSON.parse(t):[];
}
/* שם הכיתה — בדיוק כפי שנוצר ב"הפקות ב י ליאור דואק": מסלול, שכבה, מורה.
   ב-lms_classes יש UNIQUE(teacher_id,name), ולכן שתי קבוצות של אותו מורה שמייצרות
   אותו שם — למשל עיוני ומעשי באותו מסלול ושכבה — מתנגשות. במקרה כזה בלבד נוספת
   סיומת מקצוע, כדי ששמות של כיתות קיימות לא ישתנו. */
const SUBJ_HE={'עיוני':'תקשורת','מעשי':'הפקות'};
const baseName=g=>[g.track,g.grade,g.teacher_name].filter(Boolean).join(' ');
let DUP={};
function cName(g){
  const b=baseName(g);
  return DUP[b] ? b+' · '+(SUBJ_HE[g.subject]||g.subject) : b;
}
/* מיפוי השמות שחוזרים יותר מפעם אחת אצל המורה הנוכחי */
function markDups(){
  const n={}; DUP={};
  GROUPS.forEach(g=>{ const b=baseName(g); n[b]=(n[b]||0)+1; });
  Object.keys(n).forEach(b=>{ if(n[b]>1) DUP[b]=true; });
}
const gLabel=g=>[g.track||'קבוצה', g.level?g.level+' יח״ל':''].filter(Boolean).join(' · ');

let TEACHER='', TEACHER_ID='', GROUPS=[], EXIST={}, ROSTER={}, PICK={}, ALL=[], STAFF=[];
/* סמל המוסד — הכלי משרת את גליל מערבי בלבד */
const SCHOOL='260489';

async function boot(){
  try{
    ALL=(await sb('tiksh_groups?select=*&school_id=eq.'+SCHOOL+'&order=grade,subject,track'))||[];
    /* צוות המגמה — רק מי שיש לו מזהה, כי בלעדיו אי אפשר ליצור רשומה ב-lms_classes */
    const map={};
    ALL.forEach(g=>{ const n=(g.teacher_name||'').trim();
      if(n && g.teacher_id && !map[n]) map[n]=g.teacher_id; });
    STAFF=Object.keys(map).sort((a,b)=>a.localeCompare(b,'he')).map(n=>({name:n,id:map[n]}));
    const code=new URLSearchParams(location.search).get('code');
    const me=STAFF.find(t=>String(t.id)===String(code));
    if(me){ TEACHER_ID=me.id; TEACHER=me.name; await loadMine(); }
    else pickTeacher();
  }catch(e){ el('app').innerHTML='<div class="err">שגיאת טעינה: '+esc(e.message)+'</div>'; }
}
/* רק מורים עם teacher_id — בלי מזהה אי אפשר ליצור רשומה ב-lms_classes */
function missingStaff(){
  return [...new Set(ALL.filter(g=>!g.teacher_id)
    .map(g=>(g.teacher_name||'').trim()).filter(Boolean))];
}
function staffSelect(id){
  return '<select id="'+id+'"><option value="">— בחרו מורה —</option>'+
    STAFF.map(t=>'<option value="'+esc(t.id)+'"'+
      (String(t.id)===String(TEACHER_ID)?' selected':'')+'>'+esc(t.name)+'</option>').join('')+
    '</select>';
}
function pickTeacher(){
  const miss=missingStaff();
  el('bar').style.display='none';
  el('app').innerHTML='<div class="card"><h2 style="margin:0 0 3px;font-size:1.25rem">בחירת מורה</h2>'+
    '<p class="hint">מורי מגמת תקשורת בגליל מערבי. בחרו מורה כדי לראות את קבוצותיו.</p>'+
    '<label>מורה</label>'+staffSelect('tSel')+
    '<button class="btn" style="margin-top:13px" onclick="chooseTeacher()">המשך ←</button>'+
    (miss.length?'<div class="warn" style="margin-top:14px">⚠ '+esc(miss.join(', '))+
      ' — אין מזהה מורה במערכת, ולכן לא ניתן ליצור עבורם כיתות. '+
      'הם צריכים להירשם ולהיות מאושרים, ואז למלא את teacher_id בקבוצות.</div>':'')+
    '</div>';
}
function chooseTeacher(){
  const s=el('tSel');
  if(!s.value){ alert('בחרו מורה'); return; }
  TEACHER_ID=s.value; TEACHER=s.options[s.selectedIndex].textContent;
  PICK={}; loadMine();
}
/* החלפת מורה מתוך המסך — האדמין מעביר עבור כל הצוות */
function switchTeacher(){
  const s=el('swSel');
  if(!s.value || String(s.value)===String(TEACHER_ID))return;
  TEACHER_ID=s.value; TEACHER=s.options[s.selectedIndex].textContent;
  PICK={}; loadMine();
}

async function loadMine(){
  el('app').innerHTML='<div class="empty">טוען קבוצות…</div>';
  GROUPS=ALL.filter(g=>String(g.teacher_id||'')===String(TEACHER_ID));
  markDups();
  if(!GROUPS.length){
    el('bar').style.display='none';
    el('app').innerHTML='<div class="card"><label>מורה</label>'+staffSelect('swSel')+
      '<button class="btn g" style="margin-top:11px" onclick="switchTeacher()">הצגה</button>'+
      '<div class="empty">לא נמצאו קבוצות למורה זה.</div></div>'; return; }
  try{
    /* אילו כיתות כבר קיימות ומקושרות — רק של המורה הזה */
    EXIST={};
    const cls=await sb('lms_classes?select=id,name,subject,group_id&teacher_id=eq.'+
                       encodeURIComponent(TEACHER_ID));
    (cls||[]).forEach(c=>{ if(c.group_id!=null) EXIST[c.group_id]=c; });
    /* מניין התלמידים בכל קבוצה */
    ROSTER={};
    const ids=GROUPS.map(g=>g.id).join(',');
    const enr=await sb('tiksh_enrollments?select=group_id,student_id&group_id=in.('+ids+')');
    (enr||[]).forEach(e=>{ (ROSTER[e.group_id]=ROSTER[e.group_id]||[]).push(e.student_id); });
    render();
  }catch(e){ el('app').innerHTML='<div class="err">שגיאה: '+esc(e.message)+'</div>'; }
}
function render(){
  el('bar').style.display='block';
  el('app').innerHTML='<div class="card" style="padding:15px 21px 17px">'+
    '<label>מורה מטופל</label>'+staffSelect('swSel')+
    '<button class="btn g" style="margin-top:11px" onclick="switchTeacher()">הצגת קבוצותיו</button></div>'+
    '<div class="card"><h2 style="margin:0 0 3px;font-size:1.25rem">'+esc(TEACHER)+'</h2>'+
    '<p class="hint">הקבוצות מהשיבוץ. סמנו אילו להעביר למערכת המטלות — '+
    'השם, המקצוע ורשימת התלמידים ייבנו מהקבוצה. קבוצה שכבר הועברה תתעדכן ולא תיווצר פעמיים.</p>'+
    (Object.keys(DUP).length?'<div class="warn">שתי קבוצות מייצרות אותו שם כיתה. '+
      'מכיוון שהמערכת אינה מאפשרת שתי כיתות באותו שם לאותו מורה, נוספה להן סיומת מקצוע.</div>':'')+
    GROUPS.map(g=>{
      const n=(ROSTER[g.id]||[]).length, ex=EXIST[g.id], on=PICK[g.id];
      return '<button class="row '+(g.subject==='עיוני'?'iy':'ma')+(on?' on':'')+
        '" onclick="pick(\''+g.id+'\')">'+
        '<span class="bx">'+(on?'✓':'')+'</span>'+
        '<span class="x"><b>'+esc(cName(g))+'</b>'+
          '<span>'+esc(gLabel(g))+' · '+esc(g.subject)+' · '+n+' תלמידים'+
          (n?'':' ⚠')+'</span></span>'+
        (ex?'<span class="pill upd">עדכון</span>':'<span class="pill new">חדשה</span>')+
        '</button>';
    }).join('')+
    '<div class="warn" style="margin-top:12px">הכלי כותב רק כיתות של המורה הנבחר ורק כאלה שמקורן בקבוצה. '+
    'כיתות שיצרתם ידנית במערכת הארצית אינן מושפעות.</div></div>'+
    '<div id="out"></div>';
  count();
}
function pick(id){ PICK[id]=!PICK[id]; render(); }
function toggleAll(){
  const all=GROUPS.every(g=>PICK[g.id]);
  GROUPS.forEach(g=>PICK[g.id]=!all); render();
}
function count(){
  const n=GROUPS.filter(g=>PICK[g.id]).length;
  el('cnt').textContent='נבחרו '+n;
  el('goBtn').disabled=!n;
}

async function run(){
  const sel=GROUPS.filter(g=>PICK[g.id]);
  const m=el('msg');
  if(!sel.length)return;
  m.style.color='#6a6f8a'; m.textContent='מעביר…'; el('goBtn').disabled=true;
  const log=[];
  try{
    /* שמות התלמידים — נשלפים פעם אחת לכל הקבוצות הנבחרות */
    const sids=[...new Set(sel.flatMap(g=>ROSTER[g.id]||[]))];
    const NAME={};
    if(sids.length){
      const st=await sb('tiksh_students?select=id,full_name&id=in.('+sids.join(',')+')');
      (st||[]).forEach(s=>NAME[s.id]=s.full_name||'');
    }
    for(const g of sel){
      const names=(ROSTER[g.id]||[]).map(i=>NAME[i]).filter(Boolean)
        .sort((a,b)=>a.localeCompare(b,'he'));
      const body={ teacher_id:TEACHER_ID, name:cName(g), subject:SUBJ[g.subject]||'tikshoret',
                   students:names, group_id:g.id, updated_at:new Date().toISOString() };
      try{
        if(EXIST[g.id]){
          await sb('lms_classes?id=eq.'+encodeURIComponent(EXIST[g.id].id),'PATCH',body);
          log.push(['upd',cName(g),names.length]);
        }else{
          const made=await sb('lms_classes','POST',[body],{Prefer:'return=representation'});
          EXIST[g.id]=made[0]; log.push(['new',cName(g),names.length]);
        }
      }catch(err){ log.push(['bad',cName(g),err.message.slice(0,70)]); }
    }
    const ok=log.filter(x=>x[0]!=='bad').length;
    m.style.color=ok===log.length?'#0f7a4d':'#9f1239';
    m.textContent=ok+' מתוך '+log.length+' הועברו';
    el('out').innerHTML='<div class="card"><h3 style="margin:0 0 8px;font-size:1.05rem">תוצאה</h3>'+
      log.map(x=>'<div class="res">'+
        (x[0]==='new'?'<span class="pill new">נוצרה</span> ':
         x[0]==='upd'?'<span class="pill upd">עודכנה</span> ':
                      '<span class="pill bad">נכשלה</span> ')+
        esc(x[1])+' — '+(x[0]==='bad'?esc(x[2]):x[2]+' תלמידים')+'</div>').join('')+
      '<p class="hint" style="margin:12px 0 0">הכיתות זמינות עכשיו במערכת המטלות. '+
      'שינוי בקבוצות אינו מתעדכן מעצמו — הריצו כאן שוב.</p></div>';
    PICK={}; render();
  }catch(e){
    m.style.color='#9f1239'; m.textContent='נכשל: '+e.message.slice(0,80);
    el('goBtn').disabled=false;
  }
}
boot();
</script>
</body>
</html>
