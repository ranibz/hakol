<!DOCTYPE html>
<!-- kolnoa/sfarim/index.html · v1.0.0 · 2026-08-11 · ספריית הקולנוע — ארבעה ספרים סרוקים.
     הקבצים נשמרו בשמות עברית עם רווחים, ולכן כל קישור מקודד ב-percent-encoding מלא.
     הקידוד מופיע פעם אחת במערך BOOKS ולא מפוזר בקוד, כדי שהחלפת שם קובץ תדרוש
     שינוי בשורה אחת. אם השמות ישונו לאנגלית — אפשר להחליף את הערכים בשמות פשוטים
     והכל ימשיך לעבוד.
     לכל ספר שני כפתורים: פתיחה בכרטיסייה חדשה (הדפדפן מציג PDF במקור) והורדה
     לקריאה אופליין — 2-3 מגה בחיבור סלולרי חלש נטענים לאט, ותלמיד שיוריד פעם אחת
     לא ימתין שוב.
     הערה: לספרים הסרוקים אין שכבת טקסט תקינה בעברית, ולכן חיפוש בתוך הקובץ אינו
     עובד. לא מבטיחים אותו למשתמש. -->
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ספריית הקולנוע · הכל בכף היד</title>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2340;--soft:#6a6f8a;--bg:#f6f4fb;--line:#e5e2f0;--gold:#b8860b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Assistant',sans-serif;
  font-size:17px;line-height:1.6;padding-bottom:60px}
h1,h2,h3{font-family:'Secular One',sans-serif;font-weight:400}
.top{background:linear-gradient(135deg,#221a3d,#3d2b5f);color:#fff;padding:30px 0 26px}
.topin{max-width:940px;margin:0 auto;padding:0 18px}
.topin a.back{color:#fff;text-decoration:none;opacity:.75;font-size:.9rem}
.topin h1{font-size:2rem;margin:8px 0 4px}
.topin p{margin:0;opacity:.8;font-size:.97rem}
.wrap{max-width:940px;margin:0 auto;padding:26px 18px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.bk{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:0 6px 18px rgba(31,35,64,.07);
  transition:transform .25s cubic-bezier(.25,.8,.25,1),box-shadow .25s}
.bk:hover{transform:translateY(-5px);box-shadow:0 16px 32px rgba(31,35,64,.14)}
.bk .cv{height:150px;display:flex;align-items:center;justify-content:center;
  font-size:3.4rem;background:linear-gradient(140deg,var(--c1),var(--c2));color:#fff}
.bk .in{padding:17px 19px 19px;display:flex;flex-direction:column;flex:1}
.bk h3{margin:0 0 3px;font-size:1.18rem;line-height:1.3}
.bk .au{color:var(--soft);font-size:.87rem;margin:0 0 10px}
.bk .ds{font-size:.9rem;color:#4a5068;margin:0 0 15px;flex:1}
.acts{display:flex;gap:9px}
.acts a{flex:1;text-align:center;text-decoration:none;font-weight:800;font-size:.88rem;
  border-radius:11px;padding:10px 8px;transition:filter .2s}
.acts a:hover{filter:brightness(.92)}
.open{background:var(--ink);color:#fff}
.dl{background:#f1eefa;color:var(--ink)}

.note{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 18px;
  margin-top:24px;font-size:.9rem;color:var(--soft);line-height:1.7}
.note b{color:var(--ink)}
@media(max-width:600px){.wrap{padding:20px 13px}.topin h1{font-size:1.6rem}
  .grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="top"><div class="topin">
  <a class="back" href="../">→ חזרה לסביבת הקולנוע</a>
  <h1>📚 ספריית הקולנוע</h1>
  <p>ספרי עיון בקולנוע — לקריאה במסך או להורדה</p>
</div></div>

<div class="wrap">
  <div class="grid" id="grid"></div>

  <div class="note">
    <b>לקריאה נוחה:</b> הספרים נפתחים ישירות בדפדפן. במכשיר נייד כדאי להוריד פעם אחת
    ולקרוא אופליין — הקבצים כבדים ובחיבור סלולרי חלש הטעינה איטית.<br>
    <b>חיפוש בתוך הספר אינו זמין</b> — הסריקות נעשו בלי זיהוי טקסט בעברית.
  </div>
</div>

<script>
/* שמות הקבצים בעברית ועם רווחים — encodeURIComponent מטפל בקידוד,
   כך שאין צורך לכתוב %D7... ידנית ושינוי שם דורש עריכה במקום אחד. */
const BOOKS = [
  { file:'פליני פנים הספר.pdf', title:'פליני', author:'פנים הספר',
    desc:'מונוגרפיה על פדריקו פליני — הביוגרפיה, הסרטים והשפה הוויזואלית שלו.',
    icon:'🎩', c1:'#6d28d9', c2:'#8b5cf6' },
  { file:'אייזנשטיין פנים הספר.pdf', title:'אייזנשטיין', author:'פנים הספר',
    desc:'סרגיי אייזנשטיין ותורת המונטאז׳ — היסודות של עריכת הקולנוע.',
    icon:'🎞️', c1:'#b91c1c', c2:'#ef4444' },
  { file:'סטנלי קובריק.pdf', title:'סטנלי קובריק', author:'',
    desc:'הבמאי, הקומפוזיציה והדיוק — מבט על גוף העבודה של קובריק.',
    icon:'👁️', c1:'#0f766e', c2:'#14b8a6' },
  { file:'עושים סרטים (1).pdf', title:'עושים סרטים', author:'',
    desc:'מלאכת ההפקה מקצה לקצה — מהתסריט ועד חדר העריכה.',
    icon:'🎬', c1:'#b45309', c2:'#f59e0b' }
];

const esc = s => String(s==null?'':s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

document.getElementById('grid').innerHTML = BOOKS.map(b => {
  const url = encodeURIComponent(b.file);
  return `<div class="bk">
    <div class="cv" style="--c1:${b.c1};--c2:${b.c2}">${b.icon}</div>
    <div class="in">
      <h3>${esc(b.title)}</h3>
      ${b.author ? `<p class="au">${esc(b.author)}</p>` : '<p class="au">&nbsp;</p>'}
      <p class="ds">${esc(b.desc)}</p>
      <div class="acts">
        <a class="open" href="${url}" target="_blank" rel="noopener">קריאה</a>
        <a class="dl" href="${url}" download>הורדה</a>
      </div>
    </div>
  </div>`;
}).join('');
</script>

</body>
</html>
