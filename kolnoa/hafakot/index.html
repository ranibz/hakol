<!DOCTYPE html>
<!-- kolnoa/hafakot/index.html · v1.8.0 · 2026-08-05 · שער כניסה לטכנולוגיות הפקה.
     שלוש דלתות: תלמיד לאזור האישי שלו (talmid.html עם code+class, אותו זרם מטלות של
     תקשורת וחברה), מורה לכתיבת שיעורים או למעקב, ומאגר השיעורים לעיון חופשי.
     בורר הכיתות מוגבל למורי בית הספר, כי עמודת school ב-lms_teachers ריקה.
     v1.1.0: נוספה דלת ניהול — בניית כיתות, שיוך מורה, בחירת מקצוע ורשימת תלמידים בהדבקה.
     ההרשאה לפי מזהה ברשימת ADMINS ולא לפי סיסמה משותפת, כדי שלא יידרש להחליף סיסמה
     כשמורה עוזב.
     v1.2.0: כיתות הלמידה נשענות על קבוצות השיבוץ ב-tiksh_groups במקום על הקלדת שמות.
     בחירת קבוצה בטופס טוענת את התלמידים מ-tiksh_enrollments וממלאת שם ומקצוע כברירת מחדל;
     lms_classes.group_id שומר את הקישור, וקבוצה שכבר משויכת אינה מוצעת שוב. שדה students
     ממשיך להישמר כגיבוי עד שכל המסכים יעברו לשליפה חיה.
     v1.3.0: הסינון עבר מרשימת מזהי מורים קשיחה לסמל מוסד — כל בית ספר רואה את המורים,
     הכיתות והשיבוץ שלו בלבד, ומורה חדש נכנס בלי לעדכן קובץ. נוסף שער סמל מוסד דרך
     school-gate.js לכל כניסת מורה.
     v1.4.0: הפרדה בין מאגר לתוכן כיתתי. עריכת מאגר השיעורים נחסמה למנהלי תוכן, כי הוא
     משותף לכל בתי הספר ושינוי של מורה אחד היה משנה את השיעור לכולם. נוסף מסלול
     "תוכן משלי" — משימה, מצגת, קישור או סרטון שמורה יוצר לכיתה שלו בלבד, בטבלה
     נפרדת prod_custom.
     v1.5.0: סדר הכניסה התהפך — קודם מזדהים ורק אז מוצג התפריט, כך שמורה שאינו מנהל תוכן
     אינו רואה כלל את עריכת המאגר במקום ללחוץ ולהיחסם. התפריט מציג את שם המורה,
     בית הספר, ותג "מנהל תוכן" למי שהוא.
     v1.6.0: תיקון מהותי — פריט תוכן נשמר ב-prod_custom בלבד ולכן התלמידים לא ראו אותו כלל.
     כל שמירה יוצרת עכשיו גם שורה ב-lms_assignments עם topic=custom_<id> ו-page=custom,
     ומכאן האזור האישי, מועדי ההגשה והמעקב עובדים עליו כמו על כל מטלה. מחיקה מסירה גם
     את שורת המטלה.
     v1.7.0: "שליחת מטלות ומעקב" פוצל לשני כפתורים — סביבת המורה נפתחת בברירת מחדל על
     מסך המעקב, ולכן מורה שרצה לשלוח מטלה היה צריך לחפש את הלשונית. כל כפתור מעביר
     ל-teacher-central עם ?view= שקובע באיזו לשונית להיפתח.
     v1.8.0: הזיהוי נשמר ב-sessionStorage המשותף לכל הדפים בדומיין, ולכן מורה שעובר לסביבת
     המורה או לעורך אינו נשאל שוב. תוקף שמונה שעות, נמחק בסגירת הדפדפן. נבחר על פני העברת
     מזהה בכתובת, שנשאר בהיסטוריה ובסימניות. נוסף "יציאה מהחשבון" (MINOR) -->
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>טכנולוגיות הפקה · הכל בכף היד</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f172a;--sub:#64748b;--acc:#0ea5e9;--acc2:#0284c7;--line:#e2e8f0}
*{box-sizing:border-box}
body{margin:0;font-family:'Heebo',sans-serif;color:var(--ink);
  background:linear-gradient(160deg,#0f172a 0%,#0c4a6e 55%,#075985 100%);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:44px 18px}
header{text-align:center;color:#fff;margin-bottom:34px}
header .ic{font-size:3.4rem}
header h1{margin:8px 0 6px;font-size:2.6rem;font-weight:900;letter-spacing:-1px}
header p{margin:0;font-size:1.08rem;opacity:.75}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));
  gap:20px;width:100%;max-width:960px}
.door{background:rgba(255,255,255,.97);border-radius:22px;padding:32px 24px;text-align:center;
  cursor:pointer;border:none;font-family:inherit;color:var(--ink);
  border-top:6px solid var(--acc);box-shadow:0 10px 30px rgba(0,0,0,.22);
  transition:transform .3s cubic-bezier(.25,.8,.25,1),box-shadow .3s}
.door:hover{transform:translateY(-8px);box-shadow:0 20px 42px rgba(0,0,0,.3)}
.door .di{font-size:3rem;margin-bottom:12px}
.door h2{margin:0 0 7px;font-size:1.45rem;font-weight:800}
.door p{margin:0;color:var(--sub);font-size:.97rem;line-height:1.5}
.d2{border-top-color:#8b5cf6}.d3{border-top-color:#10b981}.d4{border-top-color:#f59e0b}
footer{margin-top:auto;padding-top:34px;color:rgba(255,255,255,.55);font-size:.9rem;text-align:center}
footer a{color:rgba(255,255,255,.8)}
/* חלון */
.ov{position:fixed;inset:0;background:rgba(8,15,30,.72);display:none;align-items:center;
  justify-content:center;padding:18px;z-index:60;backdrop-filter:blur(4px)}
.ov.on{display:flex}
.box{background:#fff;border-radius:22px;padding:30px 28px;max-width:420px;width:100%;text-align:center;
  max-height:88vh;overflow:auto}
.box h3{margin:0 0 5px;font-size:1.5rem;font-weight:900}
.box .s{color:var(--sub);font-size:.95rem;margin:0 0 18px}
input,select{width:100%;font-family:inherit;font-size:1rem;padding:12px 14px;margin-bottom:10px;
  border:2px solid var(--line);border-radius:12px;background:#fafbfc}
input:focus,select:focus{outline:none;border-color:var(--acc);background:#fff}
.btn{width:100%;border:none;border-radius:12px;padding:13px;cursor:pointer;font-family:inherit;
  font-weight:700;font-size:1rem;background:var(--acc);color:#fff;margin-top:4px}
.btn:hover{background:var(--acc2)}
.btn.v{background:#8b5cf6}.btn.v:hover{background:#7c3aed}
.btn.w{background:#f59e0b}.btn.w:hover{background:#d97706}
.btn.r{background:#fee2e2;color:#991b1b}
.crow{display:flex;gap:8px;align-items:center;padding:9px 11px;border:1px solid var(--line);
  border-radius:11px;margin-bottom:7px;text-align:right;font-size:.92rem}
.crow b{flex:1}
.tag{font-size:.72rem;font-weight:700;border-radius:20px;padding:2px 9px}
.mini{border:none;border-radius:9px;padding:5px 11px;cursor:pointer;font-family:inherit;
  font-weight:700;font-size:.8rem;background:#f1f5f9;color:var(--ink)}
textarea{width:100%;font-family:inherit;font-size:.95rem;padding:12px 14px;margin-bottom:10px;
  border:2px solid var(--line);border-radius:12px;background:#fafbfc;min-height:130px;resize:vertical}
.btn.ghost{background:#f1f5f9;color:var(--ink)}
.x{width:100%;border:none;background:none;cursor:pointer;font-family:inherit;
  color:var(--sub);font-size:.92rem;padding:9px;margin-top:5px}
.msg{font-size:.9rem;font-weight:600;min-height:21px;margin-top:9px}
.note{font-size:.84rem;color:var(--sub);margin-top:14px;line-height:1.6}
@media(max-width:640px){header h1{font-size:1.9rem}.door{padding:24px 18px}}
</style>
</head>
<body>

<header>
  <div class="ic">🔧</div>
  <h1>טכנולוגיות הפקה</h1>
  <p>מבנה המצלמה · חשיפה · עדשות · תאורה · סאונד · עריכה</p>
</header>

<div class="doors">
  <button class="door" onclick="openStudent()">
    <div class="di">🎓</div>
    <h2>תלמידים</h2>
    <p>המטלות שהמורה שלכם הכין — שיעורים, תרגול והגשות במקום אחד</p>
  </button>
  <button class="door d2" onclick="openTeacher()">
    <div class="di">👨‍🏫</div>
    <h2>מורים</h2>
    <p>כתיבת שיעורים, שליחת מטלות לכיתה ומעקב אחר ההגשות</p>
  </button>
  <button class="door d4" onclick="openAdmin()">
    <div class="di">⚙️</div>
    <h2>ניהול</h2>
    <p>בניית כיתות, רשימות תלמידים ושיוך מורים</p>
  </button>
  <button class="door d3" onclick="openCatalog()">
    <div class="di">📚</div>
    <h2>מאגר השיעורים</h2>
    <p>תשעה נושאים ו-48 מושגים — פתוח לעיון לכל מי שרוצה ללמוד</p>
  </button>
</div>

<footer>
  בית חינוך גליל מערבי · <a href="https://hakolbakaf.co.il">hakolbakaf.co.il</a>
</footer>

<div class="ov" id="ov" onclick="if(event.target.id==='ov')closeOv()">
  <div class="box" id="box"></div>
</div>

<script src="school-gate.js"></script>
<script>
const SUP='https://eubgzfkkovxgijhrmnif.supabase.co';
const KEY='sb_publishable_vJ768fOwYWiDWeYsBBR45g_4NM4s55p';
const HDR={apikey:KEY,Authorization:'Bearer '+KEY};
/* מורי בית הספר. עמודת school ריקה במסד ולכן הרשימה מפורשת —
   כשמורה מצטרף, מוסיפים כאן שורה עם המזהה שלו מ-lms_teachers. */
const OUR=['-OmvKR-JvG0o6e4RuD2k','-Oo4Ft_RKqXnW2E6AEZZ','-OoJeP-wq_Aoo__90WO3'];
const HIDE=/הדגמ|דמו|בדיקה|טסט|test/i;
const TALMID='https://hakolbakaf.co.il/zirot/tirgool/talmid.html';

const el=id=>document.getElementById(id);
const esc=s=>{const d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;};
const escA=s=>esc(s).replace(/"/g,'&quot;');
function show(h){ el('box').innerHTML=h; el('ov').classList.add('on'); }
function closeOv(){ el('ov').classList.remove('on'); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeOv(); });
async function sb(p){
  const r=await fetch(SUP+'/rest/v1/'+p,{headers:HDR});
  if(!r.ok)throw new Error(r.status); return await r.json();
}

/* ---------- תלמידים ---------- */
let CLASSES=[], TEACHERS={};
async function openStudent(){
  show(`<h3>🎓 כניסת תלמידים</h3>
    <p class="s">בחרו את המורה ואת הכיתה שלכם</p>
    <select id="tSel" onchange="fillCls()"><option value="">— בחרו מורה —</option></select>
    <select id="cSel" disabled><option value="">— בחרו כיתה —</option></select>
    <button class="btn" onclick="goStudent()">כניסה ←</button>
    <button class="x" onclick="closeOv()">ביטול</button>
    <div class="msg" id="m"></div>
    <p class="note">לא מוצאים את הכיתה? בקשו מהמורה את קישור הכיתה.</p>`);
  if(CLASSES.length){ fillT(); return; }
  el('m').style.color='#64748b'; el('m').textContent='טוען…';
  try{
    const inl='('+OUR.map(encodeURIComponent).join(',')+')';
    const [c,t]=await Promise.all([
      sb('lms_classes?select=teacher_id,name&teacher_id=in.'+inl+'&order=name.asc'),
      sb('lms_teachers?select=id,name&status=eq.approved&id=in.'+inl)]);
    CLASSES=c.filter(x=>!HIDE.test(x.name||''));
    t.forEach(x=>TEACHERS[String(x.id)]=x.name||'מורה');
    el('m').textContent=''; fillT();
  }catch(e){ el('m').style.color='#dc2626'; el('m').textContent='שגיאת תקשורת'; }
}
function fillT(){
  const s=el('tSel'); if(!s)return;
  [...new Set(CLASSES.map(c=>String(c.teacher_id)))].filter(i=>TEACHERS[i])
    .sort((a,b)=>TEACHERS[a].localeCompare(TEACHERS[b],'he'))
    .forEach(i=>{const o=document.createElement('option');o.value=i;o.textContent=TEACHERS[i];s.appendChild(o);});
}
function fillCls(){
  const t=el('tSel').value, s=el('cSel');
  s.innerHTML='<option value="">— בחרו כיתה —</option>'; s.disabled=!t;
  CLASSES.filter(c=>String(c.teacher_id)===t).forEach(c=>{
    const o=document.createElement('option'); o.value=c.name; o.textContent=c.name; s.appendChild(o);});
}
function goStudent(){
  const t=el('tSel').value, c=el('cSel').value, m=el('m');
  if(!t||!c){ m.style.color='#dc2626'; m.textContent='בחרו מורה וכיתה'; return; }
  location.href=TALMID+'?code='+encodeURIComponent(t)+'&class='+encodeURIComponent(c);
}

/* ---------- מורים ---------- */
/* קודם מזדהים ורק אז רואים את התפריט — מורה שאינו מנהל תוכן
   לא יראה כלל את עריכת המאגר, במקום ללחוץ ולהיחסם */
async function openTeacher(){
  if(!CT) CT=loadTeacherSession();
  if(!CT){ const t=await teacherLogin('כניסת מורים'); if(!t) return; CT=t; }
  teacherMenu();
}
function teacherMenu(){
  const admin=isAdmin(CT);
  show(`<h3>👨‍🏫 שלום ${esc(CT.name)}</h3>
    <p class="s">${esc(CT.school_name||'')}${admin?' · מנהל תוכן':''}</p>
    <button class="btn" style="background:#10b981" onclick="openCustom()">➕ תוכן משלי לכיתה</button>
    <button class="btn ghost" style="margin-top:9px"
      onclick="location.href='../../eshi/shioor/teacher-central.html?view=send'">📤 שליחת מטלה לכיתה</button>
    <button class="btn ghost" style="margin-top:9px"
      onclick="location.href='../../eshi/shioor/teacher-central.html?view=home'">📊 מעקב אחר ההגשות</button>
    ${admin?`<button class="btn v" style="margin-top:9px"
      onclick="location.href='prod-edit.html'">✍ עריכת מאגר השיעורים</button>`:''}
    <button class="x" onclick="teacherLogout()">יציאה מהחשבון</button>
    <p class="note">
      <b>תוכן משלי</b> — משימה, מצגת או קישור לכיתה שלכם בלבד.
      ${admin?'<br><b>מאגר השיעורים</b> — 48 שיעורי הליבה, משותפים לכל בתי הספר.':''}</p>`);
}
/* כניסת מורה משותפת לשתי הדלתות */
function teacherLogin(title){
  return new Promise(resolve=>{
    show(`<h3>👨‍🏫 ${esc(title||'כניסת מורה')}</h3>
      <p class="s">טלפון וסיסמה שאיתם נרשמתם</p>
      <input id="tp" type="tel" placeholder="טלפון" dir="ltr" style="text-align:right">
      <input id="tw" type="password" placeholder="סיסמה">
      <button class="btn" id="tgo">כניסה</button>
      <button class="x" onclick="closeOv()">ביטול</button>
      <div class="msg" id="m"></div>`);
    const go=async()=>{
      const m=el('m'); m.style.color='#64748b'; m.textContent='מתחבר…';
      try{
        const r=await sb('lms_teachers?select=*&phone=eq.'+encodeURIComponent(tPhone(el('tp').value)));
        const t=(r||[]).find(x=>x.password===el('tw').value&&x.status==='approved');
        if(!t){ m.style.color='#dc2626'; m.textContent='פרטים שגויים'; return; }
        const t2=await requireSchool(t);
        if(!t2){ m.style.color='#dc2626'; m.textContent='נדרש סמל מוסד'; return; }
        saveTeacherSession(t2);   /* כדי שהמסכים האחרים לא ישאלו שוב */
        resolve(t2);
      }catch(e){ m.style.color='#dc2626'; m.textContent='שגיאת תקשורת'; }
    };
    el('tgo').onclick=go;
    el('tw').addEventListener('keyup',e=>{if(e.key==='Enter')go();});
  });
}

/* ---------- תוכן כיתתי ---------- */
let CT=null, CITEMS=[], CCLASSES=[];
const KINDS={task:{n:'משימה',ic:'📝'},slides:{n:'מצגת',ic:'📊'},
             link:{n:'קישור',ic:'🔗'},video:{n:'סרטון',ic:'🎥'}};
async function openCustom(){
  if(!CT){ const t=await teacherLogin('תוכן משלי'); if(!t)return; CT=t; }
  await customLoad(); customHome();
}
function backToMenu(){ teacherMenu(); }
function teacherLogout(){ clearTeacherSession(); CT=null; CITEMS=[]; closeOv(); }
async function customLoad(){
  const [it,cl]=await Promise.all([
    sb('prod_custom?select=*&teacher_id=eq.'+encodeURIComponent(CT.id)+'&order=created_at.desc'),
    sb('lms_classes?select=name&teacher_id=eq.'+encodeURIComponent(CT.id)+'&order=name.asc')]);
  CITEMS=it||[]; CCLASSES=(cl||[]).map(x=>x.name);
}
function customHome(){
  show(`<h3>➕ תוכן משלי</h3>
    <p class="s">${esc(CT.name)} · ${CITEMS.length} פריטים · נראים רק לכיתות שלכם</p>
    <div style="text-align:right;max-height:44vh;overflow:auto">
      ${CITEMS.length?CITEMS.map((c,i)=>{
        const k=KINDS[c.kind]||KINDS.task;
        return `<div class="crow">
          <b>${k.ic} ${esc(c.title)}</b>
          <span class="tag" style="background:#dcfce7;color:#166534">${esc(c.class_name||'ללא כיתה')}</span>
          ${c.active===false?'<span class="tag" style="background:#f1f5f9;color:#94a3b8">כבוי</span>':''}
          <button class="mini" onclick="customEdit(${i})">✏</button>
        </div>`;}).join('')
      :'<p class="s">עדיין לא יצרתם תוכן. התחילו כאן.</p>'}
    </div>
    <button class="btn" style="background:#10b981;margin-top:12px" onclick="customNew()">＋ פריט חדש</button>
    <button class="x" onclick="backToMenu()">→ חזרה לתפריט</button>`);
}
function customForm(c,idx){
  show(`<h3>${idx==null?'＋ פריט חדש':'✏ עריכה'}</h3>
    <p class="s">התוכן יופיע לתלמידי הכיתה שתבחרו, ולהם בלבד</p>
    <input id="ciTitle" placeholder="כותרת — למשל: משימת צילום לשיעור הבא" value="${escA(c.title||'')}">
    <select id="ciKind">
      ${Object.entries(KINDS).map(([k,v])=>`<option value="${k}"${
        (c.kind||'task')===k?' selected':''}>${v.ic} ${esc(v.n)}</option>`).join('')}
    </select>
    <select id="ciClass">
      <option value="">— בחרו כיתה —</option>
      ${CCLASSES.map(n=>`<option value="${escA(n)}"${c.class_name===n?' selected':''}>${esc(n)}</option>`).join('')}
    </select>
    <p class="s" style="margin:4px 0;text-align:right">הנחיות או תוכן</p>
    <textarea id="ciBody" placeholder="מה התלמידים צריכים לעשות או לקרוא?">${esc(c.body_html||'')}</textarea>
    <p class="s" style="margin:4px 0;text-align:right">קישורים — אחד בכל שורה (מצגת, דרייב, יוטיוב)</p>
    <textarea id="ciLinks" style="min-height:80px" dir="ltr" placeholder="https://docs.google.com/…">${
      esc((c.links||[]).join('\n'))}</textarea>
    <p class="s" style="margin:4px 0;text-align:right">מה התלמיד מגיש</p>
    <select id="ciSubmit">
      <option value="both"${(c.submit_mode||'both')==='both'?' selected':''}>טקסט וגם קישורים</option>
      <option value="text"${c.submit_mode==='text'?' selected':''}>טקסט בלבד</option>
      <option value="links"${c.submit_mode==='links'?' selected':''}>קישורים בלבד</option>
      <option value="none"${c.submit_mode==='none'?' selected':''}>ללא הגשה — לצפייה בלבד</option>
    </select>
    <button class="btn" style="background:#10b981" onclick="customSave(${idx==null?'null':idx})">שמירה</button>
    ${idx==null?'':`<button class="btn r" style="margin-top:8px" onclick="customDel(${idx})">מחיקה</button>`}
    <button class="x" onclick="customHome()">חזרה</button>
    <div class="msg" id="m"></div>`);
}
function customNew(){ customForm({},null); }
function customEdit(i){ customForm(CITEMS[i],i); }
async function customSave(idx){
  const m=el('m');
  const title=el('ciTitle').value.trim(), cls=el('ciClass').value;
  if(!title){ m.style.color='#dc2626'; m.textContent='הזינו כותרת'; return; }
  if(!cls){ m.style.color='#dc2626'; m.textContent='בחרו כיתה'; return; }
  const body={ teacher_id:CT.id, school_id:CT.school_id||null, class_name:cls, title:title,
    kind:el('ciKind').value, body_html:el('ciBody').value.trim(),
    links:el('ciLinks').value.split('\n').map(s=>s.trim()).filter(Boolean),
    submit_mode:el('ciSubmit').value, updated_at:new Date().toISOString() };
  m.style.color='#64748b'; m.textContent='שומר…';
  try{
    const url=SUP+'/rest/v1/prod_custom'+(idx==null?'':'?id=eq.'+encodeURIComponent(CITEMS[idx].id));
    const r=await fetch(url,{method:idx==null?'POST':'PATCH',
      headers:Object.assign({'Content-Type':'application/json',Prefer:'return=representation'},HDR),
      body:JSON.stringify(idx==null?[body]:body)});
    if(!r.ok)throw new Error((await r.text()).slice(0,120));
    const saved=(await r.json())[0] || CITEMS[idx];
    /* התוכן חייב להיות גם מטלה, אחרת הכיתה לא רואה אותו:
       האזור האישי, מועדי ההגשה והמעקב כולם נשענים על lms_assignments */
    await upsertAssignment(saved);
    await customLoad(); customHome();
    const m2=el('m'); if(m2){ m2.style.color='#059669'; m2.textContent='✅ נשמר והוקצה לכיתה'; }
  }catch(e){ m.style.color='#dc2626'; m.textContent='שגיאה: '+e.message; }
}
/* שורת מטלה מקבילה לכל פריט תוכן. topic ייחודי לפי המזהה,
   ולכן on_conflict מעדכן ולא משכפל בעריכה חוזרת. */
async function upsertAssignment(c){
  const link='https://hakolbakaf.co.il/kolnoa/hafakot/prod-lesson.html?t=custom&c='+
    encodeURIComponent(c.id)+'&code='+encodeURIComponent(c.teacher_id)+
    '&class='+encodeURIComponent(c.class_name||'');
  const row={ teacher_id:c.teacher_id, class_name:c.class_name, topic:'custom_'+c.id,
    page:'custom', concept:c.id, title:c.title, link:link, active:c.active!==false };
  await fetch(SUP+'/rest/v1/lms_assignments?on_conflict=teacher_id,class_name,topic',
    { method:'POST',
      headers:Object.assign({'Content-Type':'application/json',
        Prefer:'resolution=merge-duplicates,return=minimal'},HDR),
      body:JSON.stringify([row]) });
}
async function customDel(idx){
  const c=CITEMS[idx];
  if(!confirm('למחוק את "'+c.title+'"?\n\nהמטלה תוסר מהכיתה. ההגשות יישארו במסד.'))return;
  await fetch(SUP+'/rest/v1/lms_assignments?topic=eq.'+encodeURIComponent('custom_'+c.id),
    {method:'DELETE',headers:HDR});
  await fetch(SUP+'/rest/v1/prod_custom?id=eq.'+encodeURIComponent(c.id),{method:'DELETE',headers:HDR});
  await customLoad(); customHome();
}
function tPhone(s){let p=String(s||'').replace(/\D/g,'').replace(/^00+/,'');
  if(p.indexOf('972')===0)p=p.slice(3);p=p.replace(/^0+/,'');return p?('0'+p):'';}


/* ---------- ניהול ----------
   הרשאת ניהול ניתנת לפי מזהה ולא לפי סיסמה משותפת, כדי שלא יידרש
   לשנות סיסמה כשמורה עוזב. מנהל יכול לבנות כיתה לכל מורה בבית הספר. */
let ADM=null, ACLS=[];
function openAdmin(){
  if(ADM){ admHome(); return; }
  show(`<h3>⚙️ ניהול</h3>
    <p class="s">כניסה בטלפון ובסיסמה</p>
    <input id="ap" type="tel" placeholder="טלפון" dir="ltr" style="text-align:right">
    <input id="aw" type="password" placeholder="סיסמה">
    <button class="btn w" onclick="admLogin()">כניסה</button>
    <button class="x" onclick="closeOv()">ביטול</button>
    <div class="msg" id="m"></div>`);
  el('aw').addEventListener('keyup',e=>{if(e.key==='Enter')admLogin();});
}
async function admLogin(){
  const m=el('m');
  m.style.color='#64748b'; m.textContent='מתחבר…';
  try{
    const r=await sb('lms_teachers?select=id,name,password,status&phone=eq.'+
      encodeURIComponent(tPhone(el('ap').value)));
    const t=(r||[]).find(x=>x.password===el('aw').value&&x.status==='approved');
    if(!t){ m.style.color='#dc2626'; m.textContent='פרטים שגויים'; return; }
    const t2=await requireSchool(t);
    if(!t2){ m.style.color='#dc2626'; m.textContent='נדרש סמל מוסד כדי להמשיך'; return; }
    if(!isAdmin(t2)){ m.style.color='#dc2626';
      m.textContent='אין הרשאת ניהול לחשבון הזה'; return; }
    saveTeacherSession(t2); ADM=t2; await admLoad(); admHome();
  }catch(e){ m.style.color='#dc2626'; m.textContent='שגיאת תקשורת'; }
}
let GROUPS=[], GCOUNT={};
async function admLoad(){
  /* הסינון לפי סמל מוסד ולא לפי רשימת מזהים קשיחה — כך שכל בית ספר
     רואה את עצמו בלבד, ומורה חדש נכנס בלי לעדכן קובץ */
  const sid=ADM.school_id;
  const t=await sb('lms_teachers?select=id,name&status=eq.approved&school_id=eq.'+
    encodeURIComponent(sid));
  const ids=(t||[]).map(x=>String(x.id));
  (t||[]).forEach(x=>TEACHERS[String(x.id)]=x.name||'מורה');
  const inl='('+ids.map(encodeURIComponent).join(',')+')';
  const [c,g,e]=await Promise.all([
    ids.length?sb('lms_classes?select=*&teacher_id=in.'+inl+'&order=name.asc'):[],
    sb('tiksh_groups?select=id,grade,subject,track,teacher_name,teacher_id,school_id'+
       '&school_id=eq.'+encodeURIComponent(sid)+'&order=grade.asc'),
    sb('tiksh_enrollments?select=group_id')]);
  ACLS=c||[];
  GROUPS=(g||[]).filter(x=>x.teacher_id&&ids.indexOf(String(x.teacher_id))>-1);
  GCOUNT={}; (e||[]).forEach(x=>{GCOUNT[x.group_id]=(GCOUNT[x.group_id]||0)+1;});
  SCHOOL_TEACHERS=ids;
}
let SCHOOL_TEACHERS=[];
/* שם הקבוצה חייב לכלול שכבה, מקצוע, מסלול ומורה — אף צירוף קצר יותר
   אינו ייחודי: יש שתי קבוצות "מדיה" ביא ושתי "למ\"ד" ביב. */
const gLabel=g=>`${g.grade} · ${g.subject} · ${g.track} · ${TEACHERS[g.teacher_id]||g.teacher_name}`;
const gUsed=id=>ACLS.some(c=>String(c.group_id)===String(id));
const SUBJ={tikshoret:{n:'תקשורת וחברה',ic:'📡',c:'#0ea5e9'},tech:{n:'טכנולוגיות הפקה',ic:'🔧',c:'#f59e0b'}};
function admHome(){
  show(`<h3>⚙️ ניהול כיתות</h3>
    <p class="s">${esc(ADM.school_name||'')} · ${esc(ADM.name)} · ${ACLS.length} כיתות</p>
    <div style="text-align:right;max-height:46vh;overflow:auto">
      ${ACLS.length?ACLS.map((c,i)=>{
        const s=SUBJ[c.subject||'tikshoret']||SUBJ.tikshoret;
        return `<div class="crow">
          <b>${esc(c.name)}</b>
          <span class="tag" style="background:${s.c}1f;color:${s.c}">${s.ic} ${esc(s.n)}</span>
          <span style="color:var(--sub);font-size:.83rem">${(c.students||[]).length} תלמידים</span>
          ${c.group_id?'<span class="tag" style="background:#dcfce7;color:#166534">🔗 מהשיבוץ</span>'
            :'<span class="tag" style="background:#fef3c7;color:#92400e">ידני</span>'}
          <button class="mini" onclick="admEdit(${i})">✏</button>
        </div>`;}).join('')
      :'<p class="s">עדיין אין כיתות</p>'}
    </div>
    <button class="btn w" style="margin-top:12px" onclick="admNew()">＋ כיתה חדשה</button>
    <button class="x" onclick="closeOv()">סגירה</button>`);
}
function admForm(c,idx){
  const sOpts=Object.entries(SUBJ).map(([k,v])=>
    `<option value="${k}"${(c.subject||'tikshoret')===k?' selected':''}>${v.ic} ${esc(v.n)}</option>`).join('');
  /* קבוצה שכבר משויכת לכיתה אחרת אינה מוצעת שוב — כך לא נוצרות
     שתי כיתות למידה על אותה קבוצת שיבוץ */
  const gOpts=GROUPS.filter(g=>!gUsed(g.id)||String(g.id)===String(c.group_id))
    .map(g=>`<option value="${g.id}"${String(c.group_id)===String(g.id)?' selected':''}
      >${esc(gLabel(g))} · ${GCOUNT[g.id]||0} תלמידים</option>`).join('');
  show(`<h3>${idx==null?'＋ כיתה חדשה':'✏ עריכת כיתה'}</h3>
    <p class="s">הכיתה נשענת על קבוצת שיבוץ — התלמידים נשלפים ממנה חיים</p>
    <p class="s" style="margin:0 0 4px;text-align:right;font-weight:700">קבוצת השיבוץ</p>
    <select id="cGroup" onchange="onGroupPick()">
      <option value="">— בחרו קבוצה —</option>${gOpts}</select>
    <p class="s" style="margin:0 0 4px;text-align:right;font-weight:700">שם הכיתה כפי שיוצג</p>
    <input id="cName" placeholder="למשל: הפקות יא" value="${escA(c.name||'')}">
    <p class="s" style="margin:0 0 4px;text-align:right;font-weight:700">מקצוע — קובע אילו שיעורים אפשר לשלוח</p>
    <select id="cSubject">${sOpts}</select>
    <div id="gInfo" style="text-align:right;font-size:.87rem;color:var(--sub);margin-bottom:10px"></div>
    <button class="btn w" onclick="admSave(${idx==null?'null':idx})">שמירה</button>
    ${idx==null?'':`<button class="btn r" style="margin-top:8px" onclick="admDel(${idx})">מחיקת הכיתה</button>`}
    <button class="x" onclick="admHome()">חזרה</button>
    <div class="msg" id="m"></div>`);
  onGroupPick(true);
}
/* בחירת קבוצה ממלאת שם ומקצוע כברירת מחדל, וטוענת את שמות התלמידים */
async function onGroupPick(first){
  const id=el('cGroup').value, info=el('gInfo');
  if(!id){ info.textContent=''; return; }
  const g=GROUPS.find(x=>String(x.id)===String(id));
  if(!first){
    el('cName').value = g.track + ' ' + g.grade;
    el('cSubject').value = g.subject==='מעשי' ? 'tech' : 'tikshoret';
  }
  info.textContent='טוען תלמידים…';
  try{
    const e=await sb('tiksh_enrollments?select=student_id&group_id=eq.'+encodeURIComponent(id));
    const ids=(e||[]).map(x=>x.student_id);
    if(!ids.length){ info.textContent='⚠ אין תלמידים משובצים לקבוצה'; return; }
    const s=await sb('tiksh_students?select=id,full_name&id=in.('+ids.join(',')+')');
    const names=(s||[]).map(x=>x.full_name).filter(Boolean).sort((a,b)=>a.localeCompare(b,'he'));
    info.innerHTML='<b>'+names.length+' תלמידים:</b> '+esc(names.join(' · '));
    info.dataset.names=JSON.stringify(names);
  }catch(err){ info.textContent='שגיאה בטעינת התלמידים'; }
}
function admNew(){ admForm({teacher_id:OUR[0],subject:'tech'},null); }
function admEdit(i){ admForm(ACLS[i],i); }
async function admSave(idx){
  const m=el('m');
  const name=el('cName').value.trim(), gid=el('cGroup').value;
  if(!gid){ m.style.color='#dc2626'; m.textContent='בחרו קבוצת שיבוץ'; return; }
  if(!name){ m.style.color='#dc2626'; m.textContent='הזינו שם כיתה'; return; }
  const g=GROUPS.find(x=>String(x.id)===String(gid));
  let names=[];
  try{ names=JSON.parse(el('gInfo').dataset.names||'[]'); }catch(e){}
  /* students נשמר גם כגיבוי — כדי שמסכים שעדיין קוראים אותו
     ימשיכו לעבוד עד שיעברו לשליפה חיה לפי group_id */
  const body={ teacher_id:g.teacher_id, name:name, subject:el('cSubject').value,
    group_id:Number(gid), students:names };
  m.style.color='#64748b'; m.textContent='שומר…';
  try{
    const url=SUP+'/rest/v1/lms_classes'+(idx==null?'':'?id=eq.'+encodeURIComponent(ACLS[idx].id));
    const r=await fetch(url,{method:idx==null?'POST':'PATCH',
      headers:Object.assign({'Content-Type':'application/json',Prefer:'return=representation'},HDR),
      body:JSON.stringify(idx==null?[body]:body)});
    if(!r.ok)throw new Error(await r.text());
    await admLoad(); CLASSES=[]; admHome();
  }catch(e){ m.style.color='#dc2626'; m.textContent='שגיאה: '+String(e.message).slice(0,90); }
}
async function admDel(idx){
  const c=ACLS[idx];
  if(!confirm('למחוק את הכיתה "'+c.name+'"?\n\nהמטלות וההגשות יישארו במסד.'))return;
  try{
    await fetch(SUP+'/rest/v1/lms_classes?id=eq.'+encodeURIComponent(c.id),
      {method:'DELETE',headers:HDR});
    await admLoad(); CLASSES=[]; admHome();
  }catch(e){}
}

/* ---------- מאגר השיעורים ---------- */
async function openCatalog(){
  show(`<h3>📚 מאגר השיעורים</h3><p class="s">טוען…</p>`);
  try{
    const r=await sb('prod_lessons?select=topic_key,topic_name,concept_key,concept_name,ord,theory_html'+
                     '&subject=eq.tech&order=topic_key.asc,ord.asc');
    const by={};
    r.forEach(l=>{(by[l.topic_key]=by[l.topic_key]||{n:l.topic_name,items:[]}).items.push(l);});
    const has=l=>!!String(l.theory_html||'').replace(/<[^>]+>/g,'').trim();
    const ready=r.filter(has).length;
    show(`<h3>📚 מאגר השיעורים</h3>
      <p class="s">${ready} מתוך ${r.length} מושגים כבר נכתבו</p>
      <div style="text-align:right;max-height:52vh;overflow:auto">
      ${Object.values(by).map(t=>{
        const n=t.items.filter(has).length;
        return `<div style="margin-bottom:13px">
          <div style="font-weight:800;font-size:.98rem;display:flex;gap:8px;align-items:center">
            ${esc(t.n)}<span style="font-size:.78rem;font-weight:700;border-radius:20px;padding:2px 9px;
              background:${n?'#dcfce7':'#f1f5f9'};color:${n?'#166534':'#94a3b8'}">${n}/${t.items.length}</span>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">
            ${t.items.map(l=>has(l)
              ? `<a href="prod-lesson.html?t=${escA(l.topic_key)}&c=${escA(l.concept_key)}"
                   style="font-size:.85rem;text-decoration:none;background:#e0f2fe;color:#0369a1;
                   border-radius:18px;padding:4px 12px;font-weight:600">${esc(l.concept_name)}</a>`
              : `<span style="font-size:.85rem;background:#f8fafc;color:#cbd5e1;
                   border-radius:18px;padding:4px 12px">${esc(l.concept_name)}</span>`).join('')}
          </div></div>`;}).join('')}
      </div>
      <button class="x" onclick="closeOv()">סגירה</button>`);
  }catch(e){
    show(`<h3>📚 מאגר השיעורים</h3><p class="s" style="color:#dc2626">שגיאת טעינה</p>
      <button class="x" onclick="closeOv()">סגירה</button>`);
  }
}
</script>
