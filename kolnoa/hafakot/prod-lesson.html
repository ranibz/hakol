<!DOCTYPE html>
<!-- kolnoa/hafakot/prod-lesson.html · v1.0.0 · 2026-08-04 · מציג שיעורי טכנולוגיות הפקה.
     קובץ אחד לכל 48 המושגים — התוכן נשלף מ-prod_lessons לפי ?t=topic&c=concept, בניגוד
     לזירות שבהן כל שיעור הוא קובץ נפרד. ארבעה שלבים ברצף: צפייה, תיאוריה, תרגול ומטלה,
     כשהמטלה נפתחת רק אחרי שהתרגול נענה — אותו עיקרון של הזירות. ההגשה נשמרת
     ל-prod_answers ומזוהה לפי שם התלמיד וכיתתו מהכתובת (MAJOR) -->
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שיעור · טכנולוגיות הפקה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f172a;--sub:#64748b;--acc:#0ea5e9;--acc2:#0284c7;--ok:#10b981;
      --warn:#f59e0b;--bad:#ef4444;--line:#e2e8f0;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:'Heebo',sans-serif;background:#f1f5f9;color:var(--ink);line-height:1.7}
.hero{background:linear-gradient(135deg,#0f172a,#0c4a6e);color:#fff;padding:26px 22px}
.hero .in{max-width:940px;margin:0 auto}
.hero .kick{font-size:.85rem;opacity:.8;font-weight:600}
.hero h1{margin:4px 0 0;font-size:2rem;font-weight:900;letter-spacing:-.6px}
.hero .who{margin-top:10px;font-size:.85rem;opacity:.85}
.wrap{max-width:940px;margin:0 auto;padding:20px}
.card{background:var(--card);border-radius:18px;padding:22px 24px;margin-bottom:16px;
  box-shadow:0 2px 14px rgba(15,23,42,.07)}
.card h2{margin:0 0 4px;font-size:1.2rem;display:flex;align-items:center;gap:9px}
.card .sub{color:var(--sub);font-size:.9rem;margin:0 0 14px}
/* פס התקדמות */
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.step{flex:1;min-width:110px;background:#fff;border:2px solid var(--line);border-radius:13px;
  padding:10px 13px;text-align:center;font-size:.85rem;font-weight:700;color:var(--sub)}
.step.on{border-color:var(--acc);color:var(--acc);background:#f0f9ff}
.step.done{border-color:var(--ok);color:var(--ok);background:#f0fdf4}
.step.lock{opacity:.55}
/* וידאו וגלריה */
.video{position:relative;padding-bottom:56.25%;height:0;border-radius:14px;overflow:hidden;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:11px;cursor:zoom-in;
  transition:transform .25s,box-shadow .25s;background:#e2e8f0}
.gal img:hover{transform:scale(1.03);box-shadow:0 8px 20px rgba(15,23,42,.18)}
.lb{position:fixed;inset:0;background:rgba(8,15,30,.92);display:none;align-items:center;
  justify-content:center;z-index:99;padding:20px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:88vh;border-radius:12px}
.lb .x{position:absolute;top:16px;left:20px;background:rgba(255,255,255,.15);color:#fff;
  border:none;border-radius:50%;width:42px;height:42px;font-size:1.3rem;cursor:pointer}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);
  color:#fff;border:none;border-radius:50%;width:46px;height:46px;font-size:1.5rem;cursor:pointer}
.lb .prev{right:18px}.lb .next{left:18px}
.lb .cnt{position:absolute;bottom:18px;color:#fff;font-size:.9rem;opacity:.85}
/* תרגול */
.q{border:1px solid var(--line);border-radius:13px;padding:15px 17px;margin-bottom:11px;background:#fafbfc}
.q .qt{font-weight:700;margin-bottom:9px}
.opt{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:10px;cursor:pointer;
  background:#fff;border:1px solid var(--line);margin-bottom:6px;transition:background .18s}
.opt:hover{background:#f1f5f9}
.opt input{width:17px;height:17px;accent-color:var(--acc);flex:0 0 auto}
.opt.right{background:#dcfce7;border-color:#86efac}
.opt.wrong{background:#fee2e2;border-color:#fca5a5}
textarea,input[type=text],input[type=url]{width:100%;font-family:inherit;font-size:.95rem;
  padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fff}
textarea{min-height:90px;resize:vertical;line-height:1.7}
.btn{border:none;border-radius:11px;padding:12px 22px;cursor:pointer;font-family:inherit;
  font-weight:700;font-size:.95rem;background:var(--acc);color:#fff}
.btn:hover{background:var(--acc2)}
.btn:disabled{opacity:.5;cursor:default}
.btn.g{background:var(--ok)}
.btn.s{padding:7px 14px;font-size:.85rem;background:#eef2f7;color:var(--ink)}
.locked{text-align:center;padding:34px 20px;color:var(--sub)}
.locked .ic{font-size:2.6rem;margin-bottom:8px}
.msg{font-weight:700;font-size:.92rem;margin-top:10px;min-height:22px}
.linkrow{display:flex;gap:8px;margin-bottom:7px}
.linkrow input{flex:1}
.done-box{background:#f0fdf4;border:2px solid #86efac;border-radius:14px;padding:18px;text-align:center}
@media(max-width:600px){.hero h1{font-size:1.5rem}.wrap{padding:14px}.card{padding:17px 16px}}
</style>
</head>
<body>
<div id="app"><div class="wrap"><div class="card"><p class="sub">טוען…</p></div></div></div>
<div class="lb" id="lb" onclick="if(event.target.id==='lb')lbClose()">
  <button class="x" onclick="lbClose()">✕</button>
  <button class="nav prev" onclick="lbMove(-1)">›</button>
  <img id="lbImg" alt="">
  <button class="nav next" onclick="lbMove(1)">‹</button>
  <span class="cnt" id="lbCnt"></span>
</div>

<script>
const SUP='https://eubgzfkkovxgijhrmnif.supabase.co';
const KEY='sb_publishable_vJ768fOwYWiDWeYsBBR45g_4NM4s55p';
const HDR={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
async function sb(p,m,b,x){
  const r=await fetch(SUP+'/rest/v1/'+p,{method:m||'GET',
    headers:Object.assign({},HDR,x||{}),body:b?JSON.stringify(b):undefined});
  if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,160));
  const t=await r.text(); return t?JSON.parse(t):[];
}
const el=id=>document.getElementById(id);
const esc=s=>{const d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;};
const escA=s=>esc(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const nrm=s=>String(s||'').replace(/\s+/g,' ').trim();

const P=new URLSearchParams(location.search);
const TOPIC=P.get('t')||'', CONCEPT=P.get('c')||'';
const CODE=P.get('code')||'', CLS=P.get('class')||'';
let L=null, ME='', ANS=null, PICKED={}, CHECKED=false, IMGS=[], LBi=0;

/* ===== טעינה ===== */
(async function init(){
  if(!TOPIC||!CONCEPT){ fail('כתובת חסרה — חסר נושא או מושג.'); return; }
  try{
    const r=await sb('prod_lessons?select=*&topic_key=eq.'+encodeURIComponent(TOPIC)+
                     '&concept_key=eq.'+encodeURIComponent(CONCEPT)+'&limit=1');
    if(!r.length){ fail('השיעור לא נמצא.'); return; }
    L=r[0];
    IMGS=(L.media||[]).filter(m=>m.type==='image');
    ME=localStorage.getItem('prodStudent:'+CLS)||'';
    if(ME&&CLS) await loadAnswer();
    if(!ME&&CLS){ await pickName(); return; }
    render();
  }catch(e){ fail('שגיאת טעינה: '+e.message); }
})();
function fail(m){
  el('app').innerHTML=`<div class="wrap"><div class="card">
    <h2>⚠ ${esc(m)}</h2><p class="sub">בקשו מהמורה את הקישור המעודכן.</p></div></div>`;
}
async function loadAnswer(){
  try{
    const r=await sb('prod_answers?select=*&student_name=eq.'+encodeURIComponent(ME)+
      '&class_name=eq.'+encodeURIComponent(CLS)+
      '&topic_key=eq.'+encodeURIComponent(TOPIC)+
      '&concept_key=eq.'+encodeURIComponent(CONCEPT)+'&limit=1');
    ANS=r[0]||null;
    if(ANS&&ANS.practice_answers){ PICKED=ANS.practice_answers; CHECKED=true; }
  }catch(e){}
}

/* ===== זיהוי התלמיד =====
   השם נבחר מרשימת הכיתה, כמו באזור האישי — אין הרשמה ואין סיסמה,
   הכיתה בכתובת היא מה שמגדיר את הרשימה. */
async function pickName(){
  let roster=[];
  try{
    const r=await sb('lms_classes?select=students&name=eq.'+encodeURIComponent(CLS)+'&limit=1');
    roster=((r[0]||{}).students||[]).map(s=>typeof s==='string'?s:(s.name||''));
  }catch(e){}
  el('app').innerHTML=`
  <div class="hero"><div class="in">
    <div class="kick">${esc(L.topic_name)}</div>
    <h1>${esc(L.concept_name)}</h1></div></div>
  <div class="wrap"><div class="card">
    <h2>👤 מי אתם?</h2>
    <p class="sub">בחרו את שמכם מרשימת הכיתה ${esc(CLS)} — כדי שההגשה תישמר על שמכם.</p>
    ${roster.length?`
      <select id="nameSel" style="width:100%;font-family:inherit;font-size:1rem;padding:11px 13px;
        border:1px solid var(--line);border-radius:10px">
        <option value="">— בחרו שם —</option>
        ${roster.map(n=>`<option value="${escA(n)}">${esc(n)}</option>`).join('')}
      </select>
      <button class="btn" style="margin-top:12px" onclick="setName()">המשך ←</button>`
    :`<p style="color:var(--bad)">רשימת הכיתה ריקה. בקשו מהמורה להוסיף את שמות התלמידים.</p>
      <button class="btn s" onclick="skipName()">המשך בלי זיהוי</button>`}
  </div></div>`;
}
async function setName(){
  const v=(el('nameSel')||{}).value||'';
  if(!v){ return; }
  ME=v; localStorage.setItem('prodStudent:'+CLS,v);
  await loadAnswer(); render();
}
function skipName(){ ME=''; render(); }
function changeName(e){
  if(e)e.preventDefault();
  localStorage.removeItem('prodStudent:'+CLS); ME=''; ANS=null; PICKED={}; CHECKED=false;
  pickName();
}

/* ===== מסך ===== */
const PR=()=>Array.isArray(L.practice)?L.practice:[];
const TK=()=>L.task||{};
const practiceDone=()=>CHECKED||(ANS&&ANS.practice_answers&&Object.keys(ANS.practice_answers).length);
const taskDone=()=>!!(ANS&&(nrm(ANS.task_answer)||(ANS.task_links||[]).length));

function render(){
  const vid=(L.media||[]).find(m=>m.type==='video');
  const hasPr=PR().length>0;
  el('app').innerHTML=`
  <div class="hero"><div class="in">
    <div class="kick">${esc(L.topic_name)}</div>
    <h1>${esc(L.concept_name)}</h1>
    <div class="who">${ME?('👤 '+esc(ME)+(CLS?' · '+esc(CLS):'')+
      ' <a href="#" onclick="changeName(event)" style="color:#7dd3fc;margin-inline-start:7px">לא אני</a>')
      :'👤 טרם זוהיתם — ההגשה לא תישמר'}</div>
  </div></div>
  <div class="wrap">
    <div class="steps">
      <div class="step ${vid||IMGS.length?'done':'lock'}">1 · צפייה</div>
      <div class="step ${L.theory_html?'done':'lock'}">2 · תיאוריה</div>
      <div class="step ${practiceDone()?'done':(hasPr?'on':'lock')}">3 · תרגול</div>
      <div class="step ${taskDone()?'done':(practiceDone()||!hasPr?'on':'lock')}">4 · מטלה</div>
    </div>

    ${vid?`<div class="card"><h2>🎥 צפייה</h2>
      <div class="video"><iframe src="${escA(vid.url)}" allowfullscreen
        allow="autoplay; fullscreen; picture-in-picture" title="${escA(vid.title||'')}"></iframe></div>
    </div>`:''}

    ${L.theory_html?`<div class="card"><h2>📖 תיאוריה</h2>${L.theory_html}</div>`:''}

    ${IMGS.length?`<div class="card">
      <h2>🖼️ דוגמאות והמחשות</h2>
      ${L.example_html||`<p class="sub">${IMGS.length} תמונות — לחצו להגדלה.</p>`}
      <div class="gal">${IMGS.map((m,i)=>`<img src="${escA(m.url)}" alt="${escA(m.alt||'')}"
        loading="lazy" onclick="lbOpen(${i})">`).join('')}</div>
    </div>`:''}

    ${hasPr?`<div class="card"><h2>✅ בדיקת הבנה</h2>
      <p class="sub">ענו על השאלות — המטלה תיפתח אחר כך.</p>
      <div id="qs">${PR().map((q,i)=>qHtml(q,i)).join('')}</div>
      <button class="btn" id="chkBtn" onclick="checkPractice()">בדיקה</button>
      <div class="msg" id="prMsg"></div>
    </div>`:''}

    <div class="card">
      <h2>🎯 מטלה</h2>
      ${(!hasPr||practiceDone())?taskHtml():`
        <div class="locked"><div class="ic">🔒</div>
          המטלה תיפתח אחרי שתענו על שאלות בדיקת ההבנה.</div>`}
    </div>
  </div>`;
}
function qHtml(q,i){
  const sel=PICKED['q'+i];
  if(q.type==='choice'){
    return `<div class="q"><div class="qt">${i+1}. ${esc(q.question)}</div>
      ${(q.options||[]).map((o,j)=>{
        let cls='opt';
        if(CHECKED&&sel===o) cls+= (o===q.correct_answer?' right':' wrong');
        if(CHECKED&&o===q.correct_answer) cls='opt right';
        return `<label class="${cls}">
          <input type="radio" name="q${i}" ${sel===o?'checked':''} ${CHECKED?'disabled':''}
            onchange="PICKED['q${i}']=${JSON.stringify(o).replace(/"/g,'&quot;')}">
          ${esc(o)}</label>`;}).join('')}
    </div>`;
  }
  return `<div class="q"><div class="qt">${i+1}. ${esc(q.question)}</div>
    <textarea id="qt${i}" ${CHECKED?'disabled':''}
      oninput="PICKED['q${i}']=this.value">${esc(sel||'')}</textarea></div>`;
}
function taskHtml(){
  const t=TK(), links=(ANS&&ANS.task_links)||[];
  const n=t.n||0, type=t.type||'both';
  if(taskDone()) return `<div class="done-box">
    <div style="font-size:2rem">✅</div>
    <b>המטלה הוגשה</b>
    <p class="sub" style="margin:6px 0 0">${ANS.submitted_at?
      'נשלח '+new Date(ANS.submitted_at).toLocaleString('he-IL'):''}
      ${ANS.grade!=null?' · ציון '+ANS.grade:''}</p>
    ${ANS.feedback?`<p style="margin-top:9px"><b>משוב:</b> ${esc(ANS.feedback)}</p>`:''}
    <button class="btn s" style="margin-top:11px" onclick="reopen()">עריכה מחדש</button>
  </div>`;
  return `<p>${esc(t.text||'טרם הוגדרה מטלה.')}</p>
    ${(type==='text'||type==='both')?`
      <label style="font-weight:700;font-size:.86rem;color:var(--sub)">התשובה שלכם</label>
      <textarea id="tAns"></textarea>`:''}
    ${(type==='links'||type==='both')?`
      <label style="font-weight:700;font-size:.86rem;color:var(--sub);display:block;margin-top:11px">
        קישורים לתמונות או סרטונים${n?' — נדרשים '+n:''}</label>
      <div id="links">${Array.from({length:Math.max(n,1)},(_,i)=>`
        <div class="linkrow"><input type="url" class="lnk" dir="ltr"
          placeholder="https://drive.google.com/…"></div>`).join('')}</div>
      <button class="btn s" onclick="addLink()">+ קישור נוסף</button>`:''}
    <div style="margin-top:14px">
      <button class="btn g" onclick="submitTask()">שליחת המטלה</button>
      <span class="msg" id="tMsg"></span>
    </div>`;
}
function addLink(){
  const d=document.createElement('div'); d.className='linkrow';
  d.innerHTML='<input type="url" class="lnk" dir="ltr" placeholder="https://…">';
  el('links').appendChild(d);
}
function reopen(){ ANS.task_answer=''; ANS.task_links=[]; render(); }

/* ===== תרגול ===== */
async function checkPractice(){
  const qs=PR(); let auto=0,max=0;
  qs.forEach((q,i)=>{
    if(q.type==='choice'){ max+=q.points||1; if(PICKED['q'+i]===q.correct_answer)auto+=q.points||1; }
  });
  CHECKED=true;
  await upsert({practice_answers:PICKED,score_auto:auto,score_max:max});
  render();
  const m=el('prMsg');
  if(m){ m.style.color=max&&auto===max?'#059669':'#0369a1';
    m.textContent=max?('✅ '+auto+' מתוך '+max+' — המטלה נפתחה'):'✅ נשמר — המטלה נפתחה'; }
}
/* ===== מטלה ===== */
async function submitTask(){
  const m=el('tMsg');
  const txt=el('tAns')?el('tAns').value.trim():'';
  const links=[...document.querySelectorAll('.lnk')].map(x=>x.value.trim()).filter(Boolean);
  const t=TK();
  if((t.type==='links'||t.type==='both')&&(t.n||0)>links.length){
    m.style.color='#991b1b'; m.textContent='נדרשים '+t.n+' קישורים'; return; }
  if(t.type!=='links'&&!txt){ m.style.color='#991b1b'; m.textContent='כתבו תשובה'; return; }
  m.style.color='#64748b'; m.textContent='שולח…';
  try{
    await upsert({task_answer:txt,task_links:links,submitted_at:new Date().toISOString()});
    render();
  }catch(e){ m.style.color='#991b1b'; m.textContent='שגיאה: '+e.message; }
}
/* שמירה — שורה אחת לכל תלמיד בכל מושג */
async function upsert(patch){
  if(!ME||!CLS){ return; }
  const body=Object.assign({
    teacher_id:CODE, class_name:CLS, student_name:ME,
    topic_key:TOPIC, concept_key:CONCEPT
  }, patch);
  const r=await sb('prod_answers?on_conflict=student_name,class_name,topic_key,concept_key',
    'POST',[body],{Prefer:'resolution=merge-duplicates,return=representation'});
  ANS=Object.assign(ANS||{},(r&&r[0])||body);
}

/* ===== גלריה ===== */
function lbOpen(i){ LBi=i; el('lb').classList.add('on'); lbShow(); }
function lbClose(){ el('lb').classList.remove('on'); }
function lbMove(d){ LBi=(LBi+d+IMGS.length)%IMGS.length; lbShow(); }
function lbShow(){
  el('lbImg').src=IMGS[LBi].url;
  el('lbImg').alt=IMGS[LBi].alt||'';
  el('lbCnt').textContent=(LBi+1)+' / '+IMGS.length;
}
document.addEventListener('keydown',e=>{
  if(!el('lb').classList.contains('on'))return;
  if(e.key==='Escape')lbClose();
  if(e.key==='ArrowRight')lbMove(-1);
  if(e.key==='ArrowLeft')lbMove(1);
});
</script>
</body>
</html>
