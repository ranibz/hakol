<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מילון מושגים בקולנוע · תיק הפקה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&family=Secular+One&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16131c; --paper:#f7f4ef; --line:#e4dfd6; --muted:#6d6577; --gold:#c9a227;
  /* צבע לכל שלב: גוון חזק לאייקון ולכותרת, ופסטל לרקע הרצועה */
  --c0:#b7791f; --b0:#fdf3dc;
  --c1:#b03a6a; --b1:#fceaf1;
  --c2:#4a45a3; --b2:#eae8fb;
  --c3:#0f766e; --b3:#dff3f0;
  --c4:#bf4526; --b4:#fdeae3;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Heebo',sans-serif;background:var(--paper);color:var(--ink);
  line-height:1.65;padding-bottom:60px;-webkit-text-size-adjust:100%}
h1,h2,h3,.disp{font-family:'Secular One',sans-serif;font-weight:400}

.top{background:var(--ink);color:#fff;padding:18px 0 0}
.top .in{max-width:1040px;margin:0 auto;padding:0 16px 16px}
.top h1{font-size:1.65rem;letter-spacing:-.3px}
.top p{color:#cfc7dd;font-size:.92rem;margin-top:4px}
.perf{display:flex;gap:6px;padding:0 16px 10px;max-width:1040px;margin:0 auto;opacity:.5}
.perf i{display:block;width:16px;height:11px;border-radius:2px;background:#4a4458}
.wrap{max-width:1040px;margin:0 auto;padding:18px 16px 0}

/* ===== חיפוש וסינון ===== */
.tools{position:sticky;top:0;z-index:20;background:var(--paper);
  padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:18px}
.srch{position:relative}
.srch input{width:100%;font-family:inherit;font-size:16px;padding:14px 46px 14px 14px;
  border:2px solid var(--ink);border-radius:16px;background:#fff;color:var(--ink)}
.srch input:focus{outline:none;box-shadow:0 0 0 3px rgba(201,162,39,.35)}
.srch .mag{position:absolute;inset-inline-end:15px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:1.1rem}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);
  background:#fff;color:#4a4458;border-radius:22px;padding:7px 15px;font-family:inherit;
  font-weight:800;font-size:.86rem;cursor:pointer;white-space:nowrap}
.chip .e{font-size:1.05rem;line-height:1}
.chip.on{color:#fff}
.chip.s0.on{background:var(--c0);border-color:var(--c0)}
.chip.s1.on{background:var(--c1);border-color:var(--c1)}
.chip.s2.on{background:var(--c2);border-color:var(--c2)}
.chip.s3.on{background:var(--c3);border-color:var(--c3)}
.chip.s4.on{background:var(--c4);border-color:var(--c4)}
.chip.all.on{background:var(--ink);border-color:var(--ink)}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;
  font-size:.86rem;color:var(--muted)}
.meta .sp{margin-inline-start:auto;display:flex;gap:7px}
.mini{border:2px solid var(--line);background:#fff;border-radius:12px;padding:7px 13px;
  font-family:inherit;font-weight:800;font-size:.83rem;cursor:pointer;color:var(--ink)}
.mini.on{background:var(--gold);border-color:var(--gold)}

/* ===== רצועת שלב ===== */
.sec{border-radius:22px;padding:16px 15px 18px;margin-bottom:18px}
.sec.s0{background:var(--b0)} .sec.s1{background:var(--b1)}
.sec.s2{background:var(--b2)} .sec.s3{background:var(--b3)}
.sec.s4{background:var(--b4)}
.band{display:flex;align-items:center;gap:13px;margin-bottom:14px}
.band .ic{width:60px;height:60px;border-radius:19px;display:flex;align-items:center;
  justify-content:center;font-size:2rem;background:#fff;flex:0 0 auto;
  box-shadow:0 3px 0 rgba(0,0,0,.07)}
.sec.s0 .ic{color:var(--c0)} .sec.s1 .ic{color:var(--c1)}
.band h2{font-size:1.25rem;line-height:1.2}
.sec.s0 .band h2{color:#8a5a12} .sec.s1 .band h2{color:#8a2a50}
.sec.s2 .band h2{color:#3a357f} .sec.s3 .band h2{color:#0b5b55}
.sec.s4 .band h2{color:#93351d}
.band .team{font-size:.85rem;color:#5d5668;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:10px}

/* ===== כרטיס מושג ===== */
.t{background:#fff;border-radius:15px;padding:13px 15px;box-shadow:0 1px 0 rgba(0,0,0,.05)}
.t h3{font-size:1.08rem;margin-bottom:4px}
.t p{font-size:.92rem;color:#3c3746}
.t .lnks{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.t a{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:800;
  text-decoration:none;color:var(--ink);background:#f4f1ea;border:1px solid var(--line);
  border-radius:10px;padding:6px 11px}
.t a:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.t .none{margin-top:9px;font-size:.77rem;font-weight:800;color:#a2998f}
.t.miss{background:rgba(255,255,255,.62);border:1px dashed rgba(0,0,0,.12)}
.hl{background:#fdf0b8;border-radius:3px}
.empty{text-align:center;color:var(--muted);padding:50px 20px}

/* ===== תרגול ===== */
.card{border-radius:24px;padding:30px 22px 44px;text-align:center;min-height:300px;
  display:flex;flex-direction:column;justify-content:center;gap:13px;cursor:pointer;
  position:relative;color:var(--ink)}
.card.s0{background:var(--b0)} .card.s1{background:var(--b1)}
.card.s2{background:var(--b2)} .card.s3{background:var(--b3)}
.card.s4{background:var(--b4)}
.card .ce{font-size:3.1rem;line-height:1}
.card .k{font-family:'Secular One',sans-serif;font-size:2rem;line-height:1.2}
.card .d{font-size:1.02rem;color:#3c3746;max-width:520px;margin:0 auto}
.card .tap{position:absolute;bottom:14px;inset-inline:0;font-size:.78rem;color:#6d6577}
.card .stg{position:absolute;top:14px;inset-inline-end:18px;font-size:.78rem;
  font-weight:800;color:#5d5668}
.qbar{display:flex;gap:9px;margin-top:13px}
.qbar button{flex:1;border:0;border-radius:14px;padding:14px;font-family:inherit;
  font-weight:800;font-size:.98rem;cursor:pointer}
.qbar .no{background:#f6dede;color:#8f2020}
.qbar .yes{background:#ddf0df;color:#1a5c2a}
.prog{height:8px;background:#e6e1d8;border-radius:5px;overflow:hidden;margin-top:13px}
.prog i{display:block;height:100%;background:var(--gold)}
.qmeta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);
  margin-top:8px}
.done{text-align:center;padding:26px 10px}
.done .big{font-family:'Secular One',sans-serif;font-size:2.2rem;margin:6px 0}

/* ===== טלפון ===== */
@media (max-width:640px){
  /* ⚠ שורה אחת נגללת במקום ארבע שורות שבורות. ההזחה השלילית
     מאפשרת לצ׳יפ הראשון והאחרון להיצמד לשוליים בזמן גלילה. */
  .chips{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;margin-inline:-16px;padding:2px 16px 4px}
  .chips::-webkit-scrollbar{display:none}
  .chip{padding:10px 16px;font-size:.88rem}      /* 44 גובה */
  .mini{padding:10px 14px;font-size:.85rem}
  .t a{padding:10px 13px;font-size:.8rem}
  .tools{padding:10px 0 8px}
  .meta{margin-top:8px}
}
/* ⬛ טאבלט במגע: הצ׳יפים לא צריכים לגלול, אבל האצבע עדיין אצבע. */
@media (hover:none) and (pointer:coarse){
  .chip{padding:10px 16px}
  .mini{padding:10px 14px}
  .t a{padding:10px 13px}
}
@media (max-width:560px){
  .top{padding-top:14px}
  .top h1{font-size:1.35rem}
  .top p{font-size:.86rem}
  .perf i{width:13px;height:9px}
  .grid{grid-template-columns:1fr}
  .sec{padding:14px 12px 16px;border-radius:18px}
  .band .ic{width:54px;height:54px;font-size:1.8rem;border-radius:16px}
  .band h2{font-size:1.12rem}
  .t{padding:14px 15px}
  .t h3{font-size:1.12rem}
  .t p{font-size:.95rem}
  .card{padding:26px 18px 42px;min-height:270px}
  .card .k{font-size:1.65rem} .card .ce{font-size:2.7rem}
  .qbar button{padding:16px;font-size:1rem}
}
@media print{ .tools,.perf,.qbar{display:none} body{background:#fff} .t{break-inside:avoid} }
</style>
</head>
<body>

<div class="top">
  <div class="in">
    <h1>🎬 מילון מושגים בקולנוע</h1>
    <p>תיק הפקה · <span id="cnt"></span> מושגים בחמישה שלבי עבודה</p>
  </div>
  <div class="perf" id="perf"></div>
</div>

<div class="wrap">
  <div class="tools">
    <div class="srch">
      <input id="q" type="search" placeholder="חיפוש מושג או מילה מתוך ההסבר…"
             autocomplete="off" oninput="draw()">
      <span class="mag">🔍</span>
    </div>
    <div class="chips" id="chips"></div>
    <div class="meta">
      <span id="stat"></span>
      <span class="sp">
        <button class="mini" id="qBtn" onclick="startQuiz()">🃏 תרגול</button>
        <button class="mini" id="mBtn" onclick="toggleMiss()">מה חסר?</button>
      </span>
    </div>
  </div>
  <div id="app"></div>
</div>

/* אייקון לכל שלב — נבחר לפי הפעולה עצמה: רעיון, כתיבה, מצלמה,
   הכנה לסט, וחיתוך בעריכה. */
const ICON=['💡','✍️','🎥','🎬','✂️'];
const LBL={ten:'🎥 עשר התחנות',pablo:'▶ סרטון פבלו',lesson:'📄 מערך שיעור',
           hakol:'🔗 הכל בכף היד'};
const KEYS=['ten','pablo','lesson','hakol'];
let SEC=-1, MISS=false, QUIZ=null;

const norm=s=>String(s||'').replace(/[׳״'"`־–—-]/g,'').replace(/\s+/g,'')
  .replace(/[ךםןףץ]/g,c=>({'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'}[c]));
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hasMat=t=>KEYS.some(k=>t[k]);
const all=()=>DATA.flatMap((s,i)=>s.terms.map(t=>Object.assign({_s:i},t)));

document.getElementById('cnt').textContent=all().length;
document.getElementById('perf').innerHTML=Array(28).fill('<i></i>').join('');
document.getElementById('chips').innerHTML=
  '<button class="chip all on" onclick="setSec(-1)">הכול</button>'+
  DATA.map((s,i)=>'<button class="chip s'+i+'" onclick="setSec('+i+')">'+
    '<span class="e">'+ICON[i]+'</span>'+esc(s.title)+'</button>').join('');

function setSec(i){
  SEC=(SEC===i)?-1:i;
  [...document.querySelectorAll('.chip')].forEach((c,k)=>
    c.classList.toggle('on', k===0 ? SEC<0 : k-1===SEC));
  draw();
}
function toggleMiss(){
  MISS=!MISS;
  document.getElementById('mBtn').classList.toggle('on',MISS);
  draw();
}
function match(t,q){
  if(!q) return true;
  return norm(t.term).indexOf(q)>-1 || norm(t.def).indexOf(q)>-1;
}
function picked(){
  const q=norm(document.getElementById('q').value);
  return all().filter(t=>(SEC<0||t._s===SEC) && (!MISS||!hasMat(t)) && match(t,q));
}
/* הדגשה על הטקסט המקורי, לפי מיקום שנמצא במחרוזת המנורמלת */
function hl(txt,q){
  if(!q) return esc(txt);
  const n=norm(txt), i=n.indexOf(q);
  if(i<0) return esc(txt);
  let a=-1,b=-1,c=0;
  for(let k=0;k<txt.length;k++){
    if(norm(txt[k]).length){ if(c===i)a=k; c++; if(c===i+q.length){b=k+1;break;} }
  }
  if(a<0) return esc(txt);
  if(b<0) b=txt.length;
  return esc(txt.slice(0,a))+'<span class="hl">'+esc(txt.slice(a,b))+'</span>'+
         esc(txt.slice(b));
}
function card(t,q){
  const links=KEYS.filter(k=>t[k]).map(k=>'<a href="'+esc(t[k])+'" target="_blank" '+
    'rel="noopener">'+LBL[k]+'</a>').join('');
  return '<div class="t'+(hasMat(t)?'':' miss')+'">'+
    '<h3>'+hl(t.term,q)+'</h3>'+
    '<p>'+hl(t.def,q)+'</p>'+
    (links?'<div class="lnks">'+links+'</div>'
          :'<div class="none">עדיין אין חומרים למושג הזה</div>')+
    (t.note?'<div class="none">'+esc(t.note)+'</div>':'')+
    '</div>';
}
function draw(){
  if(QUIZ) return drawQuiz();
  const q=norm(document.getElementById('q').value);
  const list=picked();
  document.getElementById('stat').textContent=
    list.length+' מושגים'+(MISS?' · ללא חומרים':'')+
    (SEC<0&&!q&&!MISS?'':' מתוך '+all().length);
  if(!list.length){
    document.getElementById('app').innerHTML=
      '<div class="empty">לא נמצא מושג כזה.<br>נסו מילה אחרת מתוך ההסבר.</div>';
    return;
  }
  let html='';
  DATA.forEach((s,i)=>{
    const part=list.filter(t=>t._s===i);
    if(!part.length) return;
    html+='<section class="sec s'+i+'">'+
      '<header class="band"><div class="ic">'+ICON[i]+'</div>'+
      '<div><h2>'+esc(s.title)+'</h2>'+
      '<div class="team">'+part.length+' מושגים · '+esc(s.team)+'</div></div></header>'+
      '<div class="grid">'+part.map(t=>card(t,q)).join('')+'</div></section>';
  });
  document.getElementById('app').innerHTML=html;
}

/* ===== תרגול ===== */
function startQuiz(){
  const list=picked();
  if(list.length<2){ alert('צריך לפחות שני מושגים לתרגול. נקו את החיפוש.'); return; }
  const deck=list.slice();
  for(let i=deck.length-1;i>0;i--){ const j=Math.random()*(i+1)|0;
    [deck[i],deck[j]]=[deck[j],deck[i]]; }
  QUIZ={deck:deck,i:0,open:false,ok:0,no:0};
  const b=document.getElementById('qBtn');
  b.textContent='✕ סגירת תרגול'; b.setAttribute('onclick','endQuiz()');
  drawQuiz();
}
function endQuiz(){
  QUIZ=null;
  const b=document.getElementById('qBtn');
  b.textContent='🃏 תרגול'; b.setAttribute('onclick','startQuiz()');
  draw();
}
function flip(){ QUIZ.open=!QUIZ.open; drawQuiz(); }
function mark(ok){ if(ok) QUIZ.ok++; else QUIZ.no++; QUIZ.i++; QUIZ.open=false; drawQuiz(); }
function drawQuiz(){
  const a=document.getElementById('app'), n=QUIZ.deck.length;
  if(QUIZ.i>=n){
    a.innerHTML='<div class="done"><div>סיימתם את הסבב</div>'+
      '<div class="big">'+QUIZ.ok+' מתוך '+n+'</div>'+
      (QUIZ.no?'<p>'+QUIZ.no+' מושגים שווים חזרה נוספת.</p>':
               '<p>כל המושגים ידועים. כל הכבוד.</p>')+
      '<div class="qbar"><button class="yes" onclick="startQuiz()">סבב נוסף</button>'+
      '<button class="no" onclick="endQuiz()">חזרה למילון</button></div></div>';
    return;
  }
  const t=QUIZ.deck[QUIZ.i];
  a.innerHTML=
    '<div class="card s'+t._s+'" onclick="flip()">'+
      '<span class="stg">'+esc(DATA[t._s].title)+'</span>'+
      '<div class="ce">'+ICON[t._s]+'</div>'+
      '<div class="k">'+esc(t.term)+'</div>'+
      (QUIZ.open?'<div class="d">'+esc(t.def)+'</div>':'')+
      '<span class="tap">'+(QUIZ.open?'לחיצה מסתירה':'לחיצה חושפת את ההסבר')+'</span>'+
    '</div>'+
    (QUIZ.open?'<div class="qbar">'+
      '<button class="no" onclick="mark(false)">עוד לא</button>'+
      '<button class="yes" onclick="mark(true)">ידעתי</button></div>':'')+
    '<div class="prog"><i style="width:'+Math.round(QUIZ.i/n*100)+'%"></i></div>'+
    '<div class="qmeta"><span>'+(QUIZ.i+1)+' מתוך '+n+'</span>'+
      '<span>✓ '+QUIZ.ok+' · ✕ '+QUIZ.no+'</span></div>';
}
document.addEventListener('keydown',e=>{
  if(!QUIZ||QUIZ.i>=QUIZ.deck.length) return;
  if(e.key===' '){ e.preventDefault(); flip(); }
  if(QUIZ.open&&e.key==='ArrowRight') mark(true);
  if(QUIZ.open&&e.key==='ArrowLeft')  mark(false);
});
draw();
</script>
</body>
</html>
