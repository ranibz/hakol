<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אגרון מושגים · הפקות קולנוע</title>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#141220;--soft:#6b6880;--line:#e4e0ee;--bg:#f7f6fb;--card:#fff;
  --a:#6d28d9;--pre:#0f766e;--prod:#b45309;--post:#7c3aed}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Assistant',sans-serif;
  font-size:16px;line-height:1.65;padding-bottom:60px}
h1,h2,h3{font-family:'Secular One',sans-serif;font-weight:400}

.top{background:linear-gradient(135deg,#2e1065,#6d28d9);color:#fff;padding:20px 0 16px}
.topin{max-width:1060px;margin:0 auto;padding:0 15px}
.topin h1{font-size:1.7rem}
.topin p{opacity:.85;font-size:.92rem;margin-top:3px}

.bar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
/* גובה הסרגל — נמדד בריצה ולא מנוחש. ראה הערת הגרסה v1.0.1. */
:root{--barh:56px}
.barin{max-width:1060px;margin:0 auto;padding:11px 15px;display:flex;gap:9px;
  align-items:center;flex-wrap:wrap}
.tab{background:#efeafb;color:var(--ink);border:0;border-radius:10px;padding:8px 16px;
  font-family:inherit;font-weight:800;font-size:.88rem;cursor:pointer}
.tab.on{background:var(--a);color:#fff}
input,select{font-family:inherit;font-size:.92rem;border:1px solid #d8d3e8;
  border-radius:10px;padding:8px 12px;background:#fff;color:var(--ink)}
.sp{margin-inline-start:auto}

.wrap{max-width:1060px;margin:0 auto;padding:18px 15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:17px 19px;margin-bottom:13px}
.hint{color:var(--soft);font-size:.88rem}

.stn{margin-bottom:22px}
.stn h2{font-size:1.2rem;display:flex;gap:9px;align-items:center;margin-bottom:3px}
.stn h2 i{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;
  font-style:normal;font-size:.85rem;font-weight:800;display:flex;
  align-items:center;justify-content:center;flex:0 0 auto;font-family:'Assistant'}
.stn .n{color:var(--soft);font-size:.85rem;margin-bottom:11px;padding-inline-start:37px}

.term{background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:13px 16px;margin-bottom:9px}
.term h3{font-size:1.05rem;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.term h3 .en{font-family:'Assistant';font-size:.83rem;color:var(--soft);
  direction:ltr;font-weight:600}
.term p{font-size:.95rem;margin-top:4px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.tag{font-size:.74rem;font-weight:800;border-radius:20px;padding:2px 10px;
  background:#f2eefc;color:var(--a)}
.tag.s-pre{background:#e6f5f3;color:var(--pre)}
.tag.s-prod{background:#fdf0dd;color:var(--prod)}
.tag.s-post{background:#f2eafd;color:var(--post)}
.tag.lo{background:#fff;color:var(--soft);border:1px dashed #cfc8e3}
/* v1.2.0 · בהרחבה, קישורים, ראו גם */
.more{margin-top:8px;background:#faf8ff;border-inline-start:3px solid var(--a);border-radius:0 10px 10px 0;
  padding:8px 12px;font-size:.93rem;color:#2c2840}
.more b{color:var(--a);font-size:.8rem;display:block;margin-bottom:1px}
.lnk{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.lnk a{font-size:.8rem;font-weight:700;text-decoration:none;color:var(--ink);background:#fff;
  border:1px solid var(--line);border-radius:9px;padding:4px 10px;line-height:1.4}
.lnk a:hover{border-color:var(--a);color:var(--a)}
.lnk a.video{background:#fff4f4;border-color:#f3d3d3}
.lnk a.station,.lnk a.lesson{background:#f4f0ff;border-color:#ddd2fb}
.see{font-size:.84rem;color:var(--soft);margin-top:7px}
.see a{color:var(--a);font-weight:800;cursor:pointer}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.84rem;color:var(--soft);margin-bottom:10px}
.legend b{color:var(--a);font-weight:900}
td.c.lo{color:#a59fc0;font-weight:700}
.grp{font-weight:800;color:var(--soft);font-size:.9rem;margin:6px 0 8px}

.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:11px}
.role{background:var(--card);border:2px solid var(--line);border-radius:15px;
  padding:16px;cursor:pointer;text-align:center;transition:.15s}
.role:hover{border-color:var(--a)}
.role.on{border-color:var(--a);background:#f6f2ff}
.role .ic{font-size:26px;display:block;margin-bottom:5px}
.role b{font-family:'Secular One',sans-serif;font-weight:400;font-size:1.05rem}
.role .c{color:var(--soft);font-size:.83rem}

table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right}
th{background:var(--ink);color:#fff;font-size:.76rem;font-weight:800;
  position:sticky;top:0;z-index:5;
  box-shadow:0 2px 0 rgba(0,0,0,.18)}
/* v1.2.1 — העטיפה היא שגוללת (אנכית ואופקית), ולכן הכותרת נדבקת לראשה */
/* הטבלה נכנסת ברוחב — אין עטיפת גלילה, והכותרת נדבקת מתחת לסרגל כמו שאר הדף */
.tblwrap{overflow:visible}
.tblwrap th{top:var(--barh)}
/* בטלפון הטבלה צומצמה (אייקונים, בלי עמודת תחנה) כך שהיא נכנסת ברוחב —
   ולכן גם שם בלי עטיפת גלילה, והכותרת נדבקת מתחת לסרגל. */
.tblwrap td:first-child{position:sticky;right:0;background:#fff;z-index:2;box-shadow:-2px 0 0 var(--line)}
.tblwrap tbody tr:hover td:first-child{background:#faf9fd}
.tblwrap th:first-child{position:sticky;right:0;z-index:7}
th .ri{display:none;font-size:1.05rem}
.legend .ri{display:none}
.qbox{width:230px}
td.c{text-align:center;font-weight:900;color:var(--a)}
tbody tr:hover{background:#faf9fd}
.empty{text-align:center;color:var(--soft);padding:34px 12px}
.count{color:var(--soft);font-size:.86rem;margin-bottom:12px}
@media(max-width:640px){
  th,td{padding:6px 5px;font-size:.8rem}
  .topin h1{font-size:1.25rem} .topin p{font-size:.84rem}
  .barin{padding:9px 12px;gap:7px}
  .barin .tab{padding:7px 11px;font-size:.82rem;flex:1 1 auto}
  .sp{display:none}
  #stage{flex:1 1 100%} .qbox{width:100%;flex:1 1 100%}
  .wrap{padding:14px 10px}
  .card{padding:14px 12px}
  .term{padding:12px 13px}
  .roles{grid-template-columns:1fr 1fr;gap:8px}
  .role{padding:12px 8px}
  th .rn{display:none} th .ri{display:inline}
  .legend .ri{display:inline}
  .stc{display:none}
  .tblwrap td:first-child{min-width:100px}
  table{table-layout:auto}
}
</style>
</head>
<body>

<div class="top"><div class="topin">
  <h1>🎬 אגרון מושגים · הפקות קולנוע</h1>
  <p>המושגים אינם רשימה לשינון. חשוב לדעת להסביר מהו המושג, לזהות אותו
     בעבודה ולהראות כיצד נעשה בו שימוש בסרט.</p>
</div></div>

<div class="bar"><div class="barin">
  <button class="tab on" id="t-all"  onclick="setTab('all')">כל המושגים</button>
  <button class="tab"    id="t-mat"  onclick="setTab('mat')">לפי תפקידים</button>
  <button class="tab"    id="t-role" onclick="setTab('role')">בחירת תפקיד</button>
  <span class="sp"></span>
  <select id="stage" onchange="render()">
    <option value="">כל שלבי ההפקה</option>
    <option value="pre">פרה־פרודקשן</option>
    <option value="prod">פרודקשן</option>
    <option value="post">פוסט־פרודקשן</option>
  </select>
  <input id="q" class="qbox" placeholder="חיפוש בעברית או באנגלית…" oninput="render()">
</div></div>

<div id="gate" style="position:fixed;inset:0;background:linear-gradient(135deg,#2e1065,#6d28d9);
     z-index:99;display:flex;align-items:center;justify-content:center;padding:20px">
  <div style="background:#fff;border-radius:18px;padding:26px 24px;max-width:340px;width:100%;
              text-align:center">
    <div style="font-size:34px;line-height:1;margin-bottom:8px">🎬</div>
    <h2 style="font-size:1.2rem;margin-bottom:5px">אגרון המושגים</h2>
    <p class="hint" style="margin-bottom:13px">האגרון בבדיקה וטרם נפתח לכולם.
      הזינו סיסמה.</p>
    <input id="gpw" type="password" placeholder="סיסמה" style="width:100%"
           onkeydown="if(event.key==='Enter')unlock()">
    <div style="margin-top:12px">
      <button class="tab on" style="padding:9px 22px" onclick="unlock()">כניסה ←</button>
    </div>
    <div id="gerr" style="color:#dc2626;font-weight:800;font-size:.86rem;
         margin-top:9px;min-height:19px"></div>
  </div>
</div>

<div class="wrap" id="app"><div class="card"><div class="empty">טוען…</div></div></div>

<script>
const SUP  = "https://eubgzfkkovxgijhrmnif.supabase.co";
const SKEY = "sb_publishable_vJ768fOwYWiDWeYsBBR45g_4NM4s55p";

async function sb(q){
  const r = await fetch(SUP+'/rest/v1/'+q,
    {headers:{apikey:SKEY, Authorization:'Bearer '+SKEY}});
  if(!r.ok) throw new Error(r.status+' '+(await r.text()).slice(0,150));
  return await r.json();
}
const el  = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ROLES = [
  {k:'r_producer', n:'מפיק/ה',    ic:'🗂️', d:'ארגון, תכנון, משאבים ולוחות זמנים'},
  {k:'r_director', n:'במאי/ת',    ic:'🎯', d:'פרשנות יצירתית, שפה קולנועית ושחקנים'},
  {k:'r_dop',      n:'צלם/ת',     ic:'📷', d:'פריים, עדשה, זווית, תנועה ותאורה'},
  {k:'r_editor',   n:'עורך/ת',    ic:'✂️', d:'בניית הסרט מחומרי הגלם, מבנה וקצב'},
  {k:'r_sound',    n:'פס־קול',    ic:'🎧', d:'הקלטה, אפקטים, מוזיקה ומיקס'}
];
const STAGES = {pre:'פרה', prod:'פרודקשן', post:'פוסט'};

let TERMS = [], STATIONS = [], TAB = 'all', ROLE = null;

/* ============================================================
   נעילה זמנית — עד שהתוכן יאושר
   ------------------------------------------------------------
   ⬛ לפתיחת האגרון לכולם: החליפו את '1234' במחרוזת ריקה ''.
   זו השורה היחידה שצריך לגעת בה.
   ============================================================ */
const GATE = '1234';
const GKEY = 'agron_kolnoa_view';

function unlock(){
  if(el('gpw').value !== GATE){
    el('gerr').textContent = 'סיסמה שגויה.';
    el('gpw').value = ''; el('gpw').focus();
    return;
  }
  try{ sessionStorage.setItem(GKEY,'1'); }catch(e){}
  el('gate').style.display = 'none';
  boot();
}

async function boot(){
  try{
    STATIONS = await sb('cinema_stations?select=*&order=id.asc');
    TERMS    = await sb('cinema_terms?select=*&active=is.true&order=station.asc,term.asc');
  }catch(e){
    el('app').innerHTML = '<div class="card"><div class="empty">שגיאה בטעינה: '+
      esc(String(e.message).slice(0,140))+'</div></div>';
    return;
  }
  render();
}

const stName  = id => (STATIONS.find(s=>+s.id===+id)||{}).name || ('תחנה '+id);
const stages  = t => String(t.stage||'').split(',').filter(Boolean);
const stageTag = t => stages(t).map(s =>
  '<span class="tag s-'+s+'">'+(STAGES[s]||s)+'</span>').join('');
/* v1.2.0 — דרגה לכל תפקיד: '✓' חובה · '○' כדאי להכיר · '' לא נדרש.
   מושג בלי roles (טרם עובה) — לפי r_* כמו קודם. */
const lvl = (t,k) => {
  if(t.roles && typeof t.roles==='object'){
    const v = t.roles[k]; return v==='✓' ? '✓' : (v==='○' ? '○' : '');
  }
  return t[k] ? '✓' : '';
};
const roleTags = t => ROLES.filter(r => lvl(t,r.k))
  .map(r => '<span class="tag'+(lvl(t,r.k)==='○'?' lo" title="כדאי להכיר':'')+'">'+r.n+
    (lvl(t,r.k)==='○'?' ○':'')+'</span>').join('');
const linksHtml = t => {
  const L = Array.isArray(t.links) ? t.links : [];
  if(!L.length) return '';
  return '<div class="lnk">'+L.map(l => '<a class="'+esc(l.k||'')+'" href="'+esc(l.u)+
    '" target="_blank" rel="noopener">'+esc(l.t)+'</a>').join('')+'</div>';
};
const norm = s => String(s||'').replace(/[\s־\-'׳"״]/g,'');
function seeTerm(name){
  el('q').value = name; TAB = 'all'; render();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ⚠ הסינון משותף לשלוש התצוגות, אחרת חיפוש בלשונית אחת היה
   מתנהג אחרת מבלשונית שנייה. */
function visible(){
  const q  = (el('q').value||'').trim();
  const st = el('stage').value;
  return TERMS.filter(t => {
    if(st && stages(t).indexOf(st) < 0) return false;
    if(q && (t.term+' '+(t.term_en||'')+' '+t.definition+' '+(t.details||'')).indexOf(q) < 0) return false;
    if(TAB==='role' && ROLE && !lvl(t,ROLE)) return false;
    return true;
  });
}

function setTab(t){ TAB = t; render(); }
function pickRole(k){ ROLE = (ROLE===k ? null : k); render(); }

function render(){
  ['all','mat','role'].forEach(k => el('t-'+k).classList.toggle('on', k===TAB));
  el('app').innerHTML = TAB==='mat' ? viewMatrix() :
                        TAB==='role' ? viewRole() : viewAll();
}

/* ===== 1 · כל המושגים, לפי תחנות ===== */
function termCard(t){
  return '<div class="term"><h3>'+esc(t.term)+
    (t.term_en ? '<span class="en">'+esc(t.term_en)+'</span>' : '')+'</h3>'+
    '<p>'+esc(t.definition)+'</p>'+
    (t.details ? '<div class="more"><b>בהרחבה</b>'+esc(t.details)+'</div>' : '')+
    linksHtml(t)+
    (t.see_also ? '<div class="see">ראו גם: <a onclick="seeTerm(this.textContent)">'+esc(t.see_also)+'</a></div>' : '')+
    '<div class="tags">'+stageTag(t)+roleTags(t)+'</div></div>';
}

function viewAll(){
  const list = visible();
  if(!list.length) return '<div class="card"><div class="empty">אין תוצאות.</div></div>';
  let html = '<div class="count">'+list.length+' מושגים</div>';
  STATIONS.forEach(s => {
    const inSt = list.filter(t => +t.station === +s.id);
    if(!inSt.length) return;
    html += '<div class="stn"><h2><i>'+s.id+'</i>'+esc(s.name)+'</h2>'+
      '<div class="n">'+inSt.length+' מושגים</div>'+
      inSt.map(termCard).join('')+'</div>';
  });
  return html;
}

/* ===== 2 · טבלת התפקידים ===== */
function viewMatrix(){
  const list = visible();
  if(!list.length) return '<div class="card"><div class="empty">אין תוצאות.</div></div>';
  return '<div class="card"><p class="hint" style="margin-bottom:8px">'+
    'מי צריך לדעת מה.</p>'+'<div class="legend"><span><b>✓</b> חובה לתפקיד</span><span><b style="color:#a59fc0">○</b> כדאי להכיר</span><span>ריק — לא נדרש</span></div>'+
    '<div class="legend"><span class="ri">'+ROLES.map(r=>r.ic+' '+r.n).join(' · ')+'</span></div>'+
    '<div class="tblwrap"><table><thead><tr><th>מושג</th><th class="stc">תחנה</th>'+
    ROLES.map(r=>'<th style="text-align:center" title="'+r.n+'"><span class="rn">'+r.n+'</span><span class="ri">'+r.ic+'</span></th>').join('')+
    '</tr></thead><tbody>'+
    list.map(t => '<tr><td><b>'+esc(t.term)+'</b>'+
      (t.term_en?'<div style="font-size:.78rem;color:var(--soft);direction:ltr;'+
        'text-align:right">'+esc(t.term_en)+'</div>':'')+'</td>'+
      '<td class="stc" style="font-size:.82rem">'+esc(stName(t.station))+'</td>'+
      ROLES.map(r=>{ const v=lvl(t,r.k); return '<td class="c'+(v==='○'?' lo':'')+'">'+v+'</td>'; }).join('')+
      '</tr>').join('')+
    '</tbody></table></div></div>';
}

/* ===== 3 · בחירת תפקיד ===== */
function viewRole(){
  const st = el('stage').value, q = (el('q').value||'').trim();
  const base = TERMS.filter(t => (!st || stages(t).indexOf(st)>-1) &&
    (!q || (t.term+' '+(t.term_en||'')+' '+t.definition).indexOf(q)>-1));

  let html = '<div class="card"><p class="hint" style="margin-bottom:12px">'+
    'בחרו תפקיד וראו רק את המושגים הנוגעים אליו. לחיצה נוספת מבטלת.</p>'+
    '<div class="roles">'+ ROLES.map(r =>
      '<div class="role'+(ROLE===r.k?' on':'')+'" onclick="pickRole(\''+r.k+'\')">'+
      '<span class="ic">'+r.ic+'</span><b>'+r.n+'</b>'+
      '<div class="c">'+base.filter(t=>lvl(t,r.k)==='✓').length+' חובה · '+
        base.filter(t=>lvl(t,r.k)==='○').length+' כדאי להכיר</div>'+
      '<div class="c" style="font-size:.78rem;margin-top:4px">'+esc(r.d)+'</div>'+
      '</div>').join('')+'</div></div>';

  if(!ROLE) return html;

  const list = base.filter(t => lvl(t,ROLE));
  const role = ROLES.find(r => r.k===ROLE);
  html += '<div class="count">'+role.ic+' '+role.n+' · '+list.length+' מושגים</div>';
  if(!list.length) return html + '<div class="card"><div class="empty">אין תוצאות.</div></div>';
  /* v1.2.0 — בכל תחנה: קודם מה שחובה לתפקיד, אחר כך מה שכדאי להכיר */
  STATIONS.forEach(s => {
    const inSt = list.filter(t => +t.station === +s.id);
    if(!inSt.length) return;
    const must = inSt.filter(t => lvl(t,ROLE)==='✓'), nice = inSt.filter(t => lvl(t,ROLE)==='○');
    html += '<div class="stn"><h2><i>'+s.id+'</i>'+esc(s.name)+'</h2>'+
      '<div class="n">'+inSt.length+' מושגים</div>'+
      (must.length ? (nice.length ? '<div class="grp">✓ חובה לתפקיד</div>' : '')+must.map(termCard).join('') : '')+
      (nice.length ? '<div class="grp">○ כדאי להכיר</div>'+nice.map(termCard).join('') : '')+'</div>';
  });
  return html;
}

/* ⚠ הסרגל עוטף לשתי שורות במסך צר, ולכן הגובה נמדד מחדש
   בכל שינוי גודל ולא פעם אחת בטעינה. */
function syncBar(){
  const b = document.querySelector('.bar');
  if(!b) return;
  const h = b.offsetHeight;
  /* ⚠ מדידה שרצה לפני שהדפדפן סיים לפרוס מחזירה 0,
     ואז הכותרת נדבקת לראש המסך מתחת לסרגל — בדיוק הבאג
     שתיקננו. עדיף להשאיר את ברירת המחדל. */
  if(h > 0) document.documentElement.style.setProperty('--barh', h + 'px');
}
window.addEventListener('resize', syncBar);
window.addEventListener('load', syncBar);   /* אחרי טעינת הגופנים */
syncBar();

/* GATE ריק = אין נעילה. ראה הערת הגרסה v1.1.0. */
(function(){
  let ok = !GATE;
  if(!ok){ try{ ok = sessionStorage.getItem(GKEY) === '1'; }catch(e){} }
  if(ok){ el('gate').style.display = 'none'; boot(); }
  else  { setTimeout(()=>{ const p=el('gpw'); if(p) p.focus(); }, 60); }
})();
</script>
