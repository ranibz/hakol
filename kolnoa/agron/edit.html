<!DOCTYPE html>
<!-- agron-kolnoa/edit.html · v1.0.0 · 2026-09-09 · RanLMS
     © רני בן זאב. יוזמה עצמאית, מימון עצמי.

     עורך אגרון המושגים של הפקות קולנוע. 129 מושגים בעשר תחנות,
     שמוזגו משני מסמכי תשפ״ז.

     ⬛ המסך נפתח על "לבחירה" בכוונה. 78 מושגים הגיעו משני המסמכים
     עם שני ניסוחים שונים, ואף אחד מהם לא הוכרע. זו העבודה הדחופה,
     ולכן היא המסך הראשון ולא רשימה כללית.

     ⚠ שום ניסוח לא נמחק בייבוא. alt_definition מחזיק את הגרסה
     השנייה, ו-reviewed מסמן מה כבר הוכרע. אחרי בחירה הניסוח שנדחה
     נמחק — אבל רק אז, ורק בלחיצה מפורשת.

     ⚠ הטבלה יושבת בפרויקט matalot (eubgzfkkovxgijhrmnif), שם יושב
     גם אגרון התקשורת. היא נפרדת ממנו לגמרי: אין בקולנוע זירות,
     והציר המארגן הוא עשר תחנות ההפקה.

     ⬛ שדה term_en נפרד מהמונח העברי. "רום טון" ו-Room Tone הם
     אותו מושג, וערבוב שלהם בשם אחד שובר חיפוש בשתי השפות.

     ⚠ המסך נעול בסיסמה. זו אינה אבטחה: הסיסמה נבדקת בדפדפן,
     ומי שפותח כלי מפתחים עוקף אותה. המפתח הציבורי של המסד
     יושב בקוד המקור ממילא, וההרשאה במסד היא anon all.
     מה שהסיסמה כן עושה: מונעת כניסה מקרית של תלמיד שהגיע
     מהקישור שבתחתית דף הקולנוע.

     ⚠ האישור נשמר לשעה ב-sessionStorage ולא לצמיתות: במחשב משותף
     בחדר מורים אישור קבוע הוא פרצה. -->
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>עורך אגרון קולנוע</title>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--a:#6d28d9;--ink:#1f2340;--soft:#6a6f8a;--bg:#f7f5fc;--line:#e6e2f2;
  --ok:#12b76a;--no:#dc2626;--warn:#c98a12;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Assistant',sans-serif;
  font-size:16px;line-height:1.6;padding-bottom:60px}
h1,h2,h3{font-family:'Secular One',sans-serif;font-weight:400}

.top{background:linear-gradient(135deg,#4c1d95,#6d28d9);color:#fff;padding:13px 0;
  position:sticky;top:0;z-index:30}
.topin{max-width:1120px;margin:0 auto;padding:0 15px;display:flex;gap:12px;
  align-items:center;flex-wrap:wrap}
.topin h1{font-size:1.28rem}
.topin .sb{opacity:.85;font-size:.85rem}
.sp{margin-inline-start:auto}
.wrap{max-width:1120px;margin:0 auto;padding:16px 15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:18px 20px;margin-bottom:13px}
label{display:block;font-weight:800;font-size:.83rem;margin-bottom:5px}
input,select,textarea{font-family:inherit;font-size:.95rem;border:1px solid #d8d3e8;
  border-radius:10px;padding:9px 12px;width:100%;background:#fff;color:var(--ink)}
textarea{min-height:110px;line-height:1.7;resize:vertical}
input[type=checkbox]{width:auto}
.row{display:flex;gap:11px;flex-wrap:wrap}
.row>div{flex:1;min-width:150px}
.btn{background:var(--a);color:#fff;border:0;border-radius:11px;padding:10px 20px;
  font-family:inherit;font-weight:800;font-size:.92rem;cursor:pointer}
.btn:hover{filter:brightness(.92)}
.btn.g{background:#efeafb;color:var(--a)}
.btn.no{background:var(--no)}
.btn.sm{padding:6px 13px;font-size:.83rem;border-radius:9px}
.tabs{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.tab{background:#efeafb;color:var(--ink);border:0;border-radius:10px;padding:8px 17px;
  font-family:inherit;font-weight:800;font-size:.88rem;cursor:pointer}
.tab.on{background:var(--a);color:#fff}
.hint{color:var(--soft);font-size:.87rem;margin-bottom:13px}

.dup{border:1px solid var(--line);border-radius:14px;padding:15px 17px;margin-bottom:12px}
.dup.done{opacity:.55;border-style:dashed}
.dup h3{font-size:1.08rem}
.dup .meta{color:var(--soft);font-size:.83rem;margin-bottom:11px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media(max-width:700px){.two{grid-template-columns:1fr}}
.opt{border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;
  background:#fbfaff}
.opt:hover{border-color:#c9bff0}
.opt.pick{border-color:var(--a);background:#f4f0ff}
.opt .lab{font-size:.76rem;font-weight:800;color:var(--soft);margin-bottom:5px}
.opt p{font-size:.93rem;line-height:1.65}
.acts{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap;align-items:center}
.roles{display:flex;gap:9px;flex-wrap:wrap;margin:9px 0}
.roles label{display:flex;gap:5px;align-items:center;background:#faf9fd;
  border:1px solid var(--line);border-radius:9px;padding:5px 11px;font-size:.85rem;
  font-weight:700;margin:0;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right}
th{font-size:.78rem;color:var(--soft);font-weight:800}
tbody tr:hover{background:#faf9fd}
.pill{display:inline-block;font-size:.74rem;font-weight:800;border-radius:20px;padding:2px 9px}
.pill.d{background:#fdf0d8;color:#8a5a00}
.pill.k{background:#e7f7ee;color:#0f7a4d}
.msg{font-weight:800;font-size:.87rem;margin-top:9px;min-height:19px}
.msg.ok{color:#0f7a4d} .msg.no{color:var(--no)}
.empty{text-align:center;color:var(--soft);padding:30px 12px}
.bar{background:#f4f0ff;border:1px solid #ddd4f5;border-radius:12px;
  padding:11px 14px;margin-bottom:14px;font-size:.9rem;font-weight:700}
</style>
</head>
<body>

<div class="top"><div class="in topin">
  <h1>🎬 עורך אגרון קולנוע</h1>
  <span class="sb" id="cnt"></span>
  <span class="sp"></span>
  <input id="q" placeholder="חיפוש מושג…" style="width:220px" oninput="render()">
</div></div>

<div id="gate" style="position:fixed;inset:0;background:linear-gradient(135deg,#2e1065,#6d28d9);
     z-index:99;display:flex;align-items:center;justify-content:center;padding:20px">
  <div style="background:#fff;border-radius:18px;padding:26px 24px;max-width:360px;width:100%">
    <h2 style="font-size:1.25rem;margin-bottom:5px">ניהול האגרון</h2>
    <p class="hint">המסך מיועד למורים. הזינו סיסמה.</p>
    <input id="pw" type="password" placeholder="סיסמה"
           onkeydown="if(event.key==='Enter')unlock()">
    <div style="margin-top:12px"><button class="btn" onclick="unlock()">כניסה ←</button></div>
    <div class="msg no" id="gerr"></div>
    <p class="hint" style="margin-top:14px;margin-bottom:0">
      לעיון באגרון עצמו — <a href="index.html" style="color:var(--a)">לחצו כאן</a>.</p>
  </div>
</div>

<div class="wrap">
  <div class="tabs">
    <button class="tab on" id="t-dup"  onclick="setTab('dup')">לבחירה</button>
    <button class="tab"    id="t-all"  onclick="setTab('all')">כל המושגים</button>
    <button class="tab"    id="t-new"  onclick="setTab('new')">מושג חדש</button>
  </div>
  <div id="app"><div class="card"><div class="empty">טוען…</div></div></div>
</div>

<script>
/* הפרויקט של האגרונים — נפרד מ-ranlms ומ-emergency */
const SUP  = "https://eubgzfkkovxgijhrmnif.supabase.co";
const SKEY = "sb_publishable_vJ768fOwYWiDWeYsBBR45g_4NM4s55p";
const HDR  = {apikey:SKEY, Authorization:'Bearer '+SKEY};
const HDRJ = Object.assign({'Content-Type':'application/json'}, HDR);

async function sb(q, method, body, prefer){
  const h = method ? Object.assign({}, HDRJ) : Object.assign({}, HDR);
  if(prefer) h.Prefer = prefer;
  const r = await fetch(SUP+'/rest/v1/'+q, {method:method||'GET', headers:h,
    body: body ? JSON.stringify(body) : undefined});
  if(!r.ok) throw new Error(r.status+' '+(await r.text()).slice(0,180));
  const t = await r.text();
  return t ? JSON.parse(t) : [];
}
const el  = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ROLES = [['r_producer','מפיק/ה'],['r_director','במאי/ת'],['r_dop','צלם/ת'],
               ['r_editor','עורך/ת'],['r_sound','פס־קול']];
const STAGES = {pre:'פרה', prod:'פרודקשן', post:'פוסט'};

let TERMS = [], STATIONS = [], TAB = 'dup', PICK = {};

/* ============================================================
   נעילה
   ------------------------------------------------------------
   ⚠ ראה הערת הכותרת: זו אינה אבטחה אלא מניעת כניסה מקרית.
   sessionStorage ולא localStorage — במחשב משותף אישור קבוע הוא פרצה.
   ============================================================ */
const PASS = 'Galil2025!';
const GKEY = 'agron_kolnoa_ok';

function unlock(){
  const v = (el('pw').value||'');
  if(v !== PASS){
    el('gerr').textContent = 'סיסמה שגויה.';
    el('pw').value = ''; el('pw').focus();
    return;
  }
  try{ sessionStorage.setItem(GKEY,'1'); }catch(e){}
  el('gate').style.display = 'none';
  boot();
}

async function boot(){
  try{
    STATIONS = await sb('cinema_stations?select=*&order=id.asc');
    TERMS    = await sb('cinema_terms?select=*&active=is.true&order=station.asc,term.asc');
  }catch(e){
    el('app').innerHTML = '<div class="card"><div class="empty">שגיאה בטעינה: '+
      esc(String(e.message).slice(0,150))+'</div></div>';
    return;
  }
  render();
}
const stName = id => (STATIONS.find(s=>+s.id===+id)||{}).name || ('תחנה '+id);
const stageTxt = s => String(s||'').split(',').map(x=>STAGES[x]||x).join(' · ');

function setTab(t){ TAB = t; render(); }

function match(t){
  const q = (el('q').value||'').trim();
  if(!q) return true;
  return (t.term+' '+(t.term_en||'')+' '+t.definition).indexOf(q) > -1;
}

function render(){
  ['dup','all','new'].forEach(k =>
    el('t-'+k).classList.toggle('on', k===TAB));
  const dups = TERMS.filter(t => t.alt_definition && !t.reviewed);
  el('cnt').textContent = TERMS.length + ' מושגים · ' + dups.length + ' ממתינים לבחירה';
  el('app').innerHTML = TAB==='dup' ? viewDup(dups) : TAB==='all' ? viewAll() : viewNew();
}

/* ============================================================
   לבחירה — שני ניסוחים זה לצד זה
   ------------------------------------------------------------
   ⚠ הבחירה מוחקת את הניסוח שנדחה. עד הלחיצה שניהם קיימים במסד,
   ולכן אפשר לעצור באמצע ולחזור מחר.
   ============================================================ */
function viewDup(dups){
  const list = dups.filter(match);
  if(!TERMS.filter(t=>t.alt_definition && !t.reviewed).length)
    return '<div class="card"><div class="empty">✅ עברתם על כל הניסוחים הכפולים.</div></div>';
  if(!list.length)
    return '<div class="card"><div class="empty">אין תוצאות לחיפוש הזה.</div></div>';

  return '<div class="bar">' + list.length + ' מושגים הגיעו משני המסמכים עם ניסוח שונה. ' +
    'בחרו את הניסוח הנכון, או כתבו אחד משלכם.</div>' +
    list.map(t => {
      const p = PICK[t.id];
      return '<div class="card dup"><h3>'+esc(t.term)+
        (t.term_en?' <span style="color:var(--soft);font-size:.85rem">'+esc(t.term_en)+'</span>':'')+
        '</h3>'+
        '<div class="meta">'+esc(stName(t.station))+' · '+esc(stageTxt(t.stage))+'</div>'+
        '<div class="two">'+
          '<div class="opt'+(p==='a'?' pick':'')+'" onclick="pick('+t.id+',\'a\')">'+
            '<div class="lab">מתוך המילון</div><p>'+esc(t.definition)+'</p></div>'+
          '<div class="opt'+(p==='b'?' pick':'')+'" onclick="pick('+t.id+',\'b\')">'+
            '<div class="lab">מתוך טבלת התפקידים</div><p>'+esc(t.alt_definition)+'</p></div>'+
        '</div>'+
        '<div class="acts">'+
          '<button class="btn sm" onclick="keep('+t.id+')">שמירת הבחירה</button>'+
          '<button class="btn g sm" onclick="both('+t.id+')">איחוד השניים לתיבה</button>'+
          '<span class="msg" id="m'+t.id+'"></span>'+
        '</div>'+
        '<div id="e'+t.id+'"></div></div>';
    }).join('');
}

function pick(id, which){ PICK[id] = which; render(); }

/* איחוד — פותח תיבת עריכה עם שני הניסוחים, כדי לנסח מחדש */
function both(id){
  const t = TERMS.find(x=>+x.id===+id);
  el('e'+id).innerHTML =
    '<label style="margin-top:11px">ניסוח משלכם</label>'+
    '<textarea id="tx'+id+'">'+esc(t.definition+'\n\n'+t.alt_definition)+'</textarea>'+
    '<div class="acts"><button class="btn sm" onclick="keepText('+id+')">'+
    'שמירת הניסוח הזה</button></div>';
}

async function keep(id){
  const t = TERMS.find(x=>+x.id===+id);
  const p = PICK[id];
  if(!p){ el('m'+id).className='msg no'; el('m'+id).textContent='בחרו ניסוח.'; return; }
  await save(id, p==='a' ? t.definition : t.alt_definition);
}
async function keepText(id){
  const v = (el('tx'+id).value||'').trim();
  if(!v){ el('m'+id).className='msg no'; el('m'+id).textContent='התיבה ריקה.'; return; }
  await save(id, v);
}

async function save(id, def){
  const m = el('m'+id);
  try{
    /* ⚠ הניסוח שנדחה נמחק רק כאן, בלחיצה מפורשת. */
    await sb('cinema_terms?id=eq.'+id, 'PATCH',
      {definition:def, alt_definition:null, reviewed:true,
       updated_at:new Date().toISOString()});
    const t = TERMS.find(x=>+x.id===+id);
    t.definition = def; t.alt_definition = null; t.reviewed = true;
    delete PICK[id];
    render();
  }catch(e){ if(m){ m.className='msg no'; m.textContent='שגיאה: '+String(e.message).slice(0,90); } }
}

/* ============================================================
   כל המושגים
   ============================================================ */
function viewAll(){
  const list = TERMS.filter(match);
  return '<div class="card"><p class="hint">'+list.length+' מושגים. '+
    'לחיצה על שורה פותחת עריכה.</p>'+
    '<table><thead><tr><th>מושג</th><th>לועזי</th><th>תחנה</th><th>שלב</th>'+
    '<th>תפקידים</th><th>מצב</th></tr></thead><tbody>'+
    list.map(t => '<tr onclick="edit('+t.id+')" style="cursor:pointer">'+
      '<td><b>'+esc(t.term)+'</b></td>'+
      '<td style="direction:ltr;text-align:left;font-size:.85rem">'+esc(t.term_en||'—')+'</td>'+
      '<td>'+esc(stName(t.station))+'</td>'+
      '<td>'+esc(stageTxt(t.stage))+'</td>'+
      '<td style="font-size:.82rem">'+
        (ROLES.filter(r=>t[r[0]]).map(r=>r[1]).join(', ')||'—')+'</td>'+
      '<td>'+(t.alt_definition && !t.reviewed
        ? '<span class="pill d">לבחירה</span>'
        : '<span class="pill k">מוכן</span>')+'</td></tr>').join('')+
    '</tbody></table><div id="ebox"></div></div>';
}

function fields(t){
  t = t || {station:1, stage:'pre'};
  return '<div class="row"><div><label>מושג</label>'+
      '<input id="fTerm" value="'+esc(t.term||'')+'"></div>'+
    '<div><label>מונח לועזי</label>'+
      '<input id="fEn" dir="ltr" style="text-align:left" value="'+esc(t.term_en||'')+'"></div></div>'+
    '<div class="row" style="margin-top:11px"><div><label>תחנה</label>'+
      '<select id="fSt">'+STATIONS.map(s=>'<option value="'+s.id+'"'+
        (+s.id===+t.station?' selected':'')+'>'+s.id+'. '+esc(s.name)+'</option>').join('')+
      '</select></div>'+
    '<div><label>שלב הפקה</label><select id="fStage">'+
      ['pre','prod','post','pre,prod','prod,post','pre,prod,post'].map(v=>
        '<option value="'+v+'"'+(v===t.stage?' selected':'')+'>'+stageTxt(v)+'</option>').join('')+
      '</select></div></div>'+
    '<div class="roles">'+ROLES.map(r=>'<label><input type="checkbox" id="f'+r[0]+'"'+
      (t[r[0]]?' checked':'')+'>'+r[1]+'</label>').join('')+'</div>'+
    '<label>הגדרה</label><textarea id="fDef">'+esc(t.definition||'')+'</textarea>';
}

function readFields(){
  const o = {term:el('fTerm').value.trim(), term_en:el('fEn').value.trim()||null,
    station:+el('fSt').value, stage:el('fStage').value,
    definition:el('fDef').value.trim(), updated_at:new Date().toISOString()};
  ROLES.forEach(r => { o[r[0]] = el('f'+r[0]).checked; });
  return o;
}

function edit(id){
  const t = TERMS.find(x=>+x.id===+id);
  el('ebox').innerHTML = '<div class="card" style="margin-top:14px">'+
    '<h3>עריכת "'+esc(t.term)+'"</h3>'+ fields(t)+
    '<div class="acts"><button class="btn" onclick="saveEdit('+id+')">שמירה</button>'+
    '<button class="btn g" onclick="render()">ביטול</button>'+
    '<span class="msg" id="em"></span></div></div>';
  el('ebox').scrollIntoView({behavior:'smooth', block:'nearest'});
}

async function saveEdit(id){
  const o = readFields(), m = el('em');
  if(!o.term || !o.definition){ m.className='msg no'; m.textContent='מושג והגדרה הם שדות חובה.'; return; }
  try{
    await sb('cinema_terms?id=eq.'+id, 'PATCH', o);
    Object.assign(TERMS.find(x=>+x.id===+id), o);
    render();
  }catch(e){ m.className='msg no'; m.textContent='שגיאה: '+String(e.message).slice(0,90); }
}

/* ============================================================
   מושג חדש
   ============================================================ */
function viewNew(){
  return '<div class="card"><h3>מושג חדש</h3>'+
    '<p class="hint">המושג ייכנס לתחנה שתבחרו ויופיע מיד בכל מקום שמושך מהאגרון.</p>'+
    fields(null)+
    '<div class="acts"><button class="btn" onclick="addTerm()">הוספה</button>'+
    '<span class="msg" id="em"></span></div></div>';
}

async function addTerm(){
  const o = readFields(), m = el('em');
  if(!o.term || !o.definition){ m.className='msg no'; m.textContent='מושג והגדרה הם שדות חובה.'; return; }
  /* ⚠ אזהרה על כפילות, בלי לחסום: יש מושגים שחוזרים בשתי תחנות בכוונה. */
  const dup = TERMS.find(t => t.term === o.term);
  if(dup && !confirm('"'+o.term+'" כבר קיים בתחנה '+stName(dup.station)+'.\n\nלהוסיף בכל זאת?')) return;
  try{
    const r = await sb('cinema_terms', 'POST', [o], 'return=representation');
    if(r && r.length) TERMS.push(r[0]);
    TERMS.sort((a,b)=> a.station-b.station || String(a.term).localeCompare(b.term,'he'));
    TAB = 'all'; render();
  }catch(e){ m.className='msg no'; m.textContent='שגיאה: '+String(e.message).slice(0,90); }
}

/* נפתח בשער, אלא אם כבר נפתח באותו לשונית */
(function(){
  let ok = false;
